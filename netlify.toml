[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Never cache game files — always fresh
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/configs/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hatch framework site — never cache
[[headers]]
  for = "/hatch/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
