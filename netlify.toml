[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Never cache game files — always fresh
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/configs/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hatch framework site — never cache
[[headers]]
  for = "/hatch/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Mission Control — never cache, so security updates land immediately
[[headers]]
  for = "/mission-control.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Home page — never cache, so new links and callouts show up right away
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security headers (site-wide)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Brand assets — allow cross-origin fetch (used by the merch shop)
[[headers]]
  for = "/brand/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/merch/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The Tribe was first published as The Hoard
[[redirects]]
  from = "/games/the-hoard.html"
  to = "/games/the-tribe.html"
  status = 301

# Recording Booth — the kids' voice booth. The server repeats the page's own lock:
# nothing on this page may connect to anything, so recordings cannot leave the device.
[[headers]]
  for = "/booth.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
