[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# ── FUNCTION ROUTING ──
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── EDGE FUNCTION — auth gate ──
[[edge_functions]]
  function = "auth-gate"
  path = "/mission-control.html"

[[edge_functions]]
  function = "auth-gate"
  path = "/games/dragon-scribe.html"

[[edge_functions]]
  function = "auth-gate"
  path = "/games/cannon-master.html"

# ── SECURITY HEADERS ──
[[headers]]
  for = "/mission-control.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/games/dragon-scribe.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/games/cannon-master.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
