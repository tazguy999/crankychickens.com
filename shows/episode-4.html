// ══ CC WATCH BEACON ══
// Leaves a breadcrumb the game reads to know what you actually watched.
// Same origin as games/cc7.html, so this needs no server and no network.
(function(){
  var SLUG='episode-4', EP=4, KEY='cc_watched';
  function rd(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
  function wr(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
  var all=rd();
  var rec=all[SLUG]||{ep:EP,firstSeen:Date.now(),plays:0,maxProgress:0,finished:false};
  rec.ep=EP;rec.plays++;rec.lastSeen=Date.now();
  all[SLUG]=rec;wr(all);
  window.ccMark=function(t,total){
    if(!total)return;
    var p=Math.max(0,Math.min(1,t/total));
    if(p<=rec.maxProgress+0.005)return;   // throttled
    rec.maxProgress=p;
    if(p>=0.97)rec.finished=true;
    var a=rd();a[SLUG]=rec;wr(a);
  };
})();
let voicesOn=true,lastSpokenLine=null;

// ══ VOICES ══
const VOICE_PROFILES={
  'SCRATCHY':{pitch:0.7,rate:0.95},
  'PEARL':{pitch:1.5,rate:1.15},
  'EL JAGUAR':{pitch:0.5,rate:0.85},
  'AUNT BARB':{pitch:1.2,rate:0.9},
  'LOU':{pitch:0.8,rate:0.85},
  'DR. SURGEON':{pitch:1.35,rate:0.85},
  'KING SQUIRRELINGTON':{pitch:0.8,rate:0.85},
  'NUT':{pitch:1.65,rate:1.28},
  'NARRATOR':{pitch:1.0,rate:0.92},
};
let voicePool=[];
function loadVoices(){voicePool=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.startsWith('en'));}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speakLine(who,text){
  if(!voicesOn||!('speechSynthesis' in window))return;
  if(who==='KEVIN'||who==='ARCHIE')return;
  let clean=text.replace(/\([^)]*\)/g,'').replace(/\*[^*]*\*/g,'').trim();
  if(!clean||clean==='...')return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);
  const prof=VOICE_PROFILES[who]||{pitch:1,rate:1};
  u.pitch=prof.pitch;u.rate=prof.rate;u.volume=0.9;
  if(voicePool.length>0){
    const idx=Math.abs(who.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0))%voicePool.length;
    u.voice=voicePool[idx];
  }
  speechSynthesis.speak(u);
}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();}

// ══ AUDIO ══
let AC=null,musicTimer=null,curMood=null,nextNoteTime=0,stepIdx=0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,v,tp,when){if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=tp;o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(f,when);g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(0.001,when+d);o.start(when);o.stop(when+d+0.02);}catch(e){}}
function sfx(n){if(muted)return;try{const a=ac(),t=a.currentTime;
  if(n==='bark'){tone(300,0.08,0.3,'square',t);tone(250,0.1,0.25,'square',t+0.1);}
  else if(n==='beam'){tone(200,0.6,0.2,'sine',t);tone(400,0.6,0.12,'sine',t);tone(800,0.5,0.06,'sine',t+0.1);}
  else if(n==='zap'){tone(900,0.15,0.3,'sawtooth',t);tone(400,0.25,0.2,'sawtooth',t+0.1);}
  else if(n==='hypno'){[0,0.15,0.3,0.45].forEach((tt,i)=>tone(500-i*60,0.2,0.15,'sine',t+tt));}
  else if(n==='alarm'){[0,0.25,0.5].forEach(tt=>{tone(700,0.18,0.22,'square',t+tt);tone(500,0.18,0.22,'square',t+tt+0.12);});}
  else if(n==='launch'){tone(80,1.4,0.4,'sawtooth',t);tone(60,1.6,0.3,'sawtooth',t+0.1);}
  else if(n==='cluck'){[0,0.12,0.24].forEach((tt,i)=>tone([420,380,440][i],0.09,0.22,'square',t+tt));}
  else if(n==='thunder'){const buf=a.createBuffer(1,a.sampleRate*0.6,a.sampleRate);const d2=buf.getChannelData(0);for(let i=0;i<d2.length;i++)d2[i]=(Math.random()*2-1)*Math.pow(1-i/d2.length,1.5)*0.4;const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;s.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.3,t);s.start(t);}
  else if(n==='pop'){tone(500,0.06,0.22,'square',t);}
  else if(n==='fanfare'){[0,0.14,0.28,0.42].forEach((tt,i)=>tone([392,494,587,784][i],0.22,0.2,'square',t+tt));}
}catch(e){}}
const MOODS={
  theme:{bpm:132,bass:[130,0,130,0,98,0,98,0],mel:[523,659,784,659,523,392,440,523]},
  calm:{bpm:84,bass:[98,0,0,0,110,0,0,0],mel:[392,0,440,0,523,0,440,0]},
  spooky:{bpm:92,bass:[73,0,69,0,73,0,65,0],mel:[0,294,0,277,0,294,0,262]},
  villain:{bpm:104,bass:[65,65,0,65,61,61,0,61],mel:[262,0,311,262,0,247,0,233]},
  adventure:{bpm:120,bass:[110,110,0,110,98,98,0,98],mel:[440,0,523,587,523,0,440,392]},
  hypno:{bpm:76,bass:[87,0,0,82,0,0,87,0],mel:[349,330,311,330,349,370,349,330]},
  heart:{bpm:88,bass:[130,0,110,0,98,0,110,0],mel:[523,587,659,0,587,523,440,0]},
  none:null,
};
function setMood(m){
  if(m===curMood)return;curMood=m;stepIdx=0;
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
  if(!m||m==='none'||!MOODS[m])return;
  const mood=MOODS[m];nextNoteTime=ac().currentTime+0.05;
  const stepDur=60/mood.bpm/2;
  musicTimer=setInterval(()=>{
    if(muted||!playing)return;
    const a=ac();
    while(nextNoteTime<a.currentTime+0.15){
      const b=mood.bass[stepIdx%8],ml=mood.mel[stepIdx%8];
      if(b)tone(b,stepDur*0.85,0.09,'triangle',nextNoteTime);
      if(ml)tone(ml,stepDur*0.6,0.05,'square',nextNoteTime);
      nextNoteTime+=stepDur;stepIdx++;
    }
  },60);
}

let fr_g=0;
// ══ SPRITES (Episode 1 cast) ══

  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(-1,-26,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,-26,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#cc2200';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-6,-31);ctx.lineTo(1,-29);ctx.stroke();ctx.beginPath();ctx.moveTo(3,-29);ctx.lineTo(10,-31);ctx.stroke();
  const bo=talk?Math.abs(Math.sin(fr*0.35))*3:0;

  ctx.restore();
}

function dJaguar(x,y,fr,fc=1,talk=false){

// ══ EPISODE 4 CAST & PROPS ══
function dLou(x,y,fr,fc=1,talk=false){

function wrapText(text,max){
  const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{if((cur+' '+w).trim().length>max){lines.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
function bubble(x,y,who,text){
  const lines=wrapText(text,26);
  ctx.font=`12px ${FF}`;
  let mw=0;lines.forEach(l=>{mw=Math.max(mw,ctx.measureText(l).width);});
  const bw=Math.max(mw+24,70),bh=lines.length*16+26;
  let bx=x-bw/2;bx=Math.max(8,Math.min(W-bw-8,bx));
  let by=y-bh-56;if(by<6)by=6;
  ctx.fillStyle='rgba(255,255,255,0.96)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.96)';
  ctx.beginPath();ctx.moveTo(x-7,by+bh-1);ctx.lineTo(x,by+bh+10);ctx.lineTo(x+7,by+bh-1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#cc5500';ctx.font=`bold 9px ${FF}`;ctx.textAlign='left';
  ctx.fillText(who,bx+12,by+14);
  ctx.fillStyle='#1a1a2e';ctx.font=`12px ${FF}`;
  lines.forEach((l,i)=>ctx.fillText(l,bx+12,by+30+i*16));
}

function drawCast(cast,lt,talkWho){
  (cast||[]).forEach(a=>{
    let x=a.x,y=a.y===undefined?GY:a.y;
    if(a.move){const p=Math.max(0,Math.min(1,(lt-a.move.t0)/(a.move.t1-a.move.t0)));x=a.x+(a.move.x1-a.x)*p;if(a.move.y1!==undefined)y=y+(a.move.y1-y)*p;}
    const walking=a.move&&lt>=a.move.t0&&lt<=a.move.t1;

    const fn=DRAW[a.who];
    if(fn===dChicken||fn===dHen)fn(x,y,fr_g,a.fc||1,talk,walking||a.hypnoWalk);

let acc=0;SC.forEach(s=>{s.start=acc;acc+=s.dur;});
const TOTAL=acc;
let curSceneIdx=0;

// ══ RENDER ══
function render(){
  fr_g++;
  let sc=SC[SC.length-1];curSceneIdx=SC.length-1;
  for(let i=0;i<SC.length;i++){const s=SC[i];if(T>=s.start&&T<s.start+s.dur){sc=s;curSceneIdx=i;break;}}
  const lt=T-sc.start;
  if(sc.music!==undefined)setMood(playing?sc.music:curMood);
  ctx.clearRect(0,0,W,H);
  if(sc.fx){sc.fx(lt);}
  else if(sc.bg){BGS[sc.bg]();}
  if(sc.extra)sc.extra(lt);
  const line=activeLine(sc.lines,lt);
  if(playing&&line&&line!==lastSpokenLine){lastSpokenLine=line;speakLine(line.who,line.text);}
  if(!line)lastSpokenLine=null;
  const talkWho=line&&line.who!=='NARRATOR'?({'SCRATCHY':'scratchy','PEARL':'pearl','EL JAGUAR':'jaguar','AUNT BARB':'barb','KING SQUIRRELINGTON':'king','NUT':'nut','KEVIN':'kevin'}[line.who]||null):null;
  if(sc.cast)drawCast(sc.cast,lt,talkWho);
  if(line){
    if(line.who==='NARRATOR')narrate(line.text);
    else{
      let ax=W/2,ay=GY;
      (sc.cast||[]).forEach(a=>{if(a.who===talkWho){ax=a._x||a.x;ay=a._y||GY;}});
      bubble(ax,ay,line.who,line.text);
    }
  }
  (sc.events||[]).forEach(ev=>{
    if(!ev._fired&&lt>=ev.t&&lt<ev.t+0.5&&playing){ev._fired=true;sfx(ev.sfx);}
    if(lt<ev.t)ev._fired=false;
  });
  updateUI();
}
function fmtTime(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+String(ss).padStart(2,'0');}
function updateUI(){
  document.getElementById('seekFill').style.width=(T/TOTAL*100)+'%';
  document.getElementById('timeLbl').textContent=fmtTime(T)+' / '+fmtTime(TOTAL);
}
function loop(ts){
  if(window.ccMark)ccMark(T,TOTAL);
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.1,(ts-lastTs)/1000);
  lastTs=ts;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;playing=false;document.getElementById('playBtn').textContent='↻ REPLAY';setMood('none');stopSpeech();}}
  render();
  requestAnimationFrame(loop);
}

// ══ CONTROLS ══
document.getElementById('playBtn').addEventListener('click',()=>{
  ac();
  if(T>=TOTAL){T=0;}
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ PAUSE':'▶ PLAY';
  if(!playing){setMood('none');stopSpeech();}
});
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
});
document.getElementById('voiceBtn').addEventListener('click',()=>{
  voicesOn=!voicesOn;
  document.getElementById('voiceBtn').textContent=voicesOn?'🗣 VOICES: ON':'🗣 VOICES: OFF';
  if(!voicesOn)stopSpeech();
});
const seekWrap=document.getElementById('seekWrap');
function seekTo(clientX){
  const r=seekWrap.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  T=p*TOTAL;stopSpeech();lastSpokenLine=null;
  SC.forEach(s=>{(s.events||[]).forEach(ev=>ev._fired=T-s.start>ev.t);});
}
seekWrap.addEventListener('click',e=>seekTo(e.clientX));
seekWrap.addEventListener('touchstart',e=>{e.preventDefault();seekTo(e.touches[0].clientX);},{passive:false});
document.querySelectorAll('#chapters button').forEach(b=>{
  b.addEventListener('click',()=>{T=parseFloat(b.dataset.t);stopSpeech();lastSpokenLine=null;SC.forEach(s=>{(s.events||[]).forEach(ev=>ev._fired=T-s.start>ev.t);});if(!playing){playing=true;ac();document.getElementById('playBtn').textContent='⏸ PAUSE';}});
});

function b64ToU8(s){const p='='.repeat((4-s.length%4)%4);const b=(s+p).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function subscribePush(){
  const btn=document.getElementById('notifyBtn');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    btn.textContent='🔔 Not supported here — try Chrome, or Add to Home Screen on iPad';return;
  }
  try{
    const reg=await navigator.serviceWorker.register('/sw.js');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){btn.textContent='🔔 Blocked — allow notifications in settings';return;}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    await fetch('/.netlify/functions/github-proxy',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'push_subscribe',sub:sub.toJSON()})});
    localStorage.setItem('cc_push','1');
    btn.textContent='🔔 ON — you will get new episode alerts!';
    btn.style.borderColor='rgba(120,255,120,0.8)';
  }catch(e){btn.textContent='🔔 Could not subscribe: '+e.message.slice(0,40);}
}
document.getElementById('notifyBtn').addEventListener('click',subscribePush);
if(localStorage.getItem('cc_push')==='1'){
  const btn=document.getElementById('notifyBtn');
  btn.textContent='🔔 ON — you will get new episode alerts!';
  btn.style.borderColor='rgba(120,255,120,0.8)';
}
