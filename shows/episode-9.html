// Leaves a breadcrumb the game reads to know what you actually watched.
// Same origin as games/cc7.html, so this needs no server and no network.
(function(){
  var SLUG='episode-9', EP=9, KEY='cc_watched';
  function rd(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
  function wr(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
  var all=rd();
  var rec=all[SLUG]||{ep:EP,firstSeen:Date.now(),plays:0,maxProgress:0,finished:false};
  rec.ep=EP;rec.plays++;rec.lastSeen=Date.now();
  all[SLUG]=rec;wr(all);
  window.ccMark=function(t,total){
    if(!total)return;
    var p=Math.max(0,Math.min(1,t/total));
    if(p<=rec.maxProgress+0.005)return;   // throttled
    rec.maxProgress=p;
    if(p>=0.97)rec.finished=true;
    var a=rd();a[SLUG]=rec;wr(a);
  };
})();

const VOICE_PROFILES={
  'SCRATCHY':{pitch:0.7,rate:0.95},

  'EL JAGUAR':{pitch:0.5,rate:0.85},

let voicePool=[];
function loadVoices(){voicePool=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.startsWith('en'));}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speakLine(who,text){
  if(!voicesOn||!('speechSynthesis' in window))return;
  if(who==='KEVIN')return;
  let clean=text.replace(/\([^)]*\)/g,'').replace(/\*[^*]*\*/g,'').trim();
  if(!clean||clean==='...')return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);
  const prof=VOICE_PROFILES[who]||{pitch:1,rate:1};
  u.pitch=prof.pitch;u.rate=prof.rate;u.volume=0.9;
  if(voicePool.length>0){
    const idx=Math.abs(who.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0))%voicePool.length;
    u.voice=voicePool[idx];
  }
  speechSynthesis.speak(u);
}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();}

  else if(n==='hypno'){[0,0.15,0.3,0.45].forEach((tt,i)=>tone(500-i*60,0.2,0.15,'sine',t+tt));}
  else if(n==='alarm'){[0,0.25,0.5].forEach(tt=>{tone(700,0.18,0.22,'square',t+tt);tone(500,0.18,0.22,'square',t+tt+0.12);});}
  else if(n==='launch'){tone(80,1.4,0.4,'sawtooth',t);tone(60,1.6,0.3,'sawtooth',t+0.1);}
  else if(n==='cluck'){[0,0.12,0.24].forEach((tt,i)=>tone([420,380,440][i],0.09,0.22,'square',t+tt));}
  else if(n==='thunder'){const buf=a.createBuffer(1,a.sampleRate*0.6,a.sampleRate);const d2=buf.getChannelData(0);for(let i=0;i<d2.length;i++)d2[i]=(Math.random()*2-1)*Math.pow(1-i/d2.length,1.5)*0.4;const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;s.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.3,t);s.start(t);}
  else if(n==='pop'){tone(500,0.06,0.22,'square',t);}
  else if(n==='fanfare'){[0,0.14,0.28,0.42].forEach((tt,i)=>tone([392,494,587,784][i],0.22,0.2,'square',t+tt));}

function setMood(m){
  if(m===curMood)return;curMood=m;stepIdx=0;
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
  if(!m||m==='none'||!MOODS[m])return;
  const mood=MOODS[m];nextNoteTime=ac().currentTime+0.05;
  const stepDur=60/mood.bpm/2;
  musicTimer=setInterval(()=>{
    if(muted||!playing)return;
    const a=ac();
    while(nextNoteTime<a.currentTime+0.15){
      const b=mood.bass[stepIdx%8],ml=mood.mel[stepIdx%8];

function wrapText(text,max){
  const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{if((cur+' '+w).trim().length>max){lines.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
function bubble(x,y,who,text){
  const lines=wrapText(text,26);
  ctx.font=`12px ${FF}`;
  let mw=0;lines.forEach(l=>{mw=Math.max(mw,ctx.measureText(l).width);});
  const bw=Math.max(mw+24,70),bh=lines.length*16+26;
  let bx=x-bw/2;bx=Math.max(8,Math.min(W-bw-8,bx));
  let by=y-bh-56;if(by<6)by=6;
  ctx.fillStyle='rgba(255,255,255,0.96)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.96)';
  ctx.beginPath();ctx.moveTo(x-7,by+bh-1);ctx.lineTo(x,by+bh+10);ctx.lineTo(x+7,by+bh-1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#cc5500';ctx.font=`bold 9px ${FF}`;ctx.textAlign='left';
  ctx.fillText(who,bx+12,by+14);
  ctx.fillStyle='#1a1a2e';ctx.font=`12px ${FF}`;
  lines.forEach((l,i)=>ctx.fillText(l,bx+12,by+30+i*16));
}
function narrate(text){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,42);ctx.fillRect(0,H-42,W,42);
  ctx.fillStyle='rgba(255,230,180,0.92)';ctx.font=`15px ${FF}`;ctx.textAlign='center';
  ctx.fillText(text,W/2,H-16);ctx.textAlign='left';
}

function drawCast(cast,lt,talkWho){
  (cast||[]).forEach(a=>{
    let x=a.x,y=a.y===undefined?GY:a.y;
    if(a.move){const p=Math.max(0,Math.min(1,(lt-a.move.t0)/(a.move.t1-a.move.t0)));x=a.x+(a.move.x1-a.x)*p;if(a.move.y1!==undefined)y=y+(a.move.y1-y)*p;}
    const walking=a.move&&lt>=a.move.t0&&lt<=a.move.t1;
    const talk=talkWho===a.who;
    const fn=DRAW[a.who];
    if(fn===dChicken||fn===dHen)fn(x,y,fr_g,a.fc||1,talk,walking||a.hypnoWalk);
    else if(fn===dKevin)fn(x,y,fr_g,a.fc||1,a.excited||walking);
    else if(fn)fn(x,y,fr_g,a.fc||1,talk);
    if(a.hypno)drawHypnoSpiral(x,(y||GY)+(HEAD_Y[a.who]||-24),fr_g,0.9);
    a._x=x;a._y=y;
  });
}

  const CREDITS=['INVASION OF THE CORN SNATCHERS','','Story by: The Writers Room','(ages 8 and 11)','','Starring:','SCRATCHY as The Unhypnotizable','PEARL as The Briefly Squirrel-Pilled','KING SQUIRRELINGTON as Himself','NUT as Long-Suffering Middle Management','KEVIN as The Immune','EL JAGUAR as Perimeter Security (self-described)','AUNT BARB as The Space Division','','HYPNO-RAY 3000 provided by','Cannon Master Armaments','','Squirrel food-storage consulting:','Scratchy (rows, LABELS, a COUNT)','','Acorns located: 312 of 40,000','The search continues.','','No chickens were permanently hypnotized.','The throne remains load-bearing.','','CRANKY CHICKENS WILL RETURN'];
  const scroll=lt*22-H;
  ctx.textAlign='center';
  CREDITS.forEach((line,i)=>{
    const y=H-scroll+i*28;
    if(y>-30&&y<H+30){
      ctx.fillStyle=i===0?'#ffcc02':line.startsWith('CRANKY CHICKENS WILL')?'#ffcc02':'rgba(255,255,255,0.75)';
      ctx.font=i===0||line.startsWith('CRANKY')?`bold 18px ${FF}`:`13px ${FF}`;
      ctx.fillText(line,W/2,y);
    }
  });
  ctx.textAlign='left';
  const cx=((lt*30)%(W+150))-75;
  dSquirrelShip(cx,370,fr_g,0.45);
}
function fxEgg(lt){
  ctx.fillStyle='#050008';ctx.fillRect(0,0,W,H);drawStars(0.8);
  const eg=0.35+Math.sin(lt*2.5)*0.22;
  const grd=ctx.createRadialGradient(W/2,H/2+10,8,W/2,H/2+10,100);
  grd.addColorStop(0,`rgba(220,160,50,${eg*0.5})`);grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#221133';ctx.fillRect(W/2-35,H/2+18,70,35);ctx.fillRect(W/2-44,H/2+15,88,10);
  ctx.fillStyle='#f0e0c0';ctx.beginPath();ctx.ellipse(W/2,H/2-5,26,33,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=`rgba(255,200,50,${eg*1.2})`;ctx.lineWidth=2+eg*4;
  ctx.beginPath();ctx.ellipse(W/2,H/2-5,26,33,0,0,Math.PI*2);ctx.stroke();
  // NEW: glowing crack
  ctx.strokeStyle=`rgba(255,240,150,${0.5+eg*0.5})`;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2-8,H/2-20);ctx.lineTo(W/2-2,H/2-8);ctx.lineTo(W/2-7,H/2+4);ctx.lineTo(W/2-1,H/2+14);ctx.stroke();
  if(lt>9){
    ctx.globalAlpha=Math.min(1,(lt-9)/2);
    ctx.fillStyle='#ffcc02';ctx.font=`bold 26px ${FF}`;ctx.textAlign='center';
    ctx.shadowColor='#ff6600';ctx.shadowBlur=15;ctx.fillText('SOON.',W/2,H*0.82);ctx.shadowBlur=0;
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}
const _sfxFired={};
function sfxOnce(name,t,lt){
  const k=name+'_'+curSceneIdx;
  if(lt>=t&&lt<t+0.5&&!_sfxFired[k]&&playing){_sfxFired[k]=true;sfx(name);}
  if(lt<t)_sfxFired[k]=false;
}

const IMG={};Object.keys(SPR).forEach(k=>{const im=new Image();im.src=SPR[k][2];IMG[k]=im;});
function dSprite(key,x,y,h,fc=1,bob=0,rot=0){
  const im=IMG[key];if(!im||!im.complete)return;
  const w=im.naturalWidth*(h/im.naturalHeight);
  ctx.save();ctx.translate(x,y-bob);if(fc<0)ctx.scale(-1,1);ctx.rotate(rot);
  ctx.globalAlpha=0.18;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,bob+2,w*0.42,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
let charlieMode='plain'; // 'plain' | 'scope' | 'wolf'
function dCharlie(x,y,fr,fc=1,talk=false){
  const bob=Math.sin(fr*0.06)*2+(talk?Math.abs(Math.sin(fr*0.3))*2:0);
  const rot=Math.sin(fr*0.045)*0.015; // crayon wobble
  if(charlieMode==='wolf'){dSprite('summer',x,y,54,fc,bob,rot);
    // rainbow howl rings
    for(let k=0;k<3;k++){const r=30+((fr_g*3+k*50)%160);ctx.globalAlpha=Math.max(0,1-r/190);ctx.strokeStyle=['#ff4d6d','#ffd23d','#4fd1ff'][k];ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+fc*34,y-40,r,-0.7,0.7);ctx.stroke();}
    ctx.globalAlpha=1;return;}
  dSprite(charlieMode==='scope'?'charlieS':'charlie',x,y,118,fc,bob,rot);
}
function dGraydorn(x,y,fr,fc=1,talk=false){dSprite('graydorn',x,y,92,fc,Math.sin(fr*0.08)*2.5+(talk?2:0),Math.sin(fr*0.05)*0.02);}
function dSummer(x,y,fr,fc=1,talk=false){dSprite('summer',x,y,50,fc,Math.sin(fr*0.07)*1.5);}
function dStrawberry(x,y,fr,fc=1,talk=false){dSprite('strawberry',x,y,46,fc,Math.sin(fr*0.09+1)*1.5);}
function dCinnamon(x,y,fr,fc=1,talk=false){dSprite('cinnamon',x,y,46,fc,Math.sin(fr*0.08+2)*1.5);}

// ── props ──
function banner(x,y,w,text){
  ctx.strokeStyle='#8a5a3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w/2,y+18,x+w,y);ctx.stroke();
  const n=text.length;for(let i=0;i<n;i++){const p=(i+0.5)/n;const px=x+w*p,py=y+18*4*p*(1-p)+6;
    ctx.fillStyle=['#ff4d6d','#ffd23d','#4fd1ff','#8a5bd6','#4fa33a'][i%5];ctx.beginPath();ctx.moveTo(px-9,py-6);ctx.lineTo(px+9,py-6);ctx.lineTo(px+9,py+8);ctx.lineTo(px,py+14);ctx.lineTo(px-9,py+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 11px ${FF}`;ctx.textAlign='center';ctx.fillText(text[i],px,py+6);}
  ctx.textAlign='left';
}
function balloon(x,y,col,fr){const by=y+Math.sin(fr*0.05+x)*4;ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,by+16);ctx.quadraticCurveTo(x+4,by+40,x-2,by+60);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,by,12,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(x-4,by-5,3,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-3,by+15);ctx.lineTo(x+3,by+15);ctx.lineTo(x,by+19);ctx.fill();}
function juiceStack(x,y){for(let r=0;r<4;r++)for(let c=0;c<6-r;c++){const jx=x+c*12+r*6,jy=y-r*15;ctx.fillStyle=['#ff6688','#ffcc02','#4fd1ff'][(r+c)%3];ctx.fillRect(jx,jy-14,10,14);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(jx+5,jy-14);ctx.lineTo(jx+7,jy-19);ctx.stroke();}}
function confetti(fr,a=1){for(let i=0;i<60;i++){const x=(i*97+fr*(1+i%3))%W,y=(i*53+fr*(1.5+i%2))%H;ctx.globalAlpha=0.8*a;ctx.fillStyle=['#ff4d6d','#ffd23d','#4fd1ff','#8a5bd6','#4fa33a','#fff'][i%6];ctx.save();ctx.translate(x,y);ctx.rotate(fr*0.05+i);ctx.fillRect(-3,-2,6,4);ctx.restore();}ctx.globalAlpha=1;}
// The portal: a wobbly crayon tear in the sky with Graydorn's World showing through
function portal(x,y,r,fr){
  if(r<=0)return;
  ctx.save();ctx.beginPath();for(let i=0;i<=40;i++){const a=i/40*Math.PI*2;const rr=r*(1+Math.sin(a*5+fr*0.08)*0.06);const px=x+Math.cos(a)*rr*0.75,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();
  ctx.fillStyle='#bfe3ff';ctx.fill();ctx.clip();
  // crayon world inside: sky, hills, a tiny house
  ctx.fillStyle='#9ad0ff';ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.fillStyle='#7fd36b';ctx.beginPath();ctx.ellipse(x-r*0.3,y+r*0.75,r*0.9,r*0.45,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4fa33a';ctx.beginPath();ctx.ellipse(x+r*0.5,y+r*0.85,r*0.8,r*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f6e7b2';ctx.fillRect(x-r*0.2,y+r*0.1,r*0.4,r*0.35);ctx.fillStyle='#e0384f';ctx.beginPath();ctx.moveTo(x-r*0.28,y+r*0.1);ctx.lineTo(x,y-r*0.2);ctx.lineTo(x+r*0.28,y+r*0.1);ctx.fill();
  ctx.fillStyle='#fff';[[x-r*0.5,y-r*0.5],[x+r*0.4,y-r*0.6]].forEach(([cx,cy])=>{ctx.beginPath();ctx.ellipse(cx,cy,r*0.22,r*0.1,0,0,Math.PI*2);ctx.fill();});
  ctx.restore();
  // crayon rim
  ctx.save();ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='#8a5bd6';ctx.beginPath();for(let i=0;i<=40;i++){const a=i/40*Math.PI*2;const rr=r*(1+Math.sin(a*5+fr*0.08)*0.06);const px=x+Math.cos(a)*rr*0.75,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.stroke();
  ctx.strokeStyle='#ffd23d';ctx.lineWidth=2;ctx.globalAlpha=0.7+Math.sin(fr*0.2)*0.3;ctx.stroke();ctx.restore();ctx.globalAlpha=1;
  // sparkles
  for(let k=0;k<6;k++){const a=fr*0.03+k*1.05;const sx=x+Math.cos(a)*r*0.85,sy=y+Math.sin(a)*r*1.05;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,2,0,Math.PI*2);ctx.fill();}
}
function cake(x,y,lit,fr){
  ctx.fillStyle='#8a5a3a';ctx.fillRect(x-40,y-20,80,20);ctx.fillStyle='#ff9ecb';ctx.fillRect(x-40,y-26,80,8);ctx.fillStyle='#fff';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(x-35+i*10,y-24,4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#ffd23d';ctx.fillRect(x-30,y-42,60,16);ctx.fillStyle='#ff9ecb';ctx.fillRect(x-30,y-46,60,6);
  for(let i=0;i<11;i++){const cx=x-27+i*5.4,cy=y-46;ctx.fillStyle=['#ff4d6d','#4fd1ff','#8a5bd6'][i%3];ctx.fillRect(cx-1.2,cy-12,2.4,12);
    if(lit){ctx.fillStyle='#ffb020';ctx.beginPath();ctx.ellipse(cx,cy-16+Math.sin(fr*0.3+i)*1,2,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff6d6';ctx.beginPath();ctx.ellipse(cx,cy-15,0.8,2,0,0,Math.PI*2);ctx.fill();}
    else if(fr%40<20){ctx.strokeStyle='rgba(200,200,200,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy-12);ctx.quadraticCurveTo(cx+3,cy-20,cx,cy-28);ctx.stroke();}}
  ctx.fillStyle='#1a1a2e';ctx.font=`bold 10px ${FF}`;ctx.textAlign='center';ctx.fillText('11',x,y-31);ctx.textAlign='left';
}
function boombox(x,y,text){ctx.fillStyle='#333';ctx.fillRect(x,y-30,90,30);ctx.fillStyle='#111';[x+14,x+76].forEach(sx=>{ctx.beginPath();ctx.arc(sx,y-15,10,0,Math.PI*2);ctx.fill();});

let acc=0;SC.forEach(s=>{s.start=acc;acc+=s.dur;});
const TOTAL=acc;
let curSceneIdx=0;

// ══ RENDER ══
function render(){
  fr_g++;
  let sc=SC[SC.length-1];curSceneIdx=SC.length-1;
  for(let i=0;i<SC.length;i++){const s=SC[i];if(T>=s.start&&T<s.start+s.dur){sc=s;curSceneIdx=i;break;}}
  const lt=T-sc.start;
  if(sc.music!==undefined)setMood(playing?sc.music:curMood);
  ctx.clearRect(0,0,W,H);
  if(sc.fx){sc.fx(lt);}
  else if(sc.bg){BGS[sc.bg]();}
  if(sc.extra)sc.extra(lt);
  const line=activeLine(sc.lines,lt);
  if(playing&&line&&line!==lastSpokenLine){lastSpokenLine=line;speakLine(line.who,line.text);}
  if(!line)lastSpokenLine=null;
  const talkWho=line&&line.who!=='NARRATOR'?({'SCRATCHY':'scratchy','PEARL':'pearl','EL JAGUAR':'jaguar','AUNT BARB':'barb','KING SQUIRRELINGTON':'king','NUT':'nut','KEVIN':'kevin','CHARLIESCOPE':'charlie','GRAYDORN':'graydorn'}[line.who]||null):null;
  if(sc.cast)drawCast(sc.cast,lt,talkWho);
  if(sc.over)sc.over(lt);
  if(line){
    if(line.who==='NARRATOR')narrate(line.text);
    else{
      let ax=W/2,ay=GY;
      (sc.cast||[]).forEach(a=>{if(a.who===talkWho){ax=a._x||a.x;ay=a._y||GY;}});
      bubble(ax,ay,line.who,line.text);
    }
  }
  (sc.events||[]).forEach(ev=>{
    if(!ev._fired&&lt>=ev.t&&lt<ev.t+0.5&&playing){ev._fired=true;sfx(ev.sfx);}
    if(lt<ev.t)ev._fired=false;
  });
  updateUI();
}
function fmtTime(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+String(ss).padStart(2,'0');}
function updateUI(){
  document.getElementById('seekFill').style.width=(T/TOTAL*100)+'%';
  document.getElementById('timeLbl').textContent=fmtTime(T)+' / '+fmtTime(TOTAL);
}
function loop(ts){
  if(window.ccMark)ccMark(T,TOTAL);
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.1,(ts-lastTs)/1000);
  lastTs=ts;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;playing=false;document.getElementById('playBtn').textContent='↻ REPLAY';setMood('none');stopSpeech();}}
  render();
  requestAnimationFrame(loop);
}

// ══ CONTROLS ══
document.getElementById('playBtn').addEventListener('click',()=>{
  ac();
  if(T>=TOTAL){T=0;}
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ PAUSE':'▶ PLAY';
  if(!playing){setMood('none');stopSpeech();}
});
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
});
document.getElementById('voiceBtn').addEventListener('click',()=>{
  voicesOn=!voicesOn;
  document.getElementById('voiceBtn').textContent=voicesOn?'🗣 VOICES: ON':'🗣 VOICES: OFF';
  if(!voicesOn)stopSpeech();
});
const seekWrap=document.getElementById('seekWrap');
function seekTo(clientX){
  const r=seekWrap.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  T=p*TOTAL;stopSpeech();lastSpokenLine=null;
  SC.forEach(s=>{(s.events||[]).forEach(ev=>ev._fired=T-s.start>ev.t);});
}
seekWrap.addEventListener('click',e=>seekTo(e.clientX));
seekWrap.addEventListener('touchstart',e=>{e.preventDefault();seekTo(e.touches[0].clientX);},{passive:false});
(function(){
  const ch=document.getElementById('chapters');
  for(let i=0;i<4;i++){
    const b=document.createElement('button');
    b.dataset.t=Math.floor(TOTAL*i/4);
    b.textContent='Part '+(i+1);
    ch.appendChild(b);
  }
})();
document.querySelectorAll('#chapters button').forEach(b=>{
  b.addEventListener('click',()=>{T=parseFloat(b.dataset.t);stopSpeech();lastSpokenLine=null;SC.forEach(s=>{(s.events||[]).forEach(ev=>ev._fired=T-s.start>ev.t);});if(!playing){playing=true;ac();document.getElementById('playBtn').textContent='⏸ PAUSE';}});
});

function b64ToU8(s){const p='='.repeat((4-s.length%4)%4);const b=(s+p).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function subscribePush(){
  const btn=document.getElementById('notifyBtn');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    btn.textContent='🔔 Not supported here — try Chrome, or Add to Home Screen on iPad';return;
  }
  try{
    const reg=await navigator.serviceWorker.register('/sw.js');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){btn.textContent='🔔 Blocked — allow notifications in settings';return;}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    await fetch('/.netlify/functions/github-proxy',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'push_subscribe',sub:sub.toJSON()})});
    localStorage.setItem('cc_push','1');
    btn.textContent='🔔 ON — you will get new episode alerts!';
    btn.style.borderColor='rgba(120,255,120,0.8)';
  }catch(e){btn.textContent='🔔 Could not subscribe: '+e.message.slice(0,40);}
}
document.getElementById('notifyBtn').addEventListener('click',subscribePush);
if(localStorage.getItem('cc_push')==='1'){
  const btn=document.getElementById('notifyBtn');
  btn.textContent='🔔 ON — you will get new episode alerts!';
  btn.style.borderColor='rgba(120,255,120,0.8)';
}

requestAnimationFrame(loop);
</script>
<script src="/support.js" defer></script>
</body>
</html>
