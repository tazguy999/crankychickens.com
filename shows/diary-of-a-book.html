<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diary of a Book: Bro Meets Cranky Chickens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#2a1d14; --desk2:#3a2a1c; --paper:#fbf6e4; --rule:#b9d3ea; --margin:#e79a9a;
    --ink:#3b3b40; --gold:#f4b942; --gold-ink:#3a2500; --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE","Comic Neue",system-ui,sans-serif;
    --w:320px; --u:3.2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 20%, var(--desk2), var(--desk));
    color:#f6ead6; font-family:var(--hand); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:10px 8px; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .book{position:relative; width:var(--w); aspect-ratio:900/1137; perspective:2200px; flex:none; cursor:pointer}
  .book::before{ /* page-stack edge */
    content:""; position:absolute; inset:1.2% -1.4% -1.4% 1.2%; background:#e9e1c8; border-radius:4px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .leaf{
    position:absolute; inset:0; background:var(--paper); border-radius:3px 6px 6px 3px; overflow:hidden;
    transform-origin:left center; transition:transform .7s cubic-bezier(.4,.1,.3,1);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.28);
  }
  .leaf.turned{transform:rotateY(-180deg); pointer-events:none}
  .leaf.cover{background:#fdfaf0}
  .leaf.cover img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply}
  .leaf.cover::after{ /* soft spine shadow, nothing covering the title */
    content:""; position:absolute; left:0; top:0; bottom:0; width:3%;
    background:linear-gradient(90deg,rgba(0,0,0,.16),transparent);
  }
  .page{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:calc(var(--u)*7.2) calc(var(--u)*6) calc(var(--u)*5) calc(var(--u)*13);
    color:var(--ink); font-size:calc(var(--u)*5.3); line-height:calc(var(--u)*7.2);
    background:
      linear-gradient(90deg,transparent calc(var(--u)*10),var(--margin) calc(var(--u)*10),var(--margin) calc(var(--u)*10.4),transparent calc(var(--u)*10.4)),
      repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--u)*7.2 - 1px),var(--rule) calc(var(--u)*7.2 - 1px),var(--rule) calc(var(--u)*7.2));
    background-position:0 0, 0 calc(var(--u)*-1.2);
  }
  .page h2{margin:0; font-size:calc(var(--u)*6.6); line-height:calc(var(--u)*7.2); font-weight:400; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px}
  .page p{margin:0}
  .page p.gap{margin-top:calc(var(--u)*7.2)}
  .page .li{padding-left:calc(var(--u)*4)}
  .page .d b{font-weight:400; text-decoration:underline; text-decoration-thickness:1px}
  .page .big{font-size:calc(var(--u)*13); line-height:calc(var(--u)*14.4); text-align:center}
  .page .c{text-align:center}
  .doodle{flex:1 1 0; min-height:0; margin-top:calc(var(--u)*2)}
  .doodle svg{width:100%; height:100%; display:block; overflow:visible}
  .doodle svg *{vector-effect:none}
  .doodle .k{fill:none; stroke:#4c4c52; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  .doodle .k .f{fill:#4c4c52; stroke:none}
  .doodle .k .w{fill:var(--paper)}
  .doodle text{font-family:var(--hand); font-size:9px; fill:#4c4c52; stroke:none}
  .pgnum{position:absolute; right:calc(var(--u)*5); bottom:calc(var(--u)*2); font-size:calc(var(--u)*4); color:#8a8577}

  .bar{display:flex; align-items:center; justify-content:center; gap:8px; width:min(var(--w),100%); flex:none}
  .bar button{
    font:inherit; font-size:clamp(18px,2.6vw,24px); min-height:clamp(48px,7vw,62px); min-width:clamp(56px,8vw,76px); padding:6px 14px; border-radius:14px;
    border:2px solid #1c1208; background:var(--gold); color:var(--gold-ink); cursor:pointer;
    box-shadow:0 3px 0 #1c1208;
  }
  .bar button:active{transform:translateY(2px); box-shadow:0 1px 0 #1c1208}
  .bar button:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .bar button[disabled]{opacity:.35; cursor:default}
  .bar button.ghost{background:#5a4330; color:#f6ead6}
  .bar button.ghost[aria-pressed="true"]{background:#7fd1a0; color:#0f2a1a}
  .bar .where{flex:1; text-align:center; font-size:clamp(17px,2.4vw,22px); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #homeLink{color:rgba(255,255,255,.45);font-size:13px;text-decoration:none;font-family:system-ui,sans-serif;padding:2px 8px;flex:none}
  #homeLink:hover{color:rgba(255,255,255,.8)}
  @media (prefers-reduced-motion:reduce){ .leaf{transition:none} }
</style>
<style id="cc-colors">
  /* cc-colors: cover. The kid's pencil lines sit on brand-colored paper; nothing is drawn over them. */
  .leaf.cover{background:linear-gradient(180deg,#ffcc02 0%,#ffe14d 20%,#fff4c8 48%,#ffe0a8 76%,#ff9f1c 100%)}
  .leaf.cover img{mix-blend-mode:normal}  /* covers are painted images with see-through paper */
  .leaf.cover::before{content:""; position:absolute; inset:0; border:calc(var(--u)*1.6) solid #cc2200; border-radius:3px 6px 6px 3px; pointer-events:none; z-index:2}
</style>
</head>
<body>
  <div class="book" id="book" aria-live="polite"></div>
  <div class="bar">
    <button id="prev" aria-label="Previous page">&#9664;</button>
    <button id="read" class="ghost" aria-pressed="false" hidden>&#128266; Read to me</button>
    <div class="where" id="where">Tap to open</div>
    <button id="next" aria-label="Next page">&#9654;</button>
  </div>
  <a id="homeLink" href="/">&larr; back to crankychickens.com</a>

  function spiral(cx,cy,r){
    var d='', turns=2.6, n=90;
    for(var i=0;i<=n;i++){
      var t=i/n, a=t*turns*Math.PI*2+1.2, rr=1.5+(r-1.5)*Math.pow(t,0.85);
      d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr*0.86).toFixed(1)+' ';
    }
    return '<path d="'+d+'"/><circle cx="'+cx+'" cy="'+cy+'" r="1.6"/>';
  }
  function arrow(x1,y1,x2,y2){
    var a=Math.atan2(y2-y1,x2-x1), h=4;
    return '<path d="M'+x1+','+y1+' L'+x2+','+y2+' M'+x2+','+y2+' l'+(-h*Math.cos(a-0.5)).toFixed(1)+','+(-h*Math.sin(a-0.5)).toFixed(1)+
           ' M'+x2+','+y2+' l'+(-h*Math.cos(a+0.5)).toFixed(1)+','+(-h*Math.sin(a+0.5)).toFixed(1)+'"/>';
  }
  function T(x,y,s,anchor){ return '<text x="'+x+'" y="'+y+'"'+(anchor?' text-anchor="'+anchor+'"':'')+'>'+s+'</text>'; }
  var TEXT_RE=/<text[^>]*>[^<]*<\/text>/g;
  var GROUND='<path d="M8,98 L192,94"/>';
  function svg(inner){
    return '<svg viewBox="0 0 200 104" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+
      '<defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>'+
      '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>'+
      '<g class="k" filter="url(#wob)">'+inner.replace(TEXT_RE,'')+'</g><g>'+(inner.match(TEXT_RE)||[]).join('')+'</g></svg>';
  }
  function corn(cx,base){
    var s='', rows=[5,4,3,2,1];
    for(var r=0;r<rows.length;r++) for(var i=0;i<rows[r];i++)
      s+='<ellipse class="w" cx="'+(cx+(i-(rows[r]-1)/2)*7.4)+'" cy="'+(base-r*4.4)+'" rx="3.4" ry="2.3"/>';
    return s;
  }
  function tally(x,y,n){
    var s='';
    for(var i=0;i<n;i++){ var gx=x+Math.floor(i/5)*17, k=i%5;
      s+= k<4 ? '<path d="M'+(gx+k*3)+','+y+' l0,9"/>' : '<path d="M'+(gx-2)+','+(y+8)+' l14,-7"/>'; }
    return s;
  }

      ['d','Scratchy','Then we start over. I have nothing else going on.']]},
    {h:'Wednesday', lines:[
      ['p','It got windy. My pages went FLAP FLAP FLAP. I yelled, “I AM LOSING MY PLACE!”'],
      ['p','Scratchy stood on me.'],
      ['d','Me','Are you saving me?'],
      ['d','Scratchy','I am standing here.'],
      ['p','He stood there for one whole hour.']]},
    {h:'Thursday', lines:[
      ['p','Pearl came by. She is very fast and very loud. She asked what I am about.'],
      ['p','I said I do not know yet. I am a diary. I am about whatever happens.'],
      ['d','Pearl','SO YOU ARE ABOUT US!'],
      ['d','Scratchy','Unfortunately.']]},
    {h:'Friday', lines:[
      ['p','Things I am NOT worried about anymore:'],
      ['li','1. Wind (I have a chicken for that)'],['li','2. Having a friend'],
      ['p','Scratchy read this page over my shoulder.'],
      ['d','Scratchy','I am not your friend.'],
      ['p','He is still standing in the spot next to me.']]},
    {end:true, lines:[
      ['big','THE END'],
      ['c','(of this book. I am fine. Books end. I checked.)'],
      ['gap',''],
      ['c','Next time: Bro finds out what the swirly thing is. Maybe.'],
      ['gap',''],
      ['c','Cover drawn in pencil by a real kid.']]}
  ];

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  var book=document.getElementById('book'), leaves=[];
  function addLeaf(html, cls){
    var el=document.createElement('div'); el.className='leaf '+(cls||''); el.innerHTML=html;
    book.appendChild(el); leaves.push(el);
  }
  addLeaf('<img alt="Hand-drawn pencil cover: Diary of a Book, Bro Meets Cranky Chickens. A worried book and a chicken in a crown and boots stand under a big swirl." src="'+COVER+'">','cover');
  PAGES.forEach(function(p,i){
    var h='<div class="page">'+(p.h?'<h2>'+esc(p.h)+'</h2>':'');
    p.lines.forEach(function(l){
      if(l[0]==='d') h+='<p class="d"><b>'+esc(l[1])+'</b>: “'+esc(l[2])+'”</p>';
      else if(l[0]==='gap') h+='<p class="gap"></p>';
      else h+='<p class="'+l[0]+'">'+esc(l[1])+'</p>';
    });
    h+='<div class="doodle">'+svg(SCENES[i])+'</div><div class="pgnum">'+(i+1)+'</div></div>';
    addLeaf(h);
  });
  var N=leaves.length;
  leaves.forEach(function(el,i){ el.style.zIndex=String(N-i); });

  // ---------- sizing ----------
  var bar=document.querySelector('.bar');
  function size(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var availH=vh-bar.offsetHeight-document.getElementById('homeLink').offsetHeight-44, w=Math.min(vw-22, availH*900/1137, 640);
    w=Math.max(200,Math.floor(w));
    document.documentElement.style.setProperty('--w',w+'px');
    document.documentElement.style.setProperty('--u',(w/100)+'px');
  }
  window.addEventListener('resize',size); size();

  // ---------- page turning ----------
  var cur=0, prevB=document.getElementById('prev'), nextB=document.getElementById('next'), where=document.getElementById('where');
  function show(n){
    n=Math.max(0,Math.min(N-1,n)); cur=n;
    leaves.forEach(function(el,i){ el.classList.toggle('turned', i<cur); el.setAttribute('aria-hidden', i===cur?'false':'true'); });
    prevB.disabled = cur===0;
    nextB.innerHTML = cur===N-1 ? '&#8634;' : '&#9654;';
    nextB.setAttribute('aria-label', cur===N-1 ? 'Read again' : 'Next page');
    where.textContent = cur===0 ? 'Tap to open' : (cur===N-1 ? 'The End' : 'Page '+cur+' of '+(N-2));
    if(window.ccMark)ccMark(cur,N-1);
    speakPage();
  }
  function next(){ show(cur===N-1 ? 0 : cur+1); }
  function prev(){ show(cur-1); }
  nextB.addEventListener('click',next); prevB.addEventListener('click',prev);
  var moved=false;
  book.addEventListener('click',function(e){
    if(moved){ moved=false; return; }
    var r=book.getBoundingClientRect();
    if(cur>0 && (e.clientX-r.left) < r.width*0.3) prev(); else next();
  });
  var sx=null;
  book.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; moved=false; },{passive:true});
  book.addEventListener('touchend',function(e){
    if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>40){ moved=true; if(dx<0) next(); else prev(); setTimeout(function(){moved=false;},400); }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  });

  // ---------- read to me (device voices; off until tapped) ----------
  var readB=document.getElementById('read'), reading=false, synth=null;
  try{ synth = ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) ? window.speechSynthesis : null; }catch(e){ synth=null; }
  var VOICE={Me:{pitch:1.25,rate:0.95}, Scratchy:{pitch:0.45,rate:0.82}, Pearl:{pitch:1.9,rate:1.2}};
  // Pin each character to an accent, so every device casts the same voices as the episodes do.
  var CC_ACCENTS=['en-au','en-gb','en-in','en-ng','en-us'];
  var CC_FALLBACK={'en-au':['en-gb','en-us'],'en-gb':['en-au','en-us'],'en-in':['en-gb','en-us'],'en-ng':['en-gb','en-in','en-us'],'en-us':['en-gb','en-au']};
  var CC_NAME={Me:'NARRATOR',Scratchy:'SCRATCHY',Pearl:'PEARL',Ernesto:'EL JAGUAR'};
  function ccPickVoice(who,pool){
    if(!pool||!pool.length) return null;
    var h=0, i, j; for(i=0;i<who.length;i++) h+=who.charCodeAt(i);
    var want=CC_ACCENTS[h%CC_ACCENTS.length], tries=[want].concat(CC_FALLBACK[want]||[]);
    for(i=0;i<tries.length;i++){
      var m=[]; for(j=0;j<pool.length;j++){ if((pool[j].lang||'').replace('_','-').toLowerCase()===tries[i]) m.push(pool[j]); }
      if(m.length){ for(j=0;j<m.length;j++){ if(/google/i.test(m[j].name)) return m[j]; } return m[0]; }
    }
    return pool[h%pool.length];
  }
  function enVoices(){
    var all=[], out=[], i; try{ all=synth.getVoices()||[]; }catch(e){}
    for(i=0;i<all.length;i++){ if(all[i].lang && all[i].lang.toLowerCase().indexOf('en')===0) out.push(all[i]); }
    return out;
  }
  function say(text,who){
    var u=new SpeechSynthesisUtterance(text), v=VOICE[who]||VOICE.Me;
    var pv=ccPickVoice(CC_NAME[who]||String(who||'Me').toUpperCase(), enVoices());
    if(pv) u.voice=pv;
    u.pitch=v.pitch; u.rate=v.rate; synth.speak(u);
  }
  function speakPage(){
    if(!synth) return;
    try{
      synth.cancel();
      if(!reading) return;
      if(cur===0){ say('Diary of a Book. Bro meets Cranky Chickens.'); return; }
      var p=PAGES[cur-1]; if(p.h) say(p.h);
      p.lines.forEach(function(l){ if(l[0]==='d') say(l[2],l[1]); else if(l[1]) say(l[1]); });
    }catch(e){}
  }
  if(synth){
    readB.hidden=false;
    readB.addEventListener('click',function(){
      reading=!reading; readB.setAttribute('aria-pressed',String(reading));
      readB.innerHTML = reading ? '&#128266; Reading' : '&#128266; Read to me';
      speakPage();
    });
    window.addEventListener('pagehide',function(){ try{synth.cancel();}catch(e){} });
  }

  show(0);
})();
</script>
</body>
</html>
