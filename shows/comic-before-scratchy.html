<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranky Chickens: Before Scratchy, Pearl, Kevin and Ernesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#2a1d14; --desk2:#3a2a1c; --paper:#fbf6e4; --rule:#b9d3ea; --margin:#e79a9a;
    --ink:#3b3b40; --gold:#f4b942; --gold-ink:#3a2500; --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE","Comic Neue",system-ui,sans-serif;
    --w:320px; --u:3.2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 20%, var(--desk2), var(--desk));
    color:#f6ead6; font-family:var(--hand); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:10px 8px; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .book{position:relative; width:var(--w); aspect-ratio:900/1300; perspective:2200px; flex:none; cursor:pointer}
  .book::before{ /* page-stack edge */
    content:""; position:absolute; inset:1.2% -1.4% -1.4% 1.2%; background:#e9e1c8; border-radius:4px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .leaf{
    position:absolute; inset:0; background:var(--paper); border-radius:3px 6px 6px 3px; overflow:hidden;
    transform-origin:left center; transition:transform .7s cubic-bezier(.4,.1,.3,1);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.28);
  }
  .leaf.turned{transform:rotateY(-180deg); pointer-events:none}
  .leaf.cover{background:#fdfaf0}
  .leaf.cover img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
  .leaf.cover::after{ /* soft spine shadow, nothing covering the title */
    content:""; position:absolute; left:0; top:0; bottom:0; width:3%;
    background:linear-gradient(90deg,rgba(0,0,0,.16),transparent);
  }
  .page{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:calc(var(--u)*7.2) calc(var(--u)*6) calc(var(--u)*5) calc(var(--u)*13);
    color:var(--ink); font-size:calc(var(--u)*5.3); line-height:calc(var(--u)*7.2);
    background:
      linear-gradient(90deg,transparent calc(var(--u)*10),var(--margin) calc(var(--u)*10),var(--margin) calc(var(--u)*10.4),transparent calc(var(--u)*10.4)),
      repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--u)*7.2 - 1px),var(--rule) calc(var(--u)*7.2 - 1px),var(--rule) calc(var(--u)*7.2));
    background-position:0 0, 0 calc(var(--u)*-1.2);
  }
  .page h2{margin:0; font-size:calc(var(--u)*6.6); line-height:calc(var(--u)*7.2); font-weight:400; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px}
  .page p{margin:0}
  .page p.gap{margin-top:calc(var(--u)*7.2)}
  .page .li{padding-left:calc(var(--u)*4)}
  .page .d b{font-weight:400; text-decoration:underline; text-decoration-thickness:1px}
  .page .big{font-size:calc(var(--u)*13); line-height:calc(var(--u)*14.4); text-align:center}
  .page .c{text-align:center}
  .doodle{flex:1 1 0; min-height:0; margin-top:calc(var(--u)*2)}
  .doodle svg{width:100%; height:100%; display:block; overflow:visible}
  .doodle svg *{vector-effect:none}
  .doodle .k{fill:none; stroke:#4c4c52; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  .doodle .k .f{fill:#4c4c52; stroke:none}
  .doodle .k .w{fill:var(--paper)}
  .doodle text{font-family:var(--hand); font-size:9px; fill:#4c4c52; stroke:none}
  .pgnum{position:absolute; right:calc(var(--u)*5); bottom:calc(var(--u)*2); font-size:calc(var(--u)*4); color:#8a8577}

  .bar{display:flex; align-items:center; justify-content:center; gap:8px; width:min(var(--w),100%); flex:none}
  .bar button{
    font:inherit; font-size:clamp(18px,2.6vw,24px); min-height:clamp(48px,7vw,62px); min-width:clamp(56px,8vw,76px); padding:6px 14px; border-radius:14px;
    border:2px solid #1c1208; background:var(--gold); color:var(--gold-ink); cursor:pointer;
    box-shadow:0 3px 0 #1c1208;
  }
  .bar button:active{transform:translateY(2px); box-shadow:0 1px 0 #1c1208}
  .bar button:focus-visible{outline:3px solid #fff; outline-offset:2px}
  .bar button[disabled]{opacity:.35; cursor:default}
  .bar button.ghost{background:#5a4330; color:#f6ead6}
  .bar button.ghost[aria-pressed="true"]{background:#7fd1a0; color:#0f2a1a}
  .bar .where{flex:1; text-align:center; font-size:clamp(17px,2.4vw,22px); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #homeLink{color:rgba(255,255,255,.45);font-size:13px;text-decoration:none;font-family:system-ui,sans-serif;padding:2px 8px;flex:none}
  #homeLink:hover{color:rgba(255,255,255,.8)}
  @media (prefers-reduced-motion:reduce){ .leaf{transition:none} }

  .page.comic{background:var(--paper); padding:calc(var(--u)*4.5) calc(var(--u)*4.5) calc(var(--u)*4.5) calc(var(--u)*6); line-height:1.15}
  .page.comic h2{font-size:calc(var(--u)*5.9); line-height:calc(var(--u)*8); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .page.comic h2 span{font-size:calc(var(--u)*4); background:var(--ink); color:var(--paper); padding:0 calc(var(--u)*1.6); border-radius:calc(var(--u)*1); vertical-align:middle; margin-right:calc(var(--u)*1)}
  .panel{flex:1 1 0; min-height:0; display:flex; flex-direction:column; margin-top:calc(var(--u)*2); border:2px solid #4c4c52; border-radius:calc(var(--u)*1.4); background:#fffdf6; overflow:hidden}
  .panel .cap{flex:none; font-size:calc(var(--u)*4.3); line-height:calc(var(--u)*5.2); padding:calc(var(--u)*.7) calc(var(--u)*2); background:#fbeeb8; border-bottom:1.5px solid #4c4c52}
  .panel .doodle{margin:calc(var(--u)*.6) calc(var(--u)*1)}
  .page.comic.end{justify-content:center; font-size:calc(var(--u)*4.8); line-height:calc(var(--u)*7)}
  .page.comic.end .doodle{flex:0 0 34%}
</style>
</head>

      (o.nofork?'<path d="M-8,-28 q-8,2 -11,8"/><circle class="w" cx="-19" cy="-19" r="2.5"/>'
               :'<path d="M-8,-27 L-19,-24"/><circle class="w" cx="-21" cy="-24" r="2.5"/><path d="M-23,-24 L-40,-21 M-40,-28 L-40,-14 M-40,-28 L-47,-28 M-40,-21 L-47,-21 M-40,-14 L-47,-14"/>')+
      '<path d="M8,-28 q8,-2 11,-9"/><circle class="w" cx="20" cy="-39" r="3"/>'+
      (o.steam?wavy(-5,-60)+wavy(0,-62)+wavy(5,-60):'')+
      (o.egged?splat(-2,-18,5)+splat(4,-35,3.5)+wavy(14,-50):'');
    return grp(x,y,(o.flip?-s:s),s,inner);
  }
  function coop(x,gy){
    return '<path class="w" d="M'+(x-16)+','+gy+' L'+(x-16)+','+(gy-20)+' L'+x+','+(gy-32)+' L'+(x+16)+','+(gy-20)+' L'+(x+16)+','+gy+'"/>'+
      '<path d="M'+(x-5)+','+gy+' l0,-9 q5,-6 10,0 l0,9"/>';
  }
  function fence(x1,x2,gy){
    var s='<path d="M'+x1+','+(gy-8)+' L'+x2+','+(gy-8.5)+' M'+x1+','+(gy-15)+' L'+x2+','+(gy-15.5)+'"/>';
    for(var x=x1+3;x<x2;x+=13) s+='<path d="M'+x+','+gy+' l0,-19"/>';
    return s;
  }
  function moon(x,y){ return '<path class="w" d="M'+x+','+(y-6)+' a6.5,6.5 0 1,0 6,9 a5.5,5.5 0 1,1 -6,-9 Z"/>'; }
  function pile(cx,base,rows,rx,ry,dx,dy){
    var s='';
    for(var r=0;r<rows.length;r++) for(var i=0;i<rows[r];i++)
      s+='<ellipse class="w" cx="'+(cx+(i-(rows[r]-1)/2)*dx)+'" cy="'+(base-ry-r*dy)+'" rx="'+rx+'" ry="'+ry+'"/>';
    return s;
  }
  function corn(cx,base){ return pile(cx,base,[5,4,3,2,1],3.2,2.1,7,4); }
  function eggs(cx,base){ return pile(cx,base,[4,3,2],3.2,4.2,7.4,6); }
  function sling(x,gy,s){ return grp(x,gy,s,s,'<path d="M0,0 L0,-16 M0,-16 L-8,-30 M0,-16 L8,-30"/><path d="M-8,-30 q8,9 16,0"/>'); }
  function board(x,gy,inner){
    return '<path d="M'+(x-16)+','+gy+' l0,-16 M'+(x+16)+','+gy+' l0,-16"/><rect class="w" x="'+(x-24)+'" y="'+(gy-46)+'" width="48" height="30" rx="1.5"/>'+inner;
  }
  function nestPole(x,gy,h){
    var t=gy-h;
    return '<path d="M'+x+','+gy+' L'+x+','+(t+8)+'"/><path class="w" d="M'+(x-12)+','+t+' q12,17 24,0 Z"/>'+
      '<path d="M'+(x-7)+','+(t+1)+' l4,6 M'+(x-1)+','+(t+1)+' l-3,7 M'+(x+2)+','+(t+1)+' l4,6 M'+(x+8)+','+(t+1)+' l-3,5"/>';
  }
  function flyEgg(x,y){ return '<ellipse class="w" cx="'+x+'" cy="'+y+'" rx="4.2" ry="3.2"/><path d="M'+(x-7)+','+(y-2)+' l-8,0 M'+(x-7)+','+(y+2)+' l-10,1"/>'; }
  function svg(inner){
    return '<svg viewBox="0 0 200 70" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+
      '<defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>'+
      '<feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs>'+
      '<g class="k" filter="url(#wob)">'+inner.replace(TEXT_RE,'')+'</g><g>'+(inner.match(TEXT_RE)||[]).join('')+'</g></svg>';
  }
  var C={cranky:1}, CF={cranky:1,flip:1};

  // ---------- the comic: chapter titles are the kid's, word for word ----------
  // panel: {cap, say:[[who,text]], art}
  var CHAPTERS = [
    {t:'Normal Chickens', panels:[
      {cap:'A long, long time ago, before anybody you know, chickens were normal.', say:[],
       art: G+fence(56,196,GY)+coop(28,GY)+chick(88,GY,1)+chick(128,GY,1,{flip:1})+chick(166,GY,1)},
      {cap:'They ate corn. They said bawk. They had zero opinions.', say:[['Chicken','Bawk.'],['Chicken','Bawk.'],['Chicken','Nice corn.']],
       art: G+chick(36,GY,1)+chick(98,GY,1)+chick(164,GY,1,{flip:1})+corn(130,61)+bub(38,11,'Bawk.',42,23)+bub(100,11,'Bawk.',104,23)+bub(160,11,'Nice corn.',158,23)},
      {cap:'It was a very boring time to be a chicken.', say:[['Chicken','Good rock.']],
       art: G+chick(72,GY,1.05)+'<path class="w" d="M116,62 q2,-10 11,-9 q10,0 10,9"/>'+bub(76,10,'Good rock.',80,20)}
    ]},
    {t:'Cranky Chickens', panels:[
      {cap:'Then the farmer started waking them up. At 4 in the morning.', say:[['Farmer','UP! UP! UP!']],
       art: G+moon(180,13)+farmer(34,GY,.8,{flip:1,steam:1,nofork:1})+chick(128,GY,1,{flip:1})+chick(164,GY,1,{flip:1})+bub(92,22,'UP! UP! UP!',46,30)+T(140,17,'zzz')},
      {cap:'And he counted their corn. Out loud. Every day. Wrong.', say:[['Farmer','1... 2... 5... 9...']],
       art: G+farmer(30,GY,.8,{flip:1,steam:1,nofork:1})+corn(104,61)+chick(168,GY,1,CF)+bub(104,22,'1... 2... 5... 9...',44,31)},
      {cap:'That day, the first chicken got cranky. And it felt GREAT.', say:[['Chicken','Hmph.']],
       art: G+chick(96,64,1.28,{cranky:1,steam:1})+bub(44,30,'Hmph.',82,36)+T(132,15,'first cranky')+T(132,29,'eyebrow EVER')+arrow(130,19,117,22)}
    ]},
    {t:'The Egg Scape', panels:[
      {cap:'The chickens made a plan. They would leave the farm dressed as eggs.', say:[['Chicken','Nobody chases an egg.']],
       art: G+chick(22,GY,1,C)+chick(54,GY,1,C)+board(118,GY,'<ellipse cx="106" cy="31" rx="4" ry="5.5"/>'+arrow(113,31,126,31)+'<path d="M131,24 l0,13 M136,24 l0,13 M129,28 l9,0 M129,34 l9,0"/>')+chick(176,GY,1,CF)+bub(58,10,'Nobody chases an egg.',52,22)},
      {cap:'That night, three very large eggs tiptoed past the farmer.', say:[['Farmer','Zzz... nice eggs... zzz.']],
       art: G+moon(14,12)+farmer(38,GY,.8,{flip:1,nofork:1,sleep:1})+eggc(108,GY,1)+eggc(140,GY,1)+eggc(172,GY,1)+bub(122,14,'Zzz... nice eggs... zzz',52,27)},
      {cap:'It worked! It was the greatest egg scape in history.', say:[['Chicken','Bawk. I mean... egg.']],
       art: fence(4,72,GY)+G+eggc(108,GY,1)+eggc(143,GY,1)+eggc(178,GY,1)+'<path d="M92,44 l-9,0 M94,51 l-12,0 M92,58 l-8,0"/>'+bub(143,14,'Bawk. I mean... egg.',143,33)}
    ]},
    {t:'The Hunt', panels:[
      {cap:'In the morning, the farmer found an empty coop.', say:[['Farmer','MY CHICKENS!']],
       art: G+coop(34,GY)+farmer(98,GY,.8,{steam:1,nofork:1})+bub(156,28,'MY CHICKENS!',114,31)},
      {cap:'He called every farmer he knew. The hunt was on.', say:[],
       art: G+farmer(50,GY,.8)+farmer(115,GY,.8)+farmer(180,GY,.8)+T(100,9,'(the pitchforks are for pointing)','middle')},
      {cap:'The chickens hid in a nest on a tall pole. The farmers ran right under it.', say:[['Chicken','Shhh.']],
       art: G+nestPole(28,GY,26)+chick(27,40,.62,{glasses:1})+farmer(128,GY,.8,{steam:1})+bub(72,12,'Shhh.',38,21)}
    ]},
    {t:'Building the Slingshot', panels:[
      {cap:'Hiding was boring. The chickens needed a slingshot.', say:[['Chicken','A BIG one.']],
       art: G+chick(28,GY,1,C)+board(96,GY,'<path d="M96,42 L96,32 M96,32 L90,22 M96,32 L102,22 M90,22 q6,6 12,0"/>')+chick(160,GY,1,CF)+bub(160,10,'A BIG one.',157,22)},
      {cap:'They found a stick shaped like a Y, and one stretchy farmer sock.', say:[['Chicken','Ew. Perfect.']],
       art: G+sling(34,GY,1.15).replace(/<path d="M-8,-30 q8,9 16,0"\/>/,'')+T(34,16,'stick','middle')+
            '<path class="w" d="M92,38 L92,53 q0,6 7,6 L106,59 q3,-6 -4,-7 L99,52 L99,38 Z"/>'+wavy(110,46)+wavy(116,43)+T(98,30,'sock','middle')+
            chick(164,GY,1,CF)+bub(156,10,'Ew. Perfect.',158,22)},
      {cap:'For ammo: the stinky old eggs nobody wanted. They had been saving them.', say:[],
       art: G+sling(34,GY,1.3)+eggs(104,61)+wavy(94,38)+wavy(104,33)+wavy(114,38)+T(104,17,'(do not sniff)','middle')+chick(170,GY,1,CF)}
    ]},
    {t:'The Battle', panels:[
      {cap:'The farmers charged across the field.', say:[['Farmer','GET THOSE CHICKENS!']],
       art: G+sling(20,GY,1)+chick(46,GY,.9,C)+farmer(132,GY,.8)+farmer(180,GY,.8,{steam:1})+bub(84,9,'GET THOSE CHICKENS!',126,17)},
      {cap:'The chickens let go.', say:[['Me','Splat! Splat! Splat!']],
       art: G+sling(20,GY,1)+chick(46,GY,.9,C)+flyEgg(84,34)+flyEgg(104,24)+farmer(146,GY,.8,{egged:1})+farmer(184,GY,.8,{egged:1,nofork:1})+T(70,15,'SPLAT!',null,14)+T(128,12,'SPLAT!',null,11)},
      {cap:'Nobody got hurt. Everybody got stinky. The farmers went home for a bath.', say:[['Farmer','I QUIT. I need a bath.']],
       art: G+'<path class="w" d="M14,61 q15,-6 30,-1 q-10,5 -30,1 Z"/><path class="w" d="M22,59 q0,-11 8,-11 q7,0 8,10"/>'+
            farmer(140,GY,.8,{flip:1,egged:1,nofork:1})+farmer(182,GY,.8,{flip:1,egged:1,nofork:1})+bub(60,24,'I QUIT. I need a bath.',122,31)}
    ]},
    {t:'They Egg Scaped', panels:[
      {cap:'The chickens were free. And they stayed cranky, because they liked it.', say:[['Chicken','Still cranky.']],
       art: '<path d="M134,61 a18,18 0 0,1 36,0"/><path d="M152,38 l0,-7 M136,45 l-6,-5 M168,45 l6,-5 M128,56 l-8,-2 M176,56 l8,-2"/>'+G+chick(30,GY,1,C)+chick(64,GY,1,C)+chick(98,GY,1,{cranky:1,glasses:1})+bub(60,10,'Still cranky.',56,22)},
      {cap:'They built a new coop. No alarm clock. No farmer.', say:[['Chicken','We count our OWN corn.']],
       art: G+coop(30,GY)+'<path d="M92,62 l0,-22"/><rect class="w" x="58" y="26" width="68" height="14" rx="1.5"/>'+T(92,36.5,'NO FARMERS','middle')+chick(172,GY,1,CF)+bub(136,10,'We count our OWN corn.',166,22)},
      {cap:'Many years later: Scratchy, Pearl, Kevin and Ernesto. But that is another comic.', say:[],
       art: G+'<ellipse class="w" cx="100" cy="42" rx="14" ry="19"/><path d="M88,36 l5,4 l4,-5 l5,5 l4,-4 l6,4"/>'+
            '<path d="M100,17 l0,-8 M80,27 l-7,-5 M120,27 l7,-5 M76,46 l-9,0 M124,46 l9,0"/>'+T(142,40,'soon.')}
    ]}
  ];
  // speech order for Read to me: caption, then bubbles
  var PAGES = CHAPTERS.map(function(c,i){
    var lines=[]; c.panels.forEach(function(p){ lines.push(['p',p.cap]); p.say.forEach(function(s){ lines.push(['d',s[0],s[1]]); }); });
    return {h:'Chapter '+(i+1)+'. '+c.t+'.', lines:lines};
  });
  PAGES.push({h:'The End.', lines:[['p','Cover and chapters by a real kid.']]});

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  var book=document.getElementById('book'), leaves=[];
  function addLeaf(html, cls){
    var el=document.createElement('div'); el.className='leaf '+(cls||''); el.innerHTML=html;
    book.appendChild(el); leaves.push(el);
  }
  addLeaf('<img alt="Hand-drawn pencil cover: Cranky Chickens, before Scratchy, Pearl, Kevin and Ernesto. A steaming-mad farmer with a pitchfork runs toward a chicken sitting in a nest on a pole." src="'+COVER+'">','cover');
  CHAPTERS.forEach(function(c,i){
    var h='<div class="page comic"><h2><span>Chapter '+(i+1)+'</span> '+esc(c.t)+'</h2>';
    c.panels.forEach(function(p){ h+='<div class="panel"><div class="cap">'+esc(p.cap)+'</div><div class="doodle">'+svg(p.art)+'</div></div>'; });
    addLeaf(h+'</div>');
  });
  addLeaf('<div class="page comic end"><p class="big">THE END</p><div class="doodle">'+svg(G+chick(70,GY,1.3,C)+chick(108,GY,1.3,{cranky:1,glasses:1})+chick(146,GY,1.3,CF))+'</div>'+
    '<p class="c">Cover and chapters by a real kid.</p><p class="c">Chickens were not harmed. Farmers were only egged.</p></div>');
  var N=leaves.length;
  leaves.forEach(function(el,i){ el.style.zIndex=String(N-i); });

  // ---------- sizing ----------
  var bar=document.querySelector('.bar');
  function size(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var availH=vh-bar.offsetHeight-document.getElementById('homeLink').offsetHeight-44, w=Math.min(vw-22, availH*900/1300, 640);
    w=Math.max(200,Math.floor(w));
    document.documentElement.style.setProperty('--w',w+'px');
    document.documentElement.style.setProperty('--u',(w/100)+'px');
  }
  window.addEventListener('resize',size); size();

  // ---------- page turning ----------
  var cur=0, prevB=document.getElementById('prev'), nextB=document.getElementById('next'), where=document.getElementById('where');
  function show(n){
    n=Math.max(0,Math.min(N-1,n)); cur=n;
    leaves.forEach(function(el,i){ el.classList.toggle('turned', i<cur); el.setAttribute('aria-hidden', i===cur?'false':'true'); });
    prevB.disabled = cur===0;
    nextB.innerHTML = cur===N-1 ? '&#8634;' : '&#9654;';
    nextB.setAttribute('aria-label', cur===N-1 ? 'Read again' : 'Next page');
    where.textContent = cur===0 ? 'Tap to open' : (cur===N-1 ? 'The End' : cur+' of '+(N-2));
    if(window.ccMark)ccMark(cur,N-1);
    speakPage();
  }
  function next(){ show(cur===N-1 ? 0 : cur+1); }
  function prev(){ show(cur-1); }
  nextB.addEventListener('click',next); prevB.addEventListener('click',prev);
  var moved=false;
  book.addEventListener('click',function(e){
    if(moved){ moved=false; return; }
    var r=book.getBoundingClientRect();
    if(cur>0 && (e.clientX-r.left) < r.width*0.3) prev(); else next();
  });
  var sx=null;
  book.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; moved=false; },{passive:true});
  book.addEventListener('touchend',function(e){
    if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>40){ moved=true; if(dx<0) next(); else prev(); setTimeout(function(){moved=false;},400); }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  });

  // ---------- read to me (device voices; off until tapped) ----------
  var readB=document.getElementById('read'), reading=false, synth=null;
  try{ synth = ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) ? window.speechSynthesis : null; }catch(e){ synth=null; }
  var VOICE={Me:{pitch:1.0,rate:0.95}, Chicken:{pitch:1.7,rate:1.05}, Farmer:{pitch:0.4,rate:0.9}};
  // Pin each character to an accent, so every device casts the same voices as the episodes do.
  var CC_ACCENTS=['en-au','en-gb','en-in','en-ng','en-us'];
  var CC_FALLBACK={'en-au':['en-gb','en-us'],'en-gb':['en-au','en-us'],'en-in':['en-gb','en-us'],'en-ng':['en-gb','en-in','en-us'],'en-us':['en-gb','en-au']};
  var CC_NAME={Me:'NARRATOR',Scratchy:'SCRATCHY',Pearl:'PEARL',Ernesto:'EL JAGUAR'};
  function ccPickVoice(who,pool){
    if(!pool||!pool.length) return null;
    var h=0, i, j; for(i=0;i<who.length;i++) h+=who.charCodeAt(i);
    var want=CC_ACCENTS[h%CC_ACCENTS.length], tries=[want].concat(CC_FALLBACK[want]||[]);
    for(i=0;i<tries.length;i++){
      var m=[]; for(j=0;j<pool.length;j++){ if((pool[j].lang||'').replace('_','-').toLowerCase()===tries[i]) m.push(pool[j]); }
      if(m.length){ for(j=0;j<m.length;j++){ if(/google/i.test(m[j].name)) return m[j]; } return m[0]; }
    }
    return pool[h%pool.length];
  }
  function enVoices(){
    var all=[], out=[], i; try{ all=synth.getVoices()||[]; }catch(e){}
    for(i=0;i<all.length;i++){ if(all[i].lang && all[i].lang.toLowerCase().indexOf('en')===0) out.push(all[i]); }
    return out;
  }
  function say(text,who){
    var u=new SpeechSynthesisUtterance(text), v=VOICE[who]||VOICE.Me;
    var pv=ccPickVoice(CC_NAME[who]||String(who||'Me').toUpperCase(), enVoices());
    if(pv) u.voice=pv;
    u.pitch=v.pitch; u.rate=v.rate; synth.speak(u);
  }
  function speakPage(){
    if(!synth) return;
    try{
      synth.cancel();
      if(!reading) return;
      if(cur===0){ say('Cranky Chickens. Before Scratchy, Pearl, Kevin and Ernesto.'); return; }
      var p=PAGES[cur-1]; if(p.h) say(p.h);
      p.lines.forEach(function(l){ if(l[0]==='d') say(l[2],l[1]); else if(l[1]) say(l[1]); });
    }catch(e){}
  }
  if(synth){
    readB.hidden=false;
    readB.addEventListener('click',function(){
      reading=!reading; readB.setAttribute('aria-pressed',String(reading));
      readB.innerHTML = reading ? '&#128266; On' : '&#128266; Read';
      speakPage();
    });
    window.addEventListener('pagehide',function(){ try{synth.cancel();}catch(e){} });
  }

  show(0);
})();
</script>
