<script>

// 3x5 pixel font for signs
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',
N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110',
'6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','!':'010010010000010','?':'110001010000010',
'-':'000000111000000','.':'000000000000010'};
function txt(s,x,y,c){X.fillStyle=c;for(const ch of s){const g=FONT[ch];if(g){for(let i=0;i<15;i++)if(g[i]==='1')X.fillRect(x+i%3,y+Math.floor(i/3),1,1);}x+=4;}}

// ── characters ── (x,y) is feet, centre-bottom
function chicken(x,y,o){o=o||{};const s=o.s||2,f=o.f||1,st=o.step||0,b=o.body||P.W,be=o.belly||'#dddddd',w=o.wing||P.LG;
  X.save();X.translate(Math.round(x),Math.round(y));X.scale(s*f,s);
  r(-3,-4,1,st===1?3:4,P.O);r(-4,st===1?-2:-1,3,1,P.O);r(1,-4,1,st===2?3:4,P.O);r(0,st===2?-2:-1,3,1,P.O);

  r(-7,-13,13,9,b);r(-6,-14,11,1,b);r(-6,-4,10,1,b);r(-3,-8,8,4,be);r(-5,-11,6,4,w);
  r(1,-21,7,8,b);
  if(o.hat==='chef'){r(1,-24,7,3,P.W);r(0,-29,9,5,P.W);r(1,-30,3,1,P.W);r(5,-30,3,1,P.W);r(1,-22,7,1,P.LG);}
  else if(o.hat==='helm'){r(0,-25,9,7,P.LG);r(0,-19,9,1,P.DG);r(5,-21,4,2,P.K);r(4,-28,2,3,P.R);}

  if(o.spat){r(10,-18,1,12,P.BR);r(9,-26,3,8,P.LG);r(10,-25,1,5,P.DG);}
  X.restore();}

function sixtyseven(x,y){const bob=Math.round(Math.sin(T*2)*1.5);y+=bob-3;
  r(x-1,y-4,2,6,'#2a8a2a');r(x-2,y-12,4,9,P.G);r(x-3,y-18,6,7,P.LGR);

  r(x-1,y-40,2,4,P.LGR);ell(x,y-47,6,8,P.LGR);ell(x-3,y-47,2,3,P.K);ell(x+3,y-47,2,3,P.K);r(x-3,y-49,1,1,P.W);r(x+3,y-49,1,1,P.W);
  r(x-1,y-41,3,1,P.G);r(x,y-59,1,4,P.LGR);disc(x,y-60,1,P.Y);}

function turkey(x,y,boss){const cols=['#7a3a10',P.R,'#d2691e',P.Y,'#d2691e',P.R,'#7a3a10'];
  for(let i=-3;i<=3;i++)r(x+i*5-2,y-44+Math.abs(i)*4,4,24,cols[i+3]);

  r(x-6,y-45,12,4,boss?P.G:P.DG);r(x-4,y-47,8,2,boss?P.G:P.DG);if(boss)r(x-1,y-46,2,2,P.Y);
  r(x+1,y-39,2,2,P.K);r(x+4,y-37,4,2,P.Y);r(x+5,y-35,2,5,P.R);
  if(boss){r(x-7,y-22,2,2,P.Y);r(x-4,y-22,2,2,P.Y);r(x-1,y-22,2,2,P.Y);r(x-7,y-19,2,2,P.LC);r(x-4,y-19,2,2,P.LR);}}

function floaty(x,y,happy){const bob=Math.round(Math.sin(T*1.6)*3);y+=bob;
  for(let i=0;i<5;i++)r(x-8+i*4+Math.round(Math.sin(T*3+i)*1),y+20+i%2*3,2,5-i%2*2,'#2a8a8a');
  ell(x,y,16,19,'#2aaaaa');ell(x,y,14,17,P.LC);

  else{r(x-9,y-7,5,4,P.W);r(x-7,y-6,2,3,P.K);r(x+4,y-7,5,4,P.W);r(x+6,y-6,2,3,P.K);r(x-10,y-10,5,1,P.K);r(x+5,y-10,5,1,P.K);r(x-4,y+12,8,1,P.K);r(x-5,y+13,1,1,P.K);r(x+4,y+13,1,1,P.K);}

function sockmunch(x,y,asleep){
  ell(x,y-9,16,9,P.LGR);ell(x-2,y-6,9,5,'#b8ffb8');r(x-12,y-2,5,2,P.O);r(x+2,y-2,5,2,P.O);r(x-17,y-14,4,4,P.LGR);

function hound(x,y,chef){const fl=Math.round(Math.sin(T*5));
  r(x-6,y-10,5,10,P.B);r(x+1,y-10,5,10,P.B);r(x-7,y-2,6,2,P.K);r(x+1,y-2,6,2,P.K);

  openOv('album',h);}
function openMap(){const here=SCR().world;let h='<h2>Where to, chef?</h2><div class="grid map">';
  MAP.filter(m=>cond(m.when)).forEach(m=>{const at=m.id===here;h+='<button class="pl'+(at?' here':'')+'" '+(at?'disabled':'data-a="travel" data-v="'+m.id+'"')+'><i>'+m.icon+'</i><b>'+m.name+'</b><span>'+(at?'You are here':'Fly there')+'</span></button>';});
  (F('act2')?MAP_SOON:[{name:'???',icon:'❓'},{name:'???',icon:'❓'},{name:'???',icon:'❓'}]).forEach(m=>{h+='<button class="pl soon" disabled><i>'+m.icon+'</i><b>'+m.name+'</b><span>Coming soon</span></button>';});
  openOv('map',h+'</div><button class="small" data-a="close">Stay here</button>');}
function travel(id){const m=MAP.find(x=>x.id===id);closeOv();modal='warp';warp={t0:T,m};Sfx.warp();$('loc').textContent='Somewhere in between';}
function arrive(m){warp=null;modal=null;gotoScreen(m.screen,m.x);hero.f=1;
  if(m.flag&&!F(m.flag)){S.flags[m.flag]=1;run(m.first);}else run(m.again);}
let code='';
function openKeypad(){code='';let h='<h2>Shuttle Hatch</h2><div id="kdisp">_ _</div><div class="keys">';
  [1,2,3,4,5,6,7,8,9,0].forEach(n=>{h+='<button data-a="key" data-v="'+n+'">'+n+'</button>';});
  openOv('keypad',h+'</div><button class="small" data-a="close">Give up for now</button>');}
function keyPress(n){Sfx.key();code+=n;$('kdisp').textContent=code.length===1?code+' _':code[0]+' '+code[1];
  if(code.length<2)return;const c=code;setTimeout(()=>{closeOv();
    if(c==='67'){S.flags.shuttleOpen=1;Sfx.get();run(["N: BEEP. The hatch slides open.","SIXTYSEVEN: Six seven!","N: He seems proud of you. Or of the numbers. Hard to say.",{map:true}]);}
    else{Sfx.bad();run(c==='76'?["N: BZZT. So close. And yet backwards."]:["N: BZZT. That is not the code.","N: If only someone nearby kept saying two numbers at you."]);}},350);}
function openRecipe(){const a3=F('act3');let h='<h2>'+(a3?'Exact Change':'The Legendary Galactic Pancake')+'</h2><div class="grid">';
  (a3?QUEST3:RECIPE).forEach(q=>{const st=F(q.inn)?(a3?'✅ In the slot':'✅ In the bowl'):F(q.got)?'🎒 You have it':'Find it: '+q.where;h+='<div class="dc'+(F(q.got)?'':' need')+'"><i>'+q.icon+'</i><b>'+q.name+'</b><span>'+st+'</span></div>';});
  h+='</div><p>'+(a3?(F('freed')?'The ship is free. Lunch is saved.':F('vended')?'The ship is stuck behind the flap in the prize chute.':F('vendReady')?'Paid in full. Now pick B4 on the keypad in the control room.':'Three Galactic Quarters go in the coin slot on the front of the Mothership.'):F('won')?'Flipped. Perfect. You are the champion.':F('batter')?'The batter is on the griddle. It needs flipping.':'Bring all four to the griddle at the Frying Pan Station.')+'</p><button class="big" data-a="close">Back to the game</button>';
  openOv('recipe',h);}
let vsel='';
function openVend(){vsel='';let h='<h2>Make a Selection</h2><div id="kdisp">_ _</div><div class="keys six">';
  'ABCDEF123456'.split('').forEach(k=>{h+='<button data-a="vkey" data-v="'+k+'">'+k+'</button>';});
  openOv('keypad',h+'</div><button class="small" data-a="close">Walk away</button>');}
function vendKey(k){const L=/[A-F]/.test(k);if(!vsel.length){if(!L){Sfx.bad();return;}vsel=k;}else if(L)vsel=k;else vsel+=k;Sfx.key();
  $('kdisp').textContent=vsel.length===1?vsel+' _':vsel[0]+' '+vsel[1];if(vsel.length<2)return;const c=vsel;setTimeout(()=>{closeOv();vendPick(c);},350);}
function vendPick(c){const jump="N: You jump on "+c[0]+". Then you jump on "+c[1]+".";
  if(!F('vendReady'))run([jump,"MOTHER: INSERT. COIN.","N: The price is three Galactic Quarters, in the slot out front. You have tried arguing with vending machines before."]);
  else if(F('vended'))run("N: You already bought the only thing you wanted.");
  else if(c==='B4')run([jump,"MOTHER: B. FOUR. ONE. SPACESHIP. DISPENSING.",{set:'vended'},"N: Far away, a giant coil begins to turn. Something very heavy goes THUNK into the prize chute.","N: Then, nothing. You know this feeling. It is stuck behind the flap."]);
  else if(c==='A1')run([jump,"MOTHER: A. ONE. EXCELLENT. CHOICE. FREE. SAMPLE.",{die:'granola'}]);
  else run([jump,"N: The machine dispenses "+VEND_OTHER[(c.charCodeAt(0)+c.charCodeAt(1))%VEND_OTHER.length]+". It lands somewhere far below.","MOTHER: FREE. SAMPLE. YOUR. CREDIT. REMAINS."]);}
// ── cooking ──
function pantryHas(n){if(n==='cheese')return F('p_cheese1')||F('p_cheese2')||F('p_cheese3')||F('p_cheese4');const p=PANTRY[n];return p.flag?F(p.flag)||F('p_'+n):F('p_'+n);}
let cookAt=false;
function openCook(atOven){cookAt=!!atOven;let h='<h2>Mom\'s Cook Book</h2><p>'+(atOven?'The oven is hot. Pick a dish.':'Find ingredients out in the galaxy. Cook at the oven in the Pizza Corral.')+'</p><div class="grid cook">';
  RECIPES.forEach(q=>{const done=F('d_'+q.id),hasIt=has('dish_'+q.id),ready=q.needs.every(pantryHas);
    h+='<div class="rc'+(done?' done':'')+(q.legend?' legend':'')+'"><b>'+q.icon+' '+q.name+'</b><span class="who">For: '+q.who+'</span><div class="needs">';
    q.needs.forEach(n=>{const ok=pantryHas(n);h+='<span class="'+(ok?'ok':'no')+'">'+(ok?'✓ ':'')+PANTRY[n].name+(ok?'':' · '+PANTRY[n].hint)+'</span>';});
    h+='</div>'+(done?'<i>Delivered 💛</i>':hasIt?'<i>Cooked. Go and deliver it.</i>':ready?(atOven?'<button data-a="cook" data-v="'+q.id+'">🍳 Cook it</button>':'<i>Ready to cook at the oven.</i>'):'')+'</div>';});
  openOv('recipe',h+'</div><button class="big" data-a="close">Back to the game</button>');}
let bakeT=null;
function cookDish(id){const q=RECIPES.find(x=>x.id===id);if(!q||!q.needs.every(pantryHas))return;
  if(id==='pizza'&&!window.__sync){openOv('bake','<h2>Barely-Baked Cheese Pizza</h2><p>Take it out before a single brown spot appears.</p><div class="bakebar"><div id="bakeFill"></div></div><div class="pz">🍕</div><button class="big" data-a="bake">🧤 Take it out NOW</button>');
    clearTimeout(bakeT);bakeT=setTimeout(()=>{if(modal!=='bake')return;Sfx.bad();openOv('bake','<h2>Brown spots.</h2><p>Three of them. Daddy would send it back. Daddy would send YOU back.</p><button class="big" data-a="cook" data-v="pizza">Try again</button><button class="small" data-a="close">Walk away</button>');},3200);return;}
  dishDone(q);}
function bakeOut(){clearTimeout(bakeT);dishDone(RECIPES.find(x=>x.id==='pizza'));}
function dishDone(q){closeOv();const lines={banana:"N: You peel one banana and put it on a plate. That is the whole recipe. You feel slightly overqualified.",softserve:"N: The soft serve machine is broken. It is always broken. You make it by hand, with the spatula, out of spite.",pizza:"N: Out it comes. Pale. Soft. Not one brown spot. Technically it is still mostly frozen in the middle.",grilled:"N: Butter. Bread. Cheese. One flip, with the Spatula of Destiny. This is what it was forged for.",macdish:"N: Four cheeses from four worlds, and macaroni from a lost box. You stir. It turns the colour of a traffic cone. Perfect.",sourpbj:"N: Peanut butter, glow jelly, and Mom's sourdough. You cut it corner to corner. It hums. This is the legendary one."};
  run([lines[q.id]||"N: You cook. The oven roars. The Pizza Corral fills with a very good smell.",{give:'dish_'+q.id},"N: "+q.name+". Somebody in Coop Hollow has been waiting for this."]);}
// ── save codes ──
function openSaveCode(){let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}
  openOv('recipe','<h2>Save Code</h2>'+(S.started?'<p>This code is your whole game. Copy it somewhere safe, or type it into another tablet.</p><textarea id="codeBox" readonly rows="4">'+code+'</textarea><button class="big" data-a="copycode">Copy my code</button>':'')+
    '<p>Have a code from another tablet? Paste it here.</p><textarea id="codeIn" rows="3" placeholder="Paste a save code"></textarea><button class="big" data-a="loadcode">Load this code</button><button class="small" data-a="close">Close</button>');}
function loadCode(txt,btn){try{const j=JSON.parse(decodeURIComponent(escape(atob(String(txt).trim()))));if(!j||!j.started||!WORLD.screens[j.screen]||!Array.isArray(j.inv))throw 0;
    S=Object.assign(fresh(),j);sel=null;Q=[];hero.fx=null;Voice.unlock();closeOv();gotoScreen(S.screen,S.x);renderInv();save();toast('Save code loaded');}catch(e){btn.textContent='That code did not work. Check it and try again';}}
function openEnd(){const tot=Object.keys(DEATHS).length;Sfx.win();
  openOv('end','<h1>THE END</h1><h2>...for now</h2><p>Ways you got fried: <b>'+S.deaths.length+' of '+tot+'</b><br>Things you tried to flip: <b>'+S.flipped.length+'</b></p>'+
    '<p>Lost socks found: <b>'+S.socks.length+' of '+SOCK_TOTAL+'</b></p><p>You saved lunch, the ship, and one vending machine\'s feelings. More planets are on the way. Got an idea for a planet? Tell Uncle Nick.</p><button class="big" data-a="close">Keep exploring</button><button class="small" data-a="restart">Start Over</button>');}

// ── input ──
function toLogical(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*320/b.width+(Mini.on||modal==='mini'?0:cam),y:(e.clientY-b.top)*180/b.height};}
function hotAt(p){const hs=SCR().hotspots;for(const m of [0,6]){for(let i=hs.length-1;i>=0;i--){const h=hs[i];if(!cond(h.when))continue;
  if(p.x>=h.x-m&&p.x<=h.x+h.w+m&&p.y>=h.y-m&&p.y<=h.y+h.h+m)return h;}}return null;}
$('stage').addEventListener('pointermove',e=>{if(modal==='mini'&&Mini.on){const p=toLogical(e);Mini.input('move',p.x,p.y);}});
$('miniExit').addEventListener('pointerdown',e=>{e.stopPropagation();if(Mini.on&&!Mini.won)Mini.end(false);});
$('stage').addEventListener('pointerdown',e=>{Sfx.unlock();if(modal==='mini'){if(Mini.on){const p=toLogical(e);Mini.input('down',p.x,p.y);}return;}if(modal)return;if(cur){advance();return;}
  closeVerbs();const p=toLogical(e),h=hotAt(p);
  if(!h){walkTo(p.x);return;}
  const ax=standX(h);
  if(h.exit){walkTo(ax,()=>{Sfx.door();gotoScreen(h.exit.to,h.exit.x);});return;}
  if(sel){const it=sel;walkTo(ax,()=>useItem(it,h));return;}
  walkTo(ax,()=>face(h));openVerbs(h);});
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&cur&&!modal){e.preventDefault();advance();}});

// ── loop ──
let last=0;
function update(dt){
  if(Mini.on){Mini.update(dt);return;}
  if(warp&&T-warp.t0>1.5)arrive(warp.m);
  if(hero.walking){const d=hero.tx-hero.x,stp=120*dt;hero.stepT+=dt;
    if(Math.abs(d)<=stp){hero.x=hero.tx;hero.walking=false;const f=hero.onArrive;hero.onArrive=null;if(f)f();}else hero.x+=Math.sign(d)*stp;}
  if(!warp){const w=SCR().w||320,want=Math.max(0,Math.min(w-320,hero.x-160));cam+=(want-cam)*Math.min(1,dt*6);if(Math.abs(want-cam)<0.5)cam=want;}}
function drawHero(){const sc=SCR(),y=sc.floor,o={hat:'chef',pom:F('knitHat'),spat:has('spatula'),f:hero.f,step:hero.walking?1+Math.floor(hero.stepT*8)%2:0,blink:Math.floor(T*0.9)%4===0&&(T%1)<0.15};
  const bobY=hero.walking?Math.floor(hero.stepT*8)%2:0;
  if(!hero.fx){ell(hero.x,y+1,12,2,'rgba(0,0,0,0.3)');chicken(hero.x,y-bobY,o);return;}
  const a=Math.min(1,(T-hero.fx.t0)/1.0),k=hero.fx.kind;
  X.save();X.translate(Math.round(hero.x),y);
  if(k==='float'){X.translate(a*40*hero.f,-a*150);X.rotate(a*7);chicken(0,20,o);}
  else if(k==='squish'){X.scale(1+a*0.7,Math.max(0.12,1-a*1.1));chicken(0,0,o);}
  else if(k==='sink'){X.beginPath();X.rect(-40,-80,80,80);X.clip();chicken(0,a*52,o);}
  else if(k==='spin'){X.translate(0,-20);X.rotate(a*22);X.scale(1-a*0.6,1-a*0.6);chicken(0,20,o);}
  else if(k==='gulp'){X.scale(Math.max(0.01,1-a),Math.max(0.01,1-a));chicken(0,0,o);}
  else if(k==='pop'){if(a<0.3){X.translate(Math.round(Math.sin(T*60)*2),0);chicken(0,0,o);}
    else{const g=rnd(5),q=(a-0.3)/0.7;for(let i=0;i<14;i++){const an=g()*6.28,d=q*(20+g()*40);disc(Math.cos(an)*d,-22+Math.sin(an)*d-q*30,3,i%3?P.W:'#ffffaa');}}}
  X.restore();
  if(k==='pop'&&a>0.25&&a<0.4){X.globalAlpha=0.7;r(0,0,320,180,P.W);X.globalAlpha=1;}}
function drawWarp(){const a=(T-warp.t0)/1.5;r(0,0,320,180,P.K);const g=rnd(77);
  for(let i=0;i<70;i++){const an=g()*6.283,d0=g()*30,sp=40+g()*200,d=d0+a*a*sp,len=2+a*a*sp*0.25,c=i%5===0?P.LC:(i%7===0?P.Y:P.W);
    for(let j=0;j<len;j+=2)r(160+Math.cos(an)*(d+j),90+Math.sin(an)*(d+j)*0.6,1,1,c);}
  shuttle(160+Math.round(Math.sin(T*30)*1),104);}
function draw(){
  if(Mini.on){Mini.draw();return;}
  if(warp){drawWarp();return;}
  const sc=SCR();X.save();X.translate(-Math.round(cam),0);ART[S.screen](F,has,shake,FX);
  sc.hotspots.forEach(h=>{if(!cond(h.when))return;
    if(h.icon){const ix=h.x+h.w/2,iy=h.y+h.h;r(ix-5,iy-9,10,9,h.icon);r(ix-5,iy-9,10,2,P.W);r(ix-6,iy-1,12,1,P.K);if(Math.floor(T*3)%2){r(ix+5,iy-14,1,5,P.W);r(ix+3,iy-12,5,1,P.W);}}
    if(h.exit){const d=h.dir||'right';if(d==='left')arrow(h.x+5,sc.floor-22,'left',P.Y);else if(d==='right')arrow(h.x+h.w-6,sc.floor-22,'right',P.Y);else if(d==='down')arrow(h.x+h.w/2,h.y+Math.min(10,h.h/2),'down',P.Y);else arrow(h.x+h.w/2,h.y+10,'up',P.Y);}
    else if(T<hintUntil&&Math.floor(T*4)%2===0){X.strokeStyle=P.Y;X.lineWidth=1;X.strokeRect(h.x+0.5,h.y+0.5,h.w-1,h.h-1);}});
  if(verbHot){const h=verbHot;X.strokeStyle=P.W;X.lineWidth=1;X.strokeRect(h.x+0.5,h.y+0.5,h.w-1,h.h-1);}
  if(modal!=='title')drawHero();X.restore();}
let lastDraw=0;
function frame(ms){if(ms-lastDraw<30){requestAnimationFrame(frame);return;}lastDraw=ms;const t=ms/1000,dt=Math.min(0.08,t-last);last=t;T=t;update(dt);
  X.save();try{draw();}finally{X.restore();}
  requestAnimationFrame(frame);}

// ── layout ──
function fit(){const bar=$('bar'),W=innerWidth,H=innerHeight,bh=bar.offsetHeight||72;let w=Math.min(W,Math.floor((H-bh)*16/9));w=Math.max(200,w);
  $('stage').style.width=w+'px';$('stage').style.height=Math.round(w*9/16)+'px';bar.style.width=w+'px';
  document.body.className=W<H?'portrait':'';}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
document.addEventListener('contextmenu',e=>e.preventDefault());

Voice.init();fit();renderInv();titleCard();requestAnimationFrame(frame);
window.__game={exec(scr,id,verb,item){if(S.screen!==scr)gotoScreen(scr);const h=SCR().hotspots.find(x=>x.id===id&&cond(x.when));if(!h)return 'NOHOT '+scr+'.'+id;
    if(h.exit){gotoScreen(h.exit.to,h.exit.x);return 'exit';}if(item){sel=item;useItem(item,h);}else run((F('act3')&&h[verb+'3'])||h[verb]||[]);return this.drain();},
  drain(){let n=0;while(n++<400){if(cur){next();continue;}if(modal==='map'||modal==='keypad'||modal==='end'||modal==='death'||modal==='dying'||modal==='recipe'||modal==='bake'){if($('ov').className)closeOv();modal=null;hero.fx=null;continue;}break;}return 'ok';},
  vendPick,Mini,cookDish,cam:()=>cam,S:()=>S,hero,run,travel,gotoScreen,state:()=>({modal,cur,sel,walking:hero.walking,Q:Q.length})};

</script>
