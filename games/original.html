<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Baloo 2',cursive;display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-height:100vh;min-height:100dvh;background:#1a1a2e;overflow:hidden;

    text-shadow:2px 2px 0 #c0392b,4px 4px 0 #7b241c;letter-spacing:1px;cursor:pointer;}
  #ui-bar{display:flex;gap:clamp(4px,1.2vw,10px);font-size:clamp(0.65rem,1.9vw,0.95rem);
    font-weight:800;color:#fff;text-shadow:1px 1px 0 #333;flex-wrap:wrap;justify-content:center;}
  #ui-bar span.pill{background:rgba(0,0,0,0.35);padding:2px 10px;border-radius:20px;white-space:nowrap;}
  #gameCanvas{display:block;border-radius:14px;border:3px solid #fff;box-shadow:0 8px 40px rgba(0,0,0,0.6);
    width:min(calc(100vw - 12px),calc((100vh - 104px) * 1.905));
    width:min(calc(100vw - 12px),calc((100dvh - 104px) * 1.905));
    aspect-ratio:800/420;height:auto;cursor:grab;touch-action:none;}
  #bottom{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;padding:0 8px;}
  #message{font-size:clamp(0.65rem,1.8vw,0.9rem);font-weight:700;color:#fff;
    text-shadow:1px 1px 0 #333;min-height:1.4em;text-align:center;}
  #restartBtn{font-family:'Fredoka One',cursive;font-size:clamp(0.7rem,2vw,0.9rem);white-space:nowrap;

    transition:opacity 0.3s;z-index:99;text-align:center;line-height:1.25;}

    transition:opacity 0.3s;z-index:100;text-align:center;max-width:92vw;
    background:rgba(0,0,0,0.55);padding:6px 18px;border-radius:20px;}
  #hintBox{position:fixed;bottom:4px;right:8px;font-size:0.56rem;color:rgba(255,255,255,0.28);
    pointer-events:none;}

<body>
<div id="top">
  <a id="home" href="/games/">← Games</a>
  <div id="title">🐔 Cranky Chicken!</div>
  <div id="ui-bar">
    <span class="pill">⭐ <span id="score">0</span></span>
    <span class="pill">🏆 <span id="best">0</span></span>
    <span class="pill">🐔 x<span id="birds">0</span></span>
    <span class="pill">🌿 <span id="levelNum">1</span>/100</span>
    <span class="pill" id="breedTag">🐔 Cranky</span>
  </div>
</div>
<canvas id="gameCanvas" width="800" height="420"></canvas>
<div id="bottom">
  <div id="message">Pull back and let go! 🐔💥</div>
  <button id="restartBtn">🔄 Restart</button>
</div>
<div id="levelBanner"></div>
<div id="easterMsg"></div>
<div id="hintBox">Secrets: tap title 3x • tap chicken 5x • G or C</div>

<script>
// ═══ CRANKY CHICKEN — REDUX ═══════════════════════════════════════
// Same game: slingshot, five breeds, eight scenes, 100 levels, cow.
// Tightened: fixed 60Hz physics, real collisions, stacked targets,
// a chicken budget per level, pointer input, hit-stop + shake.
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const W=800,H=420,GROUND_Y=H-90,GRAVITY=0.45,POWER=0.16,MAX_PULL=120,STEP=1000/60;
const DPR=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*DPR;canvas.height=H*DPR;
const $=id=>document.getElementById(id);

// ── SOUND ──────────────────────────────────────────────────────────
let AC=null;
function unlockAudio(){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();}catch(e){}
}
function beep(freq,type,dur,vol,f0){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.connect(g);g.connect(AC.destination);o.type=type;
    if(f0){o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(freq,t+dur*0.6);}
    else o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start();o.stop(t+dur);}catch(e){}
}
const arp=(fs,gap)=>fs.forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.28,0.16),i*gap));
const sfx={
  launch: ()=>beep(180,'sawtooth',0.25,0.12,600),
  bounce: ()=>beep(90,'sine',0.2,0.13,200),
  hit:    ()=>beep(260,'square',0.15,0.14,80),
  smash:  ()=>beep(50,'sawtooth',0.35,0.2,300),
  thud:   ()=>beep(60,'sine',0.18,0.16,140),
  win:    ()=>arp([523,659,784,1047],110),
  lose:   ()=>arp([392,330,262],140),
  moo:    ()=>beep(160,'sine',0.6,0.18,200),
  giant:  ()=>beep(80,'sawtooth',0.5,0.22,40),
  shoot:  ()=>beep(500,'square',0.12,0.09,900),
};

// ── SCENES (fixed order, so level 12 is always level 12) ───────────
const SCENE_POOL=['spring','summer','autumn','winter','night','storm','mountain','mountain_snow'];
const SEASONS=(()=>{
  let a=20240607;
  const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const s=['spring','spring','summer','autumn','winter'];
  while(s.length<100){
    const b=[...SCENE_POOL];
    for(let i=b.length-1;i>0;i--){const j=r()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}
    if(b[0]===s[s.length-1])b.push(b.shift());
    s.push(...b);
  }
  return s.slice(0,100);
})();
const SCENE_EMOJI={spring:'🌸',summer:'☀️',autumn:'🍂',winter:'❄️',night:'🌙',storm:'⛈️',mountain:'⛰️',mountain_snow:'🏔️'};
function getSeason(){return SEASONS[Math.min(level-1,99)];}
function getPal(){return PAL[getSeason()]||PAL.spring;}

// ── LEVELS ─────────────────────────────────────────────────────────
// [width, height, toughness]
const TYPES={hay:[54,48,1],fence:[28,80,1],barrel:[44,56,2],trough:[70,36,2],crate:[50,50,2],windmill:[42,104,3]};
function lvlCfg(l){
  return{count:Math.min(3+Math.floor(l/3),12),hpCap:l<=6?1:l<=25?2:3,shoots:l>=8};
}

// ── STATE ──────────────────────────────────────────────────────────
const BREEDS=['normal','bomb','boomerang','freeze','fire'];
const BREED_NAMES={normal:'🐔 Cranky',bomb:'💣 Bomber',boomerang:'🌀 Boomerang',freeze:'❄️ Freezer',fire:'🔥 Fireball'};
const BREED_TIP={normal:'Cranky: a good solid WHACK.',bomb:'Bomber: blows up everything nearby!',
  boomerang:'Boomerang: flies through stuff, then comes back.',freeze:'Freezer: one touch and it shatters.',
  fire:'Fireball: burns through three things in a row.'};
const TRAIL_CLR={normal:'255,255,255',bomb:'255,110,60',boomerang:'180,120,255',freeze:'120,225,255',fire:'255,160,30'};
let score=0,best=0,birdsLeft=0,level=1,levelStartScore=0;
let phase='aim',settleT=0,combo=0;
let obstacles=[],particles=[],enemyShots=[],flameTrail=[],floats=[],timers=[];
let giantMode=false,cowVisible=false,cowAngle=0,cowTimer=0;
let clickCount=0,titleClicks=0,eggTO=null,bannerTO=null,cloudOff=0;
let hitStop=0,shake=0,flash=0,lastBreed='';
let drag=null;
const sling={x:110,y:305};
let chicken=null;
const cam={x:0,y:0,z:1};

function after(frames,fn){timers.push({t:frames,fn});}
function hud(){
  $('score').textContent=score;$('best').textContent=best;
  $('birds').textContent=birdsLeft;$('levelNum').textContent=level;
  if(chicken)$('breedTag').textContent=BREED_NAMES[chicken.breed];
}
function msg(t){$('message').textContent=t;}
function banner(html){
  const el=$('levelBanner');el.innerHTML=html;el.style.opacity=1;
  clearTimeout(bannerTO);bannerTO=setTimeout(()=>el.style.opacity=0,1500);
}
function easterMsg(txt){
  const el=$('easterMsg');el.textContent=txt;el.style.opacity=1;
  clearTimeout(eggTO);eggTO=setTimeout(()=>el.style.opacity=0,2600);
}
function addScore(n,x,y,label){
  score+=n;if(score>best)best=score;
  floats.push({x,y,txt:label||('+'+n),life:50,maxLife:50,vy:-1.1,size:label?18:14});
  hud();
}

function newChicken(){
  const unlocked=BREEDS.slice(0,Math.min(BREEDS.length,level));
  let breed;
  if(level<=BREEDS.length&&lastBreed!=='intro'+level){   // first chicken of a new breed's level shows it off
    breed=unlocked[unlocked.length-1];lastBreed='intro'+level;
    if(level>1)easterMsg('NEW! '+BREED_NAMES[breed]);
  }else breed=unlocked[Math.random()*unlocked.length|0];
  chicken={x:sling.x,y:sling.y,vx:0,vy:0,r:giantMode?50:22,flying:false,gone:false,
    sq:1,st:1,breed,t:0,slow:0,burns:0};
  flameTrail=[];combo=0;drag=null;phase='aim';
  obstacles.forEach(o=>{o.boomed=false;});
  msg(BREED_TIP[breed]);hud();
}

function mkObstacles(){
  obstacles=[];
  const cfg=lvlCfg(level);
  const pool=level<3?['hay','fence','barrel','trough']:
             level<5?['hay','fence','barrel','trough','crate']:
                     ['hay','fence','barrel','trough','crate','windmill'];
  const picked=[];
  for(let i=0;i<cfg.count;i++)picked.push(pool[i%pool.length]);
  for(let i=picked.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[picked[i],picked[j]]=[picked[j],picked[i]];}
  // five columns; each item goes on the shortest stack that still has headroom
  const cols=[0,1,2,3,4].map(i=>({cx:455+i*70,h:0,items:[],k:Math.random()}));
  picked.forEach(t=>{
    const h=TYPES[t][1];
    const fits=cols.filter(c=>c.h+h<=235);
    const c=(fits.length?fits:cols).slice().sort((a,b)=>a.h-b.h||a.k-b.k)[0];
    c.items.push(t);c.h+=h;
  });
  let n=0;
  cols.forEach(c=>{
    c.items.sort((a,b)=>TYPES[b][0]-TYPES[a][0]);   // widest on the bottom
    let y=GROUND_Y;
    c.items.forEach(t=>{
      const [w,h,tough]=TYPES[t];y-=h;
      const hp=Math.min(tough,cfg.hpCap);
      obstacles.push({type:t,x:c.cx-w/2,y,w,h,hp,maxHp:hp,wobble:0,spin:0,vy:0,boomed:false,falling:false,
        deathTimer:0,gone:false,frozen:false,frozenTimer:0,onFire:false,
        shoots:cfg.shoots&&(n++%3===0),shootTimer:90+(Math.random()*90|0)});
    });
  });
}

function startLevel(){
  timers=[];enemyShots=[];particles=[];
  mkObstacles();
  const totalHp=obstacles.reduce((s,o)=>s+o.maxHp,0);
  birdsLeft=Math.max(4,Math.min(10,Math.ceil(totalHp*0.4)+2));
  levelStartScore=score;
  newChicken();saveProgress();
  if(level===8)easterMsg('😤 The grumpy ones throw corn now!');
}

// ── INPUT (pointer events: mouse, touch, pen) ──────────────────────
function getPos(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
canvas.addEventListener('pointerdown',e=>{
  unlockAudio();e.preventDefault();
  if(phase!=='aim'||drag)return;
  const p=getPos(e);
  // drag from anywhere — your finger doesn't have to cover the chicken
  drag={id:e.pointerId,sx:p.x,sy:p.y,onBird:Math.hypot(p.x-sling.x,p.y-sling.y)<60,moved:0};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const p=getPos(e);
  let dx=p.x-drag.sx,dy=p.y-drag.sy;const d=Math.hypot(dx,dy);
  drag.moved=Math.max(drag.moved,d);
  if(d>MAX_PULL){dx=dx/d*MAX_PULL;dy=dy/d*MAX_PULL;}
  chicken.x=sling.x+dx;chicken.y=sling.y+dy;
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(phase!=='aim')return;
  const pull=Math.hypot(chicken.x-sling.x,chicken.y-sling.y);
  if(pull<14||e.type==='pointercancel'){
    chicken.x=sling.x;chicken.y=sling.y;
    if(d.onBird&&d.moved<14&&++clickCount>=5){clickCount=0;toggleGiant();}
    return;
  }
  chicken.vx=(sling.x-chicken.x)*POWER;
  chicken.vy=(sling.y-chicken.y)*POWER;
  chicken.flying=true;phase='flying';
  birdsLeft--;hud();sfx.launch();
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

$('title').addEventListener('click',()=>{
  unlockAudio();
  if(++titleClicks>=3){titleClicks=0;showCow();}
});
let restartArmed=0;
function askRestart(){
  const b=$('restartBtn');
  if(phase==='gameover'||Date.now()<restartArmed){restartArmed=0;b.textContent='🔄 Restart';restart();return;}
  restartArmed=Date.now()+2500;b.textContent='Back to level 1? Tap again';
  setTimeout(()=>{if(restartArmed&&Date.now()>=restartArmed){restartArmed=0;b.textContent='🔄 Restart';}},2600);
}
$('restartBtn').addEventListener('click',()=>{unlockAudio();askRestart();});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r')askRestart();
  if(k==='g'){unlockAudio();toggleGiant();}
  if(k==='c'){unlockAudio();showCow();}
});

// ── EASTER EGGS ────────────────────────────────────────────────────
function toggleGiant(){
  giantMode=!giantMode;
  if(chicken&&!chicken.flying)chicken.r=giantMode?50:22;
  sfx.giant();
  easterMsg(giantMode?'💥 GIANT CHICKEN ACTIVATED!! 💥':'🐔 Back to normal...');
}
function showCow(){
  cowVisible=true;cowTimer=320;sfx.moo();
  easterMsg('🐄 A WILD DANCING COW APPEARS! MOO!!');
}

// ── FX ─────────────────────────────────────────────────────────────
function burst(x,y,color,n,spd,life,r0){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*(spd||7),vy:(Math.random()-0.5)*(spd||7),
    life:life||35,maxLife:life||35,color:typeof color==='function'?color(i):color,r:(r0||3)+Math.random()*4});
}
const EXPLODE_CLR=['#FFD700','#ff6600','#ff2200','#fff','#ffcc00'];
function spawnExplode(x,y){burst(x,y,i=>EXPLODE_CLR[i%5],22,14,45,5);}
function spawnDust(x,y,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,
    life:22,maxLife:22,color:'#c8a050',r:3+Math.random()*4});
}
function spawnIce(x,y){burst(x,y,()=>`hsl(${180+Math.random()*40},80%,80%)`,12,6,30);}
function spawnFire(x,y){
  for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-0.5)*9,vy:-Math.random()*8,
    life:35,maxLife:35,color:`hsl(${Math.random()*40},100%,55%)`,r:4+Math.random()*6});
}
const GLYPHS=['⭐','💥','✨','💫','❗'];
function stars(x,y){
  for(let i=0;i<3;i++)floats.push({x:x+(Math.random()-0.5)*40,y:y-10-Math.random()*20,
    txt:GLYPHS[Math.random()*GLYPHS.length|0],life:40,maxLife:40,vx:(Math.random()-0.5)*2,vy:-1.5-Math.random()*1.5,size:22,g:0.08});
}

// ── OBSTACLE EVENTS ────────────────────────────────────────────────
function kill(o,t){o.hp=0;o.deathTimer=Math.max(1,t|0);}
function damage(o,n,clr){
  const cx=o.x+o.w/2,cy=o.y+o.h/2;
  o.hp-=n;o.wobble=22;sfx.hit();
  burst(cx,cy,clr,10);stars(cx,o.y);addScore(50,cx,o.y);
  if(o.hp<=0)kill(o,24);
}
function freezeObs(o){
  o.frozen=true;kill(o,45);o.frozenTimer=45;o.wobble=0;sfx.hit();
  spawnIce(o.x+o.w/2,o.y+o.h/2);stars(o.x+o.w/2,o.y);addScore(80,o.x+o.w/2,o.y);
}
function ignite(o){
  o.onFire=true;kill(o,35);sfx.hit();
  spawnFire(o.x+o.w/2,o.y+o.h/2);stars(o.x+o.w/2,o.y);addScore(80,o.x+o.w/2,o.y);
}
function explode(x,y){
  obstacles.forEach(o=>{
    if(o.deathTimer>0)return;
    const d=Math.hypot(o.x+o.w/2-x,o.y+o.h/2-y);
    if(d<130)kill(o,3+d/14);          // ripples outward
  });
  spawnExplode(x,y);spawnExplode(x-35,y-25);spawnExplode(x+35,y-25);
  for(let i=0;i<20;i++){const a=i/20*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:20,maxLife:20,color:'#FFD700',r:6});}
  flash=0.55;shake=16;hitStop=4;sfx.smash();
  chicken.gone=true;settle();
}

// ── SIMULATION (fixed 60Hz steps) ──────────────────────────────────
function settle(){chicken.flying=false;phase='settle';settleT=0;}

function stepChicken(){
  const c=chicken;
  if(!c.flying){c.sq+=(1-c.sq)*0.18;c.st+=(1-c.st)*0.18;return;}
  c.t++;
  c.vy+=GRAVITY;
  if(c.breed==='boomerang'){
    if(c.vy>0)c.vx-=0.35;
    flameTrail.push({x:c.x,y:c.y,life:18,maxLife:18,r:5,color:'#aa66ff'});
  }else if(c.breed==='fire'){
    for(let i=0;i<3;i++)flameTrail.push({x:c.x+(Math.random()-0.5)*16,y:c.y+(Math.random()-0.5)*16,
      life:30,maxLife:30,r:16+Math.random()*12,color:`hsl(${Math.random()*40},100%,${50+Math.random()*20}%)`});
  }else if(c.breed==='bomb'){
    c.r=Math.min(c.r+0.25,giantMode?70:42);
    flameTrail.push({x:c.x+(Math.random()-0.5)*c.r,y:c.y+(Math.random()-0.5)*c.r,
      life:16,maxLife:16,r:c.r*0.6+Math.random()*6,color:Math.random()>0.5?'#ff6600':'#ffcc00'});
  }else if(c.breed==='freeze'){
    flameTrail.push({x:c.x,y:c.y,life:20,maxLife:20,r:6+Math.random()*4,color:'#aaeeff'});
  }
  c.x+=c.vx;c.y+=c.vy;
  c.sq+=(1-c.sq)*0.18;c.st+=(1-c.st)*0.18;

  if(c.y+c.r>=GROUND_Y&&c.vy>0){               // vy>0: a low pull-back may start below the grass line
    c.y=GROUND_Y-c.r;
    const spd=Math.abs(c.vy);
    if(c.breed==='bomb'&&spd>2){explode(c.x,c.y);return;}
    c.vy*=-0.55;c.vx*=0.8;
    if(spd>3){c.sq=1.5;c.st=0.6;sfx.bounce();spawnDust(c.x,GROUND_Y,8);}
  }

  for(const o of obstacles){
    if(o.deathTimer>0)continue;               // already going — fly through the wreckage
    const qx=Math.max(o.x,Math.min(c.x,o.x+o.w)),qy=Math.max(o.y,Math.min(c.y,o.y+o.h));
    const dx=c.x-qx,dy=c.y-qy,d=Math.hypot(dx,dy);
    if(d>=c.r)continue;
    if(c.breed==='bomb'){explode(c.x,c.y);return;}
    if(c.breed==='boomerang'){if(!o.boomed){o.boomed=true;damage(o,1,'#aa66ff');}continue;}   // one whack each, no stopping
    if(c.breed==='fire'){                     // burns through three things, then fizzles out
      ignite(o);c.vx*=0.7;c.vy*=0.5;
      if(++c.burns>=3){burst(c.x,c.y,'#888',14,5,30);c.gone=true;settle();return;}
      continue;}
    // solid hit: push out along the contact normal, then bounce
    let nx,ny,pen;
    if(d>0.001){nx=dx/d;ny=dy/d;pen=c.r-d;}
    else{
      const l=c.x-o.x,r=o.x+o.w-c.x,t=c.y-o.y,b=o.y+o.h-c.y,m=Math.min(l,r,t,b);
      if(m===t){nx=0;ny=-1;pen=t+c.r;}else if(m===l){nx=-1;ny=0;pen=l+c.r;}
      else if(m===r){nx=1;ny=0;pen=r+c.r;}else{nx=0;ny=1;pen=b+c.r;}
    }
    c.x+=nx*pen;c.y+=ny*pen;
    const vn=c.vx*nx+c.vy*ny;
    if(vn>=0)continue;
    c.vx-=1.4*vn*nx;c.vy-=1.4*vn*ny;c.vx*=0.9;
    if(-vn<2.5)continue;                       // resting or rolling: no damage
    if(c.breed==='freeze'){freezeObs(o);c.vy=Math.min(c.vy,-3);}
    else damage(o,(-vn>13||giantMode)?2:1,obsClr(o.type));
    c.sq=1.4;c.st=0.65;hitStop=5;shake=Math.max(shake,6);
  }

  c.slow=Math.hypot(c.vx,c.vy)<1.3?c.slow+1:0;
  if(c.slow>18||c.t>480||c.x>W+90||c.x<-90)settle();
}

function stepObstacles(){
  let removed=false;
  for(const o of obstacles){
    if(o.type==='windmill')o.spin+=0.03+level*0.001;
    const cx=o.x+o.w/2,cy=o.y+o.h/2;
    if(o.deathTimer>0){
      o.deathTimer--;
      o.wobble=o.frozen?0:6+Math.sin(o.deathTimer*1.2)*8;
      if(o.frozen)o.frozenTimer=o.deathTimer;
      if(o.onFire&&o.deathTimer%4===0)spawnFire(cx,cy);
      if(o.deathTimer===0){
        o.gone=removed=true;combo++;
        sfx.smash();spawnExplode(cx,cy);if(o.frozen)spawnIce(cx,cy);
        shake=Math.max(shake,5);
        const m=Math.min(combo,5);addScore(150*m,cx,o.y-14,m>1?`+${150*m}  x${m}!`:null);
      }
      continue;
    }
    if(o.wobble>0)o.wobble--;
    // gravity: rest on the ground or on whatever is still underneath
    let floor=GROUND_Y;
    for(const p of obstacles){
      if(p===o||p.gone)continue;
      if(p.x<o.x+o.w-2&&p.x+p.w>o.x+2&&p.y>=o.y+o.h-0.5)floor=Math.min(floor,p.y);
    }
    if(o.y+o.h<floor-0.5){
      o.falling=true;o.vy+=0.6;o.y+=o.vy;
      if(o.y+o.h>=floor){
        o.y=floor-o.h;
        if(o.vy>3){spawnDust(cx,floor,6);sfx.thud();shake=Math.max(shake,3);o.wobble=12;}
        o.vy=0;o.falling=false;
      }
    }else{o.falling=false;o.vy=0;}
    if(o.shoots&&chicken.flying&&--o.shootTimer<=0){
      o.shootTimer=110+(Math.random()*80|0);
      const tx=chicken.x-cx,ty=chicken.y-cy,ld=Math.hypot(tx,ty)||1;
      enemyShots.push({x:cx,y:cy,vx:tx/ld*4.8,vy:ty/ld*4.8,r:7,life:100});
      sfx.shoot();
    }
  }
  if(removed)obstacles=obstacles.filter(o=>!o.gone);
}

function stepShots(){
  for(const s of enemyShots){
    s.x+=s.vx;s.y+=s.vy;s.vy+=GRAVITY*0.2;s.life--;
    if(s.y>GROUND_Y)s.life=0;
    if(chicken.flying&&Math.hypot(s.x-chicken.x,s.y-chicken.y)<chicken.r+s.r){
      s.life=0;chicken.vx+=s.vx*0.6;chicken.vy+=s.vy*0.6;
      sfx.hit();shake=Math.max(shake,4);easterMsg('😤 They shot back!! SO RUDE!');
    }
  }
  enemyShots=enemyShots.filter(s=>s.life>0);
}

function stepFx(){
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;}
  particles=particles.filter(p=>p.life>0);
  for(const f of flameTrail)f.life--;
  flameTrail=flameTrail.filter(f=>f.life>0);
  for(const f of floats){f.x+=f.vx||0;f.y+=f.vy;f.vy+=f.g||0;f.life--;}
  floats=floats.filter(f=>f.life>0);
  shake*=0.86;if(shake<0.3)shake=0;
  flash*=0.88;if(flash<0.02)flash=0;
  cloudOff=(cloudOff+0.12)%W;
  if(cowVisible){cowAngle+=0.08;if(--cowTimer<=0)cowVisible=false;}
  // camera: a gentle lean toward the action, never hiding the targets
  const tz=phase==='flying'?1.1:1;
  const tx=phase==='flying'?Math.min(0,Math.max(W-W*tz,W/2-chicken.x*tz)):0;
  const ty=phase==='flying'?Math.min(0,Math.max(H-H*tz,H/2-chicken.y*tz+40)):0;
  cam.x+=(tx-cam.x)*0.08;cam.y+=(ty-cam.y)*0.08;cam.z+=(tz-cam.z)*0.08;
}

function resolve(){
  if(!obstacles.length){
    const bonus=birdsLeft*100;
    if(bonus)addScore(bonus,W/2,150,`🐔 x${birdsLeft} left  +${bonus}`);
    sfx.win();
    if(level>=100){
      phase='gameover';saveProgress();
      msg('👑 YOU BEAT ALL 100 LEVELS!! ULTIMATE CRANKY CHICKEN LEGEND!! 🐔🏆');
      banner('👑 LEGEND! 👑<br>🐔🐔🐔');
      return;
    }
    phase='levelwin';level++;hud();
    const s=getSeason();
    banner(`LEVEL ${level}! ${SCENE_EMOJI[s]||'🌿'}`);
    after(80,startLevel);
  }else if(birdsLeft<=0){
    phase='retry';score=levelStartScore;hud();sfx.lose();
    banner('SO CLOSE! 😤<br>Try again!');msg('Out of chickens — same level, fresh farm.');
    after(85,startLevel);
  }else{
    phase='between';after(18,newChicken);
  }
}

function step(){
  for(const t of timers)t.t--;
  const due=timers.filter(t=>t.t<=0);timers=timers.filter(t=>t.t>0);
  due.forEach(t=>t.fn());
  stepFx();
  if(hitStop>0){hitStop--;return;}             // the WHACK hangs in the air
  stepChicken();stepObstacles();stepShots();
  if(phase==='settle'){
    settleT++;
    if(settleT>14&&obstacles.every(o=>o.deathTimer<=0&&!o.falling))resolve();
  }
}

// ── SAVE ───────────────────────────────────────────────────────────
function saveProgress(){
  try{localStorage.setItem('crankyChicken',JSON.stringify({level,score:levelStartScore,best}));}catch(e){}
}
function loadProgress(){
  try{
    const d=JSON.parse(localStorage.getItem('crankyChicken')||'{}');
    if(d.level){level=Math.max(1,Math.min(100,d.level|0));score=d.score|0;best=d.best|0;return true;}
  }catch(e){}
  return false;
}
function restart(){
  score=0;level=1;giantMode=false;cowVisible=false;clickCount=0;titleClicks=0;lastBreed='';
  floats=[];startLevel();
  msg('Pull back and let go! 🐔💥');
}

  if(season==='winter'){ctx.font='11px serif';[[70,90],[190,70],[380,110],[580,85],[740,100]].forEach(([lx,ly])=>{
    ctx.fillText('❄️',lx,(ly+Date.now()*0.012+lx*2)%GROUND_Y+20);});}
  if(season==='spring'){ctx.font='12px serif';[[160,140],[370,100],[620,160]].forEach(([lx,ly])=>{
    const wave=Math.sin(Date.now()*0.0015+lx)*10;ctx.fillText('🌸',lx+wave,(ly+Date.now()*0.018+lx)%GROUND_Y+20);});}
  if(season==='storm'){

      const ry=(i*97+Date.now()*0.5)%(GROUND_Y+20);
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-4,ry+14);ctx.stroke();

    [[80,50,1.6],[300,30,1.4],[540,55,1.5],[720,35,1.2]].forEach(([cx,cy,sc2])=>{
      ctx.save();ctx.translate(cx,cy);ctx.scale(sc2,sc2);

        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();});ctx.restore();});
    // Lightning flash (random)
    if(Math.random()<0.008){
      ctx.fillStyle='rgba(255,255,200,0.18)';ctx.fillRect(0,0,W,GROUND_Y);

  if(phase==='aim'||drag){
    ctx.beginPath();ctx.moveTo(sling.x-13,sling.y-20);ctx.lineTo(chicken.x,chicken.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sling.x+13,sling.y-20);ctx.lineTo(chicken.x,chicken.y);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(sling.x-13,sling.y-20);ctx.lineTo(sling.x+13,sling.y-20);ctx.stroke();}
}
function drawChicken(x,y){
  ctx.save();ctx.translate(x,y);
  let sx=chicken.sq,sy=chicken.st;
  if(chicken.flying){
    const spd=Math.sqrt(chicken.vx**2+chicken.vy**2);
    const s=Math.min(spd/20,0.45);sx=1+s*0.45;sy=1-s*0.28;
  }
  ctx.scale(sx,sy);
  if(chicken.flying) ctx.rotate(Math.atan2(chicken.vy,chicken.vx)+0.25);
  const r=chicken.r,c=r/22;
  const breed=chicken.breed||'normal';
  const bodyClr={normal:'#F5E642',bomb:'#cc2200',boomerang:'#9955ff',freeze:'#88ddff',fire:'#ff6600'}[breed];
  const strokeClr={normal:'#c8a800',bomb:'#880000',boomerang:'#6622cc',freeze:'#4499cc',fire:'#cc3300'}[breed];
  if(giantMode){ctx.shadowColor='#FFD700';ctx.shadowBlur=22;}
  if(breed==='fire'){ctx.shadowColor='#ff4400';ctx.shadowBlur=16;}
  if(breed==='freeze'){ctx.shadowColor='#88ddff';ctx.shadowBlur=12;}
  if(breed==='bomb'){ctx.shadowColor='#ff2200';ctx.shadowBlur=10;}
  if(breed==='boomerang'){ctx.shadowColor='#aa66ff';ctx.shadowBlur=10;}
  ctx.fillStyle=bodyClr;ctx.beginPath();ctx.ellipse(0,0,r,r*0.82,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=strokeClr;ctx.lineWidth=2*c;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=bodyClr;ctx.beginPath();ctx.ellipse(4*c,4*c,13*c,8*c,0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bodyClr;ctx.beginPath();ctx.arc(18*c,-10*c,13*c,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=strokeClr;ctx.lineWidth=2*c;ctx.stroke();
  ctx.strokeStyle='#333';ctx.lineWidth=2.5*c;
  ctx.beginPath();ctx.moveTo(13*c,-18*c);ctx.lineTo(23*c,-22*c);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(21*c,-13*c,4*c,3*c,-0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(22*c,-14*c,1.2*c,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff8c00';
  ctx.beginPath();ctx.moveTo(29*c,-9*c);ctx.lineTo(37*c,-7*c);ctx.lineTo(29*c,-5*c);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(28*c,-3*c,5*c,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bodyClr;ctx.beginPath();
  ctx.moveTo(14*c,-22*c);ctx.bezierCurveTo(12*c,-33*c,20*c,-35*c,18*c,-22*c);
  ctx.bezierCurveTo(20*c,-32*c,27*c,-30*c,25*c,-22*c);ctx.fill();
  // Breed badge
  if(breed!=='normal'){ctx.font=`${11*c}px serif`;ctx.fillText({bomb:'💣',boomerang:'🌀',freeze:'❄️',fire:'🔥'}[breed],2*c,-4*c);}
  if(giantMode){ctx.shadowBlur=0;ctx.font=`${14*c}px serif`;
    ['⭐','✨','💫'].forEach((s,i)=>{const a=Date.now()*0.002+i*2.1;
      ctx.fillText(s,Math.cos(a)*r*1.4,Math.sin(a)*r*1.4);});}
  if(!chicken.flying){
    ctx.strokeStyle='#ff8c00';ctx.lineWidth=2.5*c;ctx.lineCap='round';
    const kick=Math.sin(Date.now()*0.006)*5;
    ctx.beginPath();ctx.moveTo(-5*c,14*c);ctx.lineTo(-8*c,(22+kick)*c);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8*c,(22+kick)*c);ctx.lineTo(-15*c,(22+kick)*c);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8*c,(22+kick)*c);ctx.lineTo(-8*c,(28+kick)*c);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5*c,14*c);ctx.lineTo(8*c,(22-kick)*c);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8*c,(22-kick)*c);ctx.lineTo(15*c,(22-kick)*c);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8*c,(22-kick)*c);ctx.lineTo(8*c,(28-kick)*c);ctx.stroke();}
  ctx.restore();
}

// ── OBSTACLES DRAW ─────────────────────────────────────────────────
function drawObstacles(){
  obstacles.forEach(obs=>{
    const wx=obs.wobble>0?Math.sin(obs.wobble*0.8)*4:0;
    const dmg=(obs.maxHp-obs.hp)/obs.maxHp;
    ctx.save();ctx.translate(obs.x+wx,0);

    if(obs.type==='hay'){
      const g=ctx.createLinearGradient(0,obs.y,0,obs.y+obs.h);
      g.addColorStop(0,'#f5c842');g.addColorStop(1,'#c8960c');
      ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,obs.y,obs.w,obs.h,7);ctx.fill();
      ctx.strokeStyle='#a07800';ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle='#e0b020';ctx.lineWidth=1.5;
      for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,obs.y+i*(obs.h/4));ctx.lineTo(obs.w,obs.y+i*(obs.h/4));ctx.stroke();}
      ctx.strokeStyle='#8B6914';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(obs.w/2,obs.y);ctx.lineTo(obs.w/2,obs.y+obs.h);ctx.stroke();
      if(dmg>0){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(8,obs.y+8);ctx.lineTo(18,obs.y+28);ctx.lineTo(6,obs.y+38);ctx.stroke();}
    }
    else if(obs.type==='fence'){
      ctx.fillStyle=dmg>0?'#a08050':'#c8a46a';ctx.fillRect(0,obs.y,obs.w,obs.h);
      ctx.strokeStyle='#8B6914';ctx.lineWidth=2;ctx.strokeRect(0,obs.y,obs.w,obs.h);
      ctx.fillStyle='#b8904a';ctx.beginPath();ctx.moveTo(0,obs.y);ctx.lineTo(obs.w/2,obs.y-12);ctx.lineTo(obs.w,obs.y);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#8B6914';ctx.lineWidth=2;
      [0.25,0.55,0.8].forEach(t=>{ctx.beginPath();ctx.moveTo(0,obs.y+obs.h*t);ctx.lineTo(obs.w,obs.y+obs.h*t);ctx.stroke();});
      if(dmg>0){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(4,obs.y+10);ctx.lineTo(20,obs.y+40);ctx.stroke();}
    }
    else if(obs.type==='barrel'){
      const bg=ctx.createLinearGradient(0,0,obs.w,0);
      bg.addColorStop(0,'#8B4513');bg.addColorStop(0.4,'#c07040');bg.addColorStop(1,'#6B3410');
      ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(0,obs.y,obs.w,obs.h,[obs.w/2,obs.w/2,5,5]);ctx.fill();
      ctx.strokeStyle='#4a2800';ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle='#444';ctx.lineWidth=3;
      [0.2,0.5,0.8].forEach(t=>{ctx.beginPath();ctx.moveTo(2,obs.y+obs.h*t);ctx.lineTo(obs.w-2,obs.y+obs.h*t);ctx.stroke();});
      ctx.fillStyle='#a06030';ctx.beginPath();ctx.ellipse(obs.w/2,obs.y+4,obs.w/2-2,7,0,0,Math.PI*2);ctx.fill();
      if(dmg>0){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(7,obs.y+8);ctx.lineTo(35,obs.y+38);ctx.stroke();}
    }
    else if(obs.type==='trough'){
      ctx.fillStyle='#7a8fa8';
      ctx.beginPath();ctx.moveTo(0,obs.y+10);ctx.lineTo(8,obs.y);ctx.lineTo(obs.w-8,obs.y);
      ctx.lineTo(obs.w,obs.y+10);ctx.lineTo(obs.w,obs.y+obs.h);ctx.lineTo(0,obs.y+obs.h);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#5a6f88';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='rgba(80,160,220,0.75)';ctx.fillRect(5,obs.y+13,obs.w-10,obs.h-18);
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(8,obs.y+15,13,4);
      ctx.fillStyle='#8B6914';ctx.fillRect(3,obs.y+obs.h,8,9);ctx.fillRect(obs.w-11,obs.y+obs.h,8,9);
    }
    else if(obs.type==='crate'){
      ctx.fillStyle=dmg>0?'#b8863a':'#d4a84b';ctx.fillRect(0,obs.y,obs.w,obs.h);
      ctx.strokeStyle='#8B6310';ctx.lineWidth=2;ctx.strokeRect(0,obs.y,obs.w,obs.h);
      ctx.strokeStyle='#a07830';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,obs.y);ctx.lineTo(obs.w,obs.y+obs.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(obs.w,obs.y);ctx.lineTo(0,obs.y+obs.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(obs.w/2,obs.y);ctx.lineTo(obs.w/2,obs.y+obs.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,obs.y+obs.h/2);ctx.lineTo(obs.w,obs.y+obs.h/2);ctx.stroke();
    }
    else if(obs.type==='windmill'){
      ctx.fillStyle='#c8a46a';ctx.fillRect(obs.w/2-5,obs.y,10,obs.h);
      ctx.strokeStyle='#8B6914';ctx.lineWidth=2;ctx.strokeRect(obs.w/2-5,obs.y,10,obs.h);
      ctx.save();ctx.translate(obs.w/2,obs.y+obs.h*0.26);ctx.rotate(obs.spin);
      ctx.fillStyle='#e8d5aa';ctx.strokeStyle='#a08830';ctx.lineWidth=1;
      for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);
        ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-5,-28);ctx.lineTo(5,-28);ctx.lineTo(4,0);ctx.closePath();
        ctx.fill();ctx.stroke();ctx.restore();}
      ctx.fillStyle='#a08830';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    if(obs.shoots&&obs.hp>0){ctx.font='11px serif';ctx.fillText('😤',obs.w/2-7,obs.y-6);}
    // Frozen tint — solid blue overlay
    if(obs.frozen&&obs.frozenTimer>0){
      ctx.fillStyle='rgba(100,200,255,0.55)';ctx.fillRect(0,obs.y,obs.w,obs.h);
      ctx.strokeStyle='#88eeff';ctx.lineWidth=2;ctx.strokeRect(0,obs.y,obs.w,obs.h);
      ctx.font='14px serif';ctx.textAlign='center';ctx.fillText('🧊',obs.w/2,obs.y+obs.h/2+5);ctx.textAlign='left';
    }
    // On fire tint — flickering orange
    if(obs.onFire&&obs.deathTimer>0){
      ctx.fillStyle=`rgba(255,${80+Math.random()*80},0,0.45)`;ctx.fillRect(0,obs.y,obs.w,obs.h);
      ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🔥',obs.w/2,obs.y+obs.h/2+5);ctx.textAlign='left';
    }
    ctx.restore();
  });
}

// ── COW ────────────────────────────────────────────────────────────
function drawCow(){
  if(!cowVisible) return;
  const cx=375,cy=GROUND_Y-55,bounce=Math.abs(Math.sin(cowAngle))*16;
  ctx.save();ctx.translate(cx,cy-bounce);
  ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.ellipse(0,0,38,24,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(-10,5,10,8,0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(14,-4,7,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.arc(42,-10,18,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(48,-14,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(49,-15,1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffb6c1';ctx.beginPath();ctx.ellipse(56,-7,8,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#cc8888';ctx.beginPath();ctx.arc(53,-7,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(59,-7,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5f5f0';ctx.beginPath();ctx.ellipse(36,-24,5,9,0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#c8a050';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(34,-27);ctx.lineTo(30,-38);ctx.stroke();
  ctx.beginPath();ctx.moveTo(42,-26);ctx.lineTo(46,-37);ctx.stroke();
  ctx.strokeStyle='#aaa';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-38,0);ctx.quadraticCurveTo(-55+Math.sin(cowAngle)*10,-10,-50,-20);ctx.stroke();
  ctx.strokeStyle='#888';ctx.lineWidth=5;ctx.lineCap='round';
  const kick=Math.sin(cowAngle)*20;
  [[-20,22,kick],[-8,22,-kick],[8,22,kick],[20,22,-kick]].forEach(([lx,ly,ang])=>{
    ctx.save();ctx.translate(lx,ly);ctx.rotate(ang*Math.PI/180);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,22);ctx.stroke();ctx.restore();});
  if(Math.sin(cowAngle)>0.55){
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.beginPath();ctx.roundRect(28,-56,58,27,8);ctx.fill();
    ctx.fillStyle='#333';ctx.font='bold 13px sans-serif';ctx.fillText('MOO! 🎉',33,-38);}
  ctx.restore();
}

// ── DRAW: AIM + FX ─────────────────────────────────────────────────
function drawTrajectory(){
  if(!drag||phase!=='aim')return;
  let vx=(sling.x-chicken.x)*POWER,vy=(sling.y-chicken.y)*POWER,px=chicken.x,py=chicken.y;
  if(Math.hypot(vx,vy)<14*POWER)return;
  const breed=chicken.breed,rgb=TRAIL_CLR[breed];
  for(let i=1;i<=66;i++){                      // same maths as the real flight
    vy+=GRAVITY;
    if(breed==='boomerang'&&vy>0)vx-=0.35;
    px+=vx;py+=vy;
    if((vy>0&&py>GROUND_Y-6)||px>W+20||px<-20)break;
    if(i%3)continue;
    ctx.fillStyle=`rgba(${rgb},${0.85-i/66*0.6})`;
    ctx.beginPath();ctx.arc(px,py,3.6-i/66*1.6,0,Math.PI*2);ctx.fill();
  }
}
function drawFlameTrail(){
  for(const f of flameTrail){
    const t=f.life/f.maxLife;
    ctx.globalAlpha=t*0.75;ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*t,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFloats(){
  ctx.textAlign='center';
  for(const f of floats){
    const t=f.life/f.maxLife;
    ctx.globalAlpha=Math.min(1,t*1.6);
    if(f.g){ctx.font=`${Math.round(f.size*(0.5+0.5*t))}px serif`;ctx.fillText(f.txt,f.x,f.y);}
    else{
      ctx.font=`bold ${f.size}px 'Fredoka One','Baloo 2',sans-serif`;
      ctx.lineWidth=4;ctx.strokeStyle='rgba(60,20,0,0.85)';ctx.lineJoin='round';
      ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle='#FFE033';ctx.fillText(f.txt,f.x,f.y);
    }
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawHpPips(){
  for(const o of obstacles){
    if(o.maxHp<2||o.deathTimer>0)continue;
    const y=o.y-(o.type==='fence'?20:o.shoots?22:9);
    for(let i=0;i<o.maxHp;i++){
      ctx.fillStyle=i<o.hp?'#fff':'rgba(0,0,0,0.35)';
      ctx.beginPath();ctx.arc(o.x+o.w/2+(i-(o.maxHp-1)/2)*9,y,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.stroke();
    }
  }
}
function drawEnemyShots(){
  ctx.font='16px serif';
  for(const s of enemyShots){ctx.globalAlpha=Math.min(1,s.life/30);ctx.fillText('🌽',s.x-8,s.y+6);}
  ctx.globalAlpha=1;
}

// ── MAIN LOOP ──────────────────────────────────────────────────────
function render(){
  const pal=getPal();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=pal.sky1;ctx.fillRect(0,0,W,H/2);       // backing, so shake never shows bare canvas
  ctx.fillStyle=pal.dirt;ctx.fillRect(0,H/2,W,H/2);
  const sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*(cam.x+sx),DPR*(cam.y+sy));
  drawBackground();drawSlingshot();drawTrajectory();
  drawObstacles();drawHpPips();drawEnemyShots();drawParticles();
  drawFlameTrail();drawCow();
  if(chicken&&!chicken.gone)drawChicken(chicken.x,chicken.y);
  drawFloats();
  if(flash){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=`rgba(255,210,80,${flash})`;ctx.fillRect(0,0,W,H);}
}
let lastT=0,acc=0;
function frame(now){
  acc+=Math.min(now-(lastT||now),100);lastT=now;
  let n=0;
  while(acc>=STEP&&n<5){step();acc-=STEP;n++;}
  if(n===5)acc=0;
  render();
  requestAnimationFrame(frame);
}
const resumed=loadProgress();
startLevel();
if(resumed&&level>1)msg(`Welcome back! Level ${level} 🐔`);
requestAnimationFrame(frame);
</script>
