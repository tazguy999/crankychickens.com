<script>
'use strict';
// MORTAL SQUAWKBAT — engine rewrite (fixed timestep, data-driven moves, AI personalities, tablet-first touch, room-code friend match)
const C=document.getElementById('c');let ctx=C.getContext('2d');const MAIN=ctx;
const W=640,H=400,GND=308,GRV=0.58,STEP=1000/60;
const FF="'Fredoka One','Fredoka',cursive";
let RS=1,TOUCH=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ── SAVE ──
const SAVE=(()=>{try{return JSON.parse(localStorage.getItem('cc_msb')||'{}')||{};}catch(e){return{};}})();
function save(){try{localStorage.setItem('cc_msb',JSON.stringify(SAVE));}catch(e){}}
function ev(n,p){try{if(window.gtag)gtag('event',n,p||{});}catch(e){}}
let mode=SAVE.mode==='chick'?'chick':'rooster';

// ── LAYOUT ──
function fit(){
  const vw=innerWidth,vh=innerHeight,portrait=vh>vw*1.05;
  const s=Math.min(vw/W,vh/H),cw=Math.floor(W*s),ch=Math.floor(H*s);
  C.style.width=cw+'px';C.style.height=ch+'px';
  C.style.left=Math.floor((vw-cw)/2)+'px';
  C.style.top=Math.floor(portrait?Math.min((vh-ch)/2,vh*0.07):(vh-ch)/2)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  C.width=Math.max(1,Math.round(cw*dpr));C.height=Math.max(1,Math.round(ch*dpr));
  RS=C.width/W;
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));fit();

// ── INPUT ──
const IN={left:false,right:false,up:false,dn:false,blk:false,p:false,k:false,s:false};
const BUF={p:0,k:0,s:0},BUFN=9;
const EDGE={};let TAP=null;
function press(a){ga();if(IN[a])return;IN[a]=true;EDGE[a]=true;if(a in BUF)BUF[a]=BUFN;}
function release(a){IN[a]=false;}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'dn',KeyS:'dn',KeyJ:'p',KeyK:'k',KeyL:'s',ShiftLeft:'blk',ShiftRight:'blk',KeyI:'blk'};
addEventListener('keydown',e=>{
  if(gst==='njoin'){netType(e);return;}
  const a=KEYMAP[e.code];
  if(a)e.preventDefault();
  if(e.repeat)return;
  if(a)press(a);
  if(e.code==='Enter'){EDGE.ok=true;ga();}
  if(e.code==='KeyP'||e.code==='Escape')EDGE.pause=true;
  if(e.code==='KeyM')EDGE.mute=true;
  if(e.code==='KeyH')EDGE.help=true;
  if(e.code==='KeyE')EDGE.mode=true;
  if(e.code==='KeyF')EDGE.friend=true;
});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)release(a);});
addEventListener('blur',()=>{for(const k in IN)IN[k]=false;});
C.addEventListener('pointerdown',e=>{
  ga();if(e.pointerType==='touch')TOUCH=true;
  const r=C.getBoundingClientRect();
  TAP={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
  e.preventDefault();
});
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')TOUCH=true;
  if(e.target===document.body||e.target===document.documentElement||e.target.id==='touch'){ga();if(!TAP)TAP={x:-1,y:-1};}
});
document.addEventListener('contextmenu',e=>e.preventDefault());
// thumb pad: slide without lifting
const pad=$('pad'),knob=$('knob');let padId=null;
function padMove(e){
  const r=pad.getBoundingClientRect();
  const dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  const set=(a,v)=>{if(v)press(a);else release(a);};
  set('left',dx<-0.28);set('right',dx>0.28);set('up',dy<-0.52);set('dn',dy>0.45);
  const m=Math.hypot(dx,dy),k=m>1?1/m:1;
  knob.style.transform='translate('+(dx*k*65)+'%,'+(dy*k*65)+'%)';
}
pad.addEventListener('pointerdown',e=>{TOUCH=true;ga();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId);}catch(_){ }padMove(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e);});
function padUp(e){if(e.pointerId!==padId)return;padId=null;['left','right','up','dn'].forEach(release);knob.style.transform='';}
pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);
document.querySelectorAll('[data-a]').forEach(b=>{
  const a=b.dataset.a;
  b.addEventListener('pointerdown',e=>{TOUCH=true;press(a);b.classList.add('on');e.preventDefault();});
  const up=()=>{release(a);b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
const anyOk=()=>!!(EDGE.ok||EDGE.p||EDGE.k||EDGE.s);

// ── AUDIO ──
let AC=null,MG=null,NB=null,muted=!!SAVE.mute;
function ga(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);}
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
  return AC;
}
function bleep(f,ef,d,v=0.35,tp='square',t0=0){
  if(!AC||muted)return;
  try{const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=tp;o.connect(g);g.connect(MG);
  o.frequency.setValueAtTime(f,t);if(ef)o.frequency.exponentialRampToValueAtTime(ef,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d+0.05);}catch(e){}
}
function noise(d,v,fq=900,t0=0){
  if(!AC||muted)return;
  try{
    if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.5),AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter(),t=AC.currentTime+t0;
    s.buffer=NB;fl.type='lowpass';fl.frequency.value=fq;s.connect(fl);fl.connect(g);g.connect(MG);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.start(t);s.stop(t+d+0.02);
  }catch(e){}
}
function sfx(n){
  if(n==='hit'){bleep(220,65,0.08,0.34,'square');noise(0.07,0.3,1400);}
  else if(n==='heavy'){bleep(130,42,0.12,0.44,'sawtooth');noise(0.12,0.45,800);}
  else if(n==='whiff'){noise(0.07,0.1,2600);}
  else if(n==='spl'){bleep(55,380,0.12,0.45,'sawtooth');bleep(380,80,0.28,0.26,'sawtooth',0.1);}
  else if(n==='blk'){bleep(500,400,0.05,0.2,'square');noise(0.04,0.14,3000);}
  else if(n==='ko'){bleep(210,28,0.55,0.6,'sawtooth');noise(0.3,0.4,500);}
  else if(n==='ann'){[0,0.11,0.22].forEach((t,i)=>bleep([300,420,540][i],0,0.14,0.26,'sine',t));}
  else if(n==='roar'){bleep(28,18,1.2,0.55,'sawtooth');bleep(40,25,1.0,0.36,'sine',0.05);}
  else if(n==='freeze'){bleep(800,400,0.2,0.28,'sine');bleep(400,200,0.3,0.2,'sine',0.15);}
  else if(n==='ice'){bleep(900,1500,0.14,0.2,'sine');}
  else if(n==='cheer'){[0,0.1,0.2,0.32].forEach((t,i)=>bleep([350,440,550,420][i],0,0.18,0.24,'sine',t));}
  else if(n==='jump'){bleep(260,520,0.09,0.12,'sine');}
  else if(n==='thud'){noise(0.14,0.4,300);}
  else if(n==='tick'){bleep(660,0,0.04,0.14,'square');}
  else if(n==='ok'){bleep(440,0,0.07,0.2,'square');bleep(660,0,0.1,0.2,'square',0.07);}
  else if(n==='deny'){bleep(140,110,0.1,0.16,'square');}
  else if(n==='combo'){bleep(520,780,0.1,0.18,'triangle');}
  else if(n==='soul'){bleep(300,900,0.3,0.2,'sine');}
  else if(n==='poof'){noise(0.16,0.22,1800);bleep(700,200,0.14,0.14,'sine');}
}
function toggleMute(){muted=!muted;SAVE.mute=muted;save();ga();if(MG)MG.gain.value=muted?0:1;if(muted)stopSpeech();else sfx('tick');}
// tiny music loop, scheduled on the audio clock
const BASS=[110,0,110,165,0,110,196,165,98,0,98,147,0,98,175,147];
const LEAD=[440,0,523,0,659,0,523,440,0,392,0,440,0,523,0,0,392,0,466,0,587,0,466,392,0,349,0,392,0,466,0,0];
let musOn=false,musT=0,musI=0,musBoss=false;
function music(){
  if(!AC||muted||!musOn||AC.state!=='running')return;
  const spb=60/(musBoss?148:128)/2;
  if(musT<AC.currentTime)musT=AC.currentTime+0.05;
  let guard=0;
  while(musT<AC.currentTime+0.18&&guard++<8){
    const i=musI%32,t0=musT-AC.currentTime,b=BASS[i%16],l=LEAD[i],k=musBoss?0.94:1;
    if(b)bleep(b*k,0,spb*0.9,0.075,'triangle',t0);
    if(l)bleep(l*k,0,spb*0.7,0.028,'square',t0);
    if(i%4===0)bleep(90,40,0.09,0.11,'sine',t0);
    if(i%4===2)noise(0.03,0.035,6000,t0);
    musI++;musT+=spb;
  }
}

// ── VOICES ── same approach as the episodes: browser speech, a pitch/rate profile per speaker, voice picked by name hash
const VOICE_PROFILES={
  'ANNOUNCER':{pitch:0.45,rate:0.82},
  'SCRATCHY':{pitch:0.7,rate:0.95},
  'BELMONDO':{pitch:1.35,rate:1.05},
  'SUB-YOLK':{pitch:0.6,rate:0.8},
  'SHANG':{pitch:0.9,rate:0.8},
  'EL JAGUAR':{pitch:0.5,rate:0.85},
};
const VOICE_OF={scratchy:'SCRATCHY',belmondo:'BELMONDO',subyolk:'SUB-YOLK',shang:'SHANG',jaguar:'EL JAGUAR'};
const SAY_NAME={scratchy:'Scratchy Cage',belmondo:'Bawk Bawk Belmondo',subyolk:'Sub Yolk',shang:'Shang Squawk',jaguar:'El Jaguar'};
const HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
// Pin each character to an accent, so every device casts the same voices.
// The five accents and their order come from the reference phone (see /voice-check.html).
const CC_ACCENTS=['en-au','en-gb','en-in','en-ng','en-us'];
const CC_FALLBACK={'en-au':['en-gb','en-us'],'en-gb':['en-au','en-us'],'en-in':['en-gb','en-us'],'en-ng':['en-gb','en-in','en-us'],'en-us':['en-gb','en-au']};
function ccPickVoice(who,pool){
  if(!pool||!pool.length)return null;
  const h=Math.abs(who.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0));
  const want=CC_ACCENTS[h%CC_ACCENTS.length];
  const tries=[want].concat(CC_FALLBACK[want]||[]);
  for(const loc of tries){
    const m=pool.filter(v=>(v.lang||'').replace('_','-').toLowerCase()===loc);
    if(m.length)return m.find(v=>/google/i.test(v.name))||m[0];
  }
  return pool[h%pool.length];
}
let voicePool=[],sayHold=0;
function loadVoices(){try{voicePool=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.startsWith('en'));}catch(e){}}
if(HAS_TTS){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function say(who,text,minor){
  if(muted||!HAS_TTS)return;
  if(minor&&GF<sayHold)return;            // fighter shouts never cut off the announcer
  const clean=String(text).replace(/K\.O\./g,'kay oh').replace(/[^A-Za-z0-9 .,!?'-]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  if(!clean)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean),prof=VOICE_PROFILES[who]||{pitch:1,rate:1};
    u.pitch=prof.pitch;u.rate=prof.rate;u.volume=0.9;
    if(voicePool.length>0){const pv=ccPickVoice(who,voicePool);if(pv)u.voice=pv;}
    speechSynthesis.speak(u);
    if(!minor)sayHold=GF+55;
  }catch(e){}
}
function stopSpeech(){if(HAS_TTS)try{speechSynthesis.cancel();}catch(e){}}

  subyolk: {id:'subyolk',name:'SUB-YOLK',sub:'"Ice Ice Bawky"',col:'#2266ff',spd:4.0,jf:-13,ad:8,kd:13,sd:24,sp:'freeze',spn:'ICE YOLK!',tp:'arm',ac:'#2266ff'},
  shang:   {id:'shang',name:'SHANG TSQAWK',sub:'"Your soul... is showing"',col:'#aa44ff',spd:3.8,jf:-13,ad:9,kd:13,sd:26,sp:'soul',spn:'SOUL SWIPE!',tp:'arm',ac:'#aa44ff'},

  k2:{pose:'kick',su:7,ac:5,rc:19,d:c=>c.kd*1.15,box:[6,-50,70,46],hs:24,bs:14,kb:6.5,ky:-7,stop:10,hgt:'mid',launch:true,lunge:3.5,heavy:true},

  ck:{pose:'crouch',crouch:true,limb:'leg',su:9,ac:5,rc:21,d:c=>c.kd*0.85,box:[6,-20,72,20],hs:22,bs:13,kb:4,ky:-5.5,stop:8,hgt:'low',launch:true,heavy:true},
  ak:{pose:'kick',air:true,su:4,ac:99,rc:7,d:c=>c.kd*0.9,box:[0,-46,58,46],hs:19,bs:11,kb:4.5,stop:7,hgt:'mid',heavy:true},

  sp_tornado:{sp:true,pose:'idle',su:8,ac:30,rc:16,d:c=>c.sd/2.4,box:[-36,-84,72,84],multi:9,maxHits:3,lastLaunch:true,hs:16,bs:10,kb:2.2,ky:-6.5,stop:5,hgt:'mid',chip:true,

    }},

const PT=[];
function spark(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*5;PT.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:18,m:18,c:col||0});}}
function feathers(x,y,n,col){for(let i=0;i<n;i++)PT.push({k:'f',x,y,vx:(Math.random()-0.5)*7,vy:-2-Math.random()*4,l:64,m:64,r:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,c:col});}
function dust(x,y,n){for(let i=0;i<n;i++)PT.push({k:'d',x:x+(Math.random()-0.5)*22,y:y-2,vx:(Math.random()-0.5)*2.6,vy:-Math.random()*1.2,l:20,m:20});}
function ringFx(x,y,col){PT.push({k:'r',x,y,l:22,m:22,c:col});}
function pop(x,y,s,col,z){PT.push({k:'t',x:clamp(x,60,W-60),y:Math.max(96,y),vy:-1.2,l:44,m:44,s,c:col,z:z||20});}
function iceFx(x,y,n){for(let i=0;i<n;i++)PT.push({k:'i',x,y,vx:(Math.random()-0.5)*8,vy:-1-Math.random()*5,l:30,m:30});}
function wisp(x,y,tg){PT.push({k:'w',x,y,tg,l:42,m:42});}
function puff(x,y,col){for(let i=0;i<10;i++){const a=Math.random()*6.283,s=1+Math.random()*3;PT.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:22,m:22,c:col});}ringFx(x,y,col);}
function stepPT(){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];if(--p.l<=0){PT.splice(i,1);continue;}
    if(p.k==='s'){p.x+=p.vx;p.y+=p.vy;p.vx*=0.9;p.vy*=0.9;}
    else if(p.k==='f'){p.x+=p.vx+Math.sin(p.l*0.2)*0.6;p.y+=p.vy;p.vx*=0.94;p.vy=Math.min(1.1,p.vy+0.16);p.r+=p.vr;if(p.y>GND+4){p.y=GND+4;p.vr=0;p.vx=0;}}
    else if(p.k==='d'){p.x+=p.vx;p.y+=p.vy;}
    else if(p.k==='t'){p.y+=p.vy;p.vy*=0.94;}
    else if(p.k==='i'){p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;}
    else if(p.k==='w'){p.x+=(p.tg.x-p.x)*0.12;p.y+=(p.tg.y-46-p.y)*0.12;}
  }
  if(PT.length>260)PT.splice(0,PT.length-260);
}
function drawPT(){
  for(let i=0;i<PT.length;i++){
    const p=PT[i],a=p.l/p.m;
    if(p.k==='s'){ctx.globalAlpha=a;ctx.fillStyle=p.c||('hsl('+(38+(i*7)%20)+',100%,'+(52+a*26)+'%)');ctx.beginPath();ctx.arc(p.x,p.y,3*a+0.6,0,6.283);ctx.fill();}
    else if(p.k==='f'){ctx.globalAlpha=Math.min(1,a*2.2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,7,2.6,0,0,6.283);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();ctx.restore();}
    else if(p.k==='d'){ctx.globalAlpha=a*0.45;ctx.fillStyle='#c9b8ff';ctx.beginPath();ctx.arc(p.x,p.y,5*(1.4-a),0,6.283);ctx.fill();}
    else if(p.k==='r'){ctx.globalAlpha=a*0.8;ctx.strokeStyle=p.c;ctx.lineWidth=4*a+0.5;ctx.beginPath();ctx.arc(p.x,p.y,10+(1-a)*46,0,6.283);ctx.stroke();}
    else if(p.k==='i'){ctx.globalAlpha=a;ctx.fillStyle='#c8f2ff';ctx.beginPath();ctx.moveTo(p.x,p.y-4);ctx.lineTo(p.x+3,p.y+3);ctx.lineTo(p.x-3,p.y+2);ctx.closePath();ctx.fill();}
    else if(p.k==='w'){ctx.globalAlpha=a*0.9;ctx.fillStyle='#e0a8ff';ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.283);ctx.fill();ctx.globalAlpha=a*0.3;ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.283);ctx.fill();}
    else if(p.k==='t'){const sc=p.l>p.m-6?1+(p.l-(p.m-6))*0.09:1;ctx.globalAlpha=Math.min(1,a*3);ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);ctx.rotate(((p.m*7)%5-2)*0.03);ctx.font='bold '+p.z+'px '+FF;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.strokeText(p.s,0,0);ctx.fillStyle=p.c;ctx.fillText(p.s,0,0);ctx.restore();}
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}

function pushApart(a,b){

  if(Math.abs(a.y-b.y)>60)return;
  const MIN=46;let dx=a.x-b.x;if(Math.abs(dx)>=MIN)return;
  const s=dx>0?1:dx<0?-1:(a.fac>0?-1:1),p=(MIN-Math.abs(dx))/2;
  a.x=clamp(a.x+s*p,40,W-40);b.x=clamp(b.x-s*p,40,W-40);

}

function applyHit(a,d,m,px,py,dir){

  else if(m.launch||(m.lastLaunch&&last)||!d.gnd||a.combo>=5){d.set('down');d.downT=0;d.vx=dir*m.kb;d.vy=m.ky||-5.5;d.gnd=false;}
  else{d.set('hit');d.stun=m.hs;d.vx=dir*m.kb;}

}
function resolve(a,d){

const PROJ=[];let PID=0;

const AIP={
  scratchy:{react:16,agg:0.58,blk:0.45,sp:0.3,combo:0.5,jump:0.06,tell:8,reach:76},
  belmondo:{react:18,agg:0.6,blk:0.36,sp:0.4,combo:0.4,jump:0.03,tell:9,reach:70},
  subyolk: {react:17,agg:0.45,blk:0.5,sp:0.55,combo:0.4,jump:0.02,tell:9,zoner:true,reach:72},
  shang:   {react:13,agg:0.55,blk:0.6,sp:0.35,combo:0.65,jump:0.05,tell:7,reach:76},
  jaguar:  {react:9,agg:0.78,blk:0.5,sp:0.5,combo:0.85,jump:0.08,tell:5,rusher:true,reach:76},
};
function aiParams(key,md,ease){
  const b=AIP[key],e=md==='chick',k=Math.max(0.5,1-0.12*ease);
  return{zoner:!!b.zoner,rusher:!!b.rusher,reach:b.reach,
    react:Math.round(b.react*(e?1.3:1)*(1+0.12*ease)),agg:b.agg*(e?0.8:1)*k,blk:b.blk*(e?0.6:1)*k,
    combo:b.combo*(e?0.5:1)*k,pun:(0.2+b.combo*0.6)*(e?0.5:1)*k,sp:b.sp*(e?0.8:1),jump:b.jump,tell:b.tell+(e?(b.rusher?3:6):0)+Math.round(2*ease)};

class Brain{
  constructor(P){
    this.P=P;this.cd=24;this.intent='idle';this.iT=0;this.seen=0;this.seenP=0;this.blk=-1;this.chain=null;this.jumpAtk=false;this.pick='p1';this.prev='idle';this.punId=0;
    this.c={mx:0,up:false,dn:false,blk:false,btn:null,take(){this.btn=null;}};
  }
  think(me,o){
    const c=this.c,P=this.P;c.mx=0;c.up=false;c.dn=false;c.blk=false;c.btn=null;
    const dx=o.x-me.x,dist=Math.abs(dx),dir=dx>=0?1:-1;
    if(me.st==='attack'){
      const n=me.mv.next;
      if(n&&me.conn){
        if(this.chain===null)this.chain=Math.random()<P.combo;
        if(this.chain)c.btn=n.p?'p':(n.s&&me.spCD===0&&this.pick!=='k')?'s':n.k?'k':null;
      }
      return c;
    }
    this.chain=null;
    if(me.st==='jump'){if(this.jumpAtk&&me.vy>0&&dist<84){c.btn='k';this.jumpAtk=false;}return c;}
    if(!me.free()){this.prev=me.st;return c;}
    const prev=this.prev;this.prev=me.st;
    // just got hit or knocked down: cover up for a moment
    if((prev==='hit'||prev==='getup')&&Math.random()<P.blk+0.25){this.intent='guard';this.iT=14+Math.random()*12;}
    // punish a whiffed or blocked move the moment it starts recovering — no tell
    if(o.st==='attack'&&!o.mv.proj&&!o.mv.air&&o.t>o.mv.su+o.mv.ac&&o.mvId!==this.punId){
      this.punId=o.mvId;
      if(dist<P.reach+12&&Math.random()<P.pun){c.btn=o.isCrouching()?'k':'p';this.intent='idle';return c;}
    }
    // defend: decide once per incoming attack, after a reaction delay
    let threat=false;
    if(o.st==='attack'&&!o.mv.proj){
      if(o.mvId!==this.seen){this.seen=o.mvId;this.blk=Math.random()<P.blk?Math.round(P.react*0.4):-1;}
      threat=dist<(o.mv.box?o.mv.box[0]+o.mv.box[2]:60)+(o.mv.sp?150:44);
    }
    for(let i=0;i<PROJ.length;i++){
      const p=PROJ[i];if(p.o===me)continue;
      if(p.id!==this.seenP){this.seenP=p.id;this.blk=Math.random()<P.blk+0.2?Math.round(P.react*0.4):-1;}
      if(Math.abs(p.x-me.x)<130)threat=true;
    }
    if(threat&&(this.blk>=0||me.st==='block')){if(this.blk>0&&me.st!=='block')this.blk--;else{c.blk=true;return c;}}
    if(--this.cd<=0){this.cd=Math.max(4,Math.round(P.react*(0.6+Math.random()*0.8)));this.decide(me,o,dist);}

      case'guard':if(this.iT-->0)c.blk=true;else this.intent='idle';break;
      case'jumpin':c.up=true;c.mx=dir;this.jumpAtk=true;this.intent='idle';break;
      case'attack':me.startTell(this.pick,P.tell);this.intent='idle';break;
    }
    return c;
  }
  atk(me,n){this.intent='attack';this.pick=n==='sp'?'sp_'+me.ch.sp:n;}
  back(n){this.intent='retreat';this.iT=n;}
  choose(me,o,dist){
    const r=Math.random(),sp=me.ch.sp;
    if(me.spCD===0&&sp!=='pounce'&&r<this.P.sp*0.4)return'sp';
    const r2=Math.random();
    if(o.isCrouching()||dist>70)return r2<0.35?'ck':'k1';
    return r2<0.18?'ck':r2<0.5?'k1':'p1';
  }
  decide(me,o,dist){
    const P=this.P,r=Math.random(),ready=me.spCD===0,sp=me.ch.sp;
    if(o.st==='down'||o.st==='getup'){if(dist<120&&!P.rusher)this.back(12);else if(dist>100)this.intent='approach';else this.intent='idle';return;}
    const open=o.frozenT>0||o.st==='lag'||(o.st==='attack'&&!o.mv.air&&o.t>o.mv.su+o.mv.ac);
    if(open&&r<0.35+P.agg*0.65){if(dist<=P.reach+8)this.atk(me,o.frozenT>0?'p1':'k1');else this.intent='approach';return;}

      else{if(r<0.45)this.back(16);else if(ready&&r<0.45+P.sp*0.6)this.atk(me,'sp');else if(r>0.9)this.intent='approach';else this.intent='idle';}

    }

    else if(r<P.agg+(1-P.agg)*0.75){this.intent='guard';this.iT=12+Math.random()*14;}
    else this.intent='idle';
  }
}

    if(!netTick()){if(NET.wait>40&&hit('nquit'))toTitle();endStep();return false;}
  }
  const okIn=NET.on?(NC[0].ok||NC[1].ok):!!(anyOk()||TAP);
  GF++;gT++;updShake();hype*=0.965;
  if(boltT>0)boltT--;else if(Math.random()<0.012){bolt=[];let lx=60+Math.random()*520,ly=0;bolt.push([lx,ly]);while(ly<H*0.44){lx+=(Math.random()-0.5)*50;ly+=22+Math.random()*26;bolt.push([lx,ly]);}boltT=5;}

    case'title':
      if(hit('help')||EDGE.help)help=true;
      else if(hit('snd'))toggleMute();
      else if(hit('friend')||EDGE.friend){sfx('ok');NET.msg='';go('nmenu');}
      else if(anyOk()||TAP){sfx('ok');go('select');say('ANNOUNCER','Select your fighter!');}
      break;
    case'select':{
      if(EDGE.left&&selIdx>0){selIdx--;sfx('tick');}
      if(EDGE.right&&selIdx<SEL.length-1){selIdx++;sfx('tick');}
      let goNow=anyOk()||hit('fight');
      if(hit('mode')||EDGE.mode){mode=mode==='chick'?'rooster':'chick';sfx('tick');}
      else if(hit('back')){sfx('tick');go('title');break;}
      else if(TAP&&TAP.y>50&&TAP.y<318&&TAP.x>=0&&TAP.x<W){const i=clamp(Math.floor(TAP.x/(W/SEL.length)),0,SEL.length-1);if(i===selIdx)goNow=true;else{selIdx=i;sfx('tick');}}
      if(goNow)startLadder();
      break;}
    case'vs':
      if(gT===2)say('ANNOUNCER',SAY_NAME[k1()]+', versus, '+SAY_NAME[ladder[ladIdx]]+'!');
      if(gT===30&&CH[ladder[ladIdx]].boss)sfx('roar');
      if(gT>=170||(gT>30&&okIn))startRound();
      break;
    case'intro':
      p1.fr++;p2.fr++;stepPT();
      if(gT>=84)go('fight');
      break;
    case'fight':
      if(!NET.on&&(EDGE.pause||hit('pause'))){paused=true;for(const k in IN)IN[k]=false;break;}
      if(simFight(true))rndT--;
      if(p1.st==='ko'||p2.st==='ko'){go('ko');musOn=false;ann('K.O.!','#ff4444',70);}
      else if(rndT<=0){
        go('rndend');musOn=false;
        const fl=NET.on&&NET.me===1,a=fl?p2.hp>p1.hp:p1.hp>p2.hp,b=fl?p1.hp>p2.hp:p2.hp>p1.hp;
        ann(a?'TIME OUT — YOU WIN!':b?'TIME OUT — YOU LOSE!':'TIME OUT!',a?'#aaffaa':b?'#ff4444':'#ffcc02',100);after(120,endRound);
      }
      break;
    case'ko':
      simFight(false);
      if(gT>=88){
        const k1=p1.st==='ko',k2=p2.st==='ko';
        if(k1&&k2){ann('DOUBLE K.O.!','#ff8844',100);go('rndend');after(110,endRound);}
        else if(k2||NET.on){finW=k2?0:1;go('finish');ann('FINISH THE BIRD!','#ffcc02',180,NET.on&&finW!==NET.me?'Uh oh...':TOUCH?'Tap to finish':'Press any button');}
        else{go('rndend');after(50,endRound);}
      }
      break;
    case'finish':
      simFight(false);
      if((gT>25&&(NET.on?NC[finW].ok:okIn))||gT>200){dfr=0;go('dancer');sfx('cheer');hype=1;}
      break;
    case'dancer':
      dfr++;
      if(dfr===2)say('ANNOUNCER',(DANCES[(finW?p2:p1).key]||DANCES.scratchy).name);
      if(dfr===132)say('ANNOUNCER','Friendship!');
      if(dfr>=185||(dfr>50&&okIn))endRound();
      break;
    case'rndend':simFight(false);break;
    case'cont':
      if(hit('yes')||EDGE.ok||EDGE.p||EDGE.k){sfx('ok');rndNum=1;w1=w2=0;go('vs');}
      else if(hit('no')||EDGE.s||EDGE.pause)toTitle();
      break;
    case'gameover':if(gT>40&&(anyOk()||TAP))toTitle();break;
    case'victory':if(gT>70&&(anyOk()||TAP))toTitle();break;
    case'nmenu':
      if(hit('nhostb'))netHost();
      else if(hit('njoinb')){sfx('tick');NET.entry='';NET.msg='';go('njoin');}
      else if(hit('back')||EDGE.pause){sfx('tick');go('title');}
      break;
    case'nhost':
      if(NET.conn&&!NET.up&&++NET.cT>1200)NET.conn.hostDrop();
      if(hit('ncancel')||EDGE.pause){sfx('tick');netClose();go('nmenu');}
      break;
    case'njoin':
      if(hit('back')){sfx('tick');go('nmenu');}
      else if(hit('kdel')){NET.entry=NET.entry.slice(0,-1);sfx('tick');}
      else if(TAP)for(const ch of NETABC)if(hit('k'+ch)){netLetter(ch);break;}
      break;
    case'nconn':
      if(hit('ncancel')||EDGE.pause){sfx('tick');NET.host=true;netBack('');}
      else if(++NET.cT>1200)netJoinFail();
      break;
    case'nsel':
      if(hit('back')){toTitle();break;}
      if(NET.me===0&&gT%20===1)netSend({t:'pg',n:performance.now()});
      if(!NET.mr){
        if(EDGE.left&&selIdx>0){selIdx--;sfx('tick');}
        if(EDGE.right&&selIdx<SEL.length-1){selIdx++;sfx('tick');}
        let goNow=anyOk()||hit('fight');
        if(!goNow&&TAP&&TAP.y>50&&TAP.y<318&&TAP.x>=0&&TAP.x<W){const i=clamp(Math.floor(TAP.x/(W/SEL.length)),0,SEL.length-1);if(i===selIdx)goNow=true;else{selIdx=i;sfx('tick');}}
        if(goNow){NET.mr=true;NET.mp=selIdx;SAVE.sel=selIdx;save();sfx('ok');netSend({t:'pick',i:selIdx});netMaybeStart();}
      }
      break;
    case'netover':
      if(hit('nquit2'))toTitle();
      else if(gT>40&&(hit('nagain')||EDGE.ok)){sfx('ok');netSend({t:'again'});netToSelect();}
      break;
    case'nlost':if(gT>30&&(anyOk()||TAP))toTitle();break;
  }
  if(NET.on||gst==='netover')netAfter();
  endStep();
}

      txt(NET.on&&NET.me?'FRIEND':'YOU',175,H-72,12,'rgba(255,255,255,0.5)');txt(NET.on?(NET.me?'YOU':'FRIEND'):'CPU',465,H-72,12,'rgba(255,255,255,0.5)');
      break;}
    case'intro':case'fight':case'ko':case'finish':case'rndend':
      if(p1&&p2){drawArena(p2.ch.boss?(1-p2.hp/100)*0.18:0);drawHUD();drawAnn();}
      break;
    case'dancer':if(p1&&p2)drawDance(finW?p2:p1,finW?p1:p2,dfr);break;
    case'nmenu':case'nhost':case'njoin':case'nconn':case'nlost':drawLobby();break;
    case'netover':drawNetOver();break;
    case'cont':
      ctx.fillStyle='#000';ctx.fillRect(-12,-12,W+24,H+24);drawStars(0.8);
      txt('K.O.',W/2,116,46,'#ff3300','center',0,'#ff0000');
      txt('CONTINUE? ('+conts+' left)',W/2,172,22,'#ffcc02');
      ui('yes',W/2-190,206,180,54,'YES!','#aaffaa',24);ui('no',W/2+10,206,180,54,'QUIT','#ff8866',20);
      if(!TOUCH)txt('J continue · L quit',W/2,292,12,'rgba(255,255,255,0.4)');
      txt('The egg believes in you.',W/2,330,14,'rgba(255,255,255,0.55)');
      break;
    case'gameover':
      ctx.fillStyle='#000';ctx.fillRect(-12,-12,W+24,H+24);
      txt('GAME OVER',W/2,155,58,'#ff1100','center',W-40,'#ff0000');
      txt('The egg is disappointed.',W/2,215,16,'rgba(255,255,255,0.55)');
      txt(TOUCH?'Tap to return to title':'Press any button',W/2,275,14,'#ffcc02');
      break;
    case'victory':{
      ctx.fillStyle='#040018';ctx.fillRect(-12,-12,W+24,H+24);drawStars(1);
      for(let i=0;i<18;i++){ctx.fillStyle='hsl('+((GF*3+i*55)%360)+',100%,60%)';ctx.fillRect((Math.sin(GF*0.03+i*1.1)*W/2)+W/2-4,(GF*1.5+i*47)%H,5,8);}
      const b=Math.sin(GF*0.05)*3;
      txt('TOURNAMENT CHAMPION!',W/2,84+b,40,'#ffcc02','center',W-40,'#ffcc02');
      txt('EL JAGUAR: DEFEATED',W/2,120+b,20,'#aaffaa');
      ctx.save();ctx.translate(W/2,GND-10);ctx.scale(1.6,1.6);spriteKey(SEL[selIdx],GF,1,Math.floor(GF/30)%2?'punch':'idle');ctx.restore();
      txt(CH[SEL[selIdx]].name+(mode==='chick'?' · CHICK MODE':' · ROOSTER MODE'),W/2,338,13,'rgba(255,255,255,0.7)','center',W-40);
      txt('The egg is satisfied.',W/2,360,14,'rgba(255,255,255,0.55)');
      if(gT>70)txt(TOUCH?'Tap to play again':'Press any button to play again',W/2,384,12,'rgba(255,255,255,0.4)');
      break;}
  }
  ctx.restore();
  if(paused)drawPause();
  if(help)drawHelp();
  if(NET.on&&NET.wait>40&&!paused&&!help)drawWait();
  chrome();
}
// DOM chrome: touch controls only while fighting, HOME link only on the title
const touchEl=$('touch'),backEl=$('back'),splEl=$('bspl');let chromeKey='';
function chrome(){
  const fighting=gst==='intro'||gst==='fight'||gst==='ko';
  const key=(TOUCH&&fighting&&!paused&&!help?'t':'-')+(gst==='title'&&!help?'h':'-')+((NET.on&&NET.me?p2:p1)&&(NET.on&&NET.me?p2:p1).spCD>0?'c':'-');
  if(key===chromeKey)return;chromeKey=key;
  touchEl.hidden=key[0]!=='t';backEl.hidden=key[1]!=='h';splEl.classList.toggle('cd',key[2]==='c');
}

// ── MAIN LOOP ── fixed 60Hz simulation, render at whatever the display does
let acc=0,last=0,manual=false;
function frame(ts){
  if(!last)last=ts;
  let dt=ts-last;last=ts;if(dt>250)dt=250;if(dt<0)dt=0;
  acc+=dt;let n=0;
  while(acc>=STEP&&n<5){if(step()===false){acc=Math.min(acc,STEP*4);break;}acc-=STEP;n++;}
  if(n===5)acc=0;
  music();draw();
  if(!manual)requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSpeech();if(gst==='fight')paused=true;for(const k in IN)IN[k]=false;if(AC&&AC.state==='running')AC.suspend();}else{last=0;acc=0;if(WLwant)wake(true);}});
window.__msb={
  get s(){return{gst,gT,p1,p2,rndT,w1,w2,ladIdx,conts,mode,paused,help,BT,PT,PROJ,ladder,selIdx};},
  step,draw,frame,MV,CH,Brain,aiParams,Fighter,IN,EDGE,press,release,NET,netWire,
  setBot(f){BOT=f;},setManual(v){manual=v;},setMode(m){mode=m;},tap(x,y){TAP={x,y};},setSel(i){selIdx=i;}
};
if(document.fonts&&document.fonts.load)document.fonts.load("20px 'Fredoka One'").catch(()=>{});
requestAnimationFrame(frame);

</script>
