let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,v,tp,when){if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=tp;o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(f,when);g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(0.001,when+d);o.start(when);o.stop(when+d+0.02);}catch(e){}}
function noise(d,v,when){try{const a=ac(),buf=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,1.5);const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;s.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,when);s.start(when);}catch(e){}}
function sfx(n){if(muted)return;try{const a=ac(),t=a.currentTime;
  if(n==='bark'){tone(300,0.08,0.3,'square',t);tone(250,0.1,0.25,'square',t+0.1);}
  else if(n==='cluck'){[0,0.12,0.24].forEach((tt,i)=>tone([420,380,440][i],0.09,0.22,'square',t+tt));}
  else if(n==='pop'){tone(500,0.06,0.22,'square',t);}
  else if(n==='fanfare'){[0,0.14,0.28,0.42].forEach((tt,i)=>tone([392,494,587,784][i],0.22,0.2,'square',t+tt));}
  else if(n==='bloop'){[300,450,600].forEach((f,i)=>tone(f,0.09,0.14,'sine',t+i*0.09));}

  else if(n==='tick'){tone(900,0.035,0.16,'square',t);}

  else if(n==='whee'){tone(500,0.5,0.14,'sine',t);tone(900,0.5,0.12,'sine',t+0.15);tone(1300,0.4,0.1,'sine',t+0.3);}
  else if(n==='flutter'){[0,0.07,0.14,0.21,0.28].forEach(tt=>noise(0.05,0.1,t+tt));}
}catch(e){}}
function clamp01(v){return Math.max(0,Math.min(1,v));}

  dot:{body:'#ff8fc7',belly:'#ffd6ea',wing:'#e868a8',hat:'bow',comb:'#ffe14d',ph:2},

  mm:{body:'#b98cff',belly:'#e4d4ff',wing:'#9566e0',comb:'#ff3333',ph:1},

function miniFn(k){const m=MINI[k];return function(x,y,fr,fc,talk,walk,a,o){

function wrapText(text,max){
  const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{if((cur+' '+w).trim().length>max){lines.push(cur.trim());cur=w;}else cur+=' '+w;});
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
function bubble(x,y,who,text){

  ctx.font=`bold 9px ${FF}`;mw=Math.max(mw,ctx.measureText(who).width);
  const bw=Math.max(mw+24,70),bh=lines.length*17+26;

  try{window.gtag&&gtag('event','mini_game_win',{game:cur+1,stars:st});}catch(e){}
  paintTiles();}
function pick(n){cur=n;mode='intro';modeT=0;P.down=false;GAMES[cur].init();paintTiles();
  const w=document.getElementById('watchLink');w.href='/shows/minisodes.html#'+(cur+1);w.textContent='📺 Watch minisode '+(cur+1)+': '+MINI_TITLES[cur];
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}}
const MINI_TITLES=['The Corn Has Legs','The Mountain That Complains','The Ocean','Bus Number Kevin','Big Enough'];
function cardBG(c){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.12)';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc((i*97+fr_g*0.4)%700-30,60+((i*71)%300),14+(i%3)*10,0,Math.PI*2);ctx.fill();}}
function bigText(s,x,y,size){ctx.lineWidth=7;ctx.strokeStyle='#1a1024';ctx.lineJoin='round';ctx.font=`bold ${size}px ${FF}`;ctx.textAlign='center';ctx.strokeText(s,x,y);ctx.fillStyle='#fffdf2';ctx.fillText(s,x,y);ctx.textAlign='left';}
const BTN={again:[110,268,200,62],next:[330,268,200,62]};
function btn(r,label,bg){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.roundRect(r[0]+3,r[1]+4,r[2],r[3],16);ctx.fill();ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(r[0],r[1],r[2],r[3],16);ctx.fill();
  txt(label,r[0]+r[2]/2,r[1]+r[3]/2+8,22,'#1a1024',true);}
function inR(r,x,y){return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];}
function star(x,y,r,on){ctx.fillStyle=on?'#ffd400':'rgba(255,255,255,0.3)';ctx.strokeStyle='#1a1024';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();}
function frame(ts){
  if(lastTs===null)lastTs=ts;const dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;fr_g++;modeT+=dt;
  const g=GAMES[cur];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  if(mode==='intro'){cardBG(g.col);
    txt('MINI GAME '+(cur+1)+' OF '+GAMES.length,W/2,62,15,'rgba(26,16,36,0.75)',true);
    bigText(g.title,W/2,124,46);
    g.help.forEach((l,i)=>txt(l,W/2,176+i*28,19,'#1a1024',true));
    const p=1+Math.sin(modeT*5)*0.04;ctx.save();ctx.translate(W/2,286);ctx.scale(p,p);pill('TAP TO PLAY',0,0,'#fffdf2','#1a1024',26);ctx.restore();
    mini('pip',80,H-24,1.2,1,true);mini('dot',560,H-24,1.2,-1,true);mini('crumb',510,H-24,0.75,-1,true);
  }else{
    if(mode==='play')g.update(dt);
    if(mode!=='intro')g.draw();
    if(mode==='win'){ctx.fillStyle='rgba(16,36,28,0.72)';ctx.fillRect(0,0,W,H);
      bigText(cur===GAMES.length-1?'ALL FIVE! YOU DID IT!':'YOU DID IT!',W/2,96,cur===GAMES.length-1?38:50);
      for(let i=0;i<3;i++){const on=i<stars&&modeT>0.25+i*0.25;star(W/2-80+i*80,170,on?34+Math.max(0,0.25-(modeT-0.25-i*0.25))*40:30,on);}
      btn(BTN.again,'↻ AGAIN','#fffdf2');btn(BTN.next,cur===GAMES.length-1?'GAME 1 ▶':'NEXT GAME ▶','#ffd400');
      txt('Or watch the minisode this game came from (button below).',W/2,366,13,'rgba(255,255,255,0.8)');}
  }
  requestAnimationFrame(frame);
}
function pos(e){const r=C.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
C.addEventListener('pointerdown',e=>{e.preventDefault();ac();const [x,y]=pos(e);P.x=x;P.y=y;
  if(mode==='intro'){mode='play';modeT=0;GAMES[cur].init();sfx('bloop');return;}
  if(mode==='win'){if(modeT<0.6)return;if(inR(BTN.again,x,y))pick(cur),mode='play';else if(inR(BTN.next,x,y))pick((cur+1)%GAMES.length);return;}
  P.down=true;const g=GAMES[cur];if(g.tap)g.tap(x,y);});
C.addEventListener('pointermove',e=>{const [x,y]=pos(e);P.x=x;P.y=y;});
['pointerup','pointercancel','pointerleave'].forEach(n=>C.addEventListener(n,()=>{P.down=false;}));
C.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('muteBtn').addEventListener('click',()=>{muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇 SOUND: OFF':'🔊 SOUND: ON';});
function paintTiles(){const s=loadSave();document.querySelectorAll('#tiles button').forEach((b,i)=>{b.classList.toggle('on',i===cur);b.querySelector('i').textContent=s[i+1]?'★'.repeat(s[i+1]):'';});}
(function(){const t=document.getElementById('tiles');
  GAMES.forEach((g,n)=>{const b=document.createElement('button');const e=document.createElement('b');e.textContent=g.emoji;const s=document.createElement('span');s.textContent=(n+1)+'. '+g.title;const st=document.createElement('i');
    b.appendChild(e);b.appendChild(s);b.appendChild(st);b.addEventListener('click',()=>pick(n));t.appendChild(b);});
  const h=parseInt((location.hash||'').replace('#',''),10);pick(h>=1&&h<=GAMES.length?h-1:0);})();
requestAnimationFrame(frame);
</script>
<script src="/support.js" defer></script>
