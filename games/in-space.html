<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cranky Chickens: In Space</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  background:#000008;
  width:100%;height:100%;
  overflow:hidden;
  touch-action:none;
  font-family:'Nunito',sans-serif;
}

/* ── CANVAS: fills entire viewport ── */
#canvasWrap{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000008;
}
canvas#game{
  display:block;
  image-rendering:pixelated;
  touch-action:none;
  /* size set by JS to fill viewport maintaining aspect ratio */
}

/* ── MESSAGE OVERLAY ── */
#message{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,30,0.95);
  color:#ffcc02;font-family:'Fredoka One',cursive;
  font-size:clamp(12px,3.5vw,20px);
  padding:14px 22px;border-radius:14px;
  border:3px solid #4444ff;
  text-align:center;display:none;
  max-width:92%;line-height:1.5;z-index:50;
}

/* ── ROTATE PROMPT ── */
#rotatePrompt{
  display:none;
  position:fixed;inset:0;
  background:#000010;
  color:#7af;
  font-family:'Fredoka One',cursive;
  font-size:22px;
  flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;z-index:999;
  text-align:center;padding:20px;
}
#rotatePrompt .icon{font-size:52px;animation:rotate90 1.5s ease-in-out infinite alternate;}
@keyframes rotate90{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}

/* ── TOUCH CONTROLS: float over canvas bottom ── */
#touchControls{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  z-index:40;
  pointer-events:none; /* children override this */
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#ctrlTop{
  display:flex;justify-content:flex-end;align-items:center;
  gap:6px;padding:4px 14px 0 14px;
  pointer-events:auto;
}
#ctrlMain{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:6px 16px 10px 16px;gap:8px;
  pointer-events:auto;
}

/* Joystick */
#joystickZone{width:130px;height:130px;flex-shrink:0;position:relative;}
#joystickBase{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(100,150,255,0.08);
  border:3px solid rgba(100,150,255,0.35);
}
#joystickThumb{
  position:absolute;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#5599ff,#2244cc);
  border:3px solid #aacfff;
  top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 3px 10px rgba(0,0,80,0.8),0 0 16px rgba(80,120,255,0.4);
}

/* PECK button */
#attackBtn{
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6b35,#cc2200);
  border:4px solid #ffcc02;
  color:#fff;font-family:'Fredoka One',cursive;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 4px 20px rgba(0,0,0,0.8),0 0 24px rgba(255,100,50,0.4);
  cursor:pointer;user-select:none;-webkit-user-select:none;flex-shrink:0;
  transition:transform 0.05s,filter 0.05s;
  pointer-events:auto;
}
#attackBtn span{font-size:30px;line-height:1;}
#attackBtn.pressed{transform:scale(0.91);filter:brightness(1.4);}
#attackBtn.zerog{
  background:radial-gradient(circle at 35% 30%,#5599ff,#1133aa);
  border-color:#aacfff;
  box-shadow:0 4px 14px rgba(0,0,80,0.7),0 0 24px rgba(80,150,255,0.6);
}

/* Small action buttons */
.ctrl-sm{
  font-family:'Fredoka One',cursive;font-size:11px;
  padding:0;border-radius:12px;
  border:2px solid rgba(100,150,255,0.25);
  background:rgba(0,0,20,0.65);
  backdrop-filter:blur(4px);
  color:#adf;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform 0.07s,filter 0.07s;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;
  pointer-events:auto;
}
.ctrl-sm:active,.ctrl-sm.pressed{transform:scale(0.88);filter:brightness(1.5);}
.ctrl-sm .icon{font-size:18px;line-height:1.1;}
.ctrl-sm .lbl{font-size:9px;opacity:0.8;letter-spacing:0.3px;}

/* Fullscreen button */
#fsBtn{
  position:fixed;top:8px;right:8px;
  z-index:45;
  font-size:18px;
  background:rgba(0,0,20,0.55);
  backdrop-filter:blur(4px);
  border:1px solid rgba(100,150,255,0.25);
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
  color:#7af;
  font-family:'Fredoka One',cursive;
  pointer-events:auto;
  transition:opacity 0.2s;
}
#fsBtn:hover{opacity:0.8;}

/* hint — desktop only, sits over canvas bottom-center */
#hint{
  position:fixed;bottom:6px;left:50%;transform:translateX(-50%);
  color:rgba(100,150,255,0.4);font-size:10px;
  font-family:'Fredoka One',cursive;letter-spacing:0.5px;
  pointer-events:none;z-index:41;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="rotatePrompt">
  <div class="icon">📱</div>
  <div>Rotate your device<br>for the best experience!</div>
</div>

<div id="canvasWrap">
  <canvas id="game" width="640" height="480"></canvas>
</div>
<div id="message"></div>

<!-- Fullscreen toggle -->
<button id="fsBtn" title="Fullscreen">⛶</button>

<div id="touchControls">
  <div id="ctrlTop">
    <button class="ctrl-sm" id="unstuckBtn" style="width:52px;height:44px;">
      <span class="icon">📍</span><span class="lbl">UNSTUCK</span>
    </button>
  </div>
  <div id="ctrlMain">
    <div id="joystickZone">
      <div id="joystickBase"></div>
      <div id="joystickThumb"></div>
    </div>
    <div id="attackBtn"><span>💥</span>PECK!</div>
  </div>
</div>
<div id="hint">⌨️ WASD / Arrows — move &nbsp;|&nbsp; SPACE — peck &nbsp;|&nbsp; ⛶ fullscreen</div>

<script>
'use strict';
// ═══════════════════════════════════════════════
//  SETUP & SCALING
// ═══════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('message');
const GW=640, GH=480, TILE=32;

// Declare early — canvas click handlers reference this immediately
let gameState='title';
let titleBtn=null;

let isMobile = ('ontouchstart' in window)||navigator.maxTouchPoints>0;
const tc = document.getElementById('touchControls');
const hint = document.getElementById('hint');

function checkOrientation(){
  const prompt = document.getElementById('rotatePrompt');
  if(isMobile && window.innerHeight > window.innerWidth){
    prompt.style.display='flex';
  } else {
    prompt.style.display='none';
  }
}
checkOrientation();
window.addEventListener('resize', ()=>{ checkOrientation(); resize(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ checkOrientation(); resize(); },200); });

function resize(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / GW, vh / GH);
  canvas.style.width  = Math.round(GW * scale) + 'px';
  canvas.style.height = Math.round(GH * scale) + 'px';
  canvas.style.marginBottom = '0';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{ checkOrientation(); resize(); });
}
if(isMobile){
  tc.style.display='none'; // hidden until game starts — don't block title taps
  hint.style.display='none';
}
resize();

// ── FULLSCREEN ──
const fsBtn = document.getElementById('fsBtn');
fsBtn.addEventListener('click',()=>{
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen).call(el);
    fsBtn.textContent='✕';
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document);
    fsBtn.textContent='⛶';
  }
});
document.addEventListener('fullscreenchange',()=>{
  fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
  resize();
});

// ═══════════════════════════════════════════════
//  JOYSTICK
// ═══════════════════════════════════════════════
const jZone  = document.getElementById('joystickZone');
const jThumb = document.getElementById('joystickThumb');
const atkBtn = document.getElementById('attackBtn');

let joyActive=false, joyId=null, joyDx=0, joyDy=0;
const JR=34;

jZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  joyId=t.identifier; joyActive=true; moveJoy(t);
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!joyActive)return; e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===joyId) moveJoy(t);
},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      joyActive=false; joyDx=0; joyDy=0;
      jThumb.style.transform='translate(-50%,-50%)';
    }
  }
});
function moveJoy(touch){
  const r=jZone.getBoundingClientRect();
  let dx=touch.clientX-(r.left+r.width/2), dy=touch.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy);
  if(d>JR){dx=dx/d*JR; dy=dy/d*JR;}
  joyDx=dx/JR; joyDy=dy/JR;
  jThumb.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

let touchAtk=false;
atkBtn.addEventListener('touchstart',e=>{
  e.preventDefault(); touchAtk=true; atkBtn.classList.add('pressed');
},{passive:false});
atkBtn.addEventListener('touchend',e=>{
  e.preventDefault(); atkBtn.classList.remove('pressed');
},{passive:false});



// ═══════════════════════════════════════════════
//  KEYBOARD INPUT
// ═══════════════════════════════════════════════
const keys={};
document.addEventListener('keydown',e=>{ keys[e.key]=true; });
document.addEventListener('keyup',  e=>{ keys[e.key]=false; });

// ═══════════════════════════════════════════════
//  TILE CONSTANTS — SPACE EDITION

  FLOOR:1,    // walkable floor (station/moon surface)
  WALL:2,     // wall block
  CRATER:3,   // lunar crater (impassable decoration)
  DUST:4,     // moon dust (walkable, slippery in zero-G)
  CRYSTAL:5,  // alien crystal (impassable, glows)
  DOOR:6,     // airlock door
  CHEST:7,    // supply crate
  GRAVITY:8,  // gravity generator tile (normal physics zone)

let currentZone = 'cornmoon';

})();

function screenIndex(col,row){
  if(col<0||col>=WORLD_COLS||row<0||row>=WORLD_ROWS)return -1;
  return row*WORLD_COLS+col;
}

// ═══════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════
let screenCol=0, screenRow=0;
function currentScreen(){ return SCREENS[screenIndex(screenCol,screenRow)]; }

const player={
  x:288, y:240,
  speed:2.0,
  hp:5, maxHp:5,
  dir:2,    // 0=up 1=left 2=right 3=down
  atk:0,    // peck animation frames remaining
  inv:0,    // invincibility frames
  // Zero-G velocity (used when gravity===false on current screen)
  vx:0, vy:0,
  sliding:false,  // true when drifting in zero-G
};

let score=0, cornCount=0, frame=0;

canvas.addEventListener('click',e=>{
  if(gameState!=='title')return;
  startGame();
});
canvas.addEventListener('touchstart',e=>{
  if(gameState!=='title')return;
  e.preventDefault();
  startGame();
},{passive:false});

// Per-screen persistent state
const screenState={};
function getScreenState(col,row){
  const k=`${col},${row}`;
  const sc=SCREENS[screenIndex(col,row)];
  if(!screenState[k]){
    screenState[k]={
      gotCorns:new Set(),
      enemyHps:sc.enemies.map(()=>1),
    };
  }
  // Sync enemyHps if config added enemies after init
  const ss=screenState[k];
  while(ss.enemyHps.length < sc.enemies.length) ss.enemyHps.push(1);
  return ss;
}

// Screen scroll
let isScrolling=false;
let scrollT=0;
let scrollDirX=0, scrollDirY=0;
let scrollOffX=0, scrollOffY=0;
let nextScreenCol=0, nextScreenRow=0;
const SCROLL_DUR=20;

// Particles
const parts=[];
function spawnP(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    parts.push({x,y,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,life:30,ml:30,col});
  }
}
function tickP(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--;
    if(p.life<=0){parts.splice(i,1);continue;}
    const a=p.life/p.ml;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// Screen-shake
let screenShake=0;

// Popup
let popup={text:'',timer:0};

// ═══════════════════════════════════════════════
//  TILE WALKABILITY
// ═══════════════════════════════════════════════
function tileAt(map,px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(ty<0||ty>=map.length||tx<0||tx>=map[0].length)return T.VOID;
  return map[ty][tx];
}
const SOLID_TILES=new Set([T.VOID,T.WALL,T.CRATER,T.CRYSTAL]);
function walkable(map,px,py){ return !SOLID_TILES.has(tileAt(map,px,py)); }
function boxWalkable(map,px,py){
  const pad=4;
  return walkable(map,px+pad,py+pad) && walkable(map,px+TILE-pad,py+pad) &&
         walkable(map,px+pad,py+TILE-pad) && walkable(map,px+TILE-pad,py+TILE-pad);
}

// ═══════════════════════════════════════════════
//  PLAYER UPDATE
// ═══════════════════════════════════════════════
function isZeroG(){ return !currentScreen().gravity; }

function updatePlayer(){
  if(isScrolling||gameState!=='play')return;

  // Input
  let dx=0, dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) dx-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']) dx+=1;
  if(keys['ArrowUp']||keys['w']||keys['W']) dy-=1;
  if(keys['ArrowDown']||keys['s']||keys['S']) dy+=1;
  if(Math.abs(joyDx)>0.15) dx+=joyDx;
  if(Math.abs(joyDy)>0.15) dy+=joyDy;
  const len=Math.hypot(dx,dy);
  if(len>1){dx/=len;dy/=len;}

  // Direction facing
  if(Math.abs(dx)>Math.abs(dy)){
    player.dir=dx>0?2:1;
  } else if(dy!==0){
    player.dir=dy>0?3:0;
  }

  const map=currentScreen().map;
  const spd=player.speed;

  if(isZeroG()){
    // ── ZERO-G PHYSICS ──
    // Joystick/keys apply thrust, not direct movement
    const THRUST=0.12;
    const FRICTION=0.985; // minimal friction — space!
    const MAX_SPD=3.5;

    player.vx+=dx*THRUST;
    player.vy+=dy*THRUST;
    // Clamp speed
    const v=Math.hypot(player.vx,player.vy);
    if(v>MAX_SPD){ player.vx=player.vx/v*MAX_SPD; player.vy=player.vy/v*MAX_SPD; }
    // Apply friction
    player.vx*=FRICTION; player.vy*=FRICTION;
    player.sliding=(Math.hypot(player.vx,player.vy)>0.3);

    // Move with collision
    const nx=player.x+player.vx;
    const ny=player.y+player.vy;
    if(boxWalkable(map,nx,player.y)) player.x=nx; else player.vx*=-0.4;
    if(boxWalkable(map,player.x,ny)) player.y=ny; else player.vy*=-0.4;
  } else {
    // ── NORMAL PHYSICS ──
    player.vx=0; player.vy=0; player.sliding=false;
    const nx=player.x+dx*spd;
    const ny=player.y+dy*spd;
    if(boxWalkable(map,nx,player.y)) player.x=nx;
    if(boxWalkable(map,player.x,ny)) player.y=ny;
  }

  // ── PECK ──
  if(player.atk>0) player.atk--;
  const wantAtk = keys[' ']||keys['z']||keys['Z']||touchAtk;
  touchAtk=false;
  if(wantAtk && player.atk===0){
    player.atk=18;

    // Zero-G Peck — recoil!
    if(isZeroG()){
      const dirX=[0,-1,1,0][player.dir];
      const dirY=[-1,0,0,1][player.dir];
      const RECOIL=4.0;
      player.vx-=dirX*RECOIL;
      player.vy-=dirY*RECOIL;
      // Clamp after recoil
      const v=Math.hypot(player.vx,player.vy);
      if(v>5){ player.vx=player.vx/v*5; player.vy=player.vy/v*5; }
      popup={text:'🚀 ZERO-G PECK!',timer:60};
      spawnP(player.x+16,player.y+16,'#5599ff',10);
    }
  }

  // ── INVINCIBILITY ──
  if(player.inv>0) player.inv--;

  // ── SCREEN TRANSITION ──
  // Trigger when player center crosses into the edge tile column/row
  if(!isScrolling){
    let ncol=screenCol, nrow=screenRow;
    let npx=player.x, npy=player.y;
    const cx=player.x+16, cy=player.y+16; // player center

    // North — player center in top tile row
    if(cy < TILE && screenRow>0){
      ncol=screenCol; nrow=screenRow-1;
      npx=player.x; npy=GH-TILE*3;
    }
    // South — player center in bottom tile row
    else if(cy > GH-TILE && screenRow<WORLD_ROWS-1){
      ncol=screenCol; nrow=screenRow+1;
      npx=player.x; npy=TILE*2;
    }
    // West — player center in left tile column
    else if(cx < TILE && screenCol>0){
      ncol=screenCol-1; nrow=screenRow;
      npx=GW-TILE*3; npy=player.y;
    }
    // East — player center in right tile column
    else if(cx > GW-TILE && screenCol<WORLD_COLS-1){
      ncol=screenCol+1; nrow=screenRow;
      npx=TILE*2; npy=player.y;
    }

    if(ncol!==screenCol||nrow!==screenRow){
      player.vx*=0.5; player.vy*=0.5;
      startScroll(ncol,nrow,npx,npy);
    }
  }
}

function startScroll(ncol,nrow,npx,npy){
  isScrolling=true; scrollT=0;
  scrollDirX=ncol-screenCol; scrollDirY=nrow-screenRow;
  scrollOffX=0; scrollOffY=0;
  nextScreenCol=ncol; nextScreenRow=nrow;
  player.x=npx; player.y=npy;

  // Update zone name
  const ns=SCREENS[screenIndex(ncol,nrow)];
  if(ns) hudZone=ns.name;
}

function updateScroll(){
  if(!isScrolling)return;
  scrollT++;
  const t=scrollT/SCROLL_DUR;
  scrollOffX=-scrollDirX*GW*t;
  scrollOffY=-scrollDirY*GH*t;
  if(scrollT>=SCROLL_DUR){
    isScrolling=false;
    screenCol=nextScreenCol; screenRow=nextScreenRow;
    currentZone=currentScreen().gravity?'cornmoon':'station';
    scrollOffX=0; scrollOffY=0;
    triggerLoreFlash(currentScreen());
    updateZeroGUI();
  }
}

function updateZeroGUI(){
  const btn=document.getElementById('attackBtn');
  if(isZeroG()){
    btn.classList.add('zerog');
    btn.childNodes[btn.childNodes.length-1].textContent='PECK!';
    btn.querySelector('span').textContent='🚀';
  } else {
    btn.classList.remove('zerog');
    btn.childNodes[btn.childNodes.length-1].textContent='PECK!';
    btn.querySelector('span').textContent='💥';
  }
}

// ═══════════════════════════════════════════════
//  ENEMY UPDATE
// ═══════════════════════════════════════════════
function updateEnemies(){
  if(isScrolling)return;
  const sc=currentScreen();
  const ss=getScreenState(screenCol,screenRow);
  const map=sc.map;

  sc.enemies.forEach((e,i)=>{
    if(ss.enemyHps[i]<=0)return;
    // Init position
    if(e._x===undefined){ e._x=e.tx*TILE; e._y=e.ty*TILE; e._dir=1; e._t=0; }
    e._t++;

    // Patrol
    const spd=e.spd;
    if(e.pat==='h'){
      const nx=e._x+e._dir*spd;
      if(boxWalkable(map,nx,e._y)) e._x=nx; else e._dir*=-1;
      if(Math.abs(e._x-e.tx*TILE)>TILE*3) e._dir*=-1;
    } else {
      const ny=e._y+e._dir*spd;
      if(boxWalkable(map,e._x,ny)) e._y=ny; else e._dir*=-1;
      if(Math.abs(e._y-e.ty*TILE)>TILE*3) e._dir*=-1;
    }

    // Peck hit
    if(player.atk>10){
      const dist=Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+14));
      if(dist<44){
        ss.enemyHps[i]=0;
        spawnP(e._x+14,e._y+14,'#52b788',12);
        score+=50;
        updateHUD();
      }
    }

    // Contact damage
    if(player.inv<=0){
      const dist=Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+14));
      if(dist<30){
        player.hp--;
        player.inv=80;
        screenShake=6;
        spawnP(player.x+16,player.y+16,'#ff3333',10);
        updateHUD();
        if(player.hp<=0){ gameState='lose'; showMsg('💀 Game Over!\n\nPress R to try again.'); }
      }
    }
  });
}

// ═══════════════════════════════════════════════
//  CORN COLLECTION
// ═══════════════════════════════════════════════
function updateCorn(){
  if(isScrolling)return;
  const sc=currentScreen();
  const ss=getScreenState(screenCol,screenRow);
  sc.corn.forEach((c,i)=>{
    if(ss.gotCorns.has(i))return;
    const cx=c.x*TILE+8, cy=c.y*TILE+8;
    const dist=Math.hypot(player.x+16-cx,player.y+16-cy);
    if(dist<24){
      ss.gotCorns.add(i);
      cornCount++;
      score+=10;
      spawnP(cx,cy,'#ffcc02',8);
      popup={text:'🌽 CORN! +1',timer:50};
      updateHUD();
    }
  });
}

// ═══════════════════════════════════════════════
//  STARFIELD BACKGROUND
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════
const STARS=[];
(function initStars(){
  for(let i=0;i<150;i++){
    STARS.push({
      x:Math.random()*GW, y:Math.random()*GH,
      r:Math.random()*1.4+0.3,
      spd:Math.random()*0.03+0.006,
      off:Math.random()*Math.PI*2,
      warm:Math.random()>0.7,
    });
  }
})();

function drawStarfield(ox=0,oy=0){
  // Moon surface gets warm-tinted sky, others get cool void
  const isMoon = currentZone==='cornmoon';
  if(isMoon){
    const sky=ctx.createLinearGradient(0,0,0,GH);
    sky.addColorStop(0,'#04020c');sky.addColorStop(0.5,'#170d28');sky.addColorStop(1,'#2d1a0a');
    ctx.fillStyle=sky;ctx.fillRect(0,0,GW,GH);
  } else {
    ctx.fillStyle='#000008';ctx.fillRect(0,0,GW,GH);
    // Nebula clouds for space zones
    [[GW*0.7,GH*0.3,120,'rgba(70,30,180,0.1)'],[GW*0.2,GH*0.6,90,'rgba(180,60,20,0.08)'],[GW*0.85,GH*0.7,70,'rgba(0,100,180,0.08)']].forEach(([nx,ny,nr,nc])=>{
      const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);
      ng.addColorStop(0,nc);ng.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ng;ctx.fillRect(0,0,GW,GH);
    });
  }
  STARS.forEach(s=>{
    const tw=0.3+Math.sin(frame*s.spd+s.off)*0.7;
    const sx2=((s.x+ox*s.spd*0.5)%GW+GW)%GW;
    const sy2=((s.y+oy*s.spd*0.5)%GH+GH)%GH;
    ctx.globalAlpha=tw*(isMoon?0.7:0.95);
    ctx.fillStyle=s.warm?(isMoon?'#ffe8c0':'#ffe8c0'):'#c8d8ff';
    ctx.beginPath();ctx.arc(sx2,sy2,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════
//  TILE DRAWING — STYLE BIBLE
// ═══════════════════════════════════════════════
function drawTile(t,sx,sy){
  const isMoon=currentZone==='cornmoon';
  const isStation=currentZone==='station';

  switch(t){

    case T.VOID: break; // starfield shows through

    case T.FLOOR:{
      if(isMoon){
        // Moon dust floor — warm amber
        const shade=(Math.floor(sx/TILE)+Math.floor(sy/TILE))%2===0?'#3d2a18':'#352416';
        ctx.fillStyle=shade;ctx.fillRect(sx,sy,TILE,TILE);
        ctx.fillStyle='rgba(255,180,60,0.06)';ctx.fillRect(sx,sy,TILE,2);
        // dust speck
        if((sx+sy)%64===0){
          ctx.fillStyle='rgba(200,155,70,0.15)';
          ctx.beginPath();ctx.ellipse(sx+10,sy+20,5,2,0,0,Math.PI*2);ctx.fill();
          ctx.beginPath();ctx.ellipse(sx+22,sy+10,4,2,0,0,Math.PI*2);ctx.fill();
        }
      } else {
        // Station metal floor — dark with grid seams
        const shade2=(Math.floor(sx/TILE)+Math.floor(sy/TILE))%2===0?'#0e1828':'#0a1220';
        ctx.fillStyle=shade2;ctx.fillRect(sx,sy,TILE,TILE);
        ctx.strokeStyle='rgba(0,120,220,0.12)';ctx.lineWidth=1;
        ctx.strokeRect(sx,sy,TILE,TILE);
        // Scanline shimmer
        if((sx+sy+frame)%180<3){
          ctx.fillStyle='rgba(0,180,255,0.08)';ctx.fillRect(sx,sy,TILE,TILE);
        }
      }
      break;
    }

    case T.WALL:{
      if(isMoon){
        // Moon rock wall
        ctx.fillStyle='#2a1a0e';ctx.fillRect(sx,sy,TILE,TILE);
        ctx.strokeStyle='#5a3a1a';ctx.lineWidth=1;ctx.strokeRect(sx,sy,TILE,TILE);
        // Corner studs
        ctx.fillStyle='rgba(255,140,0,0.08)';
        ctx.fillRect(sx,sy,5,5);ctx.fillRect(sx+TILE-5,sy,5,5);
        ctx.fillRect(sx,sy+TILE-5,5,5);ctx.fillRect(sx+TILE-5,sy+TILE-5,5,5);
        // rock texture
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.fillRect(sx+4,sy+8,10,6);ctx.fillRect(sx+18,sy+18,8,6);
      } else {
        // Station wall panel
        ctx.fillStyle='#0c1220';ctx.fillRect(sx,sy,TILE,TILE);
        ctx.strokeStyle='rgba(0,100,200,0.3)';ctx.lineWidth=1.5;ctx.strokeRect(sx,sy,TILE,TILE);
        // Corner rivets
        [[sx+4,sy+4],[sx+TILE-4,sy+4],[sx+4,sy+TILE-4],[sx+TILE-4,sy+TILE-4]].forEach(([rx,ry])=>{
          ctx.fillStyle='#1a2535';ctx.beginPath();ctx.arc(rx,ry,2,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='rgba(100,180,255,0.3)';ctx.beginPath();ctx.arc(rx,ry,1,0,Math.PI*2);ctx.fill();
        });
        // Warning stripe on every other wall
        if((Math.floor(sx/TILE))%3===0){
          for(let ws=0;ws<TILE;ws+=10){
            ctx.fillStyle=ws%20===0?'rgba(255,204,2,0.1)':'rgba(0,0,0,0)';
            ctx.fillRect(sx,sy+ws,TILE,10);
          }
        }
      }
      break;
    }

    case T.CRATER:{
      // Moon surface crater
      ctx.fillStyle='#3d2a18';ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();ctx.ellipse(sx+16,sy+17,13,9,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(140,100,50,0.5)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(sx+16,sy+17,13,9,0,0,Math.PI*2);ctx.stroke();
      // Rim highlight
      ctx.strokeStyle='rgba(200,155,70,0.25)';ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(sx+14,sy+15,11,7,-0.2,0,Math.PI);ctx.stroke();
      break;
    }

    case T.CRYSTAL:{
      // Glowing crystal spire — moon's impassable obstacle
      ctx.fillStyle='#3d2a18';ctx.fillRect(sx,sy,TILE,TILE);
      const glow=0.35+Math.sin(frame*0.055+sx*0.01)*0.3;
      // Glow halo
      ctx.globalAlpha=glow*0.55;ctx.fillStyle='#ffee44';
      ctx.beginPath();ctx.arc(sx+16,sy+14,14,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      // Spires
      ctx.fillStyle='#ffee66';
      [[-6,0,5,-18],[0,0,4,-22],[6,0,5,-18],[-3,0,3,-12],[3,0,3,-12]].forEach(([ox,oy,sw,sh])=>{
        ctx.beginPath();ctx.moveTo(sx+16+ox-sw/2,sy+26+oy);
        ctx.lineTo(sx+16+ox,sy+26+sh);
        ctx.lineTo(sx+16+ox+sw/2,sy+26+oy);ctx.closePath();ctx.fill();
      });
      // Center bright spine
      ctx.fillStyle='#fffacc';
      ctx.beginPath();ctx.moveTo(sx+15,sy+26);ctx.lineTo(sx+16,sy+4);ctx.lineTo(sx+17,sy+26);ctx.closePath();ctx.fill();
      break;
    }

    case T.DOOR:{
      ctx.fillStyle=isMoon?'#3d2a18':'#0a1220';ctx.fillRect(sx,sy,TILE,TILE);
      // Airlock frame
      ctx.fillStyle='#1a2a3a';ctx.fillRect(sx+3,sy+2,26,28);
      ctx.fillStyle='#223344';ctx.fillRect(sx+5,sy+4,10,24);
      ctx.fillStyle='#223344';ctx.fillRect(sx+17,sy+4,9,24);
      // Warning stripes
      ctx.fillStyle='#ffcc02';ctx.fillRect(sx+3,sy+2,26,4);ctx.fillRect(sx+3,sy+26,26,4);
      // Handle glow
      const dg=0.5+Math.sin(frame*0.07)*0.4;
      ctx.fillStyle=`rgba(0,200,255,${dg})`;
      ctx.beginPath();ctx.arc(sx+16,sy+16,3,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=dg*0.25;ctx.fillStyle='#00ccff';
      ctx.beginPath();ctx.arc(sx+16,sy+16,8,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      break;
    }

    case T.CHEST:{
      ctx.fillStyle=isMoon?'#3d2a18':'#0a1220';ctx.fillRect(sx,sy,TILE,TILE);
      // Supply crate
      ctx.fillStyle='#2a3545';ctx.fillRect(sx+3,sy+10,26,16);
      ctx.strokeStyle='#cc2200';ctx.lineWidth=1.5;ctx.strokeRect(sx+3,sy+10,26,16);
      ctx.fillStyle='#cc2200';ctx.fillRect(sx+3,sy+10,26,4);
      ctx.fillStyle='#ffcc02';ctx.fillRect(sx+3,sy+17,26,2);
      ctx.fillStyle='#88bbff';ctx.beginPath();ctx.arc(sx+16,sy+19,2.5,0,Math.PI*2);ctx.fill();
      break;
    }

    case T.VENT:{
      ctx.fillStyle='#0c1220';ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#162030';ctx.fillRect(sx+3,sy+3,26,26);
      ctx.strokeStyle='rgba(0,150,220,0.3)';ctx.lineWidth=1.5;
      for(let v=0;v<4;v++){
        ctx.beginPath();ctx.moveTo(sx+4,sy+7+v*6);ctx.lineTo(sx+28,sy+7+v*6);ctx.stroke();
      }
      // Animated glow
      if(frame%50<25){
        const va=(25-frame%50)/25;
        ctx.globalAlpha=va*0.2;ctx.fillStyle='#00aaff';
        ctx.beginPath();ctx.arc(sx+16,sy+3-frame%25*0.4,3,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      break;
    }

    case T.GRAVITY:{
      // Gravity generator — glowing floor tile
      ctx.fillStyle='#0a1220';ctx.fillRect(sx,sy,TILE,TILE);
      const gg=0.4+Math.sin(frame*0.06+sx*0.05)*0.3;
      ctx.globalAlpha=gg*0.5;ctx.fillStyle='#ff8800';
      ctx.beginPath();ctx.arc(sx+16,sy+16,12,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle=`rgba(255,136,0,${gg})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(sx+16,sy+16,11,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='rgba(255,180,0,0.9)';
      ctx.font='bold 12px Fredoka One';ctx.textAlign='center';
      ctx.fillText('G',sx+16,sx+20);ctx.textAlign='left';
      break;
    }

    case T.DUST:{
      ctx.fillStyle='#352416';ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='rgba(200,155,70,0.1)';
      ctx.fillRect(sx+3,sy+20,8,4);ctx.fillRect(sx+18,sy+10,6,3);
      break;
    }

    default: ctx.fillStyle='#111';ctx.fillRect(sx,sy,TILE,TILE);
  }
}

// ═══════════════════════════════════════════════
//  SCREEN DRAWING — with style-bible backgrounds
// ═══════════════════════════════════════════════
function drawScreen(sc){
  const isMoon=sc.gravity;

  drawStarfield(screenCol*60,screenRow*60);

  if(isMoon){
    // Ground plane starts at tile row 4 (y=128) — matches map VOID/FLOOR split
    const gy=4*TILE; // 128px
    const ground=ctx.createLinearGradient(0,gy,0,GH);
    ground.addColorStop(0,'#4a3420');ground.addColorStop(0.4,'#3a2818');ground.addColorStop(1,'#180c06');
    ctx.fillStyle=ground;ctx.fillRect(0,gy,GW,GH-gy);
    // Surface wave / cliff edge
    ctx.strokeStyle='#7a5a38';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,gy);
    for(let i=0;i<=GW;i+=8) ctx.lineTo(i,gy+Math.sin(i*0.25+frame*0.003)*3+Math.sin(i*0.6)*2);
    ctx.stroke();
    // Dust scatter near surface
    ctx.fillStyle='rgba(200,155,70,0.07)';
    for(let i=0;i<20;i++){
      const dx=(i*97+frame*0.04)%GW;
      ctx.beginPath();ctx.ellipse(dx,gy+5+i%10*4,5+i%4,2,0,0,Math.PI*2);ctx.fill();
    }
    // Corn Moon planet in sky (top-right void area)
    ctx.save();ctx.translate(GW-75,52);
    const mg=ctx.createRadialGradient(-10,-10,4,0,0,42);
    mg.addColorStop(0,'#ffe8a0');mg.addColorStop(0.55,'#d48020');mg.addColorStop(1,'#3a1600');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath();ctx.arc(-12,6,9,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(14,-8,6,0,Math.PI*2);ctx.fill();
    ctx.font='20px Arial';ctx.textAlign='center';ctx.fillText('🌽',0,7);
    ctx.restore();

  } else {
    // Station interior: grid overlay + ceiling lights on floor tiles
    ctx.strokeStyle='rgba(0,80,200,0.07)';ctx.lineWidth=1;
    for(let gx=0;gx<GW;gx+=20){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,GH);ctx.stroke();}
    for(let gy2=0;gy2<GH;gy2+=20){ctx.beginPath();ctx.moveTo(0,gy2);ctx.lineTo(GW,gy2);ctx.stroke();}
    // Ceiling conduit
    ctx.fillStyle='#0c1520';ctx.fillRect(0,0,GW,12);
    ctx.strokeStyle='rgba(0,120,255,0.25)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(GW,5);ctx.stroke();
    for(let i=0;i<GW;i+=60){
      ctx.fillStyle='#1a2535';ctx.fillRect(i,0,8,12);
      ctx.fillStyle='rgba(0,150,255,0.25)';ctx.fillRect(i+2,2,4,8);
    }
    // Status lights
    [{lx:24,col:'#00ff88',p:80},{lx:44,col:'#ff4444',p:110},{lx:64,col:'#ffcc02',p:65},
     {lx:GW-26,col:'#00ccff',p:90},{lx:GW-46,col:'#ff4444',p:55}].forEach(l=>{
      const on=frame%l.p<l.p*0.35;
      ctx.globalAlpha=on?1:0.1;ctx.fillStyle=l.col;
      ctx.beginPath();ctx.arc(l.lx,18,4,0,Math.PI*2);ctx.fill();
      if(on){ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(l.lx,18,9,0,Math.PI*2);ctx.fill();}
    });
    ctx.globalAlpha=1;
  }

  // Draw all non-VOID tiles
  for(let ty=0;ty<15;ty++){
    for(let tx=0;tx<20;tx++){
      const t=(sc.map[ty]||[])[tx];
      if(t!==undefined && t!==T.VOID) drawTile(t,tx*TILE,ty*TILE);
    }
  }

  // Gravity well rings on zero-G screens
  if(!sc.gravity){
    [[GW*0.3,GH*0.4],[GW*0.68,GH*0.6]].forEach(([gx,gy])=>{
      const pulse=0.2+Math.sin(frame*0.05+gx)*0.2;
      for(let ring=3;ring>=1;ring--){
        ctx.globalAlpha=pulse*(0.12*ring);
        ctx.strokeStyle='#ff8800';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(gx,gy,ring*22,0,Math.PI*2);ctx.stroke();
      }
      for(let a=0;a<6;a++){
        const angle=(a/6)*Math.PI*2,r1=52,r2=32;
        ctx.globalAlpha=pulse*0.7;ctx.strokeStyle='#ff8800';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(gx+Math.cos(angle)*r1,gy+Math.sin(angle)*r1);
        ctx.lineTo(gx+Math.cos(angle)*r2,gy+Math.sin(angle)*r2);ctx.stroke();
        const ha=angle+Math.PI,bx=gx+Math.cos(angle)*r2,by=gy+Math.sin(angle)*r2;
        ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(bx,by);
        ctx.lineTo(bx+Math.cos(ha-0.4)*7,by+Math.sin(ha-0.4)*7);
        ctx.lineTo(bx+Math.cos(ha+0.4)*7,by+Math.sin(ha+0.4)*7);
        ctx.closePath();ctx.fill();
      }
      ctx.globalAlpha=1;
      const cg=0.6+Math.sin(frame*0.08+gx)*0.3;
      ctx.fillStyle=`rgba(255,150,0,${cg})`;ctx.beginPath();ctx.arc(gx,gy,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,220,100,0.95)';ctx.font='bold 10px Fredoka One';ctx.textAlign='center';
      ctx.fillText('G',gx,gy+3.5);ctx.textAlign='left';
    });
    ctx.globalAlpha=1;
  }

  // Screen name badge
  ctx.fillStyle='rgba(0,0,20,0.72)';
  const snw=ctx.measureText(sc.name).width+24;
  ctx.beginPath();ctx.roundRect(GW/2-snw/2,GH-24,snw,20,6);ctx.fill();
  ctx.fillStyle=isMoon?'#ffcc02':'#00ccff';
  ctx.font='bold 12px Fredoka One';ctx.textAlign='center';
  ctx.fillText(sc.name,GW/2,GH-9);ctx.textAlign='left';

  // Zero-G badge
  if(!sc.gravity){
    const pulse=0.65+Math.sin(frame*0.1)*0.35;
    ctx.globalAlpha=pulse;
    ctx.fillStyle='rgba(0,10,40,0.75)';
    ctx.beginPath();ctx.roundRect(6,6,118,18,6);ctx.fill();
    ctx.fillStyle='#5599ff';ctx.font='bold 10px Fredoka One';ctx.textAlign='left';
    ctx.fillText('🌌 ZERO-G ZONE',11,18);
    ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════════════════
//  SPRITE DRAWING — STYLE BIBLE QUALITY
// ═══════════════════════════════════════════════
function drawChicken(x,y,dir,atk,fr){
  const zg=isZeroG();
  const v=Math.hypot(player.vx||0,player.vy||0);
  // Zero-G drift trail (behind chicken)
  if(zg && v>0.8){
    for(let t=1;t<=5;t++){
      ctx.globalAlpha=0.15/t;ctx.fillStyle='#4488ff';
      ctx.beginPath();ctx.arc(x+16-(player.vx||0)*t*2.5,y+16-(player.vy||0)*t*2.5,11-t,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Shadow
  if(!zg){ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(x+16,y+30,13,4,0,0,Math.PI*2);ctx.fill();}
  // Body
  ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.ellipse(x+16,y+18,14,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc6e';ctx.beginPath();ctx.ellipse(x+16,y+20,9,8,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.arc(x+16,y+8,10,0,Math.PI*2);ctx.fill();
  // Helmet ring
  ctx.strokeStyle=zg?'rgba(100,180,255,0.6)':'rgba(200,230,255,0.3)';ctx.lineWidth=zg?2:1.5;
  ctx.beginPath();ctx.arc(x+16,y+8,11,0,Math.PI*2);ctx.stroke();
  if(zg){ctx.globalAlpha=0.12+Math.sin(fr*0.08)*0.06;ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(x+16,y+8,11,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  // Comb
  ctx.fillStyle='#ff3333';ctx.beginPath();ctx.moveTo(x+10,y+1);ctx.lineTo(x+8,y-6);ctx.lineTo(x+13,y-2);ctx.lineTo(x+16,y-8);ctx.lineTo(x+19,y-2);ctx.lineTo(x+22,y-6);ctx.lineTo(x+20,y+1);ctx.closePath();ctx.fill();
  // Eyes
  const ex=dir===3?x+12:x+14;
  ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(ex,y+7,5,6,-0.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(ex+8,y+7,5,6,0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(ex+1,y+8,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex+9,y+8,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#cc2200';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(ex-4,y+3);ctx.lineTo(ex+3,y+5);ctx.stroke();ctx.beginPath();ctx.moveTo(ex+5,y+5);ctx.lineTo(ex+12,y+3);ctx.stroke();
  // Beak
  ctx.fillStyle='#ff6b00';ctx.beginPath();ctx.moveTo(x+13,y+12);ctx.lineTo(x+19,y+12);ctx.lineTo(x+16,y+16);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#cc4400';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+16,y+16,3,0.2,Math.PI-0.2);ctx.stroke();
  // Wings
  ctx.fillStyle='#e08010';
  if(dir===1){ctx.beginPath();ctx.ellipse(x+4,y+18,5,9,0.4,0,Math.PI*2);ctx.fill();}
  else if(dir===3){ctx.beginPath();ctx.ellipse(x+28,y+18,5,9,-0.4,0,Math.PI*2);ctx.fill();}
  else{ctx.beginPath();ctx.ellipse(x+4,y+18,5,9,0.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+28,y+18,5,9,-0.4,0,Math.PI*2);ctx.fill();}
  // Feet
  const footY=zg?y+25:y+28;
  ctx.fillStyle='#ff6b00';ctx.fillRect(x+9,footY,4,5);ctx.fillRect(x+18,footY,4,5);ctx.fillRect(x+6,footY+4,4,2);ctx.fillRect(x+10,footY+4,4,2);ctx.fillRect(x+16,footY+4,4,2);ctx.fillRect(x+20,footY+4,4,2);
  // Peck burst
  if(atk>0){
    const peckCol=zg?'#5599ff':'#ffcc02';ctx.strokeStyle=peckCol;ctx.lineWidth=3;
    for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2+fr*0.3;ctx.beginPath();ctx.moveTo(x+16+Math.cos(a)*12,y+16+Math.sin(a)*12);ctx.lineTo(x+16+Math.cos(a)*22,y+16+Math.sin(a)*22);ctx.stroke();}
    if(zg){const dirX=[0,-1,1,0][dir],dirY=[-1,0,0,1][dir];ctx.globalAlpha=0.45*(atk/18);ctx.fillStyle='#aaccff';ctx.beginPath();ctx.arc(x+16-dirX*14,y+16-dirY*14,8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  }
}

function drawAlienIguana(x,y,hp,fr,cfg={}){
  const bodyCol=cfg.color||'#8855cc';
  const darkCol=cfg.color?shadeColor(cfg.color,-30):'#6633aa';
  const spineCol=cfg.color?shadeColor(cfg.color,30):'#aa66ff';
  const eyeCol=cfg.eyeColor||'#00ff88';
  const sc=cfg.size||1;
  ctx.save();
  if(sc!==1){ ctx.translate(x+14,y+16); ctx.scale(sc,sc); ctx.translate(-14,-16); }
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.ellipse(x+14,y+26,12,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=bodyCol;ctx.beginPath();ctx.ellipse(x+14,y+18,12,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=darkCol;ctx.fillRect(x+3,y+12,22,12);
  ctx.fillStyle=spineCol;for(let i=0;i<5;i++)ctx.fillRect(x+5+i*4,y+6,3,8);
  ctx.fillStyle=bodyCol;ctx.beginPath();ctx.arc(x+22,y+14,8,0,Math.PI*2);ctx.fill();
  const eg=0.5+Math.sin(fr*0.12)*0.3;
  ctx.fillStyle=`rgba(${hexToRgb(eyeCol)},${eg})`;ctx.beginPath();ctx.arc(x+24,y+12,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=eyeCol;ctx.beginPath();ctx.arc(x+24,y+12,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+24,y+12,1.2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=eg*0.3;ctx.fillStyle=eyeCol;
  ctx.beginPath();ctx.arc(x+24,y+12,10,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#ff6b6b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x+30,y+14);ctx.lineTo(x+36,y+12);ctx.lineTo(x+38,y+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+36,y+12);ctx.lineTo(x+38,y+14);ctx.stroke();
  // Name tag if named
  if(cfg.name){
    ctx.globalAlpha=0.85;ctx.fillStyle='rgba(0,0,0,0.6)';
    const tw=ctx.measureText(cfg.name).width+10;
    ctx.fillRect(x+14-tw/2,y-18,tw,14);
    ctx.fillStyle=spineCol;ctx.font='bold 9px Fredoka One';ctx.textAlign='center';
    ctx.fillText(cfg.name,x+14,y-7);ctx.textAlign='left';ctx.globalAlpha=1;
  }
  ctx.fillStyle='#111';ctx.fillRect(x,y-8,30,5);
  ctx.fillStyle=bodyCol;ctx.fillRect(x,y-8,30*hp,5);
  ctx.strokeStyle=`rgba(${hexToRgb(spineCol)},0.4)`;ctx.lineWidth=1;ctx.strokeRect(x,y-8,30,5);
  ctx.restore();
}

// Color helpers
function shadeColor(hex,pct){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.min(255,Math.max(0,((n>>16)&0xff)+pct));
  const g=Math.min(255,Math.max(0,((n>>8)&0xff)+pct));
  const b=Math.min(255,Math.max(0,(n&0xff)+pct));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function hexToRgb(hex){
  const n=parseInt(hex.replace('#',''),16);
  return `${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff}`;
}

function drawCorn(x,y,fr){
  const bob=Math.sin(fr*0.08+x)*(isZeroG()?3.5:2);
  const gs=0.2+Math.sin(fr*0.1)*0.15;
  ctx.globalAlpha=gs*(isZeroG()?1.4:1);ctx.fillStyle='#ffee44';
  ctx.beginPath();ctx.arc(x+8,y+8+bob,isZeroG()?14:10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#ffcc02';ctx.beginPath();ctx.ellipse(x+8,y+8+bob,5,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd700';for(let r=0;r<3;r++)for(let c=0;c<2;c++)ctx.fillRect(x+5+c*4,y+4+r*4+bob,3,3);
  ctx.fillStyle='#90e050';ctx.beginPath();ctx.moveTo(x+8,y+1+bob);ctx.lineTo(x+13,y-5+bob);ctx.lineTo(x+10,y+3+bob);ctx.fill();
}

let hudHearts=player.maxHp, hudHp=player.hp, hudCorn=0, hudScore=0, hudZone='Landing Zone';

function updateHUD(){
  hudHp=player.hp; hudHearts=player.maxHp;
  hudCorn=cornCount; hudScore=score;
  hudZone=currentScreen?currentScreen().name:'';
}

function drawHUD(){
  // Top-left: hearts
  const heartSize=18;
  for(let i=0;i<hudHearts;i++){
    ctx.font=`${heartSize}px Arial`;
    ctx.fillText(i<hudHp?'❤️':'🖤',8+i*(heartSize+2),22);
  }

  // Top-right: corn + score
  ctx.fillStyle='rgba(0,0,20,0.6)';
  ctx.beginPath();ctx.roundRect(GW-120,4,116,26,8);ctx.fill();
  ctx.font='bold 13px Fredoka One';ctx.textAlign='right';
  ctx.fillStyle='#ffcc02';
  ctx.fillText(`🌽 ${hudCorn}  ⭐ ${hudScore}`,GW-8,21);
  ctx.textAlign='left';

  // Bottom-left: zone name
  if(hudZone){
    ctx.fillStyle='rgba(0,0,20,0.55)';
    const tw=ctx.measureText(hudZone).width+20;
    ctx.beginPath();ctx.roundRect(4,GH-26,tw,22,6);ctx.fill();
    ctx.fillStyle='#aacfff';ctx.font='bold 12px Fredoka One';
    ctx.fillText(hudZone,10,GH-10);
  }
}

function showMsg(txt){
  msg.style.display='block';
  msg.style.whiteSpace='pre-line';
  msg.textContent=txt;
}
function hideMsg(){ msg.style.display='none'; }

function drawTitle(){
  drawStarfield(frame*0.3,0);

  // Slowly rotating planet in background
  const px=GW/2, py=GH/2+40;
  const pr=120;
  // Planet body
  const grad=ctx.createRadialGradient(px-30,py-30,10,px,py,pr);
  grad.addColorStop(0,'#3d2a1a');
  grad.addColorStop(0.5,'#2a1a0e');
  grad.addColorStop(1,'#0d0808');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();

  // Planet ring
  ctx.strokeStyle='rgba(255,200,50,0.35)';ctx.lineWidth=6;
  ctx.beginPath();ctx.ellipse(px,py,pr*1.6,pr*0.35,-0.3,0,Math.PI*2);ctx.stroke();

  // Title text
  ctx.fillStyle='rgba(0,0,20,0.8)';ctx.fillRect(0,0,GW,180);
  ctx.font='bold 64px Fredoka One';ctx.textAlign='center';
  ctx.fillStyle='#ffcc02';
  ctx.shadowColor='#ff6600';ctx.shadowBlur=20;
  ctx.fillText('CRANKY CHICKENS',GW/2,70);
  ctx.font='bold 40px Fredoka One';
  ctx.fillStyle='#7af';
  ctx.shadowColor='#4488ff';
  ctx.fillText('IN SPACE 🚀',GW/2,118);
  ctx.shadowBlur=0;

  ctx.font='bold 14px Fredoka One';ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('"Houston, We Have a Clucking Problem"',GW/2,148);

  // Chicken floating in space
  ctx.save();
  const bob=Math.sin(frame*0.04)*8;
  ctx.translate(0,bob);
  drawChicken(GW/2-16,GH/2-60,2,0,frame);
  ctx.restore();

  // Hint below button
  const pulse=0.6+Math.sin(frame*0.08)*0.4;
  ctx.globalAlpha=pulse;
  ctx.font='bold 13px Fredoka One';ctx.fillStyle='rgba(200,220,255,0.7)';ctx.textAlign='center';
  ctx.fillText(isMobile?'TAP TO START':'PRESS ENTER OR SPACE',GW/2,GH-28);
  ctx.globalAlpha=1;ctx.textAlign='left';

  // Draw clickable PLAY DEMO button on canvas
  const bw=220,bh=52,bx=GW/2-bw/2,by=GH-90;
  const bglow=0.8+Math.sin(frame*0.08)*0.2;
  ctx.shadowColor='#ffcc02';ctx.shadowBlur=20*bglow;
  ctx.fillStyle='#ffcc02';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#1a0a2e';ctx.font='bold 22px Fredoka One';ctx.textAlign='center';
  ctx.fillText('▶ TAP TO PLAY',GW/2,by+34);
  ctx.textAlign='left';
  titleBtn=true; // just a flag now — whole canvas is tappable
}

// ═══════════════════════════════════════════════
//  GAME START / RESTART
// ═══════════════════════════════════════════════
function startGame(){
  gameState='play';
  player.x=288; player.y=320;
  player.hp=player.maxHp; player.atk=0; player.inv=0;
  player.vx=0; player.vy=0;
  screenCol=0; screenRow=0;
  score=0; cornCount=0; frame=0;
  currentZone='cornmoon';
  hideMsg();
  updateHUD();
  hudZone=currentScreen().name;
  titleBtn=false;
  if(isMobile) tc.style.display='flex';
  updateZeroGUI();
}

function restartGame(){
  // Clear screen states
  for(const k in screenState) delete screenState[k];
  startGame();
}

// ═══════════════════════════════════════════════
//  KEYBOARD GAME START
// ═══════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(gameState==='title'&&(e.key==='Enter'||e.key===' ')){ startGame(); return; }
  if(gameState==='lose'&&(e.key==='r'||e.key==='R')){ restartGame(); return; }
});

// ═══════════════════════════════════════════════
//  MAIN GAME LOOP
// ═══════════════════════════════════════════════
function loop(){
  frame++;

  // Screen shake
  if(screenShake>0) screenShake--;
  const shakeX=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  const shakeY=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  ctx.save();
  if(screenShake>0) ctx.translate(shakeX,shakeY);
  ctx.clearRect(-4,-4,GW+8,GH+8);

  // ── TITLE ──
  if(gameState==='title'){
    drawTitle();
    ctx.restore();
    requestAnimationFrame(loop);
    return;
  }

  // ── PLAY / LOSE ──
  if(gameState==='play'){
    updatePlayer();
    updateScroll();
    updateEnemies();
    updateCorn();
  }

  // ── DRAW ──
  if(isScrolling){
    // Current screen scrolling out
    ctx.save();ctx.translate(scrollOffX,scrollOffY);
    const sc=currentScreen();
    const ss=getScreenState(screenCol,screenRow);
    drawScreen(sc);
    sc.corn.forEach((c,i)=>{ if(!ss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    sc.enemies.forEach((e,i)=>{ if(ss.enemyHps[i]>0&&e._x!==undefined) drawAlienIguana(e._x,e._y,ss.enemyHps[i],frame,e); });
    ctx.restore();
    // Next screen scrolling in
    const nsc=SCREENS[screenIndex(nextScreenCol,nextScreenRow)];
    const nss=getScreenState(nextScreenCol,nextScreenRow);
    ctx.save();ctx.translate(scrollOffX+scrollDirX*GW,scrollOffY+scrollDirY*GH);
    drawScreen(nsc);
    nsc.corn.forEach((c,i)=>{ if(!nss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    ctx.restore();
  } else {
    const sc=currentScreen();
    const ss=getScreenState(screenCol,screenRow);
    drawScreen(sc);
    sc.corn.forEach((c,i)=>{ if(!ss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    sc.enemies.forEach((e,i)=>{ if(ss.enemyHps[i]>0&&e._x!==undefined) drawAlienIguana(e._x,e._y,ss.enemyHps[i],frame,e); });
  }

  // Player (flicker when invincible)
  if(player.inv<=0||frame%6<3){
    drawChicken(player.x,player.y,player.dir,player.atk,frame);
  }

  // Particles
  tickP();

  // Canvas HUD overlay
  if(gameState==='play') drawHUD();

  // Lore flash (kid contributions)
  if(gameState==='play') drawLoreFlash();

  // Popup
  if(popup.timer>0){
    popup.timer--;
    const alpha=Math.min(1,popup.timer/15);
    const yOff=popup.timer>40?0:(40-popup.timer)*0.6;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,30,0.85)';
    const tw=ctx.measureText(popup.text).width+24;
    ctx.fillRect(GW/2-tw/2,GH/2-70-yOff,tw,30);
    ctx.strokeStyle=getZPal().accent;ctx.lineWidth=2;
    ctx.strokeRect(GW/2-tw/2,GH/2-70-yOff,tw,30);
    ctx.fillStyle='#ffcc02';
    ctx.font='bold 14px Fredoka One';ctx.textAlign='center';
    ctx.fillText(popup.text,GW/2,GH/2-50-yOff);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  // Zero-G speed readout (debug/fun)
  if(isZeroG()&&gameState==='play'){
    const v=Math.hypot(player.vx,player.vy);
    if(v>0.5){
      ctx.fillStyle='rgba(80,150,255,0.6)';
      ctx.font='bold 10px Fredoka One';ctx.textAlign='right';
      ctx.fillText(`⚡ ${v.toFixed(1)} m/s`,GW-8,GH-8);
      ctx.textAlign='left';
    }
  }

  if(screenShake>0) ctx.restore();
  else ctx.restore();

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  GAME CONFIG — loaded from /configs/in-space.json
// ═══════════════════════════════════════════════
let gameConfig = null;
let loreFlash = { text:'', timer:0, screenIndex:-1 };

function applyConfig(cfg){
  if(!cfg) return;
  gameConfig = cfg;

  if(cfg.zones){
    cfg.zones.forEach(z=>{
      const sc = SCREENS[z.screenIndex];
      if(!sc) return;
      if(z.name) sc.name = z.name;
      if(z.loreText) sc.loreText = z.loreText;
    });
  }
  if(cfg.cornPatches){
    cfg.cornPatches.forEach(p=>{
      const sc = SCREENS[p.screenIndex];
      if(!sc) return;
      // avoid duplicates
      if(!sc.corn.find(c=>c.x===p.x&&c.y===p.y))
        sc.corn.push({x:p.x, y:p.y});
    });
  }
  if(cfg.enemyVariants){
    cfg.enemyVariants.forEach(v=>{
      const sc = SCREENS[v.screenIndex];
      if(!sc) return;
      if(v.enemyIndex !== undefined && sc.enemies[v.enemyIndex]){
        Object.assign(sc.enemies[v.enemyIndex], v);
      } else {
        sc.enemies.push({
          tx:v.tx||9, ty:v.ty||7,
          spd:v.spd||0.5, pat:v.pat||'h',
          name:v.name, color:v.color,
          eyeColor:v.eyeColor, size:v.size||1,
        });
      }
    });
  }
}

function triggerLoreFlash(sc){
  if(sc.loreText && sc.loreText.trim()){
    loreFlash = { text:sc.loreText, timer:200, screenIndex:SCREENS.indexOf(sc) };
  }
}

function drawLoreFlash(){
  if(loreFlash.timer<=0) return;
  loreFlash.timer--;
  const alpha = loreFlash.timer > 160 ? 1 :
                loreFlash.timer > 40  ? 1 :
                loreFlash.timer / 40;
  const isMoon = currentScreen().gravity;
  ctx.globalAlpha = alpha * 0.95;
  const tw = ctx.measureText(loreFlash.text).width + 32;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.beginPath();
  ctx.roundRect(GW/2-tw/2, GH-54, tw, 28, 8);
  ctx.fill();
  ctx.strokeStyle = isMoon ? 'rgba(255,204,2,0.5)' : 'rgba(0,200,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = isMoon ? '#ffcc02' : '#00ccff';
  ctx.font = 'bold 13px Fredoka One';
  ctx.textAlign = 'center';
  ctx.fillText(loreFlash.text, GW/2, GH-35);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

async function loadConfig(){
  try{
    const res = await fetch('/configs/in-space.json?t='+Date.now());
    console.log('Config fetch status:', res.status);
    if(res.ok){
      const cfg = await res.json();
      console.log('Config loaded:', JSON.stringify(cfg).slice(0,200));
      applyConfig(cfg);
      console.log('After applyConfig, screen 1 enemies:', SCREENS[1].enemies.length, SCREENS[1].name);
    }
  }catch(e){
    console.log('Config load error:', e.message);
  }
  triggerLoreFlash(currentScreen());
  updateHUD();
  loop();
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadConfig();
</script>
