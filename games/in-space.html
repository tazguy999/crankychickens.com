// ═══════════════════════════════════════════════
//  MAIN GAME LOOP
// ═══════════════════════════════════════════════
function loop(){
  try{
  frame++;

  // Screen shake
  if(screenShake>0) screenShake--;
  const shakeX=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  const shakeY=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  ctx.save();
  if(screenShake>0) ctx.translate(shakeX,shakeY);
  ctx.clearRect(-4,-4,GW+8,GH+8);

  // ── TITLE ──
  if(gameState==='title'){
    drawTitle();
    ctx.restore();
    requestAnimationFrame(loop);
    return;
  }

  // ── PLAY / LOSE ──
  if(gameState==='play'){
    updatePlayer();
    updateScroll();
    updateEnemies();
    updateCorn();
    updateSecrets();
    updateAmoebaLore();
  }

  // ── DRAW ──
  if(isScrolling){
    // Current screen scrolling out
    ctx.save();ctx.translate(scrollOffX,scrollOffY);
    const sc=currentScreen();
    const ss=getScreenState(screenCol,screenRow);
    drawScreen(sc);
    sc.corn.forEach((c,i)=>{ if(!ss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    sc.enemies.forEach((e,i)=>{ if(ss.enemyHps[i]>0&&e._x!==undefined) drawAlienIguana(e._x,e._y,ss.enemyHps[i],frame,e); });
    ctx.restore();
    // Next screen scrolling in
    const nsc=SCREENS[screenIndex(nextScreenCol,nextScreenRow)];
    const nss=getScreenState(nextScreenCol,nextScreenRow);
    ctx.save();ctx.translate(scrollOffX+scrollDirX*GW,scrollOffY+scrollDirY*GH);
    drawScreen(nsc);
    nsc.corn.forEach((c,i)=>{ if(!nss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    ctx.restore();
  } else {
    const sc=currentScreen();
    const ss=getScreenState(screenCol,screenRow);
    drawScreen(sc);
    sc.corn.forEach((c,i)=>{ if(!ss.gotCorns.has(i)) drawCorn(c.x*TILE,c.y*TILE,frame); });
    // Draw wobble corn secrets
    (sc.secrets||[]).filter(s=>s.type==='wobble_corn'&&!secretState[`wc_used_${s.tx}_${s.ty}`]).forEach(s=>{
      const wobble=Math.sin(frame*0.12+s.tx)*4;
      ctx.save();ctx.translate(wobble,0);
      drawCorn(s.tx*TILE,s.ty*TILE,frame);
      ctx.restore();
    });
    // Draw launch pads
    (sc.secrets||[]).filter(s=>s.type==='launch_pad').forEach(s=>{
      const px=s.tx*TILE+16, py=s.ty*TILE+8;
      const pulse=0.6+Math.sin(frame*0.06)*0.35;
      const spin=frame*0.03;
      ctx.save();ctx.translate(px,py);
      // Platform ring
      ctx.strokeStyle=`rgba(255,204,2,${pulse})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(0,6,14,5,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,204,2,${pulse*0.4})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,6,18,7,0,0,Math.PI*2);ctx.stroke();
      // Sphere
      const g=ctx.createRadialGradient(-3,-4,2,0,0,10);
      g.addColorStop(0,'#ffffff');g.addColorStop(0.4,'#ffcc02');g.addColorStop(1,'#ff8800');
      ctx.globalAlpha=pulse;ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
      // Spin lines
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,0,10,3,spin,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.ellipse(0,0,10,3,spin+Math.PI/2,0,Math.PI*2);ctx.stroke();
      // Beam upward
      ctx.globalAlpha=pulse*0.3;
      const bGrd=ctx.createLinearGradient(0,0,0,-40);
      bGrd.addColorStop(0,'#ffcc02');bGrd.addColorStop(1,'transparent');
      ctx.fillStyle=bGrd;ctx.fillRect(-4,-40,8,40);
      // Label
      ctx.globalAlpha=0.8;ctx.fillStyle='#ffcc02';
      ctx.font='bold 7px Fredoka One';ctx.textAlign='center';
      ctx.fillText(s.name||'Launch Pad',0,22);
      ctx.textAlign='left';ctx.globalAlpha=1;ctx.restore();
    });
    sc.enemies.forEach((e,i)=>{ if(ss.enemyHps[i]>0&&e._x!==undefined) drawAlienIguana(e._x,e._y,ss.enemyHps[i],frame,e); });
    drawAmoebaLore();
  }
  if(player.inv<=0||frame%6<3){
    drawChicken(player.x,player.y,player.dir,player.atk,frame);
  }

  // Particles
  tickP();

  // Canvas HUD overlay
  if(gameState==='play') drawHUD();

  // Lore flash (kid contributions)
  if(gameState==='play') drawLoreFlash();

  // Debug nav mini-map
  if(gameState==='play') drawDebugNav();

  // Popup
  if(popup.timer>0){
    popup.timer--;
    const alpha=Math.min(1,popup.timer/15);
    const yOff=popup.timer>40?0:(40-popup.timer)*0.6;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,30,0.85)';
    const tw=ctx.measureText(popup.text).width+24;
    ctx.fillRect(GW/2-tw/2,GH/2-70-yOff,tw,30);
    ctx.strokeStyle=getZPal().accent;ctx.lineWidth=2;
    ctx.strokeRect(GW/2-tw/2,GH/2-70-yOff,tw,30);
    ctx.fillStyle='#ffcc02';
    ctx.font='bold 14px Fredoka One';ctx.textAlign='center';
    ctx.fillText(popup.text,GW/2,GH/2-50-yOff);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  // Zero-G speed readout (debug/fun)
  if(isZeroG()&&gameState==='play'){
    const v=Math.hypot(player.vx,player.vy);
    if(v>0.5){
      ctx.fillStyle='rgba(80,150,255,0.6)';
      ctx.font='bold 10px Fredoka One';ctx.textAlign='right';
      ctx.fillText(`⚡ ${v.toFixed(1)} m/s`,GW-8,GH-8);
      ctx.textAlign='left';
    }
  }

  if(screenShake>0) ctx.restore();
  else ctx.restore();

  requestAnimationFrame(loop);
  }catch(e){
    dbg('LOOP ERROR: '+e.message);
    console.error('Loop crashed:',e);
    requestAnimationFrame(loop); // keep going so debug overlay shows
  }
}

// ═══════════════════════════════════════════════
//  GAME CONFIG — loaded from /configs/in-space.json
// ═══════════════════════════════════════════════
let gameConfig = null;
let loreFlash = { text:'', timer:0, screenIndex:-1 };

function applyConfig(cfg){
  if(!cfg) return;
  gameConfig = cfg;

  if(cfg.zones){
    cfg.zones.forEach(z=>{
      const sc = SCREENS[z.screenIndex];
      if(!sc) return;
      if(z.name) sc.name = z.name;
      if(z.loreText) sc.loreText = z.loreText;
    });
  }
  if(cfg.cornPatches){
    cfg.cornPatches.forEach(p=>{
      const sc = SCREENS[p.screenIndex];
      if(!sc) return;
      // avoid duplicates
      if(!sc.corn.find(c=>c.x===p.x&&c.y===p.y))
        sc.corn.push({x:p.x, y:p.y});
    });
  }
  if(cfg.enemyVariants){
    cfg.enemyVariants.forEach(v=>{
      const sc = SCREENS[v.screenIndex];
      if(!sc) return;
      if(v.enemyIndex !== undefined && sc.enemies[v.enemyIndex]){
        Object.assign(sc.enemies[v.enemyIndex], v);
      } else {
        sc.enemies.push({
          tx:v.tx||9, ty:v.ty||7,
          spd:v.spd||0.5, pat:v.pat||'h',
          name:v.name, color:v.color,
          eyeColor:v.eyeColor, size:v.size||1,
          characterType:v.characterType||'iguana',
        });
      }
    });
  }

  // Apply secrets
  if(cfg.secrets){
    cfg.secrets.forEach(s=>{
      const sc=SCREENS[s.screenIndex];
      if(!sc) return;
      sc.secrets=sc.secrets||[];
      if(!sc.secrets.find(e=>e.type===s.type&&e.tx===s.tx&&e.ty===s.ty)){
        sc.secrets.push(s);
        // Place tile in map
        if(s.type==='fake_wall' && sc.map[s.ty]) sc.map[s.ty][s.tx]=T.FAKE_WALL;
        if(s.type==='depth_trap' && sc.map[s.ty]) sc.map[s.ty][s.tx]=T.DEPTH_TRAP;
        dbg('Secret added: '+s.type+' at '+s.tx+','+s.ty);
      }
    });
  }

  applyOrbitals(cfg);

  // Apply new screens from config
  if(cfg.newScreens && cfg.newScreens.length > 0){
    cfg.newScreens.forEach(ns=>{
      if(SCREENS.find(s=>s.name===ns.name)) return; // no duplicates
      SCREENS.push({
        name: ns.name||'New Area',
        gravity: ns.gravity !== false,
        loreText: ns.loreText||'',
        map: ns.map||generateDefaultMap(ns.gravity !== false),
        corn: (ns.corn||[]).map(c=>({...c})),
        enemies: (ns.enemies||[]).map(e=>({...e})),
      });
      dbg('Added screen: '+ns.name);
    });
    // Grow cols to 3 first, then add rows
    const total = SCREENS.length;
    WORLD_COLS = total <= 2 ? 2 : total <= 6 ? 3 : 4;
    WORLD_ROWS = Math.ceil(total / WORLD_COLS);
    dbg('World: '+WORLD_COLS+'x'+WORLD_ROWS);
  }
}

function generateDefaultMap(hasGravity){
  const map=[];
  for(let r=0;r<15;r++){
    const row=[];
    for(let c=0;c<20;c++){
      row.push(hasGravity?(r<4?0:1):(r<3?0:1));
    }
    map.push(row);
  }
  // Always open exits on all 4 edges so every screen is reachable
  // N exit: cols 8-11, row 0 = floor
  for(let c=8;c<=11;c++) map[0][c]=1;
  // S exit: cols 8-11, row 14 = floor
  for(let c=8;c<=11;c++) map[14][c]=1;
  // W exit: rows 6-8, col 0 = floor
  for(let r=6;r<=8;r++) map[r][0]=1;
  // E exit: rows 6-8, col 19 = floor
  for(let r=6;r<=8;r++) map[r][19]=1;
  // Add some wall structure for interest
  for(let c=0;c<8;c++) map[14][c]=2;
  for(let c=12;c<20;c++) map[14][c]=2;
  return map;
}

function triggerLoreFlash(sc){
  if(sc.loreText && sc.loreText.trim()){
    loreFlash = { text:sc.loreText, timer:200, screenIndex:SCREENS.indexOf(sc) };
  }
}

function drawLoreFlash(){
  if(loreFlash.timer<=0) return;
  loreFlash.timer--;
  const alpha = loreFlash.timer > 160 ? 1 :
                loreFlash.timer > 40  ? 1 :
                loreFlash.timer / 40;
  const isMoon = currentScreen().gravity;
  ctx.globalAlpha = alpha * 0.95;
  const tw = ctx.measureText(loreFlash.text).width + 32;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.beginPath();
  ctx.roundRect(GW/2-tw/2, GH-54, tw, 28, 8);
  ctx.fill();
  ctx.strokeStyle = isMoon ? 'rgba(255,204,2,0.5)' : 'rgba(0,200,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = isMoon ? '#ffcc02' : '#00ccff';
  ctx.font = 'bold 13px Fredoka One';
  ctx.textAlign = 'center';
  ctx.fillText(loreFlash.text, GW/2, GH-35);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

async function loadConfig(){
  try{
    const res = await fetch('/configs/in-space.json?t='+Date.now());
    dbg('Config fetch: '+res.status);
    if(res.ok){
      const cfg = await res.json();
      dbg('Enemies in config: '+(cfg.enemyVariants||[]).length);
      dbg('New screens in config: '+(cfg.newScreens||[]).length);
      applyConfig(cfg);
      dbg('World: '+WORLD_COLS+'x'+WORLD_ROWS+' ('+SCREENS.length+' screens)');
      // Nav map — show grid layout
      for(let r=0;r<WORLD_ROWS;r++){
        let row='';
        for(let c=0;c<WORLD_COLS;c++){
          const sc=SCREENS[screenIndex(c,r)];
          row+=sc?('['+sc.name.slice(0,5)+']'):'[----]';
        }
        dbg('  '+row);
      }
    } else {
      dbg('Config fetch failed: '+res.status);
    }
  }catch(e){
    dbg('Config error: '+e.message);
  }
  triggerLoreFlash(currentScreen());
  updateHUD();
  loop();
}

// Draw in-game nav mini-map (shown in debug mode)
function drawDebugNav(){
  if(!DEBUG) return;
  const tw=48, th=28, pad=4;
  const ox=GW-pad-(WORLD_COLS*tw)-pad;
  const oy=pad;
  for(let r=0;r<WORLD_ROWS;r++){
    for(let c=0;c<WORLD_COLS;c++){
      const idx=screenIndex(c,r);
      const sc=SCREENS[idx];
      const x=ox+c*tw, y=oy+r*th;
      const isCurrent=(c===screenCol&&r===screenRow);
      ctx.fillStyle=isCurrent?'rgba(255,204,2,0.7)':sc?'rgba(0,100,200,0.4)':'rgba(0,0,0,0.2)';
      ctx.fillRect(x,y,tw-2,th-2);
      ctx.strokeStyle=isCurrent?'#ffcc02':'rgba(100,150,255,0.5)';
      ctx.lineWidth=1;ctx.strokeRect(x,y,tw-2,th-2);
      if(sc){
        ctx.fillStyle=isCurrent?'#000':'#fff';
        ctx.font='7px Fredoka One';ctx.textAlign='center';
        ctx.fillText(sc.name.slice(0,6),x+(tw-2)/2,y+(th-2)/2+3);
      }
    }
  }
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadConfig();
</script>
