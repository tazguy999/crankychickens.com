// ══ AUDIO ══
let AC=null,musicOn=false,musT=null,musStep=0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,v,tp,when,f2){if(S.muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=tp||'sine';o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(f,when);if(f2)o.frequency.exponentialRampToValueAtTime(f2,when+d);g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(0.001,when+d);o.start(when);o.stop(when+d+0.02);}catch(e){}}
function sfx(n){if(S.muted)return;try{const t=ac().currentTime;
  if(n==='launch'){tone(300,0.25,0.18,'square',t,900);}
  else if(n==='bawk'){tone(700,0.08,0.16,'sawtooth',t,500);tone(900,0.14,0.16,'sawtooth',t+0.09,420);}
  else if(n==='thud'){tone(140,0.14,0.22,'triangle',t,60);}
  else if(n==='crack'){tone(520,0.07,0.14,'square',t,180);tone(260,0.12,0.12,'sawtooth',t+0.04,90);}
  else if(n==='poof'){tone(600,0.2,0.16,'sine',t,1500);tone(900,0.2,0.1,'sine',t+0.08,1900);}
  else if(n==='boom'){tone(120,0.5,0.3,'sawtooth',t,30);tone(70,0.6,0.3,'square',t,25);}
  else if(n==='bounce'){tone(220,0.06,0.08,'triangle',t,140);}
  else if(n==='grudge'){tone(196,0.3,0.2,'sawtooth',t);tone(147,0.5,0.2,'sawtooth',t+0.28);}
  else if(n==='friend'){tone(660,0.15,0.16,'sine',t);tone(880,0.3,0.16,'sine',t+0.14);}
  else if(n==='amber'){tone(1320,0.12,0.14,'sine',t);tone(1760,0.2,0.12,'sine',t+0.08);}
  else if(n==='roar'){tone(90,0.9,0.3,'sawtooth',t,45);tone(63,0.9,0.25,'square',t,40);}
  else if(n==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,0.3,0.18,'square',t+i*0.13));}
  else if(n==='lose'){[392,330,262].forEach((f,i)=>tone(f,0.35,0.16,'triangle',t+i*0.2));}
  else if(n==='tap'){tone(880,0.06,0.1,'square',t);}
  else if(n==='woof'){tone(320,0.09,0.2,'square',t,200);tone(300,0.1,0.2,'square',t+0.14,180);}
  else if(n==='gold'){[784,988,1175,1568].forEach((f,i)=>tone(f,0.25,0.14,'sine',t+i*0.07));}
}catch(e){}}
const MUS_B=[110,110,131,110,147,147,131,98],MUS_M=[440,0,523,0,587,523,0,392,440,0,330,0,392,440,0,0];
function musicTick(){if(S.muted||!musicOn)return;try{const t=ac().currentTime;const i=musStep++;
  if(i%2===0)tone(MUS_B[(i/2)%8],0.22,0.07,'triangle',t);
  const m=MUS_M[i%16];if(m)tone(m,0.16,0.035,'square',t);
  if(i%4===2)tone(1800,0.03,0.02,'square',t);}catch(e){}}
function startMusic(){if(musicOn)return;musicOn=true;musT=setInterval(musicTick,210);}
$('mute').onclick=()=>{S.muted=!S.muted;$('mute').textContent=S.muted?'🔇':'🔊';persist();if(!S.muted){sfx('tap');startMusic();}};

let scene='title',fr=0,chSel=0,cut=null,resultInfo=null;
function unlocked(i){return i===0||(S.stars[i-1]||0)>0;}
function startLevel(i){
 const def=LV[i],ch=Math.floor(i/3);
 L={i:i,def:def,ch:ch,bodies:[],shots:def.shots.slice(),proj:[],parts:[],toasts:[],t:0,bonk:{},hits:0,gold:false,fetch:S.fossil?2:1,endT:0,idle:0,drag:null,kaim:null,wind:0,last:null,shake:0,flash:0,boss:null,stretch:null,done:false,amber:0,peace:false};
 def.build();
 for(let k=0;k<400;k++)stepBodies(true);
 for(const b of L.bodies){b.vy=0;if(b.sp&&!SP[b.sp].nodex)S.dex[b.sp]=1;}
 if(def.final){const c=crowd();L.peaceOK=(c.foes===0&&c.friends>=3);}
 renderBG(CH[ch].biome,i);scene='play';persist();
 say(def.who,def.hint);
 panel('<div class="row"><button class="big alt" id="bR">↻ RETRY</button><button class="big alt" id="bM">🗺 MAP</button></div>');
 $('bR').onclick=()=>{sfx('tap');startLevel(i);};$('bM').onclick=()=>{sfx('tap');showMap();};
}
function parts(x,y,n,col,o){o=o||{};for(let i=0;i<n&&L.parts.length<160;i++)L.parts.push({x:x,y:y,vx:(Math.random()-0.5)*(o.sp||5),vy:-Math.random()*(o.up||4)-0.5,life:30+Math.random()*25,col:col,sz:o.sz||3,ch:o.ch||null});}
function toast(t,life){L.toasts.push({t:t,life:life||130});}
function bonk(b){if(L.bonk[b.who])return;L.bonk[b.who]=true;b.hurt=30;const n=PAL[b.who].n.toUpperCase();toast('😤 '+n+' WILL REMEMBER THAT.',150);sfx('grudge');parts(b.x+b.w/2,b.y,6,'#f55',{ch:'💢',up:3});}
function dmg(b,amt){
 if(b.dead||amt<1.5)return 0;
 if(b.who){if(amt>=3)bonk(b);return 0;}
 if(b.inv)return 0;
 if(b.hang){b.hang=false;}
 b.hp-=amt;b.hurt=12;
 if(b.hp<=0)kill(b);else sfx(b.k==='b'?'crack':'thud');
 return amt;
}
function kill(b){
 b.dead=true;const cx=b.x+b.w/2,cy=b.y+b.h/2;
 if(b.k==='b'){const m=MAT[b.mat];parts(cx,cy,8,m.c,{sz:4});parts(cx,cy,4,m.d,{sz:3});sfx('crack');
  if(b.mat==='amber'){S.amber++;L.amber++;parts(cx,cy,5,'#ffe27a',{ch:'💎',up:5});sfx('amber');}
  if(b.fossil&&!S.fossil){S.fossil=true;L.fetch++;toast('🐶 You freed FOSSIL, a prehistoric puppy! Kevin has a friend. +1 fetch, forever.',220);sfx('woof');}
 }else{parts(cx,cy,12,'#fff',{sz:3,sp:6});parts(cx,cy,3,'#fff',{ch:'🪶',up:5});parts(cx,b.y,1,'#f55',{ch:'💢',up:2,sp:1});sfx('poof');
  if(b===L.boss&&L.stretch){toast('💥 STRETCH DROPPED THE TIME MACHINE!',160);}}
}
function stepBodies(quiet){
 const bs=L.bodies;bs.sort((a,b)=>(b.y+b.h)-(a.y+a.h));let moving=false;
 for(const a of bs){
  if(a.dead)continue;
  if(a.fly){if(!quiet){const f=a.fly,t=L.t;a.x=f.cx+Math.sin(t*f.spd+f.ph)*f.ax-a.w/2;a.y=f.cy+Math.sin(t*f.spd*1.31+f.ph*2)*f.ay-a.h/2;}continue;}
  if(a.hang)continue;
  a.vy+=0.35;const ny=a.y+a.vy;let floor=GY,sup=null,s0=0,s1=0;
  for(const o of bs){if(o===a||o.dead||o.fly)continue;
   const ox=Math.min(a.x+a.w,o.x+o.w)-Math.max(a.x,o.x);
   if(ox>1&&o.y>=a.y+a.h-1.5){if(o.y<floor-0.01){floor=o.y;sup=o;s0=o.x;s1=o.x+o.w;}else if(sup&&Math.abs(o.y-floor)<0.01){s0=Math.min(s0,o.x);s1=Math.max(s1,o.x+o.w);}}}
  if(ny+a.h>=floor){a.y=floor-a.h;
   if(a.vy>3.2&&!quiet){const imp=a.vy;dmg(a,imp*(a.k==='d'?2:1.4));if(sup)dmg(sup,imp*clamp(a.w*a.h/900,0.5,4)*2.2);L.shake=Math.max(L.shake,4);}
   if(a.vy>1.2)moving=true;a.vy=0;
   if(sup&&!quiet){const c=a.x+a.w/2;if(c<s0-1){a.x-=1.4;moving=true;}else if(c>s1+1){a.x+=1.4;moving=true;}}
  }else{a.y=ny;moving=true;}
 }
 return moving;
}
function touched(p){if(!p.hit){p.hit=true;if(p.type==='bomb'&&!p.used)p.fuse=55;}}
function stepProj(p){
 p.life++;if(p.ghost>0)p.ghost--;
 for(let k=0;k<2;k++){
  p.vy+=GRAV/2;if(L.wind&&!p.rest)p.vx+=L.wind/2;p.x+=p.vx/2;p.y+=p.vy/2;
  if(p.y+p.r>GY){p.y=GY-p.r;if(Math.abs(p.vy)>2.5)sfx('bounce');p.vy*=-0.35;p.vx*=0.74;touched(p);}
  for(const b of L.bodies){
   if(b.dead)continue;if(p.ghost>0&&b.k==='b')continue;
   const cx=clamp(p.x,b.x,b.x+b.w),cy=clamp(p.y,b.y,b.y+b.h);let dx=p.x-cx,dy=p.y-cy;const d2=dx*dx+dy*dy;
   if(d2>=p.r*p.r)continue;
   let nx,ny;const d=Math.sqrt(d2);
   if(d>0.01){nx=dx/d;ny=dy/d;p.x=cx+nx*(p.r+0.3);p.y=cy+ny*(p.r+0.3);}
   else{const l=p.x-b.x,r=b.x+b.w-p.x,t=p.y-b.y,bt=b.y+b.h-p.y,m=Math.min(l,r,t,bt);nx=m===l?-1:m===r?1:0;ny=(nx===0)?(m===t?-1:1):0;p.x+=nx*(m+p.r);p.y+=ny*(m+p.r);}
   const vn=p.vx*nx+p.vy*ny;if(vn>0)continue;
   const sp=Math.hypot(p.vx,p.vy);let amt=(-vn*1.25+sp*0.25)*p.mass;
   if(b.boss&&b.sp==='rex'&&p.y<b.y+b.h*0.4)amt*=2;
   const was=b.k==='d'&&b.enemy;const did=dmg(b,amt);touched(p);
   if(was&&did>0){L.hits++;if(L.hits>=3&&!L.gold){L.gold=true;L.shots.unshift('gold');toast('🌟 3 DIRECT HITS! GOLDEN YOLK UNLOCKED!',150);sfx('gold');}}
   if(b.dead){const keep=(b.mat==='ice'||p.type==='gold')?0.86:0.55;p.vx*=keep;p.vy*=keep;}
   else{p.vx-=1.3*vn*nx;p.vy-=1.3*vn*ny;p.vx*=0.88;p.vy*=0.88;}
  }
 }
 if(p.fuse>0){p.fuse--;if(p.fuse===0)explode(p);}
 const spd=Math.hypot(p.vx,p.vy);
 if(p.y+p.r>=GY-0.6&&spd<0.7){p.rest=(p.rest||0)+1;p.vx*=0.8;}
 if(p.rest>45||p.life>540||p.x>W+50||p.x<-50)p.dead=true;
 if(p.life%2===0){p.trail.push(p.x,p.y);if(p.trail.length>24)p.trail.splice(0,2);}
}
function explode(p){
 if(p.dead)return;p.dead=true;p.used=true;const R=74;sfx('boom');L.shake=10;L.flash=14;
 parts(p.x,p.y,22,'#ffb02a',{sz:5,sp:9,up:6});parts(p.x,p.y,10,'#555',{sz:4,sp:7});
 for(const b of L.bodies.slice()){if(b.dead)continue;const cx=clamp(p.x,b.x,b.x+b.w),cy=clamp(p.y,b.y,b.y+b.h);const d=Math.hypot(p.x-cx,p.y-cy);if(d<R)dmg(b,26*(1-d/R)+5);}
}
function ability(){
 for(const p of L.proj){if(p.dead||p.used||p.rest||(p.hit&&p.type!=='bomb'))continue;
  if(p.type==='scratchy'){p.used=true;const sp=Math.hypot(p.vx,p.vy)||1;const ns=Math.max(sp*1.6,12);p.vx=p.vx/sp*ns;p.vy=p.vy/sp*ns;p.mass=1.35;sfx('bawk');parts(p.x,p.y,6,'#ffcc02',{sz:3});return true;}
  if(p.type==='pearl'){p.used=true;const sp=Math.hypot(p.vx,p.vy),a=Math.atan2(p.vy,p.vx);for(const da of[-0.24,0.24]){L.proj.push({x:p.x,y:p.y,vx:Math.cos(a+da)*sp,vy:Math.sin(a+da)*sp,r:8,type:'pearl',mass:0.75,used:true,life:p.life,trail:[],ghost:0});}p.mass=0.75;p.r=8;sfx('bawk');parts(p.x,p.y,6,'#fff',{sz:3});return true;}
  if(p.type==='bomb'){explode(p);return true;}
  if(p.type==='ghost'){p.used=true;p.ghost=46;sfx('poof');parts(p.x,p.y,6,'#b9e6ff',{sz:3});return true;}
 }
 return false;
}
function canAim(){if(L.done||!L.shots.length)return false;for(const p of L.proj)if(!p.dead&&!p.hit)return false;return true;}
function fire(vx,vy){
 if(!canAim())return false;const type=L.shots.shift();L.last=type==='gold'?L.last:type;
 L.proj.push({x:SX,y:SY,vx:vx,vy:vy,r:type==='gold'?12:10,type:type,mass:type==='gold'?2.6:1,used:type==='gold',life:0,trail:[],ghost:0});
 L.idle=0;sfx('launch');sfx('bawk');startMusic();return true;
}
function update(){
 if(scene!=='play'||!L)return;
 L.t++;if(L.shake>0)L.shake--;if(L.flash>0)L.flash--;
 const b=L.boss;L.wind=0;L.roar=0;
 if(b&&!b.dead&&b.roar){const c=L.t%400;if(c>=290&&c<340)L.roar=1;else if(c>=340){L.roar=2;L.wind=-0.3;if(c===340){sfx('roar');L.shake=14;}}}
 const moving=stepBodies(false);
 for(const p of L.proj)if(!p.dead)stepProj(p);
 L.proj=L.proj.filter(p=>!p.dead);L.bodies=L.bodies.filter(x=>!x.dead||x===L.boss);
 for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=0.18;q.life--;}L.parts=L.parts.filter(q=>q.life>0);
 for(const x of L.bodies)if(x.hurt>0)x.hurt--;
 if(L.toasts.length){L.toasts[0].life--;if(L.toasts[0].life<=0)L.toasts.shift();}
 if(L.done)return;
 if(L.peaceOK&&b&&!b.dead&&b.hp<=b.max*0.5){L.peace=true;L.done=true;toast('🕊 STRETCH: "WAIT. Wait wait wait. Can we talk?"',120);const me=L;setTimeout(()=>{if(L===me&&scene==='play')win();},1900);return;}
 let enemies=0;for(const x of L.bodies)if(x.enemy&&!x.dead)enemies++;
 if(enemies===0){L.endT++;if(L.endT>70){L.done=true;win();}return;}
 if(!L.shots.length&&!L.proj.length&&!moving){L.idle++;
  if(L.idle>50){if(L.fetch>0&&L.last){L.fetch--;L.shots.push(L.last);L.idle=0;toast('🐶 Kevin fetched your chicken! One more shot!',130);sfx('woof');}
   else{L.done=true;lose();}}
 }else L.idle=0;
}

   ctx.save();ctx.translate(230,205);ctx.rotate(Math.sin(t*0.05)*0.4);skChicken(0,40,1.7);ctx.restore();ctx.save();ctx.translate(430,185);ctx.rotate(Math.cos(t*0.05)*0.5);skDog(10,20,1.7,t);ctx.restore();
   fitText('they go into the time of the dinosores',W/2,334,560,22,'#4a4a4a','center');}
  else if(f.art==='p3'){pen();ctx.beginPath();ctx.moveTo(14,296);ctx.lineTo(W-14,296);ctx.stroke();const nod=clamp((t-40)/60,0,1),lift=clamp((t-120)/80,0,1);
   const hd=skLong(520,296,1.05,nod*(1-lift));skChicken(150,294,1.15);skDog(245,294,1.1,t);
   if(lift<=0)skDoor(350,296,1.2);else skDoor(hd.hx-6,hd.hy+86,1.0);
   fitText('he steals it!',300,60,300,28,'#4a4a4a');if(t>40&&lift<=0){ctx.beginPath();ctx.moveTo(350,74);ctx.lineTo(350,150);ctx.lineTo(342,138);ctx.moveTo(350,150);ctx.lineTo(358,138);ctx.stroke();}}
  else{skChicken(110,300,1.4);skDog(210,300,1.3,t);fitText('Cranky Chickens',W/2+60,150,400,40,'#4a4a4a','center');fitText('jrassic scwawk',W/2+60,200,400,34,'#4a4a4a','center');fitText('storyboard by the Cranky Chickens kids\' studio',W/2+60,250,400,15,'#777','center');}
  return;}
 // story beats + endings: in-game art
 ctx.drawImage(bgC,0,0);
 if(f.art==='end'){drawTM(320,GY,1.5,t);drawBird('scratchy',250,GY-16,16,0,t);drawDog(210,GY,1.1,t,true);if(S.fossil)drawDog(175,GY,0.8,t+9,true);
  if(f.end==='peace'){drawDino('bronto',430,GY-70,120,70,{dex:1,fr:t});drawDino('trike',60,GY-38,56,38,{flip:1});drawDino('anky',120,GY-30,50,30,{flip:1});drawDino('rexjr',380,GY-32,32,32,{});for(let i=0;i<6;i++){ctx.font='18px sans-serif';ctx.fillText('💚',80+i*90,90+Math.sin(t*0.05+i)*20);}}
  else if(f.end==='grudge'){for(let i=0;i<5;i++)drawDino(['trike','anky','ptero','grump','carno'][i],400+i*44,GY-44-(i%2)*6,44,40,{mad:1,fr:t});ctx.font='22px sans-serif';ctx.fillText('💢',470,200+Math.sin(t*0.2)*4);ctx.fillText('✉️',520,150-((t*0.5)%120));}
  else{drawDino('bronto',440,GY-70,120,70,{dex:1,fr:t});ctx.font='22px sans-serif';ctx.fillText('👋',430,170+Math.sin(t*0.2)*4);}
  return;}
 drawBird('scratchy',200,GY-16,16,0,t);drawDog(260,GY,1.1,t,false);
 if(f.ch===4)drawDino('rex',420,GY-110,110,110,{fr:t});
 else{ctx.save();ctx.translate(520,GY);ctx.scale(-0.6,0.6);drawDino('bronto',-60,-70,120,70,{dex:1,fr:t});ctx.restore();drawTM(548,GY-44,0.5,t);}
}
function intro(){
 renderBG('jungle',1);
 playCut([
  {who:'PANEL 1',text:'Scratchy built a time machine. Kevin the dog helped by sitting on the instructions.',art:'p1'},
  {who:'PANEL 2',text:'WHOOOOOSH. Sixty-six million years, straight backward. Kevin did not love it.',art:'p2'},
  {who:'PANEL 3',text:'They landed in the time of the dinosaurs. Then a long-neck leaned down... and HE STEALS IT.',art:'p3'},
  {who:'THE ORIGINAL STORYBOARD',text:'Here is the real storyboard this game was built from. Now go get that time machine back.',art:'board'}
 ],()=>{S.seen.intro=1;persist();chSel=0;goLevel(0);});
}
function ending(){
 const c=crowd();let kind='home';if(resultInfo&&resultInfo.peace||c.foes===0&&c.friends>=3)kind='peace';else if(c.foes>=2)kind='grudge';
 S.end=kind;S.dex.rexjr=1;persist();renderBG('gate',99);
 const F=(who,text)=>({who:who,text:text,art:'end',end:kind});let fs;
 if(kind==='peace')fs=[F('STRETCH','"I only wanted to see the future. Everybody keeps saying my family turns into CHICKENS."'),F('SCRATCHY','"...Hop in. I will show you. It is honestly not that bad."'),F('NARRATOR','The Egg hatched during the goodbye party. It is a tiny T-Rex named Rexter Jr. We are still not talking about it.'),F('ENDING 1 OF 3: FAMILY REUNION','Everyone you were nice to came to wave. Trevor cried. Trevor says he did not.')];
 else if(kind==='grudge')fs=[F('SCRATCHY','"Got it! Go go go go GO!"'),F('NARRATOR','They made it home. But the dinosaurs you bonked wrote a very strongly worded letter and buried it for sixty-six million years.'),F('ABUELA ROSA','"Mijo, there is a FOSSIL in the mailbox. It says \'WE REMEMBER.\' What did you DO?"'),F('ENDING 3 OF 3: ANCESTRAL GRUDGE','Replay levels without bonking your friends to change how they remember you.')];
 else fs=[F('STRETCH','"Fine. FINE. Take it. I was only borrowing it."'),F('SCRATCHY','"You were three chapters away with it, Stretch."'),F('NARRATOR','They made it home in time for dinner, which was, awkwardly, chicken-shaped nuggets. Nobody made eye contact.'),F('ENDING 2 OF 3: TIME TO GO HOME','Be nice to at least three dinosaurs (and hold zero grudges) to see the secret ending.')];
 playCut(fs,()=>{sfx('win');showMap();});
}

// ══ TITLE / MAP / DEX RENDER ══
function drawTitle(){
 ctx.drawImage(bgC,0,0);const t=fr;
 ctx.save();ctx.translate(560,GY);ctx.scale(-1.25,1.25);drawDino('bronto',-60,-70,120,70,{dex:1,fr:t});ctx.restore();drawTM(600,GY-70+Math.sin(t*0.1)*2,0.55,t);
 drawDino('rex',380,GY-78,78,78,{fr:t});drawDino('compy',330,GY-20,22,20,{mad:1});
 drawBird('scratchy',110,GY-20+Math.sin(t*0.1)*3,20,0,t);drawDog(170,GY,1.2,t,true);
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(90,36,460,112,14);ctx.fill();
 fitText('CRANKY CHICKENS V',W/2,68,420,20,'#fff','center');fitText('JURASSIC SQUAWK',W/2,108,430,40,'#ffcc02','center');fitText('"Life, Uh... Finds a Bawk"',W/2,134,420,15,'#b9f0a0','center');
}
function drawMap(){
 ctx.fillStyle='#e9d9a8';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b89a5a';ctx.lineWidth=4;ctx.strokeRect(8,8,W-16,H-16);
 const pts=[[70,270],[160,170],[250,260],[340,150],[430,250],[520,140],[590,240]];
 ctx.setLineDash([8,8]);ctx.strokeStyle='#8a6a3a';ctx.lineWidth=4;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);
 fitText('WHERE DID STRETCH GO?',W/2,46,400,22,'#6a4a1a','center');
 for(let i=0;i<7;i++){const p=pts[i],u=unlocked(i*3),b=BIOME[CH[i].biome];let st=0;for(let k=0;k<3;k++)st+=S.stars[i*3+k]||0;
  ctx.fillStyle=u?b.hill:'#b0a58a';circ(p[0],p[1],i===chSel?30:25);ctx.strokeStyle=i===chSel?'#ffcc02':'#5a4a2a';ctx.lineWidth=i===chSel?5:3;ctx.beginPath();ctx.arc(p[0],p[1],i===chSel?30:25,0,7);ctx.stroke();
  ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(u?CH[i].e:'🔒',p[0],p[1]+8);ctx.textAlign='left';
  fitText((i+1)+'  '+(st?'⭐'+st+'/9':''),p[0],p[1]+50,80,13,'#5a3a1a','center');}
 const cp=pts[chSel];drawBird('scratchy',cp[0]-34,cp[1]-34+Math.sin(fr*0.1)*3,11,0,fr);
 const sp=pts[6];ctx.save();ctx.globalAlpha=0.9;ctx.translate(sp[0]+22,sp[1]-28);ctx.scale(-0.35,0.35);drawDino('bronto',-60,-70,120,70,{dex:1});ctx.restore();
}
function mapTap(x,y){const pts=[[70,270],[160,170],[250,260],[340,150],[430,250],[520,140],[590,240]];for(let i=0;i<7;i++){if(Math.hypot(x-pts[i][0],y-pts[i][1])<42&&unlocked(i*3)){chSel=i;sfx('tap');mapPanel();return;}}}
function drawDex(){
 ctx.fillStyle='#16351f';ctx.fillRect(0,0,W,H);const ids=Object.keys(SP).filter(k=>!SP[k].nodex);
 fitText('DINO-DEX  ·  PAGE '+(dexPage+1)+' / 4',W/2,26,400,18,'#ffcc02','center');
 for(let k=0;k<6;k++){const id=ids[dexPage*6+k];if(!id)continue;const sp=SP[id],cx=k%3,cy=Math.floor(k/3),x=14+cx*206,y=38+cy*158,seen=S.dex[id];
  ctx.fillStyle=seen?'#234a2c':'#1b2a20';ctx.beginPath();ctx.roundRect(x,y,198,150,10);ctx.fill();
  if(seen){const sc=Math.min(70/sp.w,62/sp.h,1.6);const w=sp.w*sc,h=sp.h*sc;drawDino(id,x+99-w/2,y+78-h,w,h,{mad:id!=='bronto',dex:1,fr:fr});
   fitText(sp.n,x+99,y+100,186,14,'#ffcc02','center');wrapText(sp.b,x+99,y+117,186,11,'#cfe8c4');}
  else{fitText('?',x+99,y+80,60,44,'#3a5a40','center');fitText('NOT MET YET',x+99,y+110,180,13,'#5a7a60','center');}}
}
function wrapText(t,cx,y,max,size,col){ctx.font=size+'px '+FF;const words=t.split(' ');let line='',n=0;ctx.fillStyle=col;ctx.textAlign='center';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max&&line){ctx.fillText(line,cx,y+n*(size+2));line=w;n++;if(n>=2)break;}else line=test;}if(n<3&&line)ctx.fillText(line,cx,y+n*(size+2));ctx.textAlign='left';}
function drawResult(){
 if(L)drawPlay();ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);const r=resultInfo;
 if(r.win){fitText(r.peace?'PEACE!':'CLEARED!',W/2,150,400,46,'#ffcc02','center');ctx.font='44px sans-serif';ctx.textAlign='center';ctx.fillText('⭐'.repeat(r.stars),W/2,215);ctx.textAlign='left';}
 else fitText('OUT OF CHICKENS',W/2,180,460,40,'#ff9d8a','center');
}
function titleScreen(){
 scene='title';renderBG('jungle',1);
 say('KEVIN (woof translation)','Woof! (A long-neck stole our time machine. We are getting it back. Bring chickens.)');
 const has=Object.keys(S.stars).length>0;
 panel('<div class="row"><button class="big go" id="tP">'+(has?'▶ CONTINUE':'▶ PLAY')+'</button>'+(has?'<button class="big alt" id="tI">🎬 WATCH THE INTRO</button>':'')+'</div><div class="note">Pull back and let go to launch. Tap while flying for each chicken\'s special move. Works with touch, mouse, or arrow keys + Enter.</div>');
 $('tP').onclick=()=>{sfx('tap');startMusic();if(has||S.seen.intro)showMap();else intro();};
 if($('tI'))$('tI').onclick=()=>{sfx('tap');startMusic();intro();};
}

// ══ INPUT ══
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
C.addEventListener('pointerdown',e=>{e.preventDefault();const q=pos(e);
 if(scene==='map'){mapTap(q.x,q.y);return;}
 if(scene==='cut'){return;}
 if(scene!=='play'||!L||L.done)return;
 if(ability())return;
 if(canAim()){L.kaim=null;L.drag={x0:q.x,y0:q.y,x:q.x,y:q.y};try{C.setPointerCapture(e.pointerId);}catch(err){}}
});
C.addEventListener('pointermove',e=>{if(scene==='play'&&L&&L.drag){const q=pos(e);L.drag.x=q.x;L.drag.y=q.y;}});
function release(){if(scene!=='play'||!L||!L.drag)return;const a=aimVec();L.drag=null;if(a&&a.d>12)fire(-a.dx*0.2,-a.dy*0.2);}
C.addEventListener('pointerup',release);C.addEventListener('pointercancel',()=>{if(L)L.drag=null;});
window.addEventListener('keydown',e=>{
 if(scene==='play'&&L&&!L.done){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(ability())return;if(!L.kaim)L.kaim={a:0.7,p:60};else{const a=aimVec();fire(-a.dx*0.2,-a.dy*0.2);}return;}
  if(e.key.indexOf('Arrow')===0){e.preventDefault();if(!L.kaim)L.kaim={a:0.7,p:60};const k=L.kaim;if(e.key==='ArrowUp')k.a=Math.min(1.45,k.a+0.04);if(e.key==='ArrowDown')k.a=Math.max(-0.2,k.a-0.04);if(e.key==='ArrowRight')k.p=Math.min(MAXPULL,k.p+3);if(e.key==='ArrowLeft')k.p=Math.max(14,k.p-3);}
 }else if(e.key==='Enter'){const b=document.querySelector('#panel button.go')||document.querySelector('#panel button.big');if(b&&document.activeElement!==b){e.preventDefault();b.click();}}
});

// ══ LOOP ══
function loop(){
 fr++;
 try{
  if(scene==='play'){update();if(scene==='play')drawPlay();else if(scene==='result')drawResult();}
  else if(scene==='result')drawResult();
  else if(scene==='title')drawTitle();
  else if(scene==='map'||scene==='grudge')drawMap();
  else if(scene==='dex')drawDex();
  else if(scene==='cut'&&cut)drawCut();
 }catch(err){if(window.console)console.error(err);}
 requestAnimationFrame(loop);
}
titleScreen();loop();
</script>
