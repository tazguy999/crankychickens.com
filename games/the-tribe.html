<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout idea: a kid-drawn comic taped up in a dark bedroom. Paper panels with marker outlines on a night-blue wall. */
:root{
  --night:#1b2659; --night2:#111a44; --paper:#fffef6; --ink:#151515;
  --caption:#ffd93b; --pop:#ff5a4f; --spark:#6fe0cf; --bond:#ff8fc0; --mute:#5b5f73;
  --display:"Londrina Solid","Arial Black",Impact,sans-serif;
  --body:"Patrick Hand","Comic Sans MS","Segoe Print",cursive,sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--night2)}
body{margin:0;background:
  radial-gradient(circle at 12% 8%,#fff 0 1.5px,transparent 2px),
  radial-gradient(circle at 78% 4%,#fff 0 1px,transparent 1.5px),
  radial-gradient(circle at 55% 14%,#ffe9a8 0 1.5px,transparent 2px),
  radial-gradient(circle at 92% 22%,#fff 0 1px,transparent 1.5px),
  linear-gradient(var(--night),var(--night2)) fixed;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35}
#app{max-width:860px;margin:0 auto;padding:14px 16px 180px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:.5px;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:#fff;padding:6px 2px 12px}
.top h1{font-size:44px;line-height:.95;color:var(--caption);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);overflow-wrap:anywhere}
.eyebrow{font-family:var(--display);font-size:18px;letter-spacing:2px;text-transform:uppercase;color:#cfd6ff}
.moves{text-align:right;color:#cfd6ff;font-size:16px;white-space:nowrap}
.pips{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.pip{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:var(--caption);box-shadow:0 0 10px #ffe680}
.pip.off{background:#3a467f;box-shadow:none}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:3px solid var(--ink);background:#c9d0f5;border-radius:14px 14px 4px 4px;padding:6px 2px;font-family:var(--display);font-size:20px;min-width:0}
.tabs button[aria-selected="true"]{background:var(--paper);transform:translateY(2px)}

.panel{background:var(--paper);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:5px 5px 0 var(--ink);padding:14px}
.cap{display:inline-block;background:var(--caption);border:3px solid var(--ink);padding:2px 10px;font-family:var(--display);font-size:20px;transform:rotate(-1.2deg);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--paper);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:4px 4px 0 var(--ink);padding:8px 8px 10px;min-width:0}
.card:nth-child(even){border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card h3{font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.role{color:var(--mute);font-size:16px}
.tal{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.tk{min-width:28px;height:28px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--spark);font-size:15px}
.tk.q{background:#e9e9ef;font-family:var(--display);color:var(--mute)}
.tag{font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:0 6px;background:#dfe4ff;margin-top:4px}
.tag.mend{background:#ffd0cc}.tag.keep{background:var(--caption)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--night2);border-top:3.5px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar .btn{font-size:17px;padding:8px 2px}
.btn.e{background:#ffb37a}
.rn textarea{flex:1;min-width:0;font:14px/1.2 monospace;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;color:var(--ink);height:64px}
.card.away svg{opacity:.3}
.cv{display:block;width:min(100%,calc(56vh*.75));margin:0 auto;border:3.5px solid var(--ink);border-radius:12px;touch-action:none;background:#222}
.holes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto}
.hole{aspect-ratio:1;border:3px solid var(--ink);border-radius:50%;background:#e9e9ef;font-size:28px;padding:0;line-height:1}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;margin:0 auto}
.pad{aspect-ratio:1.4;border:3.5px solid var(--ink);border-radius:18px;font-size:38px;opacity:.55}
.pad.p0{background:var(--bond)}.pad.p1{background:var(--spark)}.pad.p2{background:var(--caption)}.pad.p3{background:#b9a6ff}
.pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.tbar{position:relative;height:40px;border:3.5px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
.tbar i{position:absolute;top:0;bottom:0;background:var(--spark)}
.tbar b{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--ink)}
.face{font-size:64px;text-align:center;line-height:1.2}
.tabs button{font-size:18px}
.bar .turn{grid-column:1/-1;order:-1;font-size:22px;padding:9px 8px}
.next{color:#fff;font-size:17px;margin-bottom:8px}
.scene{position:relative;width:100%;padding-top:75%;border:3.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#c4935f;box-shadow:5px 5px 0 var(--ink)}
.scin{position:absolute;top:0;left:0;right:0;bottom:0}
.bg{position:absolute;top:0;left:0;width:100%;height:100%}
.sd{position:absolute;width:13%;padding:0;border:0;background:none;transform:translate(-50%,-72%);transition:left 1.8s linear,top 1.8s linear;touch-action:none;cursor:grab}
.sd svg{width:100%;height:auto;display:block;pointer-events:none}
.sd.flip svg{transform:scaleX(-1)}
.sd.hurt{opacity:.75}
.sd.drag{transition:none;z-index:999!important;cursor:grabbing}
.sd .nm{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);font-size:12px;line-height:1.2;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:0 4px;white-space:nowrap;pointer-events:none}
.bub{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:19px;line-height:1.3;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 6px;pointer-events:none}
.stn{position:absolute;transform:translate(-50%,-50%);font-size:13px;line-height:1.3;background:rgba(255,254,246,.88);border:2px solid var(--ink);border-radius:8px;padding:0 5px;z-index:1;white-space:nowrap}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--caption);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;display:none;z-index:1000;width:max-content;max-width:90%;text-align:center}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){.sd{transition:none}}
.know{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.know b{font-family:var(--display);font-weight:400;font-size:19px}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:8px 6px;font-family:var(--display);font-size:19px;line-height:1.05}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.a{background:var(--bond)}.btn.b{background:var(--spark)}.btn.c{background:var(--caption)}.btn.d{background:#b9a6ff}
.btn.go{background:var(--pop);color:#fff;font-size:24px;padding:10px 16px;text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.sm{font-size:16px;padding:5px 8px;box-shadow:2px 2px 0 var(--ink)}
.btn.on{background:var(--caption)}

#sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,14,40,.82);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.on{display:flex}
.sh{background:var(--paper);border:3.5px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:660px;max-height:92%;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.sh h2{font-size:30px;line-height:1;overflow-wrap:anywhere}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;background:#fff;font-family:var(--display);font-size:20px;flex:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chip{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-size:16px;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--caption);box-shadow:3px 3px 0 var(--ink)}
.chip[disabled]{opacity:.4}
.chip small{font-size:13px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px;text-align:left;font-size:16px;line-height:1.15}
.opt.on{background:var(--caption);box-shadow:3px 3px 0 var(--ink)}
.opt[disabled]{opacity:.4;text-decoration:line-through}
.opt b{font-family:var(--display);font-size:20px;font-weight:400;display:block}
.step{font-family:var(--display);font-size:20px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--caption),0 0 0 6px var(--ink)}

.lines{display:flex;flex-direction:column;gap:10px}
.ln{border:3px solid var(--ink);border-radius:var(--wob);padding:8px 12px;background:#fff}
.ln.bond{background:#ffe1ee}
.ln.burst{background:var(--spark);font-family:var(--display);font-size:24px;line-height:1.1;text-align:center;padding:14px;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.ln.burst small{display:block;font-family:var(--body);font-size:17px}
.ln.oops{background:#eef0f7}
.ln.loot{background:#fff3b8}
.ln.ev{background:#e4dcff}
.ln.ev h3{font-size:24px}
@keyframes pop{from{transform:scale(.6) rotate(-4deg)}to{transform:scale(1) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.ln.burst{animation:none}}

.meter{height:14px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bond)}
.brow{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.brow small{grid-column:1/-1;color:var(--mute);font-size:15px;margin-top:-2px}
.lv{display:flex;gap:3px}.lv i{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:#fff}.lv i.f{background:var(--spark)}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-family:var(--display);font-size:22px;border-bottom:3px solid var(--ink);margin-top:4px}
.rn{display:flex;gap:6px}
.rn input{flex:1;min-width:0;font:inherit;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;color:var(--ink)}
ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.log li{padding-left:18px;position:relative}
ul.log li::before{content:"";position:absolute;left:0;top:.45em;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:#fff}
ul.log li.bond::before{background:var(--bond)}ul.log li.spark::before{background:var(--spark)}ul.log li.loot::before{background:var(--caption)}ul.log li.oops::before{background:var(--pop)}
.stack{display:flex;flex-direction:column;gap:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:3px solid var(--ink);border-radius:14px;padding:6px 8px;background:#eef0f7;color:var(--mute);font-size:15px;line-height:1.15}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.badge.got{background:var(--caption);color:var(--ink)}
svg.drg{display:block;max-width:100%;height:auto}
svg.web{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
svg.web g[data-a]{cursor:pointer}
svg.web text{font-family:var(--body);font-size:11px;text-anchor:middle;fill:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--mute);justify-content:center}
.key i{display:inline-block;width:22px;height:0;border-top:4px solid;vertical-align:middle;margin-right:4px}
.two{display:flex;justify-content:center;align-items:center;gap:6px}
</style>
</head>

};

};

function estimate(team,k,hidden,place){

  team.forEach(m=>{const t=tal(m,k);if(t&&t.found)s+=12+4*tl(t);else if(t&&hidden)s+=8;if(m.type==='plastic')s+=4;});
  let sum=0,n=0,duo=false;
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){const o=bondOf(team[i],team[j]);sum+=o.p;n++;if(o.duo)duo=true;}
  if(n)s+=sum/n/5;if(duo)s+=10;

}

      d.stage='grown';const m='Naming ceremony! Wee '+d.name+' is all grown up and is now just '+d.name+'.';out.push({c:'burst',h:'🎉 GROWN UP!<small>'+esc(m)+'</small>'});log(m,'spark');
      earnName(d,out);

        const hid=d.talents.filter(t=>!t.found);
        if(hid.length&&lvl(bondOf(d,mt).p)>=2){out.push({c:'ln',h:esc('At the ceremony, '+mt.name+' told everyone what a good mentor notices.')});reveal(d,pick(hid).k,out);}
        else{const k=giveHint(d);if(k)out.push({c:'ln',h:'🔍 '+esc(mt.name+', the proud mentor, shared a clue: '+d.name+' '+T[k].clue+'.')});}
        addBond(d,mt,6,out);award(mt,'leaf',out);}
    }
    else if(d.stage==='grown'&&d.age>=16){d.stage='loved';const m=d.name+' has been loved so long they are now a Well-Loved dragon, patch and all.';out.push({c:'ln',h:esc(m)});log(m,'bond');}
    d.energy=maxE(d);
  });
  const here=S.dragons.filter(d=>!d.away);
  if(here.length>1){
    const a=pick(here),b=pick(here.filter(d=>d.id!==a.id)),c=compat(a,b),o=bondOf(a,b);
    if(c<0&&!o.tiff&&chance(.3)){o.tiff=true;o.p=Math.max(0,o.p-4);const m='While you were away, '+a.name+' and '+b.name+' '+pick(TIFFS)+'.';out.push({c:'oops',h:esc(m)});log(m,'oops');mem(a,b,'got into a tiff');}
    else{const mo=pick(MOMENTS),m=a.name+' and '+b.name+' '+mo+'.';out.push({c:'bond',h:esc(m)});log(m,'bond');mem(a,b,mo);addBond(a,b,4,out);maybeRival(a,b,out);}
  }

  if(kp&&!kp.away&&here.length>1){const o=pick(here.filter(d=>d.id!==kp.id));addBond(kp,o,3,out);if(chance(.3)){const m=kp.name+', the Tribe Keeper, checked in on '+o.name+'.';out.push({c:'ln',h:esc(m)});mem(kp,o,'had a Keeper check-in');}}
  if(chance(season()==='Winter'?1:.4)){const c=S.dragons.filter(d=>d.talents.some(t=>!t.found&&d.hints.indexOf(t.k)<0));if(c.length){const d=pick(c),k=giveHint(d);const m='Dino leaned over from the next bed: "Keep an eye on '+d.name+'. That one '+T[k].clue+'."';out.push({c:'ln',h:'🔍 '+esc(m)});log('Clue from Dino: '+d.name+' '+T[k].clue+'.','spark');}}
  if(S.dragons.length<12&&S.night%(season()==='Spring'?2:3)===0){const d=arrive(out);if(S.dragons.length<12&&chance(.25))arrive(out,d);}
  const lone=S.dragons.find(d=>d.stage==='hatch'&&!byId(d.mentor));
  if(lone)out.push({c:'ln',h:esc('Wee '+lone.name+' has no mentor yet. Tap them to pick one.')});

    const calm=S.dragons.find(d=>d.talents.some(t=>(t.k==='comfort'||t.k==='sing')&&t.found));
    const m=calm?'The Bark Lady sniffed at the bedroom door. '+calm.name+' kept everyone calm until she padded away.':'The Bark Lady sniffed at the bedroom door. Everyone froze. She padded away, eventually.';
    out.push({c:'ln',h:'🐾 '+esc(m)});log(m);

  if(chance(.05)){const m='A rumor went around that a molerat toy was moving in. False alarm. Everyone was very relieved.';out.push({c:'ln',h:esc(m)});log(m);}
  S.acts=season()==='Summer'?4:3;
  if(chance(.15)){S.acts++;const m='Charliescope left the nightlight on. You get an extra move tonight.';out.push({c:'loot',h:'💡 '+esc(m)});log(m,'loot');}
  storyTick(out);
  return out;
}
function storyTick(out){
  const st=S.story;if(st.done||st.ch>=3)return;

    const v=pick(c);v.away=true;st.taken=v.id;const m='In the dark, The Bark Lady nosed the door open. When the nightlight flickered back on, '+v.name+' was gone. A trail of slobber leads into the Hallway.';
    out.push({c:'ln ev',h:'<h3>🐾 '+esc(v.name)+' has been taken!</h3>'+esc(m)});log(m,'oops');}
  st.ch++;const m2='Chapter '+(st.ch+1)+': '+CHAP[st.ch].n+'.';
  out.push({c:'burst',h:'NEW CHAPTER<small>'+esc(m2+(st.ch===3?" The way to The Bark Lady's Den is open. Tap Explore.":''))+'</small>'});log(m2,'loot');
}
function doRescue(team,win){
  const out=[],v=byId(S.story.taken),names=team.map(d=>d.name).join(team.length>2?', ':' and '),vn=v?v.name:'their friend';
  out.push({c:'cap',h:esc(names+" crept into The Bark Lady's Den.")});
  if(win){
    S.story.done=true;if(v){v.away=false;v.energy=0;}
    const m=names+' brought '+vn+' home!';out.push({c:'burst',h:'🎉 RESCUED!<small>'+esc(m)+'</small>'});log(m,'loot');
    team.forEach(d=>{award(d,'ribbon',out);if(v){mem(d,v,d.name+' rescued '+v.name+" from The Bark Lady's Den");addBond(d,v,20,out);}});
    if(v){award(v,'ribbon',out);earnName(v,out);}
    S.treasures.push({name:"The Bark Lady's favorite squeaky toy",place:'a gift from The Bark Lady',n:S.night});
    const e='The Bark Lady watched them go and did not chase. She only ever wanted a stuffy to cuddle. Charliescope left an old sock monkey by her bed, and The Bark Lady pushed her favorite squeaky toy under the bedroom door to say sorry.';
    out.push({c:'ln ev',h:esc(e)});log(e,'bond');
    out.push({c:'ln',h:esc('The story is complete. The Tribe goes on, and so can you.')});
  }else{
    out.push({c:'oops',h:esc('She woke up! Everyone scrambled home. '+vn+' is still in there. Try again when the team is rested.')});log(names+' could not get into the Den this time.','oops');

  spend(team);return out;
}
function toShelf(d){

}

    <section class="panel"><p class="cap">How to play</p><ul class="log"><li>Tap Start Bedtime. The dragons live their night on their own and you watch it happen.</li><li>You get 3 moves a night to step in: drag a dragon onto a friend, or onto a spot in the room, or use the buttons. Then tap Lights out.</li><li class="bond">Hang out: two dragons spend time together. Their bond grows and hidden talents can pop out.</li><li class="spark">Train: try a new skill to find a talent, or practice one to level it up. Friends coach each other.</li><li class="loot">Explore: walk your team through a place yourself. Dodge what guards it, grab sparkles, reach the gold circle. Talents open shortcuts.</li><li class="spark">Practicing a talent is a quick mini-game. More stars means faster growth.</li><li>Follow the story on the Dragons tab. It has an ending.</li><li class="spark">Build: work on a big Tribe project. Each one needs three talents and gives the whole Tribe a perk.</li><li class="bond">Each dragon has a favorite thing, a fear, and a secret. You learn them by playing.</li><li class="spark">A Close friend who is Skilled can teach a talent a dragon was not born with.</li><li class="bond">Every dragon has a wish. Tap a dragon to see it.</li><li>Friends notice clues about each other's hidden talents.</li><li class="loot">Dragons earn patches and name changes by doing big things. Sew patches on from a dragon's page.</li><li>Every 5th Bedtime the neighbors hold a talent show.</li></ul></section>
    <section class="panel"><p class="cap">Your Tribe</p><div class="rn"><input id="hn" maxlength="28" value="${esc(S.name)}" aria-label="Tribe name"><button class="btn" data-a="hoardName">Rename</button></div>
      <p style="margin-top:10px"><button class="btn" data-a="reset">${UI.reset?'Really start over? Tap again':'Start a brand new Tribe'}</button></p>
      <p class="role" style="margin-top:8px">Your Tribe saves on this device.</p></section>
    <section class="panel"><p class="cap">Sound</p><div class="row"><button class="btn sm${S.snd?' on':''}" data-a="snd">Sound effects: ${S.snd?'On':'Off'}</button><button class="btn sm${S.music?' on':''}" data-a="music">Lullaby music: ${S.music?'On':'Off'}</button></div></section>
    <section class="panel"><p class="cap">How you play</p><div class="row"><button class="btn sm${S.play?' on':''}" data-a="tgl" data-v="play">Walk expeditions yourself: ${S.play?'On':'Off'}</button><button class="btn sm${S.mini?' on':''}" data-a="tgl" data-v="mini">Practice mini-games: ${S.mini?'On':'Off'}</button><button class="btn sm${S.watch?' on':''}" data-a="tgl" data-v="watch">Watch the night play out: ${S.watch?'On':'Off'}</button></div><p class="role" style="margin-top:6px">Turn these off for a quicker, story-only game.</p></section>
    <section class="panel"><p class="cap">Move your Tribe</p><p>To play on another tablet or phone, make a save code here and load it there.</p><div class="rn" style="margin-top:8px"><textarea id="sc" aria-label="Save code" placeholder="Save code">${esc(UI.code||'')}</textarea></div><div class="row" style="margin-top:8px"><button class="btn sm" data-a="copySave">Make save code</button><button class="btn sm" data-a="loadSave">Load this code</button><span class="role">${esc(UI.msg||'')}</span></div></section></div>`;
  }
  const no=S.acts<=0;
  $app.innerHTML=`<header class="top"><div><p class="eyebrow">Bedtime ${S.night} · ${season()}</p><h1>${esc(S.name)}</h1></div><div class="moves">${no?'No moves left':'Moves left'}<div class="pips">${pips}</div></div></header>
  <nav class="tabs" role="tablist">${[['room','Bedroom'],['dragons','Dragons'],['bonds','Bonds'],['story','Story'],['hoard','Tribe']].map(t=>`<button role="tab" aria-selected="${UI.tab===t[0]}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>
  <main>${main}</main>
  <footer class="bar"><div>
    <button class="btn a" data-a="hang"${no?' disabled':''}>Hang out</button>
    <button class="btn b" data-a="train"${no?' disabled':''}>Train</button>
    <button class="btn c" data-a="exp"${no?' disabled':''}>Explore</button>
    <button class="btn e" data-a="build"${no?' disabled':''}>Build</button>
    <button class="btn go turn" data-a="turn">${turnLabel()}</button>
  </div></footer>`;
  document.documentElement.style.setProperty('--night',SCOL[season()]);
  save();
}
function chip(d,ok,why,act){const on=F.picks&&F.picks.indexOf(d.id)>=0;return `<button class="chip${on?' on':''}" data-a="${act||'pick'}" data-id="${d.id}"${ok||on?'':' disabled'}>${dragonSVG(d,60)}${esc(d.name)}<small>${ok||on?d.pers:d.away?'taken':why}</small></button>`;}
function head(title){return `<div class="shh"><h2>${title}</h2><button class="x" data-a="close" aria-label="Close">X</button></div>`;}
function mkRow(label,key,vals,num){return `<div class="row"><span class="step" style="min-width:74px">${label}</span>${vals.map(v=>`<button class="btn sm${String(F.d[key])===String(v[0])?' on':''}" data-a="mk" data-k="${key}" data-v="${v[0]}"${num?' data-n="1"':''}>${v[1]}</button>`).join('')}</div>`;}
function sheet(){

  let h='';

    else if(P&&P.type==='gather'){const G=NEIGH[P.g];
      h+=`<div class="ln ev"><h3>🌙 Midnight Gathering</h3><p>${G.n} are hosting a talent show on ${G.home}. They love ${G.likes.map(k=>T[k].n.toLowerCase()).join(', ')}.</p><p class="step" style="margin-top:6px">Who performs for the Tribe?</p></div><div class="chips">${S.dragons.map(d=>`<button class="chip" data-a="perform" data-id="${d.id}"${d.stage==='hatch'||d.mend||d.away?' disabled':''}>${dragonSVG(d,60)}${esc(d.name)}<small>${d.talents.filter(t=>t.found).map(t=>T[t.k].i).join(' ')||'no talents found yet'}</small></button>`).join('')}</div>`;}
    else h+='<button class="btn go" data-a="close">'+(F.btn||'OK!')+'</button>';
  }else if(F.t==='hang'){

    if(ps.length===2){const o=bondOf(ps[0],ps[1]);h+=`<div class="ln bond">${esc(ps[0].name)} and ${esc(ps[1].name)}: <b>${o.tiff?'In a tiff':BL[lvl(o.p)]}</b><div class="meter"><i style="width:${o.p}%"></i></div></div>`;}
    const want=k=>ps.filter(d=>d.wish&&d.wish.t==='act'&&d.wish.a===k).map(d=>d.name);
    h+='<p class="step">2. Pick what they do</p><div class="opts">'+Object.keys(HANG).map(k=>`<button class="opt${F.act===k?' on':''}" data-a="act" data-v="${k}"><b>${HANG[k].i} ${HANG[k].n}</b>${want(k).length?'💭 '+esc(want(k).join(' and '))+' wished for this. ':''}${ps.filter(d=>d.favK&&d.fav===k).map(d=>'💗 '+esc(d.name)+"'s favorite. ").join('')}</button>`).join('')+'</div>';
    h+=`<button class="btn go" data-a="goHang"${ps.length===2&&F.act?'':' disabled'}>Go!</button>`;

    if(d){h+=`<p class="step">2. What should ${esc(d.name)} work on?</p>`;
      if(d.hints.length)h+='<div class="ln">🔍 Clues: '+d.hints.map(k=>esc(d.name+' '+T[k].clue+'.')).join(' ')+'</div>';
      h+='<div class="opts">'+TK.map(k=>{const t=tal(d,k),no=d.tried.indexOf(k)>=0,tc=no&&teacher(d,k);return `<button class="opt${t&&t.found?' on':''}" data-a="goTrain" data-v="${k}"${no&&!tc?' disabled':''}><b>${T[k].i} ${T[k].n}</b>${t&&t.found?'Practice ('+LV[tl(t)]+')':tc?'Learn from '+esc(tc.name)+' ('+(d.learn[k]||0)+'/3)':no?'Not their thing':'Try it'}</button>`;}).join('')+'</div>';

  }else if(F.t==='exp'){

  }else if(F.t==='play'){

    if(P){h+=`<div class="ln">${esc(P.desc)} Still needs: ${P.need.filter(n=>st[n]<2).map(n=>T[n].i+' '+T[n].n).join(', ')||'nothing'}.</div><p class="step">2. Pick one or two builders</p><div class="chips">${S.dragons.map(d=>{const on=F.picks.indexOf(d.id)>=0,ok=canAct(d),has=P.need.filter(n=>st[n]<2&&d.talents.some(t=>t.k===n&&t.found));return `<button class="chip${on?' on':''}" data-a="pick" data-id="${d.id}"${ok||on?'':' disabled'}>${dragonSVG(d,60)}${esc(d.name)}<small>${!ok&&!on?(d.away?'taken':d.mend?'mending':'sleepy'):has.length?has.map(n=>T[n].i).join(' ')+' can help':'might surprise you'}</small></button>`;}).join('')}</div>`;}
    h+=`<button class="btn go" data-a="goBuild"${P&&F.picks.length?'':' disabled'}>Build!</button>`;
  }else if(F.t==='detail'){

      const e=$id('rp');if(e)e.style.width=Math.min(100,M.p)+'%';if(M.p>=100)miniEnd(M.strikes===0?3:M.strikes===1?2:1);},60));}

function hitRect(x,y,r,rs){for(let i=0;i<rs.length;i++){const q=rs[i];if(x>q[0]-r&&x<q[0]+q[2]+r&&y>q[1]-r&&y<q[1]+q[3]+r)return true;}return false;}
function dragonImg(d){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">'+parts(d)+'</svg>');return im;}
function say(m){const e=$id('pm');if(e)e.textContent=m;}
function hud(){const e=$id('ph');if(e&&X)e.textContent='♥'.repeat(Math.max(0,X.hearts))+'   ✦ '+X.got+' of 5';}
function playStart(team,pk){
  const P=plc(pk),has=k=>team.some(d=>{const t=tal(d,k);return t&&t.found;});
  F={t:'play',place:pk};sheet();
  const cv=$id('cv'),cx=cv&&cv.getContext&&cv.getContext('2d');if(!cx){F=null;sheet();render();return;}
  const big=pk==='hall'||pk==='den',slow=has('sneak')?.7:1,hz=[{x:180,y:222,r:13,vx:0,vy:60*slow,lo:140,hi:300,ax:'y'}];
  const nR=pk==='den'||pk==='kitchen'||pk==='yard'?3:2;
  for(let i=0;i<nR;i++)hz.push({x:40+rnd(280),y:98+i*38,r:13,vx:(55+i*14)*slow*(i%2?-1:1),vy:0,lo:16,hi:344,ax:'x'});
  if(big){hz[1].r=24;hz[1].vx=38*slow;hz[1].y=112;hz[1].boss=true;}
  hz.push({x:60,y:372,r:13,vx:45*slow,vy:0,lo:16,hi:344,ax:'x'});
  const obs=[[70,292,60,34],[236,318,56,40],[40,150,50,28]];
  const walls=[[0,210,20,24],[90,210,60,24],[210,210,60,24],[340,210,20,24]];
  const gates=P.opts.map((o,i)=>({k:o.k,x:i?270:20,y:210,w:70,h:24,open:false,msgT:0}));
  const all=obs.concat(walls,gates.map(g=>[g.x,g.y,g.w,g.h])),sp=[];let guard=0;
  while(sp.length<5&&guard++<400){const x=30+rnd(300),y=70+rnd(340);if(!hitRect(x,y,14,all)&&Math.hypot(x-180,y-440)>60)sp.push({x,y});}
  let duo=null;for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){const o=bondOf(team[i],team[j]);if(o.duo)duo=o.duo;}
  X={team,pk,cx,cv,hz,obs,walls,gates,sp,got:0,hearts:Math.min(5,3+(has('comfort')?1:0)+(has('stitch')?1:0)),x:180,y:440,tx:180,ty:440,trail:[],inv:1,freeze:0,duo,duoUsed:false,gate:null,imgs:team.map(dragonImg),face:1,last:performance.now(),keys:{},down:false};
  const pt=e=>{const r=cv.getBoundingClientRect();X.tx=(e.clientX-r.left)*360/r.width;X.ty=(e.clientY-r.top)*480/r.height;};
  cv.addEventListener('pointerdown',e=>{if(!X)return;e.preventDefault();X.down=true;pt(e);});
  cv.addEventListener('pointermove',e=>{if(X&&X.down)pt(e);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{if(X)X.down=false;}));
  const pd=$id('pd');if(pd&&duo)pd.disabled=false;
  hud();requestAnimationFrame(playLoop);
}
function playLoop(now){
  if(!X||X.dead||!F||F.t!=='play')return;
  const dt=Math.max(0,Math.min(.05,(now-X.last)/1000));X.last=now;
  const K=X.keys;if(K.l||K.r||K.u||K.d){X.tx=X.x+(K.r?40:0)-(K.l?40:0);X.ty=X.y+(K.d?40:0)-(K.u?40:0);}
  const dx=X.tx-X.x,dy=X.ty-X.y,dist=Math.hypot(dx,dy);
  if(dist>3){const st=Math.min(120*dt,dist),mx=dx/dist*st,my=dy/dist*st,solid=X.obs.concat(X.walls,X.gates.filter(g=>!g.open).map(g=>[g.x,g.y,g.w,g.h]));
    const nx=Math.max(14,Math.min(346,X.x+mx));if(!hitRect(nx,X.y,13,solid))X.x=nx;
    const ny=Math.max(14,Math.min(466,X.y+my));if(!hitRect(X.x,ny,13,solid))X.y=ny;
    if(Math.abs(mx)>.2)X.face=mx>0?1:-1;X.trail.unshift([X.x,X.y]);if(X.trail.length>70)X.trail.pop();}
  X.gates.forEach(g=>{if(g.open||!hitRect(X.x,X.y,22,[[g.x,g.y,g.w,g.h]]))return;const who=X.team.find(d=>tal(d,g.k));
    if(who){g.open=true;X.gate=g.k;say((tal(who,g.k).found?who.name+' used '+T[g.k].n+'!':'Whoa! Nobody knew '+who.name+' could do that!')+' The shortcut is open.');sfx('spark');}
    else if(now-g.msgT>2500){g.msgT=now;say('This shortcut needs '+T[g.k].n+'. Try another way.');}});
  if(X.freeze>0)X.freeze-=dt;else X.hz.forEach(h=>{if(h.ax==='x'){h.x+=h.vx*dt;if(h.x<h.lo||h.x>h.hi){h.vx*=-1;h.x=Math.max(h.lo,Math.min(h.hi,h.x));}}else{h.y+=h.vy*dt;if(h.y<h.lo||h.y>h.hi){h.vy*=-1;h.y=Math.max(h.lo,Math.min(h.hi,h.y));}}});
  if(X.inv>0)X.inv-=dt;
  else if(X.hz.some(h=>Math.hypot(h.x-X.x,h.y-X.y)<h.r+12)){X.hearts--;X.inv=1.6;sfx('oops');hud();
    if(X.hearts<=0)return playEnd(false);
    X.x=180;X.y=440;X.tx=180;X.ty=440;X.trail=[];say('Bonk! Back to the start. Try a different path.');}
  const n0=X.sp.length;X.sp=X.sp.filter(q=>Math.hypot(q.x-X.x,q.y-X.y)>=20);if(X.sp.length<n0){X.got+=n0-X.sp.length;sfx('bond');hud();}
  if(Math.hypot(180-X.x,40-X.y)<26)return playEnd(true);
  playDraw();requestAnimationFrame(playLoop);
}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();}
function playDraw(){
  const c=X.cx,L=LOOK[X.pk];c.fillStyle=L[0];c.fillRect(0,0,360,480);c.fillStyle=L[1];for(let i=0;i<12;i++)c.fillRect(0,i*40+18,360,3);
  c.lineWidth=3;c.strokeStyle='#151515';c.lineJoin='round';
  const box=(r,f)=>{c.fillStyle=f;c.fillRect(r[0],r[1],r[2],r[3]);c.strokeRect(r[0],r[1],r[2],r[3]);};
  X.obs.forEach(r=>box(r,'#fffef6'));X.walls.forEach(r=>box(r,'#c9d0f5'));
  c.font='bold 12px sans-serif';c.textAlign='center';
  X.gates.forEach(g=>{if(g.open){c.setLineDash([6,5]);c.strokeStyle='#6fe0cf';c.strokeRect(g.x+2,g.y+2,g.w-4,g.h-4);c.setLineDash([]);c.strokeStyle='#151515';}
    else{box([g.x,g.y,g.w,g.h],'#ffd93b');c.fillStyle='#151515';c.fillText(T[g.k].n.split(' ').pop(),g.x+g.w/2,g.y+16,g.w-6);}});
  c.fillStyle='#ffd93b';c.beginPath();c.arc(180,40,20,0,7);c.fill();c.stroke();c.fillStyle='#fff';starPath(c,180,40,11);c.fill();c.stroke();
  c.fillStyle='#fffef6';c.fillText(X.pk==='den'?'YOUR FRIEND':'TREASURE',180,76);
  c.lineWidth=2;X.sp.forEach(q=>{c.fillStyle='#fff3b8';starPath(c,q.x,q.y,8);c.fill();c.stroke();});c.lineWidth=3;
  X.hz.forEach(h=>{c.fillStyle=h.boss?'#e8c88a':'#9aa0b8';c.beginPath();c.arc(h.x,h.y,h.r,0,7);c.fill();c.stroke();
    if(h.boss){c.beginPath();c.arc(h.x-h.r*.8,h.y-h.r*.6,h.r*.45,0,7);c.fill();c.stroke();c.beginPath();c.arc(h.x+h.r*.8,h.y-h.r*.6,h.r*.45,0,7);c.fill();c.stroke();}
    const e=h.r*.35;c.fillStyle='#fff';c.beginPath();c.arc(h.x-e,h.y-2,h.r*.24,0,7);c.arc(h.x+e,h.y-2,h.r*.24,0,7);c.fill();c.fillStyle='#151515';c.beginPath();c.arc(h.x-e,h.y-2,h.r*.11,0,7);c.arc(h.x+e,h.y-2,h.r*.11,0,7);c.fill();});
  for(let i=X.team.length-1;i>=0;i--){const p=i?(X.trail[Math.min(X.trail.length-1,i*18)]||[X.x,X.y]):[X.x,X.y],im=X.imgs[i];
    c.save();c.translate(p[0],p[1]);if(X.inv>0&&Math.floor(X.inv*10)%2)c.globalAlpha=.4;c.scale(X.face,1);
    if(im.complete&&im.naturalWidth)c.drawImage(im,-24,-30,48,48);else{c.fillStyle=COLORS[X.team[i].color][1];c.beginPath();c.arc(0,0,13,0,7);c.fill();c.stroke();}
    c.restore();}
  if(X.freeze>0){c.fillStyle='rgba(111,224,207,.25)';c.fillRect(0,0,360,480);}
}
