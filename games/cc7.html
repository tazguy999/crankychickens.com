/* ============================================================
   CABINETS — one per screen. `col` is the tile column the cabinet
   stands in; every one sits on the row-11 ground. Positions were
   checked against the ZONE grids above: none overlaps a platform,
   none sits over the (1,0) pit.
   ============================================================ */
const CABINETS = [
  { id:'invaders', screen:'1,0', col:16, maker:'SCRATCHY',  color:'#ff9f1c' },
  { id:'runner',   screen:'2,0', col:10, maker:'PEARL',     color:'#ff6688' },
  { id:'standing', screen:'0,1', col:12, maker:'REGINALD',  color:'#8fd0a8' },
  { id:'parade',   screen:'1,1', col:10, maker:'AUNT BARB', color:'#7fb2ff' },
  { id:'bricks',   screen:'2,1', col:10, maker:'EL JAGUAR', color:'#f4a261', big:true },
  { id:'finale',   screen:'0,0', col:14, maker:'KEVIN',     color:'#ffd76b', finale:true }
];
const GROUND_Y = 11 * TILE;
const NEED_TICKETS = 5;

function tickets(){
  const w = Save.data.won || {};
  return CABINETS.filter(c => !c.finale && !c.extra && w[c.id]).length;
}
function cabinetHere(){
  if (!Save.data.takeover) return null;
  return CABINETS.find(c => c.screen === key(sx, sy)) || null;
}
// A screen can hold more than one thing to walk up to (LAYER 5 adds a headset).
function cabinetsHere(){
  return Save.data.takeover ? CABINETS.filter(c => c.screen === key(sx, sy)) : [];
}
function cabinetLocked(c){ return !!c.finale && tickets() < NEED_TICKETS; }
function nearCabinet(){
  if (mode !== 'garden' || Takeover.glitching()) return null;
  return cabinetsHere().find(c => nearThis(c)) || null;
}
function nearThis(c){
  const x = c.col * TILE, cx = P.x + P.w / 2;
  // Not P.grounded: resting on a tile, that flag is only true every other
  // frame (gravity has to build up before the foot crosses the tile line).
  const onGround = P.coyote > 0 && Math.abs(P.y + P.h - GROUND_Y) < 4;
  return (onGround && cx > x - 16 && cx < x + 56) ? c : null;
}

function drawCabinet(c){
  if (c.headset){ drawHeadsetStand(c); return; }
  const x = c.col * TILE, w = 40, h = 64, y = GROUND_Y - h;
  const locked = cabinetLocked(c);
  const won = (Save.data.won || {})[c.id];

  if (c.big){                                   // "It is the same cabinet with a box on top."
    g.fillStyle = '#3a2412'; g.fillRect(x + 2, y - 28, w - 4, 28);
    g.fillStyle = '#5a3a1c'; g.fillRect(x + 2, y - 28, w - 4, 4);
    g.fillStyle = c.color; g.fillRect(x + 8, y - 20, w - 16, 12);
    txt('★', x + w / 2, y - 10, 11, '#3a2412');
  }

  g.fillStyle = '#120822'; g.fillRect(x - 2, y, w + 4, h);
  g.fillStyle = '#2a1450'; g.fillRect(x - 2, y, 3, h); g.fillRect(x + w - 1, y, 3, h);
  g.fillStyle = locked ? '#4a3b63' : c.color; g.fillRect(x - 2, y, w + 4, 10);

  g.fillStyle = '#05030a'; g.fillRect(x + 4, y + 15, w - 8, 28);
  if (!locked){
    g.globalAlpha = REDUCED ? 0.7 : 0.55 + 0.25 * Math.sin(t / 9 + c.col);
    g.fillStyle = c.color; g.fillRect(x + 7, y + 18, w - 14, 22);
    g.globalAlpha = 1;
    g.fillStyle = '#05030a';                    // a few "pixels" so it reads as a screen
    const k = Math.floor(t / 20 + c.col) % 4;
    g.fillRect(x + 10 + k * 5, y + 22, 4, 4);
    g.fillRect(x + 12, y + 32, 16, 3);
  } else {
    g.fillStyle = '#6b5484';
    g.fillRect(x + 13, y + 28, 14, 11);
    g.fillRect(x + 15, y + 21, 3, 8); g.fillRect(x + 22, y + 21, 3, 8); g.fillRect(x + 15, y + 20, 10, 3);
    g.fillStyle = '#05030a'; g.fillRect(x + 19, y + 31, 2, 5);
  }

  g.fillStyle = '#2a1450'; g.fillRect(x - 5, y + 46, w + 10, 6);
  g.fillStyle = '#ff3b6b'; g.fillRect(x + 8, y + 42, 4, 5);
  g.fillStyle = '#ffd76b'; g.fillRect(x + 24, y + 47, 4, 3); g.fillRect(x + 30, y + 47, 4, 3);

  if (won){
    g.fillStyle = '#ffd76b'; g.fillRect(x + w - 8, y + 54, 12, 8);
    g.fillStyle = '#120822'; g.fillRect(x + w - 5, y + 57, 6, 2);
  }

  const speaking = Talk.speaking === c.maker;
  Cast.draw(c.maker, x + w + 30, GROUND_Y, -1, speaking, c.maker === 'KEVIN' ? 1 : 0.82);

  if (nearCabinet() === c){
    const label = locked ? ('NEEDS ' + NEED_TICKETS + ' TICKETS · YOU HAVE ' + tickets()) : say('▼  PLAY', 'TAP TO PLAY');
    g.font = 'bold 12px "Arial Narrow", Arial, sans-serif';
    const tw = g.measureText(label).width + 16;
    const top = y - (c.big ? 54 : 26);
    g.fillStyle = 'rgba(6,3,12,.9)'; g.fillRect(x + w / 2 - tw / 2, top, tw, 20);
    g.strokeStyle = locked ? '#6b5484' : c.color; g.lineWidth = 1;
    g.strokeRect(x + w / 2 - tw / 2 + .5, top + .5, tw - 1, 19);
    txt(label, x + w / 2, top + 14, 12, locked ? '#cdbcda' : '#f2e9f7');
  }
}

/* ============================================================
   TAKEOVER — the demo ends here. Fires once, ever: three flowers
   in, or 75 seconds, whichever comes first. A save from the old
   beta that already has flowers gets it a few seconds after boot.
   ============================================================ */
const Takeover = {
  t0: -1e9, GLITCH_MS: 2600,

  glitching(){ return performance.now() - this.t0 < this.GLITCH_MS; },

  check(now){
    if (Save.data.takeover || mode !== 'garden') return;
    const elapsed = now - bootAt;
    if (elapsed < 5000) return;
    if (picked.size >= 3 || elapsed > 75000) this.begin(now);
  },

  begin(now){
    Save.data.takeover = true;
    Save.flush();
    this.t0 = now;
    Sfx.play('glitch');
    setTimeout(() => Sfx.play('thunk'), 1900);
    Talk.interrupt({ id:'takeover', lines: [
      ['SCRATCHY', 'Twelve flowers. Six screens. I have done the sums. This is not a whole game.'],
      ['PEARL', 'It is a DEMO. We are in a DEMO!'],
      ['AUNT BARB', 'Then we shall make our own, dear. One each.'],
      ['EL JAGUAR', 'EL JAGUAR requires the tallest cabinet.'],
      ['THE GAME', 'Unauthorised content detected. Arcade cabinets. They were not here before.']
    ]});
    setTimeout(() => toast(say('THE CHICKENS BUILT AN ARCADE<br>FIND A CABINET · PRESS ▼ TO PLAY', 'THE CHICKENS BUILT AN ARCADE<br>FIND A CABINET · TAP IT TO PLAY'), 6000), 2800);
    paintHud();
    Bus.emit('takeover', {});
  },

  // Tear the picture sideways for a couple of seconds. Skipped entirely
  // for reduced-motion: the cabinets simply are there.
  drawGlitch(){
    if (REDUCED || !this.glitching()) return;
    const p = (performance.now() - this.t0) / this.GLITCH_MS;
    const n = Math.round(10 * (1 - p)) + 1;
    for (let i = 0; i < n; i++){
      const y = rint(0, H - 20), hh = rint(4, 22), dx = rint(-28, 28) * (1 - p);
      g.drawImage(cv, 0, y, W, hh, dx, y, W, hh);
    }
    if (p < 0.12){ g.fillStyle = 'rgba(242,233,247,' + (0.5 - p * 4) + ')'; g.fillRect(0, 0, W, H); }
    g.fillStyle = 'rgba(255,59,107,.10)';
    g.fillRect(0, rint(0, H), W, 3);
  }
};

function drawCabinets(){
  cabinetsHere().forEach(c => {
    if (Takeover.glitching() && !REDUCED){
      g.globalAlpha = Math.random() < 0.55 ? 0.25 + Math.random() * 0.6 : 0;
      if (g.globalAlpha > 0) drawCabinet(c);
      g.globalAlpha = 1;
    } else drawCabinet(c);
  });
}

/* ============================================================
   ARCADE — the shell every cabinet runs in.
   States: intro (title card) -> play -> won | lost.
   Lives: 3, plus one for every four flowers you have picked, so the
   garden still matters. Lose the same cabinet twice and Aunt Barb
   quietly turns it down a notch, same spirit as her plank.
   ============================================================ */
const GAMES = {};

/* Is a finger doing the playing? Decides which words the cards use, nothing else. */
const TOUCH = { on: false };
try { TOUCH.on = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches); } catch (err){}
addEventListener('touchstart', () => { TOUCH.on = true; }, { capture: true, passive: true });
/* Is this a television? A remote has arrows, OK and Back, and nothing called A or Esc. */
const TV = { on: false };
try { TV.on = /SMART-TV|SmartTV|Tizen|Web0S|WebOS|NetCast|HbbTV|BRAVIA|GoogleTV|Android TV|AFT[A-Z]|CrKey/i.test(navigator.userAgent || ''); } catch (err){}
const tvWords = s => !TV.on ? s : s.replace(/A\s*\/\s*SPACE/g, 'OK').replace(/PRESS(\s+)A\b/g, 'PRESS$1OK')
  .replace('ESC or ▼', 'BACK or ▼').replace('PRESS ANY BUTTON', 'PRESS OK');
const say = (keys, touch) => TOUCH.on ? touch : tvWords(keys);

const Arcade = {
  cab: null, game: null, state: 'intro', stateFrames: 0,
  lives: 3, score: 0, easy: false, flash: 0, leaveReq: false, quiet: false,
  prev: {},

  open(cab){
    mode = 'arcade';
    this.cab = cab; this.game = GAMES[cab.id];
    this.state = 'intro'; this.stateFrames = 0; this.leaveReq = false;
    this.easy = ((Save.data.fails || {})[cab.id] || 0) >= 2;
    this.score = 0; this.lives = this.maxLives();
    this.prev = { left: true, right: true, up: true, down: true, a: true };
    Sfx.play('pick');
    Talk.interrupt({ lines: this.game.intro });
    if (toastEl && toastEl.style) toastEl.style.opacity = '0';     // a garden notice does not follow you into a cabinet
    paintHud();
    Bus.emit('arcade:open', { id: cab.id });
  },

  maxLives(){
    return 3 + Math.min(3, Math.floor(picked.size / 4)) + (this.easy ? 2 : 0);
  },

  start(){
    this.lives = this.maxLives(); this.score = 0; this.flash = 0;
    this.game.init({ easy: this.easy, micro: false, speed: 1, host: this });
    this.state = 'play'; this.stateFrames = 0;
    if (document.body) document.body.classList.toggle('needs-b', !!this.game.needsB);   // the second pad button
    Talk.hush();                                 // captions never sit on top of the play field
    paintHud();
  },

  // A game calls these and then returns immediately.
  hurt(){
    this.lives--; this.flash = 18;
    Sfx.play('hurt');
    paintHud();
    if (this.lives <= 0){ this.lose(); return true; }
    return false;
  },

  win(){
    const id = this.cab.id;
    this.state = 'won'; this.stateFrames = 0;
    Save.data.won = Save.data.won || {};
    this.first = !Save.data.won[id];
    Save.data.won[id] = true;
    Save.data.best = Save.data.best || {};
    Save.data.best[id] = Math.max(Save.data.best[id] || 0, this.score);
    Save.data.fails = Save.data.fails || {};
    Save.data.fails[id] = 0;
    Save.flush();
    Sfx.play('win');
    if (!this.cab.finale) Talk.interrupt({ lines: this.game.win });
    paintHud();
    Bus.emit('arcade:win', { id, score: this.score, tickets: tickets() });
  },

  lose(){
    const id = this.cab.id;
    this.state = 'lost'; this.stateFrames = 0;
    Save.data.fails = Save.data.fails || {};
    const n = Save.data.fails[id] = (Save.data.fails[id] || 0) + 1;
    Save.flush();
    Sfx.play('lose');
    if (n === 2 && !this.easy){
      this.easy = true;
      Talk.interrupt({ lines: [
        ['AUNT BARB', 'I have turned this one down a notch, dear.'],
        ['SCRATCHY', 'That is not regulation.'],
        ['AUNT BARB', 'It is now.'] ]});
    } else if (n >= 3 && this.game.tip){
      Talk.interrupt({ lines: [ this.game.tip ] });          // stuck: stop being coy and say how
    } else {
      const bank = this.game.lose;
      Talk.interrupt({ lines: [ bank[Math.floor(Math.random() * bank.length)] ] });
    }
    Bus.emit('arcade:lose', { id, fails: n });
  },

  close(){
    if (this.game && this.game.leave) this.game.leave();     // a sandbox saves on the way out
    if (document.body) document.body.classList.remove('needs-b');
    mode = 'garden';
    jumpLock = true;
    P.vx = 0; P.vy = 0; P.buffer = 0;
    this.game = null;
    paintHud();
    Bus.emit('arcade:close', {});
  },

  step(){
    const inp = Input.read();
    const a = inp.jump || inp.enter;
    const pr = {
      left: inp.left && !this.prev.left, right: inp.right && !this.prev.right,
      up: inp.up && !this.prev.up, down: inp.down && !this.prev.down,
      jump: a && !this.prev.a, b: inp.b && !this.prev.b
    };
    this.prev = { left: inp.left, right: inp.right, up: inp.up, down: inp.down, a, b: inp.b };
    this.stateFrames++;
    if (this.flash > 0) this.flash--;

    const leave = this.leaveReq;

    if (this.state === 'play'){
      if (leave){ this.leaveReq = false; this.close(); return; }
      this.game.update({ left: inp.left, right: inp.right, up: inp.up, down: inp.down, jump: a, b: inp.b }, pr);
      return;
    }
    // Cards. A short dead zone stops the press that got you here from skipping it.
    if (this.stateFrames < 24) return;            // (a tap on EXIT in here is kept, not lost)
    this.leaveReq = false;
    if (leave || pr.down){
      if (this.state === 'won' && this.cab.finale && !Save.data.finished){ Ending.begin(); return; }
      this.close(); return;
    }
    if (pr.jump){
      Sfx.play('blip');
      if (this.state === 'intro' || this.state === 'lost') this.start();
      else if (this.cab.finale && !Save.data.finished) Ending.begin();
      else this.close();
    }
  },

  draw(){
    const gm = this.game, c = this.cab;
    if (this.state === 'intro'){
      g.fillStyle = '#07040f'; g.fillRect(0, 0, W, H);
      g.fillStyle = c.color; g.globalAlpha = 0.10; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
      txt(gm.title, W / 2, 88, gm.title.length > 30 ? 22 : 28, c.color);
      txt('A GAME BY ' + gm.maker, W / 2, 112, 13, '#cdbcda');
      ((TOUCH.on && gm.howTouch) || gm.how.map(tvWords)).forEach((s, i) => txt(s, W / 2, 150 + i * 23, 15, '#f2e9f7'));
      const best = (Save.data.best || {})[c.id];
      const note = (this.easy ? 'AUNT BARB HAS TURNED IT DOWN A NOTCH' : '') +
                   (this.easy && best ? '   ·   ' : '') + (best ? 'BEST  ' + best : '');
      if (note) txt(note, W / 2, 228, 12, this.easy ? '#ffd76b' : '#8a6ea8');
      if (REDUCED || Math.floor(t / 28) % 2) txt(say('PRESS  A  /  SPACE  TO START', 'TAP TO START'), W / 2, 262, 16, '#ffd76b');
      txt(say('ESC or ▼ to walk away', 'or tap  ✕ EXIT  to walk away'), W / 2, 284, 11, '#6b5484');
      const cc = gm.cardCast || [70, 222, 1.5];              // long instructions need the left margin
      Cast.draw(c.maker === 'KEVIN' ? 'KEVIN' : gm.maker, cc[0], cc[1], 1, Talk.speaking === gm.maker, cc[2]);
    } else {
      this.quiet = this.state !== 'play';
      gm.draw();
      this.quiet = false;
      if (this.flash > 0){
        g.fillStyle = 'rgba(255,59,107,' + (this.flash / 18 * 0.45) + ')';
        g.fillRect(0, 0, W, H);
      }
      if (this.state !== 'play'){
        g.fillStyle = 'rgba(6,3,12,.78)'; g.fillRect(0, 0, W, H);
        if (this.state === 'won'){
          txt(c.finale ? 'ALL OF THEM. YOU BEAT ALL OF THEM.' : (gm.winTitle || 'CABINET CLEARED'), W / 2, 128, 28, '#ffd76b');
          if (c.extra) txt(gm.winSub || '', W / 2, 162, 13, '#f2e9f7');
          else if (!c.finale){
            txt(this.first ? 'YOU WON A TICKET' : 'YOU ALREADY HAD THIS TICKET. STILL COUNTS.', W / 2, 162, 14, '#f2e9f7');
            txt('TICKETS  ' + tickets() + ' / ' + NEED_TICKETS, W / 2, 186, 14, c.color);
          }
          txt('SCORE  ' + this.score, W / 2, 214, 13, '#cdbcda');
          if (this.stateFrames > 24 && (REDUCED || Math.floor(t / 28) % 2))
            txt(c.finale && !Save.data.finished ? say('PRESS  A', 'TAP') : say('PRESS  A  TO GO BACK TO THE GARDEN', 'TAP TO GO BACK TO THE GARDEN'), W / 2, 264, 15, '#f2e9f7');
        } else {
          txt('OUT OF LIVES', W / 2, 128, 28, '#ff3b6b');
          txt('NOBODY IS COUNTING.  (SCRATCHY IS COUNTING.)', W / 2, 162, 13, '#cdbcda');
          if (this.easy) txt('NEXT TRY IS A NOTCH EASIER', W / 2, 188, 13, '#ffd76b');
          if (this.stateFrames > 24 && (REDUCED || Math.floor(t / 28) % 2))
            txt(say('PRESS  A  TO TRY AGAIN', 'TAP TO TRY AGAIN'), W / 2, 244, 16, '#ffd76b');
          txt(say('ESC or ▼ to walk away', 'or tap  ✕ EXIT  to walk away'), W / 2, 268, 11, '#8a6ea8');
        }
      }
    }
    // CRT dressing: scanlines and a bezel in the maker's colour.
    if (!(gm.noScan && this.state === 'play' && gm.mode === 'map')){     // paper has no scanlines
      g.fillStyle = 'rgba(0,0,0,.10)';
      for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
    }
    g.strokeStyle = c.color; g.lineWidth = 4; g.strokeRect(2, 2, W - 4, H - 4);
    if (Perf.show) drawPerf();
    t++;
  }
};

/* ---------- 1. SCRATCHY — FORM 7-B: CORN INVADERS (top-down shooter) ---------- */
const STARS = Array.from({ length: 46 }, () => ({ x: rnd(0, 640), y: rnd(30, 384), s: rnd(0.5, 2) }));

function drawIguana(x, y, fr){
  g.fillStyle = '#4caf50'; g.fillRect(x + 4, y + 4, 20, 10);
  g.fillRect(x + 19, y + 1, 9, 9);
  g.fillRect(x, y + 8, 6, 4);
  const l = (Math.floor(fr / 16) % 2) * 2;
  g.fillRect(x + 6, y + 14, 3, 2 + l); g.fillRect(x + 17, y + 14, 3, 4 - l);
  g.fillStyle = '#2e7d32';
  for (let i = 0; i < 3; i++) g.fillRect(x + 6 + i * 5, y + 2, 3, 2);
  g.fillStyle = '#fff'; g.fillRect(x + 23, y + 3, 3, 3);
  g.fillStyle = '#111'; g.fillRect(x + 24, y + 4, 1, 1);
}

GAMES.invaders = {
  title: 'FORM 7-B: CORN INVADERS', short: 'CORN INVADERS', maker: 'SCRATCHY',
  how: ['◀ ▶   MOVE', 'A / SPACE   THROW CORN', 'SEND ALL 47 IGUANAS HOME. SCRATCHY COUNTED.'],
  howTouch: ['SLIDE YOUR FINGER   MOVE', 'KEEP TOUCHING   THROW CORN', 'SEND ALL 47 IGUANAS HOME. SCRATCHY COUNTED.'],
  intro: [['SCRATCHY', 'Forty-seven iguanas. One of you. I have done the paperwork.']],
  win: [['SCRATCHY', 'Forty-seven of forty-seven. I am filing this under JOY.'],
        ['PEARL', 'There is no form for joy.'], ['SCRATCHY', 'There is now.']],
  lose: [['SCRATCHY', 'That is alright. The iguanas are also bad at this.'],
         ['SCRATCHY', 'Again. I will count slower.']],
  tip: ['SCRATCHY', 'An official tip. Hold the button down and never let go. The hay bales are on your side.'],

  init(o){
    this.o = o; this.px = W / 2; this.cool = 0; this.invuln = 0;
    this.shots = []; this.bombs = []; this.pops = []; this.inv = [];
    this.dir = 1; this.bombT = 90;
    const rows = o.micro ? [8] : [9, 9, 9, 10, 10];          // 9+9+9+10+10 = 47. He counted.
    rows.forEach((n, r) => {
      for (let i = 0; i < n; i++)
        this.inv.push({ x: 70 + (10 - n) * 22 + i * 44, y: 48 + r * 26, w: 28, h: 18, alive: true });
    });
    this.total = this.inv.length;
    this.bales = o.micro ? [] : [120, 296, 472].map(x => ({ x, y: H - 98, w: 48, h: 16, hp: 5 }));
  },

  update(inp){
    const o = this.o;
    if (inp.left) this.px -= 4.4;
    if (inp.right) this.px += 4.4;
    this.px = clamp(this.px, 20, W - 20);
    if (this.cool > 0) this.cool--;
    if (this.invuln > 0) this.invuln--;

    if (inp.jump && this.cool <= 0 && this.shots.length < 3){
      this.shots.push({ x: this.px, y: H - 62 });
      this.cool = 11; Sfx.play('shoot');
    }

    const live = this.inv.filter(v => v.alive);
    for (const s of this.shots){
      s.y -= 8.5;
      for (const v of live){
        if (v.alive && s.x > v.x - 3 && s.x < v.x + v.w + 3 && s.y > v.y - 4 && s.y < v.y + v.h){
          v.alive = false; s.y = -99;
          o.host.score += 10; Sfx.play('pop');
          this.pops.push({ x: v.x + 14, y: v.y + 9, life: 18 });
          break;
        }
      }
    }
    this.shots = this.shots.filter(s => s.y > 28);
    this.pops = this.pops.filter(p => --p.life > 0);

    const alive = this.inv.filter(v => v.alive);
    if (!alive.length){ o.host.win(); return; }

    const sp = (0.4 + (1 - alive.length / this.total) * 1.5) * (o.easy ? 0.7 : 1) * o.speed;
    let minX = 1e9, maxX = -1e9, maxY = 0;
    for (const v of alive){ v.x += this.dir * sp; minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x + v.w); maxY = Math.max(maxY, v.y + v.h); }
    if ((this.dir > 0 && maxX > W - 10) || (this.dir < 0 && minX < 10)){
      this.dir *= -1;
      for (const v of alive) v.y += 9;
    }

    if (!o.micro && --this.bombT <= 0){
      const v = alive[Math.floor(Math.random() * alive.length)];
      this.bombs.push({ x: v.x + 14, y: v.y + 18 });
      this.bombT = (o.easy ? 115 : 72) + rint(0, 30);
    }
    for (const b of this.bombs){
      b.y += 2.7;
      for (const bale of this.bales){
        if (bale.hp > 0 && b.x > bale.x && b.x < bale.x + bale.w && b.y > bale.y && b.y < bale.y + bale.h){
          bale.hp--; b.y = 999;
        }
      }
    }
    this.bombs = this.bombs.filter(b => b.y < H);

    if (this.invuln <= 0){
      const hit = this.bombs.some(b => Math.abs(b.x - this.px) < 13 && b.y > H - 62 && b.y < H - 34);
      const landed = maxY >= H - 72;
      if (hit || landed){
        this.bombs = []; this.invuln = 90;
        if (landed){                                    // shoo them back up rather than end the run
          const lift = Math.min(...alive.map(v => v.y)) - 48;
          for (const v of alive) v.y -= lift;
        }
        o.host.hurt(); return;
      }
    }
  },

  draw(){
    g.fillStyle = '#0b0a1f'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#dde8ff';
    STARS.forEach(s => { g.globalAlpha = REDUCED ? 0.5 : 0.3 + 0.4 * Math.abs(Math.sin(t / 40 + s.x)); g.fillRect(s.x, s.y, s.s, s.s); });
    g.globalAlpha = 1;
    g.fillStyle = '#1d1a3a'; g.fillRect(0, H - 34, W, 34);
    g.fillStyle = '#2c2856'; g.fillRect(0, H - 34, W, 3);

    this.inv.forEach(v => { if (v.alive) drawIguana(v.x, v.y, t + v.x); });
    this.bales.forEach(b => {
      if (b.hp <= 0) return;
      g.globalAlpha = 0.35 + b.hp * 0.13;
      g.fillStyle = '#c9a23a'; g.fillRect(b.x, b.y, b.w, b.h);
      g.fillStyle = '#8a6d1c'; g.fillRect(b.x, b.y + 5, b.w, 2); g.fillRect(b.x, b.y + 11, b.w, 2);
      g.globalAlpha = 1;
    });
    g.fillStyle = '#ffd76b';
    this.shots.forEach(s => { g.fillRect(s.x - 2, s.y, 4, 9); });
    g.fillStyle = '#c77dff';
    this.bombs.forEach(b => { g.fillRect(b.x - 2, b.y, 4, 8); g.fillRect(b.x - 3, b.y + 5, 6, 3); });
    this.pops.forEach(p => {
      g.globalAlpha = p.life / 18;
      txt('HOME', p.x, p.y - (18 - p.life), 10, '#9ad4b0');
      g.globalAlpha = 1;
    });
    if (this.invuln <= 0 || Math.floor(t / 5) % 2) drawChicken(this.px, H - 34, 1);
    const alive = this.inv.filter(v => v.alive).length;
    txt('SENT HOME  ' + (this.total - alive) + ' / ' + this.total, W / 2, 22, 11, '#cdbcda');
  }
};

/* ---------- 2. PEARL — GO GO GO GO (side-scrolling runner) ---------- */
GAMES.runner = {
  title: "PEARL'S GO GO GO GO", short: 'GO GO GO GO', maker: 'PEARL',
  how: ['A / SPACE   JUMP', 'PRESS AGAIN IN THE AIR TO FLAP', 'DO NOT JUMP INTO THE PAPER PLANES'],
  howTouch: ['TAP   JUMP', 'TAP AGAIN IN THE AIR TO FLAP', 'DO NOT JUMP INTO THE PAPER PLANES'],
  intro: [['PEARL', 'It is called GO GO GO GO. You GO. That is the whole game!']],
  win: [['PEARL', 'YOU WENT! You went the WHOLE WAY!'], ['SCRATCHY', 'No falling blocks. I checked.']],
  lose: [['PEARL', 'You can jump TWICE. In the air. I allowed it.'], ['PEARL', 'Again again again!']],
  tip: ['PEARL', 'TIP! Jump EARLY! Then jump AGAIN in the air! And stay on the ground for the paper planes!'],
  GY: 318, PX: 120,

  init(o){
    this.o = o; this.alt = 0; this.vy = 0; this.jumps = 0; this.invuln = 0;
    this.dist = 0; this.goal = o.micro ? 2400 : (o.easy ? 8500 : 11500);
    this.obs = []; this.corn = []; this.nextAt = o.micro ? 620 : 900; this.sp = 4;
  },

  spawn(){
    const o = this.o, far = this.dist / this.goal, r = Math.random();
    const wx = this.nextAt;
    let ob;
    if (r < 0.34)      ob = { k:'crate', w:30, h:30, alt:0 };
    else if (r < 0.56) ob = { k:'stack', w:30, h:54, alt:0 };
    else if (r < 0.82 || o.easy || o.micro || far < 0.25) ob = { k:'iguana', w:30, h:20, alt:0, walk:1.1 };
    else               ob = { k:'plane', w:38, h:14, alt:54 };
    ob.wx = wx; ob.hit = false;
    this.obs.push(ob);
    if (ob.k !== 'plane') this.corn.push({ wx: wx + 15, alt: ob.h + 44, got: false });
    else this.corn.push({ wx: wx + 19, alt: 8, got: false });
    this.nextAt += rnd(300, 460) * (0.85 + this.sp / 12);
  },

  update(inp, pr){
    const o = this.o;
    this.sp = (4 + Math.min(2.4, this.dist / this.goal * 2.4)) * (o.easy ? 0.85 : 1) * o.speed;
    this.dist += this.sp;
    if (this.invuln > 0) this.invuln--;

    if (pr.jump || pr.up){
      if (this.alt === 0){ this.vy = 10.8; this.jumps = 1; Sfx.play('jump'); }
      else if (this.jumps < 2){ this.vy = 9.2; this.jumps = 2; Sfx.play('jump'); }
    }
    if (!(inp.jump || inp.up) && this.vy > 3.5) this.vy = 3.5;
    this.alt += this.vy; this.vy -= 0.58;
    if (this.alt <= 0){ this.alt = 0; this.vy = 0; this.jumps = 0; }

    while (this.nextAt < this.dist + W + 60 && this.nextAt < this.goal - 360) this.spawn();

    const me = { x: this.dist - 10, y: this.alt + 2, w: 20, h: 26 };
    for (const ob of this.obs){
      if (ob.walk) ob.wx -= ob.walk;
      if (ob.hit || this.invuln > 0) continue;
      if (overlap(me, { x: ob.wx + 3, y: ob.alt, w: ob.w - 6, h: ob.h - 3 })){
        ob.hit = true; this.invuln = 80;
        if (o.host.hurt()) return;
        if (o.micro) return;
      }
    }
    for (const c of this.corn){
      if (!c.got && Math.abs(c.wx - this.dist) < 20 && Math.abs(c.alt - (this.alt + 14)) < 24){
        c.got = true; o.host.score += 5; Sfx.play('pick');
      }
    }
    this.obs = this.obs.filter(ob => ob.wx > this.dist - 200);
    this.corn = this.corn.filter(c => c.wx > this.dist - 200);

    if (this.dist >= this.goal){ o.host.win(); return; }
  },

  sx(wx){ return wx - this.dist + this.PX; },

  draw(){
    const GY = this.GY;
    const sky = g.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#2b1055'); sky.addColorStop(1, '#ff6688');
    g.fillStyle = sky; g.fillRect(0, 0, W, GY);
    g.fillStyle = 'rgba(26,11,46,.45)';
    for (let x = -40; x < W + 80; x += 8){
      const wx = x + this.dist * 0.25;
      const hh = 46 + Math.sin(wx / 90) * 26 + Math.sin(wx / 37) * 10;
      g.fillRect(x, GY - hh, 8, hh);
    }
    g.fillStyle = '#3d1f6e'; g.fillRect(0, GY, W, H - GY);
    g.fillStyle = '#59309b'; g.fillRect(0, GY, W, 4);
    g.fillStyle = '#2a1450';
    for (let x = -(this.dist % 48); x < W; x += 48) g.fillRect(x, GY + 18, 22, 4);

    const sign = this.sx(1500);                           // a promise, in writing
    if (!this.o.micro && sign > -160 && sign < W + 20){
      g.fillStyle = '#5a3a1c'; g.fillRect(sign + 66, GY - 60, 6, 60);
      g.fillStyle = '#f2e9f7'; g.fillRect(sign, GY - 96, 138, 40);
      if (sign > 4 && sign < W - 142){
        txt('NO FALLING BLOCKS', sign + 69, GY - 78, 12, '#1a0b2e');
        txt('(PROMISE)', sign + 69, GY - 64, 10, '#a82246');
      }
    }
    const flag = this.sx(this.goal);
    if (flag < W + 40){
      g.fillStyle = '#f2e9f7'; g.fillRect(flag, GY - 120, 5, 120);
      for (let i = 0; i < 12; i++){
        g.fillStyle = (i + Math.floor(i / 4)) % 2 ? '#1a0b2e' : '#f2e9f7';
        g.fillRect(flag + 5 + (i % 4) * 10, GY - 120 + Math.floor(i / 4) * 10, 10, 10);
      }
    }

    this.corn.forEach(c => {
      if (c.got) return;
      const x = this.sx(c.wx), y = GY - c.alt;
      g.fillStyle = '#ffcc02'; g.fillRect(x - 4, y - 6, 8, 12);
      g.fillStyle = '#90e050'; g.fillRect(x - 1, y - 10, 5, 4);
    });
    this.obs.forEach(ob => {
      const x = this.sx(ob.wx), y = GY - ob.alt - ob.h;
      if (x < -60 || x > W + 60) return;
      g.globalAlpha = ob.hit ? 0.3 : 1;
      if (ob.k === 'crate' || ob.k === 'stack'){
        for (let yy = 0; yy < ob.h; yy += 27){
          g.fillStyle = '#b07a3c'; g.fillRect(x, y + yy, ob.w, 27);
          g.strokeStyle = '#6e4a1e'; g.lineWidth = 2; g.strokeRect(x + 1, y + yy + 1, ob.w - 2, 25);
          g.beginPath(); g.moveTo(x + 2, y + yy + 2); g.lineTo(x + ob.w - 2, y + yy + 25); g.stroke();
        }
      } else if (ob.k === 'iguana'){
        g.save(); g.translate(x + ob.w, y + 1); g.scale(-1, 1); drawIguana(0, 0, t); g.restore();
      } else {
        g.fillStyle = '#f2e9f7';
        g.beginPath(); g.moveTo(x, y + 7); g.lineTo(x + ob.w, y); g.lineTo(x + ob.w - 8, y + 14); g.closePath(); g.fill();
        g.fillStyle = '#cdbcda';
        g.beginPath(); g.moveTo(x, y + 7); g.lineTo(x + ob.w - 8, y + 14); g.lineTo(x + ob.w - 14, y + 8); g.closePath(); g.fill();
        if (x > 0 && x + ob.w < W) txt('7-B', x + 24, y + 9, 7, '#a82246');
      }
      g.globalAlpha = 1;
    });

    if (this.invuln <= 0 || Math.floor(t / 5) % 2)
      Cast.draw('PEARL', this.PX, GY - this.alt, 1, false, 0.8, this.alt === 0);

    const p = clamp(this.dist / this.goal, 0, 1);
    g.fillStyle = 'rgba(6,3,12,.7)'; g.fillRect(200, 14, 240, 10);
    g.fillStyle = '#ff6688'; g.fillRect(202, 16, 236 * p, 6);
    g.fillStyle = '#f2e9f7'; g.fillRect(436, 12, 3, 14);
    if (!this.o.micro && this.dist > this.goal * 0.5 && this.dist < this.goal * 0.5 + 900)
      txt('FASTER!', W / 2, 78, 22, '#ffd76b');
  }
};

/* ---------- 3. REGINALD — STANDS IN A GARDEN (stand still, then top-down crossing) ---------- */
GAMES.standing = {
  title: 'REGINALD STANDS IN A GARDEN', short: 'REGINALD STANDS', maker: 'REGINALD',
  how: ['LEVEL 1:   YOU ARE REGINALD. DO NOT PRESS ANYTHING.', 'LEVEL 2:   ARROWS. CROSS THE GARDEN.', 'THE LAWNMOWERS ARE NOT A THREAT. AVOID THEM ANYWAY.'],
  howTouch: ['LEVEL 1:   YOU ARE REGINALD. DO NOT TOUCH ANYTHING.', 'LEVEL 2:   SWIPE TO HOP. CROSS THE GARDEN.', 'THE LAWNMOWERS ARE NOT A THREAT. AVOID THEM ANYWAY.'],
  intro: [['REGINALD', 'You are me. Stand in the garden. Do not press anything.']],
  win: [['REGINALD', 'You stood. Then you crossed. That is everything I know.'],
        ['AUNT BARB', 'Well done, Reginald.'], ['REGINALD', 'I did nothing.'], ['AUNT BARB', 'Exactly, dear.']],
  lose: [['REGINALD', 'It was not a threat. It was just a lawnmower.'],
         ['REGINALD', 'Wait for the gap. I wait for everything.']],
  tip: ['REGINALD', 'A tip. The dogs are fast. The wheelbarrows are slow. The middle path is safe. Rest there.'],
  LANES: [
    { row:9, dir: 1, sp:1.2, w:40, n:3, k:'barrow' },
    { row:8, dir:-1, sp:1.6, w:56, n:2, k:'mower' },
    { row:7, dir: 1, sp:2.0, w:30, n:2, k:'kevin' },
    { row:6, dir:-1, sp:1.3, w:40, n:3, k:'barrow' },
    { row:4, dir: 1, sp:1.7, w:56, n:2, k:'mower' },
    { row:3, dir:-1, sp:2.2, w:30, n:2, k:'kevin' },
    { row:2, dir: 1, sp:1.4, w:40, n:3, k:'barrow' },
    { row:1, dir:-1, sp:1.8, w:56, n:2, k:'mower' }
  ],
  SPAN: 760,

  init(o){
    this.o = o; this.phase = 0; this.still = 0; this.grace = 30;
    this.need = (o.micro ? 3 : 6) * 60;
    this.msg = ''; this.msgT = 0; this.moved = 0;
  },

  setupCross(){
    this.phase = 1; this.crossed = 0; this.needCross = this.o.easy ? 1 : 2;
    this.movers = [];
    this.LANES.forEach(L => {
      const off = rnd(0, this.SPAN);
      for (let i = 0; i < L.n; i++) this.movers.push({ L, x: (off + i * this.SPAN / L.n) % this.SPAN });
    });
    this.place(10); this.checkpoint = false; this.invuln = 0; this.rep = 0;
  },
  place(row){ this.c = 10; this.r = row; this.rx = this.c * 32; this.ry = this.r * 32; },

  update(inp, pr){
    const o = this.o;
    if (this.msgT > 0) this.msgT--;

    if (this.phase === 0){
      const any = inp.left || inp.right || inp.up || inp.down || inp.jump;
      if (this.grace > 0){ this.grace = any ? 12 : this.grace - 1; return; }
      if (any){
        if (this.still > 20){
          this.moved++; this.msg = 'YOU MOVED.'; this.msgT = 70; Sfx.play('blip');
          if (this.moved === 3 && !o.micro)
            Talk.interrupt({ lines: [['REGINALD', 'Standing is harder than it looks. I have practised for six years.']] });
          if (this.moved === 6 && !o.micro)
            Talk.interrupt({ lines: [['THE GAME', 'A hint. The game is called STANDS. Take your hands off everything.']] });
          if (this.moved === 10 && !o.micro)
            Talk.interrupt({ lines: [['PEARL', 'LET GO OF THE BUTTONS! ALL OF THEM! I cannot watch!']] });
        }
        this.still = 0; this.grace = 12;
        return;
      }
      if (++this.still >= this.need){
        Sfx.play('pick');
        if (o.micro){ o.host.win(); return; }
        o.host.score += 100;
        this.setupCross();
        this.msg = 'LEVEL 2: NOW CROSS IT'; this.msgT = 110;
      }
      return;
    }

    const mult = (o.easy ? 0.7 : 1) * (1 + this.crossed * 0.25) * o.speed;
    for (const m of this.movers) m.x = (m.x + m.L.dir * m.L.sp * mult + this.SPAN) % this.SPAN;
    if (this.invuln > 0) this.invuln--;

    let dc = 0, dr = 0;
    if (pr.left) dc = -1; else if (pr.right) dc = 1; else if (pr.up) dr = -1; else if (pr.down) dr = 1;
    const held = inp.left || inp.right || inp.up || inp.down;
    if (!dc && !dr && held){                       // hold to keep hopping
      if (++this.rep >= 11){
        this.rep = 0;
        if (inp.up) dr = -1; else if (inp.down) dr = 1; else if (inp.left) dc = -1; else dc = 1;
      }
    } else if (!held) this.rep = 0;
    if (dc || dr){
      this.c = clamp(this.c + dc, 0, 19); this.r = clamp(this.r + dr, 0, 11);
      Sfx.play('blip');
    }
    this.rx += (this.c * 32 - this.rx) * 0.45; this.ry += (this.r * 32 - this.ry) * 0.45;

    if (this.r === 5) this.checkpoint = true;
    if (this.r === 0){
      this.crossed++; o.host.score += 100; Sfx.play('pick');
      if (this.crossed >= this.needCross){ o.host.win(); return; }
      this.place(10); this.checkpoint = false;
      this.msg = 'AGAIN. SLIGHTLY FASTER. HIS WORDS.'; this.msgT = 120;
      return;
    }
    if (this.invuln <= 0){
      const me = { x: this.c * 32 + 7, y: this.r * 32 + 7, w: 18, h: 18 };
      for (const m of this.movers){
        if (m.L.row !== this.r) continue;
        if (overlap(me, { x: m.x - m.L.w, y: m.L.row * 32 + 5, w: m.L.w, h: 22 })){
          this.invuln = 70;
          this.place(this.checkpoint ? 5 : 10);
          o.host.hurt(); return;
        }
      }
    }
  },

  draw(){
    if (this.phase === 0){
      g.fillStyle = '#1a0b2e'; g.fillRect(0, 0, W, H);
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
        if ((r + c) % 2) continue;
        g.fillStyle = '#200d3a'; g.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
      g.fillStyle = '#2a1450'; g.fillRect(0, 300, W, 84);
      g.fillStyle = '#3d1f6e'; g.fillRect(0, 300, W, 4);
      [90, 190, 450, 560].forEach(x => drawFlower(x, 284));
      Cast.draw('REGINALD', W / 2, 300, 1, false, 1.7);
      txt('STAND IN THE GARDEN', W / 2, 92, 26, '#8fd0a8');
      const p = clamp(this.still / this.need, 0, 1);
      g.fillStyle = 'rgba(6,3,12,.8)'; g.fillRect(W / 2 - 122, 110, 244, 16);
      g.fillStyle = '#8fd0a8'; g.fillRect(W / 2 - 120, 112, 240 * p, 12);
      if (this.msgT > 0) txt(this.msg, W / 2, 160, 20, '#ff3b6b');
      else txt('do not press anything', W / 2, 150, 12, '#8a6ea8');
      return;
    }
    for (let r = 0; r < 12; r++){
      const safe = r === 0 || r === 5 || r >= 10;
      g.fillStyle = safe ? '#2f6b45' : (r % 2 ? '#1f3a2c' : '#234231');
      g.fillRect(0, r * 32, W, 32);
    }
    g.fillStyle = '#3c8a5a';
    for (let x = 8; x < W; x += 64){ g.fillRect(x, 5 * 32 + 12, 26, 8); }
    for (let x = 24; x < W; x += 56){                            // the roses. Nice roses.
      if (Math.abs(x - W / 2) > 70) drawFlower(x, 13);
    }

    for (const m of this.movers){
      const L = m.L, x = m.x - L.w, y = L.row * 32;
      if (L.k === 'barrow'){
        g.fillStyle = '#b07a3c'; g.fillRect(x + 4, y + 8, L.w - 10, 14);
        g.fillStyle = '#6e4a1e'; g.fillRect(x + 4, y + 20, L.w - 10, 3);
        g.fillStyle = '#222'; g.beginPath(); g.arc(L.dir > 0 ? x + L.w - 6 : x + 6, y + 24, 5, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#2f7d4f'; g.fillRect(x + 10, y + 4, L.w - 22, 5);
      } else if (L.k === 'mower'){
        g.fillStyle = '#d23c3c'; g.fillRect(x + 6, y + 9, L.w - 18, 15);
        g.fillStyle = '#8a2020'; g.fillRect(x + 6, y + 20, L.w - 18, 4);
        g.fillStyle = '#bbb';
        if (L.dir > 0) g.fillRect(x, y + 6, 8, 3); else g.fillRect(x + L.w - 8, y + 6, 8, 3);
        g.fillStyle = '#222'; g.fillRect(x + 8, y + 24, 8, 5); g.fillRect(x + L.w - 22, y + 24, 8, 5);
        g.fillStyle = '#ffd76b'; g.fillRect(L.dir > 0 ? x + L.w - 12 : x + 6, y + 12, 4, 4);
      } else {
        Cast.draw('KEVIN', x + L.w / 2, y + 28, L.dir, true, 0.85);
      }
    }
    if (this.invuln <= 0 || Math.floor(t / 5) % 2)
      Cast.draw('REGINALD', this.rx + 16, this.ry + 30, 1, false, 0.5);
    txt('CROSSINGS  ' + this.crossed + ' / ' + this.needCross, W / 2, 22, 11, '#f2e9f7');
    if (this.msgT > 0) txt(this.msg, W / 2, 5 * 32 + 22, 14, '#ffd76b');
  }
};

/* ---------- 4. AUNT BARB — ROSE PARADE (top-down snake) ---------- */
GAMES.parade = {
  title: "AUNT BARB'S ROSE PARADE", short: 'ROSE PARADE', maker: 'AUNT BARB',
  how: ['ARROWS   STEER AUNT BARB', 'PICK THE ROSES. THE CHICKS WILL FOLLOW.', 'MIND THE GNOMES. AND YOUR OWN PARADE.'],
  howTouch: ['SWIPE   STEER AUNT BARB', 'PICK THE ROSES. THE CHICKS WILL FOLLOW.', 'MIND THE GNOMES. AND YOUR OWN PARADE.'],
  intro: [['AUNT BARB', 'Pick the roses, dear. The chicks will follow you. Mind the gnomes.']],
  win: [['AUNT BARB', 'A full parade. Every rose accounted for.'], ['SCRATCHY', 'I counted. She is right.']],
  lose: [['AUNT BARB', 'Gnomes do not move, dear. You have to.'], ['AUNT BARB', 'Never mind. The roses will wait.']],
  tip: ['AUNT BARB', 'A tip, dear. The edges wrap around. Walk off one side and you come back on the other.'],
  CELL: 24, COLS: 26, ROWS: 14, OX: 8, OY: 40,

  init(o){
    this.o = o;
    this.goal = o.micro ? 3 : (o.easy ? 8 : 12);
    this.period = Math.max(5, Math.round((o.micro ? 9 : (o.easy ? 13 : 10)) / o.speed));
    this.got = 0; this.tick = 0; this.safe = 0;
    this.reset();
    this.gnomes = [];
    const want = o.micro ? 0 : (o.easy ? 4 : 7);
    while (this.gnomes.length < want){
      const c = rint(1, this.COLS - 2), r = rint(1, this.ROWS - 2);
      if (Math.abs(r - 7) < 2 || this.gnomes.some(q => q.c === c && q.r === r)) continue;   // keep her lane clear
      this.gnomes.push({ c, r });
    }
    this.placeRose();
  },
  reset(){ this.snake = [{ c: 13, r: 7 }]; this.dir = { c: 1, r: 0 }; this.next = this.dir; this.grow = 0; },
  free(c, r){
    return !this.snake.some(s => s.c === c && s.r === r) && !this.gnomes.some(q => q.c === c && q.r === r);
  },
  placeRose(){
    for (let i = 0; i < 200; i++){
      const c = rint(1, this.COLS - 2), r = rint(1, this.ROWS - 2);
      if (this.free(c, r)){ this.rose = { c, r }; return; }
    }
    this.rose = { c: 2, r: 2 };
  },

  update(inp, pr){
    const o = this.o, d = this.dir;
    const want = pr.left ? { c:-1, r:0 } : pr.right ? { c:1, r:0 } : pr.up ? { c:0, r:-1 } : pr.down ? { c:0, r:1 } : null;
    if (want && !(want.c === -d.c && want.r === -d.r)) this.next = want;
    if (++this.tick < this.period) return;
    this.tick = 0;
    this.dir = this.next;
    const h = this.snake[0];
    const nh = { c: (h.c + this.dir.c + this.COLS) % this.COLS, r: (h.r + this.dir.r + this.ROWS) % this.ROWS };
    if (this.safe > 0) this.safe--;

    const bump = this.gnomes.some(q => q.c === nh.c && q.r === nh.r) ||
                 (!o.easy && this.snake.slice(0, -1).some(s => s.c === nh.c && s.r === nh.r));
    if (bump && this.safe <= 0){
      this.reset(); this.safe = 4;                 // the chicks go home; the roses you picked still count
      o.host.hurt(); return;
    }
    this.snake.unshift(nh);
    if (nh.c === this.rose.c && nh.r === this.rose.r){
      this.got++; o.host.score += 10; Sfx.play('pick');
      if (this.got >= this.goal){ o.host.win(); return; }
      this.placeRose();
    } else this.snake.pop();
  },

  draw(){
    const C = this.CELL, ox = this.OX, oy = this.OY;
    g.fillStyle = '#16301f'; g.fillRect(0, 0, W, H);
    for (let r = 0; r < this.ROWS; r++) for (let c = 0; c < this.COLS; c++){
      g.fillStyle = (r + c) % 2 ? '#1f4a2e' : '#235334';
      g.fillRect(ox + c * C, oy + r * C, C, C);
    }
    this.gnomes.forEach(q => {
      const x = ox + q.c * C + 12, y = oy + q.r * C;
      g.fillStyle = '#3b6fd6'; g.fillRect(x - 6, y + 12, 12, 10);
      g.fillStyle = '#ffddbb'; g.fillRect(x - 5, y + 7, 10, 7);
      g.fillStyle = '#f2e9f7'; g.fillRect(x - 4, y + 12, 8, 5);
      g.fillStyle = '#d23c3c'; g.beginPath(); g.moveTo(x - 7, y + 8); g.lineTo(x, y - 3); g.lineTo(x + 7, y + 8); g.closePath(); g.fill();
    });
    drawFlower(ox + this.rose.c * C + 12, oy + this.rose.r * C + 10);

    for (let i = this.snake.length - 1; i >= 0; i--){
      const s = this.snake[i], x = ox + s.c * C + 12, y = oy + s.r * C + 12;
      if (i === 0){
        if (this.safe > 0 && Math.floor(t / 5) % 2) continue;
        g.fillStyle = '#7799cc'; g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#ffddbb'; g.beginPath(); g.arc(x + this.dir.c * 3, y + this.dir.r * 3, 7, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#ddd8d0'; g.beginPath(); g.arc(x - this.dir.c * 2, y - this.dir.r * 2, 5, 0, Math.PI * 2); g.fill();
      } else {

    const c = nearCabinet();

    }
  }
  if (Leak.towerStep(inp)) return;                       // standing on a stack of chicks
  Leak.pre();
  step();
  Leak.post(inp);
}
