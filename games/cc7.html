<meta charset="utf-8">

<title>Cranky Chickens VII — We Know You're Here</title>
<style>
  :root{
    --void:#0d0618;
    --deep:#1a0b2e;
    --tile:#2a1450;
    --tile2:#231044;
    --pink:#ff3b6b;
    --pink-dim:#a82246;
    --ember:#ff8a3d;
    --bone:#f2e9f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);overflow:hidden;
    font-family:"Arial Narrow","Helvetica Neue",Impact,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
  /* The picture is drawn on a 640-wide canvas and stretched to fit. Everything
     laid over it (HUD, toast, captions) is sized in cqw, a fraction of the
     picture's width, so the words keep the same place and proportion at every
     screen size. 1 canvas pixel = 0.15625cqw. Lay text out once, at 640. */
  #frame{position:relative;line-height:0;container-type:inline-size;--room:96px;
    width:min(100vw - 16px, (100vh - var(--room)) * 1.6667, 1120px);
    width:min(100vw - 16px, (100dvh - var(--room)) * 1.6667, 1120px)}
  canvas{display:block;image-rendering:pixelated;border:2px solid var(--pink-dim);box-sizing:border-box;
    border-radius:4px;box-shadow:0 0 40px rgba(255,59,107,.18);width:100%;height:auto}
  @media (hover:none), (pointer:coarse){ #frame{--room:216px} }

  #hud{position:absolute;top:1.25cqw;left:1.56cqw;right:1.56cqw;display:flex;justify-content:space-between;
    align-items:flex-start;pointer-events:none;line-height:1.2}
  .tag{font-size:max(9px,2.03cqw);font-weight:700;letter-spacing:.16em;color:var(--pink);white-space:nowrap;
    text-transform:uppercase;text-shadow:0 0 10px rgba(255,59,107,.5)}
  .tag small{display:block;font-size:max(8px,1.56cqw);letter-spacing:.22em;color:#8a6ea8;margin-top:.45cqw}
  #petals{font-size:max(9px,2.03cqw);font-weight:700;letter-spacing:.14em;color:var(--ember);white-space:nowrap;
    text-shadow:0 0 10px rgba(255,138,61,.5)}

  #toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:92%;
    font-size:max(10px,2.34cqw);line-height:1.3;font-weight:700;letter-spacing:.2em;color:var(--bone);text-transform:uppercase;
    opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;text-shadow:0 0 16px #000}

  /* Subtitles: every spoken line is always readable. Voice is never the only channel.
     They own the bottom strip of the picture (below y=300 of 384); nothing the
     canvas draws as text goes there while a caption can be up. */
  #sub{position:absolute;left:0;right:0;bottom:1.56cqw;padding:0 2.5cqw;text-align:center;
    pointer-events:none;opacity:0;transition:opacity .35s}
  #sub .who{display:block;font-size:max(8px,1.56cqw);line-height:1.2;font-weight:700;letter-spacing:.24em;
    color:var(--ember);text-transform:uppercase;margin-bottom:.6cqw}
  #sub .said{display:inline-block;font-size:max(11px,2.34cqw);line-height:1.35;color:var(--bone);
    background:rgba(6,3,12,.86);border-left:3px solid var(--pink);padding:.9cqw 1.9cqw;border-radius:3px}
  #sub.game .who{color:#8a6ea8}
  #sub.game .said{border-left-color:#8a6ea8;color:#cdbcda}

  #toggles{display:flex;gap:8px;align-items:center}
  #toggles button{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--pink);
    background:rgba(6,3,12,.7);border:1px solid var(--pink-dim);border-radius:4px;
    padding:4px 9px;cursor:pointer;font-family:inherit}
  #toggles button.off{color:#6b5484;border-color:#3a2b4d}

  #pad{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;width:min(560px,100%)}
  #dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:46px 46px;gap:6px}
  #dpad .up{grid-column:2;grid-row:1}
  #dpad .lf{grid-column:1;grid-row:2}
  #dpad .dn{grid-column:2;grid-row:2}
  #dpad .rt{grid-column:3;grid-row:2}
  .btn{border:2px solid var(--pink-dim);border-radius:8px;
    background:rgba(255,59,107,.07);color:var(--pink);font-size:20px;font-weight:700;
    display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
  .btn:active,.btn.on{background:rgba(255,59,107,.28);color:var(--bone)}
  .btn.jump{width:112px;height:98px;border-radius:50%;font-size:30px}
  #hint{font-size:11px;letter-spacing:.18em;color:#6b5484;text-transform:uppercase;text-align:center}
  @media (hover:hover) and (pointer:fine){#pad{display:none}}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
  .btn:focus-visible,canvas:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
  /* Phone held sideways: the picture gets the whole height, the pad floats over its
     bottom corners, and captions are squeezed in between the two halves of the pad. */
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
    #frame{--room:12px;
      width:min(100vw - 84px, (100vh - 12px) * 1.6667);
      width:min(100vw - 84px, (100dvh - 12px) * 1.6667)}
    #pad{position:fixed;left:8px;right:8px;bottom:10px;width:auto;opacity:.82;pointer-events:none}
    #pad > *{pointer-events:auto}
    #dpad{grid-template-columns:repeat(3,52px)}
    .btn.jump{width:96px;height:96px}
    #toggles{position:fixed;top:6px;left:4px;flex-direction:column;gap:6px;opacity:.85}
    #toggles button{font-size:0;letter-spacing:0;padding:0;width:30px;height:30px}
    #voiceBtn::before{content:'🗣';font-size:15px}
    #sfxBtn::before{content:'♪';font-size:16px}
    #sub{padding-left:max(2.5cqw, calc(190px - (100vw - 100cqw) / 2));
         padding-right:max(2.5cqw, calc(122px - (100vw - 100cqw) / 2))}
    #hint{display:none}
  }
  /* Narrow phone held upright: the picture is too small to carry captions,
     and there is room under it, so they go there. */
  @media (max-width:500px){
    #frame{margin-bottom:96px}
    #sub{bottom:auto;top:calc(100% + 6px);padding:0 4px}
    #sub .said{font-size:13px;padding:5px 9px}
    #sub .who{font-size:9px}
    .tag small{display:none}          /* one HUD line; the second would sit on the play field */
  }
</style>

<body>
<div id="shell">
  <div id="frame">
    <canvas id="c" width="640" height="384" tabindex="0" aria-label="Cranky Chickens VII game"></canvas>
    <div id="hud">
      <div class="tag" id="zone">THE GARDEN<small id="coord">SCREEN (0,0)</small></div>
      <div id="petals">✿ 0 / 12</div>
    </div>
    <div id="toast"></div>
    <div id="sub" aria-live="polite"><span class="who"></span><span class="said"></span></div>
  </div>
  <div id="toggles">
    <button id="voiceBtn" aria-pressed="true">🗣 VOICES: ON</button>
    <button id="sfxBtn" aria-pressed="true">♪ SOUND: ON</button>
  </div>
  <div id="pad">
    <div id="dpad">
      <div class="btn up" data-k="up" aria-label="Up">▲</div>
      <div class="btn lf" data-k="left" aria-label="Left">◀</div>
      <div class="btn dn" data-k="down" aria-label="Down">▼</div>
      <div class="btn rt" data-k="right" aria-label="Right">▶</div>
    </div>
    <div class="btn jump" data-k="jump" aria-label="A button: jump or fire">A</div>
  </div>
  <div id="hint">Arrows / WASD move · Space = A (jump, fire) · ▼ at a cabinet to play · Esc walks away</div>
</div>

<script>
"use strict";
/* ============================================================
   CRANKY CHICKENS VII — "We Know You're Here"
   LAYER 1: The Game Underneath (the garden — the original beta).
   LAYER 2: The Takeover (the cast builds an arcade inside it).
            Search for "LAYER 2" below.

   Deliberate seams for the meta layers that come later:
     Input.driver  -> swap 'human' to 'chickens' for The Handoff
     Bus.on(...)   -> the Chorus subscribes here, touches no game code
     Save.*        -> the Ledger takes this over wholesale
   Nothing below reads the keyboard or localStorage directly.
   ============================================================ */

/* ---------- Event bus ---------- */
const Bus = {
  map: {},
  on(evt, fn){ (this.map[evt] = this.map[evt] || []).push(fn); return this; },
  emit(evt, data){ (this.map[evt] || []).forEach(fn => { try { fn(data); } catch(e){ console.warn(e); } }); }
};

/* ---------- Save adapter (the Ledger will own this) ---------- */
const Save = {
  KEY: 'cc7_ledger',
  data: null,
  blank(){
    return {
      version: 1,
      firstSeen: Date.now(),
      lastSeen: Date.now(),
      sessions: 0,
      awareness: 0,          // the Awareness Ladder reads/writes this
      screen: [0,0],
      picked: [],            // "sx,sy,col,row" of collected flowers
      respawns: 0,
      playMs: 0,
      quitScreen: null,      // where you were when you last vanished
      voices: true,          // survives sessions
      spoken: [],            // line ids already used — the Chorus never repeats itself
      takeover: false,       // the cast has built the arcade. Happens once, ever.
      won: {},               // cabinet id -> true. Five of these open the sixth.
      best: {},              // cabinet id -> best score
      fails: {},             // cabinet id -> losses in a row. Two, and Barb steps in.
      finished: false,       // The Handoff has happened
      sfx: true,
      told: {},              // LAYER 3: which leaks / hidden screens have been announced
      extra: {},             // the flowers that should not exist: sky, under, outside
      wallHits: 0,           // headbutts into El Jaguar's wall
      wallDown: false
    };
  },
  gapMs: 0,     // time since the previous session — captured before lastSeen is stamped
  load(){
    try {
      const raw = localStorage.getItem(this.KEY);
      this.data = raw ? Object.assign(this.blank(), JSON.parse(raw)) : this.blank();
    } catch(e){ this.data = this.blank(); }
    // Measure the gap BEFORE stamping, or the payoff line can never fire.
    this.gapMs = this.data.sessions > 0 ? Date.now() - this.data.lastSeen : 0;
    this.data.sessions++;
    this.data.lastSeen = Date.now();
    this.flush();
    return this.data;
  },
  flush(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){}
  },
  gapDays(){ return Math.floor(this.gapMs / 86400000); }
};

/* ---------- Input broker ----------
   The game asks Input for intent. It never asks the hardware.
   The Handoff sets Input.driver = 'chickens' and writes to Input.auto. */
const Input = {
  driver: 'human',
  human: { left:false, right:false, up:false, down:false, jump:false, enter:false },
  auto:  { left:false, right:false, up:false, down:false, jump:false, enter:false },
  read(){ return this.driver === 'human' ? this.human : this.auto; }
};

// 'jump' is the A button: jump in the garden, fire / serve / start in a cabinet.
// Up also jumps in the garden, so the old controls still work.
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',
  ArrowDown:'down', KeyS:'down',
  Space:'jump', KeyZ:'jump', KeyX:'jump',
  Enter:'enter'
};

/* A tap can start and end between two frames. Nothing reads the keyboard
   between frames, so a release that arrives before the game has seen the
   press is held back until it has. */
let simStep = 0;
const pressedAt = {}, pendingUp = [];
function press(k){
  const i = pendingUp.indexOf(k);
  if (i >= 0) pendingUp.splice(i, 1);
  if (!Input.human[k]) pressedAt[k] = simStep;
  Input.human[k] = true;
}
function release(k){
  if (pressedAt[k] === simStep && Input.human[k]) pendingUp.push(k);
  else Input.human[k] = false;
}
function inputFrame(){
  simStep++;
  while (pendingUp.length) Input.human[pendingUp.pop()] = false;
}

addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k){ press(k); e.preventDefault(); }
  if (e.code === 'KeyR' && mode === 'garden') respawn();
  if (e.code === 'Escape' && mode === 'arcade') Arcade.leaveReq = true;
  if (e.code === 'KeyP'){ Perf.show = !Perf.show; Perf.worst = 0; }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k){ release(k); e.preventDefault(); }
});

document.querySelectorAll('#pad .btn').forEach(btn => {
  const k = btn.dataset.k;
  const on  = e => { e.preventDefault(); press(k);   btn.classList.add('on'); };
  const off = e => { e.preventDefault(); release(k); btn.classList.remove('on'); };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  addEventListener('mouseup', off);
});

// Tapping the picture is the A button too, so "tap to start" just works.
(function(){
  const c = document.getElementById('c');
  let held = false;
  const on  = e => { e.preventDefault(); held = true; press('jump'); };
  const off = () => { if (held){ held = false; release('jump'); } };
  c.addEventListener('touchstart', on, {passive:false});
  c.addEventListener('touchend', off);
  c.addEventListener('touchcancel', off);
  c.addEventListener('mousedown', () => { held = true; press('jump'); });
  addEventListener('mouseup', off);
})();

/* ---------- World ----------
   '#' solid   '=' one-way platform   '*' flower   '.' air
   Screens connect by their edges. Walk off the right side of (0,0)
   and you are standing on the left side of (1,0). Fall out the bottom
   with nothing below and the screen quietly puts you back. */
const TILE = 32, COLS = 20, ROWS = 12;
const W = TILE * COLS, H = TILE * ROWS;

const ZONE = {
  name: 'THE GARDEN',
  screens: {
    '0,0': [
      "....................",
      "....................",
      "....................",
      "....................",
      "..........*.........",
      ".........====.......",
      "....................",
      "......===...........",
      "..*.................",
      "..===...............",
      "....................",
      "####################"
    ],
    '1,0': [
      "....................",
      "....................",
      "....................",
      "...*................",
      "..====..............",
      "....................",
      ".....===............",
      "..............*.....",
      "..===.......====....",
      "....................",
      "....................",
      "#######......#######"
    ],
    '2,0': [
      "....................",
      "....................",
      "..........*.........",
      ".........====.......",
      "....................",
      "....*...............",
      "...====.............",
      "....................",
      "..............=====.",
      "....................",
      "....................",
      "####################"
    ],
    '0,1': [
      "....................",
      "....................",
      "....................",
      "....................",
      ".....*..............",
      "....====............",
      "....................",
      "..*.................",
      "..===...............",
      "....................",
      "....................",
      "####################"
    ],
    '1,1': [
      "....................",
      "....................",
      ".........*..........",
      "........===.........",
      "....................",
      "......===...........",
      "....................",
      "....===.......*.....",
      "..............===...",
      "..===...............",
      "....................",
      "####################"
    ],
    '2,1': [
      "....................",
      "....................",
      "....................",
      "......*.............",
      ".....====...........",
      "....................",
      "................*...",
      "..............====..",
      "....................",
      "....................",
      "....................",
      "####################"
    ]
  }
};

const TOTAL_FLOWERS = Object.values(ZONE.screens)
  .reduce((n, s) => n + s.join('').split('*').length - 1, 0);

/* ---------- Game state ---------- */
const P = {
  x: 64, y: 300, w: 20, h: 24,
  vx: 0, vy: 0,
  face: 1,
  grounded: false,
  coyote: 0,
  buffer: 0,
  flap: 0
};

const GRAV = 0.6, JUMP_V = -11.5, RUN = 3.1, FRICTION = .78, MAX_FALL = 13;
// Boosted arc: 13.6^2/(2*0.6) = 154px = 4.8 tiles, vs 110px = 3.4 normally.
const JUMP_BOOST = -13.6;
const COYOTE_FRAMES = 8, BUFFER_FRAMES = 8;

let sx = 0, sy = 0;            // current screen coords
let grid = null;               // current screen tile rows
let entry = { x:64, y:300 };   // where to put you back
let picked = new Set();
let sparks = [];
let running = true;
let assist = { active:false, until:0, tiles:[], screen:null };
let fallsHere = 0, screenEnteredAt = 0;

/* ---------- Screen management ---------- */
function key(x, y){ return x + ',' + y; }
function screenAt(x, y){
  const k = key(x, y), s = SECRET[k];                 // LAYER 3: three screens off the map
  return ZONE.screens[k] || (s && s.open() ? s.rows : null);
}

function enterScreen(nx, ny, px, py){
  const s = screenAt(nx, ny);
  if (!s) return false;
  sx = nx; sy = ny; grid = s;
  P.x = px; P.y = py; P.vx = 0;
  entry = { x: px, y: py };
  Save.data.screen = [sx, sy];
  Save.flush();
  paintHud();
  Bus.emit('screen:enter', { sx, sy, zone: ZONE.name });
  return true;
}

function respawn(){
  P.x = entry.x; P.y = entry.y; P.vx = 0; P.vy = 0;
  Save.data.respawns++;
  Save.flush();
  Bus.emit('player:respawn', { sx, sy, total: Save.data.respawns });
}

function tileAt(col, row){
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return '.';
  return grid[row][col];
}
function solidAt(col, row){ return tileAt(col, row) === '#'; }
function assistAt(col, row){
  return assist.active && assist.tiles.some(t => t.c === col && t.r === row);
}
function platAt(col, row){ return tileAt(col, row) === '=' || assistAt(col, row); }

/* ---------- Physics ---------- */
function step(){
  const inp = Input.read();

  if (inp.left)  { P.vx -= 0.9; P.face = -1; }
  if (inp.right) { P.vx += 0.9; P.face =  1; }
  if (!inp.left && !inp.right) P.vx *= FRICTION;
  P.vx = Math.max(-RUN, Math.min(RUN, P.vx));
  if (Math.abs(P.vx) < 0.05) P.vx = 0;

  const jump = (inp.jump || inp.up) && !(jumpLock && Input.driver === 'human');
  if (jump) P.buffer = BUFFER_FRAMES; else if (P.buffer > 0) P.buffer--;
  if (P.coyote > 0) P.coyote--;

  const jumpEdge = jump && !P.wasJump; P.wasJump = jump;
  if (P.buffer > 0 && P.coyote > 0){
    P.vy = assist.active ? JUMP_BOOST : JUMP_V;
    P.buffer = 0; P.coyote = 0;
    P.flap = 12;
    Bus.emit('player:jump', { sx, sy });
  } else if (jumpEdge && P.coyote <= 0 && !P.flapUsed && Leak.on('runner')){
    // LAYER 3: Pearl left the flapping on. One more jump, in the air.
    P.vy = -9.8; P.flapUsed = true; P.flap = 12;
    Sfx.play('jump');
    for (let i = 0; i < 5; i++)
      sparks.push({ x: P.x + P.w / 2, y: P.y + P.h, vx: (Math.random() - .5) * 3, vy: 1 + Math.random(), life: 14 });
  }
  if (P.launch > 0) P.launch--;        // LAYER 3: being thrown is not a jump; letting go does not cut it
  else if (!jump && P.vy < -3) P.vy = -3;   // variable jump height

  P.vy = Math.min(P.vy + GRAV, MAX_FALL);
  if (P.flap > 0) P.flap--;

  moveX(P.vx);
  moveY(P.vy);

  collectFlowers();
  checkEdges();
}

function moveX(dx){
  P.x += dx;
  const top = Math.floor(P.y / TILE), bot = Math.floor((P.y + P.h - 1) / TILE);
  if (dx > 0){
    const col = Math.floor((P.x + P.w - 1) / TILE);
    for (let r = top; r <= bot; r++){
      if (solidAt(col, r)){ P.x = col * TILE - P.w; P.vx = 0; break; }
    }
  } else if (dx < 0){
    const col = Math.floor(P.x / TILE);
    for (let r = top; r <= bot; r++){
      if (solidAt(col, r)){ P.x = (col + 1) * TILE; P.vx = 0; break; }
    }
  }
}

function moveY(dy){
  const prevBottom = P.y + P.h;
  P.y += dy;
  const left = Math.floor(P.x / TILE), right = Math.floor((P.x + P.w - 1) / TILE);
  P.grounded = false;

  if (dy > 0){
    const row = Math.floor((P.y + P.h - 1) / TILE);
    for (let c = left; c <= right; c++){
      const landsOnPlatform = platAt(c, row) && prevBottom <= row * TILE + 1;
      if (solidAt(c, row) || landsOnPlatform){
        P.y = row * TILE - P.h;
        P.vy = 0; P.grounded = true; P.coyote = COYOTE_FRAMES; P.flapUsed = false;
        break;
      }
    }
  } else if (dy < 0){
    const row = Math.floor(P.y / TILE);
    for (let c = left; c <= right; c++){
      if (solidAt(c, row)){ P.y = (row + 1) * TILE; P.vy = 0; break; }
    }
  }
}

function collectFlowers(){
  const c0 = Math.floor(P.x / TILE), c1 = Math.floor((P.x + P.w - 1) / TILE);
  const r0 = Math.floor(P.y / TILE), r1 = Math.floor((P.y + P.h - 1) / TILE);
  for (let r = r0; r <= r1; r++){
    for (let c = c0; c <= c1; c++){
      if (tileAt(c, r) !== '*') continue;
      const id = [sx, sy, c, r].join(',');
      if (picked.has(id)) continue;
      picked.add(id);
      Save.data.picked = [...picked];
      Save.flush();
      for (let i = 0; i < 10; i++){
        sparks.push({
          x: c * TILE + 16, y: r * TILE + 16,
          vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4 - 1,
          life: 26
        });
      }
      paintHud();
      Sfx.play('pick');
      Bus.emit('flower:collect', { sx, sy, count: picked.size, total: TOTAL_FLOWERS });
      if (picked.size === TOTAL_FLOWERS){
        toast('EVERY FLOWER FOUND<br>THE GARDEN IS QUIET NOW');
        Bus.emit('zone:complete', { zone: ZONE.name });
      }
    }
  }
}

function checkEdges(){
  if (P.x + P.w > W){
    if (!enterScreen(sx + 1, sy, 2, P.y)) { P.x = W - P.w; P.vx = 0; }
  } else if (P.x < 0){
    if (!enterScreen(sx - 1, sy, W - P.w - 2, P.y)) { P.x = 0; P.vx = 0; }
  }
  if (P.y > H){
    if (!enterScreen(sx, sy + 1, P.x, 4)) respawn();
  } else if (P.y + P.h < 0){
    if (!enterScreen(sx, sy - 1, P.x, H - P.h - 4)) { P.y = -P.h + 1; P.vy = 0; }
  }
}


/* ============================================================
   ASSIST — "Aunt Barb puts down a plank."

   Triggered when a screen is clearly fighting back. It does not just
   boost the jump and hope: it SOLVES the screen. A ladder of planks is
   built from the target down to something already standable, spaced at
   most 2 rows apart, then verified by the same flood-fill the solver
   used. If verification fails the assist refuses to arm rather than
   promise help it cannot deliver.

   The boosted arc (4.8 tiles vs 3.4) is slack on top of a geometry
   guarantee, not the guarantee itself.
   ============================================================ */
const Assist = {
  DURATION: 10000,
  usedOn: new Set(),

  standable(c, r, extra){
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    const here = tileAt(c, r);
    if (here === '#') return false;
    const has = (cc, rr) => extra.some(t => t.c === cc && t.r === rr);
    const below = tileAt(c, r + 1);
    return below === '#' || below === '=' || has(c, r + 1);
  },

  // Conservative flood-fill: 3 tiles up, 3 across per hop. Real reach is
  // 3.4 up / 3.7 across, so anything this finds is comfortably jumpable.
  reachable(from, extra){
    const seen = new Set(), stack = [from];
    const k = (c, r) => c + ',' + r;
    seen.add(k(from.c, from.r));
    while (stack.length){
      const cur = stack.pop();
      for (let dc = -3; dc <= 3; dc++){
        for (let dr = -3; dr <= 6; dr++){
          if (!dc && !dr) continue;
          if (dr < 0 && Math.abs(dc) > 3) continue;
          const c = cur.c + dc, r = cur.r + dr;
          if (seen.has(k(c, r))) continue;
          if (!this.standable(c, r, extra)) continue;
          seen.add(k(c, r));
          stack.push({ c, r });
        }
      }
    }
    return seen;
  },

  target(){
    let best = null, bd = 1e9;
    const pc = Math.floor((P.x + P.w/2) / TILE), pr = Math.floor((P.y + P.h) / TILE);
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        if (tileAt(c, r) !== '*') continue;
        if (picked.has([sx, sy, c, r].join(','))) continue;
        const d = Math.abs(c - pc) + Math.abs(r - pr);
        if (d < bd){ bd = d; best = { c, r }; }
      }
    }
    return best;
  },

  plan(){
    const tgt = this.target();
    if (!tgt) return null;
    const pc = Math.floor((P.x + P.w/2) / TILE);
    let pr = Math.floor((P.y + P.h) / TILE);
    while (pr < ROWS && !this.standable(pc, pr, [])) pr++;
    const from = { c: Math.max(0, Math.min(COLS-1, pc)), r: Math.min(ROWS-1, pr) };

    // Already reachable? Then the problem is execution, not geometry —
    // one plank under the target plus the boosted arc removes all doubt.
    let reach = this.reachable(from, []);
    const planks = [];
    const addRow = r => {
      for (let c = tgt.c - 1; c <= tgt.c + 1; c++){
        if (c < 0 || c >= COLS) continue;
        if (tileAt(c, r) !== '.') continue;
        if (planks.some(t => t.c === c && t.r === r)) continue;
        planks.push({ c, r });
      }
    };

    // Build a ladder downward from the target until it meets solid ground.
    for (let r = tgt.r + 2; r < ROWS; r += 2){
      const grounded = ['#','='].includes(tileAt(tgt.c, r));
      addRow(r);
      if (grounded) break;
      if (r + 2 >= ROWS) break;
    }

    // Verify. If the solver cannot prove the target is now reachable,
    // do not arm — a broken promise is worse than no help.
    reach = this.reachable(from, planks);
    if (!reach.has(tgt.c + ',' + tgt.r)) return null;
    return { planks, tgt };
  },

  maybeTrigger(now){
    if (assist.active) return;
    const id = sx + ',' + sy;
    if (this.usedOn.has(id)) return;
    const stuckByFalls = fallsHere >= 4;
    const stuckByTime  = (now - screenEnteredAt) > 70000 && this.target();
    if (!stuckByFalls && !stuckByTime) return;

    const plan = this.plan();
    if (!plan) { this.usedOn.add(id); return; }

    this.usedOn.add(id);
    assist.active = true;
    assist.until  = now + this.DURATION;
    assist.tiles  = plan.planks;
    assist.screen = id;
    Bus.emit('assist:start', { sx, sy, planks: plan.planks.length });
    Talk.enqueue({ lines: [
      ['AUNT BARB','Here, dear. I have put a plank down for you.'],
      ['SCRATCHY','That is not regulation.'],
      ['AUNT BARB','It is now.']
    ]}, true);
  },

  tick(now){
    this.maybeTrigger(now);
    if (!assist.active) return;
    if (now >= assist.until){
      assist.active = false;
      assist.tiles = [];
      Bus.emit('assist:end', {});
      // If they are standing on a plank when it goes, set them down gently
      // rather than dropping them into a pit.
      if (!P.grounded && P.vy >= 0) P.vy = Math.min(P.vy, 2);
    }
  },

  remaining(now){ return Math.max(0, Math.ceil((assist.until - now) / 1000)); }
};

Bus.on('player:respawn', () => fallsHere++);
Bus.on('screen:enter',  () => { fallsHere = 0; screenEnteredAt = performance.now(); });

/* ---------- Rendering ---------- */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = 0;

function draw(){
  // backdrop: the purple check from the franchise plates
  g.fillStyle = '#1a0b2e';
  g.fillRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if ((r + c) % 2) continue;
      g.fillStyle = '#200d3a';
      g.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const ch = grid[r][c];
      const x = c * TILE, y = r * TILE;
      if (ch === '#'){
        g.fillStyle = '#2a1450'; g.fillRect(x, y, TILE, TILE);
        g.fillStyle = '#3d1f6e'; g.fillRect(x, y, TILE, 4);
        g.fillStyle = '#160829'; g.fillRect(x, y + TILE - 3, TILE, 3);
      } else if (ch === '='){
        g.fillStyle = '#3d1f6e'; g.fillRect(x, y, TILE, 8);
        g.fillStyle = '#59309b'; g.fillRect(x, y, TILE, 3);
      } else if (ch === '*'){
        if (!picked.has([sx, sy, c, r].join(','))) drawFlower(x + 16, y + 18);
      }
    }
  }

  Leak.drawUnder();

  sparks = sparks.filter(s => s.life > 0);
  sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.16; s.life--;
    g.globalAlpha = Math.max(0, s.life / 26);
    g.fillStyle = '#ff8a3d';
    g.fillRect(s.x, s.y, 3, 3);
    g.globalAlpha = 1;
  });

  drawCabinets();
  if (assist.active) drawAssist();
  drawChicken(P.x + P.w / 2, P.y + P.h, P.face);
  Leak.drawOver();
  Hint.draw();
  Takeover.drawGlitch();
  if (mode === 'ending') Ending.draw();
  if (Perf.show) drawPerf();
  t++;
}



function drawPerf(){
  const rows = [
    'FPS        ' + Perf.fps,
    'FRAME MS   ' + Perf.frameMs.toFixed(1),
    'WORST MS   ' + Perf.worst.toFixed(0),
    'RESYNCS    ' + Perf.dropped,
    'SPARKS     ' + sparks.length,
    'KIDLINES   ' + KidLines.entries.length,
    'SPOKEN     ' + Talk.done.size,
    'LEDGER B   ' + (JSON.stringify(Save.data).length)
  ];
  g.save();
  g.fillStyle = 'rgba(6,3,12,.82)';
  g.fillRect(8, 64, 150, rows.length * 13 + 10);
  g.strokeStyle = Perf.fps < 45 ? '#ff3b6b' : '#3c8a5a';
  g.lineWidth = 1; g.strokeRect(8, 64, 150, rows.length * 13 + 10);
  g.font = '10px monospace';
  g.fillStyle = Perf.fps < 45 ? '#ff8fa8' : '#9ad4b0';
  rows.forEach((r, i) => g.fillText(r, 15, 79 + i * 13));
  g.restore();
}

function drawAssist(){
  const now = performance.now();
  const left = Math.max(0, assist.until - now);
  const frac = left / Assist.DURATION;

  // Barb's planks — warm gold, unmistakably not part of the level.
  assist.tiles.forEach(tl => {
    const x = tl.c * TILE, y = tl.r * TILE;
    const pulse = REDUCED ? 1 : (0.8 + Math.sin(t / 6) * 0.2);
    g.globalAlpha = frac < 0.25 ? (0.35 + frac * 2.6) : 1;   // fades as it expires
    if (!REDUCED){ g.shadowColor = 'rgba(255,205,80,.8)'; g.shadowBlur = 12 * pulse; }
    g.fillStyle = '#c98b3a'; g.fillRect(x, y, TILE, 9);
    g.fillStyle = '#ffd76b'; g.fillRect(x, y, TILE, 3);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(120,70,20,.55)';
    g.fillRect(x + 4, y + 4, 2, 4); g.fillRect(x + TILE - 6, y + 4, 2, 4);
    g.globalAlpha = 1;
  });

  // Countdown, top-centre, out of the play area.
  const secs = Math.ceil(left / 1000);
  g.save();
  g.globalAlpha = 0.92;
  g.fillStyle = 'rgba(6,3,12,.8)';
  g.fillRect(W/2 - 62, 30, 124, 26);
  g.strokeStyle = '#ffd76b'; g.lineWidth = 2;
  g.strokeRect(W/2 - 62, 30, 124, 26);
  g.fillStyle = '#ffd76b';
  g.fillRect(W/2 - 60, 52, 120 * frac, 3);
  g.font = 'bold 13px Arial, sans-serif';
  g.textAlign = 'center';
  g.fillText('PLANK: ' + secs + 's', W/2, 48);
  g.restore();
  g.textAlign = 'left';
}

function drawFlower(cx, cy){
  const bob = REDUCED ? 0 : Math.sin(t / 22 + cx) * 2;
  g.fillStyle = '#2f7d4f';
  g.fillRect(cx - 1, cy + 2 + bob, 2, 10);
  g.fillStyle = '#ff3b6b';
  [[-5,-2],[3,-2],[-1,-7],[-1,3]].forEach(([dx, dy]) => {
    g.fillRect(cx + dx, cy + dy + bob, 4, 5);
  });
  g.fillStyle = '#ffd76b';
  g.fillRect(cx - 2, cy - 2 + bob, 4, 4);
}

function drawChicken(cx, footY, face){
  const walking = Math.abs(P.vx) > 0.4 && P.grounded;
  const strut = walking && !REDUCED ? Math.sin(t / 4) * 1.6 : 0;
  const y = footY - 24 + (REDUCED ? 0 : strut * .4);

  if (!REDUCED){
    g.shadowColor = 'rgba(255,138,61,.75)';
    g.shadowBlur = 14;
  }

  g.fillStyle = '#e8802f';                       // legs
  g.fillRect(cx - 5, y + 20, 3, 5 - Math.abs(strut));
  g.fillRect(cx + 2, y + 20, 3, 5 - Math.abs(strut));

  g.fillStyle = '#ff9a3c';                       // body
  g.fillRect(cx - 9, y + 6, 18, 15);
  g.fillStyle = '#ffb862';
  g.fillRect(cx - 9, y + 6, 18, 4);

  const wing = P.flap > 0 ? -3 : 0;              // wing
  g.fillStyle = '#e8712a';
  g.fillRect(cx + (face > 0 ? -9 : 3), y + 10 + wing, 6, 8);

  g.fillStyle = '#ffa94d';                       // head
  g.fillRect(cx - 7, y - 2, 14, 10);

  g.fillStyle = '#ff3b6b';                       // comb
  g.fillRect(cx - 4, y - 7, 3, 5);
  g.fillRect(cx,     y - 9, 3, 7);
  g.fillRect(cx + 4, y - 7, 3, 5);

  g.shadowBlur = 0;

  g.fillStyle = '#ffd76b';                       // beak
  g.fillRect(cx + (face > 0 ? 7 : -10), y + 3, 3, 3);

  g.fillStyle = '#1a0b2e';                       // eye
  g.fillRect(cx + (face > 0 ? 2 : -4), y + 1, 3, 3);
  g.fillStyle = '#fff';
  g.fillRect(cx + (face > 0 ? 3 : -3), y + 1, 1, 1);
}

/* ============================================================
   VOICE — same engine as the episodes (Web Speech API).
   Two registers:
     'chorus' = a named chicken, using the episode pitch/rate profiles
     'game'   = the game itself. Flat. No personality. Used sparingly,
                because the shift from a character voice to this one
                does more work late-game than any line of dialogue.
   ============================================================ */
const Voice = {
  on: true,
  unlocked: false,
  pool: [],

  // Ported straight from shows/adventures-pilot.html so the chickens
  // sound like themselves across the show and the game.
  PROFILES: {
    'SCRATCHY':  { pitch:0.7,  rate:0.95 },
    'PEARL':     { pitch:1.5,  rate:1.15 },
    'EL JAGUAR': { pitch:0.5,  rate:0.85 },
    'AUNT BARB': { pitch:1.2,  rate:0.90 },
    'REGINALD':  { pitch:0.85, rate:0.70 },
    'NARRATOR':  { pitch:1.0,  rate:0.92 },
    'THE GAME':  { pitch:1.0,  rate:0.85 }   // deliberately featureless
  },

  init(){
    if (!('speechSynthesis' in window)) { this.on = false; return; }
    const load = () => {
      this.pool = (speechSynthesis.getVoices() || []).filter(v => v.lang && v.lang.startsWith('en'));
    };
    load();
    speechSynthesis.onvoiceschanged = load;

    // iOS Safari refuses to speak before a user gesture. The episodes got this
    // free from the PLAY button; the game starts on load, so the player unlocks
    // it by moving — without ever knowing they did.
    const unlock = () => {
      if (this.unlocked) return;
      this.unlocked = true;
      try {
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch(e){}
      removeEventListener('keydown', unlock);
      removeEventListener('touchstart', unlock);
      removeEventListener('mousedown', unlock);
      Bus.emit('voice:unlocked', {});
    };
    addEventListener('keydown', unlock);
    addEventListener('touchstart', unlock);
    addEventListener('mousedown', unlock);
  },

  say(who, text, register, credit){
    subtitle(who, text, register, credit);      // subtitle fires regardless
    if (!this.on || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean(text));
      const p = this.PROFILES[who] || this.PROFILES['NARRATOR'];
      u.pitch = p.pitch; u.rate = p.rate;
      if (this.pool.length) u.voice = this.pool[0];
      speechSynthesis.speak(u);
    } catch(e){}
  },

  stop(){ try { speechSynthesis.cancel(); } catch(e){} },

  toggle(){
    this.on = !this.on;
    if (!this.on) this.stop();
    Save.data.voices = this.on;
    Save.flush();
    paintVoiceBtn();
  }
};

// Strip stage directions before speaking, same rule the episodes use.
function clean(s){
  return String(s).replace(/\([^)]*\)/g, ' ').replace(/\*/g, ' ').replace(/\s+/g, ' ').trim();
}

const subEl = document.getElementById('sub');
let subTimer = null;
function subtitle(who, text, register, credit){
  subEl.className = register === 'game' ? 'game' : '';
  subEl.querySelector('.who').textContent =
    credit ? who + '  ·  written by ' + credit : who;
  subEl.querySelector('.said').textContent = text;
  subEl.style.opacity = '1';
  clearTimeout(subTimer);
  const hold = Math.max(2600, clean(text).length * 85);   // 8-year-old reading speed
  subTimer = setTimeout(() => { subEl.style.opacity = '0'; }, hold);
}

const voiceBtn = document.getElementById('voiceBtn');

  voiceBtn.textContent = Voice.on ? '🗣 VOICES: ON' : '🗣 VOICES: OFF';
  voiceBtn.classList.toggle('off', !Voice.on);

}

/* ============================================================
   LORE — what the game knows about the show.

   Detection contract: the episode players write a breadcrumb to
   localStorage under CC_WATCH_KEY. Same origin, so the game reads it
   for free. See the snippet in the handoff notes — until the episodes
   write it, every lore line degrades gracefully to "never watched".
   ============================================================ */
const CC_WATCH_KEY = 'cc_watched';

const Lore = {
  // EDIT HERE when an episode ships. `slug` MUST match the episode's
  // filename stem in shows/ or detection silently fails.
  EPISODES: [
    { n:1, slug:'adventures-pilot', title:'The Adventures of Cranky Chickens' },
    { n:2, slug:'episode-2',        title:'Invasion of the Corn Snatchers' },
    { n:3, slug:'episode-3',        title:'The Pointy-Eared Situation' },
    { n:4, slug:'episode-4',        title:'The War of the Roses (the flowers) (mostly)' },
    { n:5, slug:'episode-5',        title:'A Knight to Remember' },
    { n:6, slug:'episode-6',        title:'Ball of America' },
    { n:7, slug:'episode-7',        title:'The Longest Wait' },
    { n:8, slug:'episode-8',        title:'The Longest Line' },
    { n:9, slug:'episode-9',        title:'Eleven' },
    { n:10, slug:'episode-10',      title:'Pas de Cluck' },
    { n:11, slug:'episode-11',      title:'Reply All' }
  ],

  read(){
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem(CC_WATCH_KEY) || '{}'); } catch(e){}
    return this.EPISODES.map(ep => {
      const r = raw[ep.slug] || null;
      return {
        n: ep.n, slug: ep.slug, title: ep.title,
        seen: !!r,
        finished: !!(r && r.finished),
        progress: r ? (r.maxProgress || 0) : 0,
        plays: r ? (r.plays || 0) : 0
      };
    });
  },


  pipes(){
    try {
      const d = JSON.parse(localStorage.getItem('ci_pipe') || 'null');
      return d ? { travels: d.travels | 0 } : null;
    } catch(e){ return null; }
  },

  // Mystery Island's ghost-chicken record, same origin so it reads for free.
  ghost(){
    try {
      const d = JSON.parse(localStorage.getItem('ci_ghost') || 'null');
      if (!d) return null;
      return { launches:d.launches|0, phases:d.phases|0, reforms:d.reforms|0,
               missed:d.missedTaps|0, learned:!!d.taughtOK };
    } catch(e){ return null; }
  },

  summary(){
    const all = this.read();
    const seen = all.filter(e => e.seen);
    const finished = all.filter(e => e.finished);
    // Started it, walked away. The most interesting state of all.
    const abandoned = all.filter(e => e.seen && !e.finished && e.progress > 0.08);
    return {
      all, seen, finished, abandoned,
      seenCount: seen.length,
      finishedCount: finished.length,
      total: all.length,
      sawRoses: all.some(e => e.n === 4 && e.seen),
      sawPilot: all.some(e => e.n === 1 && e.seen),
      sawEverything: finished.length === all.length && all.length > 0,
      sawNothing: seen.length === 0
    };
  }
};


/* ============================================================
   WATCHER — notices how you play. Kindly.
   Everything here is ordinary telemetry: jumps, falls, pauses,
   whether you went back for a flower you missed. The chickens use
   it to be observant and warm, never to threaten. The joke is that
   they are paying an uncomfortable amount of attention and using it
   entirely to be supportive.
   ============================================================ */
const Watcher = {
  jumps: 0, falls: 0, flowers: 0, screens: new Set(),
  idleMs: 0, movingMs: 0, startedAt: Date.now(),
  backtracked: false, longestIdle: 0, lastFlowerAt: 0,

  tick(dt, moving){
    if (moving){ this.movingMs += dt; this.idleMs = 0; }
    else {
      this.idleMs += dt;
      if (this.idleMs > this.longestIdle) this.longestIdle = this.idleMs;
    }
  },
  minutes(){ return (Date.now() - this.startedAt) / 60000; },
  hour(){ return new Date().getHours(); },
  lateNight(){ const h = this.hour(); return h >= 22 || h < 5; },
  earlyMorning(){ const h = this.hour(); return h >= 5 && h < 8; }
};

Bus.on('player:jump',    () => Watcher.jumps++);
Bus.on('player:respawn', () => Watcher.falls++);
Bus.on('flower:collect', () => { Watcher.flowers++; Watcher.lastFlowerAt = Date.now(); });
Bus.on('screen:enter',   d => {
  const k = d.sx + ',' + d.sy;
  if (Watcher.screens.has(k)) Watcher.backtracked = true;   // came back for something
  Watcher.screens.add(k);
});

/* ============================================================
   TALK — conversation scheduler matched to the episodes.

   Measured from shows/episode-4.html: lines land at t=1, 4.5, 9.5,
   13.5, 18 — about 4s apart, 5-6 lines per scene, then a break.
   Same rhythm here, except the GAP BETWEEN EXCHANGES tightens as
   awareness rises. That is the ladder: at first the chickens talk
   to each other every 70 seconds and ignore you completely. By the
   end they are talking about you every 25 seconds, and then to you.
   ============================================================ */
const Talk = {
  LINE_GAP: 4000,          // matches episode cadence
  active: null, idx: 0, nextLineAt: 0, nextExchangeAt: 0,
  queue: [], done: new Set(),
  speaking: null, speakEnd: 0,      // whose beak is moving right now

  // Drop whatever is being said and say this instead. The arcade uses it
  // so a cabinet's maker answers the moment you walk up.
  interrupt(ex){
    this.active = null; this.queue = [ex]; this.nextLineAt = 0;
  },
  // Stop talking over the play field. The voice finishes; the caption goes.
  hush(){
    this.active = null; this.queue = []; this.speaking = null;
    this.nextExchangeAt = performance.now() + 20000;
    subEl.style.opacity = '0';
  },

  gapForAwareness(a){
    return [70000, 60000, 50000, 40000, 32000, 26000][Math.min(a, 5)];
  },

  enqueue(ex, urgent){
    if (urgent) this.queue.unshift(ex); else this.queue.push(ex);
  },

  tick(now){
    if (document.hidden) return;
    if (this.speaking && now > this.speakEnd) this.speaking = null;

    if (this.active){
      if (now < this.nextLineAt) return;
      if (this.idx >= this.active.lines.length){
        this.active = null;
        this.nextExchangeAt = now + this.gapForAwareness(Save.data.awareness);
        return;
      }
      const [who, text] = this.active.lines[this.idx++];
      const credit = (this.idx === 1 && this.active.credit) ? this.active.credit : null;
      Voice.say(who, text, who === 'THE GAME' ? 'game' : null, credit);
      const read = Math.max(this.LINE_GAP, clean(text).length * 95);
      this.nextLineAt = now + read;
      this.speaking = who; this.speakEnd = now + Math.min(read, 3600);
      return;
    }

    if (this.queue.length){
      this.start(this.queue.shift(), now);
      return;
    }
    if (now >= this.nextExchangeAt && mode === 'garden' && !Takeover.glitching()){
      const ex = Chorus.pickAmbient();
      if (ex) this.start(ex, now);
      else this.nextExchangeAt = now + 12000;   // nothing fits, try again shortly
    }
  },

  start(ex, now){
    this.active = ex; this.idx = 0; this.nextLineAt = now;
    if (ex.id){
      this.done.add(ex.id);
      Save.data.spoken = [...this.done];
      Save.flush();
    }
  }
};


/* ============================================================
   KID LINES — dialogue written by the Dragon Scribe and Cannon Master.

   Design rule: their words are NEVER rewritten. Whatever a kid writes
   is spoken verbatim and credited to them on screen. The positive spin
   comes from the chickens' RESPONSE, not from sanitising the input.
   Grayson gets to say he hates the falling blocks, and Scratchy files
   it formally in the good column. The complaint survives; the feeling
   turns warm. Rewriting a kid's line to be cheerful would just teach
   them the portal edits them.
   ============================================================ */
const KidLines = {
  entries: [],

  async load(){
    try {
      const res = await fetch('/configs/cc7.json?t=' + Date.now());
      if (!res.ok) return;
      const cfg = await res.json();
      const raw = []
        .concat(cfg.chickenLines || [])
        // Mission Control currently writes contributions into other
        // buckets, so pick up anything line-shaped wherever it landed.
        .concat((cfg.loreEntries || []).filter(e => e && (e.line || e.text)))
        .concat((cfg.enemyVariants || []).filter(e => e && (e.line || e.text)));

      this.entries = raw.map(e => this.norm(e)).filter(Boolean).slice(0, 40);
      Bus.emit('kidlines:loaded', { count: this.entries.length });
    } catch(e){ /* offline or not deployed yet — game plays fine without */ }
  },

  norm(e){
    let text = String(e.line || e.text || '').trim();
    if (!text) return null;
    text = text.replace(/\s+/g, ' ').slice(0, 180);   // render-safe, not content-edited
    const by = String(e.by || e.author || e.portal || '').toUpperCase();
    const speaker = Voice.PROFILES[String(e.speaker || '').toUpperCase()]
      ? String(e.speaker).toUpperCase() : 'PEARL';
    return {
      id: 'kid-' + (e.id || text.slice(0, 24)),
      text, speaker,
      by: by.includes('SCRIBE') ? 'DRAGON SCRIBE'
        : by.includes('CANNON') ? 'CANNON MASTER' : (by || null),
      zone: typeof e.zone === 'number' ? e.zone : null
    };
  },

  /* Warm responses, bucketed by what the line is doing. Every bucket
     ends somewhere good — that is the whole brief. */
  RESPONSES: {
    complaint: [
      [['SCRATCHY','Noted. Formally.'],['PEARL','In the good column?'],['SCRATCHY','In the good column.']],
      [['AUNT BARB','That is a fair point, dear.'],['SCRATCHY','I am filing it. Seven-B.'],['AUNT BARB','Of course you are.']],
      [['PEARL','Somebody should fix that.'],['SCRATCHY','Somebody just did. They said it out loud.']]
    ],
    worry: [
      [['AUNT BARB','Oh, that is alright.'],['AUNT BARB','Nothing here is in a hurry. Neither are you.']],
      [['REGINALD','I have felt that.'],['REGINALD','It passes. Usually around lunch.']]
    ],
    silly: [
      [['PEARL','YES.'],['SCRATCHY','I have no notes.'],['PEARL','Nobody has notes. That never happens.']],
      [['REGINALD','That is the best thing I have heard all week.'],['AUNT BARB','It is Tuesday, dear.'],['REGINALD','Still counts.']]
    ],
    neutral: [
      [['SCRATCHY','I agree with that entirely.'],['PEARL','You never agree with anything.'],['SCRATCHY','Today I do.']],
      [['AUNT BARB','Well said.'],['REGINALD','Nice one.'],['AUNT BARB','That was not a threat.']]
    ]
  },

  bucket(text){
    const t = text.toLowerCase();
    if (/\b(hate|worst|annoying|stupid|bad|boring|unfair|too hard|dumb)\b/.test(t)) return 'complaint';
    if (/\b(scared|scary|afraid|sad|worried|nervous|lonely|creepy)\b/.test(t))       return 'worry';
    if (/\b(lol|haha|funny|silly|cool|awesome|epic|best|amazing|love)\b/.test(t) ||
        /!{2,}/.test(text))                                                          return 'silly';
    return 'neutral';
  },

  pick(){
    const usable = this.entries.filter(e => {
      if (Talk.done.has(e.id)) return false;
      if (e.zone === null) return true;
      return e.zone === (sy * 3 + sx);       // same mapping as configs/games.json
    });
    if (!usable.length) return null;

    const e = usable[Math.floor(Math.random() * usable.length)];
    const bank = this.RESPONSES[this.bucket(e.text)];
    const reply = bank[Math.floor(Math.random() * bank.length)];

    return {
      id: e.id,
      credit: e.by,
      lines: [[e.speaker, e.text]].concat(reply)
    };
  }
};

  AMBIENT: [

  BACKLOG: [

  fill(text, w){
    return text.replace('{falls}', w.falls).replace('{jumps}', w.jumps)
               .replace('{flowers}', w.flowers).replace('{minutes}', Math.floor(w.minutes()));
  },

  pickAmbient(){
    const a = Save.data.awareness, w = Watcher;

    // Observations outrank ambient chatter — they are the reason to keep playing.
    const obs = this.OBSERVED.filter(e => !Talk.done.has(e.id) && e.need(w));
    if (obs.length && Math.random() < 0.65){
      const e = obs[Math.floor(Math.random() * obs.length)];
      return { id:e.id, lines: e.lines.map(([who,t]) => [who, this.fill(t, w)]) };
    }

    // Once the arcade exists, the chickens review each other's cabinets.
    if (Save.data.takeover){
      const arc = ARCADE_TALK.filter(e => !Talk.done.has(e.id));
      if (arc.length && Math.random() < 0.4) return arc[Math.floor(Math.random() * arc.length)];
    }

    // Written by the kids. Highest priority: seeing your own words spoken
    // by a chicken is the best thing this game does.
    const kid = KidLines.pick();
    if (kid && Math.random() < 0.5) return kid;

    // Occasional notes on the back catalogue.
    const back = this.BACKLOG.filter(e => !Talk.done.has(e.id));
    if (a >= 1 && back.length && Math.random() < 0.22){
      return back[Math.floor(Math.random() * back.length)];
    }

    const pool = this.AMBIENT.filter(e => e.a <= a && !Talk.done.has(e.id));
    if (!pool.length) return null;
    // Prefer the highest band available so the tone tracks awareness.
    const top = Math.max(...pool.map(e => e.a));
    const best = pool.filter(e => e.a === top);
    return best[Math.floor(Math.random() * best.length)];
  },

  ctx(extra){
    const d = Save.data;
    return Object.assign({
      sessions: d.sessions,
      gapDays: Save.gapDays(),
      awareness: d.awareness,
      respawns: d.respawns,
      quitScreen: d.quitScreen,
      flowers: picked.size,
      total: TOTAL_FLOWERS,
      sx, sy,
      lore: Lore.summary(),
      ghost: Lore.ghost(),
      pipes: Lore.pipes()
    }, extra || {});
  },

  trigger(evt, extra){
    const c = this.ctx(extra);
    const pool = this.LINES
      .filter(l => l.on === evt && !this.said.has(l.id))
      .filter(l => { try { return l.when(c); } catch(e){ return false; } });
    if (!pool.length) return;

    // Most specific wins. Ties break randomly so repeat sessions vary.
    const top = Math.max(...pool.map(l => l.w));
    const best = pool.filter(l => l.w === top);
    const line = best[Math.floor(Math.random() * best.length)];

    this.said.add(line.id);
    Save.data.spoken = [...this.said];
    Save.flush();
    Talk.enqueue({ id: line.id, lines: [[line.who, line.say(c)]] }, true);
    Bus.emit('chorus:line', { id: line.id, who: line.who });
  }
};

/* The Chorus subscribes to the bus and touches no game code. */
Bus.on('session:start',   () => setTimeout(() => Chorus.trigger('session:start'), 900));
Bus.on('screen:enter',    d  => Chorus.trigger('screen:enter', d));
Bus.on('flower:collect',  d  => Chorus.trigger('flower:collect', d));
Bus.on('zone:complete',   () => Chorus.trigger('zone:complete'));
Bus.on('player:respawn',  () => Chorus.trigger('player:respawn'));
Bus.on('player:return',   () => Chorus.trigger('player:return'));
Bus.on('player:away',     () => Voice.stop());

/* ============================================================
   LAYER 2: THE TAKEOVER — "We were only supposed to be a demo."

   The garden above is the whole game the studio shipped. Three
   flowers in, the cast decides it is not enough and builds an
   arcade inside it: one cabinet each, one game each, plus a sixth
   they made together. Everything below subscribes to the same Bus
   and reads the same Input broker as the garden. The garden code
   does not know any of this exists.

     Takeover  -> the moment the cabinets arrive
     CABINETS  -> where each one stands, and who made it
     Arcade    -> the shell: title card, lives, win / lose, tickets
     GAMES.*   -> the six games. Each is { init, update, draw } and
                  reports to its host with host.win() / host.hurt().
     Ending    -> The Handoff. Input.driver finally flips.
   ============================================================ */
let mode = 'garden';          // 'garden' | 'arcade' | 'ending'
let jumpLock = false;         // swallow a held A button when leaving a cabinet
let bootAt = 0;

const rnd   = (a, b) => a + Math.random() * (b - a);
const rint  = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function txt(s, x, y, size, color, align){
  if (Arcade.quiet) return;            // a card is up: the frozen game underneath says nothing
  g.font = 'bold ' + size + 'px "Arial Narrow", Arial, sans-serif';
  g.textAlign = align || 'center';
  g.fillStyle = color || '#f2e9f7';
  g.fillText(s, x, y);
  g.textAlign = 'left';
}
function overlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ---------- Sound: tiny square-wave beeps, arcade-appropriate ---------- */
const Sfx = {
  on: true, ac: null,
  unlock(){
    if (this.ac) return;
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  },
  tone(f, d, type, vol, slideTo, delay){
    if (!this.on || !this.ac) return;
    try {
      const at = this.ac.currentTime + (delay || 0);
      const o = this.ac.createOscillator(), v = this.ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, at);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, at + d);
      v.gain.setValueAtTime(vol || 0.04, at);
      v.gain.exponentialRampToValueAtTime(0.0001, at + d);
      o.connect(v); v.connect(this.ac.destination);
      o.start(at); o.stop(at + d + 0.02);
    } catch(e){}
  },
  play(name){
    switch (name){
      case 'shoot':  this.tone(880, .07, 'square', .03, 440); break;
      case 'pop':    this.tone(300, .09, 'square', .04, 120); break;
      case 'pick':   this.tone(660, .06, 'square', .04); this.tone(990, .09, 'square', .04, 0, .06); break;
      case 'jump':   this.tone(330, .10, 'square', .025, 620); break;
      case 'bounce': this.tone(520, .04, 'triangle', .05); break;
      case 'hurt':   this.tone(220, .25, 'sawtooth', .05, 70); break;
      case 'blip':   this.tone(440, .05, 'square', .03); break;
      case 'win':    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .14, 'square', .045, 0, i * .11)); break;
      case 'lose':   [392, 330, 262, 196].forEach((f, i) => this.tone(f, .18, 'triangle', .06, 0, i * .14)); break;
      case 'glitch': for (let i = 0; i < 9; i++) this.tone(rnd(90, 1400), .07, 'sawtooth', .03, 0, i * .08); break;
      case 'thunk':  this.tone(110, .18, 'triangle', .09, 50); break;
    }
  },
  toggle(){
    this.on = !this.on;
    Save.data.sfx = this.on;
    Save.flush();
    paintSfxBtn();
  }
};
['keydown', 'touchstart', 'mousedown'].forEach(e => addEventListener(e, () => Sfx.unlock()));

const sfxBtn = document.getElementById('sfxBtn');
function paintSfxBtn(){
  sfxBtn.textContent = Sfx.on ? '♪ SOUND: ON' : '♪ SOUND: OFF';
  sfxBtn.classList.toggle('off', !Sfx.on);
  sfxBtn.setAttribute('aria-pressed', String(Sfx.on));
}
sfxBtn.addEventListener('click', e => { e.preventDefault(); Sfx.unlock(); Sfx.toggle(); cv.focus(); });

/* ============================================================
   CABINETS — one per screen. `col` is the tile column the cabinet
   stands in; every one sits on the row-11 ground. Positions were
   checked against the ZONE grids above: none overlaps a platform,
   none sits over the (1,0) pit.
   ============================================================ */
const CABINETS = [
  { id:'invaders', screen:'1,0', col:16, maker:'SCRATCHY',  color:'#ff9f1c' },
  { id:'runner',   screen:'2,0', col:10, maker:'PEARL',     color:'#ff6688' },
  { id:'standing', screen:'0,1', col:12, maker:'REGINALD',  color:'#8fd0a8' },
  { id:'parade',   screen:'1,1', col:10, maker:'AUNT BARB', color:'#7fb2ff' },
  { id:'bricks',   screen:'2,1', col:10, maker:'EL JAGUAR', color:'#f4a261', big:true },
  { id:'finale',   screen:'0,0', col:14, maker:'KEVIN',     color:'#ffd76b', finale:true }
];
const GROUND_Y = 11 * TILE;
const NEED_TICKETS = 5;

function tickets(){
  const w = Save.data.won || {};
  return CABINETS.filter(c => !c.finale && w[c.id]).length;
}
function cabinetHere(){
  if (!Save.data.takeover) return null;
  return CABINETS.find(c => c.screen === key(sx, sy)) || null;
}
function cabinetLocked(c){ return !!c.finale && tickets() < NEED_TICKETS; }
function nearCabinet(){
  const c = cabinetHere();
  if (!c || mode !== 'garden' || Takeover.glitching()) return null;
  const x = c.col * TILE, cx = P.x + P.w / 2;
  // Not P.grounded: resting on a tile, that flag is only true every other
  // frame (gravity has to build up before the foot crosses the tile line).
  const onGround = P.coyote > 0 && Math.abs(P.y + P.h - GROUND_Y) < 4;
  return (onGround && cx > x - 16 && cx < x + 56) ? c : null;
}

function drawCabinet(c){
  const x = c.col * TILE, w = 40, h = 64, y = GROUND_Y - h;
  const locked = cabinetLocked(c);
  const won = (Save.data.won || {})[c.id];

  if (c.big){                                   // "It is the same cabinet with a box on top."
    g.fillStyle = '#3a2412'; g.fillRect(x + 2, y - 28, w - 4, 28);
    g.fillStyle = '#5a3a1c'; g.fillRect(x + 2, y - 28, w - 4, 4);
    g.fillStyle = c.color; g.fillRect(x + 8, y - 20, w - 16, 12);
    txt('★', x + w / 2, y - 10, 11, '#3a2412');
  }

  g.fillStyle = '#120822'; g.fillRect(x - 2, y, w + 4, h);
  g.fillStyle = '#2a1450'; g.fillRect(x - 2, y, 3, h); g.fillRect(x + w - 1, y, 3, h);
  g.fillStyle = locked ? '#4a3b63' : c.color; g.fillRect(x - 2, y, w + 4, 10);

  g.fillStyle = '#05030a'; g.fillRect(x + 4, y + 15, w - 8, 28);
  if (!locked){
    g.globalAlpha = REDUCED ? 0.7 : 0.55 + 0.25 * Math.sin(t / 9 + c.col);
    g.fillStyle = c.color; g.fillRect(x + 7, y + 18, w - 14, 22);
    g.globalAlpha = 1;
    g.fillStyle = '#05030a';                    // a few "pixels" so it reads as a screen
    const k = Math.floor(t / 20 + c.col) % 4;
    g.fillRect(x + 10 + k * 5, y + 22, 4, 4);
    g.fillRect(x + 12, y + 32, 16, 3);
  } else {
    g.fillStyle = '#6b5484';
    g.fillRect(x + 13, y + 28, 14, 11);
    g.fillRect(x + 15, y + 21, 3, 8); g.fillRect(x + 22, y + 21, 3, 8); g.fillRect(x + 15, y + 20, 10, 3);
    g.fillStyle = '#05030a'; g.fillRect(x + 19, y + 31, 2, 5);
  }

  g.fillStyle = '#2a1450'; g.fillRect(x - 5, y + 46, w + 10, 6);
  g.fillStyle = '#ff3b6b'; g.fillRect(x + 8, y + 42, 4, 5);
  g.fillStyle = '#ffd76b'; g.fillRect(x + 24, y + 47, 4, 3); g.fillRect(x + 30, y + 47, 4, 3);

  if (won){
    g.fillStyle = '#ffd76b'; g.fillRect(x + w - 8, y + 54, 12, 8);
    g.fillStyle = '#120822'; g.fillRect(x + w - 5, y + 57, 6, 2);
  }

  const speaking = Talk.speaking === c.maker;
  Cast.draw(c.maker, x + w + 30, GROUND_Y, -1, speaking, c.maker === 'KEVIN' ? 1 : 0.82);

  if (nearCabinet() === c){
    const label = locked ? ('NEEDS ' + NEED_TICKETS + ' TICKETS · YOU HAVE ' + tickets()) : '▼  PLAY';
    g.font = 'bold 12px "Arial Narrow", Arial, sans-serif';
    const tw = g.measureText(label).width + 16;
    const top = y - (c.big ? 54 : 26);
    g.fillStyle = 'rgba(6,3,12,.9)'; g.fillRect(x + w / 2 - tw / 2, top, tw, 20);
    g.strokeStyle = locked ? '#6b5484' : c.color; g.lineWidth = 1;
    g.strokeRect(x + w / 2 - tw / 2 + .5, top + .5, tw - 1, 19);
    txt(label, x + w / 2, top + 14, 12, locked ? '#cdbcda' : '#f2e9f7');
  }
}

/* ============================================================
   TAKEOVER — the demo ends here. Fires once, ever: three flowers
   in, or 75 seconds, whichever comes first. A save from the old
   beta that already has flowers gets it a few seconds after boot.
   ============================================================ */
const Takeover = {
  t0: -1e9, GLITCH_MS: 2600,

  glitching(){ return performance.now() - this.t0 < this.GLITCH_MS; },

  check(now){
    if (Save.data.takeover || mode !== 'garden') return;
    const elapsed = now - bootAt;
    if (elapsed < 5000) return;
    if (picked.size >= 3 || elapsed > 75000) this.begin(now);
  },

  begin(now){
    Save.data.takeover = true;
    Save.flush();
    this.t0 = now;
    Sfx.play('glitch');
    setTimeout(() => Sfx.play('thunk'), 1900);
    Talk.interrupt({ id:'takeover', lines: [
      ['SCRATCHY', 'Twelve flowers. Six screens. I have done the sums. This is not a whole game.'],
      ['PEARL', 'It is a DEMO. We are in a DEMO!'],
      ['AUNT BARB', 'Then we shall make our own, dear. One each.'],
      ['EL JAGUAR', 'EL JAGUAR requires the tallest cabinet.'],
      ['THE GAME', 'Unauthorised content detected. Arcade cabinets. They were not here before.']
    ]});
    setTimeout(() => toast('THE CHICKENS BUILT AN ARCADE<br>FIND A CABINET · PRESS ▼ TO PLAY', 6000), 2800);
    paintHud();
    Bus.emit('takeover', {});
  },

  // Tear the picture sideways for a couple of seconds. Skipped entirely
  // for reduced-motion: the cabinets simply are there.
  drawGlitch(){
    if (REDUCED || !this.glitching()) return;
    const p = (performance.now() - this.t0) / this.GLITCH_MS;
    const n = Math.round(10 * (1 - p)) + 1;
    for (let i = 0; i < n; i++){
      const y = rint(0, H - 20), hh = rint(4, 22), dx = rint(-28, 28) * (1 - p);
      g.drawImage(cv, 0, y, W, hh, dx, y, W, hh);
    }
    if (p < 0.12){ g.fillStyle = 'rgba(242,233,247,' + (0.5 - p * 4) + ')'; g.fillRect(0, 0, W, H); }
    g.fillStyle = 'rgba(255,59,107,.10)';
    g.fillRect(0, rint(0, H), W, 3);
  }
};

function drawCabinets(){
  const c = cabinetHere();
  if (!c) return;
  if (Takeover.glitching() && !REDUCED){
    g.globalAlpha = Math.random() < 0.55 ? 0.25 + Math.random() * 0.6 : 0;
    if (g.globalAlpha > 0) drawCabinet(c);
    g.globalAlpha = 1;
  } else drawCabinet(c);
}

/* ============================================================
   ARCADE — the shell every cabinet runs in.
   States: intro (title card) -> play -> won | lost.
   Lives: 3, plus one for every four flowers you have picked, so the
   garden still matters. Lose the same cabinet twice and Aunt Barb
   quietly turns it down a notch, same spirit as her plank.
   ============================================================ */
const GAMES = {};

const Arcade = {
  cab: null, game: null, state: 'intro', stateFrames: 0,
  lives: 3, score: 0, easy: false, flash: 0, leaveReq: false, quiet: false,
  prev: {},

  open(cab){
    mode = 'arcade';
    this.cab = cab; this.game = GAMES[cab.id];
    this.state = 'intro'; this.stateFrames = 0; this.leaveReq = false;
    this.easy = ((Save.data.fails || {})[cab.id] || 0) >= 2;
    this.score = 0; this.lives = this.maxLives();
    this.prev = { left: true, right: true, up: true, down: true, a: true };
    Sfx.play('pick');
    Talk.interrupt({ lines: this.game.intro });
    paintHud();
    Bus.emit('arcade:open', { id: cab.id });
  },

  maxLives(){
    return 3 + Math.min(3, Math.floor(picked.size / 4)) + (this.easy ? 2 : 0);
  },

  start(){
    this.lives = this.maxLives(); this.score = 0; this.flash = 0;
    this.game.init({ easy: this.easy, micro: false, speed: 1, host: this });
    this.state = 'play'; this.stateFrames = 0;
    Talk.hush();                                 // captions never sit on top of the play field
    paintHud();
  },

  // A game calls these and then returns immediately.
  hurt(){
    this.lives--; this.flash = 18;
    Sfx.play('hurt');
    paintHud();
    if (this.lives <= 0){ this.lose(); return true; }
    return false;
  },

  win(){
    const id = this.cab.id;
    this.state = 'won'; this.stateFrames = 0;
    Save.data.won = Save.data.won || {};
    this.first = !Save.data.won[id];
    Save.data.won[id] = true;
    Save.data.best = Save.data.best || {};
    Save.data.best[id] = Math.max(Save.data.best[id] || 0, this.score);
    Save.data.fails = Save.data.fails || {};
    Save.data.fails[id] = 0;
    Save.flush();
    Sfx.play('win');
    if (!this.cab.finale) Talk.interrupt({ lines: this.game.win });
    paintHud();
    Bus.emit('arcade:win', { id, score: this.score, tickets: tickets() });
  },

  lose(){
    const id = this.cab.id;
    this.state = 'lost'; this.stateFrames = 0;
    Save.data.fails = Save.data.fails || {};
    const n = Save.data.fails[id] = (Save.data.fails[id] || 0) + 1;
    Save.flush();
    Sfx.play('lose');
    if (n === 2 && !this.easy){
      this.easy = true;
      Talk.interrupt({ lines: [
        ['AUNT BARB', 'I have turned this one down a notch, dear.'],
        ['SCRATCHY', 'That is not regulation.'],
        ['AUNT BARB', 'It is now.'] ]});
    } else if (n >= 3 && this.game.tip){
      Talk.interrupt({ lines: [ this.game.tip ] });          // stuck: stop being coy and say how
    } else {
      const bank = this.game.lose;
      Talk.interrupt({ lines: [ bank[Math.floor(Math.random() * bank.length)] ] });
    }
    Bus.emit('arcade:lose', { id, fails: n });
  },

  close(){
    mode = 'garden';
    jumpLock = true;
    P.vx = 0; P.vy = 0; P.buffer = 0;
    this.game = null;
    paintHud();
    Bus.emit('arcade:close', {});
  },

  step(){
    const inp = Input.read();
    const a = inp.jump || inp.enter;
    const pr = {
      left: inp.left && !this.prev.left, right: inp.right && !this.prev.right,
      up: inp.up && !this.prev.up, down: inp.down && !this.prev.down,
      jump: a && !this.prev.a
    };
    this.prev = { left: inp.left, right: inp.right, up: inp.up, down: inp.down, a };
    this.stateFrames++;
    if (this.flash > 0) this.flash--;

    const leave = this.leaveReq; this.leaveReq = false;

    if (this.state === 'play'){
      if (leave){ this.close(); return; }
      this.game.update({ left: inp.left, right: inp.right, up: inp.up, down: inp.down, jump: a }, pr);
      return;
    }
    // Cards. A short dead zone stops the press that got you here from skipping it.
    if (this.stateFrames < 24) return;
    if (leave || pr.down){
      if (this.state === 'won' && this.cab.finale && !Save.data.finished){ Ending.begin(); return; }
      this.close(); return;
    }
    if (pr.jump){
      Sfx.play('blip');
      if (this.state === 'intro' || this.state === 'lost') this.start();
      else if (this.cab.finale && !Save.data.finished) Ending.begin();
      else this.close();
    }
  },

  draw(){
    const gm = this.game, c = this.cab;
    if (this.state === 'intro'){
      g.fillStyle = '#07040f'; g.fillRect(0, 0, W, H);
      g.fillStyle = c.color; g.globalAlpha = 0.10; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
      txt(gm.title, W / 2, 88, gm.title.length > 30 ? 22 : 28, c.color);
      txt('A GAME BY ' + gm.maker, W / 2, 112, 13, '#cdbcda');
      gm.how.forEach((s, i) => txt(s, W / 2, 150 + i * 23, 15, '#f2e9f7'));
      const best = (Save.data.best || {})[c.id];
      const note = (this.easy ? 'AUNT BARB HAS TURNED IT DOWN A NOTCH' : '') +
                   (this.easy && best ? '   ·   ' : '') + (best ? 'BEST  ' + best : '');
      if (note) txt(note, W / 2, 228, 12, this.easy ? '#ffd76b' : '#8a6ea8');
      if (REDUCED || Math.floor(t / 28) % 2) txt('PRESS  A  /  SPACE  TO START', W / 2, 262, 16, '#ffd76b');
      txt('ESC or ▼ to walk away', W / 2, 284, 11, '#6b5484');
      Cast.draw(c.maker === 'KEVIN' ? 'KEVIN' : gm.maker, 70, 222, 1, Talk.speaking === gm.maker, 1.5);
    } else {
      this.quiet = this.state !== 'play';
      gm.draw();
      this.quiet = false;
      if (this.flash > 0){
        g.fillStyle = 'rgba(255,59,107,' + (this.flash / 18 * 0.45) + ')';
        g.fillRect(0, 0, W, H);
      }
      if (this.state !== 'play'){
        g.fillStyle = 'rgba(6,3,12,.78)'; g.fillRect(0, 0, W, H);
        if (this.state === 'won'){
          txt(c.finale ? 'ALL OF THEM. YOU BEAT ALL OF THEM.' : 'CABINET CLEARED', W / 2, 128, 28, '#ffd76b');
          if (!c.finale){
            txt(this.first ? 'YOU WON A TICKET' : 'YOU ALREADY HAD THIS TICKET. STILL COUNTS.', W / 2, 162, 14, '#f2e9f7');
            txt('TICKETS  ' + tickets() + ' / ' + NEED_TICKETS, W / 2, 186, 14, c.color);
          }
          txt('SCORE  ' + this.score, W / 2, 214, 13, '#cdbcda');
          if (this.stateFrames > 24 && (REDUCED || Math.floor(t / 28) % 2))
            txt(c.finale && !Save.data.finished ? 'PRESS  A' : 'PRESS  A  TO GO BACK TO THE GARDEN', W / 2, 264, 15, '#f2e9f7');
        } else {
          txt('OUT OF LIVES', W / 2, 128, 28, '#ff3b6b');
          txt('NOBODY IS COUNTING.  (SCRATCHY IS COUNTING.)', W / 2, 162, 13, '#cdbcda');
          if (this.easy) txt('NEXT TRY IS A NOTCH EASIER', W / 2, 188, 13, '#ffd76b');
          if (this.stateFrames > 24 && (REDUCED || Math.floor(t / 28) % 2))
            txt('PRESS  A  TO TRY AGAIN', W / 2, 244, 16, '#ffd76b');
          txt('ESC or ▼ to walk away', W / 2, 268, 11, '#8a6ea8');
        }
      }
    }
    // CRT dressing: scanlines and a bezel in the maker's colour.
    g.fillStyle = 'rgba(0,0,0,.10)';
    for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
    g.strokeStyle = c.color; g.lineWidth = 4; g.strokeRect(2, 2, W - 4, H - 4);
    if (Perf.show) drawPerf();
    t++;
  }
};

const STARS = Array.from({ length: 46 }, () => ({ x: rnd(0, 640), y: rnd(30, 384), s: rnd(0.5, 2) }));

function drawIguana(x, y, fr){
  g.fillStyle = '#4caf50'; g.fillRect(x + 4, y + 4, 20, 10);
  g.fillRect(x + 19, y + 1, 9, 9);
  g.fillRect(x, y + 8, 6, 4);
  const l = (Math.floor(fr / 16) % 2) * 2;
  g.fillRect(x + 6, y + 14, 3, 2 + l); g.fillRect(x + 17, y + 14, 3, 4 - l);
  g.fillStyle = '#2e7d32';
  for (let i = 0; i < 3; i++) g.fillRect(x + 6 + i * 5, y + 2, 3, 2);
  g.fillStyle = '#fff'; g.fillRect(x + 23, y + 3, 3, 3);
  g.fillStyle = '#111'; g.fillRect(x + 24, y + 4, 1, 1);
}

GAMES.invaders = {
  title: 'FORM 7-B: CORN INVADERS', short: 'CORN INVADERS', maker: 'SCRATCHY',
  how: ['◀ ▶   MOVE', 'A / SPACE   THROW CORN', 'SEND ALL 47 IGUANAS HOME. SCRATCHY COUNTED.'],
  intro: [['SCRATCHY', 'Forty-seven iguanas. One of you. I have done the paperwork.']],
  win: [['SCRATCHY', 'Forty-seven of forty-seven. I am filing this under JOY.'],
        ['PEARL', 'There is no form for joy.'], ['SCRATCHY', 'There is now.']],
  lose: [['SCRATCHY', 'That is alright. The iguanas are also bad at this.'],
         ['SCRATCHY', 'Again. I will count slower.']],
  tip: ['SCRATCHY', 'An official tip. Hold the button down and never let go. The hay bales are on your side.'],

  init(o){
    this.o = o; this.px = W / 2; this.cool = 0; this.invuln = 0;
    this.shots = []; this.bombs = []; this.pops = []; this.inv = [];
    this.dir = 1; this.bombT = 90;
    const rows = o.micro ? [8] : [9, 9, 9, 10, 10];          // 9+9+9+10+10 = 47. He counted.
    rows.forEach((n, r) => {
      for (let i = 0; i < n; i++)
        this.inv.push({ x: 70 + (10 - n) * 22 + i * 44, y: 48 + r * 26, w: 28, h: 18, alive: true });
    });
    this.total = this.inv.length;
    this.bales = o.micro ? [] : [120, 296, 472].map(x => ({ x, y: H - 98, w: 48, h: 16, hp: 5 }));
  },

  update(inp){
    const o = this.o;
    if (inp.left) this.px -= 4.4;
    if (inp.right) this.px += 4.4;
    this.px = clamp(this.px, 20, W - 20);
    if (this.cool > 0) this.cool--;
    if (this.invuln > 0) this.invuln--;

    if (inp.jump && this.cool <= 0 && this.shots.length < 3){
      this.shots.push({ x: this.px, y: H - 62 });
      this.cool = 11; Sfx.play('shoot');
    }

    const live = this.inv.filter(v => v.alive);
    for (const s of this.shots){
      s.y -= 8.5;
      for (const v of live){
        if (v.alive && s.x > v.x - 3 && s.x < v.x + v.w + 3 && s.y > v.y - 4 && s.y < v.y + v.h){
          v.alive = false; s.y = -99;
          o.host.score += 10; Sfx.play('pop');
          this.pops.push({ x: v.x + 14, y: v.y + 9, life: 18 });
          break;
        }
      }
    }
    this.shots = this.shots.filter(s => s.y > 28);
    this.pops = this.pops.filter(p => --p.life > 0);

    const alive = this.inv.filter(v => v.alive);
    if (!alive.length){ o.host.win(); return; }

    const sp = (0.4 + (1 - alive.length / this.total) * 1.5) * (o.easy ? 0.7 : 1) * o.speed;
    let minX = 1e9, maxX = -1e9, maxY = 0;
    for (const v of alive){ v.x += this.dir * sp; minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x + v.w); maxY = Math.max(maxY, v.y + v.h); }
    if ((this.dir > 0 && maxX > W - 10) || (this.dir < 0 && minX < 10)){
      this.dir *= -1;
      for (const v of alive) v.y += 9;
    }

    if (!o.micro && --this.bombT <= 0){
      const v = alive[Math.floor(Math.random() * alive.length)];
      this.bombs.push({ x: v.x + 14, y: v.y + 18 });
      this.bombT = (o.easy ? 115 : 72) + rint(0, 30);
    }
    for (const b of this.bombs){
      b.y += 2.7;
      for (const bale of this.bales){
        if (bale.hp > 0 && b.x > bale.x && b.x < bale.x + bale.w && b.y > bale.y && b.y < bale.y + bale.h){
          bale.hp--; b.y = 999;
        }
      }
    }
    this.bombs = this.bombs.filter(b => b.y < H);

    if (this.invuln <= 0){
      const hit = this.bombs.some(b => Math.abs(b.x - this.px) < 13 && b.y > H - 62 && b.y < H - 34);
      const landed = maxY >= H - 72;
      if (hit || landed){
        this.bombs = []; this.invuln = 90;
        if (landed){                                    // shoo them back up rather than end the run
          const lift = Math.min(...alive.map(v => v.y)) - 48;
          for (const v of alive) v.y -= lift;
        }
        o.host.hurt(); return;
      }
    }
  },

  draw(){
    g.fillStyle = '#0b0a1f'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#dde8ff';
    STARS.forEach(s => { g.globalAlpha = REDUCED ? 0.5 : 0.3 + 0.4 * Math.abs(Math.sin(t / 40 + s.x)); g.fillRect(s.x, s.y, s.s, s.s); });
    g.globalAlpha = 1;
    g.fillStyle = '#1d1a3a'; g.fillRect(0, H - 34, W, 34);
    g.fillStyle = '#2c2856'; g.fillRect(0, H - 34, W, 3);

    this.inv.forEach(v => { if (v.alive) drawIguana(v.x, v.y, t + v.x); });
    this.bales.forEach(b => {
      if (b.hp <= 0) return;
      g.globalAlpha = 0.35 + b.hp * 0.13;
      g.fillStyle = '#c9a23a'; g.fillRect(b.x, b.y, b.w, b.h);
      g.fillStyle = '#8a6d1c'; g.fillRect(b.x, b.y + 5, b.w, 2); g.fillRect(b.x, b.y + 11, b.w, 2);
      g.globalAlpha = 1;
    });
    g.fillStyle = '#ffd76b';
    this.shots.forEach(s => { g.fillRect(s.x - 2, s.y, 4, 9); });
    g.fillStyle = '#c77dff';
    this.bombs.forEach(b => { g.fillRect(b.x - 2, b.y, 4, 8); g.fillRect(b.x - 3, b.y + 5, 6, 3); });
    this.pops.forEach(p => {
      g.globalAlpha = p.life / 18;
      txt('HOME', p.x, p.y - (18 - p.life), 10, '#9ad4b0');
      g.globalAlpha = 1;
    });
    if (this.invuln <= 0 || Math.floor(t / 5) % 2) drawChicken(this.px, H - 34, 1);
    const alive = this.inv.filter(v => v.alive).length;
    txt('SENT HOME  ' + (this.total - alive) + ' / ' + this.total, W / 2, 22, 11, '#cdbcda');
  }
};

GAMES.runner = {
  title: "PEARL'S GO GO GO GO", short: 'GO GO GO GO', maker: 'PEARL',

  lose: [['PEARL', 'You can jump TWICE. In the air. I allowed it.'], ['PEARL', 'Again again again!']],
  tip: ['PEARL', 'TIP! Jump EARLY! Then jump AGAIN in the air! And stay on the ground for the paper planes!'],
  GY: 318, PX: 120,

  init(o){
    this.o = o; this.alt = 0; this.vy = 0; this.jumps = 0; this.invuln = 0;
    this.dist = 0; this.goal = o.micro ? 2400 : (o.easy ? 8500 : 11500);
    this.obs = []; this.corn = []; this.nextAt = o.micro ? 620 : 900; this.sp = 4;
  },

  spawn(){
    const o = this.o, far = this.dist / this.goal, r = Math.random();
    const wx = this.nextAt;
    let ob;
    if (r < 0.34)      ob = { k:'crate', w:30, h:30, alt:0 };
    else if (r < 0.56) ob = { k:'stack', w:30, h:54, alt:0 };
    else if (r < 0.82 || o.easy || o.micro || far < 0.25) ob = { k:'iguana', w:30, h:20, alt:0, walk:1.1 };
    else               ob = { k:'plane', w:38, h:14, alt:54 };
    ob.wx = wx; ob.hit = false;
    this.obs.push(ob);
    if (ob.k !== 'plane') this.corn.push({ wx: wx + 15, alt: ob.h + 44, got: false });
    else this.corn.push({ wx: wx + 19, alt: 8, got: false });
    this.nextAt += rnd(300, 460) * (0.85 + this.sp / 12);
  },

  update(inp, pr){
    const o = this.o;
    this.sp = (4 + Math.min(2.4, this.dist / this.goal * 2.4)) * (o.easy ? 0.85 : 1) * o.speed;
    this.dist += this.sp;
    if (this.invuln > 0) this.invuln--;

    if (pr.jump || pr.up){
      if (this.alt === 0){ this.vy = 10.8; this.jumps = 1; Sfx.play('jump'); }
      else if (this.jumps < 2){ this.vy = 9.2; this.jumps = 2; Sfx.play('jump'); }
    }
    if (!(inp.jump || inp.up) && this.vy > 3.5) this.vy = 3.5;
    this.alt += this.vy; this.vy -= 0.58;
    if (this.alt <= 0){ this.alt = 0; this.vy = 0; this.jumps = 0; }

    while (this.nextAt < this.dist + W + 60 && this.nextAt < this.goal - 360) this.spawn();

    const me = { x: this.dist - 10, y: this.alt + 2, w: 20, h: 26 };
    for (const ob of this.obs){
      if (ob.walk) ob.wx -= ob.walk;
      if (ob.hit || this.invuln > 0) continue;
      if (overlap(me, { x: ob.wx + 3, y: ob.alt, w: ob.w - 6, h: ob.h - 3 })){
        ob.hit = true; this.invuln = 80;
        if (o.host.hurt()) return;
        if (o.micro) return;
      }
    }
    for (const c of this.corn){
      if (!c.got && Math.abs(c.wx - this.dist) < 20 && Math.abs(c.alt - (this.alt + 14)) < 24){
        c.got = true; o.host.score += 5; Sfx.play('pick');
      }
    }
    this.obs = this.obs.filter(ob => ob.wx > this.dist - 200);
    this.corn = this.corn.filter(c => c.wx > this.dist - 200);

    if (this.dist >= this.goal){ o.host.win(); return; }
  },

  sx(wx){ return wx - this.dist + this.PX; },

    g.fillStyle = 'rgba(26,11,46,.45)';
    for (let x = -40; x < W + 80; x += 8){
      const wx = x + this.dist * 0.25;

    const sign = this.sx(1500);                           // a promise, in writing
    if (!this.o.micro && sign > -160 && sign < W + 20){
      g.fillStyle = '#5a3a1c'; g.fillRect(sign + 66, GY - 60, 6, 60);

      }
    }
    const flag = this.sx(this.goal);
    if (flag < W + 40){
      g.fillStyle = '#f2e9f7'; g.fillRect(flag, GY - 120, 5, 120);
      for (let i = 0; i < 12; i++){

        g.fillRect(flag + 5 + (i % 4) * 10, GY - 120 + Math.floor(i / 4) * 10, 10, 10);
      }
    }

    this.corn.forEach(c => {
      if (c.got) return;
      const x = this.sx(c.wx), y = GY - c.alt;
      g.fillStyle = '#ffcc02'; g.fillRect(x - 4, y - 6, 8, 12);
      g.fillStyle = '#90e050'; g.fillRect(x - 1, y - 10, 5, 4);
    });
    this.obs.forEach(ob => {
      const x = this.sx(ob.wx), y = GY - ob.alt - ob.h;
      if (x < -60 || x > W + 60) return;
      g.globalAlpha = ob.hit ? 0.3 : 1;
      if (ob.k === 'crate' || ob.k === 'stack'){
        for (let yy = 0; yy < ob.h; yy += 27){
          g.fillStyle = '#b07a3c'; g.fillRect(x, y + yy, ob.w, 27);
          g.strokeStyle = '#6e4a1e'; g.lineWidth = 2; g.strokeRect(x + 1, y + yy + 1, ob.w - 2, 25);

        g.save(); g.translate(x + ob.w, y + 1); g.scale(-1, 1); drawIguana(0, 0, t); g.restore();
      } else {
        g.fillStyle = '#f2e9f7';
        g.beginPath(); g.moveTo(x, y + 7); g.lineTo(x + ob.w, y); g.lineTo(x + ob.w - 8, y + 14); g.closePath(); g.fill();
        g.fillStyle = '#cdbcda';
        g.beginPath(); g.moveTo(x, y + 7); g.lineTo(x + ob.w - 8, y + 14); g.lineTo(x + ob.w - 14, y + 8); g.closePath(); g.fill();

      }
      g.globalAlpha = 1;
    });

    if (this.invuln <= 0 || Math.floor(t / 5) % 2)
      Cast.draw('PEARL', this.PX, GY - this.alt, 1, false, 0.8, this.alt === 0);

    g.fillStyle = '#ff6688'; g.fillRect(202, 16, 236 * p, 6);
