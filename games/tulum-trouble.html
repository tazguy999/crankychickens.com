//  MINI JAGUAR
// ═══════════════════════════════════════════════
function updateMiniJag(){
  if(isScrolling||jagDead)return;
  // don't spawn in boss room or on title
  const bossIdx=screenIndex(9,7);
  const curIdx=screenIndex(screenCol,screenRow);
  if(curIdx===bossIdx){miniJag.active=false;return;}

  // countdown spawn cooldown
  if(miniJag.spawnCooldown>0){miniJag.spawnCooldown--;return;}

  // random spawn
  if(skillsFoundCount<1)return; // no mini jag until first skill found
  if(!miniJag.active&&Math.random()<MINI_SPAWN_CHANCE&&curIdx!==miniJag.lastScreen){
    const sc=currentScreen();
    // pick a random walkable edge entry point
    const sides=[
      {x:20,y:GH/2},{x:GW-52,y:GH/2},
      {x:GW/2,y:20},{x:GW/2,y:GH-52}
    ];
    const entry=sides[Math.floor(Math.random()*sides.length)];
    if(boxWalkable(sc.map,entry.x,entry.y)){
      miniJag.active=true;
      miniJag.x=entry.x; miniJag.y=entry.y;
      miniJag.hp=2; miniJag.st=0;
      miniJag.mode='chase';
      miniJag.timer=MINI_SCREEN_TIME;
      miniJag.lastScreen=curIdx;
      popup={text:'🐆 Mini Jaguar appeared!',timer:80};
    }
    return;
  }

  if(!miniJag.active)return;

  miniJag.timer--;
  // switch to flee mode after 4 seconds
  if(miniJag.timer<MINI_SCREEN_TIME-240) miniJag.mode='flee';
  // despawn when timer runs out or escapes off screen
  if(miniJag.timer<=0||miniJag.x<-40||miniJag.x>GW+40||miniJag.y<-40||miniJag.y>GH+40){
    miniJag.active=false;
    miniJag.spawnCooldown=600; // 10s before next spawn
    return;
  }
  if(miniJag.st>0){miniJag.st--;return;}

  const sc=currentScreen();
  const dx=player.x-miniJag.x, dy=player.y-miniJag.y;
  const dist=Math.hypot(dx,dy);

  if(miniJag.mode==='chase'){
    // chase player at moderate speed
    const spd=1.2;
    if(dist>0){
      const nx=miniJag.x+dx/dist*spd;
      const ny=miniJag.y+dy/dist*spd;
      if(boxWalkable(sc.map,nx,ny)){miniJag.x=nx;miniJag.y=ny;}
      else{miniJag.mode='flee';} // hit a wall — run away
    }
    // hit player
    if(player.inv<=0&&dist<28){
      player.hp--;player.inv=90;
      spawnP(player.x+16,player.y+16,'#ff3333',10);
      miniJag.mode='flee'; // run away after hit!
      popup={text:'🐆 Got ya! Hehe! 💨',timer:80};
    }
    // player pecks mini jag
    if(player.atk>10&&dist<40){
      miniJag.hp--;
      miniJag.st=30;
      spawnP(miniJag.x+12,miniJag.y+12,'#f4a261',10);
      miniJag.mode='flee';
      if(miniJag.hp<=0){
        miniJag.active=false;
        miniJag.spawnCooldown=900;
        score+=200;
        popup={text:'💥 Mini Jaguar defeated! +200!',timer:100};
      } else {
        popup={text:'🐆 Ow! Running away! 💨',timer:80};
      }
    }
  } else {
    // flee — run away from player, ignore walls when fleeing
    const spd=2.2;
    if(dist>0){
      miniJag.x-=dx/dist*spd;
      miniJag.y-=dy/dist*spd;
    }
  }
}

function drawHintArrow(){
  hintTimer++;
  if(cornCount>=4)return;
  const sc=currentScreen();
  const ss=getScreenState(screenCol,screenRow);
  let nearest=null,nearDist=Infinity;
  sc.corn.forEach((c,i)=>{
    if(ss.gotCorns.has(i))return;
    const d=Math.hypot(player.x+16-(c.x*TILE+8),player.y+16-(c.y*TILE+8));
    if(d<nearDist){nearDist=d;nearest={x:c.x*TILE+8,y:c.y*TILE+8};}
  });
  if(!nearest||nearDist<80)return;
  const angle=Math.atan2(nearest.y-player.y-16,nearest.x-player.x-16);
  const pulse=0.65+Math.sin(hintTimer*0.1)*0.35;
  ctx.save();ctx.translate(player.x+16,player.y+16);ctx.rotate(angle);
  ctx.globalAlpha=pulse;ctx.fillStyle='#ffcc02';
  ctx.beginPath();ctx.moveTo(32,0);ctx.lineTo(22,-8);ctx.lineTo(22,8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ff6b00';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();ctx.globalAlpha=1;
}

//  MAIN LOOP
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
//  TREETOP LAYER SYSTEM
// ═══════════════════════════════════════════════════════════════

let treeLayer = false;          // are we on the canopy?
let treeLayerFade = 0;          // 0=ground, 1=treetop (for transition)
let treeLayerDir = 0;           // 1=climbing up, -1=dropping down, 0=stable
const TREE_CLIMB_FRAMES = 30;   // transition length

// A tile is "canopy walkable" if the tile below (ground layer) is JUNGLE
function isBlockedByJungle(map, px, py){
  // Returns true if the blocking tile is specifically jungle (not wall/cliff)
  const check=(x,y)=>{ const t=tileAt(map,x,y); return t===T.JUNGLE; };
  return check(px+4,py+22)||check(px+28,py+22)||check(px+16,py+22);
}

function canopyWalkable(map, px, py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=20||ty>=15) return false;
  return map[ty][tx]===T.JUNGLE;
}

function canopyBoxWalkable(map, x, y){
  // Looser box — just check center and front corners
  const L=x+6, R=x+26, CY=y+20;
  return canopyWalkable(map,L,CY) && canopyWalkable(map,R,CY) && canopyWalkable(map,x+16,CY);
}

// Find climb-up spots on current screen — any JUNGLE tile adjacent to PATH/SAND
function findClimbSpots(sc){
  const map=sc.map;
  const spots=[];
  for(let ty=1;ty<14;ty++) for(let tx=1;tx<19;tx++){
    if(map[ty][tx]!==T.JUNGLE) continue;
    // Must have at least one walkable neighbor (so it's a jungle edge)
    const neighbors=[map[ty-1]?.[tx],map[ty+1]?.[tx],map[ty]?.[tx-1],map[ty]?.[tx+1]];
    const hasWalkableNeighbor=neighbors.some(t=>t===T.PATH||t===T.SAND||t===T.RF||t===T.FLOWER);
    if(hasWalkableNeighbor) spots.push({tx,ty,x:tx*TILE,y:ty*TILE});
  }
  return spots;
}

// Check if player is standing on a jungle-edge tile → show climb prompt
function checkTreeClimb(){
  if(isScrolling) return;
  const sc=currentScreen();
  const map=sc.map;
  const px=player.x+16, py=player.y+20;
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);

  if(!treeLayer){
    // Show hint if any adjacent tile is jungle
    let nearJungle=false;
    for(let dy2=-1;dy2<=1;dy2++) for(let dx2=-1;dx2<=1;dx2++){
      if(map[ty+dy2]?.[tx+dx2]===T.JUNGLE){nearJungle=true;break;}
    }
    player._nearClimb=nearJungle;
    // Climbing is triggered externally when movement is blocked by jungle
  } else {
    player._nearClimb=true;
    // On canopy — fall if center tile has no jungle below
    if(treeLayerDir===0 && !canopyWalkable(map,px,py)){
      startTreeDrop();
    }
  }
}

function startTreeClimb(){
  if(treeLayerDir!==0) return;
  treeLayerDir=treeLayer?-1:1;
}

function startTreeDrop(){
  if(treeLayerDir!==0) return;
  treeLayerDir=-1; // forced drop
  popup={text:'🍃 Lost your footing!', timer:80};
}

function updateTreeLayer(){
  if(treeLayerDir===0) return;
  treeLayerFade += treeLayerDir * (1/TREE_CLIMB_FRAMES);
  treeLayerFade = Math.max(0, Math.min(1, treeLayerFade));

  if(treeLayerDir===1 && treeLayerFade>=1){
    treeLayer=true; treeLayerDir=0;
    popup={text:'🌿 You\'re in the canopy! Walk to the edge to drop down.', timer:130};
  } else if(treeLayerDir===-1 && treeLayerFade<=0){
    treeLayer=false; treeLayerDir=0;
    popup={text:'🌱 Back on the ground.', timer:80};
  }
}

// Draw the treetop layer over the normal screen
function drawTreetopLayer(){
  if(treeLayerFade<=0) return;
  const sc=currentScreen();
  const map=sc.map;
  const alpha=treeLayerFade;

  ctx.save();

  // Sky tint — lighter, airier
  ctx.globalAlpha=alpha*0.55;
  ctx.fillStyle='#c8f0e0';
  ctx.fillRect(0,0,GW,GH);

  // Draw canopy tiles — leafy platforms over each JUNGLE tile
  ctx.globalAlpha=alpha;
  for(let ty=0;ty<15;ty++) for(let tx=0;tx<20;tx++){
    if(map[ty][tx]!==T.JUNGLE) continue;
    const sx=tx*TILE, sy=ty*TILE;

    // Base canopy fill — rich greens
    const shade=((tx+ty)%3);
    const greens=['#2d6a4f','#40916c','#52b788'];
    ctx.fillStyle=greens[shade];
    ctx.fillRect(sx,sy,TILE,TILE);

    // Leaf clusters — random but seeded by position
    const seed=(tx*7+ty*13)%8;
    ctx.fillStyle='#74c69d';
    ctx.beginPath();ctx.arc(sx+8+(seed%3)*6,sy+8+(seed%4)*5,6+seed%4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+20+(seed%4)*3,sy+18+(seed%3)*4,5+seed%3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#95d5b2';
    ctx.beginPath();ctx.arc(sx+14+seed%5,sy+12+seed%6,4,0,Math.PI*2);ctx.fill();

    // Animated sway on edges
    const swayEdge=!map[ty-1]||map[ty-1][tx]!==T.JUNGLE;
    if(swayEdge){
      const sway=Math.sin(frame*0.04+tx*0.5)*2;
      ctx.fillStyle='#b7e4c7';
      ctx.beginPath();ctx.arc(sx+16+sway,sy+2,5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+6+sway*0.5,sy+4,4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+26+sway*0.7,sy+4,4,0,Math.PI*2);ctx.fill();
    }
  }

  // Gaps between trees — dark void with distant ground hint
  for(let ty=0;ty<15;ty++) for(let tx=0;tx<20;tx++){
    if(map[ty][tx]===T.JUNGLE) continue;
    const sx=tx*TILE, sy=ty*TILE;
    ctx.fillStyle='rgba(0,20,0,0.82)';
    ctx.fillRect(sx,sy,TILE,TILE);
    // Faint ground below
    if(map[ty][tx]===T.PATH||map[ty][tx]===T.SAND){
      ctx.fillStyle='rgba(180,150,80,0.15)';
      ctx.fillRect(sx,sy,TILE,TILE);
    }
  }

  // Dappled light rays
  ctx.globalAlpha=alpha*0.08;
  ctx.fillStyle='#fffde7';
  for(let i=0;i<6;i++){
    const rx=(frame*0.3+i*110)%GW;
    ctx.beginPath();
    ctx.moveTo(rx,0); ctx.lineTo(rx+30,GH); ctx.lineTo(rx+40,GH); ctx.lineTo(rx+10,0);
    ctx.fill();
  }
  ctx.globalAlpha=alpha;

  // Climb down indicator at player position
  if(treeLayer && player._nearClimb){
    const pulse=0.6+Math.sin(frame*0.15)*0.4;
    ctx.globalAlpha=alpha*pulse;
    drawAutoBox('🌿 PECK to drop down', GW/2, GH-44,
      {font:'bold 12px Fredoka One', alpha:1, maxW:GW-40, bg:'rgba(0,40,0,0.8)', border:'#52b788'});
  }

  ctx.globalAlpha=1;
  ctx.restore();
}

// Draw the player on the canopy — slightly elevated, with shadow below
function drawTreetopPlayer(){
  if(!treeLayer && treeLayerFade<=0) return;
  if(treeLayerFade<=0) return;
  ctx.save();
  ctx.globalAlpha=treeLayerFade;

  // Shadow on canopy
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(player.x+16,player.y+30,14,5,0,0,Math.PI*2);ctx.fill();

  // Player drawn slightly higher (floating above canopy)
  const lift=6+Math.sin(frame*0.08)*2; // gentle float
  drawChicken(player.x, player.y-lift, player.dir, player.atk, frame);

  ctx.restore();
}

  { id:'cancun',    name:'Cancún Coast',    emoji:'🌊', desc:'Turquoise waters & hidden cenotes', unlocked:false, stub:true },
  { id:'merida',    name:'Mérida Ruins',    emoji:'🏛️', desc:'Ancient pyramid maze, new enemies', unlocked:false, stub:true },
  { id:'cozumel',   name:'Cozumel Island',  emoji:'🏝️', desc:'Coral reef adventure, underwater caves', unlocked:false, stub:true },
  { id:'tulum',     name:'Tulum (Current)', emoji:'🐔', desc:'You are here!', unlocked:true,  stub:false },
  { id:'howardsgrove', name:"Howards Grove, WI", emoji:'🧀', desc:'Peaceful village in Wisconsin — no enemies!', unlocked:true, stub:false },
];

let airportOpen   = false;   // is the airport UI showing
let airportTab    = 0;       // selected destination index

function checkAirportEntry(){
  if(isScrolling||inTownZone||battleMode) return;
  if(screenCol!==AIRPORT.worldCol||screenRow!==AIRPORT.worldRow) return;
  const ax=AIRPORT.tx*TILE+16, ay=AIRPORT.ty*TILE+16;
  const dist=Math.hypot(player.x+16-ax, player.y+16-ay);
  if(dist<80){
    const pulse=0.6+Math.sin(frame*0.12)*0.35;
    drawAutoBox('✈️ Enter Airport — PECK to open', GW/2, GH-40,
      {font:'bold 12px Fredoka One', alpha:pulse, maxW:GW-40, bg:'rgba(0,20,60,0.85)', border:'#48cae4'});
  }
  if(dist<36&&player.atk>10&&!airportOpen){
    openAirport();
  }
}

function openAirport(){
  airportOpen=true;
  airportTab=0;
  popup={text:'✈️ Welcome to Tulum International!', timer:100};
}

function closeAirport(){
  airportOpen=false;
}

function drawAirportBuilding(){
  if(screenCol!==AIRPORT.worldCol||screenRow!==AIRPORT.worldRow) return;
  if(isScrolling) return;
  const bx=AIRPORT.tx*TILE-32, by=AIRPORT.ty*TILE-48;
  const bw=96, bh=80;

  // Terminal building
  ctx.fillStyle='#e8f4f8';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill();
  ctx.strokeStyle='#48cae4'; ctx.lineWidth=2; ctx.stroke();

  // Roof stripe
  ctx.fillStyle='#0077b6';
  ctx.fillRect(bx,by,bw,12);

  // Windows
  ctx.fillStyle='#90e0ef';
  for(let i=0;i<3;i++) ctx.fillRect(bx+8+i*28,by+18,20,16);

  // Door
  ctx.fillStyle='#caf0f8';
  ctx.fillRect(bx+bw/2-10,by+bh-24,20,24);

  // Sign
  ctx.fillStyle='#0077b6'; ctx.font='bold 10px Fredoka One'; ctx.textAlign='center';
  ctx.fillText('✈️ AIRPORT',bx+bw/2,by-6);

  // Animated plane on runway
  const planeX=(frame*0.8)%(bw+40)-20;
  ctx.font='14px Arial'; ctx.fillText('✈️',bx+planeX,by+bh+10);

  // Runway markings
  ctx.fillStyle='#555'; ctx.fillRect(bx-10,by+bh+4,bw+20,8);
  ctx.fillStyle='#ffcc02';
  for(let i=0;i<5;i++) ctx.fillRect(bx+i*20,by+bh+6,12,4);

  ctx.textAlign='left';
}

function drawAirportUI(){
  if(!airportOpen) return;

  // Full screen overlay
  ctx.fillStyle='rgba(0,10,30,0.97)'; ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#003566';
  ctx.beginPath(); ctx.roundRect(12,12,GW-24,GH-24,14); ctx.fill();
  ctx.strokeStyle='#48cae4'; ctx.lineWidth=2; ctx.stroke();

  // Header — compact
  ctx.fillStyle='#fff'; ctx.font='bold 16px Fredoka One'; ctx.textAlign='center';
  ctx.fillText('✈️ Tulum International Airport',GW/2,38);
  ctx.fillStyle='#90e0ef'; ctx.font='10px Fredoka One';
  ctx.fillText('Select a destination',GW/2,52);

  // Divider
  ctx.strokeStyle='rgba(72,202,228,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(30,60); ctx.lineTo(GW-30,60); ctx.stroke();

  // Show only visible window of destinations (3 at a time)
  const cardH = 52;
  const startY = 68;
  const visCount = 3;
  const startIdx = Math.max(0, Math.min(airportTab - 1, FLIGHT_DESTINATIONS.length - visCount));

  FLIGHT_DESTINATIONS.forEach((dest,i)=>{
    const slot = i - startIdx;
    if(slot < 0 || slot >= visCount) return;
    const y = startY + slot * (cardH + 6);
    const selected = i === airportTab;

    // Card bg
    ctx.fillStyle = selected ? 'rgba(0,119,182,0.95)' : 'rgba(0,40,80,0.6)';
    ctx.beginPath(); ctx.roundRect(24,y,GW-48,cardH,8); ctx.fill();
    if(selected){ ctx.strokeStyle='#48cae4'; ctx.lineWidth=2; ctx.stroke(); }

    // Emoji
    ctx.font='22px Arial'; ctx.textAlign='left';
    ctx.fillText(dest.emoji, 36, y+34);

    // Name + desc
    ctx.fillStyle='#fff'; ctx.font='bold 13px Fredoka One';
    ctx.fillText(dest.name, 68, y+22);
    ctx.fillStyle='#90e0ef'; ctx.font='10px Fredoka One';
    ctx.fillText(dest.desc, 68, y+38);

    // Status
    ctx.textAlign='right';
    if(dest.id==='howardsgrove'&&!dest.stub){
      ctx.fillStyle='#4ade80'; ctx.font='bold 10px Fredoka One';
      ctx.fillText('🟢 UNLOCKED', GW-30, y+20);
    } else if(dest.unlocked && !dest.stub){
      ctx.fillStyle='#4ade80'; ctx.font='bold 10px Fredoka One';
      ctx.fillText('📍 HERE', GW-30, y+20);
    } else {
      ctx.fillStyle='rgba(250,204,21,0.7)'; ctx.font='bold 9px Fredoka One';
      ctx.fillText('🔒 SOON', GW-30, y+20);
    }
  });

  // Scroll indicators
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='14px Arial';
  if(startIdx > 0) ctx.fillText('▲', GW/2, startY - 8);
  if(startIdx + visCount < FLIGHT_DESTINATIONS.length) ctx.fillText('▼', GW/2, startY + visCount*(cardH+6) + 4);

  // Bottom hint — compact single line
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='10px Fredoka One';
  ctx.fillText('Joystick ▲▼  •  PECK to fly  •  TALK to close', GW/2, GH-20);

  // Close button
  closeBtnZones.airport = drawCloseBtn(GW-20, 20, '✕');
  ctx.textAlign='left';
}

function handleAirportPeck(){
  if(!airportOpen) return false;
  const dest=FLIGHT_DESTINATIONS[airportTab];
  if(dest.id==='howardsgrove'&&!dest.stub){
    airportOpen=false;
    startFlightAnimation('howardsgrove');
    // enterMap called after animation finishes
  } else if(dest.id==='tulum'){
    popup={text:"📍 You're already in Tulum!", timer:100};
  } else {
    popup={text:'🔒 '+dest.name+' — Coming in a future update!', timer:130};
  }
  return true;
}

function updateAirportNav(dx, dy){
  if(!airportOpen) return;
  if(dy < -0.3) airportTab=Math.max(0,airportTab-1);
  if(dy >  0.3) airportTab=Math.min(FLIGHT_DESTINATIONS.length-1,airportTab+1);
}



// ── MIESFELD'S MEAT MARKET ─────────────────────────────────────
// Home of the Grand Champion Bratwurst since 1941
let inMiesfelds = false;
let miesfeldsPlayerX = 0, miesfeldsPlayerY = 0;

// Miesfeld's has 3 rooms: main floor, smoking room (east), back stockroom (west)
const MF = {
  // Room indices: 0=main, 1=smoking room, 2=back stockroom
  room: 0,
  maps: [],
  names: ["Main Floor","🔥 Smoking Room","📦 Back Stockroom"],
  emojis: ["🥩","🔥","📦"],
};

(()=>{
  const mk=()=>Array.from({length:15},()=>Array(20).fill(T.PATH));
  const fr=(m,x,y,w,h,t)=>{for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++)if(m[r]&&m[r][c]!==undefined)m[r][c]=t;};

  // ── ROOM 0: Main Sales Floor ──────────────────────────────
  const main=mk();
  fr(main,0,0,20,1,T.WALL); fr(main,0,14,20,1,T.WALL);
  fr(main,0,0,1,15,T.WALL); fr(main,19,0,1,15,T.WALL);
  // Main meat counter across top
  fr(main,2,2,15,2,T.WALL);
  fr(main,8,2,4,2,T.PATH); // serving gap
  // Door to smoking room (east wall)
  fr(main,19,5,1,4,T.PATH);
  // Door to stockroom (west wall)
  fr(main,0,5,1,4,T.PATH);
  // Wine & cheese display cases (sides)
  fr(main,2,5,2,4,T.WALL); fr(main,16,5,2,4,T.WALL);
  // Deli tables in center
  fr(main,6,7,2,3,T.WALL); fr(main,12,7,2,3,T.WALL);
  // Checkout counter
  fr(main,8,12,4,2,T.WALL);
  // Exit south
  fr(main,8,13,4,2,T.PATH);
  // Decorations
  main[4][5]=T.FLOWER; main[4][14]=T.FLOWER;
  main[8][9]=T.FLOWER; main[8][10]=T.FLOWER;
  main[11][9]=T.FLOWER;
  MF.maps.push(main);

  // ── ROOM 1: Smoking Room ─────────────────────────────────
  const smoke=mk();
  fr(smoke,0,0,20,1,T.WALL); fr(smoke,0,14,20,1,T.WALL);
  fr(smoke,0,0,1,15,T.WALL); fr(smoke,19,0,1,15,T.WALL);
  // Door back west
  fr(smoke,0,5,1,4,T.PATH);
  // Smokers — big brick units along walls
  fr(smoke,2,2,4,4,T.WALL); fr(smoke,8,2,4,4,T.WALL); fr(smoke,14,2,4,4,T.WALL);
  fr(smoke,2,9,4,4,T.WALL); fr(smoke,14,9,4,4,T.WALL);
  // Hanging sausage rack center
  fr(smoke,8,7,4,2,T.WALL);
  // Smoke decoration
  smoke[1][3]=T.FLOWER; smoke[1][10]=T.FLOWER; smoke[1][16]=T.FLOWER;
  smoke[8][5]=T.FLOWER; smoke[8][12]=T.FLOWER;
  MF.maps.push(smoke);

  // ── ROOM 2: Back Stockroom ───────────────────────────────
  const stock=mk();
  fr(stock,0,0,20,1,T.WALL); fr(stock,0,14,20,1,T.WALL);
  fr(stock,0,0,1,15,T.WALL); fr(stock,19,0,1,15,T.WALL);
  // Door back east
  fr(stock,19,5,1,4,T.PATH);
  // Shelving units — rows of boxes
  fr(stock,2,2,3,10,T.WALL); fr(stock,7,2,3,10,T.WALL);
  fr(stock,12,2,3,10,T.WALL); fr(stock,17,2,3,10,T.WALL);
  // Corridor between shelves
  fr(stock,5,2,2,10,T.PATH); fr(stock,10,2,2,10,T.PATH); fr(stock,15,2,2,10,T.PATH);

function enterMiesfelds(){
  miesfeldsPlayerX=player.x; miesfeldsPlayerY=player.y;
  enterMap(MIESFELDS_INTERIOR);
}

function exitMiesfelds(){
  player.x=miesfeldsPlayerX; player.y=miesfeldsPlayerY-32;
  exitCurrentMap();
}

function updateMiesfeldsPlayer(){
  if(!inMiesfelds) return;
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;player.dir=1;}
  if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;player.dir=3;}
  if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;player.dir=0;}
  if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;player.dir=2;}
  if(joyActive){dx=joyDx;dy=joyDy;
    if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?3:1;
    else player.dir=dy>0?2:0;}
  const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}
  const BLOCKED=[T.WALL,T.JUNGLE,T.WATER,T.DEEP];
  const walkable=(px,py)=>{
    const tx=Math.floor(px/32),ty=Math.floor(py/32);
    if(tx<0||ty<0||tx>=20||ty>=15)return false;
    return !BLOCKED.includes(MF.maps[MF.room][ty][tx]);
  };
  const nx=player.x+dx*player.speed,ny=player.y+dy*player.speed;
  if(walkable(nx+4,player.y+20)&&walkable(nx+28,player.y+20))player.x=nx;
  if(walkable(player.x+4,ny+20)&&walkable(player.x+28,ny+20))player.y=ny;

  // Exit south door (main room only)
  if(MF.room===0&&player.y>13*32&&player.x>8*32&&player.x<12*32) exitMiesfelds();

  // East door → smoking room
  if(MF.room===0&&player.x>19*32-8&&player.y>5*32&&player.y<9*32){
    MF.room=1; player.x=2*32; player.y=7*32; popup={text:'🔥 The Smoking Room — smell that? Award-winning brats being smoked!',timer:120};
  }
  // West door → stockroom
  if(MF.room===0&&player.x<1*32+8&&player.y>5*32&&player.y<9*32){
    MF.room=2; player.x=17*32; player.y=7*32; popup={text:'📦 The Back Stockroom — 400+ meat products! Is that... secret spice mix?',timer:120};
  }
  // Return from smoking room
  if(MF.room===1&&player.x<1*32+8&&player.y>5*32&&player.y<9*32){
    MF.room=0; player.x=17*32; player.y=7*32;
  }
  // Return from stockroom
  if(MF.room===2&&player.x>19*32-8&&player.y>5*32&&player.y<9*32){
    MF.room=0; player.x=2*32; player.y=7*32;
  }

  // Secret corn in stockroom!
  if(MF.room===2&&!TOWN_TOOLS_FOUND.has('mf_corn1')&&Math.hypot(player.x+16-9*32-16,player.y+16-7*32-16)<40){
    TOWN_TOOLS_FOUND.add('mf_corn1'); cornCount+=3; score+=30;
    spawnP(9*32+16,7*32+16,'#ffcc02',10);
    popup={text:"🌽🌽🌽 Found Miesfeld's secret corn stash! +3 corn!",timer:150};
  }

  // Check butcher proximity for shop
  const butcherX=9*32+16, butcherY=3*32+16;
  const dist=MF.room===0?Math.hypot(player.x+16-butcherX,player.y+16-butcherY):999;
  player._nearMiesfelds = dist < 100;

  // PECK to buy brat
  if(player.atk>0)player.atk--;if(player.inv>0)player.inv--;
  const atk=keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk;
  if(atk&&player.atk<=0){
    if(player._nearMiesfelds){
      buyBrat();
      player.atk=18;
    } else {
      player.atk=18;
      spawnP(player.x+16,player.y+16,'#ffcc02',8);
    }
  }
  touchAtk=false;touchTalk=false;
}

let bratCooldown=0;
function buyBrat(){
  if(bratCooldown>0){popup={text:'🌭 Brat still cookin! ('+Math.ceil(bratCooldown/60)+'s)',timer:80};return;}
  if(cornCount<5){popup={text:"🥩 Chuck Jr: That'll be 5 corn, eh! You only got "+cornCount+"!",timer:120};return;}
  cornCount-=5;
  player.hp=Math.min(player.maxHp,player.hp+2);
  bratCooldown=300;
  score+=50;
  spawnP(player.x+16,player.y+16,'#ff9f1c',14);
  popup={text:"🌭 GRAND CHAMPION BRAT! +2 HP restored! You betcha!",timer:180};
}

function drawMiesfelds(){
  if(!inMiesfelds)return;
  // Floor
  ctx.fillStyle='#d7ccc8';ctx.fillRect(0,0,GW,GH);
  for(let ty=0;ty<15;ty++)for(let tx=0;tx<20;tx++){
    const t=MF.maps[MF.room][ty][tx];
    const sx=tx*32,sy=ty*32;
    if(t===T.PATH){
      // Wood plank floor
      ctx.fillStyle=(tx+ty)%2===0?'#bcaaa4':'#a1887f';
      ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(0,0,0,0.08)';
      ctx.fillRect(sx,sy+15,32,2);
    } else if(t===T.WALL){
      // Glass display case / wall
      ctx.fillStyle='#5d4037';ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(144,202,249,0.3)';ctx.fillRect(sx+2,sy+2,28,28);
      ctx.strokeStyle='#8d6e63';ctx.lineWidth=1;ctx.strokeRect(sx,sy,32,32);
    } else if(t===T.FLOWER){
      ctx.fillStyle='#a1887f';ctx.fillRect(sx,sy,32,32);
      ctx.font='18px Arial';ctx.textAlign='center';
      ctx.fillText('🥩',sx+16,sy+22);ctx.textAlign='left';
    } else if(t===T.RF){
      ctx.fillStyle='#3e2723';ctx.fillRect(sx,sy,32,32);
    }
  }

  // Butcher behind counter (main room only)
  if(MF.room===0){
    ctx.fillStyle='#ef9a9a';ctx.beginPath();ctx.arc(9*32+16,3*32+16,12,0,Math.PI*2);ctx.fill();
    ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('👨‍🍳',9*32+16,3*32+22);
    ctx.fillStyle='#fff';ctx.font='bold 9px Fredoka One';ctx.fillText('Chuck Jr.',9*32+16,3*32+36);
  }

  // Butcher chat / shop hint
  const butcherX=9*32+16, butcherY=3*32+16;
  const dist=Math.hypot(player.x+16-butcherX,player.y+16-butcherY);
  if(dist<140){
    const pulse=0.6+Math.sin(frame*0.12)*0.35;
    const msg=bratCooldown>0?'🌭 Brat cookin... ('+Math.ceil(bratCooldown/60)+'s)':
              cornCount>=5?'🌭 PECK: Grand Champion Brat — 5🌽':'🌭 Brats are 5🌽 — collect more corn!';
    drawAutoBox(msg,GW/2,GH-80,{font:'bold 12px Fredoka One',alpha:pulse,maxW:GW-40,bg:'rgba(60,20,10,0.9)',border:'#ff8f00'});
  }
  if(bratCooldown>0) bratCooldown--;

  // Room-specific decorations
  ctx.font='20px Arial';ctx.textAlign='center';
  if(MF.room===0){
    // Main floor — products everywhere
    ctx.fillText('🌭',3*32+16,5*32);ctx.fillText('🧀',4*32+16,6*32);
    ctx.fillText('🍷',16*32+16,5*32);ctx.fillText('🥩',15*32+16,6*32);
    ctx.fillText('🌭',10*32+16,6*32);ctx.fillText('🌭',11*32+16,9*32);
    ctx.fillText('🥓',7*32+16,8*32+8);ctx.fillText('🥓',13*32+16,8*32+8);
    // Door arrows
    ctx.font='14px Fredoka One';ctx.fillStyle='#ffcc02';
    ctx.fillText('▶ Smoking',17*32,7*32);
    ctx.fillText('◀ Stock',1*32+4,7*32);
  } else if(MF.room===1){
    // Smoking room — smokers, hanging meats, awards
    const smokeY=2*32+8;
    for(let i=0;i<3;i++){
      const smx=[3,10,16][i]*32;
      // Smoke wisps
      for(let j=0;j<3;j++){
        const sy2=smokeY-j*12+Math.sin(frame*0.04+i+j)*4;
        ctx.fillStyle=`rgba(180,180,180,${0.3-j*0.08})`;
        ctx.beginPath();ctx.arc(smx+16,sy2,6+j*3,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.font='20px Arial';
    ctx.fillText('🌭',3*32+16,3*32);ctx.fillText('🌭',10*32+16,3*32);ctx.fillText('🌭',16*32+16,3*32);
    ctx.fillText('🥩',3*32+16,10*32);ctx.fillText('🥩',16*32+16,10*32);
    // Hanging sausages from center rack
    for(let i=0;i<4;i++){
      ctx.fillText('🌭',9*32+16+i*10,8*32+Math.sin(frame*0.05+i)*3);
    }
    // Award ribbon on wall
    ctx.font='14px Fredoka One';ctx.fillStyle='#ffd700';
    ctx.fillText('🥇 Grand Champion',10*32,13*32);
    ctx.font='10px Fredoka One';ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText('◀ Back to Main',1*32,7*32+4);
  } else if(MF.room===2){
    // Stockroom — boxes on shelves
    ctx.font='16px Arial';
    const shelves=[2,7,12,17];
    shelves.forEach(sx2=>{
      for(let row=0;row<4;row++){
        ctx.fillText('📦',sx2*32+8,(3+row*2)*32+8);
        ctx.fillText(row%2===0?'🥩':'🌭',sx2*32+8,(4+row*2)*32);
      }
    });
    // Secret corn hint
    if(!TOWN_TOOLS_FOUND.has('mf_corn1')){
      const glow=0.4+Math.sin(frame*0.1)*0.3;
      ctx.fillStyle=`rgba(255,204,2,${glow})`;
      ctx.beginPath();ctx.arc(9*32+16,7*32+16,20,0,Math.PI*2);ctx.fill();
      ctx.font='20px Arial';ctx.fillText('🌽',9*32+8,7*32+22);
    }
    ctx.font='14px Fredoka One';ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText('Back to Main ▶',14*32,7*32+4);
  }

  // Store sign at top
  ctx.fillStyle='rgba(60,20,0,0.95)';ctx.fillRect(0,0,GW,32);
  ctx.fillStyle='#ff8f00';ctx.font='bold 14px Fredoka One';ctx.textAlign='center';
  ctx.fillText("🥩 Miesfeld's — "+MF.emojis[MF.room]+' '+MF.names[MF.room],GW/2,21);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px Fredoka One';
  ctx.textAlign='right';ctx.fillText('🌽'+cornCount,GW-8,21);

  // Exit hint
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px Fredoka One';ctx.textAlign='center';
  ctx.fillText('▼ Walk south to exit',GW/2,GH-8);

  // Player
  ctx.textAlign='left';
  if(player.inv<=0||frame%6<3)drawChicken(player.x,player.y,player.dir,player.atk,frame);
}

function drawDog(x, y, color, breed, frame2, scale){
  scale = scale||1;
  const f = frame2||frame;
  const bob = Math.sin(f*0.1)*2*scale;
  const tailWag = Math.sin(f*0.18)*22;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0,22,12,4,0,0,Math.PI*2); ctx.fill();

  // Tail
  ctx.save();
  ctx.translate(0,14+bob);
  ctx.strokeStyle=color; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-2,6);
  ctx.quadraticCurveTo(tailWag*0.6+14,0, tailWag+(-8), -14);
  ctx.stroke();
  ctx.restore();

  // Body
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0,14+bob,10,8,0,0,Math.PI*2); ctx.fill();

  // Legs (4 little stubs)
  ctx.fillStyle=color;
  if(breed==='Corgi'){
    // Very short stubby legs
    ctx.fillRect(-9,19+bob,5,6); ctx.fillRect(-3,19+bob,5,7);
    ctx.fillRect(3,19+bob,5,7);  ctx.fillRect(7,19+bob,5,6);
  } else {
    ctx.fillRect(-9,18+bob,5,8); ctx.fillRect(-3,18+bob,5,9);
    ctx.fillRect(3,18+bob,5,9);  ctx.fillRect(7,18+bob,5,8);
  }

  // Neck
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(-1,6+bob,5,4,0,0,Math.PI*2); ctx.fill();

  // Head
  ctx.beginPath(); ctx.ellipse(0,0+bob,8,7,0,0,Math.PI*2); ctx.fill();

  // Ears by breed
  if(breed==='Corgi'){
    // Big pointy upright ears
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.moveTo(-7,0+bob); ctx.lineTo(-12,-12+bob); ctx.lineTo(-2,-4+bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7,0+bob);  ctx.lineTo(12,-12+bob);  ctx.lineTo(2,-4+bob);  ctx.closePath(); ctx.fill();
    // Inner ear pink
    ctx.fillStyle='#ffccbc';
    ctx.beginPath(); ctx.moveTo(-7,0+bob); ctx.lineTo(-11,-10+bob); ctx.lineTo(-3,-4+bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7,0+bob);  ctx.lineTo(11,-10+bob);  ctx.lineTo(3,-4+bob);  ctx.closePath(); ctx.fill();
  } else if(breed==='Labradoodle'){
    // Fluffy curly ears + curly head fur
    ctx.fillStyle=color;
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*9, bob+Math.sin(a)*7, 4,0,Math.PI*2); ctx.fill();
    }
    // Floppy curly ears
    ctx.beginPath(); ctx.ellipse(-10,3+bob,5,8,0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10,3+bob,5,8,-0.4,0,Math.PI*2); ctx.fill();
  } else if(breed==='Cattle Dog'){
    // Semi-erect ears
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.moveTo(-6,-2+bob); ctx.lineTo(-11,-11+bob); ctx.lineTo(-2,-2+bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-2+bob);  ctx.lineTo(11,-11+bob);  ctx.lineTo(2,-2+bob);  ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffccbc';
    ctx.beginPath(); ctx.moveTo(-6,-2+bob); ctx.lineTo(-10,-9+bob);  ctx.lineTo(-3,-2+bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-2+bob);  ctx.lineTo(10,-9+bob);   ctx.lineTo(3,-2+bob);  ctx.closePath(); ctx.fill();
  } else {
    // Generic floppy ears
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.ellipse(-9,2+bob,4,7,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,2+bob,4,7,-0.3,0,Math.PI*2); ctx.fill();
  }

  // Muzzle
  ctx.fillStyle=lighten(color,30);
  ctx.beginPath(); ctx.ellipse(0,4+bob,4,3,0,0,Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(-3,-2+bob,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-2+bob,2,0,Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-2,-3+bob,0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-3+bob,0.8,0,Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.ellipse(0,3+bob,2.5,1.8,0,0,Math.PI*2); ctx.fill();

  // Tongue (sometimes)
  if(Math.sin(f*0.06)>0.1){
    ctx.fillStyle='#ef9a9a';
    ctx.beginPath(); ctx.ellipse(0,7+bob,2.5,3.5,0,0,Math.PI*2); ctx.fill();
    // Tongue split
    ctx.strokeStyle='#e57373'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(0,6+bob); ctx.lineTo(0,10+bob); ctx.stroke();
  }

  ctx.restore();
}

function drawCat(x, y, color, frame2, scale){
  scale = scale||1;
  const f = frame2||frame;
  const bob = Math.sin(f*0.07)*1.5*scale;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(0,22,10,3,0,0,Math.PI*2); ctx.fill();

  // Tail — elegant curve
  const tc = Math.sin(f*0.06)*15;
  ctx.strokeStyle=color; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(2,16);
  ctx.bezierCurveTo(16,10, 20+tc,-4, 10+tc,-14);
  ctx.stroke();

  // Body — more oval than dog
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0,13+bob,8,9,0,0,Math.PI*2); ctx.fill();

  // Legs
  ctx.fillStyle=color;
  ctx.fillRect(-7,19+bob,4,7); ctx.fillRect(-2,19+bob,4,8);
  ctx.fillRect(3,19+bob,4,8);  ctx.fillRect(6,19+bob,4,7);
  // Paws
  ctx.fillStyle=lighten(color,20);
  ctx.beginPath(); ctx.ellipse(-5,26+bob,3,2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,27+bob,3,2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5,27+bob,3,2,0,0,Math.PI*2); ctx.fill();

  // Neck
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0,4+bob,5,4,0,0,Math.PI*2); ctx.fill();

  // Head — rounder than dog
  ctx.beginPath(); ctx.arc(0,-1+bob,8,0,Math.PI*2); ctx.fill();

  // Pointy ears!
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(-7,-5+bob); ctx.lineTo(-11,-16+bob); ctx.lineTo(-2,-6+bob); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7,-5+bob);  ctx.lineTo(11,-16+bob);  ctx.lineTo(2,-6+bob);  ctx.closePath(); ctx.fill();
  // Inner ear
  ctx.fillStyle='#ffb3c6';
  ctx.beginPath(); ctx.moveTo(-7,-5+bob); ctx.lineTo(-10,-13+bob); ctx.lineTo(-3,-5+bob); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7,-5+bob);  ctx.lineTo(10,-13+bob);  ctx.lineTo(3,-5+bob);  ctx.closePath(); ctx.fill();

  // Muzzle (two bumps)
  ctx.fillStyle=lighten(color,25);
  ctx.beginPath(); ctx.ellipse(-2,4+bob,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(2,4+bob,3,2.5,0,0,Math.PI*2); ctx.fill();

  // Eyes — cat eyes (slitted)
  ctx.fillStyle='#2e7d32';
  ctx.beginPath(); ctx.ellipse(-3,-1+bob,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-1+bob,3,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(-3,-1+bob,1,2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-1+bob,1,2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(-2,-2+bob,0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-2+bob,0.8,0,Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle='#f48fb1';
  ctx.beginPath(); ctx.moveTo(0,3+bob); ctx.lineTo(-1.5,1.5+bob); ctx.lineTo(1.5,1.5+bob); ctx.closePath(); ctx.fill();

  // Whiskers
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=0.8;
  for(let side=-1;side<=1;side+=2){
    for(let w=0;w<3;w++){
      ctx.beginPath();
      ctx.moveTo(side*2,3+bob+w*2-2);
      ctx.lineTo(side*14,2+bob+w*2.5-3);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function lighten(hex, amt){
  // Simple lighten — parse hex, add amt to each channel
  try {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const nr=Math.min(255,r+amt), ng=Math.min(255,g+amt), nb=Math.min(255,b+amt);
    return '#'+[nr,ng,nb].map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e){ return hex; }
}

function adoptDog(dogId){
  if(dogPack.length>=MAX_PACK_SIZE){
    popup={text:`Pack is full! Max ${MAX_PACK_SIZE} dogs. 🐕🐕🐕🐕🐕`,timer:120};
    return false;
  }
  if(dogPack.find(d=>d.id===dogId)){
    popup={text:'Already in your pack!',timer:80};
    return false;
  }
  const dog = ADOPTABLE_DOGS.find(d=>d.id===dogId);
  if(!dog) return false;
  const adopted = {...dog,
    px: player.x + (dogPack.length-2)*20,
    py: player.y + 30,
    followOffset: dogPack.length,
    _bobPhase: Math.random()*Math.PI*2,
    _swimTimer: 0,
    _isSwimming: false,
    _activity: 'follow', // follow, swim, play, zoomies
    _activityTimer: 0,
  };
  dogPack.push(adopted);
  score += 100;
  popup={text:`🐾 ${dog.name} joined your pack! (${dogPack.length}/${MAX_PACK_SIZE}) "${dog.chat[0]}"`,timer:220};
  return true;
}

function releaseDog(dogId){
  dogPack = dogPack.filter(d=>d.id!==dogId);
  popup={text:`🐾 ${dogId} returned to Miesfeld's — see you next time!`,timer:120};
}

function updateDogPack(){
  if(!activeMap||activeMap!==MIESFELDS_INTERIOR) return;
  dogPack.forEach((dog,i)=>{
    dog._activityTimer--;
    // Check if in a park/pool zone
    const sc = MIESFELDS_INTERIOR;
    const inPark = MF_DOG_PARKS.find(p=>p.col===sc.col&&p.row===sc.row);

    if(inPark && dog._activityTimer<=0){
      // Do a park activity
      if(inPark.type==='pool'){
        dog._isSwimming = true;
        dog._activity = 'swim';
        dog._activityTimer = 120 + Math.random()*180;
      } else {
        dog._activity = Math.random()<0.4?'zoomies':'play';
        dog._activityTimer = 90 + Math.random()*120;
        dog._isSwimming = false;
      }
    } else if(!inPark){
      dog._isSwimming = false;
      dog._activity = 'follow';
    }

    // Move dog
    if(dog._activity==='follow'){
      // Follow player in a staggered line
      const targetX = player.x - 20*(i+1)*Math.cos(player.dir===3?0:player.dir===1?Math.PI:player.dir===0?Math.PI/2:Math.PI*1.5);
      const targetY = player.y + 20*(i+1);
      dog.px += (targetX - dog.px) * 0.12;
      dog.py += (targetY - dog.py) * 0.12;
    } else if(dog._activity==='zoomies'){
      const angle = (frame*0.08 + i*1.2);
      dog.px = player.x + Math.cos(angle)*60;
      dog.py = player.y + Math.sin(angle)*40;
    } else if(dog._activity==='swim'||dog._activity==='play'){
      // Stay near player but wander
      dog.px += (Math.random()-0.5)*3;
      dog.py += (Math.random()-0.5)*3;
    }
  });
}

function drawDogPack(){
  if(!activeMap||activeMap!==MIESFELDS_INTERIOR) return;
  dogPack.forEach((dog,i)=>{
    const bob = Math.sin(frame*0.1+dog._bobPhase)*(dog._isSwimming?4:2);
    const dx = dog.px, dy = dog.py;

    // Draw proper dog shape
    drawDog(dx+14, dy+14, dog.color, dog.breed, frame+i*20, 0.85);

    // Swimming ripples
    if(dog._isSwimming){
      ctx.strokeStyle='rgba(100,181,246,0.5)'; ctx.lineWidth=1;
      for(let r=1;r<=2;r++){
        ctx.beginPath(); ctx.arc(dx+14,dy+20,8*r+Math.sin(frame*0.05)*3,0,Math.PI*2); ctx.stroke();
      }
    }

    // Activity label
    if(dog._activity!=='follow'){
      const labels={swim:'🏊',zoomies:'💨',play:'🎾'};
      ctx.font='12px Arial'; ctx.textAlign='center';
      ctx.fillText(labels[dog._activity]||'',dx+14,dy-8);
    }

    // Name tag
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(dx-4,dy+32,36,12,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 7px Fredoka One'; ctx.textAlign='center';
    ctx.fillText(dog.name,dx+14,dy+42);
    ctx.textAlign='left';
  });
}

function drawDogParkZone(){
  if(!activeMap||activeMap!==MIESFELDS_INTERIOR) return;
  const sc = MIESFELDS_INTERIOR;
  const park = MF_DOG_PARKS.find(p=>p.col===sc.col&&p.row===sc.row);
  if(!park) return;

  // Zone banner
  const isPool = park.type==='pool';
  const pulse = 0.6+Math.sin(frame*0.08)*0.3;
  ctx.globalAlpha=pulse;
  ctx.fillStyle=isPool?'rgba(0,100,200,0.85)':'rgba(0,120,60,0.85)';
  ctx.beginPath(); ctx.roundRect(GW/2-110,GH-120,220,36,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 13px Fredoka One'; ctx.textAlign='center';
  ctx.fillText((isPool?'🏊 ':'🌿 ')+park.name+' — dogs play here!',GW/2,GH-97);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

function drawPackHUD(){
  if(!activeMap||activeMap!==MIESFELDS_INTERIOR) return;
  if(dogPack.length===0) return;
  // Mini pack display bottom left
  const bx=16, by=GH-60;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath(); ctx.roundRect(bx-4,by-4,dogPack.length*26+8,40,8); ctx.fill();
  dogPack.forEach((dog,i)=>{
    ctx.fillStyle=dog.color;
    ctx.beginPath(); ctx.arc(bx+i*26+10,by+16,9,0,Math.PI*2); ctx.fill();
    ctx.font='10px Arial'; ctx.textAlign='center';
    ctx.fillText(dog.emoji,bx+i*26+10,by+20);
  });
  ctx.fillStyle='#ffcc02'; ctx.font='bold 8px Fredoka One'; ctx.textAlign='left';
  ctx.fillText(`Pack: ${dogPack.length}/${MAX_PACK_SIZE}`,bx,by+36);
}

//  GAME MAP SYSTEM — shared base class for all destinations
//  Each map: screens, NPCs, music, scroll, player update, draw
// ═══════════════════════════════════════════════════════════════

class GameMap {
  constructor(cfg){
    this.id          = cfg.id;           // 'tulum', 'howards_grove', etc.
    this.name        = cfg.name;
    this.emoji       = cfg.emoji;
    this.cols        = cfg.cols;
    this.rows        = cfg.rows;
    this.screens     = cfg.screens;      // flat array, col + row*cols
    this.npcs        = cfg.npcs   || [];
    this.palette     = cfg.palette|| {};
    this.entryCol    = cfg.entryCol;
    this.entryRow    = cfg.entryRow;
    this.entryPx     = cfg.entryPx;
    this.entryPy     = cfg.entryPy;
    this.arriveMsg   = cfg.arriveMsg;
    this.exitMsg     = cfg.exitMsg;
    this.exitSouth   = cfg.exitSouth !== false; // walk south off last row to leave
    this.hasEnemies  = cfg.hasEnemies || false;
    // Runtime state
    this.col = this.entryCol;
    this.row = this.entryRow;
    this.scrolling   = false;
    this.nextCol     = 0; this.nextRow = 0;
    this.scrollOffX  = 0; this.scrollOffY = 0;
    this.scrollDirX  = 0; this.scrollDirY = 0;
    this.scrollProgress = 0;
    this.prevWorldCol= 0; this.prevWorldRow= 0;
  }

  // ── Accessors ──────────────────────────────────────────────
  currentScreen(){ return this.screens[this.col + this.row*this.cols]; }
  screenAt(c,r)  { return this.screens[c + r*this.cols]; }

  // ── Enter / Exit ──────────────────────────────────────────
  enter(fromWorldCol, fromWorldRow){
    this.prevWorldCol = fromWorldCol;
    this.prevWorldRow = fromWorldRow;
    this._entryPlayerX = player.x;
    this._entryPlayerY = player.y;
    this.col = this.entryCol;
    this.row = this.entryRow;
    this.scrolling = false;
    player.x = this.entryPx;
    player.y = this.entryPy;
    player.dir = 2;
    setTimeout(()=>{ popup={text: this.emoji+' '+this.arriveMsg, timer:180}; }, 300);
  }

  exit(){
    screenCol = this.prevWorldCol;
    screenRow = this.prevWorldRow;
    player.x  = 320; player.y = 240;
    popup = {text: this.emoji+' '+this.exitMsg, timer:120};
  }

  // ── Scroll ─────────────────────────────────────────────────
  startScroll(dx, dy){
    if(this.scrolling) return;
    this.nextCol = this.col + dx;
    this.nextRow = this.row + dy;
    this.scrollDirX = dx; this.scrollDirY = dy;
    this.scrollProgress = 0;
    this.scrolling = true;
  }

  updateScroll(){
    if(!this.scrolling) return;
    this.scrollProgress++;
    const t = this.scrollProgress / MAP_SCROLL_FRAMES;
    this.scrollOffX = -this.scrollDirX * GW * t;
    this.scrollOffY = -this.scrollDirY * GH * t;
    if(this.scrollProgress >= MAP_SCROLL_FRAMES){
      this.scrolling = false;
      this.col = this.nextCol;
      this.row = this.nextRow;
      this.scrollOffX = 0; this.scrollOffY = 0;
      if(this.scrollDirX > 0) player.x = 8;
      if(this.scrollDirX < 0) player.x = GW - 48;
      if(this.scrollDirY > 0) player.y = 32;
      if(this.scrollDirY < 0) player.y = GH - 48;
    }
  }

  // ── Player Update ─────────────────────────────────────────
  updatePlayer(){
    if(this.scrolling) return;
    const sc = this.currentScreen();
    if(!sc) return;

    let dx=0, dy=0;
    if(keys['ArrowLeft'] ||keys['a']||keys['A']){dx=-1;player.dir=1;}
    if(keys['ArrowRight']||keys['d']||keys['D']){dx= 1;player.dir=3;}
    if(keys['ArrowUp']   ||keys['w']||keys['W']){dy=-1;player.dir=0;}
    if(keys['ArrowDown'] ||keys['s']||keys['S']){dy= 1;player.dir=2;}
    if(joyActive){
      dx=joyDx; dy=joyDy;
      if(Math.abs(dx)>Math.abs(dy)) player.dir=dx>0?3:1;
      else player.dir=dy>0?2:0;
    }
    const len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;}

    const _preX=player.x, _preY=player.y;
    const nx=player.x+dx*player.speed;
    const ny=player.y+dy*player.speed;
    if(this.walkable(sc.map,nx,player.y)) player.x=nx;
    if(this.walkable(sc.map,player.x,ny)) player.y=ny;

    // Swimming — only in designated pool zones
    const inPoolZone = MF_DOG_PARKS && MF_DOG_PARKS.find(p=>p.col===this.col&&p.row===this.row&&p.type==='pool');
    const onWater = inPoolZone && sc.map[Math.floor((player.y+22)/TILE)]?.[Math.floor((player.x+16)/TILE)]===T.WATER;
    player._onWater = onWater;
    if(onWater){
      player.x -= (player.x-_preX)*0.45;
      player.y -= (player.y-_preY)*0.45;
      player._swimBob = Math.sin(frame*0.15)*3;
      if(frame%18===0) spawnP(player.x+16,player.y+28,'#90e0ef',3);
    } else {
      player._swimBob = 0;
    }

    // Screen edge scroll
    if(player.x< 4 &&this.col>0)            this.startScroll(-1,0);
    else if(player.x>GW-36&&this.col<this.cols-1) this.startScroll(1,0);
    else if(player.y< 4 &&this.row>0)            this.startScroll(0,-1);
    else if(player.y>GH-36&&this.row<this.rows-1) this.startScroll(0,1);

    // Exit south off last row
    if(this.exitSouth && player.y>GH-20 && this.row===this.rows-1) this.exit();

    // Collect corn
    sc.corn&&sc.corn.forEach((corn,i)=>{
      const key=`${this.id}_${this.col}_${this.row}_${i}`;
      if(TOWN_TOOLS_FOUND.has(key)) return;
      if(Math.hypot(player.x+16-corn.x*TILE-8, player.y+16-corn.y*TILE-8)<32){
        TOWN_TOOLS_FOUND.add(key); cornCount++; score+=10;
        spawnP(corn.x*TILE+8,corn.y*TILE+8,'#ffcc02',6);
      }
    });

    // Check airport/Miesfeld's BEFORE clearing touchAtk
    if(activeMap!==MIESFELDS_INTERIOR) this.checkMiesfeldsEntry();
    // Basic peck — airport takes priority over NPC talk
    if(player.atk>0) player.atk--; if(player.inv>0) player.inv--;
    const atk=keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk;
    if(atk){
      // Close active map dialogue
      if(this._dlg){ this._dlg=null; touchAtk=false; touchTalk=false; }
      // Airport check takes priority
      else if(player.atk<=0 && activeMap!==MIESFELDS_INTERIOR && this.checkHGAirport()){
        // handled
      }
      // Talk to nearby NPC
      else if(!this._dlg && player.atk<=0){
        const npc=this._nearestNPC();
        if(npc){ this._openDlg(npc); player.atk=18; }
        else { player.atk=18; spawnP(player.x+16,player.y+16,'#ffcc02',8); }
      }
    }
    touchAtk=false; touchTalk=false;
  }

  // ── NPC dialogue ─────────────────────────────────────────
  _nearestNPC(){
    let best=null, bestDist=72;
    this.npcs.forEach(n=>{
      if(n.screenCol!==this.col||n.screenRow!==this.row) return;
      const d=Math.hypot(player.x+16-n.tx*TILE-16, player.y+16-n.ty*TILE-16);
      if(d<bestDist){ bestDist=d; best=n; }
    });
    return best;
  }

  _openDlg(npc){
    // Handle adoptable dogs
    if(npc.isAdoptable){
      const dogDef = ADOPTABLE_DOGS.find(d=>d.id===npc.dogId);
      if(dogDef){
        if(adoptDog(npc.dogId)){
          // Show personality on adopt
          popup={text:`🐾 ${dogDef.name}: "${dogDef.personality}"`,timer:250};
        }
        return;
      }
    }
    if(!npc._chatIdx) npc._chatIdx=0;
    this._dlg = { npc, line: npc._chatIdx, timer:0 };
    // Chuck Jr. sells brats!
    if(npc.id==='chuck_jr'){
      if(typeof bratCooldown!=='undefined'&&bratCooldown>0){
        popup={text:'🌭 Brat still cookin! ('+Math.ceil(bratCooldown/60)+'s)',timer:80};
      } else if(cornCount<5){
        popup={text:"🥩 Chuck Jr: That'll be 5 corn, eh! You only got "+cornCount+"!",timer:120};
      } else {
        cornCount-=5; player.hp=Math.min(player.maxHp,player.hp+2);
        if(typeof bratCooldown!=='undefined') bratCooldown=300; score+=50;
        spawnP(player.x+16,player.y+16,'#ff9f1c',14);
        popup={text:"🌭 GRAND CHAMPION BRAT! +2 HP! You betcha that's good!",timer:200};
      }
    }
    npc._chatIdx = (npc._chatIdx+1) % npc.chat.length;
  }

  drawDialogue(){
    if(!this._dlg) return;
    const {npc, line} = this._dlg;
    const text = npc.chat[line % npc.chat.length];
    const bx=20, by=GH-120, bw=GW-40, bh=90;
    // Box
    ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,12); ctx.fill();
    ctx.strokeStyle='#ffcc02'; ctx.lineWidth=2; ctx.stroke();
    // NPC name
    ctx.fillStyle=npc.color||'#ffcc02'; ctx.font='bold 14px Fredoka One'; ctx.textAlign='left';
    ctx.fillText(npc.emoji+' '+npc.name, bx+14, by+24);
    // Chat text — word wrap
    ctx.fillStyle='#fff'; ctx.font='13px Fredoka One';
    const words=text.split(' '); let ln='', ly=by+46;
    words.forEach(w=>{
      const t2=ln+(ln?' ':'')+w;
      if(ctx.measureText(t2).width>bw-28&&ln){ ctx.fillText(ln,bx+14,ly); ln=w; ly+=18; }
      else ln=t2;
    });
    ctx.fillText(ln,bx+14,ly);
    // Tap hint
    const pulse=0.5+Math.sin(frame*0.1)*0.4;
    ctx.fillStyle=`rgba(255,204,2,${pulse})`; ctx.font='10px Fredoka One'; ctx.textAlign='right';
    ctx.fillText('PECK to continue ▶', bx+bw-10, by+bh-8);
    ctx.textAlign='left';
  }

  // ── Walkable — override per map ───────────────────────────
  walkable(map, px, py){
    const BLOCKED=[T.WALL,T.WATER,T.JUNGLE,T.CLIFF,T.MANGROVE,T.RUIN,T.DEEP];
    const check=(x,y)=>{
      const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
      if(tx<0||ty<0||tx>=20||ty>=15) return false;
      return !BLOCKED.includes(map[ty][tx]);
    };
    return check(px+4,py+20)&&check(px+28,py+20)&&check(px+16,py+28);
  }

  // ── Draw screen tiles — override per map ──────────────────
  drawTile(t, sx, sy){ drawTile(t,sx,sy,frame); } // default: use world tiles

  drawScreen(sc, screenC, screenR){
    if(!sc) return;
    if(screenC===undefined) screenC=this.col;
    if(screenR===undefined) screenR=this.row;
    // Background
    ctx.fillStyle = this.palette.bg||'#1a2a1a';
    ctx.fillRect(0,0,GW,GH);
    // Tiles
    for(let ty=0;ty<15;ty++) for(let tx=0;tx<20;tx++){
      this.drawTile(sc.map[ty][tx], tx*TILE, ty*TILE);
    }
    // Corn
    sc.corn&&sc.corn.forEach((corn,i)=>{
      const key=`${this.id}_${this.col}_${this.row}_${i}`;
      if(!TOWN_TOOLS_FOUND.has(key)) drawCorn(corn.x*TILE,corn.y*TILE,frame);
    });
    // NPCs
    this.drawNPCs();
    // Screen name banner
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(GW/2-100,4,200,22);
    ctx.fillStyle=this.palette.nameColor||'#fff';
    ctx.font='bold 12px Fredoka One'; ctx.textAlign='center';
    ctx.fillText(sc.name, GW/2, 19); ctx.textAlign='left';
    // HUD strip
    this.drawHUD();
    // Mini location map
    this.drawMiniLoc();
  }

  drawNPCs(){
    this.npcs.forEach(n=>{
      if(n.screenCol!==this.col||n.screenRow!==this.row) return;
      const nx=n.tx*TILE, ny=n.ty*TILE;
      // Special render for Dave the Bears fan
      if(n.id==='hg_bears'){
        // Navy body
        ctx.fillStyle='#0b1f5e'; ctx.beginPath(); ctx.arc(nx+16,ny+16,14,0,Math.PI*2); ctx.fill();
        // Orange C on chest
        ctx.fillStyle='#e87722'; ctx.font='bold 12px Arial'; ctx.textAlign='center';
        ctx.fillText('C',nx+16,ny+20);
        // #18 above head
        ctx.fillStyle='#ffcc02'; ctx.font='bold 8px Fredoka One';
        ctx.fillText('#18',nx+16,ny+2);
        // Nervous sweat drop
        const sweat=Math.sin(frame*0.08)>0.5;
        if(sweat){ ctx.fillStyle='#90e0ef'; ctx.font='10px Arial'; ctx.fillText('💧',nx+26,ny+8); }
      } else {
        // Human NPC with body
        ctx.fillStyle=n.color||'#aaa';
        ctx.beginPath(); ctx.arc(nx+16,ny+10,10,0,Math.PI*2); ctx.fill();
        ctx.fillRect(nx+8,ny+19,16,14);
        ctx.font='16px Arial'; ctx.textAlign='center'; ctx.fillText(n.emoji,nx+16,ny+15);
      }
      ctx.fillStyle='#fff'; ctx.font='bold 9px Fredoka One'; ctx.textAlign='center';
      ctx.fillText(n.name,nx+16,ny+38);
      const dist=Math.hypot(player.x+16-nx-16, player.y+16-ny-16);
      if(dist<80){
        const chat=n.chat[Math.floor(frame/200)%n.chat.length];
        drawAutoBox(chat,nx+16,ny-20,{font:'bold 11px Fredoka One',maxW:200,bg:'rgba(0,0,0,0.8)'});
      }
      ctx.textAlign='left';
    });
  }

  drawHUD(){
    ctx.fillStyle=this.palette.hud||'rgba(0,30,60,0.85)';
    ctx.fillRect(0,0,GW,32);
    ctx.fillStyle=this.palette.hudText||'#e3f2fd';
    ctx.font='bold 12px Fredoka One'; ctx.textAlign='left';
    ctx.fillText(this.emoji+' '+this.name, 8, 21);
    ctx.fillStyle='#ffcc02'; ctx.textAlign='right';
    ctx.fillText('🌽'+cornCount+'  ⭐'+score, GW-8, 21);
    ctx.textAlign='left';
  }

  drawMiniLoc(){
    const mw=7, mh=7, mrx=GW-this.cols*mw-6, mry=36;
  // Airport icon on HG minimap
  ctx.font='7px Arial'; ctx.textAlign='center';
  ctx.fillText('✈️', mrx+0*mw+mw/2, mry+0*mh+mh);
  ctx.textAlign='left';
    for(let r=0;r<this.rows;r++) for(let c=0;c<this.cols;c++){
      ctx.fillStyle=(c===this.col&&r===this.row)?'#ffcc02':'rgba(255,255,255,0.2)';
      ctx.fillRect(mrx+c*mw, mry+r*mh, mw-1, mh-1);
    }
  }

  // ── Full draw (with scroll) ────────────────────────────────
  draw(){
    if(this.scrolling){
      ctx.save(); ctx.translate(this.scrollOffX,this.scrollOffY);
      this.drawScreen(this.currentScreen(), this.col, this.row); ctx.restore();
      const nsc=this.screenAt(this.nextCol,this.nextRow);
      ctx.save();
      ctx.translate(this.scrollOffX+this.scrollDirX*GW, this.scrollOffY+this.scrollDirY*GH);
      this.drawScreen(nsc, this.nextCol, this.nextRow); ctx.restore();
    } else {
      this.drawScreen(this.currentScreen(), this.col, this.row);
    }
    // HG airport + Miesfeld's building overlay — moved to drawScreen override
    // (drawn per-screen with scroll transform)
    // Player on top
    if(player.inv<=0||frame%6<3) drawChicken(player.x,player.y,player.dir,player.atk,frame);
    // Interaction checks handled in updatePlayer
    // NPC proximity hint
    if(!this._dlg){
      const npc=this._nearestNPC();
      if(npc){
        const pulse=0.6+Math.sin(frame*0.12)*0.35;
        drawAutoBox(npc.emoji+' PECK to talk to '+npc.name, GW/2, GH-44,
          {font:'bold 12px Fredoka One',alpha:pulse,maxW:GW-40,bg:'rgba(0,0,0,0.8)',border:'#ffcc02'});
      }
    }
    // Dialogue box
    this.drawDialogue();
    // Return hint
    if(this.exitSouth){
      const pulse=0.4+Math.sin(frame*0.08)*0.4;
      ctx.globalAlpha=pulse;
      drawAutoBox('✈️ Walk south to fly back',GW/2,GH-44,
        {font:'bold 11px Fredoka One',bg:'rgba(0,20,60,0.8)',maxW:GW-40});
      ctx.globalAlpha=1;
    }
  }
}

const MAP_SCROLL_FRAMES = 22;

// ── Active non-Tulum map ───────────────────────────────────────
let activeMap = null;    // current sub-map
let parentMap = null;    // map we entered from (null = Tulum world)

function enterMap(mapInstance){
  parentMap = activeMap; // remember where we came from
  activeMap = mapInstance;
  // Pass correct origin coords — from parent map or Tulum world
  if(parentMap){
    mapInstance.enter(parentMap.col, parentMap.row);
    mapInstance._fromParentMap = parentMap;
  } else {
    mapInstance.enter(screenCol, screenRow);
    mapInstance._fromParentMap = null;
  }
}

function exitCurrentMap(){
  if(!activeMap) return;
  const exitingMap = activeMap;
  activeMap = parentMap;  // return to parent map
  parentMap = null;
  if(activeMap){
    // Returning to a parent map (e.g. HG) — restore position there
    activeMap.col = exitingMap.prevWorldCol;
    activeMap.row = exitingMap.prevWorldRow;
    player.x = exitingMap._entryPlayerX || activeMap.entryPx;
    player.y = (exitingMap._entryPlayerY || activeMap.entryPy) - 48;
    popup = {text: exitingMap.emoji+' '+exitingMap.exitMsg, timer:120};
  } else {
    // Returning to Tulum world
    exitingMap.exit();
  }
}

//  HOWARDS GROVE MAP — extends GameMap

class HowardsGroveMap extends GameMap {
  constructor(){
    const screens = HowardsGroveMap.buildScreens();
    super({
      id:         'hg',
      name:       "Howards Grove, WI",
      emoji:      '🧀',
      cols:       5, rows: 4,
      screens,
      npcs:       HowardsGroveMap.NPCS,
      palette: {
        bg:        '#c8e6c9',
        nameColor: '#2e7d32',
        hud:       'rgba(0,50,10,0.88)',
        hudText:   '#e8f5e9',
      },
      entryCol: 0, entryRow: 0,
      entryPx:  5*32, entryPy: 11*32,
      arriveMsg:  "Welcome to Howards Grove, Wisconsin! 🧀",
      exitMsg:    "See ya, eh! Come back for the cheese! ✈️",
      hasEnemies: false,
    });
  }

  // Override drawScreen to add HG-specific buildings
  drawScreen(sc, screenC, screenR){
    if(screenC===undefined) screenC=this.col;
    if(screenR===undefined) screenR=this.row;
    super.drawScreen(sc, screenC, screenR);
    if(activeMap!==MIESFELDS_INTERIOR) this.drawHGAirport(screenC, screenR);
    if(activeMap!==MIESFELDS_INTERIOR) this.drawMiesfeldsBuilding(screenC, screenR);
  }

  // Check for HG airport entry/departure
  checkHGAirport(){
    if(this.col!==0||this.row!==0) return false;
    if(this.scrolling) return false;
    // Building is at bx=2*32, by=5*32 — center trigger on it
    const ax=2*32+48, ay=5*32+52; // center of building + runway area
    const dist=Math.hypot(player.x+16-ax, player.y+16-ay);
    if(dist<120){
      const pulse=0.6+Math.sin(frame*0.12)*0.35;
      drawAutoBox('✈️ Sheboygan County Airport — PECK to fly back to Tulum!',GW/2,GH-44,
        {font:'bold 12px Fredoka One',alpha:pulse,maxW:GW-40,bg:'rgba(0,20,60,0.9)',border:'#48cae4'});
    }
    const atk=keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk;
    if(dist<90&&atk&&player.atk<=0&&!this._dlg){
      player.atk=18;
      touchAtk=false; touchTalk=false;
      startFlightAnimation('tulum');
      return true;
    }
    return false;
  }

  drawHGAirport(screenC, screenR){
    if(screenC===undefined) screenC=this.col;
    if(screenR===undefined) screenR=this.row;
    if(screenC!==0||screenR!==0) return;
    const bx=2*32, by=5*32;
    // Runway
    ctx.fillStyle='#546e7a'; ctx.fillRect(bx-16,by+48,160,20);
    ctx.fillStyle='#fff';
    for(let i=0;i<5;i++) ctx.fillRect(bx+i*28,by+54,16,4);
    // Terminal — small regional airport
    ctx.fillStyle='#e0e0e0'; ctx.fillRect(bx,by,96,44);
    ctx.fillStyle='#0277bd'; ctx.fillRect(bx,by,96,10);
    ctx.fillStyle='#90caf9';
    ctx.fillRect(bx+6,by+14,18,16); ctx.fillRect(bx+34,by+14,18,16); ctx.fillRect(bx+62,by+14,18,16);
    ctx.fillStyle='#5d4037'; ctx.fillRect(bx+38,by+28,20,16);
    // Sign
    ctx.fillStyle='#0277bd'; ctx.fillRect(bx-4,by-18,104,16);
    ctx.fillStyle='#fff'; ctx.font='bold 8px Fredoka One'; ctx.textAlign='center';
    ctx.fillText('✈️ Sheboygan Co. Airport',bx+48,by-6);
    // Animated small plane on runway
    const px2=((frame*1.2)%200)-20;
    ctx.font='16px Arial'; ctx.fillText('✈️',bx+px2,by+46);
    // Windsock
    const ws=Math.sin(frame*0.08)*15;
    ctx.strokeStyle='#f44336'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bx+105,by+10); ctx.lineTo(bx+105+ws,by+16); ctx.stroke();
    ctx.textAlign='left';
  }

  // Check for Miesfeld's entry
  checkMiesfeldsEntry(){
    if(this.col!==1||this.row!==2) return;
    if(this.scrolling) return;
    const bx=13*32+16, by=5*32+16;
    const dist=Math.hypot(player.x+16-bx,player.y+16-by);
    if(dist<80){
      const pulse=0.6+Math.sin(frame*0.12)*0.35;
      drawAutoBox("🥩 Miesfeld's Triangle Market — PECK to enter!",GW/2,GH-44,
        {font:'bold 12px Fredoka One',alpha:pulse,maxW:GW-40,bg:'rgba(60,20,0,0.9)',border:'#ff8f00'});
    }
    const atk=keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk;
    if(dist<48&&atk&&player.atk<=0){
      enterMiesfelds();
      player.atk=18;
    }
  }

  drawMiesfeldsBuilding(screenC, screenR){
    if(screenC===undefined) screenC=this.col;
    if(screenR===undefined) screenR=this.row;
    if(screenC!==1||screenR!==2) return;
    const bx=12*32, by=4*32;
    // Main building — iconic triangular red & white
    ctx.fillStyle='#c62828'; ctx.fillRect(bx,by,64,48);
    // White trim
    ctx.fillStyle='#fff'; ctx.fillRect(bx,by,64,8);
    ctx.fillRect(bx,by+40,64,8);
    // Windows
    ctx.fillStyle='#90caf9'; ctx.fillRect(bx+4,by+10,16,20);ctx.fillRect(bx+44,by+10,16,20);
    // Door
    ctx.fillStyle='#5d4037'; ctx.fillRect(bx+24,by+28,16,20);
    // Triangle sign on roof
    ctx.fillStyle='#ff6f00';
    ctx.beginPath();ctx.moveTo(bx+32,by-16);ctx.lineTo(bx+4,by);ctx.lineTo(bx+60,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 7px Fredoka One';ctx.textAlign='center';
    ctx.fillText("MIESFELD'S",bx+32,by-4);
    // Sign below
    ctx.fillStyle='rgba(180,30,0,0.95)';ctx.fillRect(bx-2,by+48,68,18);
    ctx.fillStyle='#fff';ctx.font='bold 8px Fredoka One';
    ctx.fillText('🥩 Grand Champion Brats',bx+32,by+60);
    ctx.textAlign='left';
    // Smoke from grill
    for(let i=0;i<3;i++){
      const sy2=by-20-i*8+Math.sin(frame*0.05+i)*4;
      const sa=0.3-i*0.08;
      ctx.fillStyle=`rgba(200,200,200,${sa})`;
      ctx.beginPath();ctx.arc(bx+20+i*8,sy2,5+i*2,0,Math.PI*2);ctx.fill();
    }
  }

  // Wisconsin tile renderer — override drawTile
  drawTile(t, sx, sy){
    if(t===T.RF){
      ctx.fillStyle='#81c784'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='#66bb6a'; ctx.fillRect(sx+4,sy+4,8,8); ctx.fillRect(sx+18,sy+18,8,8);
    } else if(t===T.PATH){
      ctx.fillStyle='#90a4ae'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(sx+14,sy,4,32);
    } else if(t===T.SAND){
      ctx.fillStyle='#d7ccc8'; ctx.fillRect(sx,sy,32,32);
    } else if(t===T.WATER){
      const w=0.7+Math.sin(frame*0.05+sx*0.03)*0.3;
      ctx.fillStyle=`rgba(66,165,245,${w})`; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(144,202,249,0.4)';

  drawTile(t, sx, sy){
    if(t===T.PATH){ // wood plank floor
      ctx.fillStyle=(Math.floor(sx/32)+Math.floor(sy/32))%2===0?'#bcaaa4':'#a1887f';
      ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(0,0,0,0.06)'; ctx.fillRect(sx,sy+15,32,2);
    } else if(t===T.RF){ // tile floor (cold storage / back areas)
      ctx.fillStyle='#b0bec5'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(sx+1,sy+1,30,30);
    } else if(t===T.SAND){ // concrete / loading dock
      ctx.fillStyle='#90a4ae'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(255,255,255,0.05)';
      for(let i=0;i<3;i++) ctx.fillRect(sx+i*12,sy,2,32);
    } else if(t===T.WALL){ // display case / brick wall
      ctx.fillStyle='#5d4037'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(144,202,249,0.25)'; ctx.fillRect(sx+3,sy+3,26,26);
      ctx.strokeStyle='#8d6e63'; ctx.lineWidth=1; ctx.strokeRect(sx,sy,32,32);
    } else if(t===T.WATER){
      // In pool zones: real animated water. Elsewhere: refrigerated case.
      const inPool = MF_DOG_PARKS.find(p=>p.col===this.col&&p.row===this.row&&p.type==='pool');
      if(inPool){
        // Real pool water — animated like Tulum
        const wave=0.7+Math.sin(frame*0.05+sx*0.03)*0.3;
        ctx.fillStyle=`rgba(30,136,229,${wave})`; ctx.fillRect(sx,sy,32,32);
        ctx.fillStyle='rgba(144,202,249,0.5)';
        ctx.fillRect(sx,sy+Math.floor(frame*0.3)%32,32,3);
        ctx.fillRect(sx,sy+(Math.floor(frame*0.3)+16)%32,32,2);
        // Pool tile shimmer
        ctx.fillStyle='rgba(255,255,255,0.08)';
        ctx.fillRect(sx+2,sy+2,10,10); ctx.fillRect(sx+20,sy+18,10,10);
      } else {
        // Refrigerated case / cold storage
        ctx.fillStyle='rgba(66,165,245,0.3)'; ctx.fillRect(sx,sy,32,32);
        ctx.fillStyle='#0288d1'; ctx.fillRect(sx,sy,32,4);
        ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(sx+2,sy+6,28,22);
      }
    } else if(t===T.JUNGLE){ // shelving unit (brown)
      ctx.fillStyle='#4e342e'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='#6d4c41';
      ctx.fillRect(sx+2,sy+2,28,8); ctx.fillRect(sx+2,sy+14,28,8); ctx.fillRect(sx+2,sy+24,28,6);
    } else if(t===T.FLOWER){ // decorative / special tile
      ctx.fillStyle='#bcaaa4'; ctx.fillRect(sx,sy,32,32);
      ctx.font='18px Arial'; ctx.textAlign='center';
      const icons=['🥩','🌭','🧀','🥓','🍖'];
      ctx.fillText(icons[(Math.floor(sx/32)+Math.floor(sy/32))%icons.length],sx+16,sy+22);
      ctx.textAlign='left';
    } else if(t===T.RUIN){ // special zone floor — event hall carpet
      ctx.fillStyle='#880e4f'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='rgba(255,255,255,0.05)';
      ctx.fillRect(sx+4,sy+4,24,24);
    } else if(t===T.CLIFF){ // rooftop / outdoor
      ctx.fillStyle='#558b2f'; ctx.fillRect(sx,sy,32,32);
      ctx.fillStyle='#689f38'; ctx.fillRect(sx+4,sy+4,24,24);
    } else {
      ctx.fillStyle='#3e2723'; ctx.fillRect(sx,sy,32,32);
    }
  }

  // Override walkable — fridge/freezer floors are walkable inside
  walkable(map, px, py){
    const BLOCKED=[T.WALL,T.JUNGLE,T.DEEP];
    const check=(x,y)=>{
      const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
      if(tx<0||ty<0||tx>=20||ty>=15) return false;
      return !BLOCKED.includes(map[ty][tx]);
    };
    return check(px+4,py+20)&&check(px+28,py+20)&&check(px+16,py+28);
  }

    const mrx=GW-this.cols*mw-6, mry=36;
    // Background
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(mrx-3,mry-3,this.cols*mw+6,this.rows*mh+6,4); ctx.fill();

    for(let r=0;r<this.rows;r++) for(let c=0;c<this.cols;c++){
      const isCurrent = c===this.col && r===this.row;
      const park = MF_DOG_PARKS.find(p=>p.col===c&&p.row===r);
      // Color by zone
      if(isCurrent){
        ctx.fillStyle='#ffcc02';
      } else if(park && park.type==='pool'){
        ctx.fillStyle='#1976d2';
      } else if(park && park.type==='park'){
        ctx.fillStyle='#2e7d32';
      } else if(c===7&&r===5){

      } else {

      }
      ctx.fillRect(mrx+c*mw, mry+r*mh, mw-1, mh-1);
    }

    // Park/pool icons on minimap
    ctx.font='5px Arial'; ctx.textAlign='center';
    MF_DOG_PARKS.forEach(p=>{

// ── FLIGHT ANIMATION ──────────────────────────────────────────
let flightAnim = null;

function startFlightAnimation(destId){
  flightAnim = {phase:'taxi', frame:0, dest:destId};
}

function updateFlightAnim(){
  if(!flightAnim) return;
  flightAnim.frame++;
  const f=flightAnim.frame;
  const p=flightAnim.phase;
  if(p==='taxi'    &&f>60) {flightAnim.phase='takeoff';flightAnim.frame=0;}
  if(p==='takeoff' &&f>70) {flightAnim.phase='flying'; flightAnim.frame=0;}
  if(p==='flying'  &&f>90) {flightAnim.phase='landing';flightAnim.frame=0;}
  if(p==='landing' &&f>70) {flightAnim.phase='arrive'; flightAnim.frame=0;}
  if(p==='arrive'  &&f>60) {
    const d=flightAnim.dest; flightAnim=null;
    if(d==='howardsgrove') enterMap(HG_MAP);
    else if(d==='tulum') exitCurrentMap();
  }
}

function drawFlightAnim(){
  if(!flightAnim) return;
  const {phase,frame:f,dest}=flightAnim;
  const skyA=phase==='taxi'?Math.min(f/40,1):1;
  ctx.fillStyle=`rgba(10,20,60,${skyA})`;ctx.fillRect(0,0,GW,GH);
  if(phase==='flying'||phase==='landing'){
    for(let i=0;i<30;i++){
      const sx=(i*137)%GW,sy=(i*97)%80+10,tw=0.5+Math.sin(f*0.1+i)*0.5;
      ctx.fillStyle=`rgba(255,255,255,${tw})`;ctx.fillRect(sx,sy,2,2);
    }
  }
  const cx=-(f*4)%GW;
  ctx.fillStyle='rgba(255,255,255,0.15)';
  [60,140,220].forEach((cy,i)=>{
    const x=((i*200+cx+GW*2)%GW)-40;
    ctx.beginPath();ctx.arc(x+40,cy,25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+70,cy-10,20,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+100,cy,22,0,Math.PI*2);ctx.fill();
  });
  let px2=GW/2,py2=GH/2,ps=1,pa=0;
  if(phase==='taxi'){px2=40+(f/60)*(GW/2-40);py2=GH-80;ps=0.8+f/60*0.4;pa=0;}
  else if(phase==='takeoff'){px2=GW/2+f*3;py2=GH-80-f*f*0.08;pa=-0.3;ps=1.2;}
  else if(phase==='flying'){px2=GW/2+Math.sin(f*0.05)*30;py2=GH/2-40+Math.sin(f*0.08)*15;pa=Math.sin(f*0.05)*0.1;ps=1.4;}
  else if(phase==='landing'){const t=f/70;px2=GW/2+t*100;py2=GH/2-40+t*t*(GH/2-20);pa=0.2;ps=1.2-t*0.3;}
  ctx.save();ctx.translate(px2,py2);ctx.rotate(pa);ctx.scale(ps,ps);
  ctx.font='48px Arial';ctx.textAlign='center';ctx.fillText('✈️',0,0);
  ctx.font='18px Arial';ctx.fillText('🐔',8,-8);
  if(phase==='takeoff'||phase==='flying'){
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){const ly=-20+i*12;ctx.beginPath();ctx.moveTo(-60,ly);ctx.lineTo(-100-i*10,ly);ctx.stroke();}
  }
  ctx.restore();
  const isReturn=dest==='tulum';
  const caps={
    taxi:  isReturn?["See ya, Wisconsin! 🧀","Leaving the cheese behind...","The Packers fans look relieved"]:
                    ["Buckle up, feathers! ✈️","No turning back now, chicken!","Tulum to Wisconsin... really?!"],
    takeoff:isReturn?["BWAAAAK! HOMEWARD BOUND!","Goodbye brats... for now...","I miss Tulum already!"]:
                     ["BWAAAAK! WE'RE FLYING!","This is NOT how chickens fly!!","Oh no oh no oh no—"],
    flying: isReturn?["🌮 Tulum, here we come!","Warmer down there, at least!","No more 'you betcha' for a while"]:
                     ["🧀 Wisconsin, here we come!","Population 3,237 + 1 chicken","Is that the Pigeon River?!"],
    landing:isReturn?["Almost back in Tulum!","Feel that warm air!","Watch out for the iguanas!"]:
                     ["Prepare for landing, eh!","Almost there, you betcha!","Watch out for the cheese factory!"],
    arrive: isReturn?["🌮 Back in Tulum! Buenas!","Hope you enjoyed Wisconsin!","El Jaguar is still out there..."]:
                     ["🧀 Welcome to Howards Grove!","Pop. 3,237 + 1 cranky chicken","Try the sharp cheddar!"],
  };
  const msg=(caps[phase]||[])[Math.floor(f/25)%3]||'';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(GW/2-160,GH-70,320,40,10);ctx.fill();
  ctx.fillStyle='#ffcc02';ctx.font='bold 16px Fredoka One';ctx.fillText(msg,GW/2,GH-44);
  if(phase==='flying'&&f>30){
    const al=Math.min((f-30)/20,1);ctx.globalAlpha=al;
    ctx.fillStyle='rgba(0,40,80,0.9)';ctx.beginPath();ctx.roundRect(GW/2-120,GH/2+60,240,60,12);ctx.fill();
    ctx.strokeStyle='#81c784';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#81c784';ctx.font='bold 13px Fredoka One';ctx.fillText('🧀 Howards Grove, WI',GW/2,GH/2+85);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px Fredoka One';ctx.fillText('Population 3,237 • Est. 1846',GW/2,GH/2+105);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}



// ── Perf meter (press P). Added after a canvas-state-stack leak made the
//    player progressively slower; this makes the next report a measurement.
var _perf={fps:60,ms:16.7,worst:0,show:false,_n:0,_a:0,_last:performance.now()};
function _perfTick(){
  var now=performance.now(), raw=now-_perf._last; _perf._last=now;
  _perf._a+=raw; _perf._n++;
  if(raw>_perf.worst)_perf.worst=raw;
  if(_perf._a>=500){_perf.ms=_perf._a/_perf._n;_perf.fps=Math.round(1000/_perf.ms);_perf._a=0;_perf._n=0;}
  if(!_perf.show)return;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  var rows=['FPS      '+_perf.fps,'FRAME MS '+_perf.ms.toFixed(1),
            'WORST MS '+_perf.worst.toFixed(0),'PARTS    '+(typeof parts!=='undefined'?parts.length:'-')];
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(6,6,132,rows.length*13+10);
  ctx.strokeStyle=_perf.fps<45?'#ff5566':'#55cc77';ctx.lineWidth=1;
  ctx.strokeRect(6,6,132,rows.length*13+10);
  ctx.font='10px monospace';ctx.fillStyle=_perf.fps<45?'#ff99aa':'#99e6bb';
  rows.forEach(function(r,i){ctx.fillText(r,13,21+i*13);});
  ctx.restore();
}
document.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'){_perf.show=!_perf.show;_perf.worst=0;}
});

function loop(){
  frame++;
  // Screen shake
  if(screenShake>0){screenShake--;}
  const shakeX=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  const shakeY=screenShake>0?(Math.random()-0.5)*screenShake*2:0;
  ctx.save();
  if(screenShake>0)ctx.translate(shakeX,shakeY);
  ctx.clearRect(-shakeX,-shakeY,GW,GH);

  if(gameState==='title'){drawTitle();ctx.restore();requestAnimationFrame(loop);return;}

  updateFlightAnim();
  updateFlightAnim();
  if(gameState==='play'){
    if(battleMode){
      updateBattle();
      updateBattleParticles();
      updateCutscene();
      // Tap advances cutscene
      // Set cutscene.tapped on fresh key press (keyboard edge detection)
      if(!cutscene.active){
        const bAtk=(keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk);
        if(bAtk){ fireBattleChicken(); touchAtk=false; touchTalk=false; }
      } else {
        touchAtk=false; touchTalk=false; // block game input during cutscene
      }
    } else if(activeMap&&activeMap===MIESFELDS_INTERIOR&&player.y>13*TILE&&activeMap.col===7&&activeMap.row===5){
      exitMiesfelds();
    } else if(activeMap){
      activeMap.updatePlayer();
      activeMap.updateScroll();
      updateDogPack();
    } else if(inTownZone){
      updateTownZonePlayer();
    } else {
      updatePlayer();
      updateScroll();
      updateEnemies();
      updateJaguar();
      updateMiniJag();
      updateProjectiles();
      updateCornMagnet();
      checkAirportEntry();
      checkSecretPassages();
      checkSavePoints();
      updateSidekick();
      checkEggPickup();
      checkNPCInteractions();
      updateTownNPCs();
      updateTownQuests();
      checkTownNPCInteractions();
      checkNoticeBoardInteraction();
      checkNPCChat();
      if(!battleMode){ checkMiniBossEntry(); updateMiniBosses(); }
      updateDangerZones();
      checkJaguarGate();
      checkTownZoneEntry();
    }
  }

  // ── DRAW ──
  // Show/hide minimap element
  if(battleMode||inTownZone||activeMap){ mmCanvas.style.display='none'; }
  else { mmCanvas.style.display='block'; }
  if(battleMode){
    drawBattle();
  } else if(activeMap){
    activeMap.draw();
  } else if(inTownZone){
    drawTownZone();
  } else if(isScrolling){
    ctx.save();ctx.translate(scrollOffX,scrollOffY);
    const ss=getScreenState(screenCol,screenRow);
    const sc=currentScreen();
    drawScreen(sc,ss);
    sc.corn.forEach((c,i)=>{if(!ss.gotCorns.has(i))drawCorn(c.x*TILE,c.y*TILE,frame);});
    sc.feathers&&sc.feathers.forEach((f,i)=>{if(!ss.gotFeathers.has(i))drawFeather(f.tx*TILE,f.ty*TILE,frame);});
    sc.enemies.forEach((e,i)=>{if(ss.enemyHps[i]>0&&e._x!==undefined)drawIguana(e._x,e._y,ss.enemyHps[i],frame);});
    ctx.restore();
    const nsc=SCREENS[screenIndex(nextScreenCol,nextScreenRow)];
    const nss=getScreenState(nextScreenCol,nextScreenRow);
    ctx.save();ctx.translate(scrollOffX+scrollDirX*GW,scrollOffY+scrollDirY*GH);
    drawScreen(nsc,nss);
    nsc.corn.forEach((c,i)=>{if(!nss.gotCorns.has(i))drawCorn(c.x*TILE,c.y*TILE,frame);});
    nsc.feathers&&nsc.feathers.forEach((f,i)=>{if(!nss.gotFeathers.has(i))drawFeather(f.tx*TILE,f.ty*TILE,frame);});
    ctx.restore();
  } else if(!inTownZone) {
    const sc=currentScreen();
    const ss=getScreenState(screenCol,screenRow);
    drawScreen(sc,ss);
    sc.corn.forEach((c,i)=>{if(!ss.gotCorns.has(i))drawCorn(c.x*TILE,c.y*TILE,frame);});
    sc.feathers&&sc.feathers.forEach((f,i)=>{if(!ss.gotFeathers.has(i))drawFeather(f.tx*TILE,f.ty*TILE,frame);});
    sc.enemies.forEach((e,i)=>{if(ss.enemyHps[i]>0&&e._x!==undefined)drawIguana(e._x,e._y,ss.enemyHps[i],frame);});
    drawDangerZones();
    drawSavePoints();
    drawEgg(frame);
    drawNPCs();
    drawMiniBosses();
    drawTownFurniture();
  drawTownNPCs();
    drawSidekick();
    if(jaguar.active&&!jagDead)drawJaguar(jaguar.x,jaguar.y,jaguar.hp,jaguar.maxHp,frame);
    if(miniJag.active&&!isScrolling)drawMiniJag(miniJag.x,miniJag.y,miniJag.hp,miniJag.maxHp,frame);
  }

  // Treetop layer overlay
  // Player (always on top) — flicker if invincible, glow if dashing
  if((!isScrolling||inTownZone)&&!battleMode){
    if(dash.active){ctx.shadowColor='#48cae4';ctx.shadowBlur=18;}
    if(player.inv<=0||frame%6<3)drawChicken(player.x,player.y+(player._swimBob||0),player.dir,player.atk,frame);
    ctx.shadowBlur=0;

    // Swimming overlay — blue ripple rings
    if(player._onWater){
      const r1=(frame%30)/30;
      ctx.strokeStyle='rgba(72,202,228,0.5)'; ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(player.x+16,player.y+28,18*r1+4,6*r1+2,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(144,224,239,0.3)'; ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(player.x+16,player.y+28,(18*((frame+15)%30)/30)+4,(6*((frame+15)%30)/30)+2,0,0,Math.PI*2);ctx.stroke();
      // Water line across player waist
      ctx.fillStyle='rgba(72,202,228,0.25)';
      ctx.fillRect(player.x+2,player.y+18,28,16);
      ctx.strokeStyle='rgba(144,224,239,0.6)'; ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(player.x,player.y+20);
      for(let wx=0;wx<32;wx+=4)ctx.lineTo(player.x+wx,player.y+20+Math.sin((frame*0.3+wx*0.5))*2);
      ctx.stroke();
    }

    // Regen glow — gentle pink ring + progress arc
    if(player._regenTimer>0&&player.hp<player.maxHp){
      const rate=tileAt(currentScreen().map,player.x+16,player.y+22)===T.FLOWER?120:240;
      const prog=player._regenTimer/rate;
      const pulse=0.25+Math.sin(frame*0.08)*0.15;
      // soft pink aura
      ctx.strokeStyle=`rgba(255,133,161,${pulse})`;ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(player.x+16,player.y+16,26,0,Math.PI*2);ctx.stroke();
      // progress arc (fills clockwise)
      ctx.strokeStyle=`rgba(255,133,161,0.9)`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(player.x+16,player.y+16,26,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);ctx.stroke();
      // tiny heart floating up when almost full
      if(prog>0.85){
        const heartY=player.y-8-Math.sin(frame*0.15)*(prog-0.85)*30;
        const heartAlpha=(prog-0.85)/0.15;
        ctx.globalAlpha=heartAlpha;
        ctx.font='14px Arial';ctx.textAlign='center';
        ctx.fillText('❤️',player.x+16,heartY);
        ctx.globalAlpha=1;ctx.textAlign='left';
      }
    }

    // Shield glow ring
    if(tools.shieldHits>0){
      const sp2=0.5+Math.sin(frame*0.12)*0.5;
      ctx.strokeStyle=`rgba(72,202,228,${sp2})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(player.x+16,player.y+16,22,0,Math.PI*2);ctx.stroke();
    }
    // Draw held skills as glow on chicken
    if(skills.spicyPeck&&player.atk>0){
      ctx.shadowColor='#ff4400';ctx.shadowBlur=14;
      ctx.fillStyle='rgba(255,68,0,0.2)';ctx.beginPath();ctx.arc(player.x+16,player.y+16,20,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  updateEggCarry();
  tickP();
  drawProjectiles();
  drawFishingRod();
  drawHeroBalls();
  drawDialogue();
  drawTownDialogue();
  drawNoticeBoardUI();
  drawShopUI();
  if(!activeMap) drawAirportBuilding();
  if(!inTownZone&&!battleMode&&activeMap!==MIESFELDS_INTERIOR)drawHintArrow();
  // Treetop climb hint

  if(!inTownZone&&!battleMode)drawMinimap();
  updateHUD();
  drawJaguarGateOverlay();
  if(!inTownZone)drawSkillHUD();
  else drawSkillHUD();
  drawToolHint();
  // Update PECK button label for rod state
  if(isMobile){
    const atkEl=document.getElementById('attackBtn');
    if(atkEl){
      const hasLine=fishLine!==null;
      const sp=atkEl.querySelector('span');
      if(activeTool==='rod'&&hasLine){
        if(sp)sp.textContent='🎣';
        atkEl.childNodes[atkEl.childNodes.length-1].textContent='REEL!';
        atkEl.style.background='radial-gradient(circle at 35% 30%,#48cae4,#0077b6)';
        atkEl.style.borderColor='#90e0ef';
      } else {
        if(sp)sp.textContent='💥';
        atkEl.childNodes[atkEl.childNodes.length-1].textContent='PECK!';
        atkEl.style.background='radial-gradient(circle at 35% 30%,#ff6b35,#cc2200)';
        atkEl.style.borderColor='#ffcc02';
      }
    }
  }
  drawSkillPopup();
  drawTownEntryFX();

  // Popup message (chest/door reward)
  if(popup.timer>0){
    popup.timer--;
    const alpha=Math.min(1,popup.timer/15);
    const yOff=popup.timer>75?0:(75-popup.timer)*0.5;
    drawAutoBox(popup.text, GW/2, GH/2-50-yOff, {font:'bold 15px Fredoka One',alpha,maxW:GW-40,pad:12});
  }

  // Jaguar warning
  if(jaguar.active&&!jagDead){
    const pulse=Math.sin(frame*0.14)*0.35+0.65;
    ctx.globalAlpha=pulse;ctx.fillStyle='#ff3300';ctx.font='bold 14px Fredoka One';ctx.textAlign='center';
    ctx.fillText('⚠️ EL JAGUAR APPROACHES!',GW/2,GH-10);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  if(gameState==='play'&&!inTownZone&&!battleMode&&!activeMap)checkEnd();
  drawAirportUI();
  ctx.restore();   // must match the unconditional ctx.save() above
  _perfTick();
  drawFlightAnim();
  // Cutscene runs over everything (preview or post-battle)
  if(cutscene.active&&!battleMode){ updateCutscene(); drawCutscene(); }
  requestAnimationFrame(loop);
}
loop();
</script>
