<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cranky Chickens: Tulum Trouble</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#0a0a1a;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;}
#ui{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:640px;padding:5px 10px;background:linear-gradient(135deg,#ff6b35,#ff9f1c);border-bottom:3px solid #ffcc02;flex-shrink:0;}
#ui .title{font-family:'Fredoka One',cursive;color:#fff;font-size:clamp(10px,3vw,16px);text-shadow:2px 2px 0 #a33000;}
#ui .stats{display:flex;gap:8px;align-items:center;font-family:'Fredoka One',cursive;font-size:clamp(10px,3vw,15px);color:#fff;text-shadow:1px 1px 0 #000;}
#hearts{display:flex;gap:1px;}
.heart{font-size:clamp(10px,3vw,16px);}
#zone{font-size:clamp(9px,2.5vw,13px);color:#ffe;background:rgba(0,0,0,0.3);padding:1px 6px;border-radius:8px;}
#canvasWrap{position:relative;flex-shrink:0;}
canvas#game{display:block;image-rendering:pixelated;touch-action:none;}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#ffcc02;font-family:'Fredoka One',cursive;font-size:clamp(12px,3.5vw,20px);padding:14px 22px;border-radius:14px;border:3px solid #ff6b35;text-align:center;display:none;max-width:92%;line-height:1.5;z-index:10;}
#minimap{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);border:2px solid #ffcc02;border-radius:4px;padding:3px;}
/* ── MOBILE CONTROLS ── */
#touchControls{display:none;width:100%;max-width:640px;flex-shrink:0;background:#0d0d1f;border-top:2px solid #222;position:relative;}
/* Row 1: action buttons across top of control area */
#ctrlTop{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:5px 10px 2px 10px;}
/* Row 2: joystick left, main action right */
#ctrlMain{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 6px 12px;gap:8px;}
/* Joystick */
#joystickZone{width:116px;height:116px;flex-shrink:0;position:relative;}
#joystickBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,0.07);border:3px solid rgba(255,204,2,0.35);}
#joystickThumb{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffcc02,#ff9f1c);border:3px solid #fff;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(0,0,0,0.5);}
/* PECK — big right thumb button */
#attackBtn{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b35,#cc2200);border:4px solid #ffcc02;color:#fff;font-family:'Fredoka One',cursive;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,0.6);cursor:pointer;user-select:none;-webkit-user-select:none;flex-shrink:0;transition:transform 0.05s,filter 0.05s;}
#attackBtn span{font-size:28px;line-height:1;}
#attackBtn.pressed{transform:scale(0.91);filter:brightness(1.4);}
/* Small action buttons — top row */
.ctrl-sm{font-family:'Fredoka One',cursive;font-size:11px;padding:0;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform 0.07s,filter 0.07s;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.ctrl-sm:active,.ctrl-sm.pressed{transform:scale(0.88);filter:brightness(1.5);}
.ctrl-sm .icon{font-size:18px;line-height:1.1;}
.ctrl-sm .lbl{font-size:9px;opacity:0.8;letter-spacing:0.3px;}
/* Tool button has active-tool highlight */
#toolBtn.active{border-color:#ffcc02;background:rgba(255,204,2,0.18);}
.ctrl-sm.toggled{border-color:#48cae4;background:rgba(72,202,228,0.22);color:#48cae4;}
.ctrl-sm.toggled .lbl{color:#48cae4;}
/* Start/restart overlay buttons */
#startTouchBtn,#restartTouchBtn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:18px;padding:10px 32px;border-radius:30px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.5);display:none;z-index:20;}
#startTouchBtn{background:#ffcc02;color:#1a0a2e;}
#restartTouchBtn{background:#ff6b35;color:#fff;}
#hint{color:#333;font-size:9px;padding:1px 0;text-align:center;flex-shrink:0;}
</style>
</head>
<body>
<div id="ui">
  <div class="title">🐔 Cranky Chickens: Tulum Trouble</div>
  <div class="stats">
    <div id="hearts"></div>
    <div>🌽<span id="cornCount">0</span></div>
    <div>⭐<span id="score">0</span></div>
    <div id="zone">Beach</div>
  </div>
</div>
<div id="canvasWrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div id="message"></div>
  <canvas id="minimap" width="102" height="82" style="position:absolute;top:6px;right:6px;border:2px solid #ffcc02;border-radius:4px;image-rendering:pixelated;"></canvas>
</div>
<div id="touchControls">
  <!-- Row 1: small action buttons -->
  <div id="ctrlTop">
    <button class="ctrl-sm" id="toolBtn" style="width:52px;height:44px;"><span class="icon" id="toolIcon">🐔</span><span class="lbl">TOOL</span></button>
    <button class="ctrl-sm" id="mapBtn"  style="width:52px;height:44px;"><span class="icon">🗺️</span><span class="lbl">MAP</span></button>
    <button class="ctrl-sm" id="talkBtn" style="width:52px;height:44px;"><span class="icon">💬</span><span class="lbl">TALK</span></button>
    <button class="ctrl-sm" id="unstuckBtn" style="width:52px;height:44px;"><span class="icon">📍</span><span class="lbl">UNSTUCK</span></button>

  <div id="ctrlMain">
    <div id="joystickZone"><div id="joystickBase"></div><div id="joystickThumb"></div></div>

  <button id="restartTouchBtn">🔄 PLAY AGAIN!</button>

<div id="hint">⌨️ WASD/Arrows — move &nbsp;|&nbsp; SPACE — peck</div>
<!-- DEV: cutscene preview buttons -->
<div id="devBtns" style="display:flex;gap:6px;padding:6px 8px;background:#0a0a1a;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px;flex-shrink:0;">
  <button onclick="startJagCutscene(1)" style="font-family:'Fredoka One',cursive;font-size:11px;padding:5px 10px;border-radius:8px;border:2px solid #ff6b35;background:#1a0a2e;color:#ff6b35;cursor:pointer;">🦎 Scene 1</button>
  <button onclick="startJagCutscene(2)" style="font-family:'Fredoka One',cursive;font-size:11px;padding:5px 10px;border-radius:8px;border:2px solid #ffaa00;background:#1a0a2e;color:#ffaa00;cursor:pointer;">🐊 Scene 2</button>
  <button onclick="startJagCutscene(3)" style="font-family:'Fredoka One',cursive;font-size:11px;padding:5px 10px;border-radius:8px;border:2px solid #ff6b35;background:#1a0a2e;color:#ff6b35;cursor:pointer;">🦅 Scene 3</button>
  <button onclick="startJagCutscene(4)" style="font-family:'Fredoka One',cursive;font-size:11px;padding:5px 10px;border-radius:8px;border:2px solid #a29bfe;background:#1a0a2e;color:#a29bfe;cursor:pointer;">🐍 Scene 4</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  SETUP & SCALING
// ═══════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const msg = document.getElementById('message');
const GW=640, GH=480, TILE=32;

let isMobile = ('ontouchstart' in window)||navigator.maxTouchPoints>0;
const tc=document.getElementById('touchControls'), hint=document.getElementById('hint');
// Always show touch controls — hide keyboard hint on mobile
if(isMobile){ tc.style.display='flex'; tc.style.flexDirection='column'; hint.style.display='none'; }
// updateToolIcon defined near TOOL_CYCLE above
function resize(){
  const uiH=document.getElementById('ui').offsetHeight;
  const tcH=isMobile?(tc.offsetHeight||158):0;
  const hH=isMobile?0:hint.offsetHeight;
  const scale=Math.min(window.innerWidth/GW,(window.innerHeight-uiH-tcH-hH-4)/GH,1);
  canvas.style.width=(GW*scale)+'px'; canvas.style.height=(GH*scale)+'px';
  document.getElementById('canvasWrap').style.width=(GW*scale)+'px';
}
if(isMobile){tc.style.display='flex';hint.style.display='none';}
resize(); window.addEventListener('resize',resize);

// ═══════════════════════════════════════════════
//  JOYSTICK
// ═══════════════════════════════════════════════
const jZone=document.getElementById('joystickZone'),jThumb=document.getElementById('joystickThumb');
const atkBtn=document.getElementById('attackBtn'),startBtn=document.getElementById('startTouchBtn'),restartBtn=document.getElementById('restartTouchBtn'),unstuckBtn=document.getElementById('unstuckBtn');
let joyActive=false,joyId=null,joyDx=0,joyDy=0;
const JR=34;
jZone.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;joyActive=true;moveJoy(t);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joyActive)return;e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)moveJoy(t);},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const pullPower=Math.hypot(joyDx,joyDy);
      if(battleMode && pullPower>0.12){
        // Always store the shot — consumed when state becomes aim
        BATTLE.pendingShot={dx:joyDx, dy:joyDy};
      }
      joyActive=false;
      joyDx=0; joyDy=0;
      jThumb.style.transform='translate(-50%,-50%)';
    }
  }
});
function moveJoy(touch){const r=jZone.getBoundingClientRect();let dx=touch.clientX-(r.left+r.width/2),dy=touch.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joyDx=dx/JR;joyDy=dy/JR;jThumb.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
let touchAtk=false;
atkBtn.addEventListener('touchstart',e=>{e.preventDefault();if(!cutscene.active)touchAtk=true;atkBtn.classList.add('pressed');},{passive:false});
atkBtn.addEventListener('touchend',e=>{e.preventDefault();atkBtn.classList.remove('pressed');},{passive:false});
// Dedicated cutscene next button — completely separate from game input
const csNextBtn=document.getElementById('cutsceneNextBtn');
csNextBtn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(cutscene.active)advanceCutscene();},{passive:false});
csNextBtn.addEventListener('click',e=>{e.stopPropagation();if(cutscene.active)advanceCutscene();});
startBtn.addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});
// Canvas tap advances cutscene
// Canvas tap for cutscene removed — use dedicated NEXT button
startBtn.addEventListener('click',()=>startGame());
// Respawn at save (default restart on mobile)
restartBtn.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(saveData.activeSavePoint>=0&&gameState==='lose'){gameState='play';showMsg('');respawnAtSave();}
  else restartGame();
},{passive:false});
restartBtn.addEventListener('click',()=>{
  if(saveData.activeSavePoint>=0&&gameState==='lose'){gameState='play';showMsg('');respawnAtSave();}
  else restartGame();
});
function unstuckPlayer(){
  // Close any open UI first
  if(airportOpen){airportOpen=false;return;}
  if(activeMap){exitCurrentMap();return;}
  if(shopOpen){shopOpen=false;return;}
  if(noticeBoardOpen){noticeBoardOpen=false;return;}
  if(townDialogue.active){townDialogue.active=false;return;}
  if(dialogue.active){dialogue.active=false;return;}

  const map = inTownZone ? currentTownRoom().map : currentScreen().map;
  const GW2=GW, GH2=GH;

  // Priority 1: tiles adjacent to edge corridors (guaranteed exit paths)
  // N/S doors: cols 8-10, near row 0 or 14
  // W/E doors: rows 6-8, near col 0 or 19
  const exitCandidates = [];
  // Near north door
  for(let tx=8;tx<=10;tx++) for(let ty=1;ty<=4;ty++) exitCandidates.push({x:tx*TILE,y:ty*TILE});
  // Near south door
  for(let tx=8;tx<=10;tx++) for(let ty=10;ty<=13;ty++) exitCandidates.push({x:tx*TILE,y:ty*TILE});
  // Near west door
  for(let ty=6;ty<=8;ty++) for(let tx=1;tx<=4;tx++) exitCandidates.push({x:tx*TILE,y:ty*TILE});
  // Near east door
  for(let ty=6;ty<=8;ty++) for(let tx=15;tx<=18;tx++) exitCandidates.push({x:tx*TILE,y:ty*TILE});
  // Center fallback
  exitCandidates.push({x:9*TILE,y:7*TILE},{x:10*TILE,y:7*TILE},{x:9*TILE,y:6*TILE});

  for(const pt of exitCandidates){
    if(boxWalkable(map,pt.x,pt.y)){
      player.x=pt.x; player.y=pt.y; player.inv=60;
      spawnP(player.x+16,player.y+16,'#ffcc02',14);
      popup={text:'📍 Moved to exit path!',timer:80};
      return;
    }
  }
  // Fallback: any walkable tile
  for(let ty=1;ty<14;ty++) for(let tx=1;tx<19;tx++){
    const px=tx*TILE,py=ty*TILE;
    if(boxWalkable(map,px,py)){player.x=px;player.y=py;player.inv=60;spawnP(px+16,py+16,'#ffcc02',12);return;}
  }
}
unstuckBtn.addEventListener('touchstart',e=>{e.preventDefault();unstuckPlayer();},{passive:false});
unstuckBtn.addEventListener('click',()=>unstuckPlayer());

// Tool button — cycles active tool
const toolBtnEl=document.getElementById('toolBtn');
function cycleTool(){
  const avail=TOOL_CYCLE.filter(t=>{
    if(t==='peck') return true;
    if(t==='rod')   return tools.fishingRod;
    if(t==='flute') return tools.jungleFlute;
    if(t==='ball')  return tools.heroBall&&tools.heroBallCount>0;
    if(t==='tamale')return tools.tamaleCount>0;
    return false;
  });
  if(avail.length<=1)return;
  const idx=avail.indexOf(activeTool);
  activeTool=avail[(idx+1)%avail.length];
  popup={text:'🔄 '+toolName(activeTool),timer:80};
  if(activeTool==='rod') setTimeout(()=>{ popup={text:'🎣 Face an enemy, then tap PECK to cast the line!',timer:160}; },900);
  updateToolIcon();
  toolBtnEl&&toolBtnEl.classList.add('pressed');
  setTimeout(()=>toolBtnEl&&toolBtnEl.classList.remove('pressed'),120);
}
toolBtnEl&&toolBtnEl.addEventListener('touchstart',e=>{e.preventDefault();cycleTool();},{passive:false});
toolBtnEl&&toolBtnEl.addEventListener('click',()=>cycleTool());

// Map button — opens/closes notice board or shows minimap modal
const mapBtnEl=document.getElementById('mapBtn');
function pressMap(){
  if(airportOpen){airportOpen=false;return;}
  if(noticeBoardOpen){noticeBoardOpen=false;return;}
  if(shopOpen){shopOpen=false;return;}
  // Check if near a notice board
  const px=player.x+16,py=player.y+16;
  let found=false;
  NOTICE_BOARDS.forEach(nb=>{
    if(nb.screenCol!==screenCol||nb.screenRow!==screenRow)return;
    const town=getTown(nb.townId);if(!town||!town.unlocked)return;
    found=true; noticeBoardOpen=true; noticeBoardTownId=nb.townId;
  });
  if(!found) popup={text:'🗺️ Find a notice board in town!',timer:90};
}
mapBtnEl&&mapBtnEl.addEventListener('touchstart',e=>{e.preventDefault();pressMap();},{passive:false});
mapBtnEl&&mapBtnEl.addEventListener('click',()=>pressMap());

// Talk button — same as pecking near an NPC / shop / dialogue
let touchTalk=false;
const talkBtnEl=document.getElementById('talkBtn');
function pressTalk(){
  // If any UI is open — TALK closes it (toggle off)
  if(townDialogue.active){townDialogue.active=false;updateTalkBtn();return;}
  if(dialogue.active){dialogue.active=false;updateTalkBtn();return;}
  if(airportOpen){airportOpen=false;return;}
  if(shopOpen){shopOpen=false;updateTalkBtn();return;}
  if(noticeBoardOpen){noticeBoardOpen=false;updateTalkBtn();return;}
  // Nothing open — TALK triggers an interact peck
  touchTalk=true;
}
function updateTalkBtn(){
  const tb=document.getElementById('talkBtn');
  if(!tb)return;
  const anyOpen=townDialogue.active||dialogue.active||shopOpen||noticeBoardOpen;
  tb.classList.toggle('toggled',anyOpen);
  // Update label
  const lbl=tb.querySelector('.lbl');
  if(lbl)lbl.textContent=anyOpen?'CLOSE':'TALK';
  const icon=tb.querySelector('.icon');
  if(icon)icon.textContent=anyOpen?'✕':'💬';
}
talkBtnEl&&talkBtnEl.addEventListener('touchstart',e=>{e.preventDefault();pressTalk();talkBtnEl.classList.add('pressed');},{passive:false});
talkBtnEl&&talkBtnEl.addEventListener('touchend',()=>talkBtnEl.classList.remove('pressed'));
talkBtnEl&&talkBtnEl.addEventListener('click',()=>pressTalk());

// ═══════════════════════════════════════════════
//  TILE CONSTANTS
// ═══════════════════════════════════════════════
const T={SAND:0,PATH:1,JUNGLE:2,WATER:3,RUIN:4,RF:5,WALL:6,CLIFF:7,MG:8,MANGROVE:8,FLOWER:9,DOOR:10,CHEST:11,DEEP:12};

const WORLD_COLS=10,WORLD_ROWS=8;
const SCREENS=[];
// Auto-generated 10x8 world
(function(){

//  SCREEN CONNECTIVITY (which screen is adjacent)
//  screenAt(col,row)
// ═══════════════════════════════════════════════
function screenIndex(col,row){
  if(col<0||col>=WORLD_COLS||row<0||row>=WORLD_ROWS)return -1;
  return row*WORLD_COLS+col;
}

// Per-screen state (collected items, defeated enemies)
const screenState={}; // key="col,row" -> {gotCorns:Set, gotFeathers:Set, enemyHps:[]}

function getScreenState(col,row){
  const k=`${col},${row}`;
  if(!screenState[k]){
    const sc=SCREENS[screenIndex(col,row)];
    screenState[k]={
      gotCorns:new Set(),
      gotFeathers:new Set(),
      enemyHps:sc.enemies.map(()=>1),
      openedChests:new Set(),
      openDoors:new Set()
    };
  }
  return screenState[k];
}

function respawnAtSave(){
  screenCol=saveData.col;screenRow=saveData.row;
  player.x=saveData.px;player.y=saveData.py;
  player.hp=player.maxHp;player.atk=0;player.inv=80;
  score=saveData.score;cornCount=saveData.cornCount;
  Object.assign(skills,saveData.skills);Object.assign(tools,saveData.tools);

  jaguar.active=false;isScrolling=false;
  projectiles=[];dash.active=false;dash.cooldown=0;

// ── DANGER ZONES (floor hazard areas) ────────────────────────
// [{x,y,r,life,maxLife,color}]
let dangerZones = [];
function spawnDanger(x,y,r,life,color){
  dangerZones.push({x,y,r,life,maxLife:life,color});
}
function updateDangerZones(){
  dangerZones = dangerZones.filter(z=>z.life>0);
  dangerZones.forEach(z=>{
    z.life--;
    // hurt player if standing in zone
    if(player.inv<=0){
      const d=Math.hypot(player.x+16-z.x,player.y+16-z.y);
      if(d<z.r){
        if(!checkShieldBlock()) player.hp--;
        player.inv=90;
        spawnP(player.x+16,player.y+16,'#ff3333',8);
      }
    }
  });
}
function drawDangerZones(){
  dangerZones.forEach(z=>{
    const alpha=(z.life/z.maxLife)*0.55;
    const pulse=0.7+Math.sin(frame*0.15)*0.3;
    ctx.globalAlpha=alpha*pulse;
    ctx.fillStyle=z.color;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
    // warning ring
    ctx.strokeStyle=z.color;ctx.lineWidth=3;ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  });
}

// ── MINI BOSS BASE STATE ──────────────────────────────────────
function makeBoss(id,name,emoji,hp,color,screenCol,screenRow,startX,startY){
  return {
    id,name,emoji,color,
    hp,maxHp:hp,
    x:startX,y:startY,
    screenCol,screenRow,
    active:false,dead:false,defeated:false,
    phase:0,          // attack phase index
    st:0,             // stun/cooldown frames
    atkTimer:0,       // counts up to trigger next attack
    telegraph:0,      // countdown to actual strike (player warning)
    telegraphMax:0,
    telegraphType:'', // what's about to happen
    chargeDir:{x:0,y:0},  // for charge attacks
    invincible:false,
    entryShown:false, // intro dialogue shown
  };
}

// Boss room entry — trigger when player enters boss screen
function checkMiniBossEntry(){
  if(isScrolling||battleMode||inTownZone)return;
  MINI_BOSSES.forEach(b=>{
    if(b.screenCol!==screenCol||b.screenRow!==screenRow)return;
    if(b.defeated)return;
    if(!b.entryShown){
      b.entryShown=true;
      showSkillPopup(b.emoji,'⚠️ BOSS BATTLE!',b.name+' challenges you!','#ff3300');
      setTimeout(()=>enterBattle(b.id), 1200);
    }
  });
}

// ── BOSS UPDATE ───────────────────────────────────────────────
function updateMiniBosses(){
  if(isScrolling)return;
  MINI_BOSSES.forEach(b=>{
    if(b.screenCol!==screenCol||b.screenRow!==screenRow)return;
    if(!b.active||b.dead)return;

    // telegraph countdown
    if(b.telegraph>0){
      b.telegraph--;
      // draw telegraph warning
      drawTelegraph(b);
      if(b.telegraph===0) executeAttack(b);
      return;
    }

    if(b.st>0){b.st--;return;}

    b.atkTimer++;

    // drift toward player slowly between attacks
    const dx=player.x-b.x, dy=player.y-b.y;
    const dist=Math.hypot(dx,dy);
    const driftSpd=0.5;
    if(dist>60){
      const sc=currentScreen();
      const nx=b.x+dx/dist*driftSpd, ny=b.y+dy/dist*driftSpd;
      if(boxWalkable(sc.map,nx,b.y))b.x=nx;
      if(boxWalkable(sc.map,b.x,ny))b.y=ny;
    }

    // check peck hit
    if(player.atk>10&&!b.invincible){
      if(dist<52){
        const dmg=skills.doublePeck?2:1;
        b.hp-=dmg;
        b.st=30;
        spawnP(b.x+16,b.y+16,b.color,14);
        score+=100;
        if(b.hp<=0) defeatMiniBoss(b);
      }
    }
    // projectile hits
    projectiles.forEach(p=>{
      if(p.hit)return;
      const pd=Math.hypot(p.x+8-(b.x+16),p.y+8-(b.y+16));
      if(pd<40&&!b.invincible){
        p.hit=true; b.hp-=1; b.st=20;
        spawnP(b.x+16,b.y+16,b.color,8);
        if(b.hp<=0) defeatMiniBoss(b);
      }
    });
    // contact damage
    if(player.inv<=0&&dist<36){
      if(!checkShieldBlock()) player.hp--;
      player.inv=80;
      spawnP(player.x+16,player.y+16,'#ff3333',10);
    }

    // trigger attack
    if(b.atkTimer>=b.attackInterval){
      b.atkTimer=0;
      telegraphAttack(b);
    }

    // serpiente clone movement
    if(b.id==='serpiente'&&b.splitClones){
      b.splitClones=b.splitClones.filter(cl=>cl.hp>0);
      b.splitClones.forEach(cl=>{
        cl.x+=cl.vx; cl.y+=cl.vy;
        if(!boxWalkable(currentScreen().map,cl.x,cl.y)){cl.vx*=-1;cl.vy*=-1;}
        const cd=Math.hypot(player.x+16-(cl.x+8),player.y+16-(cl.y+8));
        if(player.inv<=0&&cd<28){if(!checkShieldBlock())player.hp--;player.inv=80;}
        if(player.atk>10&&cd<40){cl.hp=0;score+=50;spawnP(cl.x+8,cl.y+8,'#6c5ce7',8);}
      });
    }
  });
}

// ── TELEGRAPH (warning before attack) ────────────────────────
function telegraphAttack(b){
  const atk=b.attacks[b.attackIdx%b.attacks.length];
  b.attackIdx++;
  b.telegraphType=atk;

  if(atk==='stomp'||atk==='snapLeft'||atk==='snapRight'){
    b.telegraph=50; b.telegraphMax=50;
    // show red circle where stomp will land
    spawnDanger(player.x+16,player.y+16,64,50,'#ff330055');
    b.stompTarget={x:player.x+16,y:player.y+16};
  }
  else if(atk==='bigStomp'||atk==='snapBig'||atk==='diveBig'){
    b.telegraph=70; b.telegraphMax=70;
    spawnDanger(player.x+16,player.y+16,96,70,'#ff330088');
    b.stompTarget={x:player.x+16,y:player.y+16};
  }
  else if(atk==='slime'||atk==='poison'){
    b.telegraph=45; b.telegraphMax=45;
    // 3 danger zones in a spread
    for(let i=0;i<3;i++){
      const angle=Math.atan2(player.y-b.y,player.x-b.x)+(i-1)*0.6;
      const tx=b.x+Math.cos(angle)*120, ty=b.y+Math.sin(angle)*120;
      spawnDanger(tx,ty,48,120,'#22bb2255');
    }
  }
  else if(atk==='slimeLine'||atk==='poisonLine'){
    b.telegraph=55; b.telegraphMax=55;
    // line of zones from boss toward player
    const angle=Math.atan2(player.y-b.y,player.x-b.x);
    for(let i=1;i<=4;i++){
      const tx=b.x+Math.cos(angle)*i*80, ty=b.y+Math.sin(angle)*i*80;
      spawnDanger(tx,ty,40,130,'#22bb4488');
    }
  }
  else if(atk==='dive'){
    b.telegraph=60; b.telegraphMax=60;
    b.swoopTarget={x:player.x+16,y:player.y+16};
    // show target X
    spawnDanger(player.x+16,player.y+16,52,60,'#66666655');
  }
  else if(atk==='windBlast'){
    b.telegraph=65; b.telegraphMax=65;
    // 5 zones in arc
    for(let i=0;i<5;i++){
      const angle=(i/4)*Math.PI-Math.PI/2+Math.atan2(player.y-b.y,player.x-b.x);
      spawnDanger(b.x+Math.cos(angle)*100,b.y+Math.sin(angle)*100,44,130,'#44444455');
    }
  }
  else if(atk==='split'){
    b.telegraph=40; b.telegraphMax=40;
    popup={text:'🐍 It\'s splitting!',timer:80};
  }
}

function drawTelegraph(b){
  if(b.telegraphType===''||b.telegraph<=0)return;
  const prog=1-(b.telegraph/b.telegraphMax);
  const pulse=0.5+Math.sin(frame*0.3)*0.5;
  ctx.globalAlpha=0.3+pulse*0.4;
  ctx.fillStyle='#ff3300';
  ctx.font='bold 16px Fredoka One';ctx.textAlign='center';
  ctx.fillText('⚠️',b.x+16,b.y-20);
  // warning bar above boss
  ctx.fillStyle='#333';ctx.fillRect(b.x-10,b.y-32,52,6);
  ctx.fillStyle='#ff6600';ctx.fillRect(b.x-10,b.y-32,52*prog,6);
  ctx.globalAlpha=1;ctx.textAlign='left';
}

// ── EXECUTE ATTACK ────────────────────────────────────────────
function executeAttack(b){
  b.telegraphType='';
  b.st=25;
  const atk=b.attacks[(b.attackIdx-1)%b.attacks.length];

  if(atk==='stomp'||atk==='bigStomp'){
    const r=atk==='bigStomp'?100:70;
    spawnDanger(b.stompTarget.x,b.stompTarget.y,r,60,'#ff4400aa');
    spawnP(b.stompTarget.x,b.stompTarget.y,'#ff4400',18);
    // screen shake effect
    screenShake=8;
  }
  else if(atk==='snapLeft'||atk==='snapRight'){
    spawnDanger(b.stompTarget.x,b.stompTarget.y,80,50,'#00aa44aa');
    spawnP(b.stompTarget.x,b.stompTarget.y,'#00aa44',14);
    screenShake=5;
  }
  else if(atk==='snapBig'||atk==='diveBig'){
    spawnDanger(b.stompTarget.x,b.stompTarget.y,110,70,'#ff440088');
    spawnP(b.stompTarget.x,b.stompTarget.y,'#ff4400',24);
    screenShake=12;
  }
  else if(atk==='slime'||atk==='slimeLine'){
    // zones already placed in telegraph — they persist
    spawnP(b.x+16,b.y+16,'#22bb22',16);
  }
  else if(atk==='poison'||atk==='poisonLine'){
    spawnP(b.x+16,b.y+16,'#6c5ce7',16);
  }
  else if(atk==='dive'||atk==='diveBig'){
    // Boss swoops to player position
    b.x=b.swoopTarget.x-16; b.y=b.swoopTarget.y-16;
    spawnDanger(b.swoopTarget.x,b.swoopTarget.y,atk==='diveBig'?90:60,40,'#66666688');
    spawnP(b.x+16,b.y+16,'#636e72',18);
    screenShake=6;
  }
  else if(atk==='windBlast'){
    spawnP(b.x+16,b.y+16,'#636e72',20);
    screenShake=4;
  }
  else if(atk==='split'){
    if(!b.split&&b.hp<=4){
      b.split=true;
      for(let i=0;i<2;i++){
        b.splitClones.push({
          x:b.x+(i===0?-40:40),y:b.y,
          vx:(i===0?-0.8:0.8),vy:0.3,
          hp:2,color:b.color
        });
      }
      spawnP(b.x+16,b.y+16,'#6c5ce7',20);
      popup={text:'🐍 It split into 3!',timer:90};
    }
  }
}

// Screen shake
let screenShake=0;

// ── DEFEAT MINI BOSS ──────────────────────────────────────────
function defeatMiniBoss(b){
  b.dead=true; b.defeated=true; b.active=false;
  jagSeals[b.sealKey]=true;
  dangerZones=[];
  score+=500;
  // Spawn particles at boss position (battle screen or world)
  const px=battleMode?BATTLE.bossDrawX+20:b.x+16;
  const py=battleMode?BATTLE.bossDrawY+20:b.y+16;
  spawnBattleParticles(px,py,'#ffcc02',40);
  for(let i=0;i<4;i++) setTimeout(()=>spawnBattleParticles(px,py,'#ffcc02',20),i*250);
  // heal player
  player.hp=Math.min(player.maxHp,player.hp+2);
  // Store defeat quote for result screen
  BATTLE.defeatQuote=b.defeat;
  BATTLE.defeatEmoji=b.emoji;
  BATTLE.sealName=b.sealKey;
  // Trigger cutscene after short delay
  const sealCount=Object.values(jagSeals).filter(Boolean).length;
  setTimeout(()=>startJagCutscene(sealCount), 400);
}

const CS_EXPRESSIONS = {
  normal: {eyeH:8, browY:0, mouthCurve:0, sweatDrop:false, shakeX:0},
  smug:   {eyeH:5, browY:-3, mouthCurve:6, sweatDrop:false, shakeX:0},
  sweat:  {eyeH:9, browY:2, mouthCurve:-2, sweatDrop:true, shakeX:0},
  rage:   {eyeH:6, browY:5, mouthCurve:-4, sweatDrop:false, shakeX:3},
  cope:   {eyeH:7, browY:1, mouthCurve:2, sweatDrop:true, shakeX:1},
  panic:  {eyeH:11, browY:4, mouthCurve:-6, sweatDrop:true, shakeX:5},
  cool:   {eyeH:4, browY:-2, mouthCurve:4, sweatDrop:false, shakeX:0},
};

function startJagCutscene(sealCount){
  cutscene.active=true;
  cutscene.tapped=false;
  cutscene._tapLock=false;
  cutscene.sealCount=sealCount;
  cutscene.frame=0;
  cutscene.phase=0;
  cutscene.done=false;
}

function advanceCutscene(){
  if(!cutscene.active)return;
  const beats=JAG_CUTSCENES[cutscene.sealCount];
  if(!beats)return;
  cutscene.phase++;
  cutscene.frame=0;
  if(cutscene.phase>=beats.length){
    cutscene.active=false;
    cutscene.done=true;
    const btn=document.getElementById('cutsceneNextBtn');
    if(btn) btn.style.display='none';
    if(battleMode){ BATTLE.resultTimer=120; } // now start the exit countdown
  }
}

function updateCutscene(){
  if(!cutscene.active)return;
  cutscene.frame++;
  // Show/hide dedicated NEXT button
  const btn=document.getElementById('cutsceneNextBtn');
  if(btn) btn.style.display='block';
}

function drawCutscene(){
  if(!cutscene.active)return;
  const beats=JAG_CUTSCENES[cutscene.sealCount];
  if(!beats)return;
  const beat=beats[Math.min(cutscene.phase,beats.length-1)];
  const expr=CS_EXPRESSIONS[beat.expr]||CS_EXPRESSIONS.normal;
  const f=cutscene.frame;

  // Dark cinematic overlay
  ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,GW,GH);

  // Letterbox bars
  ctx.fillStyle='#000'; ctx.fillRect(0,0,GW,60); ctx.fillRect(0,GH-60,GW,60);

  // Background — jungle silhouette
  ctx.fillStyle='#0d1f0d';
  for(let i=0;i<8;i++){
    ctx.beginPath();
    ctx.moveTo(i*90,GH-60);
    ctx.lineTo(i*90+20,GH-180-i*10);
    ctx.lineTo(i*90+45,GH-60);
    ctx.fill();
  }

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<20;i++){
    const sx=(i*137)%GW, sy=70+(i*53)%100;
    const twinkle=0.3+Math.sin(f*0.05+i)*0.7;
    ctx.globalAlpha=twinkle;
    ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  const isJag=beat.speaker==='jag';
  const shk=isJag?(Math.sin(f*0.8)*expr.shakeX):0;

  if(isJag){
    // ── EL JAGUAR portrait (left side, large) ──
    const cx=160+shk, cy=280;

    // Body glow based on expression
    const glowCol=beat.expr==='rage'?'rgba(255,50,0,0.3)':beat.expr==='panic'?'rgba(255,150,0,0.25)':'rgba(108,92,231,0.2)';
    ctx.fillStyle=glowCol;
    ctx.beginPath();ctx.arc(cx,cy,90,0,Math.PI*2);ctx.fill();

    // Draw big jaguar
    ctx.save(); ctx.translate(cx-20,cy-60); ctx.scale(2.2,2.2);
    drawLagarto(0,0,f,8,8); // reuse lagarto as base — replace with jaguar look below
    ctx.restore();

    // Override with jaguar-specific look on top
    // Big purple body
    ctx.fillStyle='#5a3e8a';
    ctx.beginPath();ctx.ellipse(cx,cy+10,52,42,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#7b5ea7';
    ctx.beginPath();ctx.ellipse(cx,cy+14,36,28,0,0,Math.PI*2);ctx.fill();

    // Head
    ctx.fillStyle='#5a3e8a';
    ctx.beginPath();ctx.arc(cx,cy-38,36,0,Math.PI*2);ctx.fill();
    // Ear tufts
    ctx.fillStyle='#4a2e7a';
    ctx.beginPath();ctx.moveTo(cx-30,cy-62);ctx.lineTo(cx-42,cy-88);ctx.lineTo(cx-16,cy-70);ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+30,cy-62);ctx.lineTo(cx+42,cy-88);ctx.lineTo(cx+16,cy-70);ctx.fill();
    // Spots
    ctx.fillStyle='rgba(0,0,0,0.2)';
    [[cx-18,cy-28,6],[cx+14,cy-24,5],[cx,cy-44,4],[cx-24,cy+8,5],[cx+20,cy+4,5]].forEach(([sx,sy,sr])=>{
      ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    });

    // Eyes with expression
    const eyeOff=beat.expr==='rage'?3:beat.expr==='panic'?-2:0;
    ctx.fillStyle='#fdcb6e';
    ctx.beginPath();ctx.ellipse(cx-14,cy-42+eyeOff,9,expr.eyeH/2+3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+14,cy-42+eyeOff,9,expr.eyeH/2+3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a0a2e';
    ctx.beginPath();ctx.arc(cx-14,cy-42+eyeOff,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+14,cy-42+eyeOff,4,0,Math.PI*2);ctx.fill();

    // Eyebrows
    ctx.strokeStyle='#1a0a2e'; ctx.lineWidth=3; ctx.lineCap='round';
    const bY=cy-58+expr.browY;
    ctx.beginPath();ctx.moveTo(cx-22,bY);ctx.lineTo(cx-6,bY+(beat.expr==='rage'?4:-2));ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+22,bY);ctx.lineTo(cx+6,bY+(beat.expr==='rage'?4:-2));ctx.stroke();

    // Mouth
    ctx.strokeStyle='#1a0a2e'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(cx, cy-22, 10, 0.2, Math.PI-0.2, expr.mouthCurve<0);
    ctx.stroke();

    // Sweat drop
    if(expr.sweatDrop){
      const sd=Math.abs(Math.sin(f*0.1));
      ctx.fillStyle='rgba(100,180,255,'+sd+')';
      ctx.beginPath();ctx.arc(cx+38,cy-55,5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(cx+38,cy-50);ctx.lineTo(cx+34,cy-38);ctx.lineTo(cx+42,cy-38);ctx.closePath();ctx.fill();
    }

    // Expression emoji badge
    const exprEmojis={smug:'😏',sweat:'😅',rage:'😤',cope:'🤡',panic:'😱',normal:'😐'};
    ctx.font='22px Arial'; ctx.textAlign='center';
    ctx.fillText(exprEmojis[beat.expr]||'😐', cx+70, cy-60);

    // Name tag
    ctx.fillStyle='rgba(90,62,138,0.8)';
    ctx.beginPath();ctx.roundRect(cx-55,cy+58,110,24,8);ctx.fill();
    ctx.fillStyle='#ffcc02'; ctx.font='bold 12px Fredoka One'; ctx.textAlign='center';
    ctx.fillText('🐆 El Jaguar', cx, cy+75);

  } else {
    // ── CHICKEN portrait (right side) ──
    const cx=480, cy=280;
    ctx.fillStyle='rgba(255,204,2,0.15)';
    ctx.beginPath();ctx.arc(cx,cy,70,0,Math.PI*2);ctx.fill();
    ctx.save(); ctx.translate(cx-20,cy-30); ctx.scale(2.5,2.5);
    drawChicken(0,0,3,0,f);
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath();ctx.roundRect(cx-45,cy+50,90,24,8);ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 11px Fredoka One'; ctx.textAlign='center';
    ctx.fillText('🐔 You', cx, cy+67);
  }

  // ── Speech bubble ──
  const bubbleY=isJag?100:100;
  const bubbleX=isJag?240:40;
  const bubbleW=GW-bubbleX-20;
  const tailX=isJag?200:480;

  // Bubble
  ctx.fillStyle='#fffde7';
  ctx.beginPath();ctx.roundRect(bubbleX,bubbleY,bubbleW,100,14);ctx.fill();
  ctx.strokeStyle=isJag?'#5a3e8a':'#ffcc02'; ctx.lineWidth=3; ctx.stroke();

  // Tail pointing to speaker
  ctx.fillStyle='#fffde7';
  ctx.beginPath();
  ctx.moveTo(tailX,bubbleY+100);
  ctx.lineTo(tailX+(isJag?-20:20),bubbleY+122);
  ctx.lineTo(tailX+(isJag?10:-10),bubbleY+100);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=isJag?'#5a3e8a':'#ffcc02'; ctx.lineWidth=2; ctx.stroke();

  // Text — word wrap in bubble
  ctx.fillStyle='#1a0a2e'; ctx.font='bold 16px Fredoka One'; ctx.textAlign='left';
  const words=beat.text.split(' '); let line='',ly=bubbleY+28, maxW=bubbleW-28;
  words.forEach(w=>{
    const test=line+(line?' ':'')+w;
    if(ctx.measureText(test).width>maxW&&line){
      ctx.fillText(line,bubbleX+14,ly); line=w; ly+=22;
    } else line=test;
  });
  ctx.fillText(line,bubbleX+14,ly);

  // Tap to continue hint
  // Big clear tap hint — slow pulse, larger text, visible button prompt
  const tapAlpha=0.6+Math.sin(f*0.05)*0.4;
  ctx.globalAlpha=tapAlpha;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath();ctx.roundRect(GW/2-110,GH-52,220,34,10);ctx.fill();
  ctx.strokeStyle='#ffcc02';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffcc02'; ctx.font='bold 15px Fredoka One'; ctx.textAlign='center';
  ctx.fillText('👆 TAP TO READ NEXT', GW/2, GH-30);
  ctx.globalAlpha=1;

  // Seal count badge top-right
  const got=Object.values(jagSeals).filter(Boolean).length;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.beginPath();ctx.roundRect(GW-90,66,80,28,8);ctx.fill();
  ctx.fillStyle='#ffcc02'; ctx.font='bold 12px Fredoka One'; ctx.textAlign='center';
  ctx.fillText('🏅 '+got+'/4',GW-50,85);
  ctx.textAlign='left';
}

// ── ENTER BATTLE ──────────────────────────────────────────────
function enterBattle(bossId){
  battleMode=true; battleBossId=bossId; battleState='intro';
  const boss=MINI_BOSSES.find(b=>b.id===bossId);
  BATTLE.bossHp=boss.maxHp; BATTLE.bossMaxHp=boss.maxHp;
  BATTLE.shotsLeft=3; BATTLE.reloadTimer=0;
  BATTLE.bossProjectiles=[]; BATTLE.bossStun=0;
  BATTLE.bossTurnTimer=0; BATTLE.bossAttackPhase=0; BATTLE.bossTelegraph=0;
  BATTLE.chick=null; BATTLE.blocks=[];
  BATTLE.aimDx=0.6; BATTLE.aimDy=-0.8; // aim upper-right by default
  BATTLE.introTimer=80; BATTLE.resultTimer=0; BATTLE.totalDamage=0;
  // Compute stable layout values now
  BATTLE.groundY=Math.round(GH*0.74);
  BATTLE.bossDrawX=Math.round(GW*0.64);
  BATTLE.bossDrawY=Math.round(GH*0.44);
  BATTLE.bgScrollX=0; BATTLE.joyWasHeld=false; BATTLE.pendingShot=null;
  buildBattleBlocks(bossId);
  setTimeout(()=>{ if(battleMode) battleState='aim'; }, 1800);
}

function buildBattleBlocks(bossId){
  // All positions computed at draw-time from BATTLE.groundY

      {fx:0.39,h:40,w:40,hp:2,type:'wood'}, {fx:0.39,h2:40,w:40,hp:2,type:'wood',stack:1},

    ],
    cocodrilo:[

      {fx:0.52,h:42,w:44,hp:3,type:'stone'}, {fx:0.52,h2:40,w:44,hp:2,type:'wood',stack:1},

    ],
    aguila:[
      {fx:0.34,h:44,w:22,hp:4,type:'stone'},
      {fx:0.38,h:90,w:26,hp:4,type:'stone'},
      {fx:0.58,h:90,w:26,hp:4,type:'stone'},
      {fx:0.38,h:26,w:138,hp:2,type:'stone',stack:'top'},
      {fx:0.43,h:86,w:70,hp:2,type:'wood'},
    ],
    serpiente:[
      {fx:0.34,h:44,w:22,hp:3,type:'crystal'},
      {fx:0.38,h:44,w:34,hp:2,type:'crystal'}, {fx:0.38,h2:42,w:34,hp:2,type:'crystal',stack:1},
      {fx:0.46,h:44,w:34,hp:2,type:'crystal'}, {fx:0.46,h2:42,w:34,hp:2,type:'crystal',stack:1},
      {fx:0.54,h:44,w:34,hp:3,type:'crystal'}, {fx:0.54,h2:42,w:34,hp:2,type:'crystal',stack:1},

// ── UPDATE BATTLE ─────────────────────────────────────────────
function updateBattle(){
  if(!battleMode)return;
  BATTLE.bgScrollX = (BATTLE.bgScrollX + 0.3) % GW;

  // Update aim visuals while joystick held
  if(joyActive && Math.hypot(joyDx,joyDy)>0.05){
    BATTLE.aimDx = joyDx;
    BATTLE.aimDy = joyDy;
  }
  // Keyboard aim
  if(keys['ArrowLeft']||keys['a']||keys['A']){ BATTLE.aimDx=Math.max(-1,BATTLE.aimDx-0.08); BATTLE.joyWasHeld=true; }
  if(keys['ArrowRight']||keys['d']||keys['D']){ BATTLE.aimDx=Math.min(1,BATTLE.aimDx+0.08); BATTLE.joyWasHeld=true; }
  if(keys['ArrowUp']||keys['w']||keys['W']){ BATTLE.aimDy=Math.max(-1,BATTLE.aimDy-0.08); BATTLE.joyWasHeld=true; }
  if(keys['ArrowDown']||keys['s']||keys['S']){ BATTLE.aimDy=Math.min(1,BATTLE.aimDy+0.08); BATTLE.joyWasHeld=true; }

  // Consume pending shot the moment we enter aim state
  if(battleState==='aim' && BATTLE.pendingShot){
    const ps=BATTLE.pendingShot;
    BATTLE.pendingShot=null;
    BATTLE.aimDx=ps.dx; BATTLE.aimDy=ps.dy;
    fireBattleChicken();
  }

  if(battleState==='intro'){
    BATTLE.introTimer--;
    if(BATTLE.introTimer<=0)battleState='aim';
    return;
  }
  if(battleState==='win'||battleState==='lose'){
    if(battleState==='win'&&cutscene.active) return; // wait for cutscene to finish
    BATTLE.resultTimer--;
    if(BATTLE.resultTimer<=0) exitBattle();
    return;
  }
  if(battleState==='reload'){
    BATTLE.reloadTimer--;
    if(BATTLE.reloadTimer<=0){
      BATTLE.shotsLeft=3;
      battleState='aim';
      popup={text:'🔄 Reloaded! 3 shots ready!',timer:80};
    }
    return;
  }

  // Update flying chicken
  if(battleState==='flying'&&BATTLE.chick){
    const ch=BATTLE.chick;
    ch.vx*=0.995; ch.vy+=0.28; // gravity
    ch.x+=ch.vx; ch.y+=ch.vy;
    ch.trail.push({x:ch.x,y:ch.y});
    if(ch.trail.length>18)ch.trail.shift();

    // Hit ground
    if(ch.y>BATTLE.groundY-8){
      spawnBattleParticles(ch.x,BATTLE.groundY,'#c8a050',8);
      BATTLE.chick=null;
      onShotLanded(false);
      return;
    }
    // Off screen
    if(ch.x>GW+40||ch.x<-40){
      BATTLE.chick=null; onShotLanded(false); return;
    }

    // Hit blocks
    BATTLE.blocks.forEach(bl=>{
      if(bl.hp<=0||!ch)return;
      if(ch.x>bl.x&&ch.x<bl.x+bl.w&&ch.y>bl.y&&ch.y<bl.y+bl.h){
        bl.hp--;
        bl.shakeX=6;
        spawnBattleParticles(ch.x,ch.y,blockHitColor(bl.type),10);
        // Spicy peck — fire damage
        if(ch.skill==='spicy'){bl.hp--; spawnBattleParticles(ch.x,ch.y,'#ff4400',8);}
        // Bounce on double peck
        if(ch.skill==='double'&&ch.bounces>0){ch.vx*=-0.6;ch.vy*=-0.4;ch.bounces--;}
        else{ BATTLE.chick=null; onShotLanded(false); }
        if(bl.hp<=0) spawnBattleParticles(bl.x+bl.w/2,bl.y+bl.h/2,'#ffcc02',16);
      }
    });
    BATTLE.blocks=BATTLE.blocks.filter(b=>b.hp>0||b.exploding);

    // Hit boss
    if(BATTLE.chick){
      const boss=MINI_BOSSES.find(b=>b.id===battleBossId);
      const bx=BATTLE.bossDrawX, by=BATTLE.bossDrawY;
      if(BATTLE.chick.x>bx-30&&BATTLE.chick.x<bx+50&&BATTLE.chick.y>by-20&&BATTLE.chick.y<by+60){
        const dmg=BATTLE.chick.skill==='spicy'?2:BATTLE.chick.skill==='double'?2:1;
        BATTLE.bossHp-=dmg;
        BATTLE.bossStun=40;
        BATTLE.totalDamage+=dmg;
        spawnBattleParticles(bx+10,by+20,boss.color,20);
        BATTLE.chick=null;
        if(BATTLE.bossHp<=0){
          battleState='win'; BATTLE.resultTimer=180;
          defeatMiniBoss(boss);
          return;
        }
        onShotLanded(true);
      }
    }
  }

  // Block shake decay
  BATTLE.blocks.forEach(bl=>{if(bl.shakeX>0){bl.shakeX*=0.6;if(bl.shakeX<0.5)bl.shakeX=0;}});

  // ── TURN STATE MACHINE ───────────────────────────────────────
  // bossTurn: brief pause, then boss attacks
  if(battleState==='bossTurn'){
    BATTLE.bossTurnTimer--;
    if(BATTLE.bossTurnTimer<=0) startBossAttack();
    return;
  }

  // bossAttack: telegraph then fire
  if(battleState==='bossAttack'){
    BATTLE.bossTelegraph--;
    if(BATTLE.bossTelegraph<=0&&BATTLE.bossAttackPhase===1){
      BATTLE.bossAttackPhase=2;
      fireBossAttack();
    }
  }

  // Update boss projectiles — when all gone, return to player turn
  if(battleState==='bossAttack'&&BATTLE.bossAttackPhase===2){
    if(!BATTLE.bossAttackTimeout) BATTLE.bossAttackTimeout=300; // 5s max
    BATTLE.bossAttackTimeout--;
    BATTLE.bossProjectiles=BATTLE.bossProjectiles.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.15;
      if(p.x<110&&p.y>BATTLE.groundY-80&&p.y<BATTLE.groundY+20){
        if(player.inv<=0){ if(!checkShieldBlock()) player.hp--; player.inv=60;
          spawnBattleParticles(90,BATTLE.groundY-40,'#ff3333',10); }
        return false;
      }
      return p.x>-20&&p.x<GW+20&&p.y<BATTLE.groundY+40;
    });
    // Once all projectiles gone (or timeout) → player's turn
    if(BATTLE.bossProjectiles.length===0||BATTLE.bossAttackTimeout<=0){
      BATTLE.bossAttackTimeout=0;
      if(player.hp<=0){ battleState='lose'; BATTLE.resultTimer=180; return; }
      if(BATTLE.shotsLeft<=0){
        BATTLE.shotsLeft=3;
        popup={text:'🔄 Your turn! 3 shots loaded.',timer:100};
      } else {
        popup={text:'🐔 Your turn! Aim and fire.',timer:90};
      }
      battleState='aim';
    }
  }
}

function onShotLanded(hitBoss){
  BATTLE.chick = null;
  BATTLE.shotsLeft--;

  if(BATTLE.bossHp<=0) return; // win already handled
  if(player.hp<=0){ battleState='lose'; BATTLE.resultTimer=180; return; }

  if(BATTLE.shotsLeft<=0){
    // Out of shots — boss takes its turn then reload
    battleState='bossTurn';
    BATTLE.bossTurnTimer=60; // brief pause before boss attacks
    popup={text:'Boss\'s turn!',timer:80};
  } else {
    // Still have shots — boss takes its turn first, then player aims again
    battleState='bossTurn';
    BATTLE.bossTurnTimer=60;
    if(hitBoss){
      popup={text:'🎯 Hit! Boss retaliates...', timer:90};
    } else {
      popup={text:'Miss! Boss\'s turn...', timer:80};
    }
  }
}

function startBossAttack(){
  battleState='bossAttack';
  BATTLE.bossAttackPhase=1;
  BATTLE.bossTelegraph=55;
  BATTLE.bossProjectiles=[];
  BATTLE.bossAttackTimeout=300;
  popup={text:'⚠️ Boss\'s turn — DODGE!',timer:60};
}

function fireBossAttack(){
  BATTLE.bossAttackPhase=2; // stay at 2 so projectile loop runs
  const bx=BATTLE.bossDrawX, by=BATTLE.bossDrawY+20;
  const type=battleBossId;
  // Different attack patterns per boss
  if(type==='lagarto'){
    // 3 bouncing rocks in arc
    for(let i=0;i<3;i++) BATTLE.bossProjectiles.push({x:bx,y:by,vx:-6-i*0.5,vy:-4+i*1.5,type:'rock'});
  } else if(type==='cocodrilo'){
    // Wide snap — big slow projectile
    BATTLE.bossProjectiles.push({x:bx,y:by,vx:-5,vy:-2,type:'snap',big:true});
    BATTLE.bossProjectiles.push({x:bx,y:by-30,vx:-4.5,vy:-3,type:'snap'});
  } else if(type==='aguila'){
    // Dive bomb — fast straight shot
    BATTLE.bossProjectiles.push({x:bx,y:by-80,vx:-8,vy:2,type:'talon'});
    BATTLE.bossProjectiles.push({x:bx,y:by-40,vx:-7,vy:0,type:'talon'});
  } else if(type==='serpiente'){
    // Poison spray — 4 directions
    for(let i=0;i<4;i++){
      const ang=-Math.PI+i*0.4;
      BATTLE.bossProjectiles.push({x:bx,y:by,vx:Math.cos(ang)*6,vy:Math.sin(ang)*4-2,type:'poison'});
    }
  }
  // bossAttackPhase stays at 2 — projectiles update loop handles returning to aim
  popup={text:'⚠️ Dodge the attack!',timer:70};
}

// ── BATTLE PARTICLES ─────────────────────────────────────────
let battleParticles=[];
function spawnBattleParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*4;
    battleParticles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,col,life:30,ml:30});
  }
}
function updateBattleParticles(){
  battleParticles=battleParticles.filter(p=>p.life>0);
  battleParticles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;});
}

function blockHitColor(type){
  return type==='stone'?'#a08060':type==='wood'?'#8B4513':type==='crystal'?'#a29bfe':'#c8a050';
}

// ── FIRE CHICKEN ─────────────────────────────────────────────
function fireBattleChicken(){
  if(battleState!=='aim'||BATTLE.shotsLeft<=0)return;
  const power=Math.max(0.3, Math.min(1,Math.hypot(BATTLE.aimDx,BATTLE.aimDy)));
  const spd=14*power+8;
  // Launch direction = opposite of pull
  const nx=-BATTLE.aimDx, ny=-BATTLE.aimDy;
  const len=Math.hypot(nx,ny)||1;
  const skill=skills.spicyPeck?'spicy':skills.doublePeck?'double':'normal';
  const G2=BATTLE.groundY;
  const forkTop2=G2-90-30, seatY2=forkTop2+6;
  // Spawn at seat — slight offset in launch direction so it clears the slingshot immediately
  const launchOffX=(nx/len)*10, launchOffY=(ny/len)*10;
  BATTLE.chick={
    x:90+launchOffX, y:seatY2+launchOffY,
    vx:(nx/len)*spd, vy:(ny/len)*spd,
    skill, trail:[], bounces:skill==='double'?2:0,
    active:true,
  };
  battleState='flying';
  // Reset aim so next shot requires a fresh pull
  BATTLE.aimDx=0; BATTLE.aimDy=0; BATTLE.joyWasHeld=false;
  spawnBattleParticles(90, seatY2,'#ffcc02',8);
}

// ── EXIT BATTLE ───────────────────────────────────────────────
function exitBattle(){
  battleMode=false;
  battleBossId=null;
  battleState='aim';
  battleParticles=[];
  BATTLE.bossProjectiles=[];
  BATTLE.chick=null;
}

// ── DRAW BATTLE ───────────────────────────────────────────────
function drawBattle(){
  if(!battleMode)return;
  const theme=ARENA_THEMES[battleBossId]||ARENA_THEMES.lagarto;
  const G=BATTLE.groundY;

  // Clear full canvas
  ctx.fillStyle=theme.bg1; ctx.fillRect(0,0,GW,GH);

  // Background circles
  ctx.globalAlpha=0.12;
  for(let i=0;i<5;i++){
    const bx=((i*140+BATTLE.bgScrollX*0.3)%GW);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(bx,50+i*25,22+i*8,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Ground — fills from G to bottom of canvas
  ctx.fillStyle=theme.groundColor; ctx.fillRect(0,G,GW,GH-G);
  ctx.fillStyle=theme.groundTop;   ctx.fillRect(0,G,GW,10);

  // Blocks
  BATTLE.blocks.forEach(bl=>drawBlock(bl,theme));

  // Slingshot
  drawSlingshot();

  // Trajectory preview
  if(battleState==='aim'&&!BATTLE.chick){
    const power=Math.hypot(BATTLE.aimDx,BATTLE.aimDy);
    if(power>0.08) drawTrajectory();
  }

  // Flying chicken
  if(BATTLE.chick) drawBattleChicken();

  // Boss
  drawBattleBoss();

  // Boss projectiles
  BATTLE.bossProjectiles.forEach(p=>drawBossProjectile(p));

  // Particles
  battleParticles.forEach(p=>{
    const al=p.life/p.ml;
    ctx.fillStyle=p.col+Math.floor(al*255).toString(16).padStart(2,'0');
    ctx.beginPath();ctx.arc(p.x,p.y,4*al,0,Math.PI*2);ctx.fill();
  });

  // HUD (always on top)
  drawBattleHUD();

  // Intro covers everything
  if(battleState==='intro'){ drawBattleIntro(); return; }

  // Result covers everything
  if(battleState==='win'||battleState==='lose'){
    drawBattleResult();
    if(cutscene.active) drawCutscene();
    return;
  }

  // Telegraph flash
  if(battleState==='bossAttack'&&BATTLE.bossAttackPhase===1){
    ctx.globalAlpha=0.25+Math.sin(frame*0.4)*0.2;
    ctx.fillStyle='#ff0000'; ctx.fillRect(0,0,GW,GH);
    ctx.globalAlpha=1;
    drawAutoBox('⚠️ DODGE! Boss attacking!',GW/2,GH/2-40,
      {font:'bold 16px Fredoka One',color:'#ff3300',bg:'rgba(0,0,0,0.85)',maxW:GW-40});
  }
}

function drawSlingshot(){
  const G=BATTLE.groundY;
  // Anchor slingshot at left side, sitting ON the ground
  const sx=90;           // center x of sling
  const postH=90;        // post height
  const forkH=30;        // fork arm length above post top
  const postTop=G-postH; // top of main post
  const forkTop=postTop-forkH; // tip of fork arms

  // Post (sits on ground)
  ctx.fillStyle='#6B4226';
  ctx.fillRect(sx-7, postTop, 14, postH);

  // Left fork arm
  ctx.fillStyle='#8B5E3C';
  ctx.fillRect(sx-24, forkTop, 10, forkH+8);
  // Right fork arm
  ctx.fillRect(sx+14, forkTop, 10, forkH+8);

  // Seat position (between fork tips)
  const seatX=sx, seatY=forkTop+6;

  if(battleState==='aim'&&!BATTLE.chick){
    // Pull-back: opposite of aim direction, max 50px
    const power=Math.min(1,Math.hypot(BATTLE.aimDx,BATTLE.aimDy));
    const pullX=(BATTLE.aimDx||0), pullY=(BATTLE.aimDy||0); // pull matches joystick direction
    const pLen=Math.hypot(pullX,pullY)||1;
    const px=seatX+(pullX/pLen)*power*50;
    const py=seatY+(pullY/pLen)*power*50;

    // Rubber bands from fork tips to chicken
    ctx.strokeStyle='#8B4513'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx-19,forkTop+4); ctx.lineTo(px,py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+19,forkTop+4); ctx.lineTo(px,py); ctx.stroke();

    // Chicken in sling (centred on pull point)
    drawChicken(px-16, py-16, 2, 0, frame);

    // Power ring
    const ringCol=power>0.65?'#ff3300':power>0.35?'#ffaa00':'#44cc44';
    ctx.strokeStyle=ringCol; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px,py,18,0,Math.PI*2); ctx.stroke();

  } else if(!BATTLE.chick){
    // Idle — chicken resting between forks
    ctx.strokeStyle='#8B4513'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(sx-19,forkTop+4); ctx.lineTo(seatX,seatY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+19,forkTop+4); ctx.lineTo(seatX,seatY); ctx.stroke();
    drawChicken(seatX-16, seatY-32, 2, 0, frame);
  }
}

function drawTrajectory(){
  const G=BATTLE.groundY;
  const sx=90, seatY=G-90-30+6; // matches slingshot geometry
  const power=Math.min(1,Math.hypot(BATTLE.aimDx,BATTLE.aimDy));
  const pullX=(BATTLE.aimDx||0), pullY=(BATTLE.aimDy||0); // pull matches joystick direction
  const pLen=Math.hypot(pullX,pullY)||1;
  const px=sx+(pullX/pLen)*power*50, py=seatY+(pullY/pLen)*power*50;
  const spd=14*power+8;
  // Launch = opposite of pull direction
  const launchX=-(BATTLE.aimDx||0), launchY=-(BATTLE.aimDy||0);
  const lLen=Math.hypot(launchX,launchY)||1;
  let x=px, y=py;
  let vx=(launchX/lLen)*spd, vy=(launchY/lLen)*spd;
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<30;i++){
    x+=vx; y+=vy; vy+=0.28; vx*=0.995;
    if(y>G||x>GW) break;
    if(i%2===0){ ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); }
  }
}

function drawBlock(bl,theme){
  if(bl.hp<=0)return;
  const x=bl.x+bl.shakeX, y=bl.y;
  const dmgRatio=bl.hp/bl.maxHp;
  const col=bl.type==='stone'?theme.blockColors[0]
            :bl.type==='wood'?theme.blockColors[1]
            :bl.type==='crystal'?'#a29bfe'
            :theme.blockColors[2];
  ctx.fillStyle=col; ctx.fillRect(x,y,bl.w,bl.h);
  if(dmgRatio<0.7){
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x+bl.w*0.3,y+4); ctx.lineTo(x+bl.w*0.55,y+bl.h*0.65);
    ctx.lineTo(x+bl.w*0.75,y+bl.h*0.4); ctx.stroke();
  }
  if(dmgRatio<0.35){
    ctx.strokeStyle='rgba(255,80,0,0.6)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x+4,y+bl.h*0.3); ctx.lineTo(x+bl.w*0.45,y+bl.h*0.85); ctx.stroke();
  }
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1; ctx.strokeRect(x,y,bl.w,bl.h);
}

function drawBattleBoss(){
  const boss=MINI_BOSSES.find(b=>b.id===battleBossId);
  if(!boss)return;
  const G=BATTLE.groundY;
  const bx=BATTLE.bossDrawX, by=BATTLE.bossDrawY;

  // Telegraph glow
  if(battleState==='bossAttack'&&BATTLE.bossAttackPhase===1){
    const pg=0.4+Math.sin(frame*0.4)*0.35;
    ctx.fillStyle=`rgba(255,40,0,${pg})`;
    ctx.beginPath();ctx.arc(bx+20,by+30,55,0,Math.PI*2);ctx.fill();
  }

  // Stun flicker
  if(BATTLE.bossStun>0&&frame%4<2) ctx.globalAlpha=0.45;

  // Draw boss sprite at 1.8× scale, sitting ON the ground
  ctx.save();
  ctx.translate(bx, by);
  ctx.scale(1.8,1.8);
  if(boss.id==='lagarto')        drawLagarto(0,0,frame,BATTLE.bossHp,BATTLE.bossMaxHp);
  else if(boss.id==='cocodrilo') drawCocodrilo(0,0,frame,BATTLE.bossHp,BATTLE.bossMaxHp);
  else if(boss.id==='aguila')    drawAguila(0,0,frame,BATTLE.bossHp,BATTLE.bossMaxHp);
  else if(boss.id==='serpiente') drawSerpiente(0,0,frame,BATTLE.bossHp,BATTLE.bossMaxHp);
  ctx.restore();
  ctx.globalAlpha=1;

  // HP bar
  const bw=90;
  ctx.fillStyle='#222'; ctx.fillRect(bx-5,by-18,bw,10);
  const hpR=Math.max(0,BATTLE.bossHp)/BATTLE.bossMaxHp;
  ctx.fillStyle=hpR>0.5?'#4ade80':hpR>0.25?'#facc15':'#f87171';
  ctx.fillRect(bx-5,by-18,bw*hpR,10);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bx-5,by-18,bw,10);
  ctx.fillStyle='#fff';ctx.font='bold 9px Fredoka One';ctx.textAlign='center';
  ctx.fillText(boss.emoji+' '+boss.name, bx+40, by-22);
  ctx.textAlign='left';
}

function drawBattleChicken(){
  const ch=BATTLE.chick; if(!ch)return;
  // Trail
  ch.trail.forEach((t,i)=>{
    const al=(i/ch.trail.length)*0.5;
    ctx.fillStyle=ch.skill==='spicy'
      ?`rgba(255,100,0,${al})`:`rgba(255,204,2,${al})`;
    ctx.beginPath();ctx.arc(t.x,t.y,5*(i/ch.trail.length),0,Math.PI*2);ctx.fill();
  });
  // Chicken sprite rotated in direction of travel
  const ang=Math.atan2(ch.vy,ch.vx);
  ctx.save(); ctx.translate(ch.x,ch.y); ctx.rotate(ang);
  drawChicken(-16,-16,3,15,frame);
  if(ch.skill==='spicy'){
    ctx.fillStyle='rgba(255,68,0,0.5)';
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBossProjectile(p){
  if(p.type==='rock'){
    ctx.fillStyle='#8b7355';ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#6b5335';ctx.lineWidth=1.5;ctx.stroke();
  } else if(p.type==='snap'){
    ctx.font=(p.big?'26':'18')+'px Arial';ctx.textAlign='center';
    ctx.fillText('🦷',p.x,p.y+7);ctx.textAlign='left';
  } else if(p.type==='talon'){
    ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText('🦅',p.x,p.y+7);ctx.textAlign='left';
  } else if(p.type==='poison'){
    const pu=0.55+Math.sin(frame*0.3)*0.4;
    ctx.fillStyle=`rgba(108,92,231,${pu})`;ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#a29bfe';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();
  }
  // Warning
  ctx.fillStyle='rgba(255,50,50,0.18)';
  ctx.beginPath();ctx.arc(p.x-p.vx*2,p.y-p.vy*2,7,0,Math.PI*2);ctx.fill();
}

function drawBattleHUD(){
  // Top strip
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,GW,34);
  // Shots remaining
  ctx.fillStyle='#ffcc02';ctx.font='bold 12px Fredoka One';ctx.textAlign='left';
  ctx.fillText('Shots:',6,22);
  for(let i=0;i<3;i++){
    ctx.font='16px Arial';
    ctx.fillText(i<BATTLE.shotsLeft?'🐔':'💀', 58+i*22, 23);
  }
  // Boss HP centre
  ctx.fillStyle='#fff';ctx.font='bold 12px Fredoka One';ctx.textAlign='center';
  ctx.fillText('BOSS HP: '+Math.max(0,BATTLE.bossHp)+'/'+BATTLE.bossMaxHp, GW/2, 22);
  // Player HP right
  ctx.fillStyle='#fff';ctx.font='bold 12px Fredoka One';ctx.textAlign='right';
  ctx.fillText('HP:', GW-72, 22);
  for(let i=0;i<Math.min(player.maxHp,6);i++){
    ctx.font='13px Arial';
    ctx.fillText(i<player.hp?'❤️':'🖤', GW-66+i*16, 23);
  }
  ctx.textAlign='left';

  // Reload bar
  if(battleState==='reload'){
    const prog=1-(BATTLE.reloadTimer/150);
    ctx.fillStyle='#222'; ctx.fillRect(GW/2-70,36,140,8);
    ctx.fillStyle='#48cae4'; ctx.fillRect(GW/2-70,36,140*prog,8);
    drawAutoBox('Reloading...', GW/2, 56, {font:'bold 12px Fredoka One',maxW:160,pad:8});
  }

  // Aim hint at bottom
  if(battleState==='aim'){
    const hasAim=Math.hypot(BATTLE.aimDx,BATTLE.aimDy)>0.12;
    drawAutoBox(hasAim?'💥 Tap PECK to fire!':'👈 Drag joystick to aim',
      GW/2, BATTLE.groundY+30,
      {font:'bold 12px Fredoka One',alpha:0.9,maxW:GW-40,bg:'rgba(0,0,0,0.65)'});
  }
}

function drawBattleIntro(){
  const boss=MINI_BOSSES.find(b=>b.id===battleBossId);

function drawBattleResult(){

    ctx.fillText(sealEmoji+' '+(BATTLE.sealName||'')+'  •  '+

  ctx.textAlign='left';
}

function isReadyForBoss(){
  return allSealsCollected() && !!TOWN_QUESTS.find(q=>q.id==='ciu_q3')?.complete;
}

function checkJaguarGate(){
  if(isScrolling||battleMode)return;
  const approachingSouth = screenCol===9&&screenRow===6&&player.y>GH-60;
  const approachingEast  = screenCol===8&&screenRow===7&&player.x>GW-60;
  if(!approachingSouth&&!approachingEast)return;
  if(isReadyForBoss())return;
  if(approachingSouth)player.y=GH-64;

function drawMiniBosses(){
  if(isScrolling)return;
  MINI_BOSSES.forEach(b=>{
    if(b.screenCol!==screenCol||b.screenRow!==screenRow)return;
    if(!b.active||b.dead)return;
    const x=b.x,y=b.y;
    const stun=b.st>0;
    if(stun){ctx.globalAlpha=0.6+Math.sin(frame*0.5)*0.4;}
    if(b.id==='lagarto') drawLagarto(x,y,frame,b.hp,b.maxHp);
    else if(b.id==='cocodrilo') drawCocodrilo(x,y,frame,b.hp,b.maxHp);
    else if(b.id==='aguila') drawAguila(x,y,frame,b.hp,b.maxHp);
    else if(b.id==='serpiente'){
      drawSerpiente(x,y,frame,b.hp,b.maxHp);
      b.splitClones&&b.splitClones.forEach(cl=>drawSerpienteClone(cl.x,cl.y,frame));
    }
    ctx.globalAlpha=1;
    const bw=60;
    ctx.fillStyle='#111';ctx.fillRect(x-6,y-22,bw+12,10);

    ctx.textAlign='left';
  });
}

// ═══════════════════════════════════════════════════════
//  COMPANION EGG + SIDEKICK SYSTEM
// ═══════════════════════════════════════════════════════

// Egg state
const egg = {
  found: false,          // has player picked it up
  hatched: false,        // has it hatched into sidekick
  hatchTimer: 0,         // counts up while carried
  HATCH_TIME: 600,       // 10 seconds of carrying = hatches
  wobble: 0,             // visual wobble when close to hatching
  screenCol: 3, screenRow: 2,  // where egg is found
  tx: 9, ty: 6,          // tile position
  collected: false,
};

// Sidekick personalities — randomly chosen on hatch
const SIDEKICK_PERSONALITIES = [
  { name:'Pepito',   color:'#ff6b6b', trait:'Brave',   taunts:['¡Ándale!','Let me at \'em!','I got your back!','CLUCK YEAH!'] },
  { name:'Conchita', color:'#ff9ff3', trait:'Sassy',   taunts:['Ugh, FINALLY.','I\'ve been waiting FOREVER.','You\'re welcome.','Obviously.'] },
  { name:'Taco',     color:'#ffd93d', trait:'Hungry',  taunts:['Is that corn?','I\'m starving!','Mmm, crunchy!','Snack time?'] },
  { name:'Fantasma', color:'#a29bfe', trait:'Spooky',  taunts:['I see them...','The ruins whisper...','Boo?','They\'re behind you.'] },
  { name:'Churro',   color:'#fdcb6e', trait:'Cheerful',taunts:['Yay!!','This is so fun!','We got this!','BEST DAY EVER!'] },
];

const sidekick = {
  active: false,
  name: '', color: '#ff9f1c', trait: '', taunts: [],
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  frame: 0,
  speech: '', speechTimer: 0,
  atkCooldown: 0,
  hp: 3, maxHp: 3,
  inv: 0,
  bobOffset: 0,
};

function hatchEgg() {
  const p = SIDEKICK_PERSONALITIES[Math.floor(Math.random()*SIDEKICK_PERSONALITIES.length)];
  sidekick.active = true;
  sidekick.name = p.name;
  sidekick.color = p.color;
  sidekick.trait = p.trait;
  sidekick.taunts = p.taunts;
  sidekick.x = player.x + 32;
  sidekick.y = player.y;
  sidekick.hp = 3; sidekick.maxHp = 3;
  sidekick.atkCooldown = 0; sidekick.inv = 0;
  egg.hatched = true;
  showSkillPopup('🐣', sidekick.name + ' hatched!', sidekick.trait + ' companion joined!', sidekick.color);
  spawnP(sidekick.x+8, sidekick.y+8, sidekick.color, 24);
  // random speech on hatch
  sidekickSay(sidekick.taunts[0]);
}

function sidekickSay(text) {
  sidekick.speech = text;
  sidekick.speechTimer = 140;
}

function updateSidekick() {
  if(!sidekick.active || isScrolling) return;
  sidekick.frame++;
  sidekick.bobOffset = Math.sin(sidekick.frame * 0.12) * 3;
  if(sidekick.inv > 0) sidekick.inv--;
  if(sidekick.speechTimer > 0) sidekick.speechTimer--;
  if(sidekick.atkCooldown > 0) sidekick.atkCooldown--;

  // Follow player — stay ~50px behind
  const tdx = player.x - sidekick.x;
  const tdy = player.y - sidekick.y;
  const dist = Math.hypot(tdx, tdy);
  if(dist > 50) {
    const spd = Math.min(2.8, dist * 0.08);
    const sc = currentScreen();
    const nx = sidekick.x + (tdx/dist)*spd;
    const ny = sidekick.y + (tdy/dist)*spd;
    if(boxWalkable(sc.map, nx, sidekick.y)) sidekick.x = nx;
    if(boxWalkable(sc.map, sidekick.x, ny)) sidekick.y = ny;
  }

  // Auto-attack nearest enemy
  if(sidekick.atkCooldown <= 0) {
    const sc = currentScreen();
    const ss = getScreenState(screenCol, screenRow);
    let closest = null, closestDist = 120;
    sc.enemies.forEach((e,i) => {
      if(ss.enemyHps[i] <= 0 || e._x === undefined) return;
      const d = Math.hypot(sidekick.x+8 - (e._x+14), sidekick.y+8 - (e._y+18));
      if(d < closestDist) { closestDist = d; closest = {e,i}; }
    });
    if(closest) {
      ss.enemyHps[closest.i] = 0;
      score += 25;
      sidekick.atkCooldown = 50;
      spawnP(closest.e._x+14, closest.e._y+14, sidekick.color, 10);
      // random taunt on kill
      if(Math.random() < 0.4) sidekickSay(sidekick.taunts[Math.floor(Math.random()*sidekick.taunts.length)]);
    }
    // Also attack mini jaguar
    if(miniJag.active) {
      const d = Math.hypot(sidekick.x+8 - (miniJag.x+14), sidekick.y+8 - (miniJag.y+14));
      if(d < 100) {
        miniJag.hp--;
        sidekick.atkCooldown = 60;
        spawnP(miniJag.x+14, miniJag.y+14, sidekick.color, 8);
        if(miniJag.hp <= 0) { miniJag.active=false; score+=200; }
        if(Math.random()<0.5) sidekickSay(sidekick.taunts[Math.floor(Math.random()*sidekick.taunts.length)]);
      }
    }
  }

  // Random chatter
  if(sidekick.speechTimer <= 0 && Math.random() < 0.003) {
    sidekickSay(sidekick.taunts[Math.floor(Math.random()*sidekick.taunts.length)]);
  }

  // Collect corn for player if magnet not active
  if(!skills.cornMagnet) {
    const sc = currentScreen();
    const ss = getScreenState(screenCol, screenRow);
    sc.corn.forEach((c,i) => {
      if(ss.gotCorns.has(i)) return;
      const d = Math.hypot(sidekick.x+8-(c.x*TILE+8), sidekick.y+8-(c.y*TILE+8));
      if(d < 40) { ss.gotCorns.add(i); cornCount++; score+=10; spawnP(c.x*TILE+8,c.y*TILE+8,'#ffcc02',4); }
    });
  }
}

function drawEgg(fr) {
  if(egg.hatched || egg.found) return;
  if(egg.screenCol !== screenCol || egg.screenRow !== screenRow) return;
  const ex = egg.tx * TILE, ey = egg.ty * TILE;
  const bob = Math.sin(fr * 0.08) * 3;
  const wobble = Math.sin(fr * 0.2) * (egg.hatchTimer > 400 ? 3 : 1);
  // glow
  const glow = 0.2 + Math.sin(fr*0.06)*0.15;
  ctx.fillStyle = `rgba(255,220,100,${glow})`;
  ctx.beginPath(); ctx.ellipse(ex+16, ey+18+bob, 18, 22, wobble*0.1, 0, Math.PI*2); ctx.fill();
  // egg body
  ctx.fillStyle = '#fffde7';
  ctx.beginPath(); ctx.ellipse(ex+16, ey+16+bob, 13, 16, wobble*0.08, 0, Math.PI*2); ctx.fill();
  // speckles
  ctx.fillStyle = '#d4a017';
  [[4,8],[8,4],[12,10],[6,14]].forEach(([ox,oy]) => {
    ctx.beginPath(); ctx.arc(ex+ox+4, ey+oy+bob, 1.5, 0, Math.PI*2); ctx.fill();
  });
  // crack lines when close to hatching
  if(egg.hatchTimer > 350) {
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ex+14, ey+8+bob); ctx.lineTo(ex+18, ey+14+bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex+10, ey+14+bob); ctx.lineTo(ex+13, ey+20+bob); ctx.stroke();
  }
  // label
  const pulse = 0.6 + Math.sin(fr*0.1)*0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#DAA520'; ctx.font = 'bold 10px Fredoka One'; ctx.textAlign = 'center';
  ctx.fillText('🥚 Mysterious Egg!', ex+16, ey-4+bob);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawSidekick() {
  if(!sidekick.active || isScrolling) return;
  const x = sidekick.x, y = sidekick.y + sidekick.bobOffset;
  const sc = sidekick.color;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x+8, y+22, 9, 3, 0, 0, Math.PI*2); ctx.fill();
  // body — smaller than main chicken
  ctx.fillStyle = sc;
  ctx.beginPath(); ctx.ellipse(x+8, y+13, 9, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = lightenColor(sc, 40);
  ctx.beginPath(); ctx.ellipse(x+8, y+15, 6, 5, 0, 0, Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle = sc;
  ctx.beginPath(); ctx.arc(x+8, y+6, 7, 0, Math.PI*2); ctx.fill();
  // tiny comb
  ctx.fillStyle = '#ff3333';
  ctx.beginPath(); ctx.moveTo(x+5,y+2); ctx.lineTo(x+4,y-2); ctx.lineTo(x+7,y+0);
  ctx.lineTo(x+8,y-3); ctx.lineTo(x+9,y+0); ctx.lineTo(x+12,y-2); ctx.lineTo(x+11,y+2); ctx.closePath(); ctx.fill();
  // eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.ellipse(x+5, y+5, 3, 3.5, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+11, y+5, 3, 3.5, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(x+6, y+6, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+12, y+6, 1.8, 0, Math.PI*2); ctx.fill();
  // happy eyebrows (slightly raised — friendly)
  ctx.strokeStyle = '#883300'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x+2, y+3); ctx.lineTo(x+7, y+4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+9, y+4); ctx.lineTo(x+14, y+3); ctx.stroke();
  // beak
  ctx.fillStyle = '#ff6b00';
  ctx.beginPath(); ctx.moveTo(x+6, y+9); ctx.lineTo(x+10, y+9); ctx.lineTo(x+8, y+12); ctx.closePath(); ctx.fill();
  // tiny feet
  ctx.fillStyle = '#ff6b00';
  ctx.fillRect(x+4, y+18, 3, 4); ctx.fillRect(x+9, y+18, 3, 4);
  // attack flash
  if(sidekick.atkCooldown > 42) {
    ctx.strokeStyle = sidekick.color; ctx.lineWidth = 2;
    for(let i=0;i<4;i++){const a=(i/4)*Math.PI*2+sidekick.frame*0.3;
      ctx.beginPath();ctx.moveTo(x+8+Math.cos(a)*8,y+10+Math.sin(a)*8);
      ctx.lineTo(x+8+Math.cos(a)*14,y+10+Math.sin(a)*14);ctx.stroke();}
  }
  // HP hearts above
  for(let i=0;i<sidekick.maxHp;i++){
    ctx.font='8px Arial'; ctx.textAlign='center';
    ctx.fillText(i<sidekick.hp?'❤':'🖤', x-4+i*10, y-4);
  }
  ctx.textAlign='left';
  // Speech bubble
  if(sidekick.speechTimer > 0) {
    const distS=Math.hypot(player.x+16-(x+8),player.y+16-(y+8));
    const close=distS<60;
    const fontSize=close?13:10;
    ctx.font='bold '+fontSize+'px Fredoka One';
    const maxW=close?190:130;
    const padding=close?14:10;
    const lineH=close?17:13;
    const words=sidekick.speech.split(' ');
    let lines=[],cur='';
    words.forEach(w=>{const t=cur+w+' ';if(ctx.measureText(t).width>maxW&&cur){lines.push(cur.trim());cur=w+' ';}else cur=t;});
    if(cur.trim())lines.push(cur.trim());
    const bw=Math.min(close?210:150,Math.max(...lines.map(l=>ctx.measureText(l).width))+padding*2);
    const bh=lines.length*lineH+padding;
    const bx=Math.min(GW-bw-4,Math.max(4,x+8-bw/2));
    const by=y-(bh+10);
    const alpha=Math.min(1,sidekick.speechTimer/20);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=close?'rgba(255,248,220,0.98)':'rgba(255,255,255,0.93)';
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,close?9:6);ctx.fill();
    if(close){ctx.strokeStyle=sidekick.color;ctx.lineWidth=1.5;ctx.stroke();}
    ctx.fillStyle=close?'rgba(255,248,220,0.98)':'rgba(255,255,255,0.93)';
    ctx.beginPath();ctx.moveTo(x+4,y-6);ctx.lineTo(x+8,y-2);ctx.lineTo(x+12,y-6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1a0a2e';ctx.textAlign='left';
    lines.forEach((l,i)=>ctx.fillText(l,bx+padding,by+padding+(i+0.8)*lineH));
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
  // name tag
  ctx.fillStyle = sidekick.color; ctx.font = 'bold 9px Fredoka One'; ctx.textAlign = 'center';
  ctx.fillText(sidekick.name, x+8, y+28);
  ctx.textAlign = 'left';
}

function lightenColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255,(n>>16)+amt), g = Math.min(255,((n>>8)&0xff)+amt), b = Math.min(255,(n&0xff)+amt);
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

function updateEggCarry() {
  if(egg.hatched || !egg.found || isScrolling) return;
  egg.hatchTimer++;
  // wobble more as hatching approaches
  if(egg.hatchTimer > egg.HATCH_TIME) hatchEgg();
  // draw carried egg on player
  const bob = Math.sin(frame*0.15)*2;
  const wobble = egg.hatchTimer > 400 ? Math.sin(frame*0.25)*4 : 0;
  ctx.fillStyle = `rgba(255,220,100,${0.15+Math.sin(frame*0.08)*0.1})`;
  ctx.beginPath(); ctx.ellipse(player.x+22, player.y+4+bob, 14, 17, wobble*0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fffde7';
  ctx.beginPath(); ctx.ellipse(player.x+22, player.y+4+bob, 10, 13, wobble*0.06, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#d4a017';
  ctx.beginPath(); ctx.arc(player.x+20, player.y+bob, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x+25, player.y+6+bob, 1.5, 0, Math.PI*2); ctx.fill();
  // hatch progress bar
  const prog = egg.hatchTimer / egg.HATCH_TIME;
  ctx.fillStyle = '#333'; ctx.fillRect(player.x, player.y-10, 32, 4);
  ctx.fillStyle = prog>0.8?'#ff4400':prog>0.5?'#ffaa00':'#ffcc02';
  ctx.fillRect(player.x, player.y-10, 32*prog, 4);
  if(prog > 0.9 && Math.floor(frame/10)%2===0) {
    ctx.fillStyle='#ff4400'; ctx.font='10px Arial'; ctx.textAlign='center';
    ctx.fillText('🔥 HATCHING!', player.x+16, player.y-14);
    ctx.textAlign='left';
  }
}

function checkEggPickup() {
  if(egg.hatched || egg.found || isScrolling) return;
  if(egg.screenCol !== screenCol || egg.screenRow !== screenRow) return;
  const ex = egg.tx*TILE+8, ey = egg.ty*TILE+8;
  if(Math.hypot(player.x+16-ex, player.y+16-ey) < 36) {
    egg.found = true;
    popup = {text:'🥚 You found a mysterious egg!', timer:130};
    spawnP(ex, ey, '#DAA520', 14);
  }
}

// ── TOWN ZONE TILE TYPES & MAPS ───────────────────────────────
// We reuse T constants — towns use PATH, RF, WALL, SAND, FLOWER, CHEST, DOOR
// Plus a new FURN tile for interactive furniture
const T_FURN = 30; // interactive furniture

function makeTZ(d){ const m=[]; for(let r=0;r<15;r++){m.push(new Array(20).fill(d));} return m; }
function ftz(m,x,y,w,h,t){ for(let r=y;r<Math.min(y+h,15);r++) for(let c=x;c<Math.min(x+w,20);c++) m[r][c]=t; }

// Build all 9 rooms for each town
function buildTownZones(){
  const zones = {};

  // Helper: make 15×20 map filled with tile t
  function mk(t){ return Array.from({length:15},()=>new Array(20).fill(t)); }

  // Fill rectangle
  function fr(m,x,y,w,h,t){ for(let r=y;r<Math.min(y+h,15);r++) for(let c2=x;c2<Math.min(x+w,20);c2++) m[r][c2]=t; }

  // Carve doorways on edges that connect to neighbors
  // hasN/S/W/E = has neighbor in that direction (carve door)
  // isEdgeN/S/W/E = is outer border of town (carve exit arrow)
  function carveDoors(m, hasN, hasS, hasW, hasE, floorTile){
    const F = floorTile || T.PATH;
    // North door  (row 0-1, cols 8-10)
    if(hasN){ fr(m,8,0,3,2,F); }
    // South door  (row 13-14, cols 8-10)
    if(hasS){ fr(m,8,13,3,2,F); }
    // West door   (col 0-1, rows 6-8)
    if(hasW){ fr(m,0,6,2,3,F); }
    // East door   (col 18-19, rows 6-8)
    if(hasE){ fr(m,18,6,2,3,F); }
  }

  // Standard room builder: walls on all 4 sides, floor inside, then carve doors
  function room(floorTile, hasN, hasS, hasW, hasE, decorFn){
    const m = mk(T.WALL);
    fr(m, 1, 1, 18, 13, floorTile);
    if(decorFn) decorFn(m);
    carveDoors(m, hasN, hasS, hasW, hasE, floorTile);
    return m;
  }

  // ── PUEBLO TULUM 3×3 ────────────────────────────────────────
  // Grid:  (col,row)
  // (0,0) Market        (1,0) Kitchen       (2,0) Dock
  // (0,1) Town Square   (1,1) Center[ENTRY] (2,1) School
  // (0,2) Carlos Yard   (1,2) Dance Stage   (2,2) Marcos Home
  //
  // Connectivity: all rooms connect to all 4 neighbors within grid
  // Outer edges: those on boundary get EXIT doors (also carved open)

  const pt = [];

  // (0,0) Market Plaza — N:exit, S:→(0,1), W:exit, E:→(1,0)
  (()=>{

  })();

  // (2,2) Map Chamber — N:→(2,1), S:exit, W:→(1,2), E:exit
  (()=>{

      fr(m,1,2,2,11,T.WALL); fr(m,17,2,2,11,T.WALL); // scroll walls

      corn:[{x:9,y:12}], furn:[]});
  })();

  zones['ciudadela'] = { rooms:ciu, cols:3, rows:3, entryRoom:{col:1,row:1},
