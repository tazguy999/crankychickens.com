    sfxText:'🏛️ BOOM BOOM BOOM! 🏛️', sfxColor:'#DAA520',
    ambientDesc:'Ancient stones hum with power...' };

  return zones;
}
const TOWN_ZONES = buildTownZones();

// ── TOWN ZONE ENTRY / EXIT ────────────────────────────────────
// Entry trigger zones — placed on world map at town screen centers
const TOWN_ENTRY_TRIGGERS = [
  { worldCol:2, worldRow:3, townId:'pueblo_tulum', tx:9, ty:7 },
  { worldCol:4, worldRow:4, townId:'aldea_selva',  tx:9, ty:7 },
  { worldCol:6, worldRow:2, townId:'ciudadela',    tx:9, ty:7 },
];

function checkTownZoneEntry(){
  if(isScrolling||inTownZone)return;
  TOWN_ENTRY_TRIGGERS.forEach(t=>{
    if(t.worldCol!==screenCol||t.worldRow!==screenRow)return;
    const town=getTown(t.townId); if(!town||!town.unlocked)return;
    const ex=t.tx*TILE+16, ey=t.ty*TILE+16;
    const dist=Math.hypot(player.x+16-ex,player.y+16-ey);
    if(dist<36&&!inTownZone){
      enterTownZone(t.townId);
    }
    // Show entry hint
    if(dist<80){
      const pulse=0.7+Math.sin(frame*0.12)*0.3;
      ctx.globalAlpha=pulse;
      drawAutoBox(town.emoji+' Enter '+town.name, GW/2, GH-40, {font:'bold 12px Fredoka One',color:TOWN_ZONES[t.townId].sfxColor,alpha:pulse,maxW:GW-40});
      ctx.globalAlpha=1;ctx.textAlign='left';
    }
  });
}

function enterTownZone(townId){
  const tz=TOWN_ZONES[townId];
  townEntryWorldCol=screenCol; townEntryWorldRow=screenRow;
  townEntryPlayerX=player.x; townEntryPlayerY=player.y;
  inTownZone=true; townZoneId=townId;
  townZoneCol=tz.entryRoom.col; townZoneRow=tz.entryRoom.row;
  // Spawn at south door gap (row 12, col 9) — player walks up from there
  player.x=9*TILE; player.y=12*TILE;
  player.dir=0; // facing up
  townEntryFlash=25;
  townEntrySfxText=tz.sfxText;
  townEntrySfxTimer=120;
  const town=getTown(townId);
  setTimeout(()=>{ popup={text:town.emoji+' '+town.name+'! — '+tz.ambientDesc, timer:150}; },300);
}

function exitTownZone(){
  inTownZone=false; townZoneId='';
  screenCol=townEntryWorldCol; screenRow=townEntryWorldRow;
  player.x=townEntryPlayerX; player.y=townEntryPlayerY-40;
  townEntryFlash=20;
  townEntrySfxText='👋 See you later!';
  townEntrySfxTimer=80;
}

// ── CURRENT TOWN ROOM ─────────────────────────────────────────
function currentTownRoom(){
  if(!inTownZone)return null;
  const tz=TOWN_ZONES[townZoneId];
  return tz.rooms[townZoneRow*tz.cols+townZoneCol];
}

function townRoomAt(col,row){
  if(!inTownZone)return null;
  const tz=TOWN_ZONES[townZoneId];
  if(col<0||col>=tz.cols||row<0||row>=tz.rows)return null;
  return tz.rooms[row*tz.cols+col];
}

// ── TOWN ZONE UPDATE ──────────────────────────────────────────
function updateTownZonePlayer(){
  if(!inTownZone||isScrolling)return;
  // Update shop proximity flag every frame
  player._nearShop=false;
  SHOP_KEEPERS.forEach(sk=>{
    if(sk.townId!==townZoneId||sk.roomCol!==townZoneCol||sk.roomRow!==townZoneRow)return;
    const dist=Math.hypot(player.x+16-sk.tx*TILE-16, player.y+16-sk.ty*TILE-16);
    if(dist<140) player._nearShop=true;
  });
  const room=currentTownRoom(); if(!room)return;
  const sc=room;
  let dx=0,dy=0;

  if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;player.dir=1;}
  if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;player.dir=3;}
  if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;player.dir=0;}
  if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;player.dir=2;}
  if(joyActive){
    // Shop nav when open
    if(shopOpen){
      const items=SHOP_ITEMS.filter(it=>it.townId===shopTownId);
      if(joyDy < -0.5 && !player._joyShopNav){ shopSelected=Math.max(0,shopSelected-1); player._joyShopNav=true; }
      if(joyDy >  0.5 && !player._joyShopNav){ shopSelected=Math.min(items.length-1,shopSelected+1); player._joyShopNav=true; }
    } else {
      dx=joyDx;dy=joyDy;
      if(Math.abs(dx)>Math.abs(dy)){player.dir=dx>0?3:1;}
      else{player.dir=dy>0?2:0;}
    }
  } else {
    player._joyShopNav=false; // reset when joystick released
  }
  const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}

  const isTownWalkable=(map,px,py)=>{
    const tx=Math.floor(px/TILE),ty2=Math.floor(py/TILE);
    if(tx<0||ty2<0||tx>=20||ty2>=15)return false;
    const t=map[ty2][tx];
    return ![T.JUNGLE,T.WATER,T.WALL,T.RUIN,T.MANGROVE].includes(t);
  };

  const nx=player.x+dx*player.speed, ny=player.y+dy*player.speed;
  if(isTownWalkable(sc.map,nx+6,player.y+20)&&isTownWalkable(sc.map,nx+26,player.y+20))player.x=nx;
  if(isTownWalkable(sc.map,player.x+6,ny+20)&&isTownWalkable(sc.map,player.x+26,ny+20))player.y=ny;

  if(player.atk>0)player.atk--;if(player.inv>0)player.inv--;if(player._shopCooldown>0)player._shopCooldown--;

  // Attack
  const atkPressed=(keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk);
  // Shop open: PECK buys selected item
  if(atkPressed && shopOpen){
    handleShopPeck();
    touchAtk=false; touchTalk=false;
  // Near shop: PECK opens it
  } else if(atkPressed && player._nearShop && !shopOpen){
    shopOpen=true;
    shopTownId=townZoneId;
    shopSelected=0;
    updateTalkBtn();
    touchAtk=false; touchTalk=false;
  } else if(atkPressed&&player.atk<=0){
    player.atk=18;
    spawnP(player.x+16,player.y+16,'#ffcc02',8);
    checkTownFurniturePeck(sc);
  }
  touchAtk=false;

  // Collect corn in town rooms
  sc.corn&&sc.corn.forEach((c,i)=>{
    const key=`tz_${townZoneId}_${townZoneCol},${townZoneRow}_${i}`;
    if(TOWN_TOOLS_FOUND.has(key))return;
    if(Math.hypot(player.x+16-(c.x*TILE+8),player.y+16-(c.y*TILE+8))<36){
      TOWN_TOOLS_FOUND.add(key);cornCount++;score+=10;spawnP(c.x*TILE+8,c.y*TILE+8,'#ffcc02',6);
    }
  });

  // Chest in town room
  for(let ty2=0;ty2<15;ty2++)for(let tx=0;tx<20;tx++){
    if(sc.map[ty2][tx]!==T.CHEST)continue;
    const key=`tz_chest_${townZoneId}_${townZoneCol},${townZoneRow}_${ty2},${tx}`;
    if(TOWN_TOOLS_FOUND.has(key))continue;
    if(Math.hypot(player.x+16-(tx*TILE+16),player.y+16-(ty2*TILE+16))<40){
      TOWN_TOOLS_FOUND.add(key);
      openChest(tx*TILE+16,ty2*TILE+16);
    }
  }

  // Auto-heal on flowers (same as world)
  const underTile=sc.map[Math.floor((player.y+22)/TILE)]?.[Math.floor((player.x+16)/TILE)];
  if(underTile===T.FLOWER&&player.hp<player.maxHp&&player.inv<=0){
    if(!player._regenTimer)player._regenTimer=0;
    player._regenTimer++;
    if(player._regenTimer>=120){player.hp=Math.min(player.maxHp,player.hp+1);player._regenTimer=0;spawnP(player.x+16,player.y+8,'#ff85a1',6);}
  } else if(player.inv>0){player._regenTimer=0;}

  // Room transitions within town
  // Door gaps: N/S centered cols 8-10 = x≈272-352; W/E centered rows 6-8 = y≈208-288
  const tz=TOWN_ZONES[townZoneId];
  const doorCX=8*TILE+16;  // x center of N/S door gap
  const doorCY=7*TILE+16;  // y center of W/E door gap
  if(player.x<4){
    if(townZoneCol>0){townZoneCol--;player.x=GW-52;player.y=doorCY;}
    else{exitTownZone();return;}
  } else if(player.x>GW-36){
    if(townZoneCol<tz.cols-1){townZoneCol++;player.x=12;player.y=doorCY;}
    else{exitTownZone();return;}
  } else if(player.y<4){
    if(townZoneRow>0){townZoneRow--;player.y=GH-52;player.x=doorCX;}
    else{exitTownZone();return;}
  } else if(player.y>GH-36){
    if(townZoneRow<tz.rows-1){townZoneRow++;player.y=12;player.x=doorCX;}
    else{exitTownZone();return;}
  }
}

function checkTownFurniturePeck(room){
  const px=player.x+16,py=player.y+16;
  // Check T_FURN tiles near player
  for(let ty2=0;ty2<15;ty2++)for(let tx=0;tx<20;tx++){
    if(room.map[ty2][tx]!==T_FURN)continue;
    const dist=Math.hypot(px-(tx*TILE+16),py-(ty2*TILE+16));
    if(dist>52)continue;
    // find matching hidden item
    const item=TOWN_HIDDEN_ITEMS.find(it=>
      it.townId===townZoneId&&
      it.room===`${townZoneCol},${townZoneRow}`&&
      it.tx===tx&&it.ty===ty2&&
      !TOWN_TOOLS_FOUND.has('item_'+it.id)
    );
    if(item){
      TOWN_TOOLS_FOUND.add('item_'+item.id);
      item.onFind();
      showSkillPopup(item.emoji,item.name,item.desc,item.color);
      spawnP(tx*TILE+16,ty2*TILE+16,'#ffcc02',20);
      // replace tile with open chest visual
      room.map[ty2][tx]=T.RF;
      return;
    }
    // Even if no item, give feedback
    spawnP(tx*TILE+16,ty2*TILE+16,'#ffcc02',6);
    popup={text:'Nothing here... or is there?',timer:80};
  }
  // Near furniture show hint
  for(let ty2=0;ty2<15;ty2++)for(let tx=0;tx<20;tx++){
    if(room.map[ty2][tx]!==T_FURN)continue;
    const dist=Math.hypot(px-(tx*TILE+16),py-(ty2*TILE+16));
    if(dist<70&&dist>52){
      const item=TOWN_HIDDEN_ITEMS.find(it=>it.townId===townZoneId&&it.room===`${townZoneCol},${townZoneRow}`&&it.tx===tx&&it.ty===ty2&&!TOWN_TOOLS_FOUND.has('item_'+it.id));
      if(item){
        const pulse=0.7+Math.sin(frame*0.15)*0.3;
        drawAutoBox(item.emoji+' Peck to investigate!', GW/2, GH-40, {font:'bold 12px Fredoka One',color:item.color,alpha:pulse,maxW:GW-40});
      }
    }
  }
}

// ── TOWN ZONE DRAWING ─────────────────────────────────────────
function drawTownZone(){
  if(!inTownZone)return;
  const tz=TOWN_ZONES[townZoneId];
  const room=currentTownRoom(); if(!room)return;

  // Background fill
  ctx.fillStyle=tz.bg;ctx.fillRect(0,0,GW,GH);

  // Draw tiles
  for(let ty2=0;ty2<15;ty2++)for(let tx=0;tx<20;tx++){
    const t=room.map[ty2][tx];
    const sx=tx*TILE,sy=ty2*TILE;
    if(t===T_FURN){
      // furniture tile — draw as floor + emoji
      ctx.fillStyle=tz.floorColor;ctx.fillRect(sx,sy,TILE,TILE);
      // find furniture emoji
      const item=TOWN_HIDDEN_ITEMS.find(it=>it.townId===townZoneId&&it.room===`${townZoneCol},${townZoneRow}`&&it.tx===tx&&it.ty===ty2);
      const emoji=item&&!TOWN_TOOLS_FOUND.has('item_'+item.id)?item.furniture:'📦';
      const glow=item&&!TOWN_TOOLS_FOUND.has('item_'+item.id)?0.3+Math.sin(frame*0.08)*0.2:0;
      if(glow>0){ctx.fillStyle=`rgba(255,204,2,${glow})`;ctx.fillRect(sx,sy,TILE,TILE);}
      ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(emoji,sx+16,sy+20);ctx.textAlign='left';
    } else {
      drawTile(t,sx,sy,frame);
    }
  }

  // Draw corn
  room.corn&&room.corn.forEach((c,i)=>{
    const key=`tz_${townZoneId}_${townZoneCol},${townZoneRow}_${i}`;
    if(!TOWN_TOOLS_FOUND.has(key))drawCorn(c.x*TILE,c.y*TILE,frame);
  });

  // Town NPC presence — show relevant NPCs in their rooms
  drawTownZoneNPCs();

  // Shop stalls
  drawShopKeepers();

  // Room name
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(GW/2-80,4,160,20);
  ctx.fillStyle=tz.sfxColor;ctx.font='bold 13px Fredoka One';ctx.textAlign='center';
  ctx.fillText(room.name,GW/2,18);ctx.textAlign='left';

  // Room indicator (which room in 3x3)
  const rw=10,rh=10,rx=6,ry=GH-36;
  for(let r=0;r<tz.rows;r++)for(let c=0;c<tz.cols;c++){
    ctx.fillStyle=(c===townZoneCol&&r===townZoneRow)?tz.sfxColor:'rgba(255,255,255,0.2)';
    ctx.fillRect(rx+c*(rw+2),ry+r*(rh+2),rw,rh);
  }
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px Fredoka One';ctx.textAlign='left';
  ctx.fillText('← exit',rx+40,ry+22);

  // Shop proximity hint when near stall
  if(player._nearShop){
    const pulse=0.6+Math.sin(frame*0.12)*0.4;
    drawAutoBox('🛒 PECK to open shop', GW/2, GH-44,
      {font:'bold 13px Fredoka One',alpha:pulse,maxW:GW-40,bg:'rgba(0,0,0,0.85)',border:'#DAA520'});
  }

  // Shop direction hint — show 🛒 arrow on minimap pointing to shop room
  SHOP_KEEPERS.forEach(sk=>{
    if(sk.townId!==townZoneId)return;
    const scx=rx+sk.roomCol*(rw+2)+rw/2, scy=ry+sk.roomRow*(rh+2)+rh/2;
    // Mark shop room on minimap
    ctx.fillStyle='#ffcc02';ctx.font='8px Arial';ctx.textAlign='center';
    ctx.fillText('🛒',scx,scy+3);
    // If not in shop room, show directional hint at room edges
    if(sk.roomCol!==townZoneCol||sk.roomRow!==townZoneRow){
      const dcol=sk.roomCol-townZoneCol, drow=sk.roomRow-townZoneRow;
      const arrowX=dcol>0?GW-24:dcol<0?12:GW/2;
      const arrowY=drow>0?GH-90:drow<0?50:GH/2;
      const arrow=dcol>0?'▶':dcol<0?'◀':drow>0?'▼':'▲';
      const pulse=0.5+Math.sin(frame*0.1)*0.4;
      ctx.globalAlpha=pulse;
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.beginPath();ctx.roundRect(arrowX-22,arrowY-16,44,28,8);ctx.fill();
      ctx.fillStyle='#ffcc02';ctx.font='bold 11px Fredoka One';ctx.textAlign='center';
      ctx.fillText('🛒'+arrow,arrowX,arrowY);
      ctx.globalAlpha=1;
    }
  });
  ctx.textAlign='left';

  // Ambient visual effect per zone
  if(townZoneId==='pueblo_tulum'){
    // warm light rays
    ctx.fillStyle='rgba(255,200,0,0.04)';
    for(let i=0;i<5;i++){
      const x=100+i*120+Math.sin(frame*0.01+i)*20;
      ctx.fillRect(x,0,30,GH);
    }
  } else if(townZoneId==='aldea_selva'){
    // firefly dots
    for(let i=0;i<8;i++){
      const fx=(i*137+frame*0.3)%GW,fy=(i*97+Math.sin(frame*0.04+i)*30)%(GH-60)+30;
      const glow2=0.4+Math.sin(frame*0.08+i)*0.4;
      ctx.fillStyle=`rgba(180,255,100,${glow2})`;ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill();
    }
  } else if(townZoneId==='ciudadela'){
    // torch flicker on walls
    ctx.fillStyle=`rgba(255,150,0,${0.05+Math.sin(frame*0.15)*0.03})`;
    ctx.fillRect(0,0,GW,GH);
    // torches in corners
    [[20,20],[GW-28,20],[20,GH-28],[GW-28,GH-28]].forEach(([tx2,ty2])=>{
      const fl=0.6+Math.sin(frame*0.2+tx2)*0.4;
      ctx.fillStyle=`rgba(255,150,0,${fl*0.8})`;ctx.font='16px Arial';ctx.textAlign='center';
      ctx.fillText('🔥',tx2,ty2);ctx.textAlign='left';
    });
  }
}

function drawTownZoneNPCs(){
  if(!inTownZone)return;
  const tz=TOWN_ZONES[townZoneId];
  // Place town NPCs in specific rooms based on their home position
  TOWN_NPCS.forEach(n=>{
    if(n.townId!==townZoneId)return;
    // Map NPC to room (use their homeTx/Ty for rough placement)
    const nroom_col=Math.floor(n.homeTx/7); // 0-2
    const nroom_row=Math.floor(n.homeTy/5); // 0-2
    if(nroom_col!==townZoneCol||nroom_row!==townZoneRow)return;
    const bob=Math.sin(frame*0.06+n.homeTx)*2;
    // Position within room
    const nx=(n.homeTx%7)*TILE+TILE, ny=(n.homeTy%5)*TILE+2*TILE;
    drawNPCSprite(nx,ny+bob,n.color,false);
    // Name tag
    ctx.fillStyle=n.color;ctx.font='bold 9px Fredoka One';ctx.textAlign='center';
    ctx.fillText(n.name,nx+16,ny+34+bob);ctx.textAlign='left';
    // Chat on approach
    const dist=Math.hypot(player.x+16-(nx+16),player.y+16-(ny+16));
    if(dist<48&&frame%180===0){
      n._speech=n.chat[Math.floor(Math.random()*n.chat.length)];
      n._speechTimer=160;
    }
    if(n._speechTimer>0){
      const close=dist<48;
      const fontSize=close?14:10;
      const padding=close?20:12;
      const lineH=close?18:14;
      ctx.font=(close?'bold ':'')+fontSize+'px Fredoka One';
      // word-wrap text to max 200px when close, 150px when far
      const maxW=close?200:150;
      const words=(n._speech||'').split(' ');
      let lines=[],cur='';
      words.forEach(w=>{const t=cur+w+' ';if(ctx.measureText(t).width>maxW&&cur){lines.push(cur.trim());cur=w+' ';}else cur=t;});
      if(cur.trim())lines.push(cur.trim());
      const bw=Math.min(close?220:160, Math.max(...lines.map(l=>ctx.measureText(l).width))+padding*2);
      const bh=lines.length*lineH+padding;
      const bx=Math.min(GW-bw-4,Math.max(4,nx+16-bw/2));
      const by=ny-(bh+8);
      const alpha=Math.min(1,n._speechTimer/20);
      ctx.globalAlpha=alpha;
      // bubble
      ctx.fillStyle=close?'rgba(255,252,220,0.98)'  :'rgba(255,255,255,0.92)';
      ctx.beginPath();ctx.roundRect(bx,by,bw,bh,close?10:6);ctx.fill();
      if(close){ctx.strokeStyle=n.color;ctx.lineWidth=2;ctx.stroke();}
      // tail
      ctx.fillStyle=close?'rgba(255,252,220,0.98)':'rgba(255,255,255,0.92)';
      ctx.beginPath();ctx.moveTo(nx+8,ny-6);ctx.lineTo(nx+16,ny-2);ctx.lineTo(nx+24,ny-6);ctx.closePath();ctx.fill();
      // text
      ctx.fillStyle='#1a0a2e';ctx.textAlign='left';
      lines.forEach((l,i)=>ctx.fillText(l,bx+padding,by+padding+(i+0.8)*lineH));
      ctx.globalAlpha=1;ctx.textAlign='left';
    }
  });
}

// ── ENTRY FLASH + SFX TEXT ────────────────────────────────────
function drawTownEntryFX(){
  if(townEntryFlash>0){
    townEntryFlash--;
    const alpha=townEntryFlash/25;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fillRect(0,0,GW,GH);
  }
  if(townEntrySfxTimer>0){
    townEntrySfxTimer--;
    const prog=townEntrySfxTimer/120;
    const scale=prog>0.8?1+(1-prog)*3:prog<0.2?prog*5:1;
    const alpha=prog>0.8?1:prog*5;
    ctx.save();ctx.translate(GW/2,GH/2);ctx.scale(scale,scale);
    ctx.globalAlpha=alpha;
    const tz=inTownZone?TOWN_ZONES[townZoneId]:null;
    ctx.fillStyle=tz?tz.sfxColor:'#ffcc02';
    ctx.font='bold 28px Fredoka One';ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=4;
    ctx.strokeText(townEntrySfxText,0,10);
    ctx.fillText(townEntrySfxText,0,10);
    ctx.restore();ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

// ── NPC WANDERING ─────────────────────────────────────────────
function updateTownNPCs() {
  if(isScrolling) return;
  TOWN_NPCS.forEach(n => {
    if(n.screenCol !== screenCol || n.screenRow !== screenRow) return;
    const town = getTown(n.townId);
    if(!town || !town.unlocked) return;
    n._timer--;
    if(n._speechTimer > 0) n._speechTimer--;
    if(n._timer <= 0) {
      // pick new direction or pause
      const chance = Math.random();
      if(chance < 0.3) { n._vx=0; n._vy=0; n._timer=60+Math.floor(Math.random()*80); }
      else {
        const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
        const [dvx,dvy]=dirs[Math.floor(Math.random()*4)];
        n._vx=dvx*0.6; n._vy=dvy*0.6;
        n._timer=30+Math.floor(Math.random()*50);
      }
    }
    // move, stay within wander radius of home
    const sc=currentScreen();
    const nx=n._x+n._vx, ny=n._y+n._vy;
    const hdx=Math.abs(nx - n.homeTx*TILE), hdy=Math.abs(ny - n.homeTy*TILE);
    if(hdx < n.wanderR*TILE && hdy < n.wanderR*TILE && boxWalkable(sc.map,nx,ny)) {
      n._x=nx; n._y=ny;
    } else { n._vx=0; n._vy=0; n._timer=20; }
  });
}

function drawTownNPCs() {
  if(isScrolling) return;
  TOWN_NPCS.forEach(n => {
    if(n.screenCol !== screenCol || n.screenRow !== screenRow) return;
    const town = getTown(n.townId);
    if(!town || !town.unlocked) return;
    const x=n._x, y=n._y;
    const bob = Math.sin(frame*0.08 + n.homeTx)*2;
    drawNPCSprite(x, y+bob, n.color, false);
    // name + emoji
    ctx.font='bold 9px Fredoka One'; ctx.textAlign='center';
    ctx.fillStyle=n.color; ctx.fillText(n.name, x+16, y+34+bob);
    ctx.textAlign='left';
    // speech bubble
    if(n._speechTimer > 0) {
      const distP=Math.hypot(player.x+16-(x+16),player.y+16-(y+16));
      const close=distP<52;
      const fontSize=close?14:10;
      const padding=close?16:10;
      const lineH=close?18:14;
      ctx.font=(close?'bold ':'')+fontSize+'px Fredoka One';
      const maxW=close?200:160;
      const words=(n._speech||'').split(' ');
      let lines=[],cur='';
      words.forEach(w=>{const t=cur+w+' ';if(ctx.measureText(t).width>maxW&&cur){lines.push(cur.trim());cur=w+' ';}else cur=t;});
      if(cur.trim())lines.push(cur.trim());
      const bw=Math.min(close?220:170,Math.max(...lines.map(l=>ctx.measureText(l).width))+padding*2);
      const bh=lines.length*lineH+padding;
      const bx=Math.min(GW-bw-4,Math.max(4,x+16-bw/2));
      const by=y-(bh+10);
      const alpha=Math.min(1,n._speechTimer/20);
      ctx.globalAlpha=alpha;
      ctx.fillStyle=close?'rgba(255,252,220,0.98)':'rgba(255,255,255,0.92)';
      ctx.beginPath();ctx.roundRect(bx,by,bw,bh,close?10:6);ctx.fill();
      if(close){ctx.strokeStyle=n.color;ctx.lineWidth=2;ctx.stroke();}
      // tail pointing down to NPC
      ctx.fillStyle=close?'rgba(255,252,220,0.98)':'rgba(255,255,255,0.92)';
      ctx.beginPath();ctx.moveTo(x+8,y-6);ctx.lineTo(x+16,y-2);ctx.lineTo(x+24,y-6);ctx.closePath();ctx.fill();
      ctx.fillStyle='#1a0a2e';ctx.textAlign='left';
      lines.forEach((l,i)=>ctx.fillText(l,bx+padding,by+padding+(i+0.8)*lineH));
      ctx.globalAlpha=1;ctx.textAlign='left';
    }
  });
}

function getQuestStatusText(q) {
  if(q.type==='collect_corn') return `Corn: ${Math.min(q.progress,q.goal)}/${q.goal}`;
  if(q.type==='kill_enemies') return `Kills: ${Math.min(q.progress,q.goal)}/${q.goal}`;
  if(q.type==='reach_screen'||q.type==='survive_screen') return q.progress>=1?'Ready!':'Explore!';
  if(q.type==='visit_screens') return `Screens: ${q.progress}/${q.goalCount}`;
  return '';
}

// ── TOWN QUEST PROGRESS TRACKING ─────────────────────────────
function updateTownQuests() {
  if(isScrolling) return;
  TOWN_QUESTS.forEach((q,idx) => {
    if(!q.active || q.complete) return;
    if(q.type==='collect_corn') q.progress=cornCount;
    if(q.type==='kill_enemies') q.progress=totalEnemiesKilled;
    if(q.type==='reach_screen' && screenCol===q.goalCol && screenRow===q.goalRow) q.progress=1;
    if(q.type==='survive_screen' && screenCol===q.goalCol && screenRow===q.goalRow) q.progress=Math.min(q.goalSeconds, (q.progress||0)+1/60);
    if(q.type==='visit_screens') {
      const key=`${screenCol},${screenRow}`;
      if(q.goalScreens.some(s=>s[0]===screenCol&&s[1]===screenRow)) {
        if(!q.visitedScreens.has(key)){q.visitedScreens.add(key);q.progress=q.visitedScreens.size;}
      }
    }
    // auto-activate chain quests when prereq is done
    if(!q.active) {
      const prereqDone = !q.prereq || TOWN_QUESTS.find(p=>p.id===q.prereq)?.complete;
      if(prereqDone) q.active=true;
    }
  });
  // auto-activate first quest in each unlocked town
  TOWNS.forEach(town => {
    if(!town.unlocked) return;
    const firstQ=TOWN_QUESTS.find(q=>q.townId===town.id&&q.chainOrder===1);
    if(firstQ&&!firstQ.active) firstQ.active=true;
  });
  checkTownUnlocks();
}

// ── TOWN DIALOGUE (NPC quest givers) ─────────────────────────
function checkTownNPCInteractions() {
  if(isScrolling||dialogue.active||shopOpen||noticeBoardOpen) return;
  const px=player.x+16, py=player.y+16;
  TOWN_QUESTS.forEach((q,idx) => {
    if(!q.active||q.screenCol!==undefined) return; // skip old system quests
  });
  // Find matching NPC for quest
  TOWN_NPCS.forEach(n => {
    if(n.screenCol!==screenCol||n.screenRow!==screenRow) return;
    const town=getTown(n.townId); if(!town||!town.unlocked) return;
    const dist=Math.hypot(px-(n._x+16),py-(n._y+16));
    // Find quest for this NPC
    const quest=TOWN_QUESTS.find(q=>q.npcId===n.id&&q.active);
    if(!quest) return;
    if(dist<36&&player.atk>10) openTownDialogue(quest);
  });
}

let townDialogue={active:false,quest:null,phase:'greeting',timer:0};

function openTownDialogue(quest) {
  if(townDialogue.active&&townDialogue.quest?.id===quest.id) return;
  const done = isTownQuestDone(quest);
  townDialogue={active:true,quest,phase:done?'complete':'greeting',timer:0};
  updateTalkBtn();
}

function isTownQuestDone(q) {
  if(q.type==='collect_corn') return q.progress>=q.goal;
  if(q.type==='kill_enemies') return q.progress>=q.goal;
  if(q.type==='reach_screen'||q.type==='survive_screen') return q.progress>=1;
  if(q.type==='visit_screens') return q.progress>=q.goalCount;
  return false;
}

function getQuestStatus(q) {
  if(q.type==='collect_corn') return `Corn: ${q.progress}/${q.goal}`;
  if(q.type==='kill_enemies') return `Kills: ${q.progress}/${q.goal}`;
  if(q.type==='reach_screen') return 'Explore the ruins!';
  return '';
}

function openDialogue(idx) {
  const q = QUESTS[idx];
  if(dialogue.active && dialogue.questIdx === idx) return;
  dialogue.active = true;
  dialogue.questIdx = idx;
  dialogue.phase = q.active ? (isQuestDone(q)?'complete':'progress') : 'greeting';
  dialogue.timer = 0;
  if(!q.active) q.active = true;
}

function isQuestDone(q) {
  if(q.type==='collect_corn') return q.progress >= q.goal;
  if(q.type==='kill_enemies') return q.progress >= q.goal;
  if(q.type==='reach_screen') return q.progress >= 1;
  return false;
}

function checkQuestProgress(q, idx) {
  if(q.type==='collect_corn') q.progress = Math.min(q.goal, cornCount);
  if(q.type==='kill_enemies') q.progress = Math.min(q.goal, totalEnemiesKilled);
  if(q.type==='reach_screen') {
    if(screenCol===q.goalCol && screenRow===q.goalRow) q.progress=1;
  }
  if(isQuestDone(q) && !q.complete) {
    // Auto-trigger completion dialogue if near NPC
    const nx=q.tx*TILE+16, ny=q.ty*TILE+16;
    const dist=Math.hypot(player.x+16-nx, player.y+16-ny);
    if(dist < 60) openDialogue(idx);
  }
}

function completeQuest(idx) {
  const q = QUESTS[idx];
  q.complete = true;
  dialogue.active = false;
  q.onComplete();
  showSkillPopup('🎉', 'Quest complete!', q.reward, '#ffcc02');
  spawnP(q.tx*TILE+16, q.ty*TILE+16, '#ffcc02', 20);
  score += 300;
}

function drawNPCs() {
  if(isScrolling) return;
  QUESTS.forEach((q,i) => {
    if(q.screenCol !== screenCol || q.screenRow !== screenRow) return;
    const sx = q.tx*TILE, sy = q.ty*TILE;
    const bob = Math.sin(frame*0.06+i)*2;
    if(q.complete) {
      // Completed NPC — small grey, just waves
      ctx.globalAlpha = 0.5;
      drawNPCSprite(sx, sy+bob, q.npcColor, true);
      ctx.globalAlpha = 1;
      return;
    }
    drawNPCSprite(sx, sy+bob, q.npcColor, false);
    // Quest marker
    const pulse = 0.7+Math.sin(frame*0.1)*0.3;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = q.active ? '#aaffaa' : '#ffcc02';
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
    ctx.fillText(q.active && isQuestDone(q) ? '❗' : (q.active?'…':'!'), sx+16, sy-4+bob);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';

    ctx.fillText(q.npcName, sx+16, sy+34+bob);

}

function drawNPCSprite(sx, sy, color, greyed) {
  const c = greyed ? '#888' : color;
  // Body
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(sx+16, sy+20, 10, 12, 0, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.arc(sx+16, sy+8, 9, 0, Math.PI*2); ctx.fill();
  // Hat (sombrero-style)
  ctx.fillStyle = greyed?'#666':'#8B4513';
  ctx.fillRect(sx+8, sy+1, 16, 3);
  ctx.beginPath(); ctx.ellipse(sx+16, sy+1, 12, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = greyed?'#555':'#5c2a06';
  ctx.beginPath(); ctx.ellipse(sx+16, sy-2, 6, 5, 0, Math.PI, Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle = '#1a0a2e';
  ctx.beginPath(); ctx.arc(sx+12, sy+8, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+20, sy+8, 2, 0, Math.PI*2); ctx.fill();
  // Smile
  ctx.strokeStyle = '#5c3317'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx+16, sy+11, 3, 0.2, Math.PI-0.2); ctx.stroke();
  // Arms out (welcoming)
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(sx+4, sy+18, 4, 7, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sx+28, sy+18, 4, 7, 0.5, 0, Math.PI*2); ctx.fill();
  // Legs
  ctx.fillRect(sx+10, sy+28, 5, 8); ctx.fillRect(sx+17, sy+28, 5, 8);
}

function drawDialogue() {
  if(!dialogue.active) return;

}

// ── Auto-sizing message box helper ──────────────────────────
// Draws a pill box sized to the text, word-wrapped to maxW
// Returns box height so callers can stack things
function drawAutoBox(text, cx, cy, opts){
  opts = opts||{};
  const font     = opts.font   || 'bold 13px Fredoka One';
  const color    = opts.color  || '#ffcc02';
  const bg       = opts.bg     || 'rgba(0,0,0,0.82)';
  const border   = opts.border || null;
  const maxW     = opts.maxW   || (GW-32);
  const pad      = opts.pad    || 14;
  const radius   = opts.radius || 10;
  const alpha    = opts.alpha  !== undefined ? opts.alpha : 1;
  ctx.font = font;
  // Word-wrap
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  words.forEach(w=>{
    const t = cur+(cur?' ':'')+w;
    if(ctx.measureText(t).width > maxW-pad*2 && cur){ lines.push(cur); cur=w; }
    else cur=t;
  });
  if(cur) lines.push(cur);
  const lh = parseInt(font)+6;
  const bw = Math.min(GW-16, Math.max(...lines.map(l=>ctx.measureText(l).width)) + pad*2);
  const bh = lines.length*lh + pad;
  const bx = Math.round(cx - bw/2);
  const by = Math.round(cy - bh/2);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, radius); ctx.fill();
  if(border){ ctx.strokeStyle=border; ctx.lineWidth=1.5; ctx.stroke(); }
  ctx.fillStyle = color; ctx.textAlign='center';
  lines.forEach((l,i)=> ctx.fillText(l, cx, by+pad+(i+0.75)*lh));
  ctx.globalAlpha=1; ctx.textAlign='left';
  return bh;
}

function drawSkillPopup(){
  if(skillPopup.timer<=0)return;
  skillPopup.timer--;
  const t=skillPopup.timer;
  const alpha=Math.min(1,t/20);
  const slide=t>160?((180-t)/20)*30:t<20?(t/20)*30:30;
  const cy=GH/2+slide;
  ctx.globalAlpha=alpha;
  // Measure both lines to get box width
  ctx.font='bold 16px Fredoka One';
  const w1=ctx.measureText(skillPopup.text).width;
  ctx.font='12px Fredoka One';
  const w2=ctx.measureText(skillPopup.subtext).width;
  const bw=Math.min(GW-24, Math.max(w1,w2)+80); // +80 for icon + padding
  const bh=72;
  const bx=GW/2-bw/2;
  const by=cy-bh/2;
  ctx.fillStyle='rgba(0,0,0,0.92)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,14);ctx.fill();
  ctx.strokeStyle=skillPopup.color;ctx.lineWidth=2.5;ctx.stroke();
  // Icon left side
  ctx.font='28px Arial';ctx.textAlign='center';
  ctx.fillText(skillPopup.icon,bx+30,by+bh/2+10);
  // Text right of icon
  ctx.fillStyle=skillPopup.color;ctx.font='bold 16px Fredoka One';ctx.textAlign='left';
  ctx.fillText(skillPopup.text,bx+58,by+26);
  ctx.fillStyle='#ccc';ctx.font='12px Fredoka One';
  // Word-wrap subtext
  const words=skillPopup.subtext.split(' ');let line='',lx=bx+58,lyy=by+44;
  words.forEach(w=>{const tt=line+(line?' ':'')+w;if(ctx.measureText(tt).width>bw-68&&line){ctx.fillText(line,lx,lyy);line=w;lyy+=15;}else line=tt;});
  if(line)ctx.fillText(line,lx,lyy);
  ctx.globalAlpha=1;ctx.textAlign='left';
}

// ═══════════════════════════════════════════════
function fireProjectile(x,y,dir,type){
  const speed=type==='flame'?4:5;
  const vx=dir===1?-speed:dir===3?speed:0;
  const vy=dir===0?-speed:dir===2?speed:0;
  projectiles.push({x,y,vx,vy,type,life:40,hit:false});
}

function updateProjectiles(){
  const sc=currentScreen();
  projectiles=projectiles.filter(p=>p.life>0&&!p.hit);
  for(const p of projectiles){
    p.x+=p.vx; p.y+=p.vy; p.life--;
    // wall collision
    if(!walkable(sc.map,p.x+6,p.y+6)||!walkable(sc.map,p.x+6,p.y+6)){p.hit=true;continue;}
    // enemy collision
    const eList=sc.enemies;
    const ss=getScreenState(screenCol,screenRow);
    eList.forEach((e,i)=>{
      if(ss.enemyHps[i]<=0)return;
      if(e._x===undefined)return;
      const d=Math.hypot(p.x+8-(e._x+14),p.y+8-(e._y+18));
      if(d<30){p.hit=true;ss.enemyHps[i]=0;score+=75;spawnP(e._x+14,e._y+14,p.type==='flame'?'#ff6600':'#22ff22',14);}
    });
    // jaguar collision
    if(!jagDead&&jaguar.active){
      const d=Math.hypot(p.x+8-(jaguar.x+20),p.y+8-(jaguar.y+20));
      if(d<40){p.hit=true;jaguar.hp-=0.5;jaguar.st=30;spawnP(jaguar.x+20,jaguar.y+20,'#ff6600',10);}
    }
    // jalapeno hits multiple
    if(p.type==='jalapeno'&&p.life<35){
      spawnP(p.x+8,p.y+8,'#ff6600',3);
    }
  }
}

function drawProjectiles(){
  for(const p of projectiles){
    if(p.type==='flame'){
      const sz=6+Math.sin(frame*0.4)*2;
      ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(p.x+8,p.y+8,sz,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(p.x+8,p.y+8,sz*0.5,0,Math.PI*2);ctx.fill();
    } else if(p.type==='jalapeno'){
      ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText('🌮',p.x+8,p.y+14);ctx.textAlign='left';
    }
  }
}

function checkSecretPassages(){

    if(sp.sc!==screenCol||sp.sr!==screenRow)return;

      drawAutoBox(sp.type==='crack'?'💥 Peck the wall!':'🌿 Walk through!', GW/2, GH-40, {font:'bold 12px Fredoka One',color:'#90e0ef',alpha:pulse,maxW:GW-40});
    }
    // Crack passage - triggered by peck
    if(sp.type==='crack'&&!foundPassages.has(i)){
      if(player.atk>10&&dist<52){
        foundPassages.add(i);
        screenCol=sp.destCol; screenRow=sp.destRow;
        player.x=sp.destX; player.y=sp.destY; player.inv=60;
        showSkillPopup('🔓',sp.label,'Secret passage found!','#90e0ef');

      setTimeout(()=>{showSkillPopup('🐆','EL JAGUAR!','The final battle begins!','#f4a261');},500);
      setTimeout(()=>{popup={text:'🐆 "So you finally made it, little pollo... IMPRESSIVE. But it ends HERE!"',timer:260};},2000);}
        else if(screenIndex(screenCol,screenRow)!==screenIndex(9,7)) jaguar.active=false;
      }
    }
    // Fake tile - walk through
    if(sp.type==='fake'&&!foundPassages.has(i)){
      if(dist<32){
        foundPassages.add(i);
        screenCol=sp.destCol; screenRow=sp.destRow;
        player.x=sp.destX; player.y=sp.destY; player.inv=60;
        showSkillPopup('🌿',sp.label,'Hidden passage!','#40916c');
        spawnP(sp.tx*TILE+16,sp.ty*TILE+16,'#40916c',16);
        if(screenIndex(screenCol,screenRow)===screenIndex(9,7)&&!jagDead&&isReadyForBoss()){jaguar.active=true;jaguar.x=540;jaguar.y=380;jaguar._telegraph=0;

      setTimeout(()=>{popup={text:'🐆 "So you finally made it, little pollo... IMPRESSIVE. But it ends HERE!"',timer:260};},2000);}
        else if(screenIndex(screenCol,screenRow)!==screenIndex(9,7)) jaguar.active=false;
      }
    }
  });
}

function openChest(tpx,tpy){
  const k=`${screenCol},${screenRow}`;
  // Is this a skill scroll chest?
  if(SKILL_SCROLL_SCREENS.has(k)&&skillsFoundCount<SKILL_SCROLL_ORDER.length){
    const skillName=SKILL_SCROLL_ORDER[skillsFoundCount];
    skills[skillName]=true;
    skillsFoundCount++;
    const defs={
      spicyPeck:  ['🌶️','SPICY PECK!','Breathe flame on attack!','#ff4400'],
      doublePeck: ['✌️','DOUBLE PECK!','Attack hits twice!','#ffcc00'],
      cornMagnet: ['🧲','CORN MAGNET!','Auto-collect nearby corn!','#ff9f1c'],
      featherDash:['💨','FEATHER DASH!','Double-tap to dash!','#48cae4'],
    };
    const d=defs[skillName];
    showSkillPopup(d[0],d[1],d[2],d[3]);
    spawnP(tpx,tpy,d[3],24);
    score+=250;
    return;
  }
  // Tool scroll chest?
  if(TOOL_SCROLL_SCREENS.has(k)&&toolsFoundCount<TOOL_ORDER.length){
    const tool=TOOL_ORDER[toolsFoundCount];
    toolsFoundCount++;
    if(tool==='shield'){tools.shieldHits=3;tools.shieldActive=true;showSkillPopup('🛡️','COMB SHIELD!','Blocks 3 hits! Auto-equips.','#48cae4');}
    else if(tool==='jalapeno'){tools.jalapenoCount+=3;showSkillPopup('🌮','JALAPEÑO BOMB!','3 throwable bombs! Use PECK while dashing.','#22cc44');}
    else if(tool==='map'){tools.mapRevealed=true;showSkillPopup('🗺️','ANCIENT MAP!','All chests revealed on minimap!','#DAA520');}
    spawnP(tpx,tpy,'#22cc44',20);
    score+=200;
    return;
  }
  // Normal chest rewards
  const reward=Math.floor(Math.random()*4);
  if(reward===0){score+=150;popup={text:'💰 +150 pts!',timer:90};}
  else if(reward===1){player.hp=Math.min(player.maxHp,player.hp+2);popup={text:'❤️❤️ +2 Hearts!',timer:90};}
  else if(reward===2){cornCount+=5;score+=50;popup={text:'🌽×5 Corn!',timer:90};}
  else{tools.jalapenoCount++;popup={text:'🌮 Jalapeño Bomb!',timer:90};}
  spawnP(tpx,tpy,'#FFD700',16);
}

let lastDirTap={dir:-1,time:0};
function checkDash(dx,dy){
  if(!skills.featherDash||dash.cooldown>0||dash.active)return;
  // Double-tap detection via joystick sudden movement
  const now=frame;
  const curDir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0);
  if(curDir===lastDirTap.dir&&now-lastDirTap.time<12&&now-lastDirTap.time>2){
    dash.active=true; dash.dx=dx; dash.dy=dy;
    dash.timer=DASH_FRAMES; dash.cooldown=DASH_COOLDOWN;
    spawnP(player.x+16,player.y+16,'#48cae4',12);
    // jalapeno throw while dashing
    if(tools.jalapenoCount>0){
      tools.jalapenoCount--;
      fireProjectile(player.x+8,player.y+8,player.dir,'jalapeno');
    }
  }
  lastDirTap={dir:curDir,time:now};
}

// ── FISHING ROD ──────────────────────────────────────────────
// Reel in the line — collect catch or just recall
function reelIn(){
  if(!fishLine) return;

  if(fishLine.stuck && fishLine.stuckEnemy >= 0){
    // Already hooked — pull it in
    const sc2 = currentScreen();
    const ss2 = getScreenState(screenCol,screenRow);
    const i = fishLine.stuckEnemy;
    if(ss2.enemyHps[i] > 0){
      ss2.enemyHps[i] = 0;
      totalEnemiesKilled++;
      score += 120;
      spawnP(sc2.enemies[i]._x+14, sc2.enemies[i]._y+14, '#48cae4', 16);
      spawnP(player.x+16, player.y+16, '#ffcc02', 10);
      showSkillPopup('🎣','Caught one!','+120 pts!','#48cae4');
    }
    fishLine = null;
    return;
  }

  // Sweep retraction path for corn, feathers, enemies
  const sc2 = currentScreen();
  const ss2 = getScreenState(screenCol,screenRow);
  const lx = fishLine.x, ly = fishLine.y;
  const px = player.x+16, py = player.y+16;
  const segDx = px-lx, segDy = py-ly;
  const segLen = Math.hypot(segDx, segDy);

  function distToSeg(ex, ey){
    if(segLen < 1) return Math.hypot(ex-lx, ey-ly);
    const t = Math.max(0, Math.min(1, ((ex-lx)*segDx + (ey-ly)*segDy) / (segLen*segLen)));
    return Math.hypot(ex-(lx+t*segDx), ey-(ly+t*segDy));
  }

  let snagged = -1, snagDist = Infinity;
  sc2.enemies.forEach((e,i) => {
    if(ss2.enemyHps[i] <= 0 || e._x === undefined) return;
    const ex = e._x+14, ey = e._y+18;
    const t = segLen>0 ? Math.max(0,Math.min(1,((ex-lx)*segDx+(ey-ly)*segDy)/(segLen*segLen))) : 0;
    if(distToSeg(ex,ey) < 36 && t < snagDist){ snagged=i; snagDist=t; }
  });

  let cornSnagged = 0;
  sc2.corn.forEach((corn,i) => {
    if(ss2.gotCorns.has(i)) return;
    const cx = corn.x*TILE+8, cy = corn.y*TILE+8;
    if(distToSeg(cx,cy) < 28){
      ss2.gotCorns.add(i); cornCount++; score+=10; cornSnagged++;
      spawnP(cx, cy, '#ffcc02', 6);
    }
  });

  let featherSnagged = 0;
  sc2.feathers&&sc2.feathers.forEach((f,i) => {
    if(ss2.gotFeathers.has(i)) return;
    const fx = f.tx*TILE+8, fy = f.ty*TILE+8;
    if(distToSeg(fx,fy) < 28){
      ss2.gotFeathers.add(i); score+=30;
      if(player.hp < player.maxHp) player.hp++;
      featherSnagged++;
      spawnP(fx, fy, '#ff9f1c', 8);
    }
  });

  if(snagged >= 0){
    ss2.enemyHps[snagged] = 0; totalEnemiesKilled++; score += 80;
    spawnP(sc2.enemies[snagged]._x+14, sc2.enemies[snagged]._y+14, '#48cae4', 14);
    spawnP(player.x+16, player.y+16, '#ffcc02', 8);
    const bonus = cornSnagged>0 ? ` +${cornSnagged}🌽` : '';
    showSkillPopup('🎣','Snagged on reel!',`+80 pts!${bonus}`,'#48cae4');
  } else if(cornSnagged > 0 || featherSnagged > 0){
    const parts = [];
    if(cornSnagged > 0) parts.push(`${cornSnagged}🌽`);
    if(featherSnagged > 0) parts.push(`${featherSnagged}🪶`);
    popup={text:`🎣 Reeled in ${parts.join(' + ')}!`, timer:100};
  } else {
    popup={text:'🎣 Nothing caught...', timer:70};
  }

  // Always clear immediately — no animation that can get stuck
  fishLine = null;
}

function updateFishingRod(){
  if(tools.fishingCooldown>0)tools.fishingCooldown--;
  if(!fishLine)return;
  if(isScrolling){fishLine=null;return;}

  fishLine.life--;
  if(fishLine.life<=0){
    if(fishLine.stuck&&fishLine.stuckEnemy>=0) reelIn();
    else popup={text:'🎣 Line drifted back...',timer:60};
    fishLine=null; return;
  }
  if(!fishLine.stuck){
    fishLine.x+=fishLine.vx; fishLine.y+=fishLine.vy;
    const sc2=currentScreen(); const ss2=getScreenState(screenCol,screenRow);
    // Check enemy hit
    sc2.enemies.forEach((e,i)=>{
      if(!fishLine||fishLine.stuck||ss2.enemyHps[i]<=0||e._x===undefined)return;
      const d=Math.hypot(fishLine.x-(e._x+14),fishLine.y-(e._y+18));
      if(d<24){fishLine.stuck=true;fishLine.stuckEnemy=i;fishLine.stuckTimer=150;}
    });
    // Wall check
    if(fishLine&&!fishLine.stuck){
      const sc3=currentScreen();
      if(!walkable(sc3.map,fishLine.x,fishLine.y)){fishLine=null;return;}
    }
  } else {
    // Enemy is hooked — stun it and drag it slightly toward player
    const sc2=currentScreen(); const ss2=getScreenState(screenCol,screenRow);
    const i=fishLine.stuckEnemy;
    if(i>=0&&ss2.enemyHps[i]>0&&sc2.enemies[i]._x!==undefined){
      const e=sc2.enemies[i];
      // Stun — freeze movement
      e._vx=0; e._vy=0;
      fishLine.stuckTimer--;
      if(fishLine.stuckTimer<=0){
        // Release — enemy stunned but alive (bright flash)
        spawnP(e._x+14,e._y+14,'#48cae4',10);
        popup={text:'🎣 Hooked! Enemy stunned!',timer:80};
        fishLine=null;
      }
    } else { fishLine=null; }
  }
}

function drawFishingRod(){
  if(!fishLine)return;
  // Line from player to lure — animated dashed
  ctx.strokeStyle='rgba(72,202,228,0.85)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.setLineDash([6,3]); ctx.lineDashOffset=-frame*0.5;
  ctx.beginPath(); ctx.moveTo(player.x+16,player.y+16); ctx.lineTo(fishLine.x,fishLine.y); ctx.stroke();
  ctx.setLineDash([]);
  if(!fishLine.stuck){
    // Animated lure — pulses
    const ps=0.7+Math.sin(frame*0.3)*0.3;
    ctx.fillStyle='rgba(72,202,228,0.4)'; ctx.beginPath(); ctx.arc(fishLine.x,fishLine.y,10*ps,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#48cae4'; ctx.beginPath(); ctx.arc(fishLine.x,fishLine.y,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff6b6b'; ctx.beginPath(); ctx.arc(fishLine.x,fishLine.y,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(72,202,228,0.6)'; ctx.font='10px Arial'; ctx.textAlign='center';
    ctx.fillText('🎣',fishLine.x,fishLine.y-10); ctx.textAlign='left';
  } else {
    // Hooked — big flash + stun timer ring
    const progress=fishLine.stuckTimer/150;
    ctx.strokeStyle='#ffcc02'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(fishLine.x,fishLine.y,16,-Math.PI/2,-Math.PI/2+Math.max(0.01,progress)*Math.PI*2); ctx.stroke();
    const flash=Math.sin(frame*0.5)>0;
    ctx.fillStyle=flash?'#ffcc02':'#ff6b6b';
    ctx.font='18px Arial'; ctx.textAlign='center';
    ctx.fillText('🪝',fishLine.x,fishLine.y+6);
    ctx.fillStyle='#fff'; ctx.font='bold 11px Fredoka One';
    ctx.fillText('HOOKED!',fishLine.x,fishLine.y-18);
    ctx.textAlign='left';
  }
}

// ── HERO BALL ─────────────────────────────────────────────────
function updateHeroBalls(){
  if(isScrolling){heroBalls=[];return;}
  const sc2=currentScreen(); const ss2=getScreenState(screenCol,screenRow);
  heroBalls=heroBalls.filter(b=>b.life>0&&b.bounces>=0);
  heroBalls.forEach(b=>{
    b.x+=b.vx; b.y+=b.vy; b.life--;

    if(!walkable(sc2.map,b.x,b.y)){b.vx*=-1;b.vy*=-1;b.bounces--;b.x+=b.vx*4;b.y+=b.vy*4;spawnP(b.x,b.y,'#e17055',6);}
    // hit enemies
    sc2.enemies.forEach((e,i)=>{
      if(ss2.enemyHps[i]<=0||e._x===undefined||b.hitEnemies.has(i))return;
      const d=Math.hypot(b.x-(e._x+14),b.y-(e._y+18));
      if(d<30){ss2.enemyHps[i]=0;score+=80;b.hitEnemies.add(i);b.bounces--;spawnP(e._x+14,e._y+14,'#e17055',10);totalEnemiesKilled++;}

// Particles
let parts=[];
function spawnP(x,y,col,n=8){for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2;parts.push({x,y,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,life:30,ml:30,col});}}
function tickP(){parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;const al=p.life/p.ml;ctx.fillStyle=p.col+Math.floor(al*255).toString(16).padStart(2,'0');ctx.beginPath();ctx.arc(p.x,p.y,4*al,0,Math.PI*2);ctx.fill();}}

// ═══════════════════════════════════════════════
const BLOCKED_TILES=[T.JUNGLE,T.WALL,T.CLIFF,T.MANGROVE,T.RUIN,T.DEEP]; // WATER removed — swimming allowed, DEEP still blocked
function tileAt(map,px,py){
  const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=20||ty>=15)return T.WALL;
  return map[ty][tx];
}
function walkable(map,px,py){
  return !BLOCKED_TILES.includes(tileAt(map,px,py));
}
// Check a full bounding box (all 4 corners + midpoints)
function boxWalkable(map,x,y){
  const L=x+4, R=x+28, T_=y+14, B=y+30, MX=x+16, MY=y+22;
  return walkable(map,L,T_)&&walkable(map,R,T_)&&
         walkable(map,L,B)&&walkable(map,R,B)&&
         walkable(map,MX,T_)&&walkable(map,MX,B)&&
         walkable(map,L,MY)&&walkable(map,R,MY);
}
// Push player out of any blocked tile they're overlapping
function pushOut(map){
  for(let attempt=0;attempt<16;attempt++){
    const L=player.x+4,R=player.x+28,T_=player.y+14,B=player.y+30;
    const corners=[{x:L,y:T_},{x:R,y:T_},{x:L,y:B},{x:R,y:B}];
    let stuck=false;
    for(const c of corners){
      if(BLOCKED_TILES.includes(tileAt(map,c.x,c.y))){
        stuck=true;
        // nudge away from the blocked tile's center
        const tx=Math.floor(c.x/TILE),ty=Math.floor(c.y/TILE);
        const tcx=(tx+0.5)*TILE, tcy=(ty+0.5)*TILE;
        player.x+=(player.x+16>tcx)?1:-1;
        player.y+=(player.y+22>tcy)?1:-1;
        break;
      }
    }
    if(!stuck)break;
  }
}

// Zone-based palettes — each zone has its own sky/ground color scheme

  beach:  { bg:'#e8d5a3', ground:'#f5deb3', accent:'#ffd166', path:'#e8c97a', wall:'#c4a050' },
  jungle: { bg:'#0d2818', ground:'#1b4332', accent:'#40916c', path:'#2d6a4f', wall:'#0a1f12' },

function getZonePalette(){
  if(screenCol>=8) return ZONE_PALETTES.jaguar;

  if(screenCol>=4) return ZONE_PALETTES.jungle;

  [T.PATH]:   ['#e0c060','#c8a840','#b09030'],
  [T.JUNGLE]: ['#1b4332','#2d6a4f','#40916c'],
  [T.WATER]:  ['#0096c7','#48cae4','#90e0ef'],

  [T.MANGROVE]:['#1b4332','#52b788','#2d6a4f'],

function drawTile(t,sx,sy,fr){
  const pal=PALETTE[t]||PALETTE[T.SAND];
  const zp=getZonePalette();

  // Zone-tinted base fills
  if(t===T.PATH){
    ctx.fillStyle=zp.path; ctx.fillRect(sx,sy,TILE,TILE);
    // cobblestone pattern varies by zone
    if(screenCol>=6){ // ruins: stone blocks
      ctx.fillStyle=screenCol>=8?'#3a2260':'#b09878';
      ctx.fillRect(sx+1,sy+1,14,13); ctx.fillRect(sx+17,sy+16,13,13);
      ctx.fillStyle=screenCol>=8?'#2a1650':'#a08868';
      ctx.fillRect(sx+2,sy+2,12,11); ctx.fillRect(sx+18,sy+17,11,11);
    } else if(screenCol>=4){ // jungle: mossy path
      ctx.fillStyle='#3a6a48'; ctx.fillRect(sx+3,sy+3,8,8); ctx.fillRect(sx+18,sy+20,10,8);
      ctx.fillStyle='#4a7a58'; ctx.fillRect(sx+5,sy+22,6,6);
    } else if(screenCol>=2){ // beach: sandy path
      ctx.fillStyle='#d4b060'; ctx.fillRect(sx+4,sy+12,7,5); ctx.fillRect(sx+18,sy+6,6,4);
    } else { // coast: wet stone
      ctx.fillStyle='#1a6a8a'; ctx.fillRect(sx+2,sy+8,28,4); ctx.fillRect(sx+2,sy+20,28,4);
    }
    return;
  }

  if(t===T.RF){ // floor tile — very different per zone
    if(screenCol>=8){ // jaguar: dark purple stone
      ctx.fillStyle='#2d1b4e'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#3d2b6e'; ctx.fillRect(sx+1,sy+1,14,14); ctx.fillRect(sx+17,sy+17,13,13);
      ctx.fillStyle='#4d3b7e'; ctx.fillRect(sx+3,sy+3,10,10); ctx.fillRect(sx+19,sy+19,9,9);
      // purple rune glow
      const glow=0.15+Math.sin(fr*0.04+sx*0.1)*0.1;
      ctx.fillStyle=`rgba(140,80,255,${glow})`; ctx.fillRect(sx+12,sy+12,8,8);
    } else if(screenCol>=6){ // ruins: worn stone
      ctx.fillStyle='#3d2416'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#4d3420'; ctx.fillRect(sx,sy+15,TILE,2); ctx.fillRect(sx+15,sy,2,TILE);
      ctx.fillStyle='#5d4430'; ctx.fillRect(sx+6,sy+6,4,4); ctx.fillRect(sx+22,sy+22,4,4);
    } else { // jungle/beach: sandy stone
      ctx.fillStyle='#c4a882'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#d4b892'; ctx.fillRect(sx,sy+15,TILE,2); ctx.fillRect(sx+15,sy,2,TILE);
    }
    return;
  }

  if(t===T.WALL){
    if(screenCol>=8){ // jaguar: obsidian
      ctx.fillStyle='#120820'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#1e0e30'; ctx.fillRect(sx+2,sy+2,28,12); ctx.fillRect(sx+2,sy+18,28,12);
      ctx.fillStyle='#5500aa'; ctx.fillRect(sx+13,sy+14,6,4); // glowing crack
    } else if(screenCol>=6){ // ruins: carved stone
      ctx.fillStyle='#2c1810'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#3c2418'; ctx.fillRect(sx+1,sy+1,14,14); ctx.fillRect(sx+17,sy+17,13,13);
      ctx.fillStyle='#4c3428'; ctx.fillRect(sx+4,sy+4,8,8); ctx.fillRect(sx+20,sy+20,6,6);
    } else { // jungle: dense trees
      ctx.fillStyle='#0d2010'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#1a3818'; ctx.beginPath();ctx.arc(sx+10,sy+12,9,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+22,sy+18,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a5028'; ctx.beginPath();ctx.arc(sx+16,sy+8,7,0,Math.PI*2);ctx.fill();
    }
    return;
  }

  if(t===T.JUNGLE){
    // Coast/beach jungle is bright; deep jungle is dark; jaguar zone is eerie
    if(screenCol>=8){
      ctx.fillStyle='#150828'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#250a3a'; ctx.beginPath();ctx.arc(sx+12,sy+14,10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7b2d8b'; ctx.beginPath();ctx.arc(sx+8,sy+6,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(123,45,139,0.3)'; ctx.beginPath();ctx.arc(sx+22,sy+22,8,0,Math.PI*2);ctx.fill();
    } else if(screenCol>=4){
      ctx.fillStyle='#0d2010'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#1b3a18'; ctx.beginPath();ctx.arc(sx+10,sy+12,9,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+22,sy+18,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2d6a2a'; ctx.beginPath();ctx.arc(sx+16,sy+8,6,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#1b4332'; ctx.fillRect(sx,sy,TILE,TILE);

      ctx.beginPath();ctx.arc(sx+22,sy+20,10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#40916c'; ctx.beginPath();ctx.arc(sx+16,sy+8,6,0,Math.PI*2);ctx.fill();

  if(t===T.SAND){
    if(screenCol>=8){ // jaguar: dark sand/bone
      ctx.fillStyle='#2a1e14'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#3a2e22'; ctx.fillRect(sx+4,sy+14,8,4); ctx.fillRect(sx+19,sy+6,6,3);

      ctx.fillStyle='#d4c090'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#b8a878'; ctx.fillRect(sx+4,sy+14,7,4); ctx.fillRect(sx+18,sy+6,5,3);
      ctx.fillStyle='rgba(72,202,228,0.2)'; ctx.fillRect(sx+8,sy+20,16,6); // wet sheen
    } else {
      ctx.fillStyle=pal[0]; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle=pal[1]; ctx.fillRect(sx+4,sy+14,7,4); ctx.fillRect(sx+18,sy+6,5,3);
    }

  if(t===T.WATER){
    const wave=Math.sin(fr*0.05+sx*0.02)*2;
    // Coast water = deep ocean blue; beach = turquoise cenote
    if(screenCol<=1){
      ctx.fillStyle='#0050a0'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#0077cc'; ctx.fillRect(sx+2,sy+6+wave,28,4); ctx.fillRect(sx+4,sy+18+wave,24,3);
      ctx.fillStyle='#4499ee'; ctx.fillRect(sx+4,sy+7+wave,8,1);
    } else {
      ctx.fillStyle='#0096c7'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#48cae4'; ctx.fillRect(sx+2,sy+8+wave,28,3); ctx.fillRect(sx+6,sy+20+wave,22,3);
      ctx.fillStyle='#90e0ef'; ctx.fillRect(sx+4,sy+9+wave,10,1);
    }
    return;
  }

  if(t===T.RUIN){
    if(screenCol>=8){
      ctx.fillStyle='#1e0e30'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#2e1e44'; ctx.fillRect(sx+2,sy+2,14,14); ctx.fillRect(sx+18,sy+18,12,12);
      ctx.fillStyle='#5500aa'; ctx.fillRect(sx+5,sy+5,5,5);
    } else {
      ctx.fillStyle=pal[0]; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle=pal[1]; ctx.fillRect(sx+2,sy+2,14,14); ctx.fillRect(sx+18,sy+18,12,12);
      ctx.fillStyle=pal[2]; ctx.fillRect(sx+5,sy+5,5,5);
    }
    return;
  }

  // Remaining tiles — use original logic
  ctx.fillStyle=pal[0]; ctx.fillRect(sx,sy,TILE,TILE);
  if(t===T.CLIFF){
    ctx.fillStyle=pal[1]; ctx.fillRect(sx,sy+24,TILE,8);
    ctx.fillStyle=pal[2]; ctx.fillRect(sx+2,sy+26,4,2); ctx.fillRect(sx+20,sy+28,5,2);
  }
  if(t===T.MANGROVE){
    ctx.fillStyle=pal[1]; ctx.beginPath();ctx.arc(sx+16,sy+12,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1b4332'; ctx.fillRect(sx+14,sy+20,4,12);
    ctx.fillStyle=pal[2]; ctx.fillRect(sx+8,sy+28,16,4);
  }
  if(t===T.FLOWER){
    // gentle healing glow underneath
    const glow=0.15+Math.sin(fr*0.07+sx*0.05)*0.1;
    ctx.fillStyle=`rgba(255,133,161,${glow})`;
    ctx.beginPath();ctx.arc(sx+16,sy+16,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=pal[1]; ctx.beginPath();ctx.arc(sx+16,sy+16,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff85a1';
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2+fr*0.02;ctx.beginPath();ctx.arc(sx+16+Math.cos(a)*6,sy+16+Math.sin(a)*6,4,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#FFD700'; ctx.beginPath();ctx.arc(sx+16,sy+16,3,0,Math.PI*2);ctx.fill();
    // tiny ❤ float every few seconds
    const hpulse=Math.sin(fr*0.04+sx);
    if(hpulse>0.97){
      ctx.globalAlpha=0.6;ctx.font='10px Arial';ctx.textAlign='center';
      ctx.fillText('❤',sx+16,sy-2+Math.sin(fr*0.08)*3);
      ctx.globalAlpha=1;ctx.textAlign='left';
    }
  }
  if(t===T.DOOR){
    ctx.fillStyle=pal[1]; ctx.fillRect(sx+8,sy+4,16,24);
    ctx.fillStyle=pal[2]; ctx.fillRect(sx+10,sy+6,12,20);
    ctx.fillStyle='#FFD700'; ctx.beginPath();ctx.arc(sx+20,sy+16,2,0,Math.PI*2);ctx.fill();
  }
  if(t===T.CHEST){
    ctx.fillStyle=pal[0]; ctx.fillRect(sx+4,sy+10,24,14);
    ctx.fillStyle=pal[1]; ctx.fillRect(sx+4,sy+6,24,6);
    ctx.fillStyle='#8B4513'; ctx.fillRect(sx+4,sy+15,24,2);
    ctx.fillStyle='#FFD700'; ctx.beginPath();ctx.arc(sx+16,sy+15,3,0,Math.PI*2);ctx.fill();
  }
}

function drawOpenDoor(sx,sy){

  ctx.fillStyle='#1a0a2e'; ctx.fillRect(sx+10,sy+6,12,22);

function drawScreen(sc,ss){
  if(!ss)ss=getScreenState(screenCol,screenRow);
  // Zone background sky/fog color
  const zp=getZonePalette();
  ctx.fillStyle=zp.bg; ctx.fillRect(0,0,GW,GH);
  for(let ty=0;ty<15;ty++)for(let tx=0;tx<20;tx++){
    const t=sc.map[ty][tx];
    drawTile(t,tx*TILE,ty*TILE,frame);
    if(t===T.CHEST&&ss.openedChests.has(ty*20+tx))drawOpenChest(tx*TILE,ty*TILE);
    if(t===T.DOOR&&ss.openDoors.has(ty*20+tx))drawOpenDoor(tx*TILE,ty*TILE);
    // Draw secret passage overlays
    SECRET_PASSAGES.forEach((sp,i)=>{
      if(sp.sc!==screenCol||sp.sr!==screenRow)return;
      if(foundPassages.has(i))return;
      if(sp.tx===tx&&sp.ty===ty){
        if(sp.type==='crack')drawCrackedWall(tx*TILE,ty*TILE);
        else if(sp.type==='fake')drawFakeJungle(tx*TILE,ty*TILE);
      }
    });
  }
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(GW/2-80,4,160,20);
  ctx.fillStyle='#ffcc02'; ctx.font='bold 13px Fredoka One'; ctx.textAlign='center';
  ctx.fillText(sc.name,GW/2,18); ctx.textAlign='left';

}

function drawClimbMarkers(sc){
  const map=sc.map;
  for(let ty=1;ty<14;ty++) for(let tx=1;tx<19;tx++){
    if(map[ty][tx]!==T.JUNGLE) continue;
    // Only mark jungle tiles that border a walkable tile (edge tiles)
    const neighbors=[
      map[ty-1]?.[tx], map[ty+1]?.[tx],
      map[ty]?.[tx-1], map[ty]?.[tx+1]
    ];
    const isEdge=neighbors.some(t=>t===T.PATH||t===T.SAND||t===T.RF||t===T.FLOWER);
    if(!isEdge) continue;
    const sx=tx*TILE, sy=ty*TILE;
    // Animated vine/arrow pointing up
    const pulse=0.55+Math.sin(frame*0.1+tx*0.4+ty*0.7)*0.35;
    ctx.globalAlpha=pulse;
    // Green arrow sign on jungle edge
    ctx.fillStyle='#1b4332';
    ctx.beginPath();ctx.roundRect(sx+8,sy+4,16,14,4);ctx.fill();
    ctx.fillStyle='#95d5b2';
    ctx.font='9px Arial'; ctx.textAlign='center';
    ctx.fillText('🌿',sx+16,sy+15);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function drawMiniJag(x,y,hp,fr){

  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(20,40,18,5,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#8b4513';for(const[sx,sy] of [[6,18],[28,14],[12,28],[30,26],[20,20]]){ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();}
  // head
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.arc(20,10,13,0,Math.PI*2);ctx.fill();
  // ears
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.moveTo(8,4);ctx.lineTo(3,-4);ctx.lineTo(13,2);ctx.fill();
  ctx.beginPath();ctx.moveTo(32,4);ctx.lineTo(37,-4);ctx.lineTo(27,2);ctx.fill();
  ctx.fillStyle='#ff8fa3';ctx.beginPath();ctx.moveTo(9,3);ctx.lineTo(5,-2);ctx.lineTo(12,2);ctx.fill();
  ctx.beginPath();ctx.moveTo(31,3);ctx.lineTo(35,-2);ctx.lineTo(28,2);ctx.fill();
  // eyes — wide & surprised
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(14,9,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(26,9,6,0,Math.PI*2);ctx.fill();
  const px2=Math.cos(fr*0.2)*2,py2=Math.sin(fr*0.2)*2;
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(14+px2,9+py2,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(26-px2,9-py2,3,0,Math.PI*2);ctx.fill();
  // cheeky grin (wider than boss)
  ctx.strokeStyle='#5c3317';ctx.lineWidth=2;ctx.beginPath();ctx.arc(20,16,7,0.1,Math.PI-0.1);ctx.stroke();
  ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.ellipse(20,22,4,3,0,0,Math.PI);ctx.fill();
  // wagging tail
  ctx.strokeStyle='#e07840';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(3,28);ctx.quadraticCurveTo(-10,20+Math.sin(fr*0.18)*10,-18,30+Math.sin(fr*0.14)*12);ctx.stroke();
  // legs
  ctx.fillStyle='#e07840';ctx.fillRect(7,36,7,9);ctx.fillRect(26,36,7,9);

  ctx.font='16px Arial';ctx.textAlign='center';
  ctx.fillText(icon,x+12,y-14);
  ctx.textAlign='left';
}

  mmCtx.fillStyle='#000'; mmCtx.fillRect(0,0,102,82);

      mmCtx.fillStyle=getZoneMMBg(col);

let nextScreenCol=1,nextScreenRow=1;
let scrollOffX=0,scrollOffY=0,scrollDirX=0,scrollDirY=0,scrollProgress=0;
let isScrolling=false;

function startScroll(newCol,newRow,dx,dy){
  if(isScrolling)return;
  nextScreenCol=newCol; nextScreenRow=newRow;
  scrollDirX=dx; scrollDirY=dy; scrollProgress=0; isScrolling=true;
  scrollOffX=0; scrollOffY=0;
}

function updateScroll(){
  if(!isScrolling)return;
  scrollProgress++;
  const t=scrollProgress/SCROLL_FRAMES;
  scrollOffX=-scrollDirX*GW*t;
  scrollOffY=-scrollDirY*GH*t;
  if(scrollProgress>=SCROLL_FRAMES){
    isScrolling=false;
  airportOpen=false;
  activeMap=null;
  inMiesfelds=false;
    screenCol=nextScreenCol; screenRow=nextScreenRow;
    charmedEnemies.clear(); fishLine=null;
    scrollOffX=0; scrollOffY=0;
    // reposition player on new screen
    if(scrollDirX>0) player.x=8;
    if(scrollDirX<0) player.x=GW-48;
    if(scrollDirY>0) player.y=8;
    if(scrollDirY<0) player.y=GH-48;
    // activate jaguar in boss room
    if(screenIndex(screenCol,screenRow)===screenIndex(9,7)&&!jagDead&&isReadyForBoss()){
      jaguar.active=true; jaguar.x=540; jaguar.y=380; jaguar._telegraph=0;
    } else if(screenIndex(screenCol,screenRow)!==screenIndex(9,7)){ jaguar.active=false; }
    // announce town arrival
    const arrivedTown=TOWNS.find(t=>t.screenCol===screenCol&&t.screenRow===screenRow&&t.unlocked);
    if(arrivedTown) popup={text:arrivedTown.emoji+' Welcome to '+arrivedTown.name+'!',timer:130};
  }
}

const keys={};
document.addEventListener('keydown',e=>{
  // Tab cycles active tool
  if(e.key==='Tab'&&!shopOpen&&!noticeBoardOpen&&!dialogue.active){
    e.preventDefault();
    const avail=TOOL_CYCLE.filter(t=>{
      if(t==='peck') return true;
      if(t==='rod')   return tools.fishingRod;
      if(t==='flute') return tools.jungleFlute;
      if(t==='ball')  return tools.heroBall&&tools.heroBallCount>0;
      if(t==='tamale')return tools.tamaleCount>0;
      return false;
    });
    const idx=avail.indexOf(activeTool);
    activeTool=avail[(idx+1)%avail.length];
    popup={text:'🔄 '+toolName(activeTool),timer:70};
    updateToolIcon();
    return;
  }
  if(shopOpen){
    const items=SHOP_ITEMS.filter(it=>it.townId===shopTownId);
    if(e.key==='ArrowUp'||e.key==='w'){shopSelected=Math.max(0,shopSelected-1);e.preventDefault();return;}
    if(e.key==='ArrowDown'||e.key==='s'){shopSelected=Math.min(items.length-1,shopSelected+1);e.preventDefault();return;}
    if(e.key==='Escape'||e.key==='q'){shopOpen=false;e.preventDefault();return;}
  }
  if(noticeBoardOpen){if(e.key==='Escape'||e.key==='q'){noticeBoardOpen=false;e.preventDefault();return;}}
  keys[e.key]=true;if(gameState==='title'&&(e.key===' '||e.key==='Enter'))startGame();if((gameState==='win'||gameState==='lose')&&e.key==='r'){
    if(saveData.activeSavePoint>=0&&gameState==='lose'){gameState='play';showMsg('');respawnAtSave();}
    else restartGame();
  }
  if(gameState==='lose'&&(e.key==='q'||e.key==='Q'))restartGame();e.preventDefault();},{passive:false});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function updatePlayer(){
  if(isScrolling||battleMode)return;
  const sc=currentScreen();
  // Check climb FIRST so _nearClimb is set before attack block
  const ss=getScreenState(screenCol,screenRow);
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;player.dir=1;}
  if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;player.dir=3;}
  if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;player.dir=0;}
  if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;player.dir=2;}
  if(joyActive){
    if(airportOpen){updateAirportNav(joyDx,joyDy);}
    else{dx=joyDx;dy=joyDy;
    if(Math.abs(joyDx)>Math.abs(joyDy)){player.dir=joyDx>0?3:1;}
    else{player.dir=joyDy>0?2:0;}}
  }
  const len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;}

  // Capture position before movement (for swim speed reduction)
  const _preSwimX=player.x, _preSwimY=player.y;

  // Move X then Y separately, using full box collision
  const nx=player.x+dx*player.speed;
  if(boxWalkable(sc.map,nx,player.y))player.x=nx;
  const ny=player.y+dy*player.speed;
  if(boxWalkable(sc.map,player.x,ny))player.y=ny;

  // Safety net: push out if somehow inside a blocked tile
  pushOut(sc.map);

  // ── SWIMMING ──────────────────────────────────────────────────
  const onWater = tileAt(sc.map, player.x+16, player.y+22)===T.WATER;
  player._onWater = onWater;
  if(onWater){
    // Slow movement in water — apply correction AFTER movement
    // (movement used full speed, pull back by half)
    player.x -= (player.x - _preSwimX) * 0.45;
    player.y -= (player.y - _preSwimY) * 0.45;
    // Bob
    player._swimBob = Math.sin(frame * 0.15) * 3;
    // HP drain — 1 hp every 180 frames (~3s)
    player._swimTimer++;
    if(player._swimTimer >= 180){
      player._swimTimer = 0;
      if(player.hp > 1){ player.hp--; popup={text:'🌊 Drowning! Get to land!', timer:80}; }
    }
    // Splash particles occasionally
    if(frame%18===0) spawnP(player.x+16, player.y+28, '#90e0ef', 3);
  } else {
    player._swimBob = 0;
    player._swimTimer = Math.max(0, player._swimTimer - 2); // recover when on land
  }

  // Dash input check
  if(Math.abs(dx)>0.1||Math.abs(dy)>0.1)checkDash(dx,dy);

  // Apply dash movement
  if(dash.active){
    dash.timer--;
    const ddx=dash.dx*DASH_SPEED, ddy=dash.dy*DASH_SPEED;
    const nx2=player.x+ddx;
    if(boxWalkable(sc.map,nx2,player.y))player.x=nx2;
    const ny2=player.y+ddy;
    if(boxWalkable(sc.map,player.x,ny2))player.y=ny2;
    spawnP(player.x+16,player.y+16,'#48cae450',3);
    if(dash.timer<=0)dash.active=false;
  }
  if(dash.cooldown>0)dash.cooldown--;

  // Attack
  const atkPressed=(keys[' ']||keys['z']||keys['Z']||touchAtk||touchTalk);
  // Shop check FIRST — before any other handler can consume the press
  if(atkPressed && player._nearShop && !shopOpen){
    checkShopInteraction();
  } else if(atkPressed&&handleAirportPeck()){touchAtk=false;}
  else if(atkPressed&&handleTownDialoguePeck()){touchAtk=false;}
  else if(atkPressed&&handleShopPeck()){touchAtk=false;}
  else if(atkPressed&&handleNoticePeck()){touchAtk=false;}
  else if(atkPressed&&handleDialoguePeck()){touchAtk=false;}
  else if(atkPressed&&player.atk<=0){
    player.atk=skills.doublePeck?12:18;

    if(activeTool==='rod'&&tools.fishingRod){
      if(fishLine){
        // PECK while line is out = REEL IN
        reelIn();
      } else if(tools.fishingCooldown>0){
        popup={text:'🎣 Cooling down... ('+Math.ceil(tools.fishingCooldown/60)+'s)',timer:60};
      } else {
        const dirs=[{x:0,y:-6},{x:-6,y:0},{x:0,y:6},{x:6,y:0}];
        const d=dirs[player.dir]||dirs[2];
        fishLine={x:player.x+16,y:player.y+16,vx:d.x,vy:d.y,life:90,stuck:false,stuckEnemy:-1,stuckTimer:0};
        tools.fishingCooldown=100;
        spawnP(player.x+16,player.y+16,'#48cae4',8);
        popup={text:'🎣 Cast! Tap PECK again to reel in!',timer:120};
      }
    }
    else if(activeTool==='flute'&&tools.jungleFlute&&tools.fluteCooldown<=0){
      // Charm nearby enemies
      tools.fluteActive=true; tools.fluteTimer=240; tools.fluteCooldown=300;
      charmedEnemies.clear();
      const sc2=currentScreen(); const ss2=getScreenState(screenCol,screenRow);
      sc2.enemies.forEach((e,i)=>{
        if(ss2.enemyHps[i]<=0||e._x===undefined)return;
        const d=Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+18));
        if(d<180)charmedEnemies.add(i);
      });
      showSkillPopup('🪈','Jungle Flute!',charmedEnemies.size+' enemies charmed!','#40916c');
      spawnP(player.x+16,player.y+16,'#40916c',16);
    }
    else if(activeTool==='ball'&&tools.heroBall&&tools.heroBallCount>0){
      // Throw bouncing hero ball
      const dirs2=[{x:0,y:-4},{x:-4,y:0},{x:0,y:4},{x:4,y:0}];
      const d2=dirs2[player.dir]||dirs2[2];
      heroBalls.push({x:player.x+8,y:player.y+8,vx:d2.x,vy:d2.y,life:120,bounces:3,hitEnemies:new Set()});
      tools.heroBallCount--;
      if(tools.heroBallCount<=0){activeTool='peck';updateToolIcon();}
      spawnP(player.x+16,player.y+16,'#e17055',8);
    }
    else if(activeTool==='tamale'&&tools.tamaleCount>0){
      // Eat tamale — full heal
      player.hp=player.maxHp; tools.tamaleCount--;
      if(tools.tamaleCount<=0)activeTool='peck'; updateToolIcon();
      showSkillPopup('🫔','Tamale!','Full health restored!','#ff9f1c');
      spawnP(player.x+16,player.y+16,'#ff9f1c',14);
    }
    else {
      // Normal peck / spicy peck
      if(skills.spicyPeck){
        fireProjectile(player.x+8,player.y+8,player.dir,'flame');
        spawnP(player.x+16,player.y+16,'#ff4400',8);
      } else {
        spawnP(player.x+16,player.y+16,'#ffcc02',8);
      }
      if(skills.doublePeck)player._doublePeck=8;
    }
  }
  if(player._doublePeck>0){
    player._doublePeck--;
    if(player._doublePeck===0){player.atk=12;spawnP(player.x+16,player.y+16,'#ffcc02',6);}
  }
  touchAtk=false;touchTalk=false;
  if(player.atk>0)player.atk--;
  if(player.inv>0)player.inv--;

  // ── AUTO HEAL IN SAFE ZONES ──────────────────────────────
  // Safe tiles: FLOWER, PATH in town screens, RF (ruin floor) away from enemies
  // Unsafe: any damage taken recently (player.inv > 0), boss rooms, danger zones present
  const underTile = tileAt(sc.map, player.x+16, player.y+22);
  const onFlower  = underTile===T.FLOWER;
  const onSafePath= (underTile===T.PATH||underTile===T.RF||underTile===T.SAND);
  const nearTown  = TOWNS.some(t=>t.unlocked&&t.screenCol===screenCol&&t.screenRow===screenRow);
  const isSafeZone= (onFlower||(onSafePath&&nearTown));
  const noEnemiesNear = !currentScreen().enemies.some((e,i)=>{
    const ss2=getScreenState(screenCol,screenRow);
    if(ss2.enemyHps[i]<=0||e._x===undefined)return false;
    return Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+18))<160;
  });
  const noMiniBossHere = !MINI_BOSSES.some(b=>b.screenCol===screenCol&&b.screenRow===screenRow&&b.active&&!b.dead);
  const noDangerHere   = dangerZones.length===0;
  const canRegen = isSafeZone && noEnemiesNear && noMiniBossHere && noDangerHere
                   && player.hp<player.maxHp && player.inv<=0 && gameState==='play';

  if(canRegen){
    if(!player._regenTimer) player._regenTimer=0;
    // Show hint the first time regen kicks in
    if(player._regenTimer===0&&player._regenHintShown!==true){
      player._regenHintShown=true;
      popup={text:onFlower?'🌸 Flower heals fast! Stay still...':'💚 Safe zone — healing...', timer:100};
    }
    player._regenTimer++;
    // Heal 1 heart every 4 seconds (240 frames) of staying safe
    // Flower tiles heal 2x faster
    const rate = onFlower ? 120 : 240;
    if(player._regenTimer>=rate){
      player.hp=Math.min(player.maxHp, player.hp+1);
      player._regenTimer=0;
      spawnP(player.x+16, player.y+8, '#ff85a1', 6);
    }
  } else {
    // Reset timer when unsafe
    if(!canRegen && player._regenTimer>0) {
      // Only wipe timer if actually damaged or dangerous — not just moving off tile
      if(player.inv>0 || dangerZones.length>0) player._regenTimer=0;
      else player._regenTimer=Math.max(0, player._regenTimer-2); // fade out slowly
    }
  }

  // Collect corn
  sc.corn.forEach((c,i)=>{
    if(ss.gotCorns.has(i))return;
    if(Math.hypot(player.x+16-(c.x*TILE+8),player.y+16-(c.y*TILE+8))<36){
      ss.gotCorns.add(i); cornCount++; score+=10; spawnP(c.x*TILE+8,c.y*TILE+8,'#ffcc02',6);
    }
  });
  // Collect feathers
  sc.feathers&&sc.feathers.forEach((f,i)=>{
    if(ss.gotFeathers.has(i))return;
    if(Math.hypot(player.x+16-(f.tx*TILE+8),player.y+16-(f.ty*TILE+8))<36){
      ss.gotFeathers.add(i); score+=30; if(player.hp<player.maxHp)player.hp++; spawnP(f.tx*TILE+8,f.ty*TILE+8,'#ff9f1c',10);
    }
  });

  // Chest & Door — auto-trigger when player walks near them
  const px=player.x+16, py=player.y+16;
  for(let ty=0;ty<15;ty++){for(let tx=0;tx<20;tx++){
    const t=sc.map[ty][tx];
    const tpx=tx*TILE+16, tpy=ty*TILE+16;
    const dist=Math.hypot(px-tpx,py-tpy);
    if(dist>48)continue;
    const key=ty*20+tx;
    if(t===T.CHEST&&!ss.openedChests.has(key)){
      ss.openedChests.add(key);
      openChest(tpx,tpy);
    }
    if(t===T.DOOR&&!ss.openDoors.has(key)){
      // Find matching door definition with destination
      const doorDef=sc.doors&&sc.doors.find(d=>d.ty===ty&&d.tx===tx);
      if(doorDef){
        ss.openDoors.add(key);
        // Teleport to destination screen
        screenCol=doorDef.destCol;
        screenRow=doorDef.destRow;
        player.x=doorDef.destX;
        player.y=doorDef.destY;
        player.inv=60;
        popup={text:`🚪 → ${doorDef.label}`,timer:120};
        spawnP(player.x+16,player.y+16,'#cd853f',16);
        // activate jaguar if entering lair
        if(screenIndex(screenCol,screenRow)===screenIndex(9,7)&&!jagDead){
          jaguar.active=true;jaguar.x=280;jaguar.y=180;
        } else {jaguar.active=false;}
        return; // stop processing this frame
      } else {
        // no destination — just open it as walkable
        ss.openDoors.add(key);
        popup={text:'🚪 Door opened!',timer:60};
        spawnP(tpx,tpy,'#cd853f',10);
        sc.map[ty][tx]=T.RF;
      }
    }
  }}

  // Show door destination label when nearby
  if(sc.doors){
    sc.doors.forEach(d=>{
      const dtx=d.tx*TILE+16, dty=d.ty*TILE+16;
      const dist=Math.hypot(px-dtx,py-dty);
      if(dist<80&&!ss.openDoors.has(d.ty*20+d.tx)){
        const pulse=0.7+Math.sin(frame*0.12)*0.3;
        ctx.globalAlpha=pulse;
        drawAutoBox('🚪 → '+d.label, GW/2, GH-40, {font:'bold 12px Fredoka One',alpha:pulse,maxW:GW-40});
      }
    });
  }
  if(player.x<0&&screenIndex(screenCol-1,screenRow)>=0){startScroll(screenCol-1,screenRow,-1,0);}
  else if(player.x>GW-32&&screenIndex(screenCol+1,screenRow)>=0){startScroll(screenCol+1,screenRow,1,0);}
  else if(player.y<0&&screenIndex(screenCol,screenRow-1)>=0){startScroll(screenCol,screenRow-1,0,-1);}
  else if(player.y>GH-32&&screenIndex(screenCol,screenRow+1)>=0){startScroll(screenCol,screenRow+1,0,1);}
}

// ═══════════════════════════════════════════════
//  UPDATE ENEMIES
// ═══════════════════════════════════════════════
function updateEnemies(){
  if(isScrolling)return;
  const sc=currentScreen();
  const ss=getScreenState(screenCol,screenRow);
  // Enemies are passive until player has explored and found skills
  const discoveryLevel = skillsFoundCount + Math.floor(cornCount/8);
  if(discoveryLevel < 2) return; // totally passive early on
  const speedScale=0.25+Math.min(discoveryLevel/8,1)*0.75;

  sc.enemies.forEach((e,i)=>{
    if(ss.enemyHps[i]<=0)return;
    // enemy position driven by tile coords + offset
    if(e._x===undefined){e._x=e.tx*TILE; e._y=e.ty*TILE; e._vx=(e.pat==='h'?1:0)*e.spd; e._vy=(e.pat==='v'?1:0)*e.spd; e._range=3*TILE;}
    const spd=speedScale;
    e._x+=e._vx*spd; e._y+=e._vy*spd;
    if(!walkable(sc.map,e._x+4,e._y+14)||!walkable(sc.map,e._x+24,e._y+14)){e._vx*=-1;e._vy*=-1;e._x+=e._vx*4;e._y+=e._vy*4;}
    // attack player
    if(player.atk>10&&!charmedEnemies.has(i)){const atkRange=tools.obsidianShard?60:38;const d=Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+18));if(d<atkRange){ss.enemyHps[i]=0;score+=50;totalEnemiesKilled++;spawnP(e._x+14,e._y+14,tools.obsidianShard?'#6c5ce7':'#52b788',12);}}
    if(player.inv<=0&&!charmedEnemies.has(i)){const d=Math.hypot(player.x+16-(e._x+14),player.y+16-(e._y+18));if(d<28){if(!checkShieldBlock()){player.hp--;}player.inv=90;spawnP(player.x+16,player.y+16,'#ff3333',10);}}
  });
}

// ═══════════════════════════════════════════════
//  MINI JAGUAR
// ═══════════════════════════════════════════════
function updateMiniJag(){
  if(jagDead||isScrolling)return;
  // don't spawn in boss room
  const curIdx=screenIndex(screenCol,screenRow);
  if(curIdx===screenIndex(9,7)){miniJag.active=false;return;}

  // countdown cooldown
  if(miniJag.spawnCooldown>0){miniJag.spawnCooldown--;return;}

  // try to spawn
  if(skillsFoundCount<1)return; // no mini jag until first skill found
  if(!miniJag.active&&Math.random()<MINI_SPAWN_CHANCE&&curIdx!==miniJag.lastScreen){
    // find a random walkable spot away from player
    const sc=currentScreen();
    for(let attempt=0;attempt<20;attempt++){
      const tx=2+Math.floor(Math.random()*16);
      const ty=2+Math.floor(Math.random()*11);
      const wx=tx*TILE, wy=ty*TILE;
      if(boxWalkable(sc.map,wx,wy)&&Math.hypot(wx-player.x,wy-player.y)>200){
        miniJag.active=true;
        miniJag.x=wx; miniJag.y=wy;
        miniJag.hp=2; miniJag.maxHp=2;
        miniJag.st=0; miniJag.timer=MINI_SCREEN_TIME;
        miniJag.lastScreen=curIdx;
        // random taunt popup
        const taunts=['😹 El Jaguar says hi!','🐆 I\'m watching you...','😈 You\'ll never catch me!','🌮 Tulum is MINE!','😜 Catch me if you can!'];
        popup={text:taunts[Math.floor(Math.random()*taunts.length)],timer:100};
        break;
      }
    }
    return;
  }

  if(!miniJag.active)return;

  miniJag.timer--;
  // flee when screen time runs out or when hurt
  if(miniJag.timer<=0){
    miniJag.active=false;
    miniJag.spawnCooldown=600; // 10 sec cooldown
    popup={text:'🐆 El Jaguar escaped!',timer:80};
    return;
  }

  if(miniJag.st>0){miniJag.st--;return;}

  const dx=player.x-miniJag.x, dy=player.y-miniJag.y;
  const dist=Math.hypot(dx,dy);

  // flee if low HP or player attacks nearby
  const fleeing=miniJag.hp<miniJag.maxHp||dist<120;
  const spd=fleeing?1.8:0.7;

  if(dist>0){
    const dir=fleeing?-1:1; // flee = move away, hunt = move toward
    const sc=currentScreen();
    const nx=miniJag.x+dx/dist*spd*dir;
    const ny=miniJag.y+dy/dist*spd*dir;
    if(boxWalkable(sc.map,nx,miniJag.y))miniJag.x=nx;
    if(boxWalkable(sc.map,miniJag.x,ny))miniJag.y=ny;
  }

  // player peck hits mini jag
  if(player.atk>10&&dist<44){
    miniJag.hp--;
    miniJag.st=30;
    spawnP(miniJag.x+14,miniJag.y+14,'#f4a261',10);
    if(miniJag.hp<=0){
      miniJag.active=false;
      miniJag.spawnCooldown=900;
      score+=200;
      popup={text:'💥 Mini Jaguar fled! +200pts',timer:120};
      spawnP(miniJag.x+14,miniJag.y+14,'#ffcc02',20);
    }
  }

  // mini jag damages player if it catches them
  if(player.inv<=0&&dist<30&&!fleeing){
    player.hp--;
    player.inv=90;
    spawnP(player.x+16,player.y+16,'#ff3333',10);
  }
}

function drawMiniJag(x,y,hp,maxHp,fr){
  const cx=x,cy=y;
  const scale=0.65; // smaller than full jaguar
  ctx.save();
  ctx.translate(cx+14,cy+20);
  ctx.scale(scale,scale);
  ctx.translate(-14,-20);

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(14,36,14,4,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.ellipse(14,22,14,11,0,0,Math.PI*2);ctx.fill();
  // spots
  ctx.fillStyle='#8b4513';for(const[sx,sy2] of [[4,16],[22,12],[10,26],[24,22],[14,17]]){ctx.beginPath();ctx.arc(sx,sy2,2.5,0,Math.PI*2);ctx.fill();}
  // head
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.arc(14,9,10,0,Math.PI*2);ctx.fill();
  // ears
  ctx.fillStyle='#f4a261';ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(1,-4);ctx.lineTo(10,1);ctx.fill();
  ctx.beginPath();ctx.moveTo(23,3);ctx.lineTo(27,-4);ctx.lineTo(18,1);ctx.fill();
  // silly big eyes (googly)
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(9,8,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(19,8,5,0,Math.PI*2);ctx.fill();
  const ep=Math.cos(fr*0.18)*2,ep2=Math.sin(fr*0.18)*2;
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(9+ep,8+ep2,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(19-ep,8-ep2,2.5,0,Math.PI*2);ctx.fill();
  // stars in eyes
  ctx.fillStyle='#ffcc02';ctx.font='6px Arial';ctx.fillText('★',7,7);ctx.fillText('★',17,7);
  // big goofy grin

function updateJaguar(){
  if(jagDead||isScrolling)return;
  // If in boss room but not ready, warn and push back
  if(screenCol===9&&screenRow===7&&!isReadyForBoss()&&!jagDead){
    player.y=Math.min(player.y,GH-80);
    if(frame%120===0) popup={text:'⚠️ You need all 4 Seals + Elder quest!',timer:120};
    jaguar.active=false;
    return;
  }
  if(!jaguar.active)return;
  if(jaguar.st>0){jaguar.st--;return;}
  const dx=player.x-jaguar.x,dy=player.y-jaguar.y,dist=Math.hypot(dx,dy);
  const spd=jaguar.hp<=3?1.6:1.1;
  if(dist>0){jaguar.x+=dx/dist*spd;jaguar.y+=dy/dist*spd;}
  if(player.atk>10&&dist<52){jaguar.hp--;jaguar.st=55;score+=150;spawnP(jaguar.x+20,jaguar.y+20,'#f4a261',16);if(jaguar.hp<=0){jagDead=true;spawnP(jaguar.x+20,jaguar.y+20,'#ffcc02',40);score+=1000;}}
  if(player.inv<=0&&dist<40){if(!checkShieldBlock()){player.hp--;}player.inv=90;spawnP(player.x+16,player.y+16,'#ff3333',12);}
}
