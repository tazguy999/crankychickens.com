<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout idea: a kid-drawn comic taped up in a dark bedroom. Paper panels with marker outlines on a night-blue wall. */
:root{
  --night:#1b2659; --night2:#111a44; --paper:#fffef6; --ink:#151515;
  --caption:#ffd93b; --pop:#ff5a4f; --spark:#6fe0cf; --bond:#ff8fc0; --mute:#5b5f73;
  --display:"Londrina Solid","Arial Black",Impact,sans-serif;
  --body:"Patrick Hand","Comic Sans MS","Segoe Print",cursive,sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--night2)}
body{margin:0;background:
  radial-gradient(circle at 12% 8%,#fff 0 1.5px,transparent 2px),
  radial-gradient(circle at 78% 4%,#fff 0 1px,transparent 1.5px),
  radial-gradient(circle at 55% 14%,#ffe9a8 0 1.5px,transparent 2px),
  radial-gradient(circle at 92% 22%,#fff 0 1px,transparent 1.5px),
  linear-gradient(var(--night),var(--night2)) fixed;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35}
#app{max-width:860px;margin:0 auto;padding:14px 16px 120px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:.5px;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:#fff;padding:6px 2px 12px}
.top h1{font-size:44px;line-height:.95;color:var(--caption);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);overflow-wrap:anywhere}
.eyebrow{font-family:var(--display);font-size:18px;letter-spacing:2px;text-transform:uppercase;color:#cfd6ff}
.moves{text-align:right;color:#cfd6ff;font-size:16px;white-space:nowrap}
.pips{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.pip{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:var(--caption);box-shadow:0 0 10px #ffe680}
.pip.off{background:#3a467f;box-shadow:none}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:3px solid var(--ink);background:#c9d0f5;border-radius:14px 14px 4px 4px;padding:6px 2px;font-family:var(--display);font-size:20px;min-width:0}
.tabs button[aria-selected="true"]{background:var(--paper);transform:translateY(2px)}

.panel{background:var(--paper);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:5px 5px 0 var(--ink);padding:14px}
.cap{display:inline-block;background:var(--caption);border:3px solid var(--ink);padding:2px 10px;font-family:var(--display);font-size:20px;transform:rotate(-1.2deg);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--paper);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:4px 4px 0 var(--ink);padding:8px 8px 10px;min-width:0}
.card:nth-child(even){border-radius:18px 225px 18px 255px/255px 18px 225px 18px}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.card h3{font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.role{color:var(--mute);font-size:16px}
.tal{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.tk{min-width:28px;height:28px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--spark);font-size:15px}
.tk.q{background:#e9e9ef;font-family:var(--display);color:var(--mute)}
.tag{font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:0 6px;background:#dfe4ff;margin-top:4px}
.tag.mend{background:#ffd0cc}.tag.keep{background:var(--caption)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--night2);border-top:3.5px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bar .btn{font-size:17px;padding:8px 2px}
.btn.e{background:#ffb37a}
.rn textarea{flex:1;min-width:0;font:14px/1.2 monospace;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;color:var(--ink);height:64px}
.know{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.know b{font-family:var(--display);font-weight:400;font-size:19px}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:8px 6px;font-family:var(--display);font-size:19px;line-height:1.05}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.a{background:var(--bond)}.btn.b{background:var(--spark)}.btn.c{background:var(--caption)}.btn.d{background:#b9a6ff}
.btn.go{background:var(--pop);color:#fff;font-size:24px;padding:10px 16px;text-shadow:1.5px 1.5px 0 var(--ink)}
.btn.sm{font-size:16px;padding:5px 8px;box-shadow:2px 2px 0 var(--ink)}
.btn.on{background:var(--caption)}

#sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,14,40,.82);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.on{display:flex}
.sh{background:var(--paper);border:3.5px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:660px;max-height:92%;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.sh h2{font-size:30px;line-height:1;overflow-wrap:anywhere}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;background:#fff;font-family:var(--display);font-size:20px;flex:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chip{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-size:16px;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--caption);box-shadow:3px 3px 0 var(--ink)}
.chip[disabled]{opacity:.4}
.chip small{font-size:13px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px;text-align:left;font-size:16px;line-height:1.15}
.opt.on{background:var(--caption);box-shadow:3px 3px 0 var(--ink)}
.opt[disabled]{opacity:.4;text-decoration:line-through}
.opt b{font-family:var(--display);font-size:20px;font-weight:400;display:block}
.step{font-family:var(--display);font-size:20px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--caption),0 0 0 6px var(--ink)}

.lines{display:flex;flex-direction:column;gap:10px}
.ln{border:3px solid var(--ink);border-radius:var(--wob);padding:8px 12px;background:#fff}
.ln.bond{background:#ffe1ee}
.ln.burst{background:var(--spark);font-family:var(--display);font-size:24px;line-height:1.1;text-align:center;padding:14px;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.ln.burst small{display:block;font-family:var(--body);font-size:17px}
.ln.oops{background:#eef0f7}
.ln.loot{background:#fff3b8}
.ln.ev{background:#e4dcff}
.ln.ev h3{font-size:24px}
@keyframes pop{from{transform:scale(.6) rotate(-4deg)}to{transform:scale(1) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.ln.burst{animation:none}}

.meter{height:14px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bond)}
.brow{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.brow small{grid-column:1/-1;color:var(--mute);font-size:15px;margin-top:-2px}
.lv{display:flex;gap:3px}.lv i{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:#fff}.lv i.f{background:var(--spark)}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-family:var(--display);font-size:22px;border-bottom:3px solid var(--ink);margin-top:4px}
.rn{display:flex;gap:6px}
.rn input{flex:1;min-width:0;font:inherit;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;color:var(--ink)}
ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.log li{padding-left:18px;position:relative}
ul.log li::before{content:"";position:absolute;left:0;top:.45em;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:#fff}
ul.log li.bond::before{background:var(--bond)}ul.log li.spark::before{background:var(--spark)}ul.log li.loot::before{background:var(--caption)}ul.log li.oops::before{background:var(--pop)}
.stack{display:flex;flex-direction:column;gap:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:3px solid var(--ink);border-radius:14px;padding:6px 8px;background:#eef0f7;color:var(--mute);font-size:15px;line-height:1.15}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.badge.got{background:var(--caption);color:var(--ink)}
svg.drg{display:block;max-width:100%;height:auto}
svg.web{display:block;width:100%;max-width:460px;height:auto;margin:0 auto}
svg.web g[data-a]{cursor:pointer}
svg.web text{font-family:var(--body);font-size:11px;text-anchor:middle;fill:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--mute);justify-content:center}
.key i{display:inline-block;width:22px;height:0;border-top:4px solid;vertical-align:middle;margin-right:4px}
.two{display:flex;justify-content:center;align-items:center;gap:6px}
</style>
</head>

function migrate(s){

    Object.values(s.bonds).forEach(b=>{b.rival=null;b.mem=[];});}

}
function ensure(s){
  if(!s.proj)s.proj={};
  Object.keys(PROJ).forEach(k=>{if(!s.proj[k]){s.proj[k]={done:false};PROJ[k].need.forEach(n=>{s.proj[k][n]=0;});}});
  if(s.snd===undefined)s.snd=true;if(s.music===undefined)s.music=false;
  s.dragons.forEach(d=>{if(!d.fav){d.fav=pick(Object.keys(HANG));d.favK=false;}if(!d.fear){d.fear=pick(Object.keys(PLACES));d.fearK=false;d.brave=false;}
    if(d.secret===undefined){d.secret=rnd(SECRETS.length);d.secK=false;}if(!d.learn)d.learn={};});
  return s;
}

/* ---------- wishes ---------- */
function newWish(d){
  const opts=[],far=S.dragons.filter(o=>o.id!==d.id&&lvl(bondOf(d,o).p)<2);
  if(far.length)opts.push(()=>({t:'friend',id:pick(far).id}));
  if(!S.dragons.some(o=>o.id!==d.id&&bondOf(d,o).p>=60))opts.push(()=>({t:'close'}));
  if(d.stage!=='hatch'){opts.push(()=>({t:'place',p:pick(Object.keys(PLACES))}));opts.push(()=>({t:'loot'}));}
  opts.push(()=>({t:'act',a:pick(Object.keys(HANG))}));
  if(d.talents.some(t=>!t.found))opts.push(()=>({t:'talent'}));
  if(Object.keys(S.proj).some(k=>!S.proj[k].done))opts.push(()=>({t:'build'}));
  let w=pick(opts)();if(d.wish&&w.t===d.wish.t&&opts.length>1)w=pick(opts)();
  d.wish=w;
}
function wishText(d){const w=d.wish;if(!w)return 'is still thinking of a wish';
  if(w.t==='friend'){const o=byId(w.id);return 'wants to be friends with '+(o?o.name:'someone new');}
  if(w.t==='close')return 'wants a close friend';
  if(w.t==='place')return 'wants to go on an expedition to '+PLACES[w.p].n;
  if(w.t==='loot')return 'wants to bring home a treasure';
  if(w.t==='act')return 'wants to hang out: '+HANG[w.a].n.toLowerCase();
  if(w.t==='build')return 'wants to help build something big';
  return 'wants to find out what they are good at';}
function sweep(ctx,out){
  S.dragons.forEach(d=>{const w=d.wish;if(!w){newWish(d);return;}
    const inTeam=!!(ctx.team&&ctx.team.indexOf(d)>=0);let ok=false;
    if(w.t==='friend'){const o=byId(w.id);if(!o){newWish(d);return;}ok=lvl(bondOf(d,o).p)>=2;}
    else if(w.t==='close')ok=S.dragons.some(o=>o.id!==d.id&&bondOf(d,o).p>=60);
    else if(w.t==='place')ok=inTeam&&ctx.place===w.p;
    else if(w.t==='act')ok=inTeam&&ctx.act===w.a;
    else if(w.t==='talent')ok=REV.indexOf(d.id)>=0;
    else if(w.t==='loot')ok=inTeam&&!!ctx.loot;
    else if(w.t==='build')ok=inTeam&&!!ctx.build;
    if(ok){const m=d.name+' '+wishText(d).replace('wants','wanted')+', and tonight it happened.';
      S.hearts++;out.push({c:'burst',h:'💖 WISH COME TRUE!<small>'+esc(m)+'</small>'});log('Wish come true: '+m,'bond');
      if(S.hearts%2===0){const nx=ACCK.find(a=>S.accs.indexOf(a)<0);if(nx){S.accs.push(nx);const m2='New dress-up item for the Hoard: the '+ACC[nx]+'.';out.push({c:'loot',h:'🎁 '+esc(m2)});log(m2,'loot');}}
      newWish(d);}
  });
  REV=[];
}

/* ---------- rules ---------- */
function addBond(a,b,amt,out){
  const o=bondOf(a,b),was=lvl(o.p);o.p=Math.max(0,Math.min(100,o.p+amt));const now=lvl(o.p);
  if(now>was){
    const m=a.name+' and '+b.name+' are now '+BL[now]+'!';out.push({c:'bond',h:esc(m)});log(m,'bond');mem(a,b,'became '+BL[now].toLowerCase());
    if(now>=3)[[a,b],[b,a]].forEach(p=>{const d=p[0],o2=p[1];if(!d.secK){d.secK=true;const m2=d.name+' told '+o2.name+' a secret: '+d.name+' '+SECRETS[d.secret]+'.';out.push({c:'ln',h:'💬 '+esc(m2)});log(m2,'bond');mem(d,o2,d.name+' shared a secret');}});
    if(now===4&&!o.duo){o.duo=pick(DUOS);const m2=a.name+' and '+b.name+' invented a duo move: '+o.duo+'.';
      out.push({c:'burst',h:'DUO MOVE!<small>'+esc(m2)+'</small>'});log(m2,'spark');}
  }
}
function calling(d,out){
  if(d.calling)return;const f=d.talents.filter(t=>t.found&&tl(t)>=2).sort((x,y)=>y.xp-x.xp);
  if(f.length>=2){d.calling=T[f[0].k].adj+' '+T[f[1].k].noun;const m=d.name+' found a calling: '+d.calling+'.';out.push({c:'burst',h:'A CALLING!<small>'+esc(m)+'</small>'});log(m,'spark');}
}
function reveal(d,k,out){
  const t=tal(d,k);t.found=true;d.hints=d.hints.filter(h=>h!==k);REV.push(d.id);
  out.push({c:'burst',h:T[k].i+' NEW TALENT!<small>'+esc(d.name)+' has a spark for '+T[k].n+'.</small>'});
  log(d.name+' discovered a talent for '+T[k].n+'.','spark');
}
function gainXp(d,k,out,n){
  const t=tal(d,k);if(!t||!t.found)return;
  const was=tl(t);t.xp+=n||1;const now=tl(t);
  if(now>was){const m=d.name+"'s "+T[k].n+' grew to '+LV[now]+'.';out.push({c:'ln',h:esc(m)});log(m,'spark');}
  if(now>=3&&!d.title){d.title=T[k].title;const m=d.name+' earned a new name: '+nm(d)+'!';out.push({c:'burst',h:'A NEW NAME!<small>'+esc(m)+'</small>'});log(m,'spark');}
  calling(d,out);
}
function giveHint(d){
  const left=d.talents.filter(t=>!t.found&&d.hints.indexOf(t.k)<0);
  if(!left.length)return null;const k=pick(left).k;d.hints.push(k);return k;
}
function maybeRival(a,b,out){
  const o=bondOf(a,b);if(o.rival)return;
  const sh=a.talents.filter(t=>t.found&&b.talents.some(x=>x.k===t.k&&x.found));
  if(sh.length&&chance(.45)){o.rival=sh[0].k;const m=a.name+' and '+b.name+' became friendly rivals in '+T[o.rival].n+'. They push each other to practice.';out.push({c:'bond',h:esc(m)});log(m,'bond');mem(a,b,'became friendly rivals in '+T[o.rival].n);}
}
function spend(ds){S.acts--;ds.forEach(d=>d.energy--);}
function doHang(a,b,actKey){
  const act=HANG[actKey],out=[],o=bondOf(a,b),c=compat(a,b);
  out.push({c:'cap',h:esc(a.name+' and '+b.name+' '+act.line+'.')});
  if(o.tiff){o.tiff=false;out.push({c:'bond',h:esc('They talked it out and made up. Friends again.')});mem(a,b,'made up after a tiff');addBond(a,b,12,out);}
  else if(c<0&&chance(.25)){o.tiff=true;o.p=Math.max(0,o.p-5);const m=a.name+' and '+b.name+' '+pick(TIFFS)+'. They are in a tiff.';out.push({c:'oops',h:esc(m+' Another hangout will help them make up.')});log(m,'oops');mem(a,b,'got into a tiff');}
  else{
    const gain=6+c*3+[a,b].filter(d=>d.type==='stuffy').length*2+rnd(4)+(S.proj.feast.done?3:0)+(season()==='Fall'?4:0);
    out.push({c:'bond',h:esc(compatLine(a,b))});mem(a,b,act.m);
    addBond(a,b,gain,out);
  }
  [a,b].forEach(d=>act.t.forEach(k=>{const t=tal(d,k);if(!t)return;
    if(!t.found){if(chance(.55))reveal(d,k,out);}else gainXp(d,k,out);}));
  [a,b].forEach(d=>{if(d.fav===actKey&&!o.tiff){addBond(a,b,5,out);if(!d.favK){d.favK=true;const m=d.name+' loves this more than anything. Favorite thing found: '+act.n.toLowerCase()+'.';out.push({c:'burst',h:'💗 FAVORITE THING!<small>'+esc(m)+'</small>'});log(m,'bond');}}});
  maybeRival(a,b,out);
  if(lvl(o.p)>=2)[[a,b],[b,a]].forEach(p=>{const w=p[0],d=p[1];if(chance(.5)){const k=giveHint(d);if(k){const m=w.name+' noticed something: '+d.name+' '+T[k].clue+'.';out.push({c:'ln',h:'🔍 '+esc(m)});log('Clue: '+d.name+' '+T[k].clue+'.','spark');}}});
  spend([a,b]);return out;
}
function doTrain(d,k){
  const out=[],t=tal(d,k);
  const coach=S.dragons.filter(m=>m.id!==d.id&&m.stage!=='hatch'&&!m.mend&&m.talents.some(x=>x.k===k&&x.found&&(!t||!t.found||x.xp>t.xp))).sort((x,y)=>tal(y,k).xp-tal(x,k).xp)[0];
  if(t&&t.found){
    let n=1;out.push({c:'cap',h:esc(d.name+' practiced '+T[k].n.toLowerCase()+'.')});
    if(coach){n++;out.push({c:'ln',h:esc(coach.name+' coached from the side.')});mem(d,coach,'practiced '+T[k].n.toLowerCase()+' together');addBond(d,coach,4,out);}
    const rv=S.dragons.find(o=>o.id!==d.id&&bondOf(d,o).rival===k);
    if(rv){n++;out.push({c:'ln',h:esc('Knowing '+rv.name+' is good at this too, '+d.name+' tried extra hard.')});}
    gainXp(d,k,out,n);
  }else if(!t&&d.tried.indexOf(k)>=0){
    const tc=teacher(d,k);
    if(!tc)out.push({c:'oops',h:esc(d.name+' needs a Close friend who is Skilled at '+T[k].n.toLowerCase()+' to learn this.')});
    else{
      d.learn[k]=(d.learn[k]||0)+1;out.push({c:'cap',h:esc(tc.name+' gave '+d.name+' a patient lesson in '+T[k].n.toLowerCase()+'.')});
      mem(d,tc,tc.name+' gave '+d.name+' a lesson in '+T[k].n.toLowerCase());addBond(d,tc,6,out);gainXp(tc,k,out);
      if(d.learn[k]>=3){d.tried=d.tried.filter(x=>x!==k);d.talents.push({k,found:true,xp:0,learned:true});
        const m=d.name+' learned '+T[k].n+' from '+tc.name+'. Not born with it. Earned it.';out.push({c:'burst',h:T[k].i+' LEARNED TALENT!<small>'+esc(m)+'</small>'});log(m,'spark');}
      else out.push({c:'ln',h:esc('Lesson '+d.learn[k]+' of 3. It is slow going, but '+d.name+' is not giving up.')});
    }
  }else{
    out.push({c:'cap',h:esc(coach?coach.name+' showed '+d.name+' how '+T[k].n.toLowerCase()+' is done.':d.name+' gave '+T[k].n.toLowerCase()+' a try.')});
    if(t){out.push({c:'ln',h:esc(d.name+' '+T[k].win+'.')});reveal(d,k,out);if(coach)gainXp(d,k,out);}
    else{d.tried.push(k);out.push({c:'oops',h:esc(d.name+' '+T[k].fail+'. Not their thing, and now you know.')});}
    if(coach){mem(d,coach,coach.name+' taught a lesson in '+T[k].n.toLowerCase());addBond(d,coach,5,out);gainXp(coach,k,out);}
  }
  spend([d]);return out;
}
function estimate(team,k,hidden,place){
  let s=40+(S.proj.castle.done?8:0);
  team.forEach(m=>{if(place&&m.fear===place&&!m.brave&&(hidden||m.fearK)&&!team.some(o=>o!==m&&lvl(bondOf(m,o).p)>=2))s-=10;});

  const col=['','#b8bdd6','#ff9ecb','#ff5fa2','#d81b7a'];let s='';
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const o=bondOf(ds[i],ds[j]),l=lvl(o.p);if(!l&&!o.tiff)continue;const a=pos[ds[i].id],b=pos[ds[j].id];
    s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${o.tiff?'#ff5a4f':col[l]}" stroke-width="${o.tiff?3:1+l*1.4}" stroke-linecap="round"${o.tiff?' stroke-dasharray="5 6"':''}/>`;}
  ds.forEach(d=>{const p=pos[d.id];s+=`<g data-a="open" data-id="${d.id}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="23" fill="#fffef6" stroke="#151515" stroke-width="2.5"/><g transform="translate(${(p[0]-20).toFixed(1)} ${(p[1]-21).toFixed(1)}) scale(.33)">${parts(d)}</g><text x="${p[0].toFixed(1)}" y="${(p[1]+36).toFixed(1)}">${esc(d.name)}</text></g>`;});
  return `<svg class="web" viewBox="0 0 360 356" role="img" aria-label="Map of the bonds between dragons">${s}</svg>`;
}

function chip(d,ok,why,act){const on=F.picks&&F.picks.indexOf(d.id)>=0;return `<button class="chip${on?' on':''}" data-a="${act||'pick'}" data-id="${d.id}"${ok||on?'':' disabled'}>${dragonSVG(d,60)}${esc(d.name)}<small>${ok||on?d.pers:why}</small></button>`;}
function head(title){return `<div class="shh"><h2>${title}</h2><button class="x" data-a="close" aria-label="Close">X</button></div>`;}
function mkRow(label,key,vals,num){return `<div class="row"><span class="step" style="min-width:74px">${label}</span>${vals.map(v=>`<button class="btn sm${String(F.d[key])===String(v[0])?' on':''}" data-a="mk" data-k="${key}" data-v="${v[0]}"${num?' data-n="1"':''}>${v[1]}</button>`).join('')}</div>`;}

  }else if(F.t==='build'){

    h+='<p class="sec">Dress up</p><div class="row">'+[['','None']].concat(S.accs.map(a=>[a,ACC[a]])).map(a=>`<button class="btn sm${(d.acc||'')===a[0]?' on':''}" data-a="acc" data-v="${a[0]}">${a[1]}</button>`).join('')+`</div>${S.accs.length<ACCK.length?'<p class="role">Make wishes come true to unlock more.</p>':''}`;
    const jr=S.log.filter(l=>l.t.indexOf(d.name)>=0).slice(-5).reverse();
    if(jr.length)h+='<p class="sec">Lately</p><ul class="log">'+jr.map(l=>`<li class="${l.k}">${esc(l.t)} <span class="role">Bedtime ${l.n}</span></li>`).join('')+'</ul>';
    h+=`<p class="sec">Name</p><div class="rn"><input id="rn" maxlength="16" value="${esc(d.name)}" aria-label="Dragon name"><button class="btn" data-a="rename" data-id="${d.id}">Rename</button></div><div class="row">`;
    if(d.stage!=='hatch'&&S.keeper!==d.id)h+=`<button class="btn sm" data-a="keeper" data-id="${d.id}">Make Hoard Keeper</button>`;
    if(S.dragons.length>3)h+=`<button class="btn sm" data-a="shelf" data-id="${d.id}">${UI.shelf===d.id?'Sure? They leave the Hoard. Tap again':'Move to the High Shelf'}</button>`;
    h+='</div>';
  }else if(F.t==='pair'){
    const a=byId(F.x),b=byId(F.y);if(!a||!b){F=null;return sheet();}
    const o=bondOf(a,b);
    h=head(esc(a.name+' and '+b.name))+`<div class="two">${dragonSVG(a,110)}<span class="cap">${o.tiff?'In a tiff':BL[lvl(o.p)]}</span>${dragonSVG(b,110)}</div><div class="meter"><i style="width:${o.p}%"></i></div><p>${esc(compatLine(a,b))}</p>`;
    if(o.tiff)h+='<div class="ln oops">They are in a tiff. A hangout will help them make up.</div>';
    if(o.duo)h+=`<div class="ln burst" style="animation:none;font-size:20px">Duo move: ${esc(o.duo)}<small>Helps on every expedition they share.</small></div>`;
    if(o.rival)h+=`<div class="ln bond">Friendly rivals in ${T[o.rival].n}. Each one practices harder because of the other.</div>`;
    if(a.mentor===b.id||b.mentor===a.id)h+='<div class="ln bond">Mentor and hatchling.</div>';
    h+='<p class="sec">Their story</p>'+(o.mem.length?'<ul class="log">'+o.mem.map(m=>`<li class="bond">${esc(m)}</li>`).join('')+'</ul>':'<p class="role">No memories yet. Have them hang out.</p>');
    h+=`<div class="row"><button class="btn a" data-a="hangPair"${S.acts>0&&canAct(a)&&canAct(b)?'':' disabled'}>Hang out now</button><button class="btn sm" data-a="open" data-id="${a.id}">${esc(a.name)}</button><button class="btn sm" data-a="open" data-id="${b.id}">${esc(b.name)}</button></div>`;
  }else if(F.t==='mentor'){
    const d=byId(F.id);if(!d){F=null;return sheet();}
    h=head('Pick a mentor')+`<p>Who should teach Wee ${esc(d.name)}? They grow closer every night, and a mentor who becomes a friend reveals a hidden talent at the naming ceremony.</p><div class="chips">${S.dragons.filter(o=>o.stage!=='hatch').map(o=>`<button class="chip${d.mentor===o.id?' on':''}" data-a="setMentor" data-id="${o.id}">${dragonSVG(o,60)}${esc(o.name)}<small>${o.pers}</small></button>`).join('')}</div>`;
  }else if(F.t==='make'){
    const p=Object.assign({stage:'grown',name:F.d.name||'New dragon',title:null,mend:0,acc:null},F.d);
    h=head('Dragon maker')+`<div class="two">${dragonSVG(p,150)}</div><div class="rn"><input id="mkn" maxlength="16" placeholder="Name your dragon" value="${esc(F.d.name)}" aria-label="Dragon name"></div>`
     +mkRow('Kind','type',[['stuffy','Stuffy'],['plastic','Plastic'],['windup','Wind-up']])
     +`<div class="row"><span class="step" style="min-width:74px">Color</span>${COLORS.map((c,i)=>`<button class="sw${F.d.color===i?' on':''}" style="background:${c[1]}" data-a="mk" data-k="color" data-v="${i}" data-n="1" aria-label="${c[0]}"></button>`).join('')}</div>`
     +mkRow('Wings','wing',[['bat','Pointy'],['round','Round'],['tiny','Tiny']])
     +mkRow('Horns','horns',[[0,'Nub'],[1,'One'],[2,'Two']],true)
     +mkRow('Eyes','eyes',[['button','Button'],['dot','Bright'],['sleepy','Sleepy']])
     +mkRow('Marks','pattern',[['plain','Plain'],['spots','Spots'],['stripes','Stripes'],['star','Star']])
     +mkRow('Spikes','spikes',[[0,'No'],[1,'Yes']],true)
     +mkRow('Heart','pers',PERS.map(x=>[x,x]))
     +'<p class="role">Talents are hidden, even from you. That is the fun part.</p><button class="btn go" data-a="mkGo">Bring to life!</button>';
  }
  $sheet.className='on';$sheet.innerHTML='<div class="sh">'+h+'</div>';
}
let AC=null,musOn=false,musI=0;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();}catch(e){return null;}}try{if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,t,dur,vol,type){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}}
const SFX={tap:[[660,0,.07]],bond:[[523,0,.18],[659,.1,.28]],spark:[[523,0,.15],[659,.09,.15],[784,.18,.15],[1047,.27,.45]],oops:[[330,0,.18],[262,.14,.32]],night:[[784,0,.3],[659,.22,.3],[523,.44,.3],[392,.66,.6]]};
function sfx(n){if(!S||!S.snd||!ac())return;const t=AC.currentTime+.01;SFX[n].forEach(x=>tone(x[0],t+x[1],x[2],n==='tap'?.05:.11));}
/* a slow music-box lullaby, written for this game: [frequency, beats] */
const MEL=[[523,1],[659,1],[784,2],[659,1],[587,1],[523,2],[440,1],[523,1],[659,2],[587,1],[523,1],[392,2],[523,1],[659,1],[784,2],[880,1],[784,1],[659,2],[587,1],[659,1],[587,1],[440,1],[523,4]];
function musicStart(){if(musOn||!ac())return;musOn=true;const step=()=>{if(!S.music){musOn=false;return;}const n=MEL[musI%MEL.length];musI++;if(ac()){const t=AC.currentTime+.02;tone(n[0],t,n[1]*.55+.5,.045,'sine');if(musI%4===1)tone(n[0]/4,t,1.8,.04,'sine');}setTimeout(step,n[1]*520);};step();}
function result(title,out,ctx){sweep(ctx||{},out);checkBadges(out);sfx(out.some(l=>l.c==='burst')?'spark':out.some(l=>l.c==='oops')?'oops':'bond');F={t:'result',title,html:linesHTML(out)};sheet();render();}

const A={
  tab(d){UI.tab=d.v;UI.reset=false;render();},
  open(d){UI.shelf=0;F={t:'detail',id:+d.id};sheet();},
  pair(d){F={t:'pair',x:+d.x,y:+d.y};sheet();},
  close(){F=null;UI.shelf=0;sheet();render();},
  hang(){F={t:'hang',picks:[],act:null};sheet();},
  hangPair(){if(S.acts<=0)return;F={t:'hang',picks:[F.x,F.y],act:null};sheet();},
  train(){F={t:'train',picks:[]};sheet();},
  exp(){F={t:'exp',picks:[],place:null};sheet();},
  pick(d){if(!F||!F.picks)return;const id=+d.id,i=F.picks.indexOf(id),max={hang:2,train:1,exp:3,build:2}[F.t];
    if(i>=0)F.picks.splice(i,1);else if(max===1)F.picks=[id];else if(F.picks.length<max)F.picks.push(id);sheet();},
  act(d){F.act=d.v;sheet();},
  place(d){F.place=d.v;sheet();},
  goHang(){if(S.acts<=0||F.picks.length!==2||!F.act)return;const a=byId(F.picks[0]),b=byId(F.picks[1]),k=F.act;result(HANG[k].n,doHang(a,b,k),{team:[a,b],act:k});},
  goTrain(d){const x=byId(F.picks[0]);if(S.acts<=0||!x||!T[d.v])return;result(T[d.v].n,doTrain(x,d.v),{team:[x]});},
  goExp(d){const team=F.picks.map(byId),p=F.place;if(S.acts<=0||team.length<2||!p)return;const ctx={team,place:p};result(PLACES[p].n,doExp(team,p,+d.v,ctx),ctx);},
  build(){const open=Object.keys(PROJ).filter(k=>!S.proj[k].done);F={t:'build',picks:[],proj:open.length?open[0]:null};sheet();},
  proj(d){F.proj=d.v;sheet();},
  goBuild(){const team=F.picks.map(byId),p=F.proj;if(S.acts<=0||!team.length||!p||S.proj[p].done)return;result(PROJ[p].n,doBuild(team,p),{team,build:true});},
  snd(){S.snd=!S.snd;render();},
  music(){S.music=!S.music;if(S.music)musicStart();render();},
  copySave(){let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},S,{log:S.log.slice(-40)})))));}catch(e){}UI.code=code;UI.msg='Code made. Copy it from the box.';
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(()=>{UI.msg='Copied! Paste it on the other device.';render();},()=>{});}catch(e){}render();},
  loadSave(){const el=document.getElementById('sc'),v=(el&&el.value||'').trim();
    try{const s=JSON.parse(decodeURIComponent(escape(atob(v))));if(!s||!Array.isArray(s.dragons)||!s.bonds||(s.v!==1&&s.v!==2))throw 0;S=migrate(s);S.dragons.forEach(d=>{if(!d.wish)newWish(d);});UI.code='';UI.msg='Loaded '+S.name+'.';UI.tab='dragons';}
    catch(e){UI.code=v;UI.msg='That code did not work. Check that you pasted all of it.';}render();},
  night(){sfx('night');const out=lightsOut();sweep({},out);checkBadges(out);let pend=null;
    if(S.night%5===0)pend={type:'gather',g:GORDER[(S.night/5)%3]};else if(chance(.6))pend=pickEvent();
    F={t:'result',title:'Lights out',html:linesHTML(out),btn:'Wake the dragons',pend};sheet();render();},
  ev(d){const P=F.pend,ev=EVENTS.find(e=>e.id===P.ev),a=byId(P.a);if(!ev||!a)return A.close();result(ev.title,resolveEvent(ev,a,+d.v));},
  perform(d){const x=byId(+d.id),g=F.pend.g;if(!x)return;result('Midnight Gathering',perform(x,g));},
  keeper(d){S.keeper=+d.id;const x=byId(S.keeper);log(x.name+' was chosen as Hoard Keeper.','bond');sheet();render();},
  mentor(d){F={t:'mentor',id:+d.id};sheet();},
  setMentor(d){const h=byId(F.id),m=byId(+d.id);if(h&&m){h.mentor=m.id;log(m.name+' became mentor to Wee '+h.name+'.','bond');mem(h,m,m.name+' became '+h.name+"'s mentor");}F={t:'detail',id:F.id};sheet();render();},
  acc(d){const x=byId(F.id);if(x){x.acc=d.v||null;sheet();render();}},
  shelf(d){const id=+d.id,x=byId(id);if(!x)return;if(UI.shelf!==id){UI.shelf=id;sheet();return;}UI.shelf=0;toShelf(x);F=null;sheet();render();},
  rename(d){const x=byId(+d.id),v=(document.getElementById('rn').value||'').trim().slice(0,16);if(x&&v){x.name=v;sheet();render();}},
  hoardName(){const v=(document.getElementById('hn').value||'').trim().slice(0,28);if(v){S.name=v;render();}},
  reset(){if(!UI.reset){UI.reset=true;render();return;}UI.reset=false;UI.tab='dragons';newGame();welcome();},
  make(){if(S.dragons.length>=CAP)return;F={t:'make',d:{name:'',type:'stuffy',color:rnd(COLORS.length),wing:'bat',horns:1,eyes:'button',pattern:'plain',spikes:0,pers:'Brave'}};sheet();},
  mk(d){const i=document.getElementById('mkn');if(i)F.d.name=i.value.slice(0,16);F.d[d.k]=d.n?+d.v:d.v;if(d.k==='type'&&d.v!=='stuffy'&&F.d.eyes==='button')F.d.eyes='dot';sheet();},
  mkGo(){const i=document.getElementById('mkn');if(i)F.d.name=i.value.trim().slice(0,16);if(S.dragons.length>=CAP)return;
    const x=newDragon('grown'),c=F.d;if(c.name)x.name=c.name;x.type=c.type;x.fabric=pick(TYPES[c.type].fab);x.color=c.color;x.wing=c.wing;x.horns=c.horns;x.eyes=c.eyes;x.pattern=c.pattern;x.spikes=!!c.spikes;x.pers=c.pers;x.energy=maxE(x);
    S.dragons.forEach(o=>{if(o.id!==x.id)bondOf(o,x).p=rnd(12);});newWish(x);
    const m='Charliescope set a brand new dragon on the bed: '+x.name+', a '+x.fabric+' '+COLORS[x.color][0]+' '+TYPES[x.type].n+'.';log(m,'spark');
    UI.tab='dragons';const out=[{c:'cap',h:esc(x.name+' joined the Hoard!')},{c:'ln',h:esc(m)},{c:'bond',h:'💭 '+esc(x.name+' '+wishText(x)+'.')}];checkBadges(out);F={t:'result',title:'A new dragon',html:'<div class="two">'+dragonSVG(x,140)+'</div>'+linesHTML(out)};sheet();render();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(e.target===$sheet)A.close();return;}
  if(el.disabled)return;
  sfx('tap');if(S&&S.music&&!musOn)musicStart();
  const fn=A[el.dataset.a];if(fn)fn(el.dataset);
});
function welcome(){
  S.seen=true;
  F={t:'result',title:'Welcome to the Hoard',btn:'Wake the dragons',html:linesHTML([{c:'cap',h:'When the lights go out, the toy dragons wake up.'},{c:'bond',h:'Help them become friends. Friends share memories, notice clues, and invent duo moves.'},{c:'burst',h:'Every dragon has hidden talents.<small>Hang out, train, and explore to find them.</small>'},{c:'ln',h:'💭 Every dragon also has a wish. Tap a dragon to see it.'}])};
  sheet();render();
}
function start(data){S=(data&&data.S&&migrate(data.S))||load()||newGame();S.dragons.forEach(d=>{if(!d.wish)newWish(d);});if(!S.seen)welcome();else render();}
window.__S=()=>S;
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
