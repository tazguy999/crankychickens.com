    ctx.fillRect(tx-5, ty, 10, 40);
    ctx.beginPath(); ctx.arc(tx, ty, 22, 0, Math.PI*2); ctx.fill();
  }

  // Ocean
  ctx.fillStyle = '#0a2a3a';
  ctx.fillRect(0, H*0.82, W, H*0.18);
  for (let i = 0; i < 4; i++) {
    const wx = ((i*250 + G.ticks*1.5) % (W+200)) - 100;
    ctx.strokeStyle = 'rgba(100,200,255,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(wx, H*0.82+10);
    ctx.quadraticCurveTo(wx+60, H*0.82-5, wx+120, H*0.82+10); ctx.stroke();
  }

  // TITLE TEXT
  ctx.textAlign = 'center';
  // Shadow
  ctx.font = 'bold 44px "Courier New"';
  ctx.fillStyle = '#0a2a0a';
  ctx.fillText('CRANKY CHICKENS', W/2+2, H*0.22+2);
  // Main
  const tg = ctx.createLinearGradient(0, H*0.15, 0, H*0.28);
  tg.addColorStop(0,'#b8ff3a'); tg.addColorStop(1,'#ffe94a');
  ctx.fillStyle = tg;
  ctx.fillText('CRANKY CHICKENS', W/2, H*0.22);

  ctx.font = 'bold 22px "Courier New"';
  ctx.fillStyle = '#ff8c2a';
  ctx.fillText('MYSTERY ISLAND TROUBLE', W/2, H*0.33);

  // Chicken
  const cb = new Bird('split', W/2 - 60, H*0.52);
  cb.launched = true; cb.rotation = 0.2;
  cb.drawBody(W/2 - 60, H*0.52);
  const cb2 = new Bird('bomb', W/2 + 60, H*0.52);
  cb2.launched = true; cb2.rotation = -0.2;
  cb2.drawBody(W/2 + 60, H*0.52);

  // Jaguar tease
  drawJaguar(W/2, H*0.52, 20, 'grunt', false);

  // Blink prompt
  if (Math.floor(G.ticks / 30) % 2 === 0) {
    ctx.font = '14px "Courier New"';
    ctx.fillStyle = '#4cff6a';
    ctx.fillText('CLICK TO START', W/2, H*0.72);
  }
  ctx.font = '11px "Courier New"';
  ctx.fillStyle = '#4a7a4a';
  ctx.fillText('drag slingshot to launch · click mid-flight to activate ability', W/2, H*0.78);
  ctx.textAlign = 'left';
}

// ─── WORLD MAP ────────────────────────────────────────────────────────────────
const WORLD_NODES = [
  // World 1: Jungle
  { name:'1-1: JUNGLE',    x:0.18, y:0.72, world:1 },
  { name:'1-2: JUNGLE',    x:0.28, y:0.62, world:1 },
  { name:'1-3: JUNGLE',    x:0.35, y:0.52, world:1 },
  // World 2: Reef
  { name:'2-1: REEF',      x:0.44, y:0.44, world:2 },
  { name:'2-2: REEF',      x:0.53, y:0.36, world:2 },
  { name:'2-3: REEF',      x:0.60, y:0.44, world:2 },
  // World 3: Storm
  { name:'3-1: STORM',     x:0.67, y:0.36, world:3 },
  { name:'3-2: STORM',     x:0.75, y:0.28, world:3 },
  { name:'3-3: STORM',     x:0.82, y:0.36, world:3 },
  // World 4: Volcano
  { name:'4-1: VOLCANO',   x:0.72, y:0.52, world:4 },
  { name:'4-2: VOLCANO',   x:0.62, y:0.60, world:4 },
  // Boss
  { name:'⚠ DARK HEART',   x:0.50, y:0.22, world:5 },
];

function drawWorldMap() {
  const W = G.W, H = G.H;
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a2a1a'); grad.addColorStop(1,'#1a4a2a');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 18px "Courier New"';
  ctx.fillStyle = '#b8ff3a';
  ctx.fillText('🗺  MYSTERY ISLAND', W/2, 36);

  // Island blob
  ctx.fillStyle = '#2a5a2a';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.5, W*0.42, H*0.38, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#4cff6a44'; ctx.lineWidth = 2; ctx.stroke();

  // World color palette
  const worldColors = { 1:'#4cff6a', 2:'#6af0ff', 3:'#aaaaff', 4:'#ff8844', 5:'#ff4444' };
  const worldBg    = { 1:'#1a3a1a', 2:'#0a2a3a', 3:'#1a1a3a', 4:'#3a1a0a', 5:'#3a0a0a' };

  // Paths
  for (let i = 0; i < WORLD_NODES.length - 1; i++) {
    const a = WORLD_NODES[i], b = WORLD_NODES[i+1];
    ctx.setLineDash([5,5]);
    ctx.strokeStyle = i < G.level ? worldColors[a.world] : '#2a5a2a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x*W, a.y*H); ctx.lineTo(b.x*W, b.y*H); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Nodes
  for (let i = 0; i < WORLD_NODES.length; i++) {
    const n = WORLD_NODES[i];
    const nx = n.x * W, ny = n.y * H;
    const unlocked = i <= G.level;
    const isBoss = i === BOSS_LEVEL;
    const col = worldColors[n.world] || '#4cff6a';
    const bg  = worldBg[n.world] || '#1a3a1a';

    ctx.fillStyle = unlocked ? bg : '#111';
    ctx.strokeStyle = unlocked ? col : '#2a5a2a';
    ctx.lineWidth = unlocked ? 3 : 1;
    ctx.beginPath(); ctx.arc(nx, ny, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.font = isBoss ? '16px serif' : 'bold 11px "Courier New"';
    ctx.fillStyle = unlocked ? col : '#333';
    ctx.fillText(isBoss ? '💀' : `${i+1}`, nx, ny + (isBoss ? 6 : 4));

    // Stars
    const s = G.stars[i] || 0;
    ctx.font = '9px serif';
    for (let st = 0; st < 3; st++) {
      ctx.fillStyle = st < s ? '#ffe94a' : '#333';
      ctx.fillText('★', nx - 8 + st*8, ny + 32);
    }

    // Pulse on current level
    if (i === G.level && unlocked) {
      const pulse = Math.sin(G.ticks * 0.09) * 5;
      ctx.strokeStyle = col + '88'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nx, ny, 26 + pulse, 0, Math.PI*2); ctx.stroke();
    }

    ctx.font = '9px "Courier New"';
    ctx.fillStyle = unlocked ? '#c8ffc8' : '#2a5a2a';
    ctx.fillText(n.name, nx, ny + 44);
  }

  // World labels
  ctx.font = 'bold 10px "Courier New"';
  const worldLabels = [[0.28,0.82,'W1: JUNGLE','#4cff6a'],[0.52,0.82,'W2: REEF','#6af0ff'],[0.73,0.82,'W3: STORM','#aaaaff'],[0.67,0.70,'W4: VOLCANO','#ff8844']];
  for (const [wx,wy,wname,wcol] of worldLabels) {
    ctx.fillStyle = wcol + '88';
    ctx.fillText(wname, wx*W, wy*H);
  }

  ctx.font = '11px "Courier New"';
  ctx.fillStyle = '#4cff6a';
  ctx.fillText('TAP A LEVEL TO PLAY', W/2, H - 16);
  ctx.textAlign = 'left';
}

// ─── RESULT SCREEN ────────────────────────────────────────────────────────────
function drawResult() {
  const W = G.W, H = G.H;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);

  const allDead = G.jaguars.every(j => !j.alive);
  const win = allDead;

  ctx.textAlign = 'center';
  ctx.font = 'bold 28px "Courier New"';
  ctx.fillStyle = win ? '#b8ff3a' : '#ff4444';
  ctx.fillText(win ? '🏆  LEVEL COMPLETE!' : '💀  SQUAWKED OUT', W/2, H*0.28);

  if (win) {
    // Stars
    const s = G.levelStars;
    ctx.font = '40px serif';
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < s ? '#ffe94a' : '#333';
      ctx.fillText('★', W/2 - 40 + i*40, H*0.42);
    }
    ctx.font = '14px "Courier New"';
    ctx.fillStyle = '#c8ffc8';
    ctx.fillText(`SCORE: ${G.score.toLocaleString()}`, W/2, H*0.52);

    const eggs = G.eggs.filter(e=>e.collected).length;
    if (eggs > 0) ctx.fillText(`🥚 EGGS RESCUED: ${eggs}`, W/2, H*0.59);
    ctx.fillText(`BIRDS REMAINING: ${G.birdQueue.length + (G.activeBird && !G.activeBird.launched ? 1 : 0)}`, W/2, H*0.66);

    // "The jaguar stares at you. You say nothing. It appreciates this."
    ctx.font = 'italic 11px "Courier New"';
    ctx.fillStyle = '#4a8a4a';
    const isBoss = G.level === BOSS_LEVEL;
    ctx.fillText(isBoss
      ? '"the mask... stays on..." — King Mudsworth, defeated pig king'
      : '"that\'s a perfectly normal pig." — you, probably',
      W/2, H*0.75);

    // Buttons
    drawButton(W/2 - 100, H*0.82, 90, 32, 'RETRY', '#4cff6a', '#0a2a0a');
    if (G.level < TOTAL_LEVELS - 1) drawButton(W/2 + 10, H*0.82, 110, 32, 'NEXT LEVEL', '#ffe94a', '#2a1a00');
    drawButton(W/2 + 130, H*0.82, 60, 32, 'MAP', '#ff8c2a', '#2a0a00');
  } else {
    ctx.font = '13px "Courier New"';
    ctx.fillStyle = '#ff8888';
    ctx.fillText('no birds remaining...', W/2, H*0.48);
    drawButton(W/2 - 55, H*0.62, 90, 32, 'RETRY', '#4cff6a', '#0a2a0a');
    drawButton(W/2 + 45, H*0.62, 60, 32, 'MAP', '#ff8c2a', '#2a0a00');
  }
  ctx.textAlign = 'left';
}

function drawButton(x, y, w, h, label, color, bg) {
  ctx.fillStyle = bg;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 13px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + h/2 + 5);
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
let mouseX = 0, mouseY = 0;

function toVirtual(cx, cy, rect) {
  return [(cx - rect.left) / GAME_SCALE, (cy - rect.top) / GAME_SCALE];
}

C.addEventListener('mousedown', e => {
  const r = C.getBoundingClientRect();
  [mouseX, mouseY] = toVirtual(e.clientX, e.clientY, r);
  handleDown();
});
C.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = C.getBoundingClientRect();
  [mouseX, mouseY] = toVirtual(e.touches[0].clientX, e.touches[0].clientY, r);
  handleDown();
}, { passive: false });

C.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  [mouseX, mouseY] = toVirtual(e.clientX, e.clientY, r);
  handleMove();
});
C.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = C.getBoundingClientRect();
  [mouseX, mouseY] = toVirtual(e.touches[0].clientX, e.touches[0].clientY, r);
  handleMove();
}, { passive: false });

C.addEventListener('mouseup', handleUp);
C.addEventListener('touchend', handleUp);

function handleDown() {
  if (G.state === 'TITLE') { G.state = 'WORLDMAP'; return; }
  if (G.state === 'WORLDMAP') {
    const W = G.W, H = G.H;
    for (let i = 0; i < WORLD_NODES.length; i++) {
      if (i > G.level) continue;
      const n = WORLD_NODES[i];
      if (dist(mouseX, mouseY, n.x*W, n.y*H) < 50) {
        G.level = i; loadLevel(i); G.state = 'LEVEL'; return;
      }
    }
    return;
  }
  if (G.state === 'RESULT') { handleResultClick(); return; }
  if (G.state === 'LEVEL') {
    // Only handle sling drag on down — ability fires on UP
    if (G.activeBird && !G.activeBird.launched) {
      G.sling.dragging = true;
      const dx = mouseX - G.sling.x, dy = mouseY - G.sling.y;
      const mag = Math.sqrt(dx*dx + dy*dy) || 1;
      const clamp = Math.min(mag, MAX_PULL);
      G.sling.pullX = G.sling.x + (dx/mag)*clamp;
      G.sling.pullY = G.sling.y + (dy/mag)*clamp;
      G.activeBird.x = G.sling.pullX;
      G.activeBird.y = G.sling.pullY;
    }
  }
}

function handleMove() {
  if (G.state !== 'LEVEL') return;
  if (G.sling.dragging && G.activeBird && !G.activeBird.launched) {
    const dx = mouseX - G.sling.x, dy = mouseY - G.sling.y;
    const mag = Math.sqrt(dx*dx + dy*dy);
    const clamp = Math.min(mag, MAX_PULL);
    G.sling.pullX = G.sling.x + (dx/mag)*clamp;
    G.sling.pullY = G.sling.y + (dy/mag)*clamp;
    G.activeBird.x = G.sling.pullX;
    G.activeBird.y = G.sling.pullY;
  }
}

function handleUp() {
  if (G.state !== 'LEVEL') return;

  // If this up event released the sling, launch the bird — don't also trigger ability
  if (G.sling.dragging && G.activeBird && !G.activeBird.launched) {
    G.sling.dragging = false;
    const dx = G.sling.x - G.sling.pullX;
    const dy = G.sling.y - G.sling.pullY;
    const mag = Math.sqrt(dx*dx+dy*dy);
    if (mag > 10) {
      const power = Math.min(mag / MAX_PULL, 1) * SLING_POWER * MAX_PULL;
      G.activeBird.vx = (dx / mag) * power * 0.85;
      G.activeBird.vy = (dy / mag) * power * 0.85;
      G.activeBird.launched = true;
      G.activeBird.launchTick = G.ticks;
      G.activeBird.launchX = G.activeBird.x;
      G.activeBird.launchY = G.activeBird.y;
      G.activeBird.x = G.sling.pullX;
      G.activeBird.y = G.sling.pullY;
      G.sling.launched = true;
      G.justLaunched = true; // block ability on any follow-up synthetic event
    } else {
      G.sling.pullX = G.sling.x;
      G.sling.pullY = G.sling.y;
      if (G.activeBird) { G.activeBird.x = G.sling.x; G.activeBird.y = G.sling.y; }
    }
    return; // never fall through to ability
  }

  // Ability tap — only if bird is in flight AND this wasn't a launch gesture
  if (G.activeBird && G.activeBird.launched) {
    if (G.justLaunched) {
      G.justLaunched = false; // eat the synthetic event
      return;
    }
    if (G.activeBird.swinging) {
      G.activeBird.swinging = false;
    } else {
      G.activeBird.activate();
    }
  }
}

function handleResultClick() {
  const W = G.W, H = G.H;
  const allDead = G.jaguars.every(j => !j.alive);
  if (allDead) {
    // RETRY
    if (inBtn(W/2-100, H*0.82, 90, 32)) { loadLevel(G.level); G.state = 'LEVEL'; return; }
    // NEXT
    if (G.level < TOTAL_LEVELS - 1 && inBtn(W/2+10, H*0.82, 110, 32)) {
      G.level++;
      loadLevel(G.level);
      G.state = 'LEVEL'; return;
    }
    // MAP
    if (inBtn(W/2+130, H*0.82, 60, 32)) { G.state = 'WORLDMAP'; return; }
  } else {
    if (inBtn(W/2-55, H*0.62, 90, 32)) { loadLevel(G.level); G.state = 'LEVEL'; return; }
    if (inBtn(W/2+45, H*0.62, 60, 32)) { G.state = 'WORLDMAP'; return; }
  }
}

function inBtn(x, y, w, h) {
  return mouseX >= x && mouseX <= x+w && mouseY >= y && mouseY <= y+h;
}

// ─── LEVEL LOGIC ──────────────────────────────────────────────────────────────
function updateLevel() {
  G.ticks++;
  G.sling.y = G.ground - 40;

  // NO camera panning — world is fully visible. camera.x stays 0.
  // Bird flies in screen space directly.

  // Update bird
  if (G.activeBird && G.activeBird.launched) {
    checkEggs(G.activeBird);
    checkCollisions(G.activeBird);
    G.activeBird.update();
    if (!G.activeBird.alive && G.resultTimer === 9999) {
      G.resultTimer = 180;
    }
  }

  // Update split children
  G.splitChildren = (G.splitChildren || []).filter(b => b.alive);
  for (const b of G.splitChildren) {
    checkEggs(b);
    checkCollisions(b);
    b.update();
  }

  // Count down and spawn next bird
  if (G.activeBird && !G.activeBird.alive && G.resultTimer < 9999) {
    G.resultTimer--;
    if (G.resultTimer <= 0) {
      G.resultTimer = 9999;
      setupNextBird();
    }
  }

  // Update blocks & jaguars
  for (const b of G.blocks) b.update();

  // Block-on-block stacking — resolve vertical overlaps (multiple passes for stability)
  const liveBlocks = G.blocks.filter(b => b.alive);
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < liveBlocks.length; i++) {
      const a = liveBlocks[i];
      for (let j = i + 1; j < liveBlocks.length; j++) {
        const b = liveBlocks[j];
        // AABB overlap check
        const overlapX = a.wx < b.wx + b.w && a.wx + a.w > b.wx;
        const overlapY = a.wy < b.wy + b.h && a.wy + a.h > b.wy;
        if (!overlapX || !overlapY) continue;
        // Push apart vertically only (keep horizontal momentum for tumbling)
        const penY = Math.min(a.wy + a.h - b.wy, b.wy + b.h - a.wy);
        // Determine which is on top
        const aCenterY = a.wy + a.h / 2;
        const bCenterY = b.wy + b.h / 2;
        if (aCenterY < bCenterY) {
          // a is on top of b
          a.wy -= penY * 0.5;
          b.wy += penY * 0.5;
          if (a.vy > 0) a.vy *= -0.1;
          if (b.vy < 0) b.vy *= -0.1;
        } else {
          // b is on top of a
          b.wy -= penY * 0.5;
          a.wy += penY * 0.5;
          if (b.vy > 0) b.vy *= -0.1;
          if (a.vy < 0) a.vy *= -0.1;
        }
      }
    }
  }

  for (const j of G.jaguars) j.update();
  updateParticles();
  updateFallenMasks();

  // Shaman rebuild
  for (const j of G.jaguars) {
    if (j.jtype === 'shaman' && j.alive && j.rebuildCooldown <= 0) {
      const deadBlocks = G.blocks.filter(b => !b.alive);
      if (deadBlocks.length > 0) {
        const rb = deadBlocks[Math.floor(Math.random()*deadBlocks.length)];
        rb.alive = true; rb.hp = rb.maxHP;
        rb.falling = false; rb.rot = 0;
        j.rebuildCooldown = 300;
        spawnParticles(rb.wx - G.camera.x + rb.w/2, rb.wy + rb.h/2, '#cc88ff', 10, 3);
        showMsg("the pig spirits... restored the block. definitely pig spirits.");
      }
    }
  }

  // Boss: king jaguar spawns when walls down
  if (G.isBoss) {
    const wallsAlive = G.blocks.filter(b => b.alive).length;
    const king = G.jaguars.find(j => j.jtype === 'king');
    if (!king && wallsAlive < 3 && G.phase === 1) {
      G.phase = 2;
      G.jaguars.push(new Jaguar({jtype:'king', x:Math.round(G.W*0.57), y:-80}, G.ground));
      G.bossHP = G.bossMaxHP = 8;
      showMsg("I AM KING PIG. ALWAYS HAVE BEEN.");
    }
    if (king && !king.alive) G.bossHP = 0;
    else if (king) G.bossHP = king.hp;
  }

  // ── TETRIS DROP SYSTEM ───────────────────────────────────────
  // Per-level tuning: [startTick, startInterval, minInterval]
  // startTick  = how many ticks before first drop (no drops before this)
  // startInterval = initial gap between drops (frames)
  // minInterval   = fastest the drops ever get (frames)
  // Level 0 (1-1) has no drops — tutorial grace
  const cfg = DROP_CONFIG[Math.min(G.level, DROP_CONFIG.length - 1)];
  const allJaguarsDead = G.jaguars.length > 0 && G.jaguars.every(j => !j.alive);

  if (cfg && G.ticks >= cfg[0] && !allJaguarsDead) {
    const dropAge = G.ticks - cfg[0];
    const [, startInterval, minInterval] = cfg;
    // Ramp over 3600 ticks (60s) from startInterval down to minInterval
    const rampFrames = 3600;
    const t = Math.min(dropAge / rampFrames, 1);
    const dropInterval = Math.round(startInterval + (minInterval - startInterval) * t);

    if (!G.nextDropTick) G.nextDropTick = G.ticks + dropInterval;

    // Warning shadow 60 frames before drop
    if (G.ticks === G.nextDropTick - 60) {
      G.dropWarningX = lx(0.45 + Math.random() * 0.42);
      const jagChance = 0.05 + (G.level / BOSS_LEVEL) * 0.12; // more jaguars on later levels
      G.dropWarningMat = Math.random() < jagChance ? 'jaguar' : (['log','plank','rock'][Math.floor(Math.random()*3)]);
    }

    // Execute drop
    if (G.ticks >= G.nextDropTick) {
      const wx = G.dropWarningX || lx(0.45 + Math.random() * 0.42);
      const mat = G.dropWarningMat || 'log';
      if (mat === 'jaguar') {
        const jtypes = G.level >= 8 ? ['grunt','helmet','shaman'] : ['grunt','grunt','helmet'];
        const jtype = jtypes[Math.floor(Math.random()*jtypes.length)];
        const j = new Jaguar({jtype, x: wx, y: 0}, 0);
        j.wy = -j.r * 2;
        j.vy = 1.5;
        G.jaguars.push(j);
        showMsg(["reinforcements.", "they just keep coming.", "oh no not more of them.", "the island is not finished with you."][Math.floor(Math.random()*4)]);
      } else {
        const w = mat === 'log' ? 22 : mat === 'plank' ? 65 : 30;
        const h = mat === 'log' ? 55 : mat === 'plank' ? 18 : 32;
        const b = new Block({mat, x: wx, y: 0, w, h}, 0);
        b.wy = -h - 10;
        b.vy = 1.2 + Math.random() * 0.6;
        b.vx = (Math.random() - 0.5) * 1.2;
        b.rotV = (Math.random() - 0.5) * 0.04;
        G.blocks.push(b);
      }
      G.dropWarningX = null;
      G.nextDropTick = G.ticks + dropInterval;
      spawnParticles(wx, 10, '#ff4444', 5, 2);
    }
  }

  // Check end condition
  const allDead = G.jaguars.length > 0 && G.jaguars.every(j => !j.alive);
  const lastBirdLanded = !G.activeBird || (!G.activeBird.alive && G.birdQueue.length === 0);
  const noBirds = lastBirdLanded && G.birdQueue.length === 0 && (!G.activeBird || !G.activeBird.launched);

  if (allDead) {
    G.endTimer = (G.endTimer || 0) + 1;
    if (G.endTimer > 90) {
      const birdsLeft = G.birdQueue.length + (G.activeBird && G.activeBird.alive ? 1 : 0);
      G.levelStars = birdsLeft >= 2 ? 3 : birdsLeft === 1 ? 2 : 1;
      G.stars[G.level] = Math.max(G.stars[G.level] || 0, G.levelStars);
      G.level = Math.min(G.level + 1, TOTAL_LEVELS - 1);
      G.endTimer = 0;
      G.state = 'RESULT';
    }
  } else if (noBirds && !allDead && G.jaguars.length > 0) {
    G.endTimer = (G.endTimer || 0) + 1;
    if (G.endTimer > 120) {
      G.levelStars = 0;
      G.endTimer = 0;
      G.state = 'RESULT';
    }
  } else {
    G.endTimer = 0;
  }
}

function drawLevel() {
  G.sling.y = G.ground - 40;
  drawBG(G.currentBg);
  drawEggs();
  for (const b of G.blocks) b.draw();
  for (const j of G.jaguars) j.draw();
  drawFallenMasks();
  drawParticles();
  drawSling();
  if (G.activeBird && !G.activeBird.launched) {
    // Draw bird sitting in sling (or pulled back)
    G.activeBird.drawBody(G.sling.pullX, G.sling.pullY);
  }
  if (G.activeBird) G.activeBird.draw(0);
  for (const b of (G.splitChildren || [])) b.draw(0);
  const queueStart = G.sling.x - 30;
  for (let i = 0; i < Math.min(G.birdQueue.length, 5); i++) {
    const qb = new Bird(G.birdQueue[i], 0, 0);
    qb.launched = true;
    qb.drawBody(queueStart - i * 28, G.ground - 12);
  }
  drawHUD();

  // ── DROP WARNING INDICATOR ────────────────────────────────────
  if (G.dropWarningX && G.ticks > 600) {
    const wx = G.dropWarningX;
    const isMat = G.dropWarningMat !== 'jaguar';
    const pulse = 0.4 + Math.abs(Math.sin(G.ticks * 0.15)) * 0.6;
    ctx.save();
    ctx.globalAlpha = pulse * 0.7;
    // Danger chevron at top
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(wx - 12, 0);
    ctx.lineTo(wx + 12, 0);
    ctx.lineTo(wx, 18);
    ctx.closePath(); ctx.fill();
    // Dashed drop line
    ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(wx, 20); ctx.lineTo(wx, G.ground - 10); ctx.stroke();
    ctx.setLineDash([]);
    // Shadow silhouette at ground
    ctx.fillStyle = '#ff444444';
    if (isMat) {
      const w = G.dropWarningMat === 'plank' ? 70 : G.dropWarningMat === 'log' ? 20 : 28;
      ctx.fillRect(wx - w/2, G.ground - 8, w, 6);
    } else {
      ctx.beginPath(); ctx.arc(wx, G.ground - 12, 16, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function dist(ax, ay, bx, by) { return Math.sqrt((ax-bx)**2+(ay-by)**2); }
function shadeColor(hex, pct) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (n>>16) + pct));
  const g = Math.min(255, Math.max(0, ((n>>8)&0xff) + pct));
  const b = Math.min(255, Math.max(0, (n&0xff) + pct));
  return `rgb(${r},${g},${b})`;
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop() {
  G.ticks++;
  // Clear actual pixel canvas
  ctx.clearRect(0, 0, C.width, C.height);
  // Scale everything down so the virtual world fits on screen
  ctx.save();
  ctx.scale(GAME_SCALE, GAME_SCALE);

  if (G.state === 'TITLE') drawTitle();
  else if (G.state === 'WORLDMAP') { drawWorldMap(); }
  else if (G.state === 'LEVEL') { updateLevel(); drawLevel(); }
  else if (G.state === 'RESULT') { drawLevel(); drawResult(); }

  ctx.restore();
  requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { resize(); });
resize();
G.sling.y = G.ground - 40;
G.sling.pullX = G.sling.x;
G.sling.pullY = G.sling.y;
G.level = 0;
loop();
</script>
