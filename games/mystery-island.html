function resize() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  C.width = W; C.height = H;
  C.style.width = W + 'px';
  C.style.height = H + 'px';
  // Virtual canvas size (game logic runs at this resolution)
  G.W = Math.round(W / GAME_SCALE);
  G.H = Math.round(H / GAME_SCALE);
  G.ground = G.H - 100;
  G.sling.x = Math.round(G.W * 0.13);
  if (!G.activeBird || !G.activeBird.launched) {
    G.sling.pullX = G.sling.x;
  }
}

// ─── PHYSICS CONSTANTS ────────────────────────────────────────────────────────
const GRAVITY = 0.35;
const SLING_POWER = 0.22;
const MAX_PULL = 110;

// Tetris drop config per level: [startTick, startInterval, minInterval]
const DROP_CONFIG = [
  null,             // 0: 1-1  no drops
  [600, 350, 280],  // 1: 1-2

  [480, 280, 210],  // 3: 2-1

// ─── ENTITY CLASSES ───────────────────────────────────────────────────────────

class Bird {
  constructor(type, x, y) {
    this.type = type; // split | speed | bomb | tyler | ghost
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.r = type === 'bomb' ? 22 : type === 'speed' ? 17 : type === 'tyler' ? 34 : 20;
    // Ghost: phases through everything, then reassembles into a chicken
    // on the far side and detonates. Cannon Master's idea.
    this.phasing = false;
    this.phaseTicks = 0;
    this.wasInsideBlock = false;
    this.reformTimer = 0;
    this.alive = true;
    this.launched = false;
    this.abilityUsed = false;
    this.trail = [];
    this.splitDone = false;
    this.explodeTimer = 0;
    this.exploding = false;
    this.speedBoostTimer = 0;
    this.rotation = 0;
    this.squish = 1;
    this.launchX = 0;
    this.launchY = 0;
    this.launchTick = 0;
    // Mask physics — cheap plastic on an elastic band
    this.maskAngle = 0;
    this.maskAngVel = 0;
    this.maskOffY = 0;
    this.maskDetached = false;
    // Tyler state
    this.tylerSitting = false;
    this.tylerSitTick = 0;
  }
  get color() {
    return { split:'#f5c842', bomb:'#444', speed:'#e84040', tyler:'#f0f0f0', ghost:'#bfe9ff' }[this.type] || '#f5c842';
  }
  get faceColor() {
    return { split:'#e8b030', bomb:'#ff8800', speed:'#c03030', tyler:'#cccccc', ghost:'#8fd4f0' }[this.type] || '#e8b030';
  }
  get armed() {
    // Bomb only arms after traveling 100px from launch point
    if (this.type !== 'bomb' && this.type !== 'ghost') return true;
    return dist(this.x, this.y, this.launchX, this.launchY) > 100;
  }
  whackMask(impactSpeed) {
    if (this.maskDetached) return;
    // Big angular kick from impact
    this.maskAngVel += (Math.random() - 0.5) * impactSpeed * 0.08;
    this.maskOffY += impactSpeed * 0.4;
    // Detach if hit hard enough
    if (impactSpeed > 7 && Math.random() < 0.65) {
      this.maskDetached = true;
      // Spawn as a tumbling fallen mask
      G.fallenMasks.push({
        wx: this.x + (Math.random()-0.5)*this.r,
        wy: this.y - this.r * 0.4,
        vx: this.vx * 0.3 + (Math.random()-0.5)*5,
        vy: this.vy * 0.2 - 3 - Math.random()*3,
        rot: this.maskAngle,
        rotV: this.maskAngVel * 0.5 + (Math.random()-0.5)*0.4,
        r: this.r,
        jtype: this.type === 'split' ? 'grunt' : this.type === 'speed' ? 'helmet' : 'grunt',
        maskType: this.type, // so we can draw the right mask shape
        life: 1,
      });
    }
  }
  activate() {
    if (this.abilityUsed) return;
    if (!this.armed) return;
    if (this.type === 'tyler') {
      // Don't sit for first 20 frames — prevents sling-release tap from triggering
      if (G.ticks - (this.launchTick || 0) < 20) return;
    }
    this.abilityUsed = true;
    if (this.type === 'tyler') {
      this.tylerSitting = true;
      this.tylerSitTick = 0;
      this.vx = 0; this.vy = 0;
      showMsg("...");
      return;
    }
    if (this.type === 'ghost') {
      this.phasing = true;
      this.phaseTicks = 0;
      spawnParticles(this.x, this.y, '#bfe9ff', 16, 4);
      showMsg('👻 GHOST CHICKEN');
      return;
    }
    if (this.type === 'bomb') {
      this.explodeTimer = 18;
      this.exploding = true;
      spawnParticles(this.x, this.y, '#ff8800', 18, 6);
    } else if (this.type === 'speed') {
      this.vx *= 2.2; this.vy *= 0.4;
      this.speedBoostTimer = 8;
      spawnParticles(this.x, this.y, '#ff4444', 10, 3);
    } else if (this.type === 'split') {
      // Triple shot — spawn two extra chickens fanning up and down
      const spread = 0.32; // radians spread from current angle
      const angle = Math.atan2(this.vy, this.vx);
      const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      for (const da of [-spread, spread]) {
        const b = new Bird('split', this.x, this.y);
        b.vx = Math.cos(angle + da) * spd * 0.9;
        b.vy = Math.sin(angle + da) * spd * 0.9;
        b.launched = true;
        b.abilityUsed = true; // children can't split again
        b.splitDone = true;
        b.launchTick = G.ticks;
        G.splitChildren = G.splitChildren || [];
        G.splitChildren.push(b);
      }
      spawnParticles(this.x, this.y, '#f5c842', 12, 4);
    }
  }
  update() {
    if (!this.launched) return;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 20) this.trail.shift();

    if (this.exploding) {
      this.explodeTimer--;
      if (this.explodeTimer <= 0) {
        // Big explosion
        spawnParticles(this.x, this.y, '#ff6600', 30, 9);
        spawnParticles(this.x, this.y, '#ffcc00', 20, 6);
        explodeBombs(this.x, this.y, 80);
        this.alive = false;
      }
      return;
    }

    // Normal flight physics
    this.vx += 0;
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation = Math.atan2(this.vy, this.vx);

    if (this.speedBoostTimer > 0) this.speedBoostTimer--;

    // ── TYLER SIT MECHANIC — runs instead of normal physics ──────────
    if (this.tylerSitting) {
      this.tylerSitTick++;
      this.vy = Math.min(this.vy + 0.5, 8);
      this.y += this.vy;
      if (this.y + this.r >= G.ground) {
        this.y = G.ground - this.r;
        this.vy = 0;
      }
      const crushRadius = this.r * 1.4;
      const weight = Math.min(this.tylerSitTick / 40, 1);
      for (const b of G.blocks) {
        if (!b.alive) continue;
        const bCx = b.wx + b.w/2;
        if (Math.abs(bCx - this.x) < crushRadius + b.w/2 &&
            b.wy + b.h > this.y - this.r && b.wy < this.y + this.r) {
          b.vy += weight * 0.8;
          if (this.tylerSitTick % 30 === 0 && weight > 0.3) b.hit(1);
        }
      }
      for (const j of G.jaguars) {
        if (!j.alive) continue;
        if (dist(this.x, this.y, j.wx, j.wy) < crushRadius + j.r) {
          j.vx = 0; j.vy = 0; j.shakeTick = 2;
          if (this.tylerSitTick % 60 === 0 && weight > 0.5) j.hit(1);
        }
      }
      if (this.tylerSitTick > 180) {
        showMsg("tyler has made his point.");
        this.alive = false;
      }
      return; // skip all normal physics, ground check, off-screen check
    }

    // Normal flight physics (non-sitting birds only)

    // ── MASK PHYSICS ─────────────────────────────────────────────
    if (!this.maskDetached && this.type !== 'tyler') {
      // Air resistance rotates mask back opposite to flight direction
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const airTorque = -this.vx * 0.004 + this.vy * 0.002;
      this.maskAngVel += airTorque;
      // Elastic spring — pulls mask back toward 0
      this.maskAngVel -= this.maskAngle * 0.12;
      this.maskAngVel *= 0.82; // damping
      this.maskAngle += this.maskAngVel;
      // Elastic droop — mask slides up when going fast, sags when slowing
      const targetDroop = Math.min(speed * 0.15, this.r * 0.5);
      this.maskOffY += (targetDroop - this.maskOffY) * 0.18;
      // Clamp to not go totally insane
      this.maskAngle = Math.max(-1.2, Math.min(1.2, this.maskAngle));
    }

    // Hit ground
    if (this.y + this.r >= G.ground) {
      this.y = G.ground - this.r;
      if (this.type === 'tyler' && !this.tylerSitting) {
        this.activate();
        return;
      }
      if (this.type === 'bomb' && !this.exploding && this.armed) {
        this.exploding = true; this.explodeTimer = 5;
      } else {
        spawnParticles(this.x, this.y, this.color, 8, 3);
        this.alive = false;
      }
    }
    // Off screen (any edge)
    if (this.x > G.W + 200 || this.x < -200 || this.y < -400) this.alive = false;
  }
  draw(cx) {
    if (!this.launched) return;

    // Ghost: go see-through and trail spectral afterimages. The player needs
    // to be able to SEE it inside the wood, so it renders over the blocks.
    if (this.phasing) {
      ctx.save();
      for (let i = 0; i < this.trail.length; i += 2) {
        const t = i / this.trail.length;
        ctx.globalAlpha = t * 0.35;
        ctx.fillStyle = '#bfe9ff';
        ctx.beginPath();
        ctx.arc(this.trail[i].x - cx, this.trail[i].y, this.r * (0.4 + t * 0.6), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 0.55 + Math.sin(G.ticks / 4) * 0.12;
      ctx.shadowColor = '#bfe9ff';
      ctx.shadowBlur = 18;
      ctx.restore();
    }

    // ── TYPE-SPECIFIC TRAIL & ABILITY FX ─────────────────────────────
    if (this.type === 'speed') {
      // Speed: blazing orange/yellow streak — long, bright, obvious
      for (let i = 0; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        const a = t * (this.speedBoostTimer > 0 ? 0.9 : 0.5);
        const r2 = this.r * t * (this.speedBoostTimer > 0 ? 1.4 : 0.8);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = t > 0.7 ? '#fff' : t > 0.4 ? '#ffee00' : '#ff8800';
        ctx.beginPath();
        ctx.arc(this.trail[i].x - cx, this.trail[i].y, r2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      // After boost: white shock rings
      if (this.speedBoostTimer > 0) {
        const age = 8 - this.speedBoostTimer;
        ctx.save();
        ctx.globalAlpha = this.speedBoostTimer / 8;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.x - cx, this.y, this.r + 6 + age * 4, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#ffee00';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x - cx, this.y, this.r + 2 + age * 2, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    } else if (this.type === 'bomb') {
      // Bomb: dark smoky trail, fuse sparks flying off
      for (let i = 0; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        ctx.save();
        ctx.globalAlpha = t * 0.35;
        ctx.fillStyle = '#331133';
        ctx.beginPath();
        ctx.arc(this.trail[i].x - cx, this.trail[i].y, this.r * t * 0.9, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      // Active fuse sparks — scattered bright orange dots
      if (!this.exploding && this.armed) {
        for (let s = 0; s < 3; s++) {
          const seed = (G.ticks * 7 + s * 31) % 100;
          const sx = (this.x - cx) + (seed - 50) * 0.18;
          const sy = this.y - this.r * 1.3 - (seed % 8);
          ctx.save();
          ctx.globalAlpha = 0.7 + Math.sin(G.ticks * 0.4 + s) * 0.3;
          ctx.fillStyle = s === 0 ? '#fff' : s === 1 ? '#ffcc00' : '#ff6600';
          ctx.beginPath(); ctx.arc(sx, sy, 2 + s * 0.5, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }
    } else if (this.type === 'split') {
      // Vine: dotted green trail
      for (let i = 0; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        ctx.save();
        ctx.globalAlpha = t * 0.35;
        ctx.fillStyle = '#4cff6a';
        ctx.beginPath();
        ctx.arc(this.trail[i].x - cx, this.trail[i].y, this.r * t * 0.5, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    } else if (this.type === 'tyler') {
      // Tyler: big fluffy white paw-print trail
      for (let i = 0; i < this.trail.length; i += 3) {
        const t = i / this.trail.length;
        ctx.save();
        ctx.globalAlpha = t * 0.25;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.trail[i].x - cx, this.trail[i].y, this.r * t * 0.7, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    } else {
      // Fallback
      for (let i = 0; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        ctx.save(); ctx.globalAlpha = t * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.trail[i].x - cx, this.trail[i].y, this.r * t * 0.6, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }

    // ── SPLIT FAN LINES — brief visual showing the spread ────────────
    if (this.type === 'split' && this.abilityUsed && !this.splitDone) {
      // already split — children handle themselves
    }

    // ── ABILITY USED LABEL ────────────────────────────────────────────
    if (this.abilityUsed && !this.tylerSitting) {
      const age = this.type === 'speed' ? 8 - this.speedBoostTimer :
                  this.type === 'bomb'  ? (this.exploding ? this.explodeTimer : 0) :
                  this.type === 'split' ? 0 : 0;
      if (age < 12) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - age / 12);
        ctx.font = 'bold 14px "Courier New"';
        ctx.fillStyle = this.type === 'speed' ? '#ffee00' :
                        this.type === 'bomb'  ? '#ff8800' : '#f5c842';
        ctx.textAlign = 'center';
        const label = this.type === 'speed' ? '⚡ BOOST!' :
                      this.type === 'bomb'  ? '💥 BOOM!' : '🐔🐔🐔';
        ctx.fillText(label, this.x - cx, this.y - this.r - 18);
        ctx.textAlign = 'left';
        ctx.restore();
      }
    }

    this.drawBody(this.x - cx, this.y);
  }
  drawBody(x, y) {
    const _phaseAlpha = this.phasing ? (0.45 + Math.sin(G.ticks / 4) * 0.1) : 1;
    if (_phaseAlpha !== 1) { ctx.save(); ctx.globalAlpha = _phaseAlpha; }
    try { this._drawBodyInner(x, y); } finally { if (_phaseAlpha !== 1) ctx.restore(); }
  }
  _drawBodyInner(x, y) {
    ctx.save();
    ctx.translate(x, y);
    if (!this.tylerSitting) ctx.rotate(this.rotation);
    ctx.scale(1 / this.squish, this.squish);

    const r = this.r;

    // ── TAIL FEATHER FAN (drawn first so body overlaps at front) ──
    const drawTail = (color, accent, spread=1.0) => {
      const defs = [{a:0.0,len:1.6,w:0.26},{a:0.32,len:1.75,w:0.24},{a:0.60,len:1.65,w:0.22},{a:0.85,len:1.45,w:0.18},{a:-0.28,len:1.5,w:0.22}];
      for (const f of defs) {
        ctx.save();
        ctx.translate(r*0.25, r*0.15);
        ctx.rotate(f.a * spread);
        ctx.fillStyle = color;
        ctx.strokeStyle = accent; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, -r*f.len*0.5, r*f.w, r*f.len*0.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = accent; ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*f.len*0.48); ctx.stroke();
        ctx.restore();
      }
    };

    if (this.type === 'ghost') {
      // ── GHOST CHICKEN — a sheet-ghost that is still clearly a chicken.
      //    No legs, no feet: it floats. The bottom edge is a wavy tattered
      //    hem that undulates. Comb and beak stay so it reads as poultry.
      const wob = Math.sin(G.ticks / 9) * r * 0.06;
      const glow = this.phasing ? 22 : 10;

      ctx.shadowColor = '#bfe9ff';
      ctx.shadowBlur = glow;

      // Trailing wisps — pushed out behind so they read past the body
      ctx.fillStyle = 'rgba(200,238,255,0.45)';
      for (const [a, len] of [[1.72,1.35],[2.02,1.55],[2.34,1.25]]) {
        ctx.save();
        ctx.translate(-r*0.7, -r*0.05);
        ctx.rotate(a + Math.sin(G.ticks/11 + a*2)*0.16);
        ctx.beginPath();
        ctx.ellipse(0, -r*len*0.5, r*0.15, r*len*0.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      // Body: rounded head/shoulders flowing into a tattered hem
      ctx.beginPath();
      ctx.arc(0, -r*0.12 + wob, r*0.98, Math.PI, 0);          // domed top
      const hemY = r*0.72 + wob;
      const lobes = 5, span = r*1.96, step = span / lobes;
      ctx.lineTo(r*0.98, hemY - r*0.25);
      for (let i = 0; i < lobes; i++) {
        const x0 = r*0.98 - i*step;
        const dip = (i % 2 === 0 ? 1 : -1) * r*0.30;
        const phase = Math.sin(G.ticks/8 + i*1.3) * r*0.09;
        ctx.quadraticCurveTo(x0 - step*0.5, hemY + dip + phase, x0 - step, hemY - r*0.25);
      }
      ctx.closePath();
      const gg = ctx.createLinearGradient(0, -r, 0, r);
      gg.addColorStop(0, 'rgba(232,248,255,0.95)');
      gg.addColorStop(1, 'rgba(150,215,245,0.75)');
      ctx.fillStyle = gg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Wing stubs, faint
      ctx.fillStyle = 'rgba(190,232,252,0.6)';
      ctx.beginPath(); ctx.ellipse(-r*0.82, r*0.05 + wob, r*0.18, r*0.3, -0.4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( r*0.82, r*0.05 + wob, r*0.18, r*0.3,  0.4, 0, Math.PI*2); ctx.fill();

      // Hollow eyes — dark voids, not googly whites
      ctx.fillStyle = 'rgba(30,60,90,0.9)';
      ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.28 + wob, r*0.17, r*0.23, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( r*0.3, -r*0.28 + wob, r*0.17, r*0.23, 0, 0, Math.PI*2); ctx.fill();
      // faint inner glimmer so it reads as spooky-friendly, not dead-eyed
      ctx.fillStyle = 'rgba(190,240,255,0.75)';
      ctx.beginPath(); ctx.arc(-r*0.26, -r*0.33 + wob, r*0.05, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( r*0.34, -r*0.33 + wob, r*0.05, 0, Math.PI*2); ctx.fill();

      // Beak — pale, translucent version of the usual orange
      ctx.fillStyle = 'rgba(255,200,130,0.85)';
      ctx.beginPath();
      ctx.moveTo(-r*0.13, r*0.02 + wob); ctx.lineTo(r*0.13, r*0.02 + wob);
      ctx.lineTo(0, r*0.24 + wob); ctx.closePath(); ctx.fill();

      // Comb — a proper serrated chicken comb so the silhouette says POULTRY,
      // not 'small friendly blob'. Pale spectral pink.
      ctx.fillStyle = 'rgba(255,170,195,0.85)';
      ctx.strokeStyle = 'rgba(255,220,232,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const cy0 = -r*0.92 + wob;
      ctx.moveTo(-r*0.42, cy0);
      ctx.quadraticCurveTo(-r*0.34, cy0 - r*0.34, -r*0.16, cy0 - r*0.06);
      ctx.quadraticCurveTo(-r*0.04, cy0 - r*0.44,  r*0.08, cy0 - r*0.08);
      ctx.quadraticCurveTo( r*0.20, cy0 - r*0.36,  r*0.34, cy0 - r*0.02);
      ctx.quadraticCurveTo( r*0.40, cy0 + r*0.04,  r*0.36, cy0 + r*0.10);
      ctx.lineTo(-r*0.40, cy0 + r*0.10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Wattle under the beak — small, completes the chicken read
      ctx.fillStyle = 'rgba(255,170,195,0.7)';
      ctx.beginPath();
      ctx.ellipse(0, r*0.32 + wob, r*0.07, r*0.11, 0, 0, Math.PI*2);
      ctx.fill();

    } else if (this.type === 'split') {
      // ── SPLIT CHICKEN — bright yellow, "×3" identity ─────────────
      drawTail('#e8b030', '#a07018');
      // Bright yellow body
      ctx.fillStyle = '#f5c842';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c89a20'; ctx.lineWidth = 1.5; ctx.stroke();
      // Three feather tufts on top — visual cue for "triple"
      ctx.fillStyle = '#f5c842';
      for (const [fx, fy, fr2] of [[-r*.38,-r*.82,r*.2],[0,-r*.95,r*.22],[r*.38,-r*.82,r*.2]]) {
        ctx.beginPath(); ctx.arc(fx, fy, fr2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#c89a20'; ctx.lineWidth = 1; ctx.stroke();
      }
      // Wing nubs
      ctx.fillStyle = '#e8b030';
      ctx.beginPath(); ctx.ellipse(-r*.75, r*.1, r*.2, r*.32, -0.4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.75, r*.1, r*.2, r*.32, 0.4, 0, Math.PI*2); ctx.fill();
      // Eyes — wide and excited
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r*.28, -r*.1, r*.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.28, -r*.1, r*.22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r*.24, -r*.12, r*.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.24, -r*.12, r*.1, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r*.19, -r*.18, r*.04, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.29, -r*.18, r*.04, 0, Math.PI*2); ctx.fill();
      // Beak
      ctx.fillStyle = '#ff9900';
      ctx.beginPath(); ctx.moveTo(-r*.14, r*.18); ctx.lineTo(r*.14, r*.18); ctx.lineTo(0, r*.38); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#cc6600'; ctx.lineWidth = 1; ctx.stroke();
      // Red comb
      ctx.fillStyle = '#ff3333';
      ctx.beginPath(); ctx.ellipse(-r*.05, -r*1.0, r*.12, r*.2, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.2, -r*.95, r*.1, r*.17, 0.2, 0, Math.PI*2); ctx.fill();
      // "×3" on chest — clear power indicator
      ctx.font = `bold ${Math.round(r*0.38)}px "Courier New"`;
      ctx.fillStyle = '#cc7700';
      ctx.textAlign = 'center';
      ctx.fillText('×3', 0, r*.22);
      ctx.textAlign = 'left';
      // After splitting — three fan lines radiating forward
      if (this.abilityUsed) {
        const spread = 0.32;
        const angle = Math.atan2(this.vy, this.vx);
        ctx.save();
        for (const da of [-spread, 0, spread]) {
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = '#ffe94a';
          ctx.lineWidth = 2;
          ctx.setLineDash([4,4]);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle + da - this.rotation) * r * 2.5,
                     Math.sin(angle + da - this.rotation) * r * 2.5);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
      }
      // Cheap plastic mask — yellow star/burst shape (power mask)
      if (!this.maskDetached) {
        ctx.save();
        ctx.translate(r*.04 + this.maskAngVel*r*0.1, -r*.35 + this.maskOffY*0.5);
        ctx.rotate(-0.06 + this.maskAngle);
        // Star-burst cheap plastic mask in orange
        ctx.fillStyle = '#ff9900'; ctx.strokeStyle = '#cc5500'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 - Math.PI/2;
          const rr = i % 2 === 0 ? r*.62 : r*.38;
          if (i === 0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
          else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Eye holes
        ctx.fillStyle = '#f5c842';
        ctx.beginPath(); ctx.ellipse(-r*.22, -r*.05, r*.16, r*.12, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(r*.22, -r*.05, r*.16, r*.12, 0, 0, Math.PI*2); ctx.fill();
        // Elastic
        ctx.strokeStyle = '#886600'; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
        ctx.beginPath(); ctx.moveTo(-r*.62, 0); ctx.lineTo(-r*.95, r*.1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r*.62, 0); ctx.lineTo(r*.95, r*.1); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

    } else if (this.type === 'speed') {
      // ── SPEED CHICKEN ─────────────────────────────────────────
      drawTail('#8a1010', '#601010', 1.3);
      ctx.fillStyle = '#e03030';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#a01818'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#c82020';
      ctx.beginPath(); ctx.ellipse(r*.2,-r*.9,r*.18,r*.3,0.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.45,-r*.8,r*.14,r*.25,0.7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.65,-r*.65,r*.12,r*.2,0.9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#b81818';
      ctx.beginPath(); ctx.ellipse(-r*.7,r*.05,r*.18,r*.3,0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.7,r*.15,r*.18,r*.28,-0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r*.28,-r*.08,r*.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.28,-r*.08,r*.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r*.22,-r*.1,r*.09,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.3,-r*.1,r*.09,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r*.17,-r*.16,r*.035,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.35,-r*.16,r*.035,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff9900';
      ctx.beginPath(); ctx.moveTo(-r*.12,r*.15); ctx.lineTo(r*.18,r*.1); ctx.lineTo(r*.05,r*.32); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#cc6600'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#ff1111';
      ctx.beginPath(); ctx.ellipse(r*.3,-r*.92,r*.1,r*.2,0.6,0,Math.PI*2); ctx.fill();

class Block {
  constructor(cfg, groundY) {
    this.mat = cfg.mat;
    this.wx = cfg.x;
    this.wy = groundY + cfg.y - cfg.h;
    this.w = cfg.w; this.h = cfg.h;
    this.hp = { log:2, plank:1, rock:3 }[this.mat];
    this.maxHP = this.hp;
    this.alive = true;
    this.vx = 0; this.vy = 0;
    this.rot = 0; this.rotV = 0;
    this.shakeTick = 0;
    this.onGround = false;
  }
  get sx() { return this.wx - G.camera.x; }
  get bottom() { return this.wy + this.h; }
  get right()  { return this.wx + this.w; }
  hit(dmg) {
    this.hp -= dmg;
    this.shakeTick = 6;
    spawnParticles(this.wx + this.w/2, this.wy + this.h/2, PAL.mat[this.mat].fill, 5, 2);
    if (this.hp <= 0) {
      this.alive = false;
      G.score += { log:100, plank:80, rock:150 }[this.mat];
      spawnParticles(this.wx + this.w/2, this.wy + this.h/2, PAL.mat[this.mat].fill, 12, 4);
    }
  }
  update() {
    if (!this.alive) return;
    if (this.shakeTick > 0) this.shakeTick--;
    this.vy += GRAVITY * 0.55;
    this.wx += this.vx;
    this.wy += this.vy;
    this.rot += this.rotV;
    this.rotV *= 0.92;
    this.vx *= 0.88;
    this.onGround = false;
    if (this.bottom >= G.ground) {
      this.wy = G.ground - this.h;
      if (Math.abs(this.vy) > 1) spawnParticles(this.wx + this.w/2, G.ground, PAL.mat[this.mat].fill, 3, 1);
      this.vy *= -0.18;
      this.vx *= 0.6;
      this.rotV *= 0.4;
      if (Math.abs(this.vy) < 0.5) this.vy = 0;
      this.onGround = true;
    }
    if (this.onGround && Math.abs(this.vy) < 0.5) {
      this.rot *= 0.85;
      if (Math.abs(this.rot) < 0.01) this.rot = 0;
    }
    if (this.wy > G.ground + 200) this.alive = false;
  }
  draw() {
    if (!this.alive) return;
    ctx.save();
    const cx = this.sx + this.w/2 + (this.shakeTick > 0 ? (Math.random()-0.5)*3 : 0);
    const cy = this.wy + this.h/2;
    ctx.translate(cx, cy);
    ctx.rotate(this.rot);
    const pal = PAL.mat[this.mat];
    const ratio = this.hp / this.maxHP;
    ctx.fillStyle = ratio < 0.5 ? shadeColor(pal.fill, -30) : pal.fill;
    ctx.strokeStyle = pal.stroke;
    ctx.lineWidth = 2;
    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
    ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
    if (ratio < 0.7) {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-this.w*0.2, -this.h*0.3);
      ctx.lineTo(this.w*0.1, this.h*0.2);
      ctx.lineTo(-this.w*0.05, this.h*0.4);
      ctx.stroke();
    }
    ctx.restore();
  }
}

class Jaguar {
  constructor(cfg, groundY) {
    this.jtype = cfg.jtype; // grunt | helmet | shaman | king
    this.wx = cfg.x;
    this.wy = groundY + cfg.y;
    this.r = { grunt:16, helmet:18, shaman:18, king:36 }[this.jtype];
    this.hp = { grunt:1, helmet:2, shaman:2, king:8 }[this.jtype];
    this.maxHP = this.hp;
    this.alive = true;
    this.vx = 0; this.vy = 0;
    this.falling = false;
    this.shakeTick = 0;
    this.rebuildCooldown = 0;
    this.deadTimer = 0;
    this.eyeX = 0;
    this.phase = 1;
    this.maskAngle = 0;
    this.maskOffX = 0;
    this.maskOffY = 0;
    this.maskPopped = false;
    this.rot = 0;
    this.rotV = 0;
  }
  get sx() { return this.wx - G.camera.x; }
  hit(dmg) {
    this.hp -= dmg;
    this.shakeTick = 8;
    // Mask gets knocked askew on damage
    const ratio = this.hp / this.maxHP;
    if (ratio <= 0.5 && ratio > 0) {
      // Half health — mask hanging off
      this.maskAngle = (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.5);
      this.maskOffX = (Math.random() - 0.5) * this.r * 0.6;
      this.maskOffY = this.r * 0.2 + Math.random() * this.r * 0.3;
    } else if (ratio > 0.5) {
      // Minor tilt
      this.maskAngle = (Math.random() - 0.5) * 0.25;
      this.maskOffX = (Math.random() - 0.5) * this.r * 0.2;
      this.maskOffY = Math.random() * this.r * 0.1;
    }
    if (this.jtype === 'king') {
      G.score += 500;
      spawnParticles(this.sx, this.wy, '#ffcc00', 10, 5);
    }
    if (this.hp <= 0) {
      this.alive = false;
      this.deadTimer = 60;
      G.score += { grunt:200, helmet:350, shaman:450, king:2000 }[this.jtype];
      spawnParticles(this.sx, this.wy, '#ffcc44', 15, 6);
      showMsg(DEFEAT_LINES[this.jtype][Math.floor(Math.random()*DEFEAT_LINES[this.jtype].length)]);
    }
  }
  update() {
    if (this.shakeTick > 0) this.shakeTick--;
    if (!this.alive) { this.deadTimer--; return; }

    // Always apply gravity
    this.vy += GRAVITY * 0.5;
    this.wx += this.vx;
    this.wy += this.vy;
    this.rot = (this.rot || 0) + (this.rotV || 0);
    this.rotV = (this.rotV || 0) * 0.88;
    this.vx *= 0.85;

    // Ground collision
    if (this.wy + this.r >= G.ground) {
      const impactSpeed = Math.abs(this.vy);
      this.wy = G.ground - this.r;
      if (impactSpeed > 1.5) spawnParticles(this.wx, G.ground, '#c8843a', 3, 1);
      this.vy *= -0.25;
      this.vx *= 0.6;
      this.rotV *= 0.3;
      if (Math.abs(this.vy) < 0.5) this.vy = 0;

      // Hard landing pops the mask off
      if (impactSpeed > 4 && !this.maskPopped && this.alive) {
        this.maskPopped = true;
        this.maskAngle = 0; this.maskOffX = 0; this.maskOffY = 0;
        // Spawn a tumbling mask object
        G.fallenMasks.push({
          wx: this.wx + (Math.random()-0.5)*this.r,
          wy: this.wy - this.r,
          vx: this.vx * 0.5 + (Math.random()-0.5) * 5,
          vy: -(3 + Math.random() * 4),
          rot: this.rot,
          rotV: (Math.random()-0.5) * 0.4,
          r: this.r,
          jtype: this.jtype,
          life: 1,
        });
        showMsg("...the mask. it came off. we don't talk about this.");
      }
    }

    // Block collision — jaguars bounce off blocks
    for (const b of G.blocks) {
      if (!b.alive) continue;
      const overlapX = this.wx + this.r > b.wx && this.wx - this.r < b.wx + b.w;
      const overlapY = this.wy + this.r > b.wy && this.wy - this.r < b.wy + b.h;
      if (overlapX && overlapY) {
        // Push jaguar out of block
        const fromTop = (b.wy + b.h) - (this.wy - this.r);
        const fromBottom = (this.wy + this.r) - b.wy;
        const fromLeft = (b.wx + b.w) - (this.wx - this.r);
        const fromRight = (this.wx + this.r) - b.wx;
        const minPen = Math.min(fromTop, fromBottom, fromLeft, fromRight);
        if (minPen === fromBottom) {
          this.wy = b.wy - this.r;
          this.vy *= -0.2; this.vx *= 0.5;
        } else if (minPen === fromTop) {
          this.wy = b.wy + b.h + this.r;
          this.vy *= -0.2;
        } else if (minPen === fromLeft) {
          this.wx = b.wx + b.w + this.r;
          this.vx = Math.abs(this.vx) * 0.4;
          this.rotV += 0.1;
        } else {
          this.wx = b.wx - this.r;
          this.vx = -Math.abs(this.vx) * 0.4;
          this.rotV -= 0.1;
        }
      }
    }

    // Despawn if fallen off world
    if (this.wy > G.ground + 300) { this.alive = false; this.deadTimer = 0; }

    if (this.jtype === 'shaman') this.rebuildCooldown--;
  }
  draw() {
    if (!this.alive && this.deadTimer <= 0) return;
    const ox = this.shakeTick > 0 ? (Math.random()-0.5)*5 : 0;
    const x = this.sx + ox;
    const y = this.wy;
    const r = this.r;
    const dead = !this.alive;
    const alpha = dead ? Math.max(0, this.deadTimer / 60) : 1;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(this.rot || 0);
    ctx.translate(-x, -y);

    // ── JAGUAR BODY ──────────────────────────────────────────
    if (this.jtype === 'king') {
      drawKing(x, y, r, dead, this.maskAngle, this.maskOffX, this.maskOffY, this.maskPopped);
    } else {
      drawJaguar(x, y, r, this.jtype, dead, this.maskAngle, this.maskOffX, this.maskOffY, this.maskPopped);
    }
    // HP bar for helmet/shaman
    if (!dead && (this.jtype === 'helmet' || this.jtype === 'shaman') && this.hp < this.maxHP) {
      ctx.fillStyle = '#333';
      ctx.fillRect(x - r, y - r - 10, r*2, 5);
      ctx.fillStyle = '#4cff6a';
      ctx.fillRect(x - r, y - r - 10, r*2 * (this.hp/this.maxHP), 5);
    }
    ctx.restore();
  }
}

function drawJaguar(x, y, r, jtype, dead, maskAngle=0, maskOffX=0, maskOffY=0, maskPopped=false) {
  // Jaguar body — tawny with spots
  ctx.fillStyle = '#c8843a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  // Spots
  ctx.fillStyle = '#7a4a18';
  for (const [dx, dy] of [[-r*0.4, -r*0.2],[r*0.35, -r*0.3],[0, r*0.3],[-r*0.2, r*0.1]]) {
    ctx.beginPath(); ctx.arc(x+dx, y+dy, r*0.15, 0, Math.PI*2); ctx.fill();
  }

  // ── PIG MASK (obviously fake, possibly hanging off or popped off) ───────
  if (!maskPopped) {
    const maskCX = x + maskOffX;
    const maskCY = y - r*0.1 + maskOffY;
    ctx.save();
    ctx.translate(maskCX, maskCY);
    ctx.rotate(maskAngle);
    ctx.fillStyle = '#f08080';
    ctx.strokeStyle = '#c05050';
    ctx.lineWidth = 1.5;
    ctx.fillRect(-r*0.75, -r*0.6, r*1.5, r*0.9);
    ctx.strokeRect(-r*0.75, -r*0.6, r*1.5, r*0.9);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-r*0.75, 0); ctx.lineTo(-r*1.2, -r*0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.75, 0); ctx.lineTo(r*1.2, -r*0.1); ctx.stroke();
    ctx.fillStyle = '#d06060';
    ctx.beginPath(); ctx.arc(-r*0.22, r*0.1, r*0.14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.22, r*0.1, r*0.14, 0, Math.PI*2); ctx.fill();
    if (Math.abs(maskAngle) > 0.3) {
      ctx.font = `${Math.round(r*0.22)}px monospace`;
      ctx.fillStyle = '#c05050';
      ctx.textAlign = 'center';
      ctx.fillText('PIG', 0, r*0.05);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  // Eyes above mask (always on body, not mask)
  if (!dead) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.55, r*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.55, r*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x - r*0.28, y - r*0.55, r*0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.28, y - r*0.55, r*0.1, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    for (const [ex, ey] of [[x - r*0.3, y - r*0.55],[x + r*0.3, y - r*0.55]]) {
      ctx.beginPath(); ctx.moveTo(ex-4,ey-4); ctx.lineTo(ex+4,ey+4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex+4,ey-4); ctx.lineTo(ex-4,ey+4); ctx.stroke();
    }
  }
  // Helmet
  if (jtype === 'helmet') {
    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.ellipse(x, y - r*0.7, r*0.9, r*0.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#5C3A1E'; ctx.lineWidth = 2;
    ctx.stroke();
  }
  // Shaman headdress
  if (jtype === 'shaman') {
    ctx.fillStyle = '#4a2a8a';
    ctx.beginPath();
    ctx.moveTo(x - r*0.5, y - r*0.8);
    ctx.lineTo(x, y - r*1.8);
    ctx.lineTo(x + r*0.5, y - r*0.8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(x, y - r*1.8, r*0.15, 0, Math.PI*2); ctx.fill();
  }
}

function drawKing(x, y, r, dead, maskAngle=0, maskOffX=0, maskOffY=0, maskPopped=false) {
  // King body — big jaguar
  ctx.fillStyle = '#c8843a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7a4a18'; ctx.lineWidth = 2; ctx.stroke();
  // Big spots
  ctx.fillStyle = '#7a4a18';
  for (const [dx, dy] of [[-r*0.45, -r*0.2],[r*0.4, -r*0.25],[r*0.1, r*0.4],[-r*0.25, r*0.3],[r*0.5,r*0.1],[-r*0.5,r*0.05]]) {
    ctx.beginPath(); ctx.arc(x+dx, y+dy, r*0.13, 0, Math.PI*2); ctx.fill();
  }

  // ENORMOUS PIG MASK — takes up most of face, tilts on damage
  if (!maskPopped) {
    ctx.save();
    ctx.translate(x + maskOffX, y + maskOffY);
    ctx.rotate(maskAngle);
    ctx.fillStyle = '#ff9090';
    ctx.strokeStyle = '#c05050'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-r*0.9, -r*0.8, r*1.8, r*1.1, 8);
    ctx.fill(); ctx.stroke();
    for (const nx of [-r*0.45, 0, r*0.45]) {
      ctx.fillStyle = '#c06060';
      ctx.beginPath(); ctx.arc(nx, r*0.1, r*0.15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff8';
      for (let a = 0; a < Math.PI*2; a += Math.PI/3) {
        ctx.beginPath(); ctx.arc(nx + Math.cos(a)*r*0.22, r*0.1 + Math.sin(a)*r*0.22, 2, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-r*0.9, -r*0.3); ctx.lineTo(-r*1.5, -r*0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.9, -r*0.1); ctx.lineTo(-r*1.5, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.9, -r*0.3); ctx.lineTo(r*1.5, -r*0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.9, -r*0.1); ctx.lineTo(r*1.5, 0); ctx.stroke();
    ctx.fillStyle = '#ffd700'; ctx.strokeStyle = '#b8960c'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*0.7, -r*0.8); ctx.lineTo(-r*0.7, -r*1.25);
    ctx.lineTo(-r*0.35, -r*1.0); ctx.lineTo(0, -r*1.4);
    ctx.lineTo(r*0.35, -r*1.0); ctx.lineTo(r*0.7, -r*1.25);
    ctx.lineTo(r*0.7, -r*0.8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(0, -r*1.35, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3333ff';
    ctx.beginPath(); ctx.arc(-r*0.5, -r*1.15, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.5, -r*1.15, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Eyes on body (above where mask sits)
  if (!dead) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - r*0.35, y - r*0.9, r*0.22, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.35, y - r*0.9, r*0.22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(x - r*0.32, y - r*0.9, r*0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r*0.32, y - r*0.9, r*0.12, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    for (const [ex, ey] of [[x-r*0.35, y-r*0.9],[x+r*0.35, y-r*0.9]]) {
      ctx.beginPath(); ctx.moveTo(ex-6,ey-6); ctx.lineTo(ex+6,ey+6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex+6,ey-6); ctx.lineTo(ex-6,ey+6); ctx.stroke();
    }
  }
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (Math.random() * 0.7 + 0.3) * speed;
    G.particles.push({
      x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - speed*0.3,
      life: 1, decay: 0.04 + Math.random()*0.04,
      color, r: 2 + Math.random()*3
    });
  }
}

function updateFallenMasks() {
  G.fallenMasks = G.fallenMasks.filter(m => m.life > 0);
  for (const m of G.fallenMasks) {
    m.vy += GRAVITY * 0.5;
    m.wx += m.vx;
    m.wy += m.vy;
    m.rot += m.rotV;
    m.vx *= 0.9;
    if (m.wy + m.r > G.ground) {
      m.wy = G.ground - m.r * 0.3;
      m.vy *= -0.2;
      m.rotV *= 0.4;
      m.vx *= 0.5;
    }
    m.life -= 0.008; // slow fade
  }
}

function drawFallenMasks() {
  for (const m of G.fallenMasks) {
    const x = m.wx - G.camera.x;
    const y = m.wy;
    const r = m.r;
    ctx.save();
    ctx.globalAlpha = Math.max(0, m.life);
    ctx.translate(x, y);
    ctx.rotate(m.rot);

    if (m.maskType === 'split') {
      // Fallen orange starburst mask
      ctx.fillStyle = '#ff9900'; ctx.strokeStyle = '#cc5500'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 - Math.PI/2;
        const rr = i % 2 === 0 ? r*.62 : r*.38;
        if (i === 0) ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
        else ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#886600'; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(-r*.62, 0); ctx.lineTo(-r*.9, r*.3); ctx.stroke();
      ctx.setLineDash([]);
    } else if (m.maskType === 'speed') {
      // Fallen red hero mask
      ctx.fillStyle = '#dd1111'; ctx.strokeStyle = '#880000'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r*.7, r*.08); ctx.lineTo(-r*.7, -r*.18);
      ctx.lineTo(-r*.48, -r*.32); ctx.lineTo(0, -r*.26);
      ctx.lineTo(r*.48, -r*.32); ctx.lineTo(r*.7, -r*.18);
      ctx.lineTo(r*.7, r*.08); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.ellipse(-r*.12, -r*.2, r*.22, r*.07, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r*.7, -r*.05); ctx.lineTo(-r*1.05, r*.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*.7, -r*.05); ctx.lineTo(r*1.05, r*.25); ctx.stroke();
    } else if (m.maskType === 'bomb') {
      // Fallen black villain mask
      ctx.fillStyle = '#111'; ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r*.68, r*.12); ctx.lineTo(-r*.68, -r*.22);
      ctx.lineTo(-r*.5, -r*.34); ctx.lineTo(0, -r*.28);
      ctx.lineTo(r*.5, -r*.34); ctx.lineTo(r*.68, -r*.22);
      ctx.lineTo(r*.68, r*.12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.font = `bold ${Math.round(r*0.28)}px sans-serif`;
      ctx.fillStyle = '#ff8800'; ctx.textAlign = 'center';
      ctx.fillText('💀', 0, r*.06); ctx.textAlign = 'left';
      ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r*.68, -r*.08); ctx.lineTo(-r*1.05, r*.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*.68, -r*.08); ctx.lineTo(r*1.05, r*.25); ctx.stroke();
    } else if (m.jtype === 'king') {
      // King's enormous mask (jaguar fall)
      ctx.fillStyle = '#ff9090'; ctx.strokeStyle = '#c05050'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-r*0.9, -r*0.5, r*1.8, r*1.1, 6); ctx.fill(); ctx.stroke();
      for (const nx of [-r*0.45, 0, r*0.45]) {
        ctx.fillStyle = '#c06060';
        ctx.beginPath(); ctx.arc(nx, r*0.1, r*0.15, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#ffd700'; ctx.strokeStyle = '#b8960c'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-r*0.6, -r*0.5); ctx.lineTo(-r*0.6, -r*0.9);
      ctx.lineTo(-r*0.3, -r*0.7); ctx.lineTo(0, -r*1.1);
      ctx.lineTo(r*0.3, -r*0.7); ctx.lineTo(r*0.6, -r*0.9);
      ctx.lineTo(r*0.6, -r*0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-r*.9, r*.1); ctx.lineTo(-r*1.3, r*.35); ctx.stroke();
    } else {
      // Regular jaguar pig mask
      ctx.fillStyle = '#f08080'; ctx.strokeStyle = '#c05050'; ctx.lineWidth = 1.5;
      ctx.fillRect(-r*0.75, -r*0.45, r*1.5, r*0.9);
      ctx.strokeRect(-r*0.75, -r*0.45, r*1.5, r*0.9);
      ctx.fillStyle = '#d06060';
      ctx.beginPath(); ctx.arc(-r*0.22, r*0.05, r*0.14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.22, r*0.05, r*0.14, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-r*0.75, 0); ctx.lineTo(-r*1.1, r*0.3); ctx.stroke();
    }
    ctx.restore();
  }
}

function updateParticles() {
  G.particles = G.particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= p.decay;
    return p.life > 0;
  });
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ─── EXPLOSION ────────────────────────────────────────────────────────────────
function ghostReform(bird) {
  if (!bird.phasing) return;
  bird.phasing = false;
  bird.wasInsideBlock = false;
  // Snap back into a chicken and detonate on the far side.
  spawnParticles(bird.x, bird.y, '#bfe9ff', 26, 7);
  spawnParticles(bird.x, bird.y, '#f5c842', 20, 5);
  explodeBombs(bird.x, bird.y, 118);
  bird.exploding = true;
  bird.explodeTimer = 6;
  showMsg('🐔 BAWK!');
}

function explodeBombs(bx, by, radius) {
  for (const b of G.blocks) {
    if (!b.alive) continue;
    const cx = b.wx - G.camera.x + b.w/2, cy = b.wy + b.h/2;
    if (dist(bx, by, cx, cy) < radius) {
      b.hit(3);
      const angle = Math.atan2(cy - by, cx - bx);
      b.vx += Math.cos(angle) * 5;
      b.vy += Math.sin(angle) * 5 - 3;
      b.rotV += (Math.random()-0.5) * 0.3;
    }
  }
  for (const j of G.jaguars) {
    if (!j.alive) continue;
    if (dist(bx, by, j.sx, j.wy) < radius + j.r) {
      j.hit(2);
      const angle = Math.atan2(j.wy - by, j.wx - bx);
      j.vx += Math.cos(angle) * 6;
      j.vy += Math.sin(angle) * 6 - 4;
      j.rotV = (j.rotV || 0) + (Math.random()-0.5) * 0.3;
    }
  }
}

// ─── COLLISION ────────────────────────────────────────────────────────────────
function checkCollisions(bird) {
  // Bird vs blocks
  let ghostInside = false;
  for (const b of G.blocks) {
    if (!b.alive) continue;
    const bx = b.wx;  // camera.x is always 0
    const hit = bird.x + bird.r > bx && bird.x - bird.r < bx + b.w &&
                bird.y + bird.r > b.wy && bird.y - bird.r < b.wy + b.h;
    // Ghost passes clean through — no damage, no bounce, no momentum transfer.
    if (hit && bird.phasing) {
      ghostInside = true;
      if (G.ticks % 3 === 0) spawnParticles(bird.x, bird.y, '#bfe9ff', 2, 1.5);
      continue;
    }
    if (hit) {
      const spd = Math.sqrt(bird.vx**2 + bird.vy**2);
      const dmg = Math.max(1, Math.floor(spd / 4));
      b.hit(dmg);
      b.vx += bird.vx * 0.4;
      b.vy += bird.vy * 0.3;
      b.rotV += (Math.random()-0.5) * 0.15;
      bird.whackMask(spd);
      // Tyler sits on first contact
      if (bird.type === 'tyler' && !bird.tylerSitting) {
        bird.activate();
        return true;
      }
      if (bird.type === 'bomb' && bird.armed && !bird.exploding) {
        bird.exploding = true; bird.explodeTimer = 8;
      } else if (bird.type !== 'bomb') {
        bird.vx *= 0.4; bird.vy *= -0.3;
      }
      if (bird.swinging) bird.swinging = false;
      return true;
    }
  }

  // Ghost reassembly: it went in one side, it comes out the other, and THEN
  // it becomes a chicken again — loudly. Reforming only happens once the bird
  // has actually been inside something, so a ghost fired at open sky just
  // sails on and lands harmlessly.
  if (bird.phasing) {
    bird.phaseTicks++;
    if (ghostInside) {
      bird.wasInsideBlock = true;
    } else if (bird.wasInsideBlock) {
      bird.reformTimer = (bird.reformTimer || 0) + 1;
      if (bird.reformTimer > 2) ghostReform(bird);
    }
    // Failsafe: never phase forever.
    if (bird.phaseTicks > 240) ghostReform(bird);
  }

  for (const j of G.jaguars) {
    if (!j.alive) continue;
    const jx = j.wx;
    const d = dist(bird.x, bird.y, jx, j.wy);
    if (d < bird.r + j.r && bird.phasing) continue;   // incorporeal
    if (d < bird.r + j.r) {
      const spd = Math.sqrt(bird.vx**2 + bird.vy**2);
      j.hit(Math.max(1, Math.floor(spd / 5)));
      j.vx += bird.vx * 0.6;
      j.vy += bird.vy * 0.5 - 2;
      j.rotV = (Math.random()-0.5) * 0.25;
      bird.whackMask(spd);
      // Tyler sits on contact
      if (bird.type === 'tyler' && !bird.tylerSitting) {
        bird.activate();
        return false;
      }
      if (bird.type === 'bomb' && bird.armed && !bird.exploding) {
        bird.exploding = true; bird.explodeTimer = 8;
      } else if (bird.type !== 'bomb') {
        bird.vx *= 0.3; bird.vy *= -0.4;
      }
      if (bird.swinging) bird.swinging = false;
      return false;
    }
  }
  return false;
}

// ─── LEVEL SETUP ─────────────────────────────────────────────────────────────
function loadLevel(idx) {
  // Rebuild layout with current viewport dimensions
  const freshLevels = makeLevels();
  const lvl = freshLevels[idx];
  G.blocks = [];
  G.jaguars = [];
  G.eggs = [];
  G.particles = [];
  G.camera.x = 0;
  G.score = 0;
  G.ticks = 0;
  G.vineGrabActive = false;
  G.phase = 1;
  G.bossHP = lvl.bossHP || 0;
  G.bossMaxHP = lvl.bossHP || 0;
  G.currentBg = lvl.bg;
  G.isBoss = !!lvl.isBoss;
  G.resultTimer = 9999;
  G.endTimer = 0;
  G.justLaunched = false;
  G.fallenMasks = [];
  G.splitChildren = [];
  G.nextDropTick = null;
  G.dropWarningX = null;
  G.dropWarningMat = null;
  if (!G.tylerSeeds) G.tylerSeeds = {};

  // Set sling position BEFORE spawning birds
  G.sling.x = Math.round(G.W * 0.13);
  G.sling.y = G.ground - 40;
  G.sling.pullX = G.sling.x;
  G.sling.pullY = G.sling.y;
  G.sling.dragging = false;
  G.sling.launched = false;

  const groundY = G.ground;

  for (const cfg of lvl.layout) {
    if (cfg.type === 'block') G.blocks.push(new Block(cfg, groundY));
    else if (cfg.type === 'jaguar') G.jaguars.push(new Jaguar(cfg, groundY - (cfg.h||0)));
    else if (cfg.type === 'egg') G.eggs.push({wx:cfg.x, wy:groundY - 15, r:10, collected:false});
  }

  G.birdQueue = lvl.birds.map(t => t);

  // Inject Tyler once per world — randomly into one level of each world
  // World boundaries: W1=0-2, W2=3-5, W3=6-8, W4=9-10, Boss=11
  const worldBoundaries = [[0,2],[3,5],[6,8],[9,10],[11,11]];
  for (const [wStart, wEnd] of worldBoundaries) {
    if (idx >= wStart && idx <= wEnd) {
      // Pick a random level in this world to be Tyler's level
      // Use a seeded random so it's consistent per session but varies
      const worldSeed = wStart + (G.tylerSeeds ? G.tylerSeeds[wStart] : Math.floor(Math.random()*(wEnd-wStart+1)));
      if (!G.tylerSeeds) G.tylerSeeds = {};
      if (G.tylerSeeds[wStart] === undefined) {
        G.tylerSeeds[wStart] = Math.floor(Math.random()*(wEnd-wStart+1));
      }
      const tylerLevel = wStart + G.tylerSeeds[wStart];
      if (idx === tylerLevel && G.birdQueue.length > 0) {
        // Insert Tyler at a random position in the queue (not first)
        const insertAt = 1 + Math.floor(Math.random() * (G.birdQueue.length - 1));
        G.birdQueue.splice(insertAt, 0, 'tyler');
      }
      break;
    }
  }

  G.levelBirdList = [...G.birdQueue];
  G.totalBirdsInLevel = G.birdQueue.length;
  setupNextBird();
}

function setupNextBird() {
  if (G.birdQueue.length === 0) { G.activeBird = null; return; }
  const type = G.birdQueue.shift();
  const sy = G.ground - 40; // always compute fresh
  G.sling.y = sy;
  G.activeBird = new Bird(type, G.sling.x, sy);
  G.activeBird.launched = false;
  G.sling.dragging = false;
  G.sling.pullX = G.sling.x;
  G.sling.pullY = sy;
}

// ─── SLINGSHOT ────────────────────────────────────────────────────────────────
function drawSling() {
  const sx = G.sling.x, sy = G.sling.y;
  // Posts
  ctx.strokeStyle = '#8B5E3C'; ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx - 18, sy + 60); ctx.lineTo(sx - 12, sy - 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx + 18, sy + 60); ctx.lineTo(sx + 12, sy - 10); ctx.stroke();

  if (G.activeBird && !G.activeBird.launched) {
    const px = G.sling.pullX, py = G.sling.pullY;
    ctx.strokeStyle = '#c8a85a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx - 12, sy - 10); ctx.lineTo(px, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 12, sy - 10); ctx.lineTo(px, py); ctx.stroke();
    // Trajectory dots
    drawTrajectoryDots(px, py);
    // Power tooltip — shows above bird on sling
    const type = G.activeBird.type;
    const tipText = type === 'split' ? '🐔 TAP IN FLIGHT TO TRIPLE SPLIT' :
                    type === 'speed' ? '⚡ TAP IN FLIGHT FOR BOOST' :
                    type === 'bomb'  ? '💥 TAP IN FLIGHT TO EXPLODE' :
                    type === 'ghost' ? '👻 TAP TO GO GHOST — PASS THROUGH' :
                    type === 'tyler' ? '🐾 TYLER SITS ON FIRST HIT' : '';
    if (tipText) {
      const pulse = 0.75 + Math.sin(G.ticks * 0.1) * 0.25;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.font = 'bold 11px "Courier New"';
      ctx.textAlign = 'center';
      // Background pill
      const tw = ctx.measureText(tipText).width + 16;
      const tx = sx, ty2 = sy - 80;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath(); ctx.roundRect(tx - tw/2, ty2 - 16, tw, 24, 6); ctx.fill();
      ctx.fillStyle = type === 'split' ? '#f5c842' :
                      type === 'speed' ? '#ffee00' :
                      type === 'bomb'  ? '#ff8800' : '#ffffff';
      ctx.fillText(tipText, tx, ty2);
      ctx.textAlign = 'left';
      ctx.restore();
    }
  } else {
    ctx.strokeStyle = '#c8a85a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx - 12, sy - 10); ctx.lineTo(sx, sy - 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 12, sy - 10); ctx.lineTo(sx, sy - 5); ctx.stroke();
  }
}

function drawTrajectoryDots(px, py) {
  if (!G.activeBird) return;
  const dx = G.sling.x - px, dy = G.sling.y - py;
  const mag = Math.sqrt(dx*dx + dy*dy);
  if (mag < 5) return;
  const factor = Math.min(mag / MAX_PULL, 1) * SLING_POWER * MAX_PULL;
  let vx = (dx / mag) * factor * 0.85;
  let vy = (dy / mag) * factor * 0.85;
  let tx = px, ty = py;
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 35; i++) {
    vy += GRAVITY;
    tx += vx; ty += vy;
    if (ty > G.ground) break;
    ctx.fillStyle = G.activeBird.color;
    ctx.beginPath();
    ctx.arc(tx, ty, 3 - i*0.06, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha *= 0.94;
  }
  ctx.restore();
}

// ─── BACKGROUND RENDERER ──────────────────────────────────────────────────────
function drawBG(bg) {
  const W = G.W, H = G.H;
  const sky = PAL.sky[bg];
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, G.ground);
  grad.addColorStop(0, sky);
  grad.addColorStop(1, shadeColor(sky, 20));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Parallax jungle trees / elements
  if (bg === 'jungle') drawJungleBG();
  if (bg === 'reef') drawReefBG();
  if (bg === 'storm') drawStormBG();
  if (bg === 'volcano') drawVolcanoBG();

  // Ground
  const g1 = PAL.ground[bg], g2 = PAL.ground2[bg];
  ctx.fillStyle = g1;
  ctx.fillRect(0, G.ground, W, H - G.ground);
  ctx.fillStyle = g2;
  ctx.fillRect(0, G.ground + 20, W, H - G.ground - 20);
  // Ground line
  ctx.strokeStyle = shadeColor(g1, 30); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, G.ground); ctx.lineTo(W, G.ground); ctx.stroke();
}

function drawJungleBG() {
  const W = G.W, cx = G.camera.x;
  // Distant trees (parallax 0.3)
  for (let i = 0; i < 12; i++) {
    const tx = ((i * 120 + 40) - cx * 0.3) % (W + 100) - 50;
    const th = 80 + (i%3)*30;
    ctx.fillStyle = '#1a4a1a';
    ctx.fillRect(tx - 8, G.ground - th, 16, th);
    ctx.fillStyle = '#1e5a1e';
    ctx.beginPath(); ctx.arc(tx, G.ground - th, 30 + (i%3)*10, 0, Math.PI*2); ctx.fill();
  }
  // Mid trees (parallax 0.6)
  for (let i = 0; i < 8; i++) {
    const tx = ((i * 160 + 60) - cx * 0.6) % (W + 120) - 60;
    const th = 120 + (i%4)*20;
    ctx.fillStyle = '#2a6a2a';
    ctx.fillRect(tx - 12, G.ground - th, 24, th);
    ctx.fillStyle = '#2d7a2d';
    ctx.beginPath(); ctx.arc(tx, G.ground - th + 10, 40 + (i%3)*12, 0, Math.PI*2); ctx.fill();
  }
}

function drawReefBG() {
  const W = G.W, cx = G.camera.x;
  // Ocean waves in background
  for (let i = 0; i < 5; i++) {
    const wx = ((i * 200 - cx * 0.2 + G.ticks * 0.3) % (W + 200)) - 100;
    ctx.strokeStyle = '#2a6a8a44'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(wx, G.ground - 40);
    ctx.quadraticCurveTo(wx+50, G.ground - 60, wx+100, G.ground - 40);
    ctx.stroke();
  }
  // Palm silhouettes
  for (let i = 0; i < 6; i++) {
    const tx = ((i * 180 + 50) - cx * 0.5) % (W + 100) - 50;
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, G.ground); ctx.quadraticCurveTo(tx+20, G.ground-80, tx+10, G.ground-150); ctx.stroke();
    // Fronds
    for (let f = 0; f < 5; f++) {
      const fa = (f / 5) * Math.PI * 1.5 - Math.PI * 0.7;
      ctx.strokeStyle = '#2d7a2d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tx+10, G.ground-150);
      ctx.lineTo(tx+10+Math.cos(fa)*50, G.ground-150+Math.sin(fa)*30); ctx.stroke();
    }
  }
}

function drawStormBG() {
  const W = G.W, cx = G.camera.x;
  // Lightning flicker
  if (G.ticks % 120 < 3) {
    ctx.fillStyle = 'rgba(200,200,255,0.15)';
    ctx.fillRect(0, 0, W, G.ground);
    const lx = W * Math.random();
    ctx.strokeStyle = 'rgba(200,200,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx, 0);
    let ly = 0;
    while (ly < G.ground - 50) { ly += 30; ctx.lineTo(lx + (Math.random()-0.5)*40, ly); }
    ctx.stroke();
  }
  // Rain streaks
  for (let i = 0; i < 40; i++) {
    const rx = (i * 23 + G.ticks * 3) % W;
    const ry = (i * 37 + G.ticks * 5) % G.ground;
    ctx.strokeStyle = 'rgba(150,150,255,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 12); ctx.stroke();
  }
}

function drawVolcanoBG() {
  const W = G.W, cx = G.camera.x;
  // Volcano silhouette
  ctx.fillStyle = '#3a1a0a';
  ctx.beginPath(); ctx.moveTo(W/2 - cx*0.1, G.ground);
  ctx.lineTo(W/2 - 150 - cx*0.1, G.ground);
  ctx.lineTo(W/2 - cx*0.1, G.ground - 250);
  ctx.lineTo(W/2 + 150 - cx*0.1, G.ground);
  ctx.closePath(); ctx.fill();
  // Lava glow top
  const lavGrad = ctx.createRadialGradient(W/2-cx*0.1, G.ground-250, 5, W/2-cx*0.1, G.ground-250, 80);
  lavGrad.addColorStop(0, 'rgba(255,100,0,0.5)');
  lavGrad.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.fillStyle = lavGrad;
  ctx.beginPath(); ctx.arc(W/2-cx*0.1, G.ground-250, 80, 0, Math.PI*2); ctx.fill();
  // Lava drips
  for (let i = 0; i < 3; i++) {
    const progress = ((G.ticks * 0.5 + i * 40) % 100) / 100;
    const lx = W/2 - 15 + i*15 - cx*0.1;
    const ly = (G.ground - 250) + progress * 100;
    ctx.fillStyle = `rgba(255,${80 + i*20},0,0.7)`;
    ctx.beginPath(); ctx.ellipse(lx, ly, 4, 8, 0, 0, Math.PI*2); ctx.fill();
  }
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD() {
  // Top bar
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, G.W, 44);

  ctx.font = 'bold 13px "Courier New"';
  ctx.fillStyle = '#4cff6a';
  ctx.fillText(`SCORE: ${G.score.toLocaleString()}`, 12, 28);

  // Bird queue icons
  // levelBirdList = full list e.g. ['split','split','bomb']
  // activeBird = currently on sling or in flight
  // birdQueue = still waiting
  const total = G.levelBirdList ? G.levelBirdList.length : 0;
  // How many have been fully consumed (not active, not queued)
  const remaining = G.birdQueue.length + (G.activeBird ? 1 : 0);
  const used = total - remaining;

  for (let i = 0; i < total; i++) {
    const type = G.levelBirdList[i];
    const isUsed = i < used;
    const isActive = i === used; // the one currently on sling or flying
    const slotX = G.W/2 - total * 18 + i * 36;
    const slotY = 22;
    const scale = isActive ? 1.25 : 0.85;

    ctx.save();
    ctx.globalAlpha = isUsed ? 0.22 : 1;
    ctx.translate(slotX, slotY);
    ctx.scale(scale, scale);
    const fb = new Bird(type, 0, 0);
    fb.launched = true;
    fb.drawBody(0, 0);
    ctx.restore();
  }

  // Ability hint
  if (G.activeBird && !G.activeBird.launched) {
    const hints = { vine:'[CLICK MID-FLIGHT: VINE GRAB]', bomb:'[CLICK MID-FLIGHT: DETONATE]', speed:'[CLICK MID-FLIGHT: SPEED BOOST]', ghost:'[CLICK MID-FLIGHT: PHASE THROUGH]' };
    ctx.font = '11px "Courier New"';
    ctx.fillStyle = '#88ff88';
    ctx.fillText(hints[G.activeBird.type] || '', G.W - 300, 28);
  }

  // Boss HP bar
  if (G.isBoss && G.bossHP > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(G.W/2 - 120, G.H - 55, 240, 30);
    ctx.fillStyle = '#333';
    ctx.fillRect(G.W/2 - 110, G.H - 48, 220, 14);
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(G.W/2 - 110, G.H - 48, 220 * (G.bossHP / G.bossMaxHP), 14);
    ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 1;
    ctx.strokeRect(G.W/2 - 110, G.H - 48, 220, 14);
    ctx.font = 'bold 11px "Courier New"';
    ctx.fillStyle = '#ffcccc';
    ctx.textAlign = 'center';
    ctx.fillText(`👑 KING MUDSWORTH  HP: ${G.bossHP}/${G.bossMaxHP}`, G.W/2, G.H - 58);
    ctx.textAlign = 'left';
  }

  // Floating message
  if (G.msgTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(G.msgTimer / 30, 1);
    ctx.font = 'italic bold 16px "Courier New"';
    ctx.fillStyle = '#ffe94a';
    ctx.textAlign = 'center';
    ctx.fillText(`"${G.msg}"`, G.W/2, G.H/2 - 60);
    ctx.textAlign = 'left';
    ctx.restore();
    G.msgTimer--;
  }

  // Eggs collected
  const eggsCollected = G.eggs.filter(e => e.collected).length;
  const totalEggs = G.eggs.length;
  if (totalEggs > 0) {

  // Drop pressure warning bar
  const dropCfg = DROP_CONFIG[Math.min(G.level, DROP_CONFIG.length - 1)];
  if (dropCfg && G.ticks > dropCfg[0] - 120) {
    const barW = 80;
    const bx = G.W - barW - 10;
    const by = G.H - 18;
    if (G.nextDropTick && G.ticks >= dropCfg[0]) {
      const dropAge2 = G.ticks - dropCfg[0];
      const t2 = Math.min(dropAge2 / 3600, 1);
      const curInterval = Math.round(dropCfg[1] + (dropCfg[2] - dropCfg[1]) * t2);
      const timeToNext = G.nextDropTick - G.ticks;
      const pct = Math.max(0, timeToNext / curInterval);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx - 2, by - 2, barW + 4, 10);
      const barColor = pct < 0.25 ? '#ff2222' : pct < 0.6 ? '#ff8800' : '#ffcc00';
      ctx.fillStyle = barColor;
      ctx.fillRect(bx, by, barW * pct, 6);
      if (pct < 0.2 && Math.floor(G.ticks / 8) % 2 === 0) {
        ctx.font = 'bold 9px "Courier New"';
        ctx.fillStyle = '#ff2222';
        ctx.textAlign = 'right';
        ctx.fillText('⚠ INCOMING', G.W - 10, by - 4);
        ctx.textAlign = 'left';
      }
    } else if (G.ticks < dropCfg[0]) {
      const warmup = (G.ticks - (dropCfg[0] - 120)) / 120;
      ctx.font = '9px "Courier New"';
      ctx.fillStyle = `rgba(255,200,0,${warmup * 0.7})`;
      ctx.textAlign = 'right';
      ctx.fillText('things are falling soon...', G.W - 10, by);
      ctx.textAlign = 'left';
    }
  }
    ctx.font = '13px "Courier New"';
    ctx.fillStyle = '#ffe94a';
    ctx.fillText(`🥚 ${eggsCollected}/${totalEggs}`, 12, G.H - 12);
  }
}

function showMsg(txt) { G.msg = txt; G.msgTimer = 90; }

// ─── EGGS ─────────────────────────────────────────────────────────────────────
function drawEggs() {
  for (const e of G.eggs) {
    if (e.collected) continue;
    const ex = e.wx - G.camera.x;
    ctx.fillStyle = '#fffbe8';
    ctx.strokeStyle = '#c8a85a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, e.wy, e.r*0.7, e.r, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // Speckles
    ctx.fillStyle = '#c8a85a66';
    ctx.beginPath(); ctx.arc(ex-3, e.wy-3, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+2, e.wy+2, 2, 0, Math.PI*2); ctx.fill();
  }
}

function checkEggs(bird) {
  for (const e of G.eggs) {
    if (e.collected) continue;
    if (dist(bird.x, bird.y, e.wx - G.camera.x, e.wy) < bird.r + e.r) {
      e.collected = true;
      G.score += 500;
      spawnParticles(e.wx - G.camera.x, e.wy, '#ffe94a', 12, 4);
      showMsg("rescued an egg!");
    }
  }
}

// ─── TITLE SCREEN ─────────────────────────────────────────────────────────────
function drawTitle() {
  const W = G.W, H = G.H;

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a1a0a'); grad.addColorStop(1,'#1a3a1a');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = (i*137)%W, sy = (i*93)%H*0.6;
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(G.ticks*0.05+i)*0.3})`;
    ctx.beginPath(); ctx.arc(sx,sy,0.8,0,Math.PI*2); ctx.fill();
  }

  // Island silhouette
  ctx.fillStyle = '#1e3d12';
  ctx.beginPath(); ctx.moveTo(0, H*0.75); ctx.quadraticCurveTo(W*0.3, H*0.55, W*0.5, H*0.7);
  ctx.quadraticCurveTo(W*0.7, H*0.55, W, H*0.72); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();

  // Trees
  for (let i = 0; i < 8; i++) {
    const tx = W*0.1 + i*(W*0.11), ty = H*0.58 - (i%3)*20;
